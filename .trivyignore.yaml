# Uitzonderingen op de container-gate in .github/workflows/security.yml.
#
# Een regel hier zet een oplosbare HIGH of CRITICAL stil. Dat mag alleen met een reden
# (statement) en een vervaldatum (expired_at): zo blijft de afweging vastgelegd zoals BIO2
# 8.08.02 vraagt, en komt de bevinding vanzelf terug in plaats van stil te verdwijnen.
# tests/test_trivyignore.py weigert een regel zonder die twee, en een vervaldatum die verder
# dan 90 dagen vooruit ligt. Hoe je er een toevoegt: features/security-scanning-pipeline.md.
#
# De twintig OS-pakketregels hebben een purls-scope op pakketnaam, zonder versie. Zonder die
# scope onderdrukt Trivy op CVE-id alleen, en zou een uitzondering namens de base-image van
# iemand anders dezelfde CVE stil zetten in de apt-laag van operations-manager en rig-backup,
# waar hij juist wel op te lossen is. De twee regels voor argocd-rig noemen daarbij ook de
# distro-release: cmp-kustomize-sops staat op argocd:v2.14.21, dus Ubuntu, en een scope op
# naam alleen zou een uitzondering voor argocd-rig (ubuntu-26.04) ook in die eigen apt-laag
# (ubuntu-24.04) stil zetten. De Go- en Java-regels hebben geen scope nodig: die pakketten
# liggen in een binary van een ander en komen niet in onze eigen lagen terug.
#
# De vier pypi-regels horen bij een derde groep: ze zitten in de vendor-map van pip in de
# python-slim base, niet in onze eigen lock. Een scope helpt daar niet, want een purl op
# naamniveau onderscheidt die kopie niet van dezelfde naam in onze eigen boom. Wat die
# regressie wel tegenhoudt is pip-audit --strict in dezelfde workflow: dat scant de lock en
# gebruikt deze lijst niet.
#
# De secrets-regel onderaan staat los van de vulnerabilities: de snakeoil-testsleutel die
# het Debian-pakket ssl-cert in de postgresql-base achterlaat. Die is op pad gescoped en niet
# op id alleen, zodat de secret-scanner in de gate blijft meetellen voor elk ander bestand en
# voor de vijf andere images. Gemeten: dit is de enige secret-bevinding in de zes images.
#
# Deze lijst is herbeoordeeld op 30 oktober 2026 met Trivy 0.76.0, de versie die de gate zelf
# pint (TRIVY_SCANNER_VERSION in security.yml), op de zes gescande images: vier als gebouwde
# image van main, keycloak-zad als gepubliceerde image 2026.10.30.1552-ce33c478 en argocd-rig
# op de gepinde productie-image v3.5.1-rig2. Regels waarvan de bevinding in geen van de zes
# meer voorkomt zijn vervallen. De vervaldata staan per groep gespreid (argocd-rig, mc en
# kopia, secret, pip, argocd-base, keycloak-base), zodat de herbeoordeling niet in een keer
# op een dag valt. Elke regel noemt in
# welke image de bevinding zit en waarom een patch- of minor-bump hem niet wegneemt: bijna
# alles is een Go-stdlib of een vendored dependency in een binary van een ander, of een
# Java-dependency in de Keycloak-base.
#
# De namen in "via": mc, kopia, sops en chisel zijn de binaries die operations-manager en
# rig-backup meenemen; cmp-tools zijn de tools in cmp-kustomize-sops; argocd-base is de
# ArgoCD-image waarop die image staat; keycloak-base is de Keycloak-image onder keycloak-zad;
# argocd-rig is de gepinde productie-image van ArgoCD.
#
# Voor mc komt geen upstream-fix: MinIO is gearchiveerd en distribueert niets meer, wij
# spiegelen alleen een release. Zie images/mc/README.md, docs/KNOWN-ISSUES.md en
# RijksICTGilde/RIG-Cluster#185.

