name: Image sign
description: Tekent een gepushte image keyless en hangt er een build-provenance-attestatie aan.

# Keyless via OIDC: geen sleutel om te bewaren of te roteren, de identiteit van de workflow
# staat in het certificaat. Verifieren: zie SECURITY.md.
# Op de digest en niet op een tag: een tag kan naar een ander image gaan wijzen.

inputs:
  image:
    description: Naam van de image zonder tag, bijvoorbeeld ghcr.io/org/naam.
    required: true
  digest:
    description: De digest die gepusht is, met sha256-voorvoegsel.
    required: true

runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Teken de digest
      shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
      run: cosign sign --yes "$REF"

    - name: Attesteer de build-provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
