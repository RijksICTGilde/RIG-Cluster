name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'  # Maandag 6:00 UTC, gelijk met security.yml
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options: [debug, info]

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Een eigen token, geen GITHUB_TOKEN: PR's van GITHUB_TOKEN starten geen workflows,
      # waardoor ci.yml niet op de Renovate-PR's zou draaien.
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: RijksICTGilde/RIG-Cluster
          RENOVATE_PLATFORM: github
          # Het enige commando dat postUpgradeTasks mag draaien. Het schrijft de sha256-sommen
          # bij een opgehoogde versie mee, want anders faalt de bouw op `sha256sum -c`.
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/renovate_checksums\\.py$"]'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
