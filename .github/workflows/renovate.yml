name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'  # Maandag 6:00 UTC, gelijk met security.yml
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        type: choice
        default: info
        options: [debug, info]

permissions:
  contents: read

# De runner staat op egress-policy: block, dus alles buiten deze lijst wordt tegengehouden
# en als annotatie gemeld. Komt er een stap bij die iets anders ophaalt, dan staat het
# endpoint in die annotatie en hoort het hier. Zie SECURITY.md.
# Tijdelijk op audit: in block weigert harden-runner ook toegestane domeinen
# (step-security/harden-runner#708). Terug naar block zodra dat is opgelost.
env:
  HARDEN_ENDPOINTS: |
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    agent.api.stepsecurity.io:443
    api.adoptium.net:443
    api.github.com:443
    astral.sh:443
    auth.docker.io:443
    cdn01.quay.io:443
    cdn02.quay.io:443
    cdn03.quay.io:443
    codeload.github.com:443
    files.pythonhosted.org:443
    ghcr.io:443
    github.com:443
    index.docker.io:443
    mirror.gcr.io:443
    objects.githubusercontent.com:443
    pkg-containers.githubusercontent.com:443
    production.cloudflare.docker.com:443
    proxy.golang.org:443
    pypi.org:443
    quay.io:443
    raw.githubusercontent.com:443
    registry-1.docker.io:443
    registry.k8s.io:443
    registry.npmjs.org:443
    release-assets.githubusercontent.com:443
    repo.maven.apache.org:443
    repo1.maven.org:443
    results-receiver.actions.githubusercontent.com:443
    sum.golang.org:443

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Een eigen token, geen GITHUB_TOKEN: PR's van GITHUB_TOKEN starten geen workflows,
      # waardoor ci.yml niet op de Renovate-PR's zou draaien.
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: RijksICTGilde/RIG-Cluster
          RENOVATE_PLATFORM: github
          # Het enige commando dat postUpgradeTasks mag draaien. Het schrijft de sha256-sommen
          # bij een opgehoogde versie mee, want anders faalt de bouw op `sha256sum -c`.
          RENOVATE_ALLOWED_COMMANDS: '["^python3 scripts/renovate_checksums\\.py$"]'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
