---
# Integration Tests CI Workflow
#
# This workflow runs on every push and pull request to main branch.
# It includes:
# - Unit tests (fast, every PR)
# - Integration tests with mocks (fast, every PR)
# - Integration tests with Kind cluster (thorough, every PR)
#
# Test hierarchy:
# 1. Unit tests - fastest, no infrastructure
# 2. Mock integration tests - fast, mocked external services
# 3. Kind cluster tests - slower, real kubectl operations

name: Integration Tests

on:
  push:
    branches: [main]
    paths:
      - 'operations-manager/**'
      - '.github/workflows/integration-tests.yaml'
      - 'docker-compose.dev.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'operations-manager/**'
      - '.github/workflows/integration-tests.yaml'
      - 'docker-compose.dev.yaml'

permissions:
  contents: read

# De runner staat op egress-policy: block, dus alles buiten deze lijst wordt tegengehouden
# en als annotatie gemeld. Komt er een stap bij die iets anders ophaalt, dan staat het
# endpoint in die annotatie en hoort het hier. Zie SECURITY.md.
env:
  HARDEN_ENDPOINTS: |
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    agent.api.stepsecurity.io:443
    api.github.com:443
    astral.sh:443
    auth.docker.io:443
    cdn.dl.k8s.io:443
    cdn01.quay.io:443
    cdn02.quay.io:443
    cdn03.quay.io:443
    codeload.github.com:443
    dl.k8s.io:443
    files.pythonhosted.org:443
    ghcr.io:443
    github.com:443
    index.docker.io:443
    mirror.gcr.io:443
    objects.githubusercontent.com:443
    pkg-containers.githubusercontent.com:443
    production.cloudflare.docker.com:443
    pypi.org:443
    quay.io:443
    raw.githubusercontent.com:443
    registry-1.docker.io:443
    registry.k8s.io:443
    release-assets.githubusercontent.com:443
    results-receiver.actions.githubusercontent.com:443

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: operations-manager/python
        run: uv sync --all-groups

      - name: Run ruff linter
        working-directory: operations-manager/python
        run: uv run ruff check opi/ tests/

      # Dezelfde scope als het commando dat CLAUDE.md voorschrijft (`uv run ruff format .`).
      # Was eerder beperkt tot tests/integration/ omdat er elders nog ongeformatteerde code
      # stond; die schuld was uiteindelijk een enkel bestand en is opgeruimd. Een smallere
      # scope hier dan wat een ontwikkelaar draait levert een bestand op dat eindeloos heen
      # en weer geformatteerd en teruggedraaid wordt, want geen enkele poort houdt hem tegen.
      - name: Run ruff formatter check
        working-directory: operations-manager/python
        run: uv run ruff format --check .

      - name: Run pyright type checker
        working-directory: operations-manager/python
        run: uv run pyright

  # NOTE: deze workflow draait de unit tests in tests/*.py niet. Dat stond hier omdat ze
  # afhingen van jinja-roos-components-templates; die afhankelijkheid is met RC-67
  # verdwenen, dus de reden geldt niet meer. Ze aanzetten is een eigen wijziging aan deze
  # workflow (looptijd, markers, browsers voor e2e) en hoort niet bij die opruiming.

  integration-tests-mock:
    name: Integration Tests (Mock)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: operations-manager/python
        run: uv sync --all-groups

      - name: Start PostgreSQL
        run: |
          docker compose -f docker-compose.dev.yaml up -d postgres
          # Wait for postgres to be ready
          for i in {1..30}; do
            if docker compose -f docker-compose.dev.yaml exec -T postgres pg_isready -U opi -d opi; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run mock-based integration tests
        working-directory: operations-manager/python
        env:
          DATABASE_URL: postgresql://opi:devpassword@localhost:5432/opi
        run: uv run pytest tests/integration/ -v -m "not slow" --tb=short

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.dev.yaml down

  integration-tests-kind:
    name: Integration Tests (Kind)
    runs-on: ubuntu-latest
    needs: integration-tests-mock
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'

      - name: Install dependencies
        working-directory: operations-manager/python
        run: uv sync --all-groups

      - name: Install Kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Create Kind cluster
        run: |
          kind create cluster \
            --name rig-integration-test \
            --config operations-manager/python/tests/fixtures/kind-config.yaml \
            --wait 120s

      - name: Deploy test workloads
        run: |
          kubectl apply -f operations-manager/python/tests/fixtures/test-workloads.yaml
          # Wait for deployment
          kubectl wait --for=condition=available \
            deployment/log-generator \
            -n test-project \
            --timeout=120s

      - name: Run Kind cluster integration tests
        working-directory: operations-manager/python
        run: uv run pytest tests/integration/ -v -m "slow" --tb=short

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          echo "=== Cluster Info ==="
          kubectl cluster-info
          echo ""
          echo "=== Nodes ==="
          kubectl get nodes -o wide
          echo ""
          echo "=== Pods in test-project ==="
          kubectl get pods -n test-project -o wide
          echo ""
          echo "=== Events in test-project ==="
          kubectl get events -n test-project --sort-by='.lastTimestamp'
          echo ""
          echo "=== Log generator logs ==="
          kubectl logs -n test-project deployment/log-generator --tail=50 || true

      - name: Delete Kind cluster
        if: always()
        run: kind delete cluster --name rig-integration-test

  # Summary job that depends on all tests
  tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - integration-tests-mock
      - integration-tests-kind
    if: always()
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests-mock.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests-kind.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All tests passed!"
