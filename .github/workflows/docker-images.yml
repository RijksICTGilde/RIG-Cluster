name: Docker - Supporting Images

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: true
        type: choice
        options:
          - rig-backup
          - cmp-kustomize-sops
          - postgresql-with-dictionaries
          - keycloak-zad
          - all
  # Laag A van de patchstrategie (SECURITY.md): een nachtelijke herbouw zonder laagcache
  # haalt verse OS-pakketten op zonder dat iemand iets hoeft te mergen, en publiceert op
  # een nightly-tag. Een uur na docker.yml, zodat de twee niet om dezelfde runners vechten.
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # De runner staat op egress-policy: block, dus alles buiten deze lijst wordt tegengehouden
  # en als annotatie gemeld. Komt er een stap bij die iets anders ophaalt, dan staat het
  # endpoint in die annotatie en hoort het hier. Zie SECURITY.md.
  # Tijdelijk op audit: in block weigert harden-runner ook toegestane domeinen
  # (step-security/harden-runner#708). Terug naar block zodra dat is opgelost.
  HARDEN_ENDPOINTS: |
    *.actions.githubusercontent.com:443
    *.blob.core.windows.net:443
    agent.api.stepsecurity.io:443
    api.adoptium.net:443
    api.github.com:443
    archive.ubuntu.com:80
    astral.sh:443
    auth.docker.io:443
    azure.archive.ubuntu.com:80
    cdn01.quay.io:443
    cdn02.quay.io:443
    cdn03.quay.io:443
    codeload.github.com:443
    deb.debian.org:443
    deb.debian.org:80
    esm.ubuntu.com:443
    files.pythonhosted.org:443
    fulcio.sigstore.dev:443
    ghcr.io:443
    github.com:443
    index.docker.io:443
    mirror.gcr.io:443
    motd.ubuntu.com:443
    objects.githubusercontent.com:443
    pkg-containers.githubusercontent.com:443
    pkgs.k8s.io:443
    production.cloudflare.docker.com:443
    pypi.org:443
    quay.io:443
    raw.githubusercontent.com:443
    registry-1.docker.io:443
    registry.k8s.io:443
    rekor.sigstore.dev:443
    timestamp.sigstore.dev:443
    release-assets.githubusercontent.com:443
    repo.maven.apache.org:443
    repo1.maven.org:443
    results-receiver.actions.githubusercontent.com:443
    security.debian.org:80
    security.ubuntu.com:80
    tuf-repo-cdn.sigstore.dev:443

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      calver_tag: ${{ steps.calver.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calculate CalVer tag
        id: calver
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            echo "tag=nightly-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX="$(date -u +%Y.%-m)"
          PATCH=$(git tag -l "${PREFIX}.*" | sed "s/${PREFIX}\.//" | sort -n | tail -1)
          NEXT_PATCH=$(( ${PATCH:-0} + 1 ))
          TAG="${PREFIX}.${NEXT_PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CalVer tag: ${TAG}"

  rig-backup:
    needs: prepare
    if: inputs.image == 'rig-backup' || inputs.image == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless tekenen en de provenance-attestatie halen hun OIDC-token hier.
      id-token: write
      attestations: write
    env:
      # Deze naam wordt niet gepind: wat er draait komt van
      # ghcr.io/minbzk/base-images/rig-backup, waar `task publish-*` naartoe
      # pusht. GITHUB_TOKEN mag alleen in de eigen org pushen, dus deze job kan die naam
      # niet overnemen. Zie features/image-versioning-calver.md.
      IMAGE_NAME: ghcr.io/rijksictgilde/zad/rig-backup
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De poort staat VOOR de push: oplosbare HIGH of CRITICAL en misconfiguratie in de
      # Dockerfile houden de publicatie tegen.
      - name: Poort voor de push
        uses: ./.github/actions/image-gate
        with:
          name: rig-backup
          context: operations-manager/backup-image
          file: operations-manager/backup-image/Dockerfile
          cache-scope: rig-backup
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: operations-manager/backup-image
          file: operations-manager/backup-image/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.calver_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: mode=max
          sbom: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=rig-backup
          cache-to: type=gha,scope=rig-backup,mode=max

      - name: Teken en attesteer
        uses: ./.github/actions/image-sign
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}

  cmp-kustomize-sops:
    needs: prepare
    if: inputs.image == 'cmp-kustomize-sops' || inputs.image == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless tekenen en de provenance-attestatie halen hun OIDC-token hier.
      id-token: write
      attestations: write
    env:
      # Deze naam wordt niet gepind: wat er draait komt van
      # ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops, waar `task publish-*` naartoe
      # pusht. GITHUB_TOKEN mag alleen in de eigen org pushen, dus deze job kan die naam
      # niet overnemen. Zie features/image-versioning-calver.md.
      IMAGE_NAME: ghcr.io/rijksictgilde/zad/rig-cmp-argo-kustomize-sops
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De poort staat VOOR de push: oplosbare HIGH of CRITICAL en misconfiguratie in de
      # Dockerfile houden de publicatie tegen.
      - name: Poort voor de push
        uses: ./.github/actions/image-gate
        with:
          name: cmp-kustomize-sops
          context: .
          file: images/cmp-kustomize-sops/Dockerfile
          cache-scope: cmp-kustomize-sops
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: images/cmp-kustomize-sops/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.calver_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: mode=max
          sbom: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=cmp-kustomize-sops
          cache-to: type=gha,scope=cmp-kustomize-sops,mode=max

      - name: Teken en attesteer
        uses: ./.github/actions/image-sign
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}

  postgresql-with-dictionaries:
    needs: prepare
    if: inputs.image == 'postgresql-with-dictionaries' || inputs.image == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless tekenen en de provenance-attestatie halen hun OIDC-token hier.
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/rijksictgilde/zad/postgresql-with-dictionaries
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De poort staat VOOR de push: oplosbare HIGH of CRITICAL en misconfiguratie in de
      # Dockerfile houden de publicatie tegen.
      - name: Poort voor de push
        uses: ./.github/actions/image-gate
        with:
          name: postgresql-with-dictionaries
          context: images/postgresql-with-dictionaries
          file: images/postgresql-with-dictionaries/Dockerfile
          cache-scope: postgresql
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: images/postgresql-with-dictionaries
          file: images/postgresql-with-dictionaries/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.calver_tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          provenance: mode=max
          sbom: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=postgresql
          cache-to: type=gha,scope=postgresql,mode=max

      - name: Teken en attesteer
        uses: ./.github/actions/image-sign
        with:
          image: ${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}

  keycloak-zad:
    needs: prepare
    if: inputs.image == 'keycloak-zad' || inputs.image == 'all' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless tekenen en de provenance-attestatie halen hun OIDC-token hier.
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/rijksictgilde/zad/keycloak-zad
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
          allowed-endpoints: ${{ env.HARDEN_ENDPOINTS }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # De poort staat VOOR de push: oplosbare HIGH of CRITICAL en misconfiguratie in de
      # Dockerfile houden de publicatie tegen.
      - name: Poort voor de push
        uses: ./.github/actions/image-gate
        with:
          name: keycloak-zad
          context: .
          file: images/keycloak-zad/Dockerfile
          cache-scope: keycloak-zad
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
