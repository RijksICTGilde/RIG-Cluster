name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: operations-manager/python
        run: uv sync --frozen
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operations-manager/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run tests with coverage
        run: uv run coverage run
      - name: Coverage report
        run: uv run coverage report

  license-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operations-manager/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: License check
        run: uv run liccheck
