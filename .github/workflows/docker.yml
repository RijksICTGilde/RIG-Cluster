name: Docker - Operations Manager

on:
  push:
    branches: [main]
    paths:
      - 'operations-manager/Dockerfile'
      - 'operations-manager/python/**'
  pull_request:
    paths:
      - 'operations-manager/Dockerfile'
      - 'operations-manager/python/**'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/rijksictgilde/zad/operations-manager

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      calver_tag: ${{ steps.calver.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # needed for CalVer tag calculation

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate CalVer tag
        id: calver
        if: github.ref == 'refs/heads/main'
        run: |
          PREFIX="$(date -u +%Y.%-m)"
          PATCH=$(git tag -l "${PREFIX}.*" | sed "s/${PREFIX}\.//" | sort -n | tail -1)
          NEXT_PATCH=$(( ${PATCH:-0} + 1 ))
          TAG="${PREFIX}.${NEXT_PATCH}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "CalVer tag: ${TAG}"

      - name: Generate image tags
        id: tags
        run: |
          TAGS="${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"

          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:${{ steps.calver.outputs.tag }}"
            TAGS="${TAGS},${{ env.IMAGE_NAME }}:latest"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Generated tags: ${TAGS}"

      # Zonder push kan multi-arch niet: single-platform build voor PR's.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: operations-manager/Dockerfile
          target: application
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Een eigen job, omdat alleen het zetten van de git-tag contents: write nodig heeft.
  tag:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Create CalVer git tag
        env:
          CALVER_TAG: ${{ needs.build.outputs.calver_tag }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "${CALVER_TAG}"
          git push origin "${CALVER_TAG}"
