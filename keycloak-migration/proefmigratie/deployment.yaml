# De nieuwe Keycloak op de KOPIE. Hij draait zijn schemamigratie, en de telling voor en na
# zegt of er data verloren ging.
#
# Niets hiervan is bereikbaar van buiten het cluster: geen Ingress, geen Route, en de
# Service is ClusterIP. De inlogcontrole van de task loopt via een port-forward.
#
# De args staan hier UITGESCHREVEN en gelijk aan de basisdeployment, zodat
# test_keycloak_proefmigratie.py ze kan vergelijken. Wijkt de basis af, dan faalt die toets
# en meet de proef niet meer wat productie straks start.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-proef
  labels:
    rig.nl/proefmigratie: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-proef
  template:
    metadata:
      labels:
        app: keycloak-proef
        rig.nl/proefmigratie: keycloak
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # De task vult de image in die gemeten wordt, voor de apply. Hier staat een woord
          # en geen tag, de vorm van base/deployment.yaml: een apply zonder de task faalt
          # dan op de pull, in plaats van een oude versie tegen de kopie te starten.
          image: ghcr.io/rijksictgilde/zad/keycloak-zad:promoveer-eerst
          args:
            ["start", "--optimized", "--spi-theme-welcome-theme=nl-design-system", "--spi-email-sender-provider=zad-relay" ]
          env:
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_DB_URL
              value: "jdbc:postgresql://keycloak-proef-rw:5432/keycloak?sslmode=require"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-proef-app
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-proef-app
                  key: password
            # Een adres dat niet bestaat: de proef mag geen post versturen. De overige
            # ZAD_MAIL_RELAY-variabelen staan er met opzet niet; de provider meldt dan
            # "geen bruikbare relayconfiguratie" en gooit pas bij een echte verzending.
            - name: ZAD_MAIL_RELAY_HOST
              value: "mail-relay.proefmigratie.invalid"
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
            requests:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
            # De schemamigratie loopt voor de eerste readiness; op een productieachtige
            # database duurt dat langer dan de standaardmarge.
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp-volume
              mountPath: /opt/keycloak/data/tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-proef
  labels:
    rig.nl/proefmigratie: keycloak
spec:
  type: ClusterIP
  selector:
    app: keycloak-proef
  ports:
    - name: http
      port: 8080
      targetPort: 8080
