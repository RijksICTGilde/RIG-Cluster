# Een KOPIE van de database keycloak, binnen het cluster. CNPG dumpt van pod naar pod, dus
# de data verlaat het cluster niet en staat nooit op een laptop of in CI.
#
# Geen namespace en geen ArgoCD-annotatie: `task keycloak-proefmigratie` past dit toe in de
# namespace van rig-db en haalt het daarna weg. Deze resources mogen niet blijven staan.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-proef
  labels:
    rig.nl/proefmigratie: keycloak
spec:
  instances: 1
  # De Kyverno-regel pdb-cnpg-cluster-validation eist dit onder twee instances: een PDB over
  # een enkele pod blokkeert een node-drain. Zie features/platformdatabase-een-instance.md.
  enablePDB: false
  # Hetzelfde beeld als de base van rig-db. Op ODCN herschrijft admission dit pad naar de
  # rcr-proxy, en dan vervangt CNPG zijn eigen pod in een lus; de task zet er daarom met
  # PG_IMAGE het rcr-pad in. Zie de summary van keycloak-proefmigratie.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11

  # Het label op elke pod en elke PVC van de proef, zodat het opruimen van de task niets
  # kan missen.
  inheritedMetadata:
    labels:
      rig.nl/proefmigratie: keycloak

  # De storageClass staat er uitgeschreven in plaats van op een default te leunen, net als
  # in de base van rig-db; op ODCN zet de task er STORAGE_CLASS=ocs-storagecluster-ceph-rbd in.
  # 2Gi is ruim voor deze ene database: alle platformdatabases samen zijn op productie 1113 MB
  # en rig-db draait daar op 20Gi. Verschuift dat, dan gaat STORAGE_SIZE mee.
  storage:
    size: 2Gi
    storageClass: standard

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
      import:
        type: microservice
        databases:
          - keycloak
        source:
          externalCluster: rig-db

  # De EIGEN rol van Keycloak leest de dump: dezelfde rechten als de pod die deze data
  # schrijft, dus de proef kan niets lezen wat Keycloak zelf niet mag.
  externalClusters:
    - name: rig-db
      connectionParameters:
        host: rig-db-rw
        user: keycloak
        dbname: keycloak
        sslmode: require
      password:
        name: keycloak-db-credentials
        key: password
