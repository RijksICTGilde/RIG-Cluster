---
# Docker Compose for local development and integration testing
#
# This configuration provides:
# - PostgreSQL database for local development
# - Operations Manager service with hot-reload
#
# Usage:
#   Start all services:     docker compose -f docker-compose.dev.yaml up -d
#   Start postgres only:    docker compose -f docker-compose.dev.yaml up -d postgres
#   View logs:              docker compose -f docker-compose.dev.yaml logs -f
#   Stop services:          docker compose -f docker-compose.dev.yaml down
#   Reset (remove data):    docker compose -f docker-compose.dev.yaml down -v
#
# Eenmalig na de wissel naar de CNPG-image: een postgres_data van voor die wissel hangt
# op /var/lib/postgresql/data en is van uid 70, dus de opstart kan er geen PGDATA naast
# maken ("Permission denied"). Draai dan eerst "down -v".

services:
  postgres:
    # De image die het platform pint, en daarom met de opstart die CNPG doet: deze image
    # heeft geen ENTRYPOINT. Zie scripts/postgres-standalone-start.sh.
    image: ghcr.io/cloudnative-pg/postgresql:17.11
    command: ["bash", "/zad/postgres-standalone-start.sh"]
    container_name: opi-postgres-dev
    environment:
      POSTGRES_DB: opi
      POSTGRES_USER: opi
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/postgres-standalone-start.sh:/zad/postgres-standalone-start.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opi -d opi -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - opi-dev

  operations-manager:
    build:
      context: .
      dockerfile: operations-manager/Dockerfile
      target: application
    container_name: opi-manager-dev
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Application settings
      - ENVIRONMENT=local
      - DEBUG=true
      - DEBUG_MODE=reload

      # Database connection. OPI leest deze zes settings.
      - DATABASE_HOST=postgres
      - DATABASE_NAME=opi
      - DATABASE_ADMIN_NAME=opi
      - DATABASE_ADMIN_PASSWORD=devpassword
      # Alleen lokaal: de app-rol IS hier de admin-gebruiker. In een cluster komt deze rol
      # uit het secret operations-manager-db-credentials en is hij geen superuser; de
      # opstartcontrole in opi/core/database_pools.py waarschuwt hier en weigert daar.
      - DATABASE_APP_USER=opi
      - DATABASE_APP_PASSWORD=devpassword
      # Deze compose-Postgres heeft geen TLS; in clusters doet CNPG dat met zijn interne CA.
      - DATABASE_SSLMODE=disable

      # Authentication (disabled for local dev)
      - OIDC_DISABLED=true

      # Git monitoring (disabled for local dev)
      - ENABLE_GIT_MONITOR=false

      # Cluster settings (for development)
      - CLUSTER_MANAGER=local

      # Secret key for sessions
      - SECRET_KEY=dev-secret-key-not-for-production
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source code as read-only
      - ./operations-manager/python/opi:/app/opi:ro
      - ./manifests:/app/manifests:ro
    networks:
      - opi-dev
    profiles:
      - full

volumes:
  postgres_data:
    name: opi-postgres-dev-data

networks:
  opi-dev:
    name: opi-dev-network
