apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
- ../../configmap-sops-plugin.yaml
- serviceaccount-cmp.yaml

patches:
- target:
    kind: ArgoCD
  patch: |-
    - op: replace
      path: /spec/repo
      value:
        # Eigen SA voor het renderproces; rechten staan in de Roles die OPI per
        # projectnamespace naast het sleutel-Secret zet.
        serviceaccount: argocd-cmp
        volumes:
          - name: cmp-plugin
            configMap:
              name: cmp-plugin
              items:
                - key: plugin.yaml
                  path: plugin.yaml
                - key: render.sh
                  path: render.sh
          - name: cmp-plugin-platform
            configMap:
              name: cmp-plugin
              items:
                - key: plugin-platform.yaml
                  path: plugin.yaml
                - key: render.sh
                  path: render.sh
          - name: cmp-tmp
            emptyDir: {}
          - name: cmp-platform-tmp
            emptyDir: {}
          # De platformsleutel, optioneel, zodat tenant-apps renderen zonder hem.
          - name: sops-age-key
            secret:
              secretName: sops-age-key
              optional: true
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
        sidecarContainers:
          # Tenant-apps: de sleutel komt uit het Secret in de bestemmingsnamespace, dus
          # deze sidecar heeft het SA-token nodig en de gemounte platformsleutel niet.
          - name: cmp-server
            # Op digest en niet op een tag: deze container leest bij het renderen de
            # SOPS-sleutel, en een tag in de registry is te overschrijven. Ophogen met
            # `task pin-cmp-image`.
            image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:2026.11.02.2053-7128fb61@sha256:d2b684cba5bc35f6967466e2a27338d37524ba20328bd4d81d69adcb09194374
            imagePullPolicy: IfNotPresent
            command: ["/var/run/argocd/argocd-cmp-server"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
              - name: var-files
                mountPath: /var/run/argocd
              - name: plugins
                mountPath: /home/argocd/cmp-server/plugins
              - name: cmp-plugin
                mountPath: /home/argocd/cmp-server/config
              - name: cmp-tmp
                mountPath: /tmp
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
          # Platform-apps: sleutel uit mount, geen SA-token. Elk Secret uit SOPS_KEY_SECRET
          # moet hier onder /sops/ staan.
          - name: cmp-platform
            # Op digest om dezelfde reden als cmp-server hierboven, en met meer gewicht:
            # deze sidecar heeft de platformsleutel gemount. Ophogen met `task pin-cmp-image`.
            image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:2026.11.02.2053-7128fb61@sha256:d2b684cba5bc35f6967466e2a27338d37524ba20328bd4d81d69adcb09194374
            imagePullPolicy: IfNotPresent
            command: ["/var/run/argocd/argocd-cmp-server"]
            securityContext:
              runAsNonRoot: true
              runAsUser: 999
            volumeMounts:
              - name: var-files
                mountPath: /var/run/argocd
              - name: plugins
                mountPath: /home/argocd/cmp-server/plugins
              - name: cmp-plugin-platform
                mountPath: /home/argocd/cmp-server/config
              - name: cmp-platform-tmp
                mountPath: /tmp
              - name: sops-age-key
                mountPath: /sops/sops-age-key
                readOnly: true
