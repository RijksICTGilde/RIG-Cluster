# De CMP-inrichting die elk ODCN-cluster deelt, boven op de component sops-plugin.
# Alleen het UID uit het SCC-bereik verschilt per cluster: dat blijft een patch in de
# overlay. Tot RC-359 stond dit blok per cluster in de overlay, en toen odcn-staging
# erbij kwam kreeg het een oudere kopie: een overschrijfbare tag in plaats van de
# digest uit de rcr-spiegel, ook in de sidecar die de platformsleutel mount.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

components:
- ../sops-plugin

patches:
  # De eigen SA van de repo-server heeft hetzelfde pull-secret nodig als de SA's die de
  # operator aanmaakt (zie argocd-pull-secrets.yaml): spec.image komt uit rcr.rijksapps.nl
  # en die proxy vraagt een inlog, anders komt de repo-server in ImagePullBackOff.
  - target:
      kind: ServiceAccount
      name: argocd-cmp
    patch: |-
      - op: add
        path: /imagePullSecrets
        value:
          - name: ghcr-rig-robot-pull-secret
  # Set ARGOCD_EXEC_TIMEOUT on repo-server to allow longer manifest generation
  # NB: this patch REPLACES spec.repo.env wholesale: repo-server env vars
  # must be added HERE, not in argocd-deployment.yaml (the patch wins).
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: add
        path: /spec/repo/env
        value:
        - name: ARGOCD_EXEC_TIMEOUT
          value: "180s"
        - name: ARGOCD_GIT_ATTEMPTS_COUNT
          value: "3"
        - name: ARGOCD_HELM_ALLOW_CONCURRENCY
          value: "true"
        # Stream only the app's manifest-generate-paths dir to the CMP
        # instead of tarring the entire zad-deployments monorepo per render
        # (measured 2026-06-11: ~27s of a 28.5s GenerateManifest was repo
        # streaming; the kustomize+sops render itself is ~1s).
        - name: ARGOCD_REPO_SERVER_PLUGIN_USE_MANIFEST_GENERATE_PATHS
          value: "true"
  # Deze patch is de sidecar die op ODCN draait: de sops-plugin component zet hem neer, en
  # wat hier staat overschrijft dat. Via de rcr-spiegel, want ODCN kan ghcr niet bereiken;
  # het pad staat in git zodat de admission-herschrijving niets meer te doen heeft en
  # ArgoCD niet OutOfSync blijft. Ophogen met `task pin-cmp-image`.
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: replace
        path: /spec/repo/sidecarContainers/0/image
        value: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/rig-cmp-argo-kustomize-sops:2026.11.11.1505-ffaa43a0@sha256:389ddcf63966c88f958c5211490d14a28f2e044a22afca7b10a9c8199ef7796c
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: add
        path: /spec/repo/sidecarContainers/0/env
        value:
        - name: ARGOCD_EXEC_TIMEOUT
          value: "180s"
        - name: KUBERNETES_SERVICE_HOST
          value: cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
        - name: HELM_CONFIG_HOME
          value: /tmp/.helm/config
        - name: HELM_CACHE_HOME
          value: /tmp/.helm/cache
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      # Two CPUs: a cold helmfile render (mb-docs) took over two minutes on 500m and hit
      # ARGOCD_EXEC_TIMEOUT. odcn-staging sets one, its tenant quota has no room for two.
      - op: add
        path: /spec/repo/sidecarContainers/0/resources
        value:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
  # The sops-plugin component replaces /spec/repo wholesale, so the repo resources in
  # argocd-deployment.yaml never reach the cluster: this patch is the one that counts.
  # 2Gi because the repo-server was OOMKilled at 1Gi on a cold cache (13 October 2026);
  # 4Gi because it was OOMKilled again at 2Gi on production, at 211 apps (2 November 2026).
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: add
        path: /spec/repo/resources
        value:
          limits:
            cpu: "2"
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 256Mi
  # Scale repo-server to 2 replicas for better CMP throughput
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: add
        path: /spec/repo/replicas
        value: 2
  # Dezelfde OpenShift-specifieke instellingen voor de platform-sidecar als hierboven
  # voor cmp-server: hetzelfde image uit de registry die ODCN wel kan bereiken, en de
  # helm-paden onder /tmp. Deze sidecar heeft de platformsleutel gemount, dus de digest
  # telt hier dubbel. KUBERNETES_SERVICE_HOST hoort hier niet: deze sidecar praat niet
  # met de API-server. Ophogen met `task pin-cmp-image`.
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      - op: replace
        path: /spec/repo/sidecarContainers/1/image
        value: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/rig-cmp-argo-kustomize-sops:2026.11.11.1505-ffaa43a0@sha256:389ddcf63966c88f958c5211490d14a28f2e044a22afca7b10a9c8199ef7796c
      - op: add
        path: /spec/repo/sidecarContainers/1/env
        value:
        - name: ARGOCD_EXEC_TIMEOUT
          value: "180s"
        - name: HELM_CONFIG_HOME
          value: /tmp/.helm/config
        - name: HELM_CACHE_HOME
          value: /tmp/.helm/cache
      - op: add
        path: /spec/repo/sidecarContainers/1/resources
        value:
          limits:
            cpu: "2"
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
