apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# De ingress-stand van het portaal en ArgoCD op de sandbox. Leeg met opzet: de Ingress van
# het portaal staat in de operations-manager-overlay en ArgoCD maakt die van zichzelf via
# server.ingress in de CR.
#
# De component bestaat zodat de overlay in EEN regel zegt welke stand hij heeft, en zodat
# task sandbox:routing-apply en de consistentietest in
# operations-manager/python/tests/test_sandbox_routing_stand.py die regel kunnen lezen.

# Geen resources: zie hierboven.
resources: []
