apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: rig-system
spec:
  parentRefs:
    - name: rig-gateway
      namespace: rig-gateway
      sectionName: https
  hostnames:
    - argo.sandbox.rijksapp.dev
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      timeouts:
        request: "0s"
