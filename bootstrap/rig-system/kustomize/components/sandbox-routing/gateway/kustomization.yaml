apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# De gateway-stand van het portaal en ArgoCD op de sandbox.
resources:
- httproute-operations-manager.yaml
- httproute-argocd.yaml

patches:
# De Ingress van het portaal eruit; de HTTPRoute hierboven neemt hem over.
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: operations-manager
      namespace: rig-system
# De operator maakt de Ingress van ArgoCD zelf; die gaat uit. TLS eindigt daarna op de
# Gateway, dus argocd-server serveert plain HTTP: dat is wat de ArgoCD-documentatie voor
# de Gateway API aanraadt, en het scheelt een BackendTLSPolicy met een eigen CA.
- target:
    group: argoproj.io
    kind: ArgoCD
    name: argocd
  patch: |-
    - op: replace
      path: /spec/server/ingress/enabled
      value: false
    - op: replace
      path: /spec/server/insecure
      value: true
# OPI praat met argocd-server, en dat gaat in deze stand over plain HTTP: de env hieronder
# wint van de .env in de configmap, die op TLS staat voor de ingress-stand.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: operations-manager
      namespace: rig-system
    spec:
      template:
        spec:
          containers:
          - name: operations-manager
            env:
            - name: ARGOCD_PORT
              value: "80"
            - name: ARGOCD_USE_TLS
              value: "false"
            - name: ARGOCD_VERIFY_SSL
              value: "false"
