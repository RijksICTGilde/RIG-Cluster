apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
  namespace: rig-system
  labels:
    app: operations-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: operations-manager
  template:
    metadata:
      labels:
        app: operations-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: namespace-manager
      containers:
      - name: operations-manager
        image: operations-manager:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        # De probepoort. De health-checks draaien op een eigen draad in het proces
        # (opi/core/probe_server.py) en niet op de asyncio-eventloop, zodat ze antwoorden
        # ongeacht hoe druk de applicatie het heeft. Gemeten: de loop stond 8 seconden vast
        # en de probe antwoordde in 0,01 seconde.
        - containerPort: 8001
          name: probe
        startupProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: probe
          # Elke 30 seconden, en pas na drie missers uit de service. Stond op elke 10
          # seconden met failureThreshold 1, en daardoor haalde EEN trage meting de pod
          # meteen uit de endpoints: bij een replica betekent dat een 503 van nginx op elke
          # lopende aanroep, ook op aanroepen die niets met de drukte te maken hebben.
          # Zo snel gaan we niet stuk, en een echte storing wordt binnen anderhalve minuut
          # nog steeds gezien.
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "200m"
            memory: 256Mi
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        # Elke overlay levert een ConfigMap operations-manager-config met een .env erin,
        # en de app leest die van /etc/config. Dat koppelen stond in drie overlays los
        # herhaald, waardoor de vierde (fundament-poc) hem miste en de app stil terugviel
        # op de defaults in opi/core/config.py. Hier hoort hij, want geen enkel cluster
        # kan zonder.
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        env:
        # Who is answering /version. During a rolling update two pods serve the same
        # Service, so an answer without a pod name reads as version drift instead of
        # as "a rollout is running".
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TMPDIR
          value: "/tmp"
        - name: ENVIRONMENT
          value: "production"
        - name: KUBERNETES_SERVICE_HOST
          value: "kubernetes.default.svc"
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
        - name: SOPS_AGE_KEY_CONTENT
          valueFrom:
            secretKeyRef:
              name: sops-age-key
              key: key
        envFrom:
        - secretRef:
            name: operations-manager-env-secrets
        - secretRef:
            name: operations-manager-keycloak
            optional: true  # Optional to avoid bootstrap issues on first deployment
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: config-volume
        configMap:
          name: operations-manager-config
