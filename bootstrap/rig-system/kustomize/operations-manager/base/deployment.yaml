apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
  namespace: rig-system
  labels:
    app: operations-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: operations-manager
  template:
    metadata:
      labels:
        app: operations-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: namespace-manager
      containers:
      - name: operations-manager
        image: operations-manager:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "200m"
            memory: 256Mi
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        # Git SSH key for pushing to the GitOps repositories. Provided at
        # runtime from a Kubernetes Secret instead of being baked into the
        # image. Path matches GIT_SERVER_KEY_PATH / GIT_ARGO_APPLICATIONS_KEY
        # (/app/keys/git-server-key).
        - name: git-server-key
          mountPath: /app/keys
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        env:
        - name: TMPDIR
          value: "/tmp"
        - name: ENVIRONMENT
          value: "production"
        - name: KUBERNETES_SERVICE_HOST
          value: "kubernetes.default.svc"
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
        - name: SOPS_AGE_KEY_CONTENT
          valueFrom:
            secretKeyRef:
              name: sops-age-key
              key: key
        envFrom:
        - secretRef:
            name: operations-manager-env-secrets
        - secretRef:
            name: operations-manager-keycloak
            optional: true  # Optional to avoid bootstrap issues on first deployment
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      # Git SSH key Secret. Provisioned out-of-band by an operator (same
      # pattern as the sops-age-key Secret referenced above): the key
      # material is never committed to this repo and is NOT baked into the
      # image. Keys: "git-server-key" (private), "git-server-key.pub".
      #
      # optional: true is REQUIRED. None of the in-repo overlays (local,
      # sandboxed-local, odcn-production) push to the GitOps repos over SSH:
      # they all use HTTPS + a SOPS-encrypted PAT (GIT_ARGO_APPLICATIONS_URL
      # is https://, GIT_ARGO_APPLICATIONS_KEY is ""). The SSH key is only
      # consumed when a deployment is configured with a git://, ssh:// URL.
      # Without optional: true a non-existent Secret keeps the pod stuck in
      # ContainerCreating forever (MountVolume.SetUp failed: secret
      # "git-server-key" not found), breaking OPI in every environment even
      # though the key is unused. This mirrors the sops-age-key reference,
      # which is likewise optional: true.
      - name: git-server-key
        secret:
          secretName: git-server-key
          defaultMode: 0400
          optional: true
          items:
          - key: git-server-key
            path: git-server-key
          - key: git-server-key.pub
            path: git-server-key.pub
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
