apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
  namespace: rig-system
  labels:
    app: operations-manager
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: operations-manager
  template:
    metadata:
      labels:
        app: operations-manager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: namespace-manager
      # fsGroup: 1001 voor secret-mount; mode 0400 kan niet (kubelet beperking).
      securityContext:
        fsGroup: 1001
      containers:
      - name: operations-manager
        image: operations-manager:latest
        imagePullPolicy: Always
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8000
          name: http
        # De probepoort. De health-checks draaien op een eigen draad in het proces
        # (opi/core/probe_server.py) en niet op de asyncio-eventloop, zodat ze antwoorden
        # ongeacht hoe druk de applicatie het heeft. Gemeten: de loop stond 8 seconden vast
        # en de probe antwoordde in 0,01 seconde.
        - containerPort: 8001
          name: probe
        startupProbe:
          httpGet:
            path: /healthz
            port: probe
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /readyz
            port: probe
          # Elke 30 seconden, en pas na drie missers uit de service. Stond op elke 10
          # seconden met failureThreshold 1, en daardoor haalde EEN trage meting de pod
          # meteen uit de endpoints: bij een replica betekent dat een 503 van nginx op elke
          # lopende aanroep, ook op aanroepen die niets met de drukte te maken hebben.
          # Zo snel gaan we niet stuk, en een echte storing wordt binnen anderhalve minuut
          # nog steeds gezien.
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: "200m"
            memory: 256Mi
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        - name: sops-age-key
          mountPath: /var/run/secrets/zad/sops-age
          readOnly: true
        - name: project-kek
          mountPath: /var/run/secrets/zad/project-kek
          readOnly: true
        - name: secret-tmp
          mountPath: /var/run/zad/secret-tmp
        # CA van argocd-server. Per cluster anders (service-CA op ODCN, eigen CA op sandbox).
        - name: argocd-ca-bundle
          mountPath: /etc/ssl/argocd
          readOnly: true
        - name: git-signing-key
          mountPath: /etc/opi/git-signing
          readOnly: true
        env:
        # Who is answering /version. During a rolling update two pods serve the same
        # Service, so an answer without a pod name reads as version drift instead of
        # as "a rollout is running".
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: TMPDIR
          value: "/tmp"
        # Staat het secret er niet, dan is de mount leeg en commit OPI zonder handtekening.
        - name: GIT_SIGNING_KEY_FILE
          value: "/etc/opi/git-signing/signing-key.asc"
        - name: ENVIRONMENT
          value: "production"
        - name: KUBERNETES_SERVICE_HOST
          value: "kubernetes.default.svc"
        - name: KUBERNETES_SERVICE_PORT
          value: "443"
        # De platformsleutel komt als bestand binnen en niet meer als env: een
        # omgevingsvariabele staat in /proc/<pid>/environ van elk kindproces dat OPI start.
        - name: SOPS_AGE_KEY_FILE
          value: "/var/run/secrets/zad/sops-age/key"
        # De projectsleutels zitten onder een eigen sleutel die alleen hier staat, zodat de
        # platformsleutel geen enkel projectgeheim meer opent (RC-334).
        - name: PROJECT_KEK_FILE
          value: "/var/run/secrets/zad/project-kek/key"
        - name: SECRET_TEMP_DIR
          value: "/var/run/zad/secret-tmp"
        # Eén bron per wachtwoord: rechtstreeks uit het secret van de component zelf en niet uit een kopie die stil kan afwijken. Expliciete env wint van envFrom.
        - name: DATABASE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin-credentials
              key: password
        - name: MINIO_ADMIN_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-admin-credentials
              key: MINIO_ROOT_USER
        - name: MINIO_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-admin-credentials
              key: MINIO_ROOT_PASSWORD
        # SeaweedFS (seaweedfs-storage). Optioneel, want een cluster zonder de dienst heeft
        # dit secret niet en de pod moet daar gewoon starten. De JWT-sleutel is de
        # admin-Bearer op de IAM-gRPC van de filer, die `weed shell` zelf uit de omgeving
        # leest; zonder die sleutel neemt die gRPC elke aanroep aan (RC-331, rij I5). Het
        # sleutelpaar is de admin-identiteit op de S3-poort, voor de bucketkopie van een kloon.
        - name: WEED_JWT_FILER_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-credentials
              key: WEED_JWT_FILER_SIGNING_KEY
              optional: true
        - name: SEAWEEDFS_ADMIN_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-credentials
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: SEAWEEDFS_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: seaweedfs-credentials
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-admin-credentials
              key: REDIS_PASSWORD
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_PASSWORD
        # Het API-token van het ArgoCD-account `opi`, met een rol die precies de aanroepen
        # van OPI toestaat. Optioneel zodat een vers cluster start voordat
        # `scripts/edit-secret.py --component argocd-opi-token` het token heeft gezet;
        # zolang het ontbreekt weigert create_argo_connector met een duidelijke fout in
        # plaats van met het admin-account binnen te komen.
        - name: ARGOCD_TOKEN
          valueFrom:
            secretKeyRef:
              name: opi-argocd-token
              key: token
              optional: true
        envFrom:
        - secretRef:
            name: operations-manager-env-secrets
        - secretRef:
            name: operations-manager-keycloak
            optional: true  # Optional to avoid bootstrap issues on first deployment
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 500Mi
      - name: sops-age-key
        secret:
          secretName: sops-age-key
          defaultMode: 0440
          items:
          - key: key
            path: key
      # optional: zonder dit secret valt in- en uitpakken terug op de platformsleutel, zoals
      # de sandbox en lokale ontwikkeling draaien. Het secret komt bewust niet uit git: een
      # SOPS-versie onder de platformsleutel zou de scheiding weer opheffen.
      # Mode 0440 en niet 0400 zoals het plan vroeg: kubelet geeft bestanden in een
      # secret-volume aan root, dus met 0400 kan OPI (uid 1001) er niet bij. Zie de
      # fsGroup in securityContext.
      - name: project-kek
        secret:
          secretName: project-kek
          optional: true
          defaultMode: 0440
          items:
          - key: key
            path: key
      # Platte SOPS-inhoud gaat hier langs, dus in geheugen en niet op de schijf van de
      # node zoals TEMP_DIR. Klein: er staat per keer een enkel document in.
      - name: secret-tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: argocd-ca-bundle
        configMap:
          name: argocd-ca-bundle
          # Zonder dit blijft de pod in ContainerCreating hangen op een cluster zonder
          # bundel; OPI weigert dan met een ArgoTLSConfiguratieError die het pad noemt.
          optional: true
      - name: git-signing-key
        secret:
          secretName: operations-manager-git-signing-key
          optional: true  # Een cluster zonder sleutel moet gewoon kunnen starten
