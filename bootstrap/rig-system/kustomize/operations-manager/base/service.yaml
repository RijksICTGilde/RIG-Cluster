apiVersion: v1
kind: Service
metadata:
  name: operations-manager
  namespace: rig-system
  labels:
    app: operations-manager
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  - port: 5678
    targetPort: 5678
    protocol: TCP
    name: debug
  selector:
    app: operations-manager