apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: operations-manager
  namespace: rig-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    # Anders dan de sandbox, die een geïmporteerd wildcard-cert gebruikt, laten we
    # cert-manager hier een certificaat halen. Zie issuer-letsencrypt.yaml.
    cert-manager.io/issuer: letsencrypt-operations-manager
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "384"
    cert-manager.io/private-key-rotation-policy: Always
spec:
  ingressClassName: nginx
  rules:
    - host: zad.fundament-poc.rijksapp.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: operations-manager
                port:
                  number: 8000
  tls:
    - hosts:
        - zad.fundament-poc.rijksapp.dev
      secretName: operations-manager-fundament-poc-tls
