apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: operations-manager-data
  namespace: rig-system
spec:
  accessModes:
    - ReadWriteOnce
  # Expliciet, want de default van dit cluster (csi-lvm) kan niets provisionen.
  # Zonder deze regel blijft de claim eeuwig Pending, net als bij redis en prometheus.
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
