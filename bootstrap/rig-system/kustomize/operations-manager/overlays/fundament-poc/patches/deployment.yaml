# De base draagt de kale naam `operations-manager:latest`. Die is bedoeld voor Kind, waar
# `kind load docker-image` hem lokaal neerzet. Op een echt cluster resolvet een naam zonder
# registry naar docker.io/library, en daar bestaat hij niet: ImagePullBackOff.
#
# Gepind, net als odcn-production, want `latest` wordt van main gebouwd en daar bestaat het
# blok "fundament-poc" in opi/core/cluster_config.py niet. OPI kwam daardoor tot de laatste
# stap van de Keycloak-setup en viel om op "Cluster 'fundament-poc' not found in
# configuration". De tag draagt het cluster in de naam zodat hij nooit met een tag van een
# ander cluster verward wordt, en `latest` blijft van main.
#
# Nieuwe tag maken vanaf deze branch (NIET `task publish-operations-manager`, die zet
# EXTRA_TAG=latest en pint odcn-production):
#   task docker-build-and-push BUILD_CONTEXT=. DOCKERFILE_PATH=operations-manager/Dockerfile \
#     IMAGE_NAME=operations-manager REGISTRY_IMAGE=ghcr.io/minbzk/base-images/operations-manager \
#     IMAGE_TAG="$(date +%Y.%m.%d.%H%M)-$(git rev-parse --short=8 HEAD)-fundament" \
#     BUILD_TARGET=application PLATFORMS=linux/amd64 SKIP_VALIDATION=true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      containers:
        - name: operations-manager
          image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:2026.08.28.0914-f34f83eb-fundament
          # De drie git-wachtwoorden komen uit het secret dat de init-Job gebruikt om het
          # Forgejo-account aan te maken, en dat ArgoCD als repo-creds leest. Daardoor
          # bestaat de waarde maar op één plek en kan een rotatie niet half doorwerken.
          #
          # Dit MOETEN echte omgevingsvariabelen zijn en geen regels in de configmap:
          # pydantic-settings geeft omgevingsvariabelen voorrang boven het .env-bestand
          # (opi/core/config.py:158), en een waarde zonder prefix wordt als platte tekst
          # behandeld (opi/utils/age.py:329). Een AGE-blok is hier dus niet nodig.
          env:
            - name: GIT_PROJECTS_SERVER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
            - name: GIT_ARGO_APPLICATIONS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
            # ArgoCD's adminwachtwoord wordt door de argocd-operator zelf aangemaakt en in
            # <cr-naam>-cluster gezet. Hier lezen in plaats van kopieren, om dezelfde reden
            # als bij Forgejo: het env-secret van OPI droeg een ARGOCD_PASSWORD van 80
            # tekens terwijl het echte er 32 heeft, en dat leverde bij elke aanroep een
            # 401 op. Een env-regel wint van envFrom, dus deze waarde overschrijft de oude
            # uit operations-manager-env-secrets.
            - name: ARGOCD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: argocd-cluster
                  key: admin.password
            - name: PROJECT_REPO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgejo-admin
                  key: password
            # MAIL_RELAY_API_URL is de SCHAKELAAR: leeg betekent "geen relay op dit cluster"
            # en de dienst send-email weigert dan een account aan te maken in plaats van
            # onbruikbare inloggegevens uit te delen. Hij hoort aan te staan op precies de
            # clusters waar de mail-component ook in
            # infrastructure/bootstrap/clusters/<cluster>/kustomization.yaml staat, en dat is
            # hier zo sinds fundament-poc-mail op wave 2.
            #
            # De relay levert af bij een Mailpit-sink en niet bij de mailserver van de
            # Rijksoverheid: dit cluster kan niet bij het RON-netwerk. Zie de overlay
            # infrastructure/bootstrap/infrastructure/mail/controller/overlays/fundament-poc.
            - name: MAIL_RELAY_API_URL
              value: "http://rig-mail-relay.rig-ron.svc.cluster.local:8080"
            # optional: true, zoals op de andere clusters: zonder het geheim boot OPI gewoon
            # door en meldt de dienst send-email dat er geen relay is. Het secret rendert in
            # rig-system via de secrets-overlay van dit cluster; de relay krijgt zijn eigen
            # rendering in rig-ron.
            - name: MAIL_RELAY_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_RELAY_ADMIN_USERNAME
                  optional: true
            - name: MAIL_RELAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_RELAY_ADMIN_PASSWORD
                  optional: true
          # LOG_ERRORS_FILE_PATH staat in opi/core/config.py op /data/logs/errors.log, dus
          # die map moet bestaan en beschrijfbaar zijn. odcn doet dit met een emptyDir; de
          # sandbox heeft er een PVC op /data staan en dekt hem daarmee af. Dit hoort
          # bewust NIET in de base: een emptyDir op /data/logs zou daar bovenop de PVC van
          # de sandbox gemount worden en die logs stilletjes vluchtig maken.
          volumeMounts:
            - name: error-logs
              mountPath: /data/logs
      volumes:
        - name: error-logs
          emptyDir:
            sizeLimit: 1Gi
