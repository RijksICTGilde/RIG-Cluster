# SECURITY: production RBAC is now declared in-repo so it is auditable from
# the GitOps source (previously the odcn-production overlay omitted
# cluster-role.yaml/cluster-binding.yaml while the Deployment still used
# serviceAccountName: namespace-manager, making prod RBAC invisible here).
# The subject ServiceAccount lives in the production OPI namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-manager
subjects:
  - kind: ServiceAccount
    name: namespace-manager
    namespace: rig-prd-operations
