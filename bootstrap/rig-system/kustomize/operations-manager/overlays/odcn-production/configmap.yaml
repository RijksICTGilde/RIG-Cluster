apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-manager-config
  namespace: rig-system
data:
  .env: |
    CLUSTER_MANAGER=odcn-production

    # Git projects server settings - for monitoring and retrieving project files
    ENABLE_GIT_MONITOR=false
    GIT_PROJECTS_SERVER_URL=https://github.com/RijksICTGilde/rig-cluster-projects.git
    GIT_PROJECTS_SERVER_USERNAME=git
    GIT_PROJECTS_SERVER_PASSWORD=base64+age:
    GIT_PROJECTS_SERVER_REPO_PATH=/
    GIT_PROJECTS_SERVER_FILE_PATH=projects/simple-example.yaml
    GIT_PROJECTS_SERVER_BRANCH=main
    GIT_PROJECTS_SERVER_POLL_INTERVAL=120

    GIT_ARGO_APPLICATIONS_URL=https://github.com/RijksICTGilde/argo-applications.git
    GIT_ARGO_APPLICATIONS_USERNAME=git
    GIT_ARGO_APPLICATIONS_PASSWORD=base64+age:
    GIT_ARGO_APPLICATIONS_BRANCH=main

    DATABASE_HOST=rig-db-rw
    MINIO_HOST=minio:9000

    OWN_DOMAIN=zad.rijksapp.nl
    ADDITIONAL_DOMAINS="operations-manager.rig.prd1.gn2.quattro.rijksapps.nl"

    OIDC_CLIENT_ID=rig-platform-operations-manager
    OIDC_DISCOVERY_URL=https://keycloak.rijksapp.nl/realms/rig-platform/.well-known/openid-configuration

    KEYCLOAK_URL=https://keycloak.rijksapp.nl

    # Gedeelde OTP voor de realm-adminaccounts van projecten. Stond sinds de bouw alleen in
    # de sandbox aan; hier aangezet zodat productie hem ook krijgt.
    #
    # WAT ER GEBEURT ZODRA DIT LANDT: elk project krijgt bij zijn EERSTVOLGENDE verwerking
    # de retrofit uit `_retrofit_admin_otp`, en die verwijdert de adminaccount in master en
    # maakt hem opnieuw aan met het bestaande wachtwoord plus een OTP-credential, omdat
    # Keycloak 25 een OTP alleen bij het aanmaken van een gebruiker importeert. Dat gebeurt
    # hoogstens een keer per realm (zodra `totp_secret` in het projectbestand staat, slaat
    # hij over) en op een moment dat de verwerking van dat project bepaalt, dus verspreid
    # over de vloot.
    #
    # WAT ER MISGAAT ALS HET MISGAAT: faalt het heraanmaken na het verwijderen, dan kan
    # niemand die ene projectrealm beheren tot een volgende verwerking hem herstelt; het
    # wachtwoord staat versleuteld in het projectbestand, dus het is terug te draaien. Wat
    # verder aan dat account hing (handmatige rollen, groepen, sessies) is dan weg.
    #
    # WAT ER NIET GERAAKT WORDT: de hoofdbeheerder van Keycloak. De retrofit werkt alleen op
    # `{project}_{cluster}_admin` in master, nooit op het account uit keycloak-admin-credentials.
    KEYCLOAK_ENFORCE_ADMIN_OTP=true

    PROMETHEUS_URL=http://prometheus.rig-prd-operations:9090
    PROMETHEUS_EXTERNAL_URL=https://prometheus.rig.prd1.gn2.quattro.rijksapps.nl

    ARGOCD_HOST=argocd-server
    ARGOCD_PORT=80

    LOG_TO_FILE=false
    USE_UNSAFE_API_KEY=false

    ALLOWED_EMAILS=ravi.meijer@rijksoverheid.nl,maurits.mink@rijksoverheid.nl,sander.tervoert@odc-noord.nl,anne.schuth@rijksoverheid.nl,matthijs.beekman@rijksoverheid.nl,robbert.bos@rijksoverheid.nl
    ADMIN_EMAILS=robbert.bos@rijksoverheid.nl
    GRAFANA_DATASOURCE_UID=mimir-prd
    GRAFANA_BILLING_DATASOURCE_UID=mimir-billing
    ENABLE_TRACEMALLOC=false
    ARGOCD_MANAGER=rig-prd-operations

    # Container registry (image upload proxy)
    REGISTRY_URL=rcr.rijksapps.nl
    REGISTRY_ORG=rig/zad
    REGISTRY_USERNAME=rig+zad
    REGISTRY_VERIFY_TLS=True
    IMAGE_UPLOAD_MAX_SIZE_MB=1024

    # Sleep-mode waker image via the production ghcr mirror (same path as the OPI image).
    # Sleep-mode itself stays off in production (cluster default) until validated; this is
    # declared so the waker pulls correctly once a project opts in.
    SLEEP_MODE_WAKER_IMAGE=rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/zad-waker:latest
