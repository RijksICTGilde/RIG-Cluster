apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-operations

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  - ingress.yaml
  - configmap.yaml
  - network-policy.yaml
  - prometheusrule-billing.yaml
  - prometheusrule-image-pull.yaml

  # Additional hostname zad.rijksapp.nl with Let's Encrypt (transition period)
  - issuer-letsencrypt.yaml
  - ingress-rijksapp.yaml
  - ingress-router.yaml

patches:
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: operations-manager

  # Persoonsgegevens in secrets, geen configmap. JSON-patch omdat strategic-merge-patch
  # bestaande secretRefs zou vervangen.
  - target:
      kind: Deployment
      name: operations-manager
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: operations-manager-access
