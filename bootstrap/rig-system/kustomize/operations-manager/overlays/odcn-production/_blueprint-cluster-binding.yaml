# BLUEPRINT — not deployed via ArgoCD. ODC platform-team beheert de werkelijke
# Binding op productie; deze file documenteert welke ServiceAccount welke
# ClusterRole zou moeten krijgen, voor parity tussen repo en cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-manager
subjects:
  - kind: ServiceAccount
    name: namespace-manager
    namespace: rig-prd-operations
