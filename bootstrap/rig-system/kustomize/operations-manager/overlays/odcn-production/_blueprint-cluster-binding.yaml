# Blueprint van OPI binding op odcn-production. Niet gesynced — productie
# heeft per-tenant RoleBindings via Capsule.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: namespace-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: namespace-manager
subjects:
  - kind: ServiceAccount
    name: namespace-manager
    namespace: rig-prd-operations
