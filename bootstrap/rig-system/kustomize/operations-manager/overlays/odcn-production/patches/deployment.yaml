apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-rig-robot-pull-secret
      containers:
      - name: operations-manager
        image: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/operations-manager/operations-manager:latest
        resources:
          limits:
            cpu: "3"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        env:
        - name: KUBERNETES_SERVICE_HOST
          value: cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
        - name: PROMETHEUS_METRICS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: prometheus-metrics-auth
              key: token
        - name: LOG_ERRORS_TO_FILE
          value: "true"
        - name: LOG_ERRORS_FILE_PATH
          value: "/data/logs/errors.log"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: error-logs
          mountPath: /data/logs
      volumes:
      - name: config-volume
        configMap:
          name: operations-manager-config
      - name: tmp
        emptyDir:
          sizeLimit: 8Gi
      - name: error-logs
        emptyDir:
          sizeLimit: 1Gi
