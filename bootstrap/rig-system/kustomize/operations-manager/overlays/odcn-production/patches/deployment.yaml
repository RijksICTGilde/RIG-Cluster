apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      imagePullSecrets:
      - name: ghcr-rig-robot-pull-secret
      containers:
      - name: operations-manager
        image: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/operations-manager/operations-manager:2026.08.18.2228-60fab4e2-dirty
        resources:
          limits:
            cpu: "3"
            memory: 1Gi
          requests:
            cpu: "500m"
            memory: 1Gi
        env:
        # OPI's eigen confidential master-client (client-credentials), zodat het
        # gedeelde admin-wachtwoord geen dagelijkse sleutel meer is en het menselijke
        # admin-account op OTP kan zonder de automatisering buiten te sluiten.
        # optional:true zodat een cluster waarvan het secret deze sleutel nog niet
        # kent gewoon blijft werken: OPI valt dan terug op het admin-wachtwoord.
        # Bij de eerste boot mét de sleutel maakt OPI de client eenmalig aan met het
        # admin-wachtwoord en draait daarna volledig op client-credentials.
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_USERNAME
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_PASSWORD
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_TOTP_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_TOTP_SECRET
              optional: true
        - name: KUBERNETES_SERVICE_HOST
          value: cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
        - name: PROMETHEUS_METRICS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: prometheus-metrics-auth
              key: token
        # TransIP DNS API, for the CAA records on rijks.app / rijksapp.nl / rijksapp.dev.
        # The secret already exists in this namespace: external-dns uses it.
        #
        # Optional on purpose. The CAA reconciler is non-critical by design and skips
        # itself when the credentials are absent, but a required secretKeyRef fails the
        # container before Python ever runs: a missing or renamed secret would hold the
        # whole portal in CreateContainerConfigError over DNS hygiene.
        - name: TRANSIP_ACCOUNT_NAME
          valueFrom:
            secretKeyRef:
              name: transip-credentials
              key: TRANSIP_ACCOUNT_NAME
              optional: true
        - name: TRANSIP_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: transip-credentials
              key: TRANSIP_PRIVATE_KEY
              optional: true
        - name: LOG_ERRORS_TO_FILE
          value: "true"
        - name: LOG_ERRORS_FILE_PATH
          value: "/data/logs/errors.log"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: error-logs
          mountPath: /data/logs
      volumes:
      - name: config-volume
        configMap:
          name: operations-manager-config
      - name: tmp
        emptyDir:
          sizeLimit: 8Gi
      - name: error-logs
        emptyDir:
          sizeLimit: 1Gi
