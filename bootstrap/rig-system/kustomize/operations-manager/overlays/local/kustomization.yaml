apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  - cluster-binding.yaml
  - cluster-role.yaml
  - ingress.yaml
  - configmap.yaml

patches:
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: operations-manager
  # Enable hot-reload mode for development (default)
  - path: patches/enable-hot-reload.yaml
    target:
      kind: Deployment
      name: operations-manager
  # Uncomment for debug mode (disable hot-reload, enable debugger on port 5678)
  # - path: patches/enable-debug.yaml
  #   target:
  #     kind: Deployment
  #     name: operations-manager
