apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-manager
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - patch
      - update
  # Prometheus service discovery - read-only access to pods/services/endpoints/nodes
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  # Prometheus metrics endpoints
  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs:
      - get