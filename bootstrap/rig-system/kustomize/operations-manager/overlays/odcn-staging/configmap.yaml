apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-manager-config
  namespace: rig-system
data:
  .env: |
    CLUSTER_MANAGER=odcn-staging
    # Upstream-IdP zoals de sandbox, maar geen lokale beheerder in het OPI-realm: staging
    # is een pentestomgeving. Zie opi/bootstrap/keycloak_setup.py.
    KEYCLOAK_BOOTSTRAP_CONFIG=staging

    # De wachtwoorden van de drie git-repos staan niet hier maar in het env-secret uit
    # de private repo zad-staging-secrets: GIT_PROJECTS_SERVER_PASSWORD,
    # GIT_ARGO_APPLICATIONS_PASSWORD en PROJECT_REPO_PASSWORD.
    ENABLE_GIT_MONITOR=false
    GIT_PROJECTS_SERVER_URL=https://github.com/RijksICTGilde/zad-staging-projects.git
    GIT_PROJECTS_SERVER_USERNAME=git
    GIT_PROJECTS_SERVER_REPO_PATH=/
    GIT_PROJECTS_SERVER_FILE_PATH=projects/simple-example.yaml
    GIT_PROJECTS_SERVER_BRANCH=main
    GIT_PROJECTS_SERVER_POLL_INTERVAL=120

    GIT_ARGO_APPLICATIONS_URL=https://github.com/RijksICTGilde/zad-staging-argo-applications.git
    GIT_ARGO_APPLICATIONS_USERNAME=git
    GIT_ARGO_APPLICATIONS_BRANCH=main

    PROJECT_REPO_URL=https://github.com/RijksICTGilde/zad-staging-deployments.git
    PROJECT_REPO_USERNAME=git
    PROJECT_REPO_BRANCH=main

    # Van welke bronnen de renderketen een helmfile of helm chart mag klonen. Leeg betekent
    # geen enkele, dus een nieuwe bron moet hier eerst bij. Gemeten in de projectrepo: de
    # twee helmfile-projecten halen allebei hieruit.
    RENDER_SOURCE_ALLOWLIST=https://github.com/MinBZK/mijn-bureau-infra.git

    DATABASE_HOST=rig-db-rw
    MINIO_HOST=minio:9000

    # SeaweedFS (seaweedfs-storage, RC-331). Beide adressen zijn nodig, `weed shell` hangt
    # zonder masteradres. Dit zijn de HTTP-poorten: weed leidt de gRPC-poort er zelf uit af
    # door 10000 op te tellen, en dat zijn de twee die de Service en de NetworkPolicy
    # openzetten.
    SEAWEEDFS_FILER_ADDRESS=seaweedfs.rig-staging-operations.svc.cluster.local:8888
    SEAWEEDFS_MASTER_ADDRESS=seaweedfs.rig-staging-operations.svc.cluster.local:9333

    OWN_DOMAIN=zad.staging.rijksapp.dev
    ADDITIONAL_DOMAINS="operations-manager-staging.rig.prd1.gn2.quattro.rijksapps.nl"

    OIDC_CLIENT_ID=rig-platform-operations-manager
    OIDC_DISCOVERY_URL=https://keycloak.staging.rijksapp.dev/realms/rig-platform/.well-known/openid-configuration

    KEYCLOAK_URL=https://keycloak.staging.rijksapp.dev
    KEYCLOAK_ENFORCE_ADMIN_OTP=true

    # De upstream: het rig-platform-realm van de productie-Keycloak. Een EIGEN client en
    # niet development-clusters (dat is de sandbox), zodat staging los in te trekken is.
    # De client bestaat nog niet; het secret komt in het env-secret als
    # KEYCLOAK_MASTER_OIDC_CLIENT_SECRET. Zie features/zad-staging.md.
    KEYCLOAK_MASTER_OIDC_CLIENT_ID=zad-staging
    KEYCLOAK_MASTER_OIDC_DISCOVERY_URL=https://keycloak.rijksapp.nl/realms/rig-platform/.well-known/openid-configuration

    PROMETHEUS_URL=http://prometheus.rig-staging-operations:9090
    PROMETHEUS_EXTERNAL_URL=https://prometheus-staging.rig.prd1.gn2.quattro.rijksapps.nl

    # De volledige servicenaam (SAN in het certificaat)
    ARGOCD_HOST=argocd-server.rig-staging-operations.svc
    # TLS met service-CA-bundel
    ARGOCD_PORT=443
    ARGOCD_USE_TLS=true
    ARGOCD_VERIFY_SSL=true
    ARGOCD_CA_BUNDLE=/etc/ssl/argocd/service-ca.crt

    # De OpenShift-router is hier de enige ingang en zet zijn waarde achter die van de
    # client in X-Forwarded-For, dus de rechtse waarde is het echte client-IP. Zonder dit
    # telt OPI op het peer-adres, en dat is bij elk verzoek de router.
    TRUSTED_PROXY_HOPS=1

    # INFO zoals in productie: de DEBUG-regels van OPI noemen per verzoek het e-mailadres
    # van de gebruiker, en die stroom gaat naar Loki.
    LOG_LEVEL=INFO
    LOG_TO_FILE=false
    USE_UNSAFE_API_KEY=false

    # ALLOWED_EMAILS en ADMIN_EMAILS (persoonsgegevens) staan in de private repo
    # zad-staging-secrets, in operations-manager/operations-manager-env-secrets.yaml;
    # dat secret komt mee via envFrom in de base-Deployment.
    ENABLE_TRACEMALLOC=false
    ARGOCD_MANAGER=rig-staging-operations

    # Mimir van ODCN, net als productie: de eigen Prometheus in de tenant ziet geen
    # cAdvisor of kube-state-metrics. De rig-staging-namespaces staan in mimir-staging, niet
    # in mimir-prd (gemeten 30-10-2026). METRICS_BACKEND, GRAFANA_URL en een eigen
    # GRAFANA_TOKEN staan in het env-secret in zad-staging-secrets.
    GRAFANA_DATASOURCE_UID=mimir-staging
    GRAFANA_BILLING_DATASOURCE_UID=mimir-billing

    # Geen REGISTRY_*: de registry-organisatie rig/zad is die van productie. Zonder
    # REGISTRY_URL staat de image-upload uit.

    SLEEP_MODE_WAKER_IMAGE=rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/zad-waker:latest

    # Welke zadctl-versies deze API bedient (X.Y.Z, leeg is uit). Hoog het minimum op bij een
    # API-wijziging waar oudere zadctl-versies aantoonbaar stuk op gaan; die krijgen dan 426.
    # Zie features/zadctl-versiecheck.md.
    ZADCTL_MIN_VERSION=
    ZADCTL_RECOMMENDED_VERSION=
