apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-staging-operations

# Geen decrypt-sops-generator: het env-secret staat in de private repo
# zad-staging-secrets (operations-manager/), en de bootstrap-taken passen het los toe.

resources:
  - ../../base
  - ingress.yaml
  - configmap.yaml
  - network-policy.yaml
  - prometheusrule-billing.yaml
  - prometheusrule-image-pull.yaml

  # zad.staging.rijksapp.dev with Let's Encrypt. Geen ingress-router.yaml: router.rijksapp.nl
  # is de landingspagina van de router van productie.
  - issuer-letsencrypt.yaml
  - ingress-rijksapp.yaml

# Tenant-eigenaar via owner promotion van Capsule: met dit label zet Capsule de SA in
# status.owners van rig-staging, en krijgt hij admin in elke staging-namespace. Op
# productie deed ODC-Noord dat met TenantOwner-objecten. Gemeten 19 oktober 2026 met
# namespace-manager, zie docs/logboek-zad-staging.md. Alleen een eigenaar mag het label
# zetten: task bootstrap-argo-system past dit toe met jouw account.
patches:
  - target:
      kind: ServiceAccount
      name: namespace-manager
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          owner.projectcapsule.dev/promote: "true"
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: operations-manager
