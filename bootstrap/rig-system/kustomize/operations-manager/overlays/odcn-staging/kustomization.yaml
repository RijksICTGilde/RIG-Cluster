apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-staging-operations

# Geen decrypt-sops-generator: het env-secret staat in de private repo
# zad-staging-secrets (operations-manager/), en de bootstrap-taken passen het los toe.

resources:
  - ../../base
  - ingress.yaml
  - configmap.yaml
  - network-policy.yaml
  - prometheusrule-billing.yaml
  - prometheusrule-image-pull.yaml

  # zad.staging.rijksapp.dev with Let's Encrypt. Geen ingress-router.yaml: router.rijksapp.nl
  # is de landingspagina van de router van productie.
  - issuer-letsencrypt.yaml
  - ingress-rijksapp.yaml

patches:
  - path: patches/deployment.yaml
    target:
      kind: Deployment
      name: operations-manager
