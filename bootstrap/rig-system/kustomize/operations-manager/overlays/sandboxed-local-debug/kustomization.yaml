apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../sandboxed-local

# Skaffold pusht naar localhost:5001/operations-manager en vervangt alleen image-
# verwijzingen met die naam. Zonder deze regel blijft de gepubliceerde ghcr-image staan
# zolang configure-operations-manager-image niet gedraaid heeft.
images:
  - name: ghcr.io/minbzk/base-images/operations-manager/operations-manager
    newName: localhost:5001/operations-manager

patches:
  - path: ../sandboxed-local/patches/enable-debug.yaml
    target:
      kind: Deployment
      name: operations-manager
