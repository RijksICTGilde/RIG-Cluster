apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../sandboxed-local

# Skaffold vervangt alleen verwijzingen met de naam van zijn artifact.
images:
  - name: ghcr.io/minbzk/base-images/operations-manager/operations-manager
    newName: localhost:5001/operations-manager

patches:
  - path: ../sandboxed-local/patches/enable-debug.yaml
    target:
      kind: Deployment
      name: operations-manager
  # De debug-poort bestaat alleen hier, niet in de base-Service.
  - path: ../sandboxed-local/patches/enable-debug-service.yaml
    target:
      kind: Service
      name: operations-manager
