apiVersion: v1
kind: ConfigMap
metadata:
  name: operations-manager-config
  namespace: rig-system
data:
  .env: |
    CLUSTER_MANAGER=sandboxed-local
    KEYCLOAK_BOOTSTRAP_CONFIG=sandbox

    # Stable SECRET_KEY zodat dev-sessies overleven na pod-restarts (zonder
    # zou de Field(default_factory=generate_secret_key) per process een nieuwe
    # random key minten). Niet-internet-facing dev cluster, plaintext is OK.
    SECRET_KEY=sandbox-dev-secret-key-fixed-for-stable-sessions-32min

    ENABLE_GIT_MONITOR=false
    GIT_PROJECTS_SERVER_URL=http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/zad-projects.git
    GIT_PROJECTS_SERVER_USERNAME=rig-admin
    GIT_PROJECTS_SERVER_PASSWORD=plain:admin1234
    GIT_PROJECTS_SERVER_REPO_PATH=/
    GIT_PROJECTS_SERVER_FILE_PATH=projects/simple-example.yaml
    GIT_PROJECTS_SERVER_BRANCH=main
    GIT_PROJECTS_SERVER_POLL_INTERVAL=120

    GIT_ARGO_APPLICATIONS_URL=http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/zad-argo-user-applications.git
    GIT_ARGO_APPLICATIONS_USERNAME=rig-admin
    GIT_ARGO_APPLICATIONS_PASSWORD=plain:admin1234
    GIT_ARGO_APPLICATIONS_BRANCH=main

    DATABASE_HOST=rig-db-rw
    MINIO_HOST=minio:9000

    # SeaweedFS (seaweedfs-storage, RC-331). Elk cluster met de dienst zet deze twee; de
    # overlays van odcn-production en odcn-staging doen hetzelfde met hun eigen namespace.
    # Beide adressen zijn nodig, `weed shell` hangt zonder masteradres (rij G18).
    # Dit zijn de HTTP-poorten: weed leidt de gRPC-poort er zelf uit af door 10000 op te
    # tellen, en dat zijn de twee die de Service en de NetworkPolicy openzetten.
    SEAWEEDFS_FILER_ADDRESS=seaweedfs.rig-system.svc.cluster.local:8888
    SEAWEEDFS_MASTER_ADDRESS=seaweedfs.rig-system.svc.cluster.local:9333

    ARGOCD_HOST=argocd-server
    # TLS: certificaat en bundel van `task sandbox:generate-argocd-tls`.
    ARGOCD_PORT=443
    ARGOCD_USE_TLS=true
    ARGOCD_VERIFY_SSL=true
    ARGOCD_CA_BUNDLE=/etc/ssl/argocd/ca.crt

    # Hier aan en op productie nog niet: de sandbox is waar de afsluiting gemeten wordt
    # (tests/e2e/test_sandbox_database_isolatie.py). Standaard is dry-run.
    DATABASE_RESTRICT_PUBLIC_CONNECT=on

    KEYCLOAK_URL=https://keycloak.sandbox.rijksapp.dev
    # OIDC credentials are set dynamically by OPI after creating its own realm

    # Shared OTP for project realm-admin accounts (off by default; on in sandbox
    # so the feature is exercised). Existing realms migrate on next reprocess.
    KEYCLOAK_ENFORCE_ADMIN_OTP=true

    # Upstream IDP: production Keycloak for SSO-Rijk authentication
    # The client secret is provided via operations-manager-env-secrets (from .env.sandboxed-local.secrets)
    # Without this, the sandbox works with local admin user only (no SSO)
    KEYCLOAK_MASTER_OIDC_CLIENT_ID=development-clusters
    KEYCLOAK_MASTER_OIDC_DISCOVERY_URL=https://keycloak.rijksapp.nl/realms/rig-platform/.well-known/openid-configuration

    OWN_DOMAIN=zad.sandbox.rijksapp.dev

    ALLOWED_EMAILS=admin@sandbox.rijksapp.dev
    ADMIN_EMAILS=admin@sandbox.rijksapp.dev

    # Van welke bronnen de renderketen een helmfile of helm chart mag klonen. Leeg
    # betekent geen enkele, dus een nieuwe bron moet hier eerst bij.
    RENDER_SOURCE_ALLOWLIST=https://github.com/MinBZK/mijn-bureau-infra.git,https://forgejo.sandbox.rijksapp.dev/rig-admin/zad-deployments.git

    PROJECT_REPO_URL=https://forgejo.sandbox.rijksapp.dev/rig-admin/zad-deployments.git
    PROJECT_REPO_USERNAME=rig-admin
    PROJECT_REPO_PASSWORD=plain:admin1234
    PROJECT_REPO_BRANCH=main

    REGISTRY_URL=registry.sandbox.rijksapp.dev
    REGISTRY_ORG=rig
    REGISTRY_USERNAME=admin
    REGISTRY_PASSWORD=plain:admin1234
    REGISTRY_VERIFY_TLS=true
    IMAGE_UPLOAD_MAX_SIZE_MB=5120

    PROMETHEUS_EXTERNAL_URL=https://prometheus.sandbox.rijksapp.dev

    # ingress-nginx is hier de enige ingang en zet X-Forwarded-For op $remote_addr
    # (nergens een use-forwarded-headers, dus de default), dus er is precies een
    # vertrouwde hop en de inkomende header telt niet mee. Zonder dit telt de rem op het
    # peer-adres, en dat is bij elk extern verzoek de ingress-pod: een emmer voor alle
    # clients samen. Gemeten op de sandbox: hops=0 gaf 10.244.0.247 (de ingress-pod),
    # hops=1 geeft het adres dat de ingress ziet.
    TRUSTED_PROXY_HOPS=1

    LOG_TO_FILE=false

    # Sleep-mode: pull the published waker image, same tag as production and as the code
    # default, so a fresh sandbox works without anyone building anything first. Pinning
    # a sandbox-only tag here made this the only place pointing at a tag that does not
    # exist on ghcr, which fails the pull with a 403 rather than something that reads as
    # "missing". Publish a new waker with `task publish-waker` instead.
    # A short sweep interval keeps the sleep/wake cycle observable for the sandbox E2E.
    SLEEP_MODE_SCHEDULER_ENABLED=true
    SLEEP_MODE_SWEEP_MINUTES=1
    SLEEP_MODE_WAKER_IMAGE=ghcr.io/minbzk/base-images/zad-waker:latest

    # Back-uppods op :latest en niet op de gepinde digest uit de code: task
    # build-backup-image bouwt deze image lokaal en laadt hem onder die tag in kind.
    BACKUP_IMAGE=ghcr.io/minbzk/base-images/rig-backup:latest
