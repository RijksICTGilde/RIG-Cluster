apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: namespace-manager
rules:
  # Tenant-namespace lifecycle: OPI creëert en label't tenant-namespaces.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create, get, list, patch, delete]
  # applications/appprojects stonden hier cluster-breed met get, list, update, patch
  # en delete. Ze staan nu als Role in de namespace van ArgoCD, met alleen de verbs
  # die OPI gebruikt: base/argo-application-role.yaml.
  # Secrets cluster-breed: OPI plaatst SOPS-age-keys en Keycloak-secrets per
  # tenant-ns; per-namespace Role+RoleBinding is follow-up #90.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, get, list, patch, delete]
  # De Role cmp-sops-key-reader die OPI naast elk sleutel-secret zet
  # (sops.py, _apply_cmp_key_reader_role). Zonder deze regel geeft elke
  # plaatsing van een sleutel Forbidden en faalt een nieuw project.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [create, get, patch, update]
  # Prometheus kubelet scrape: role:node service-discovery + de kubelet
  # autoriseert /metrics en /metrics/cadvisor via een resource-SAR op
  # nodes/metrics (nonResourceURLs dekt dat NIET). Per ongeluk verwijderd in
  # de RBAC-inscoping van #80, waardoor cAdvisor/kubelet 403 gaven.
  - apiGroups: [""]
    resources: [nodes, nodes/proxy, nodes/metrics]
    verbs: [get, list, watch]
  # Prometheus/kubelet scrape endpoints onder dezelfde SA.
  - nonResourceURLs: [/metrics, /metrics/cadvisor]
    verbs: [get]
  # Deploy-status + OOM watcher leest deployments. De watcher leest ook replicasets:
  # daarmee bepaalt hij de pod-template-hash van de HUIDIGE ReplicaSet, zodat een pod
  # van een vervangen ReplicaSet niet meetelt. Zonder dat recht faalt die lookup met
  # Forbidden en valt hij terug op "alle pods", wat een oude OOM-kill kan doorgeven
  # aan het auto-tunen.
  - apiGroups: [apps]
    resources: [deployments, replicasets]
    verbs: [get, list]
  # Events voor deploy-progress en diagnostics.
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  # Backup-lock (ConfigMap in rig-system) coordineert concurrent backups +
  # de tijdelijke databaseconsole (sign-in + e-mail-allowlist ConfigMaps).
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, get, list, delete, patch, update]
  # PVC backups + restores: clones aanmaken/opruimen.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, get, list, delete]
  # Backup/restore pods: launchen, wachten, opruimen.
  # watch hangt ook de cluster-brede OOM-pod-watch eraan (features/oom-pod-watch.md).
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete, watch]
  # Pod-logs voor backup-status en diagnostics.
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # CSI VolumeSnapshots voor point-in-time PVC backups.
  - apiGroups: [snapshot.storage.k8s.io]
    resources: [volumesnapshots]
    verbs: [create, get, list, delete]
  # Tijdelijke databaseconsole: OPI plaatst en verwijdert de Service + Ingress
  # rechtstreeks (buiten ArgoCD om), als een eenmalige actie per sessie.
  - apiGroups: [""]
    resources: [services]
    verbs: [create, get, list, delete, patch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [create, get, list, delete, patch]
