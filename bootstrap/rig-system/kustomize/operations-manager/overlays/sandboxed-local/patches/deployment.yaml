apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operations-manager
        image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:latest
        # IfNotPresent en niet Always. Dit is een kind-cluster: de image komt er met
        # `kind load` in, hij staat niet in een registry. Met Always haalt kubelet de
        # REMOTE :latest uit ghcr op en overschrijft daarmee precies de build die je net
        # lokaal hebt gemaakt. Op 14 augustus 2026 kostte dat een crashloop: die remote
        # image was ouder dan de branch en kende SLEEP_MODE_SCHEDULER_ENABLED,
        # SLEEP_MODE_SWEEP_MINUTES, SLEEP_MODE_WAKER_IMAGE en KEYCLOAK_ENFORCE_ADMIN_OTP
        # niet, terwijl de configmap ze wel meegeeft; pydantic weigert ze als onbekend en
        # de migratie viel om. De pod die het nog deed draaide een vastgepinde digest.
        #
        # De -dev-overlay (die skaffold gebruikt) zet hem op Never en had dit probleem
        # daarom niet. Deze overlay wordt door de deploytaken gebruikt, en die laadt de
        # image net zo goed lokaal in.
        imagePullPolicy: IfNotPresent
        env:
        - name: TMPDIR
          value: "/tmp"
        - name: TEMP
          value: "/tmp"
        - name: TMP
          value: "/tmp"
        - name: PYTHONTMPDIR
          value: "/tmp"
        - name: TEMP_DIR
          value: "/data"
        - name: ENVIRONMENT
          value: "sandboxed-local"
        - name: LOCAL_DEVELOPMENT
          value: "true"
        - name: DATABASE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin-credentials
              key: password
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_PASSWORD
        # OPI's own client-credentials service account. Generated by the bootstrap
        # secret template alongside the admin password. optional:true so a cluster
        # whose secret predates this key keeps working (OPI stays on the admin
        # password until the secret is regenerated). Once set, OPI self-bootstraps
        # the confidential master client on first boot, then authenticates purely
        # via client-credentials - the admin password is only first-boot bootstrap
        # and break-glass after that.
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_USERNAME
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_PASSWORD
              optional: true
        - name: KEYCLOAK_OTP_ADMIN_TOTP_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_OTP_ADMIN_TOTP_SECRET
              optional: true
        - name: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: operations-manager-env-secrets
              key: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
              optional: true
        - name: MINIO_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-admin-credentials
              key: MINIO_ROOT_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-admin-credentials
              key: REDIS_PASSWORD
        - name: PROMETHEUS_METRICS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: prometheus-metrics-auth
              key: token
        # De mailrelay (RC-114). OPI praat met het BEHEERDERSACCOUNT van de relay en maakt
        # daarmee alle accounts aan: die van een project en dat van ZAD zelf. Het geheim is
        # dezelfde gegenereerde bron als die de relay in zijn eigen namespace krijgt, hier
        # gerenderd in de namespace van OPI - zoals bij Keycloak en PostgreSQL.
        # optional: true, want de relay staat nog niet aan; zonder het geheim boot OPI
        # gewoon door en blijft de dienst send-email zeggen dat er geen relay is.
        #
        # MAIL_RELAY_API_URL is de SCHAKELAAR: leeg betekent "geen relay op dit cluster" en
        # de dienst weigert dan een account aan te maken in plaats van onbruikbare
        # inloggegevens uit te delen. Zet hem pas aan samen met de mail-component in
        # infrastructure/bootstrap/clusters/<cluster>/kustomization.yaml.
        # - name: MAIL_RELAY_API_URL
        #   value: "http://rig-mail-relay.rig-ron.svc.cluster.local:8080"
        - name: MAIL_RELAY_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: mail-relay-credentials
              key: MAIL_RELAY_ADMIN_USERNAME
              optional: true
        - name: MAIL_RELAY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mail-relay-credentials
              key: MAIL_RELAY_ADMIN_PASSWORD
              optional: true
        - name: LOG_ERRORS_TO_FILE
          value: "true"
        - name: LOG_ERRORS_FILE_PATH
          value: "/data/logs/errors.log"
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: data
          mountPath: /data
        # Sandbox-CPU-beleid: minimale request, geen cpu-limit — zie de toelichting in
        # infrastructure/bootstrap/clusters/sandboxed-local/kustomization.yaml. Memory
        # houdt wel een limit: incompressible, anders OOM-kills in plaats van vertraging.
        resources:
          limits:
            # null verwijdert de cpu-limit uit de base (die staat op "1"); hem hier
            # weglaten volstaat niet, dan wint de base-waarde gewoon weer.
            cpu: null
            # Gelijk aan de base. Op 512Mi zat de pod al vlak na een herstart op ~450Mi
            # zonder werk te doen, en werd hij tijdens het verwerken van echte
            # projectbestanden OOM-killed (exit 137) na een handvol projecten -- de
            # connectors forken kubectl binnen dezelfde cgroup, dus die tellen mee.
            memory: 1Gi
          requests:
            cpu: "25m"
            memory: 256Mi
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: config-volume
        configMap:
          name: operations-manager-config
      - name: data
        persistentVolumeClaim:
          claimName: operations-manager-data
      serviceAccountName: namespace-manager
