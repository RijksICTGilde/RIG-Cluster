apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operations-manager
        image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:latest
        imagePullPolicy: Always
        env:
        - name: TMPDIR
          value: "/tmp"
        - name: TEMP
          value: "/tmp"
        - name: TMP
          value: "/tmp"
        - name: PYTHONTMPDIR
          value: "/tmp"
        - name: TEMP_DIR
          value: "/data"
        - name: ENVIRONMENT
          value: "sandboxed-local"
        - name: LOCAL_DEVELOPMENT
          value: "true"
        - name: DATABASE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin-credentials
              key: password
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_PASSWORD
        # OPI's own client-credentials service account. Generated by the bootstrap
        # secret template alongside the admin password. optional:true so a cluster
        # whose secret predates this key keeps working (OPI stays on the admin
        # password until the secret is regenerated). Once set, OPI self-bootstraps
        # the confidential master client on first boot, then authenticates purely
        # via client-credentials - the admin password is only first-boot bootstrap
        # and break-glass after that.
        - name: KEYCLOAK_ADMIN_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_CLIENT_SECRET
              optional: true
        - name: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: operations-manager-env-secrets
              key: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
              optional: true
        - name: MINIO_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-admin-credentials
              key: MINIO_ROOT_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-admin-credentials
              key: REDIS_PASSWORD
        - name: PROMETHEUS_METRICS_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: prometheus-metrics-auth
              key: token
        - name: LOG_ERRORS_TO_FILE
          value: "true"
        - name: LOG_ERRORS_FILE_PATH
          value: "/data/logs/errors.log"
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        - name: data
          mountPath: /data
        resources:
          limits:
            cpu: "4"
            memory: 512Mi
          requests:
            cpu: "100m"
            memory: 256Mi
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: config-volume
        configMap:
          name: operations-manager-config
      - name: data
        persistentVolumeClaim:
          claimName: operations-manager-data
      serviceAccountName: namespace-manager
