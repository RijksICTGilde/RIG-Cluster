apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-manager
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: operations-manager
        image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:latest
        imagePullPolicy: Always
        env:
        - name: TMPDIR
          value: "/tmp"
        - name: TEMP
          value: "/tmp"
        - name: TMP
          value: "/tmp"
        - name: PYTHONTMPDIR
          value: "/tmp"
        - name: ENVIRONMENT
          value: "sandboxed-local"
        - name: LOCAL_DEVELOPMENT
          value: "true"
        - name: DATABASE_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-admin-credentials
              key: password
        - name: KEYCLOAK_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-admin-credentials
              key: KEYCLOAK_ADMIN_PASSWORD
        - name: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: operations-manager-env-secrets
              key: KEYCLOAK_MASTER_OIDC_CLIENT_SECRET
              optional: true
        - name: MINIO_ADMIN_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-admin-credentials
              key: MINIO_ROOT_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-admin-credentials
              key: REDIS_PASSWORD
        volumeMounts:
        - name: kube-api-access
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
        - name: tmp
          mountPath: /tmp
        - name: tmp
          mountPath: /var/tmp
        - name: config-volume
          mountPath: /etc/config
          readOnly: true
        resources:
          limits:
            cpu: "4"
            memory: 512Mi
          requests:
            cpu: "100m"
            memory: 256Mi
      volumes:
      - name: kube-api-access
        projected:
          sources:
          - serviceAccountToken:
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
              - key: ca.crt
                path: ca.crt
          - downwardAPI:
              items:
              - path: namespace
                fieldRef:
                  fieldPath: metadata.namespace
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      - name: config-volume
        configMap:
          name: operations-manager-config
      serviceAccountName: namespace-manager
