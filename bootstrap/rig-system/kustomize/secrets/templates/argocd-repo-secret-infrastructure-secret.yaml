apiVersion: v1
kind: Secret
metadata:
    name: github-repo-for-infrastructure
    namespace: replace-by-script
    labels:
        argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
    type: git
    name: repo-for-infrastructure
    # the username is in the url to make it unique for argocd - this is required!
    url: https://infrastructure@github.com/RijksICTGilde/RIG-Cluster.git
    username: infrastructure-not-used
    password: key-here # @secret-gen:skip,path=bootstrap/rig-system/kustomize/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}
