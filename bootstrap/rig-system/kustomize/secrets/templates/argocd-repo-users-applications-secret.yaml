apiVersion: v1
kind: Secret
metadata:
    name: github-repo-for-user-applications
    namespace: rig-prd-operations
    labels:
        argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
    type: git
    name: repo-for-user-applications
    url: https://user-applications@github.com/RijksICTGilde/RIG-Cluster.git
    username: user-applications-not-used
    password: key-here # @secret-gen:skip,path=bootstrap/rig-system/kustomize/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}
