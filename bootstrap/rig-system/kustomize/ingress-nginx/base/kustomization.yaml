apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Use upstream ingress-nginx manifest for KIND.
#
# Gepind op een release-tag, niet op main: `task install-ingress-nginx` bouwt deze base bij
# elke verse sandbox, dus met `main` haalde elke setup binnen wat er die dag toevallig
# stond. Dan verandert de controllerversie zonder dat iemand iets wijzigt, en verdwijnt het
# pad zodra upstream opruimt -- precies wat de hostpath-driver in csi-snapshot/base overkwam.
# Ophogen is een bewuste stap: check de patches hieronder tegen de nieuwe versie.
resources:
- https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml

patches:
# Enable configuration-snippet annotations (disabled by default since v1.9.0)
# Required for setting security headers like Permissions-Policy via ingress annotations
- target:
    kind: ConfigMap
    name: ingress-nginx-controller
    namespace: ingress-nginx
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: ingress-nginx-controller
      namespace: ingress-nginx
    data:
      allow-snippet-annotations: "true"
      annotations-risk-level: "Critical"
      # OPI praat met Keycloak via deze ingress, en zijn admin-token draagt een
      # resource_access-entry per realm (~337 bytes). Bij 15 realms was de
      # Authorization-header 8446 bytes en gaf nginx "400 Request Header Or Cookie
      # Too Large" op de standaard 8k, waardoor een verse OPI-pod niet meer kon
      # opstarten. Dit is een noodverband: het token blijft groeien met het aantal
      # projecten (~19KB bij 47), dus de echte oplossing is dat admin-verkeer niet
      # door deze ingress loopt of dat het token kleiner wordt.
      large-client-header-buffers: "4 16k"

# Ensure ingress controller runs on control-plane node with ingress-ready=true label
# KIND clusters have port mappings (80/443) only on the control-plane node
- target:
    kind: Deployment
    name: ingress-nginx-controller
    namespace: ingress-nginx
  patch: |-
    - op: replace
      path: /spec/template/spec/nodeSelector
      value:
        ingress-ready: "true"
        kubernetes.io/os: linux

# Enable SSL passthrough so the publish-on-web passthrough TLS mode works on nginx.
# Without this controller flag the nginx.ingress.kubernetes.io/ssl-passthrough
# annotation is ignored. (ODCN's OpenShift Router does passthrough natively.)
- target:
    kind: Deployment
    name: ingress-nginx-controller
    namespace: ingress-nginx
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: --enable-ssl-passthrough
