# ArgoCD Application voor de RON-namespace op ODCN: de mailrelay (RC-114).
#
# Waarom een EIGEN Application en niet de regel in
# infrastructure/bootstrap/clusters/odcn/kustomization.yaml: de CMP-plugin injecteert
# `namespace: <destination>` op de rootkustomization die hij bouwt (regel ~272 van het
# pluginscript). Via staging-infrastructure is dat rig-staging-operations, en die
# transformatie zou de rig-staging-ron-resources van de mail-overlay platslaan naar
# rig-staging-operations - het ID-conflict dat de sandbox op 19 augustus 2026 al gemeten
# heeft. Een eigen namespace vergt dus een eigen Application, met destination
# rig-staging-ron: de namespace die de CMP dan injecteert is gelijk aan de namespace die de
# overlay zelf al zet.
#
# VOORDAT deze app kan renderen (de CMP stopt er anders hard mee, en de namespaced
# ArgoCD kan het geen van beide zelf):
#   1. de namespace rig-staging-ron bestaat: die staat als namespace-ron.yaml in deze
#      bootstrap-overlay en wordt door task bootstrap-argo-system met kubectl
#      aangebracht, met de RON-annotatie en het managed-by-label erop;
#   2. het secret sops-age-key staat in rig-staging-ron (de CMP leest de AGE-sleutel in de
#      namespace van de app); task bootstrap-argo-system zet het er sinds RC-261 zelf in.
# CreateNamespace staat bewust uit: zie punt 1.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ron-infrastructure
  namespace: rig-system
spec:
  project: default
  source:
    repoURL: https://github.com/RijksICTGilde/RIG-Cluster.git
    path: infrastructure/bootstrap/infrastructure/mail/controller/overlays/odcn-staging
    targetRevision: main
    plugin:
      name: kustomize-sops-v1.0
      env:
        - name: SOPS_KEY_SECRET
          value: "sops-age-key"
  destination:
    server: https://kubernetes.default.svc
    namespace: rig-staging-ron
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Expliciet, al is false de default: een lege render mag geen veegactie worden.
      # De inzet is hier klein (de relay is stateless, zijn data staat in rig-db en die
      # valt onder staging-infrastructure), maar het contract hoort op elke app.
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 2
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
