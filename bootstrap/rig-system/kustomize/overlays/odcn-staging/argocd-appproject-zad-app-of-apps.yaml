# Het AppProject van het app-of-apps (`user-applications`): alleen de argo-repo van
# staging als bron, alleen de ArgoCD-namespace als bestemming, en alleen de soorten die
# OPI in die repo schrijft. Zelfde constructie als in de odcn-production overlay.
#
# Staging draait een EIGEN ArgoCD in rig-staging-operations, dus dit AppProject staat
# naast dat van productie en deelt er niets mee.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zad-app-of-apps
  namespace: rig-system
spec:
  description: Het app-of-apps dat de Applications van de projecten synct
  sourceRepos:
    - https://user-applications@github.com/RijksICTGilde/zad-staging-argo-applications.git
  destinations:
    - namespace: rig-staging-operations
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  # De drie soorten die OPI per project in de argo-repo schrijft (argo_manager:
  # Application, AppProject, en het repository-Secret).
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: ''
      kind: Secret
