# De infrasecrets (Keycloak, PostgreSQL, MinIO, Redis, ...) uit de private repo
# zad-staging-secrets, map infrastructure/. RIG-Cluster is publiek; op staging staan de geheimen
# daarom niet in de overlays maar in die repo, zie features/zad-staging.md.
#
# Geen sync-wave: wat ze nodig heeft, wacht tot het secret er is en herstelt zich dan
# zelf. Sync-waves tussen Applications vragen een Lua health check en een herstart van
# de application-controller.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infrastructure-secrets
  namespace: rig-system
spec:
  project: default
  source:
    repoURL: https://secrets@github.com/RijksICTGilde/zad-staging-secrets.git
    path: infrastructure
    targetRevision: main
    plugin:
      name: kustomize-sops-v1.0
      env:
        - name: SOPS_KEY_SECRET
          value: "sops-age-key"
        - name: KUSTOMIZE_FOLDERS
          value: "current"
  destination:
    server: https://kubernetes.default.svc
    namespace: rig-staging-operations
  syncPolicy:
    automated:
      # Een secret dat uit git verdwijnt, blijft in het cluster staan: een verdwenen
      # render mag nooit de wachtwoorden van de database weghalen.
      prune: false
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 2
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
