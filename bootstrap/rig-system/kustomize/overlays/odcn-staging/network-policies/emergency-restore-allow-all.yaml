# TIJDELIJK, EN HIJ KRIMPT PER COMPONENT. LEES DIT VOOR JE HEM AANRAAKT.
#
# Allow-all over de pods in rig-staging-operations die nog geen eigen beleid dragen. Dit
# recreeert de effectieve netwerktoestand waar productie vanaf dag een onder liep tot
# 2026-06-10: de oorspronkelijke `allow-argo` was een podSelector:{}-allow-all en
# maskeerde elke restrictieve policy in de namespace (NetworkPolicies zijn additief).
#
# PR #64 versmalde allow-argo (de juiste beveiligingsfix), maar de eerste toepassing
# daarvan (bootstrap-run van 2026-06-10) liet zien dat geen andere workload een volledige
# policy had, Keycloak zelfs geen enkele, en brak productie (incident 2026-06-10:
# OPI/Keycloak/external-dns verloren database en uitgang).
#
# DE UITSLUITLIJST IS DE VOLGORDE. Een workload die in `matchExpressions` staat valt niet
# meer onder deze policy en draait op zijn eigen beleid. NotIn selecteert ook pods ZONDER
# het label, dus een onbekende pod blijft onder de allow-all vallen.
# Zie features/restrictive-network-policies.md voor de volgorde van de stappen en wat je per
# stap meet (ArgoCD-health, readiness, logs, login).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: emergency-restore-allow-all
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: NotIn
        values:
          - kube-state-metrics
          - external-dns
          - prometheus
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - {}
  egress:
    - {}
