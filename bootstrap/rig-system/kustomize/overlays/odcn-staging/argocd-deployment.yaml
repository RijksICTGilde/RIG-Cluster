apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: rig-system
spec:
  # RIG-eigen image: upstream v3.5.6 plus de namespace-sync en health-fixes uit
  # images/argocd-rig. Alle componenten volgen dit, inclusief repo-server (geen eigen pin).
  #
  # Via rcr.rijksapps.nl en niet via ghcr.io: ODCN kan ghcr niet bereiken, en dat pad is
  # voor de operations-manager al zo gezet. Het image moet dus in die spiegel staan
  # VOORDAT dit landt, anders blijft ArgoCD hangen op een pull die niet lukt.
  #
  # Een echte versietag en geen 'latest': dan is het uitrolbesluit een commit die je kunt
  # terugdraaien, en weet je achteraf welke build er draait.
  image: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/argocd-rig
  version: v3.5.6-rig1
  # Alleen keys die de operator in argocd-cm zet EN die ArgoCD daar leest. De
  # cmd-params-keys die hier stonden kwamen nooit bij een component aan (RC-250);
  # tests/test_argocd_extra_config_keys.py houdt dit blok daarvan vrij.
  # Op dit cluster veranderde weghalen niets: die waarden herhaalden de operator-default of
  # stonden langs de werkende route (spec.controller/spec.server) al goed.
  extraConfig:
    timeout.reconciliation: "15m"
    timeout.hard.reconciliation: "0s"
    # Het account waarmee OPI werkt: alleen apiKey, geen login, dus er is geen wachtwoord
    # om mee in te loggen. Het token zet `scripts/edit-secret.py --component
    # argocd-opi-token`.
    accounts.opi: apiKey
    # De enforce-beslissingen in de log van argocd-server. Die regel staat op debug-niveau
    # (gemeten 18-10-2026); de PermissionDenied-waarschuwing ernaast staat er altijd, met
    # subject, resource en actie.
    server.rbac.log.enforce.enable: "true"
  server:
    extraCommandArgs:
      - --repo-server-timeout-seconds=180
    host: argocd-staging.rig.prd1.gn2.quattro.rijksapps.nl
    autoscale:
      enabled: false
    grpc:
      ingress:
        enabled: false
    ingress:
      enabled: false
    resources:
      limits:
        cpu: "1"
        # Was 512Mi met een request van 128Mi, en daarop is de server vier keer OOMKilled
        # (exit 137). Steady state is ~375Mi, dus de request lag een factor 3 te laag en de
        # limit liet geen ruimte voor een piek. De request dekt nu het gemeten gebruik, de
        # limit geeft daarboven dezelfde marge nog een keer.
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 384Mi
    # TLS met certificaat uit het secret argocd-server-tls (gevuld door OpenShift service-CA).
    insecure: false
    route:
      annotations:
        # limit access to within VPN of ODCN
        haproxy.router.openshift.io/ip_whitelist: 147.181.15.230
      enabled: true
      tls:
        # reencrypt: de router zet TLS opnieuw op naar de server (versleuteld tot in het cluster).
        termination: reencrypt
        insecureEdgeTerminationPolicy: Redirect
    service:
      type: ''
  grafana:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  # De standaarduitsluitingen van de operator (overgenomen uit argocd-cm, want dit veld
  # vervangt ze) plus Calico. De application-controller van staging mag de Calico-
  # policies niet lijsten ("operation on Calico tiered policy is forbidden", gemeten
  # 19 oktober 2026); die van productie wel, vermoedelijk met een clusterbreed recht van
  # ODC-Noord. ArgoCD beheert geen Calico-objecten: OPI maakt networking.k8s.io-netpols.
  resourceExclusions: |
    - apiGroups:
      - ""
      - discovery.k8s.io
      kinds:
      - Endpoints
      - EndpointSlice
    - apiGroups:
      - apiregistration.k8s.io
      kinds:
      - APIService
    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
    - apiGroups:
      - projectcalico.org
      - crd.projectcalico.org
      kinds:
      - "*"
  resourceTrackingMethod: annotation
  monitoring:
    enabled: false
  notifications:
    enabled: false
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  initialSSHKnownHosts: {}
  applicationSet:
    resources:
      limits:
        cpu: 100m
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 256Mi
  # Least privilege per rol (RC-345). Welke RBAC-actie elke aanroep van OPI vraagt:
  #
  #   GET  /api/v1/applications                         applications, get
  #   GET  /api/v1/applications/{app}                   applications, get
  #   GET  /api/v1/applications/{app}?refresh=...       applications, get
  #   GET  /api/v1/applications/{app}/manifests         applications, get
  #   GET  /api/v1/applications/{app}/resource-tree     applications, get
  #   POST /api/v1/applications/{app}/sync              applications, sync
  #
  # Dat is de hele lijst (opi/connectors/argo.py); POST /api/v1/session valt weg zodra OPI
  # zijn API-token gebruikt. Aanmaken, wijzigen en verwijderen van een Application doet OPI
  # via git, en wat hij rechtstreeks op de CR doet loopt via de Kubernetes-API (de Role bij
  # operations-manager), niet via deze RBAC.
  rbac:
    defaultPolicy: 'role:none'
    policy: |-
      # Access Control
      p, role:none, applications, get, */*, deny
      p, role:none, certificates, get, *, deny
      p, role:none, clusters, get, *, deny
      p, role:none, repositories, get, *, deny
      p, role:none, projects, get, *, deny
      p, role:none, accounts, get, *, deny
      p, role:none, gpgkeys, get, *, deny
      # Het machine-account van OPI. Precies de twee acties uit de inventaris hierboven.
      p, role:zad-opi, applications, get, */*, allow
      p, role:zad-opi, applications, sync, */*, allow
      g, opi, role:zad-opi
      # Ontwikkelaars: deze rol draagt alleen de extra's bovenop role:readonly (syncen,
      # refreshen, resource-actions); de groep krijgt beide rollen. Geen create, update of
      # delete: een Application, AppProject of repository komt uit git en van OPI, of van
      # de admingroep.
      p, role:zad-developer, applications, sync, */*, allow
      p, role:zad-developer, applications, action/*, */*, allow
      g, system:cluster-admins, role:admin
      g, rig-staging-admin-group, role:admin
      g, rig-staging-developer-group, role:readonly
      g, rig-staging-developer-group, role:zad-developer
      g, rig-staging-viewer-group, role:readonly
    scopes: '[groups]'
  sso:
    dex:
      openShiftOAuth: true
      resources:
        limits:
          cpu: 100m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
    provider: dex
  repo:
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "180s"
      - name: ARGOCD_GIT_ATTEMPTS_COUNT
        value: "3"
      - name: ARGOCD_HELM_ALLOW_CONCURRENCY
        value: "true"
    resources:
      limits:
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 250m
        memory: 256Mi
    serviceaccount: argocd-cmp
    sidecarContainers:
      - name: cmp-server
        command:
          - /var/run/argocd/argocd-cmp-server
        image: rig-cmp-argo-kustomize-sops:latest
        imagePullPolicy: IfNotPresent
        env:
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180s"
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config
            name: cmp-plugin
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
  resourceHealthChecks:
    - check: |
        hs = {}
        if obj.status ~= nil and obj.status.readyInstances ~= nil then
            if obj.status.readyInstances == obj.spec.instances then
                hs.status = "Healthy"
                hs.message = obj.status.phase
                return hs
            end
            if obj.status.instancesStatus.failed ~= nil then
                hs.status = "Degraded"
                hs.message = obj.status.phase
                return hs
            end
        end
        hs.status = "Progressing"
        hs.message = obj.status.phase
        return hs
      group: postgresql.cnpg.io
      kind: Cluster
  ha:
    enabled: false
  tls:
    ca: {}
  redis:
    resources:
      limits:
        cpu: "500m"
        memory: 256Mi
      requests:
        cpu: "250m"
        memory: 64Mi
  controller:
    extraCommandArgs:
      - --repo-server-timeout-seconds=180
      # De bovengrens op een sync-operation; de default 0 is nooit. Als flag en niet als
      # extraConfig-key, want geen enkele cmd-params-key bereikt onder deze operator de
      # controller. Waarom dit nodig is en waarom 600: features/vastgelopen-sync-breekt-af.md.
      - --sync-timeout=600
    env:
      - name: ARGOCD_REPO_SERVER_TIMEOUT_SECONDS
        value: "180"
      - name: ARGOCD_K8S_CLIENT_QPS
        value: "50"
      - name: ARGOCD_K8S_CLIENT_BURST
        value: "100"
    processors: {}
    resources:
      limits:
        cpu: "4"
        memory: 8Gi
      requests:
        cpu: "1"
        memory: 4Gi
    # Sharding disabled - not needed for current cluster size.
    # Enable when managing 100+ applications for better performance.
    # sharding:
    #   enabled: true
    #   replicas: 2
