# Het AppProject van het app-of-apps (`user-applications`): alleen de argo-repo in Forgejo
# als bron, alleen de ArgoCD-namespace als bestemming, en alleen de soorten die OPI in die
# repo schrijft. Zelfde constructie als in de odcn-production overlay.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zad-app-of-apps
  namespace: rig-system
spec:
  description: Het app-of-apps dat de Applications van de projecten synct
  sourceRepos:
    - http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/zad-argo-user-applications.git
  destinations:
    - namespace: rig-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  # De drie soorten die OPI per project in de argo-repo schrijft (argo_manager:
  # Application, AppProject, en het repository-Secret).
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject
    - group: ''
      kind: Secret
