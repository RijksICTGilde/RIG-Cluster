apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: rig-system
  annotations:
    policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
spec:
  # RIG-eigen image: upstream v3.5.1 + de namespace-sync en health-fixes uit images/argocd-rig.
  # Alle componenten volgen dit, behalve repo-server (zie spec.repo hieronder) — zo is de
  # sandbox dezelfde vorm als odcn-production, waar repo-server op de Red Hat build blijft.
  # Uit de publieke registry, zodat de sandbox hem via GitOps binnenhaalt in plaats van
  # via `task load-kind`; die taak blijft bestaan om een lokale build te testen voor je
  # publiceert (bouw dan met IMAGE_TAG=<iets anders> en pin die tag hier tijdelijk).
  image: ghcr.io/minbzk/base-images/argocd-rig
  version: v3.5.1-rig2
  # Alleen keys die de operator in argocd-cm zet EN die ArgoCD daar leest. De
  # cmd-params-keys die hier stonden kwamen nooit bij een component aan (RC-250);
  # tests/test_argocd_extra_config_keys.py houdt dit blok daarvan vrij.
  extraConfig:
    resource.customizations.health.cert-manager.io_Issuer: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Fake CRD - no controller"
      return hs
    timeout.reconciliation: "6m"
    timeout.hard.reconciliation: "0s"
  server:
    logLevel: debug
    insecure: true
    host: argo.sandbox.rijksapp.dev
    ingress:
      enabled: true
      path: /
      ingressClassName: nginx
      tls:
      - hosts:
        - argo.sandbox.rijksapp.dev
        secretName: sandbox-wildcard-tls
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  controller:
    extraCommandArgs:
      # De bovengrens op een sync-operation; de default 0 is nooit. Als flag en niet als
      # extraConfig-key, want geen enkele cmd-params-key bereikt onder deze operator de
      # controller. Waarom dit nodig is en waarom 600: features/vastgelopen-sync-breekt-af.md.
      - --sync-timeout=600
    env:
      - name: ARGOCD_K8S_CLIENT_QPS
        value: "150"
      - name: ARGOCD_K8S_CLIENT_BURST
        value: "300"
    # Sandbox-CPU-beleid: minimale request, geen cpu-limit — zie de toelichting in
    # infrastructure/bootstrap/clusters/sandboxed-local/kustomization.yaml. De controller
    # en applicationSet vroegen samen 2 van de 4 cores van de dev-server op; daardoor paste
    # keycloak (2 CPU) er niet meer bij en bleef die Pending.
    resources:
      limits:
        memory: 2Gi
      requests:
        cpu: 50m
        memory: 512Mi
  applicationSet:
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 25m
        memory: 128Mi
  # ⚠️  De sops-plugin component (zie kustomization.yaml) doet `op: replace` op /spec/repo:
  #     ALLES wat hieronder staat wordt bij het renderen weggegooid. Wat echt moet landen,
  #     hoort als patch in kustomization.yaml, ná de component — daar staan nu image/version
  #     en de env vars. De rest hieronder is momenteel dood gewicht (annotations, resources,
  #     en de securityContext/volumeMounts van de sidecar); verifieer met
  #     `kustomize build <overlay> | grep -A20 '^  repo:'` voor je hier iets aan verandert.
  repo:
    annotations:
      policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
    resources:
      limits:
        cpu: 5
        memory: 2Gi
      requests:
        cpu: 1
        memory: 256Mi
    serviceaccount: argocd-argocd-server
    sidecarContainers:
      - name: cmp-server
        command:
          - /var/run/argocd/argocd-cmp-server
        image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:latest
        imagePullPolicy: Always
        env:
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180s"
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /etc/kustomize/plugin
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config
            name: cmp-plugin
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
