apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: rig-system
  annotations:
    policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
spec:
  # RIG-eigen image: upstream v3.3.12 + de namespace-sync fixes uit images/argocd-rig.
  # Alle componenten volgen dit, behalve repo-server (zie spec.repo hieronder) — zo is de
  # sandbox dezelfde vorm als odcn-production, waar repo-server op de Red Hat build blijft.
  # Uit de publieke registry, zodat de sandbox hem via GitOps binnenhaalt in plaats van
  # via `task load-kind`; die taak blijft bestaan om een lokale build te testen voor je
  # publiceert (bouw dan met IMAGE_TAG=<iets anders> en pin die tag hier tijdelijk).
  image: ghcr.io/minbzk/base-images/argocd-rig
  version: v3.3.12-rig1
  extraConfig:
    resource.customizations.health.cert-manager.io_Issuer: |
      hs = {}
      hs.status = "Healthy"
      hs.message = "Fake CRD - no controller"
      return hs
    timeout.reconciliation: "6m"
    timeout.hard.reconciliation: "0s"
    server.repo.server.timeout.seconds: "180"
    controller.status.processors: "60"
    controller.operation.processors: "30"
    controller.repo.server.timeout.seconds: "180"
    controller.kubectl.parallelism.limit: "20"
    controller.sharding.algorithm: "round-robin"
    reposerver.parallelism.limit: "20"
  server:
    logLevel: debug
    insecure: true
    host: argo.sandbox.rijksapp.dev
    ingress:
      enabled: true
      path: /
      ingressClassName: nginx
      tls:
      - hosts:
        - argo.sandbox.rijksapp.dev
        secretName: sandbox-wildcard-tls
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  controller:
    env:
      - name: ARGOCD_K8S_CLIENT_QPS
        value: "150"
      - name: ARGOCD_K8S_CLIENT_BURST
        value: "300"
    resources:
      limits:
        cpu: 5
        memory: 2Gi
      requests:
        cpu: 1
        memory: 512Mi
  applicationSet:
    resources:
      limits:
        cpu: 5
        memory: 256Mi
      requests:
        cpu: 1
        memory: 128Mi
  # ⚠️  De sops-plugin component (zie kustomization.yaml) doet `op: replace` op /spec/repo:
  #     ALLES wat hieronder staat wordt bij het renderen weggegooid. Wat echt moet landen,
  #     hoort als patch in kustomization.yaml, ná de component — daar staan nu image/version
  #     en de env vars. De rest hieronder is momenteel dood gewicht (annotations, resources,
  #     en de securityContext/volumeMounts van de sidecar); verifieer met
  #     `kustomize build <overlay> | grep -A20 '^  repo:'` voor je hier iets aan verandert.
  repo:
    annotations:
      policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
    resources:
      limits:
        cpu: 5
        memory: 2Gi
      requests:
        cpu: 1
        memory: 256Mi
    serviceaccount: argocd-argocd-server
    sidecarContainers:
      - name: cmp-server
        command:
          - /var/run/argocd/argocd-cmp-server
        image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:latest
        imagePullPolicy: Always
        env:
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180"
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /etc/kustomize/plugin
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config
            name: cmp-plugin
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
