apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# namespace: rig-system # NOTE: we can not set the namespace here, this breaks the nginx deploy

generators:
- decrypt-sops.yaml

# Environment-specific configuration
resources:
# CSI Snapshot support (VolumeSnapshots for PVC backups)
- ../../csi-snapshot/base
- namespace.yaml
- argocd-deployment.yaml
- argocd-admin-secret.yaml
- argocd-repo-forgejo-secret.yaml
- argocd-application-infrastructure.yaml
- argocd-application-user-applications.yaml
- ../../operations-manager/overlays/sandboxed-local
# Backup destination MinIO for local development/testing
- ../../backup-destination/base

components:
- ../../components/sops-plugin

patches:
- target:
    kind: ArgoCD
    name: argocd
  patch: |-
    - op: replace
      path: /spec/repo/sidecarContainers/0/imagePullPolicy
      value: Never
