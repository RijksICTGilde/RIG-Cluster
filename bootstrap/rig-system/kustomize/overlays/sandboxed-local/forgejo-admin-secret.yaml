# Het enige Forgejo-wachtwoord in de sandbox, met drie lezers en nul kopieen:
#
# 1. de init-Job (forgejo/config/base/bootstrap-job.yaml) maakt hiermee het account aan,
# 2. ArgoCD gebruikt het als `repo-creds`, een credential voor elke repo-URL die met `url`
#    begint, dus ook voor de per-project repository-secrets die OPI wegschrijft,
# 3. de operations-manager leest het via secretKeyRef.
#
# Hij staat in de bootstrap-overlay en niet bij Forgejo zelf, omdat ArgoCD hier zijn eigen
# infrastructuur uit Forgejo leest: de credential moet er zijn voordat ArgoCD iets kan
# ophalen.
#
# Vast dev-wachtwoord, zelfde afweging als SECRET_KEY en ADMIN_API_KEY in de
# operations-manager-configmap: wegwerpcluster, niet bereikbaar van buiten. Op een echt
# cluster komt ditzelfde secret uit de secret-generatie en is het AGE-versleuteld.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: forgejo-admin
  namespace: rig-system
  labels:
    app.kubernetes.io/part-of: forgejo
    app.kubernetes.io/component: admin-credential
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: http://forgejo.rig-system.svc.cluster.local:3000
  username: rig-admin
  password: admin1234
