# ArgoCD Application for user applications - points to Forgejo zad-argo-user-applications repo
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-applications
  namespace: rig-system
spec:
  project: rig-platform
  sources:
    - repoURL: http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/zad-argo-user-applications.git
      path: .
      targetRevision: main
      plugin:
        name: kustomize-sops-v1.0
        env:
          - name: SOPS_KEY_SECRET
            value: "sops-age-key"
          - name: KUSTOMIZE_FOLDERS
            value: "subfolders"
  destination:
    server: https://kubernetes.default.svc
    namespace: "rig-system"
  syncPolicy:
    automated:
      # OPI is the only writer of this repo. An empty render is always a bug
      # (bad commit, kustomize yielding nothing), never a desired state, and
      # combined with prune it would delete every tenant Application, whose
      # finalizers then cascade into their workloads and PVCs.
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Alleen OutOfSync-resources toepassen; zelfde afweging als in de odcn-production
      # overlay: opi is de enige schrijver van deze Application-CR's, dus het diff-oordeel
      # is betrouwbaar en een volle apply van alle Applications per sync voegt niets toe.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: -1
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
