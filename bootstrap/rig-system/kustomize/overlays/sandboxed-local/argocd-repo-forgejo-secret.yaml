# ArgoCD-credentials voor de Forgejo-repositories (HTTP basic auth, rig-admin/admin1234).
# Zie features/forgejo-repositories-prive.md voor details.
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-repo-secret
  namespace: rig-system
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: git
  url: http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/
  username: rig-admin
  password: admin1234
---
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-external-repo-secret
  namespace: rig-system
  labels:
    argocd.argoproj.io/secret-type: repo-creds
type: Opaque
stringData:
  type: git
  url: https://forgejo.sandbox.rijksapp.dev/rig-admin/
  username: rig-admin
  password: admin1234
