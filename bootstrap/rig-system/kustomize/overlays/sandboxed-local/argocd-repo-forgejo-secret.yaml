# ArgoCD repository credential for Forgejo (HTTP basic auth, rig-admin/admin1234)
apiVersion: v1
kind: Secret
metadata:
  name: forgejo-repo-secret
  namespace: rig-system
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: http://forgejo.rig-system.svc.cluster.local:3000
  name: forgejo-git-repos
  username: rig-admin
  password: admin1234
