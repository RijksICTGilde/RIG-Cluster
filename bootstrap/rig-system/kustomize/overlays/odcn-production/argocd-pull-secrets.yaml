# De ArgoCD-pods moeten hun image bij RCR kunnen ophalen, en daar hoort een inlog bij.
#
# WAAROM DIT ER IS. Sinds ArgoCD op onze eigen image draait (zie argocd-deployment.yaml)
# komt hij van rcr.rijksapps.nl, en die proxy vraagt authenticatie -- ook voor een image
# dat op ghcr publiek is. Zonder inlog geeft de pull:
#
#   Failed to pull image ".../argocd-rig:v3.5.1-rig1": unable to retrieve auth token:
#   invalid username/password: authentication required
#
# Gemeten op 17 augustus 2026 tijdens de uitrol: alle nieuwe ArgoCD-pods bleven in
# ImagePullBackOff staan, en de application-controller lag eruit (een StatefulSet met een
# pod, dus er was geen oude meer om op terug te vallen). De operations-manager pullde
# ondertussen probleemloos uit precies dezelfde proxy, en het verschil was dit:
#
#   operations-manager  imagePullSecrets: [rig-robot-pull-secret, ghcr-rig-robot-pull-secret]
#   argocd-controller   imagePullSecrets: (leeg)
#
# WAAROM VIA DE SERVICEACCOUNT EN NIET VIA DE CR. De ArgoCD-CR kent geen
# imagePullSecrets: een server-dry-run geeft `unknown field "spec.imagePullSecrets"`.
# Alleen `spec.repo` heeft een `serviceaccount`-veld; de controller, de server, dex en de
# applicationset-controller niet. Kubernetes voegt de imagePullSecrets van een
# SERVICEACCOUNT vanzelf toe aan elke pod die hem gebruikt, dus langs deze weg hoeft de
# operator er niets van te weten en hoeven wij zijn pods niet te patchen.
#
# De secrets zelf zijn van ODCN en staan al 406 dagen in de namespace, een per upstream
# registry (ghcr, dockerhub, quay, gcr). We maken ze hier dus niet aan, we verwijzen ernaar.
#
# LET OP: deze serviceaccounts worden door de ArgoCD-operator aangemaakt. Dit bestand zet
# er alleen het pull-secret bij. Blijkt de operator het er ooit weer af te halen, dan is
# dat hier zichtbaar doordat de pods opnieuw in ImagePullBackOff komen; bij de meting van
# 17 augustus liet hij het staan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-argocd-application-controller
imagePullSecrets:
  - name: ghcr-rig-robot-pull-secret
---
# Bedient zowel argocd-server als de repo-server (inclusief de CMP-sidecar).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-argocd-server
imagePullSecrets:
  - name: ghcr-rig-robot-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-applicationset-controller
imagePullSecrets:
  - name: ghcr-rig-robot-pull-secret
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-argocd-dex-server
imagePullSecrets:
  - name: ghcr-rig-robot-pull-secret
