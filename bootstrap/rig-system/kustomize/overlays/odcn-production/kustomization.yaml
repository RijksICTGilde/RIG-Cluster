apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-operations

generators:
  - decrypt-sops.yaml

resources:
- namespace.yaml
# namespace-ron.yaml staat hier BEWUST NIET bij: de namespace-transformer van deze
# kustomization hernoemt elk Namespace-object naar rig-prd-operations (gemeten
# 21 augustus 2026 als ID-conflict). task bootstrap-argo-system past dat bestand
# daarom los toe, met kale kubectl.
- argocd-deployment.yaml
- argocd-pull-secrets.yaml
- network-policies/argocd-network-policy.yaml
- network-policies/acme-solver-network-policy.yaml
- network-policies/emergency-restore-allow-all.yaml
- ../../operations-manager/overlays/odcn-production
# De AppProjects: default dicht, en een begrensd project voor het app-of-apps en een voor
# de platform-apps. De Applications hieronder verwijzen ernaar.
- ../../appprojects
- argocd-appproject-zad-app-of-apps.yaml
- argocd-appproject-zad-platform.yaml
- argocd-application-production-infrastructure.yaml
- argocd-application-user-applications.yaml
# De mailrelay in zijn eigen RON-namespace (RC-114). UIT gezet op de avond van
# 21 augustus 2026 na de stille crashlus van die middag, en weer AAN zodra de RCA
# rond was. Wat het was: Stalwart hangt 60 seconden op een spamfilter-download die
# hij doet VOORDAT zijn logger bestaat, en de liveness-probe kilde hem 10 seconden
# voor de listeners bonden. De 14 sleutels tegen 3411 op de sandbox waren precies
# die niet-geimporteerde spamfilterregels, en "er luistert niets, zelfs niet op
# loopback" was elke test die in het venster voor seconde 60 viel. Analyse en fix
# staan in het blok [spam-filter] van
# infrastructure/bootstrap/infrastructure/mail/controller/base/config.toml.
#
# GEVERIFIEERD op productie na de fix: eerste logregel 1 seconde na containerstart
# in plaats van 60, pod 1/1 zonder herstarts, en poort 587 antwoordt met een
# EHLO-lijst die SIZE 15728640 draagt - onze eigen waarde uit config.toml, dus de
# relay draait op onze configuratie en niet op productdefaults.
#
# Via deze eigen Application en NIET via de mail-regel in
# infrastructure/bootstrap/clusters/odcn: de CMP zou die build naar
# rig-prd-operations platslaan, zie de kop van het Application-bestand.
- argocd-application-ron-infrastructure.yaml

components:
# De gedeelde CMP-inrichting van ODCN: de pull-secret op de eigen SA van de repo-server,
# het gepinde image voor beide sidecars, hun env en resources. Deze component neemt
# sops-plugin zelf op. Alleen het UID hieronder is per cluster.
- ../../components/cmp-odcn

patches:
  # TESTING: use the userid assigned by openshift to our CMP instead of 999
  - target:
      kind: ArgoCD
      name: argocd
    patch: |-
      # Het begin van het UID-bereik dat OpenShift aan rig-prd-operations gaf
      # (annotatie openshift.io/sa.scc.uid-range). Wordt de namespace opnieuw
      # aangemaakt, dan krijgt hij een ander bereik en moet dit getal mee.
      - op: replace
        path: /spec/repo/sidecarContainers/0/securityContext/runAsUser
        value: 1001620000
      - op: replace
        path: /spec/repo/sidecarContainers/1/securityContext/runAsUser
        value: 1001620000
