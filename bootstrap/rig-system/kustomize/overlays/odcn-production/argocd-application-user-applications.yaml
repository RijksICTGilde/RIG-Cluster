apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-applications
  namespace: rig-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Deploy after infrastructure
spec:
  project: rig-platform
  sources:
    - repoURL: https://user-applications@github.com/RijksICTGilde/argo-applications.git
      path: odcn-production
      targetRevision: main
      plugin:
        name: kustomize-sops-v1.0
        env:
          - name: SOPS_KEY_SECRET
            value: "sops-age-key"
          - name: KUSTOMIZE_FOLDERS
            value: "subfolders"  # or "current" or "all"
  destination:
    server: https://kubernetes.default.svc
    namespace: "rig-prd-operations"
  syncPolicy:
    automated:
      # OPI is the only writer of this repo. An empty render is always a bug
      # (bad commit, kustomize yielding nothing), never a desired state, and
      # combined with prune it would delete every tenant Application, whose
      # finalizers then cascade into their workloads and PVCs.
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Alleen OutOfSync-resources toepassen. Deze app beheert uitsluitend Application-CR's
      # die opi genereert (opi is de enige schrijver, geen webhooks die eraan muteren), dus
      # het diff-oordeel is hier betrouwbaar. Zonder deze optie past elke sync alle ~138
      # Applications opnieuw toe; dat kostte ~45s per projectaanmaak voordat het nieuwe
      # Application-object uberhaupt bestond.
      - ApplyOutOfSyncOnly=true
    retry:
      limit: -1                    # Number of retry attempts
      backoff:
        duration: "30s"            # Initial retry delay
        factor: 1                  # Don't increase delay
        maxDuration: "30s"         # Maximum retry delay
