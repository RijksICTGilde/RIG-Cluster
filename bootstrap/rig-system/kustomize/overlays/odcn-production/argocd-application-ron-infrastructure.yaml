# ArgoCD Application voor de RON-namespace op ODCN: de mailrelay (RC-114).
#
# Waarom een EIGEN Application en niet de regel in
# infrastructure/bootstrap/clusters/odcn/kustomization.yaml: de CMP-plugin injecteert
# `namespace: <destination>` op de rootkustomization die hij bouwt (regel ~272 van het
# pluginscript). Via production-infrastructure is dat rig-prd-operations, en die
# transformatie zou de rig-prd-ron-resources van de mail-overlay platslaan naar
# rig-prd-operations - het ID-conflict dat de sandbox op 19 augustus 2026 al gemeten
# heeft. Een eigen namespace vergt dus een eigen Application, met destination
# rig-prd-ron: de namespace die de CMP dan injecteert is gelijk aan de namespace die de
# overlay zelf al zet.
#
# VOORDAT deze app kan renderen moet de namespace rig-prd-ron bestaan: die staat als
# namespace-ron.yaml in deze bootstrap-overlay en wordt door task bootstrap-argo-system
# met kubectl aangebracht, met de RON-annotatie en het managed-by-label erop.
# CreateNamespace staat bewust uit, om dezelfde reden.
#
# Een sops-age-key in rig-prd-ron is sinds RC-351 niet meer nodig: deze app rendert op de
# platform-plugin, die de sleutel uit de mount in de cmp-platform-sidecar leest in plaats
# van uit de bestemmingsnamespace.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ron-infrastructure
  namespace: rig-system
spec:
  project: zad-platform
  source:
    repoURL: https://infrastructure@github.com/RijksICTGilde/RIG-Cluster.git
    path: infrastructure/bootstrap/infrastructure/mail/controller/overlays/odcn
    targetRevision: main
    plugin:
      name: kustomize-sops-platform-v1.0
      env:
        - name: SOPS_KEY_SECRET
          value: "sops-age-key"
  destination:
    server: https://kubernetes.default.svc
    namespace: rig-prd-ron
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      # Expliciet, al is false de default: een lege render mag geen veegactie worden.
      # De inzet is hier klein (de relay is stateless, zijn data staat in rig-db en die
      # valt onder production-infrastructure), maar het contract hoort op elke app.
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 2
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
