# De RON-namespace, aangemaakt door de BOOTSTRAP (task bootstrap-argo-system past dit
# bestand LOS toe, met kale kubectl) en niet door ArgoCD: die draait op ODCN in
# namespaced mode en kan geen Namespace-resources beheren. Los, en niet via de
# kustomization hiernaast: haar namespace-transformer hernoemt elk Namespace-object
# naar rig-prd-operations. De ron-infrastructure Application deployt er vervolgens IN,
# en de CMP eist dat hij bestaat voordat er ook maar iets rendert.
#
# Wat er naast de namespace nog nodig is en niet uit git kan komen: het secret
# sops-age-key in deze namespace (de CMP leest de AGE-sleutel in de namespace van de
# app). Kopieer hem uit rig-prd-operations; het commando staat in features/send-email.md
# bij de aanzetstappen.
apiVersion: v1
kind: Namespace
metadata:
  name: rig-prd-ron
  labels:
    app.kubernetes.io/name: operations-ron
    app.kubernetes.io/component: mail
    app.kubernetes.io/part-of: rig-platform
    # De argocd-operator maakt hiermee de beheer-RBAC voor de namespaced ArgoCD aan;
    # zonder dit label kan de ron-infrastructure app hier niets beheren.
    argocd.argoproj.io/managed-by: rig-prd-operations
  annotations:
    # DE RON-KOPPELING. Deze annotatie neemt exact een waarde, dus RON en internet
    # kunnen niet allebei op dezelfde namespace staan; dat is de reden dat de relay een
    # eigen namespace heeft (plans/mailrelay.md, aanvulling 2, docs/ron-koppeling.md).
    egress.projectcalico.org/egressGatewayPolicy: "rig-ron"
