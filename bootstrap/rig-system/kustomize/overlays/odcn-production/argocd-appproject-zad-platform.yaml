# Het AppProject van de twee platform-apps (`production-infrastructure` en
# `ron-infrastructure`): alleen deze repo als bron en alleen de twee platformnamespaces
# als bestemming.
#
# De lijst hieronder is gemeten op de render van main, niet geraden, en is dus zo breed
# als de infrastructuur van dit cluster vandaag rendert. Een component dat een NIEUWE
# soort meebrengt (een ingeschakelde vault, een ScheduledBackup) laat de sync hierop
# vallen met een duidelijke melding; die soort hoort er dan bij. Cluster-scoped blijft
# leeg: de ArgoCD op ODCN draait namespaced en rendert niets cluster-scoped.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: zad-platform
  namespace: rig-system
spec:
  description: De platform-infrastructuur uit de RIG-Cluster repo
  sourceRepos:
    - https://infrastructure@github.com/RijksICTGilde/RIG-Cluster.git
  destinations:
    - namespace: rig-prd-operations
      server: https://kubernetes.default.svc
    - namespace: rig-prd-ron
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: Secret
    - group: ''
      kind: Service
    - group: ''
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: batch
      kind: CronJob
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cert-manager.io
      kind: Issuer
    - group: monitoring.coreos.com
      kind: PodMonitor
    - group: postgresql.cnpg.io
      kind: Cluster
    - group: postgresql.cnpg.io
      kind: Database
