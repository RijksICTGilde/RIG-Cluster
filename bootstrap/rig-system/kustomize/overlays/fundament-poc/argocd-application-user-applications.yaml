apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-applications
  namespace: rig-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Na de infrastructuur
spec:
  project: zad-platform
  sources:
    - repoURL: https://user-applications@github.com/RijksICTGilde/argo-applications.git
      # Deze map moet in de argo-applications repo bestaan voor de eerste sync slaagt.
      path: fundament-poc
      targetRevision: main
      plugin:
        name: kustomize-sops-v1.0
        env:
          - name: SOPS_KEY_SECRET
            value: "sops-age-key"
          - name: KUSTOMIZE_FOLDERS
            value: "subfolders"
  destination:
    server: https://kubernetes.default.svc
    namespace: "rig-system"
  syncPolicy:
    automated:
      # OPI is de enige schrijver van deze repo. Een lege render is altijd een fout
      # (verkeerde commit, kustomize die niets oplevert) en nooit een gewenste toestand;
      # samen met prune zou dat elke tenant-Application verwijderen, waarna hun
      # finalizers doorwerken naar de workloads en PVC's.
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: -1
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
