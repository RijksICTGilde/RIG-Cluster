apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-applications
  namespace: rig-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"  # Na de infrastructuur
spec:
  project: zad-platform
  sources:
    # De Forgejo in dit cluster. Geen gebruikersnaam in de URL zoals bij de GitHub-repo's:
    # die truc bestond om twee repo's op dezelfde host uit elkaar te houden voor ArgoCD.
    # De credential is nu een repo-creds op de host-URL (secret forgejo-admin), en die
    # geldt voor elke repo eronder.
    - repoURL: http://forgejo.rig-system.svc.cluster.local:3000/rig-admin/zad-argo-user-applications.git
      # OPI schrijft per cluster in een eigen map (zie service_orphan_sweep.py), dus ook in
      # een repo die alleen van dit cluster is blijft dit pad staan. De map moet bestaan
      # voordat de eerste sync slaagt; OPI maakt hem bij het eerste project.
      path: fundament-poc
      targetRevision: main
      plugin:
        name: kustomize-sops-v1.0
        env:
          - name: SOPS_KEY_SECRET
            value: "sops-age-key"
          - name: KUSTOMIZE_FOLDERS
            value: "subfolders"
  destination:
    server: https://kubernetes.default.svc
    namespace: "rig-system"
  syncPolicy:
    automated:
      # OPI is de enige schrijver van deze repo. Een lege render is altijd een fout
      # (verkeerde commit, kustomize die niets oplevert) en nooit een gewenste toestand;
      # samen met prune zou dat elke tenant-Application verwijderen, waarna hun
      # finalizers doorwerken naar de workloads en PVC's.
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: -1
      backoff:
        duration: "30s"
        factor: 1
        maxDuration: "30s"
