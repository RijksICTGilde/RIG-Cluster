apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: rig-system
spec:
  # Zelfde RIG-image als de andere clusters: upstream plus de namespace-sync en
  # health-fixes uit images/argocd-rig. Repo-server blijft op upstream, zie spec.repo.
  image: ghcr.io/minbzk/base-images/argocd-rig
  version: v3.5.1-rig1
  extraConfig:
    # ArgoCD bepaalt standaard via het label app.kubernetes.io/instance bij welke
    # Application een resource hoort. Dat botst met manifesten die dat label zelf zetten:
    # de upstream cert-manager doet dat, met de waarde 'cert-manager'. ArgoCD las daaruit
    # dat de CRD's bij een app met die naam horen, die niet bestaat, en meldde
    # SharedResourceWarning op fundament-poc-cert-manager.
    #
    # Met 'annotation' volgt hij op argocd.argoproj.io/tracking-id en laat hij het label
    # met rust. Dat is ook wat de ArgoCD-documentatie aanraadt zodra een applicatie zijn
    # eigen instance-label meebrengt. Geverifieerd dat niets in deze repo op dat label
    # leunt: niet in OPI, niet in de manifesten.
    application.resourceTrackingMethod: annotation

    # Zonder deze check doen de sync-waves van de app-of-apps niets. ArgoCD levert voor
    # het type Application geen health-check mee (resource_customizations/argoproj.io/
    # Application bevat alleen 'actions'), en een wave wacht op Healthy. Een kind zonder
    # health-oordeel is niets om op te wachten, dus schoof elke wave meteen door en werden
    # alle zestien Applications in dezelfde seconde aangemaakt. Gevolg: keycloak startte
    # terwijl wave 1 nog geen database had.
    #
    # Bewust alleen op status.health en NIET ook op status.sync: twee Applications staan
    # hier blijvend OutOfSync om onschuldige redenen (lege sleutels in een Secret,
    # verdwenen admission-Jobs). Zou Synced meetellen, dan bleef de root eeuwig op die
    # waves hangen en zou het middel erger zijn dan de kwaal.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = "Wacht op de status van de onderliggende Application"
      if obj.status ~= nil and obj.status.health ~= nil and obj.status.health.status ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
      return hs
    timeout.reconciliation: "6m"
    timeout.hard.reconciliation: "0s"
    server.repo.server.timeout.seconds: "180"
    controller.status.processors: "60"
    controller.operation.processors: "30"
    controller.repo.server.timeout.seconds: "180"
    controller.kubectl.parallelism.limit: "20"
    controller.sharding.algorithm: "round-robin"
    reposerver.parallelism.limit: "20"
  server:
    logLevel: info
    # nginx termineert TLS, dus ArgoCD zelf draait onversleuteld achter de ingress.
    insecure: true
    host: argo.fundament-poc.rijksapp.dev
    ingress:
      enabled: true
      path: /
      ingressClassName: nginx
      annotations:
        # Let's Encrypt via cert-manager. Werkt pas zodra het A-record
        # router.fundament-poc.rijksapp.dev bestaat en naar het ingress-adres wijst;
        # tot dan blijft de ACME-challenge falen en is er geen certificaat.
        cert-manager.io/issuer: letsencrypt-operations-manager
        cert-manager.io/private-key-algorithm: ECDSA
        cert-manager.io/private-key-size: "384"
        cert-manager.io/private-key-rotation-policy: Always
      tls:
        - hosts:
            - argo.fundament-poc.rijksapp.dev
          secretName: argocd-fundament-poc-tls
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  controller:
    env:
      - name: ARGOCD_K8S_CLIENT_QPS
        value: "150"
      - name: ARGOCD_K8S_CLIENT_BURST
        value: "300"
    # Anders dan de sandbox knijpen we hier niet: die draait op een dev-server met vier
    # cores, dit cluster heeft er 32. Wel een geheugenlimiet, want geheugen is
    # incompressible en zonder limiet krijg je OOM-kills in plaats van vertraging.
    resources:
      limits:
        memory: 4Gi
      requests:
        cpu: 250m
        memory: 1Gi
  applicationSet:
    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi
  # Let op: de sops-plugin component uit kustomization.yaml doet `op: replace` op
  # /spec/repo, dus alles wat hier onder repo staat wordt bij het renderen weggegooid.
  # Wat echt moet landen hoort als patch in kustomization.yaml, na de component.
  # Verifieer met: kustomize build <overlay> | grep -A20 '^  repo:'
  repo:
    resources:
      limits:
        cpu: 4
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 256Mi
    serviceaccount: argocd-argocd-server
