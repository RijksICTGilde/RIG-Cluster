apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: rig-system
  annotations:
    policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
spec:
  # Alleen keys die de operator in argocd-cm zet EN die ArgoCD daar leest. De
  # cmd-params-keys die hier stonden kwamen nooit bij een component aan (RC-250);
  # tests/test_argocd_extra_config_keys.py houdt dit blok daarvan vrij.
  extraConfig:
    timeout.reconciliation: "6m"
    timeout.hard.reconciliation: "0s"
  server:
    logLevel: debug
    insecure: true
    host: argo.kind
    ingress:
      enabled: true
      path: /
      ingressClassName: nginx
  prometheus:
    enabled: false
    ingress:
      enabled: false
    route:
      enabled: false
  controller:
    extraCommandArgs:
      # De bovengrens op een sync-operation; de default 0 is nooit. Als flag en niet als
      # extraConfig-key, want geen enkele cmd-params-key bereikt onder deze operator de
      # controller. Waarom dit nodig is en waarom 600: features/vastgelopen-sync-breekt-af.md.
      - --sync-timeout=600
    env:
      - name: ARGOCD_K8S_CLIENT_QPS
        value: "150"
      - name: ARGOCD_K8S_CLIENT_BURST
        value: "300"
    resources:
      limits:
        cpu: 5
        memory: 2Gi
      requests:
        cpu: 1
        memory: 512Mi
  applicationSet:
    resources:
      limits:
        cpu: 5
        memory: 256Mi
      requests:
        cpu: 1
        memory: 128Mi
  repo:
    annotations:
      policies.kyverno.io/exclude: "disallow-capabilities-strict,disallow-privilege-escalation,restrict-seccomp-strict"
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "180s"
      - name: ARGOCD_GIT_ATTEMPTS_COUNT
        value: "3"
      - name: ARGOCD_HELM_ALLOW_CONCURRENCY
        value: "true"
      # Stream only the app's manifest-generate-paths dir to the CMP instead of
      # tarring the whole monorepo per render (see issue #130). Previously only set
      # on odcn-production.
      - name: ARGOCD_REPO_SERVER_PLUGIN_USE_MANIFEST_GENERATE_PATHS
        value: "true"
    resources:
      limits:
        cpu: 5
        memory: 2Gi
      requests:
        cpu: 1
        memory: 256Mi
    serviceaccount: argocd-argocd-server
    sidecarContainers:
      - name: cmp-server
        command:
          - /var/run/argocd/argocd-cmp-server
        image: rig-cmp-argo-kustomize-sops:latest
        imagePullPolicy: Never
        env:
          - name: ARGOCD_EXEC_TIMEOUT
            value: "180s"
          - name: KUSTOMIZE_PLUGIN_HOME
            value: /etc/kustomize/plugin
        securityContext:
          runAsNonRoot: true
          runAsUser: 999
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /var/run/argocd
            name: var-files
          - mountPath: /home/argocd/cmp-server/plugins
            name: plugins
          - mountPath: /home/argocd/cmp-server/config
            name: cmp-plugin
          - mountPath: /tmp
            name: cmp-tmp
    volumes:
      - name: cmp-plugin
        configMap:
          name: cmp-plugin
      - name: cmp-tmp
        emptyDir: {}
