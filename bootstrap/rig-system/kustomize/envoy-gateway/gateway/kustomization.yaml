apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# De gedeelde Gateway van de sandbox. Apart van base/, want de CRD's daaruit moeten
# Established zijn voordat deze resources kunnen worden toegepast.
resources:
- namespace.yaml
- gateway-class.yaml
- envoy-proxy.yaml
- gateway.yaml
- httproute-https-redirect.yaml
- reference-grant-wildcard-tls.yaml
- backend-traffic-policy.yaml
