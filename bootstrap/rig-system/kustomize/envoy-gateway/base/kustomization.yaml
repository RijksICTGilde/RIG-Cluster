apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# De controller van Envoy Gateway plus de CRD's van de Gateway API, uit het
# installatiemanifest van de release.
#
# Gepind op een release-tag, om dezelfde reden als bij ingress-nginx/base: `task
# install-envoy-gateway` bouwt deze base bij elke verse sandbox, dus met `latest` zou de
# controllerversie veranderen zonder dat iemand iets wijzigt.
#
# Dit manifest brengt de CRD's van de Gateway API ZELF mee (bundle-version v1.6.1,
# experimental channel, inclusief ListenerSet v1 en TLSRoute v1). Installeer ze daarom
# niet een tweede keer: een losse standard-install zou de experimental-CRD's overschrijven.
resources:
- https://github.com/envoyproxy/gateway/releases/download/v1.9.4/install.yaml
