# Kind cluster configuration for sandboxed-local RIG-Cluster development
# Self-contained sandbox with in-cluster Forgejo, real wildcard TLS cert
#
# Usage: envsubst < sandboxed-local/kind-config.yaml | kind create cluster --name rig-sandbox --config -
# Set KIND_HTTP_PORT / KIND_HTTPS_PORT to override default ports (80/443)

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

# Kubernetes version
# Note: Update this version as needed
kubeadmConfigPatches:
- |
  kind: InitConfiguration
  nodeRegistration:
    kubeletExtraArgs:
      node-labels: "ingress-ready=true"

nodes:
- role: control-plane
  # Kubernetes version
  image: kindest/node:v1.32.0

  # Port mappings to expose ingress controller
  # This allows access to services via localhost:80 and localhost:443
  kubeadmConfigPatches:
  - |
    kind: InitConfiguration
    nodeRegistration:
      kubeletExtraArgs:
        node-labels: "ingress-ready=true"

  extraPortMappings:
  # HTTP — override with KIND_HTTP_PORT env var (default: 80)
  - containerPort: 80
    hostPort: ${KIND_HTTP_PORT:-80}
    protocol: TCP
  # HTTPS — override with KIND_HTTPS_PORT env var (default: 443)
  - containerPort: 443
    hostPort: ${KIND_HTTPS_PORT:-443}
    protocol: TCP
