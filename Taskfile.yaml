version: '3'

dotenv: ['.env', '.env-taskfile-current']

vars:
  KIND_VERSION: 1.32.0
  # Cluster configuration - can be overridden by .env-taskfile-current or environment variables
  KIND_CLUSTER_NAME: '{{default "gitops-fluxcd" .KIND_CLUSTER_NAME}}'
  CLUSTER_TYPE: '{{default "local" .CLUSTER_TYPE}}'
  RIG_NAMESPACE: '{{default "rig-system" .RIG_NAMESPACE}}'
  # Sandbox-builds draaien vaak op een gedeelde server naast andere sessies en het
  # kind-cluster. Een aparte builder met een geheugengrens houdt de build binnen zijn
  # eigen ruimte en houdt tegelijk de buildcache vast. Zie sandbox:build-builder.
  SANDBOX_BUILDER_NAME: '{{default "rig-sandbox-builder" .SANDBOX_BUILDER_NAME}}'
  # 2 GiB. Gemeten, niet geschat: een KOUDE build (alle drie de apt-rondes, uv sync,
  # skopeo en de tarball-export) piekt op 427 MB in de buildkit-container, een warme op
  # 108 MB. 2 GiB is dus bijna vijf keer de gemeten piek - genoeg marge voor een zwaardere
  # dependency-ronde, en klein genoeg om de machine nooit leeg te trekken.
  SANDBOX_BUILD_MEMORY: '{{default "2g" .SANDBOX_BUILD_MEMORY}}'
  # Optionele registry-cache, dezelfde vorm als publish-operations-manager. Leeg = alleen
  # de cache van de builder zelf, wat op een dev-server het geval is.
  SANDBOX_CACHE_IMAGE: '{{default "" .SANDBOX_CACHE_IMAGE}}'

#set: ['e', 'x']  # equivalent to set -ex

tasks:
  default:
    desc: "Help / Show available tasks."
    cmds:
      - task --list-all
    silent: true

  select-cluster:
    desc: "Select target cluster and load corresponding environment file"
    cmds:
      - |
        echo "🎯 Cluster Selection"
        echo "=================="
        echo ""
        # De lijst komt uit de aanwezige .env-taskfile-* bestanden. Stond hier eerder als
        # hardgecodeerde cases plus een menutekst plus een prompt-bereik: drie plaatsen om
        # te vergeten bij een nieuw cluster.
        set --
        for f in .env-taskfile-*; do
          [ -f "$f" ] || continue
          [ "$f" = ".env-taskfile-current" ] && continue
          set -- "$@" "$f"
        done

        if [ "$#" -eq 0 ]; then
          echo "❌ No .env-taskfile-<cluster> files found."
          exit 1
        fi

        echo "Available clusters:"
        i=1
        for f in "$@"; do
          echo "$i) ${f#.env-taskfile-}"
          i=$((i + 1))
        done
        echo ""
        printf "Select cluster [1-%d]: " "$#"
        read -r CLUSTER_CHOICE

        # Geen terugval op local bij een vergissing: stil het verkeerde cluster selecteren is
        # precies hoe je per ongeluk tegen productie werkt.
        case "$CLUSTER_CHOICE" in
          ''|*[!0-9]*)
            echo "❌ Not a number: '$CLUSTER_CHOICE'"
            exit 1
            ;;
        esac
        if [ "$CLUSTER_CHOICE" -lt 1 ] || [ "$CLUSTER_CHOICE" -gt "$#" ]; then
          echo "❌ Out of range: '$CLUSTER_CHOICE' (expected 1-$#)"
          exit 1
        fi

        eval "ENV_FILE=\$$CLUSTER_CHOICE"
        CLUSTER_NAME="${ENV_FILE#.env-taskfile-}"

        if [ ! -f "$ENV_FILE" ]; then
          echo "❌ Environment file not found: $ENV_FILE"
          exit 1
        fi

        # Copy the selected env file to .env-taskfile-current
        cp "$ENV_FILE" .env-taskfile-current

        echo "✅ Selected: $CLUSTER_NAME cluster"
        echo "📁 Loaded configuration from: $ENV_FILE"
        echo ""
        echo "📝 Active configuration:"
        cat .env-taskfile-current | grep -v "^#" | grep -v "^$"
        echo ""
        echo "💡 Configuration is now active for all Taskfile tasks"
    silent: false

  requirements-check:
    desc: "Check whether the user has all the required tools installed locally."
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: |
          🚨 Docker daemon is not running! Start Docker Desktop or the Docker service before running setup.
      - sh: command -v kind
        msg: |
          🚨 kind is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v kubectl
        msg: |
          🚨 kubectl is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v kustomize
        msg: |
          🚨 kustomize is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v sops
        msg: |
          🚨 sops is not installed! Install with 'brew install sops' on MacOS or 'apt-get install sops' on Linux.
      - sh: command -v pwgen
        msg: |
          🚨 pwgen is not installed! Install with 'brew install pwgen' on MacOS or 'apt-get install pwgen' on Linux.
      - sh: command -v age-keygen
        msg: |
          🚨 age is not installed! Install with 'brew install age' on MacOS or 'apt-get install age' on Linux.
      - sh: command -v yq
        msg: |
          🚨 yq is not installed! Install with 'brew install yq' on MacOS or 'apt-get install yq' on Linux.
      # jq en numfmt worden gebruikt door sandbox:build-builder om de geheugengrens van de
      # bestaande builder uit te lezen en te vergelijken. Zonder ze leest de taak een lege
      # staat en maakt hij de builder elke keer opnieuw aan - inclusief het verlies van de
      # buildcache die dit hele bouwpad bij elkaar houdt.
      - sh: command -v jq
        msg: |
          🚨 jq is not installed! Install with 'brew install jq' on MacOS or 'apt-get install jq' on Linux.
      - sh: command -v numfmt
        msg: |
          🚨 numfmt is not installed! It ships with GNU coreutils: 'brew install coreutils' on MacOS (as gnumfmt) or 'apt-get install coreutils' on Linux.
    cmds:
      - echo -e "\n✅  All preconditions have been met.\n"
    silent: true

  prepare-argocd-operator:
    desc: "Download and prepare a customized ArgoCD operator"
    vars:
      VERSION: '{{default "v0.14.0" .VERSION}}'
      OUTPUT_DIR: '{{default "bootstrap/crd/operator" .OUTPUT_DIR}}'
      APPLY: '{{default "true" .APPLY}}'
    cmds:
      - |
        echo "Preparing ArgoCD Operator version {{.VERSION}}..."

        # Print current directory for debugging
        echo "Current working directory: $(pwd)"
        echo "Target output directory: {{.OUTPUT_DIR}}"

        # Create temp directory
        TEMP_DIR="/tmp/argocd-operator-prep"
        mkdir -p $TEMP_DIR

        # Check if Prometheus CRD exists
        if ! kubectl get crd prometheuses.monitoring.coreos.com &>/dev/null; then
          echo "⚠️  WARNING: Prometheus CRD not found in the cluster."
          echo "⚠️  This is required by the ArgoCD operator. Applying fake Prometheus CRD as a workaround."
          echo "⚠️  Note: This is only a temporary solution. For production, install Prometheus Operator properly."

          # Apply the fake Prometheus CRD
          kubectl apply -f bootstrap/crd/prometheus/fake-prometheus.yaml

          echo "✅ Fake Prometheus CRD applied successfully."
        else
          echo "✅ Prometheus CRD already exists in the cluster."
        fi

        # Check if cert-manager Issuer CRD exists
        if ! kubectl get crd issuers.cert-manager.io &>/dev/null; then
          echo "⚠️  WARNING: cert-manager Issuer CRD not found in the cluster."
          echo "⚠️  Applying fake cert-manager CRD so Issuer resources can be created."

          kubectl apply -f bootstrap/crd/cert-manager/fake-cert-manager.yaml

          echo "✅ Fake cert-manager CRD applied successfully."
        else
          echo "✅ cert-manager Issuer CRD already exists in the cluster."
        fi

        # Download the operator source
        echo "Downloading ArgoCD Operator source code..."
        curl -sL "https://github.com/argoproj-labs/argocd-operator/archive/refs/tags/{{.VERSION}}.tar.gz" -o $TEMP_DIR/argocd-operator.tar.gz

        # Extract the source
        echo "Extracting source code..."
        tar -xzf $TEMP_DIR/argocd-operator.tar.gz -C $TEMP_DIR

        # Save the original directory path before changing
        ORIGINAL_DIR="$(pwd)"

        # Navigate to extracted directory
        OPERATOR_DIR="$TEMP_DIR/argocd-operator-$(echo {{.VERSION}} | tr -d 'v')"
        echo "Changing to directory: $OPERATOR_DIR"
        cd $OPERATOR_DIR

        # Apply the customizations
        echo "Applying customizations..."

        # 1. Disable webhooks in kustomization.yaml
        sed -i.bak 's/- path: manager_webhook_patch.yaml/#- path: manager_webhook_patch.yaml/' config/default/kustomization.yaml
        sed -i.bak 's/- ..\/webhook/#- ..\/webhook/' config/default/kustomization.yaml

        # TODO: delete step 2, it seems image 0.14 exists and we need to use that instead of latest
        # 2. Use latest image tag in manager kustomization.yaml
        # sed -i.bak 's/newTag: {{.VERSION}}/newTag: latest/' config/manager/kustomization.yaml

        # Create output directory with absolute path
        mkdir -p "$ORIGINAL_DIR/{{.OUTPUT_DIR}}"
        OUTPUT_FILE="$ORIGINAL_DIR/{{.OUTPUT_DIR}}/argocd-operator-install.yaml"

        # Build the customized installation yaml
        echo "Building customized installation YAML..."
        kustomize build config/default > "$OUTPUT_FILE"

        echo "Output written to: $OUTPUT_FILE"

        # Return to original directory
        cd "$ORIGINAL_DIR"

        # Apply to cluster if requested
        if [[ "{{.APPLY}}" == "true" ]]; then
          echo "Applying ArgoCD operator to cluster..."
          kubectl replace --force -f "$OUTPUT_FILE"
          echo "✅ ArgoCD operator applied to cluster"
        else
          echo "To apply this to your cluster, run:"
          echo "kubectl replace --force -f {{.OUTPUT_DIR}}/argocd-operator-install.yaml"
        fi

        # Clean up
        rm -rf $TEMP_DIR

        echo "✅ ArgoCD operator preparation complete"
    silent: true

  generate-age-key:
    desc: "Generate the AGE key for the selected cluster (only if it does not exist yet)"
    vars:
      # Zelfde variabele als de taken die de sleutel lezen. Zonder dit maakte deze taak
      # altijd de ODCN-sleutel, ongeacht welk cluster geselecteerd was, en had het
      # AGE_KEY_FILE-mechanisme geen manier om aan zijn eerste sleutel te komen.
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
    cmds:
      - |
        # Check if key already exists
        if [[ -f "{{.KEY_FILE}}" ]]; then
          echo "✅ AGE key already exists: {{.KEY_FILE}}"
          echo "🔑 Current public key: $(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')"
          echo "⚠️  To generate a new key, first remove the existing {{.KEY_FILE}} file"
          exit 0
        fi

        # Check if age-keygen is installed
        if ! command -v age-keygen &> /dev/null; then
          echo "❌ age-keygen is not installed. Please install age or add it to your PATH."
          echo "   MacOS: brew install age"
          echo "   Linux: apt-get install age or download from https://github.com/FiloSottile/age"
          exit 1
        fi

        # Create security directory if it doesn't exist
        mkdir -p security

        # Generate a new age key directly to {{.KEY_FILE}}
        echo "🔐 Generating new AGE key for SOPS encryption..."
        age-keygen -o {{.KEY_FILE}}

        # Extract the public key
        PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        echo ""
        echo "✅ AGE key generated successfully!"
        echo "🔑 Key saved to: {{.KEY_FILE}}"
        echo "🔑 Public key: $PUBLIC_KEY"
        echo ""
        echo "⚠️  IMPORTANT: The {{.KEY_FILE}} file is gitignored and must be managed securely!"
        echo "⚠️  For production use, consider storing the key in a secure vault or HSM."
    silent: true

  set-git-credentials:
    desc: "Ask for the cluster's git tokens and store them encrypted (ArgoCD read, OPI write)"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      BOOTSTRAP_DIR: 'bootstrap/rig-system/kustomize/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}'
      OPI_DIR: 'bootstrap/rig-system/kustomize/operations-manager/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster'."
      - sh: '[ -d "{{.BOOTSTRAP_DIR}}" ]'
        msg: "{{.BOOTSTRAP_DIR}} bestaat niet. Draai eerst 'task generate-bootstrap-secrets-for-cluster'."
    cmds:
      - |
        # Deze credential kan niet uit git komen: het is juist de sleutel waarmee ArgoCD
        # git leest. Vandaar dat de sjablonen er @secret-gen:skip op hebben en er hier om
        # gevraagd wordt.
        #
        # Een token voor zowel ArgoCD als OPI. Die staan op dit cluster in hetzelfde
        # vertrouwensdomein, dus splitsen levert hier weinig op.
        #
        # Wie ze toch wil scheiden zet ze vooraf in de omgeving; dan wordt er niets
        # gevraagd. ArgoCD hoeft namelijk alleen te lezen en OPI moet schrijven:
        #   RIG_READ_TOKEN=... RIG_WRITE_TOKEN=... task set-git-credentials
        #
        # Gebruik hoe dan ook een eigen token per cluster: raakt hij gelekt en wordt hij
        # ingetrokken, dan gaat niet meteen elk ander cluster mee onderuit.
        set -eu
        [ -f "{{.KEY_FILE}}" ] || { echo "Sleutelbestand {{.KEY_FILE}} bestaat niet."; exit 1; }
        AGE_PUBLIC_KEY=$(sed -n '2p' "{{.KEY_FILE}}" | sed 's/# public key: //')
        SOPS_AGE_KEY="$(sed -n '3p' "{{.KEY_FILE}}")"
        export SOPS_AGE_KEY

        # Task's ingebouwde shell kent `read -s` niet, dus de echo gaat via stty uit.
        # Wie liever niet typt kan de tokens vooraf in de omgeving zetten:
        #   RIG_READ_TOKEN=... RIG_WRITE_TOKEN=... task set-git-credentials
        if [ -z "${RIG_READ_TOKEN:-}" ] || [ -z "${RIG_WRITE_TOKEN:-}" ]; then
          printf 'GitHub-token (voor ArgoCD en OPI): '
          stty -echo 2>/dev/null || true
          read -r RIG_GIT_TOKEN
          stty echo 2>/dev/null || true
          echo
          RIG_READ_TOKEN="${RIG_READ_TOKEN:-$RIG_GIT_TOKEN}"
          RIG_WRITE_TOKEN="${RIG_WRITE_TOKEN:-$RIG_GIT_TOKEN}"
        fi
        export RIG_READ_TOKEN
        [ -n "$RIG_READ_TOKEN" ] && [ -n "$RIG_WRITE_TOKEN" ] || { echo "Een token is verplicht."; exit 1; }

        # sops wil een JSON-waarde. Zelf aanhalingstekens eromheen plakken breekt op een
        # token met een " of \ erin, dus jq codeert het. Via de omgeving en niet via argv,
        # zodat het token niet in de procestabel verschijnt.
        JSON_READ=$(jq -n --arg t "$RIG_READ_TOKEN" '$t')

        for f in "{{.BOOTSTRAP_DIR}}"/argocd-repo-*.sops.yaml; do
          [ -f "$f" ] || continue
          printf '%s' "$JSON_READ" | sops set --value-stdin "$f" '["stringData"]["password"]'
          echo "  gezet: $(basename "$f")"
        done

        # OPI-configmap: base64+age:, dezelfde vorm als odcn gebruikt. Base64 bevat geen
        # | of &, dus die zijn veilig als sed-scheidingsteken en in de vervangtekst.
        ENC="base64+age:$(printf '%s' "$RIG_WRITE_TOKEN" | age -r "$AGE_PUBLIC_KEY" -a | base64 | tr -d '\n')"
        CM="{{.OPI_DIR}}/configmap.yaml"
        if [ -f "$CM" ]; then
          # Vervangen op sleutelnaam en niet op de TODO-markering. Bij een tweede run is
          # die markering weg, en dan zou de configmap overgeslagen worden terwijl de
          # ArgoCD-secrets wel een nieuw token krijgen: dan draagt ArgoCD een ander token
          # dan OPI en werkt een van beide niet meer.
          for k in GIT_PROJECTS_SERVER_PASSWORD GIT_ARGO_APPLICATIONS_PASSWORD PROJECT_REPO_PASSWORD; do
            sed -i '' -E "s|^([[:space:]]*)${k}=.*|\1${k}=${ENC}|" "$CM"
            echo "  gezet: configmap $k"
          done
        fi

        echo ""
        echo "Klaar. Controleer met 'git diff' dat er geen platte tekst in staat, en commit."
    silent: true

  create-namespace:
    desc: "Create the selected cluster's platform namespace"
    vars:
      NS: '{{default .RIG_NAMESPACE .NAMESPACE}}'
      CTX: '{{.KUBE_CONTEXT}}'
    preconditions:
      - sh: '[ -n "{{.NS}}" ]'
        msg: "RIG_NAMESPACE is niet gezet. Draai 'task select-cluster'."
    cmds:
      - |
        CTX_FLAG=""
        [ -n "{{.CTX}}" ] && CTX_FLAG="--context {{.CTX}}"
        kubectl $CTX_FLAG create namespace {{.NS}} --dry-run=client -o yaml | kubectl $CTX_FLAG apply -f -
        echo "✅ namespace {{.NS}}"
    silent: true

  create-sops-age-secret:
    desc: "Place the selected cluster's AGE key as the sops-age-key secret, so ArgoCD can decrypt"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      NS: '{{default .RIG_NAMESPACE .NAMESPACE}}'
      CTX: '{{.KUBE_CONTEXT}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
      - sh: '[ -n "{{.NS}}" ]'
        msg: "RIG_NAMESPACE is niet gezet. Draai 'task select-cluster'."
    cmds:
      - |
        # Dit is de enige echte kip-en-ei in de secretketen: git bevat versleutelde
        # secrets, ArgoCD moet ze kunnen lezen, dus de sleutel moet in het cluster staan
        # voordat er ook maar iets gesynct wordt. Hij kan per definitie niet uit git komen.
        [ -f "{{.KEY_FILE}}" ] || { echo "❌ {{.KEY_FILE}} bestaat niet. Draai eerst 'task generate-age-key'."; exit 1; }

        # --context alleen meegeven als het cluster er een heeft. Kind-clusters zetten
        # KUBE_CONTEXT niet en draaien op de huidige context.
        CTX_FLAG=""
        [ -n "{{.CTX}}" ] && CTX_FLAG="--context {{.CTX}}"

        kubectl $CTX_FLAG create secret generic sops-age-key \
          --from-file=key={{.KEY_FILE}} \
          -n {{.NS}} \
          --dry-run=client -o yaml | kubectl $CTX_FLAG apply -f -

        echo "✅ sops-age-key in {{.NS}}, uit {{.KEY_FILE}}"
    silent: true

  encrypt-value-age-base64:
    desc: "Encrypt a value with AGE and output in base64+age:base64encoded format"
    vars:
      # Zelfde variabele als alle andere sleuteltaken. Stond hier hardgecodeerd op
      # security/key.txt, waardoor deze taak met een ander cluster geselecteerd
      # stilzwijgend met de ODCN-sleutel werkte: versleutelen leverde dan een waarde op
      # die het eigen cluster niet kan lezen.
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      VALUE: '{{.VALUE | default ""}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
    cmds:
      - |
        if [[ -z "{{.VALUE}}" ]]; then
          echo "❌ Usage: task encrypt-value-age-base64 VALUE='your-secret-value'"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        # Encrypt the value with age and encode to base64
        ENCRYPTED=$(echo -n "{{.VALUE}}" | age -r "$AGE_PUBLIC_KEY" -a | base64 | tr -d '\n')

        echo "base64+age:$ENCRYPTED"
    silent: true

  encrypt-value-age:
    desc: "Encrypt a value with AGE and output in armor format"
    vars:
      # Zelfde variabele als alle andere sleuteltaken. Stond hier hardgecodeerd op
      # security/key.txt, waardoor deze taak met een ander cluster geselecteerd
      # stilzwijgend met de ODCN-sleutel werkte: versleutelen leverde dan een waarde op
      # die het eigen cluster niet kan lezen.
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      VALUE: '{{.VALUE | default ""}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
    cmds:
      - |
        if [[ -z "{{.VALUE}}" ]]; then
          echo "❌ Usage: task encrypt-value-age VALUE='your-secret-value'"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        # Encrypt the value with age in armor format
        echo -n "{{.VALUE}}" | age -r "$AGE_PUBLIC_KEY" -a
    silent: true

  decrypt-secret:
    desc: "Decrypt a SOPS-encrypted secret file for editing"
    vars:
      # Zelfde variabele als alle andere sleuteltaken. Stond hier hardgecodeerd op
      # security/key.txt, waardoor deze taak met een ander cluster geselecteerd
      # stilzwijgend met de ODCN-sleutel werkte: versleutelen leverde dan een waarde op
      # die het eigen cluster niet kan lezen.
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FILE: '{{.FILE | default ""}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
    cmds:
      - |
        if [[ -z "{{.FILE}}" ]]; then
          echo "❌ Usage: task decrypt-secret FILE=path/to/secret.yaml.sops.yaml"
          exit 1
        fi

        if [[ ! -f "{{.FILE}}" ]]; then
          echo "❌ File not found: {{.FILE}}"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Determine output filename (remove .sops from the name)
        OUTPUT_FILE=$(echo "{{.FILE}}" | sed 's/\.sops\.yaml$/.yaml/')

        if [[ "$OUTPUT_FILE" == "{{.FILE}}" ]]; then
          echo "❌ File doesn't have .sops.yaml extension: {{.FILE}}"
          exit 1
        fi

        echo "🔓 Decrypting: {{.FILE}}"
        echo "📄 Output: $OUTPUT_FILE"

        # Decrypt using SOPS with the AGE key
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" sops --decrypt "{{.FILE}}" > "$OUTPUT_FILE"

        echo ""
        echo "✅ Decrypted successfully!"
        echo "📝 Edit the file: $OUTPUT_FILE"
        echo "🔐 When done, encrypt with: task encrypt-secret FILE=$OUTPUT_FILE"

  encrypt-secret:
    desc: "Encrypt a secret YAML file with SOPS (creates .sops.yaml version)"
    vars:
      # Zelfde variabele als alle andere sleuteltaken. Stond hier hardgecodeerd op
      # security/key.txt, waardoor deze taak met een ander cluster geselecteerd
      # stilzwijgend met de ODCN-sleutel werkte: versleutelen leverde dan een waarde op
      # die het eigen cluster niet kan lezen.
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FILE: '{{.FILE | default ""}}'
      KEEP_ORIGINAL: '{{.KEEP_ORIGINAL | default "false"}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Draai 'task select-cluster' of geef KEY_FILE expliciet mee."
    cmds:
      - |
        if [[ -z "{{.FILE}}" ]]; then
          echo "❌ Usage: task encrypt-secret FILE=path/to/secret.yaml"
          echo "   Optional: KEEP_ORIGINAL=true to keep the unencrypted file"
          exit 1
        fi

        if [[ ! -f "{{.FILE}}" ]]; then
          echo "❌ File not found: {{.FILE}}"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Check if file is already SOPS encrypted
        if [[ "{{.FILE}}" == *.sops.yaml ]]; then
          echo "❌ File already has .sops.yaml extension. Did you mean to encrypt a plain .yaml file?"
          exit 1
        fi

        # Determine output filename (add .sops before .yaml)
        if [[ "{{.FILE}}" == *.yaml ]]; then
          OUTPUT_FILE=$(echo "{{.FILE}}" | sed 's/\.yaml$/.yaml.sops.yaml/')
        else
          echo "❌ File must have .yaml extension"
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        echo "🔐 Encrypting: {{.FILE}}"
        echo "📄 Output: $OUTPUT_FILE"

        # Encrypt with SOPS using AGE
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" "{{.FILE}}" > "$OUTPUT_FILE"

        echo ""
        echo "✅ Encrypted successfully: $OUTPUT_FILE"

        # Optionally remove the original unencrypted file
        if [[ "{{.KEEP_ORIGINAL}}" != "true" ]]; then
          rm "{{.FILE}}"
          echo "🗑️  Removed unencrypted file: {{.FILE}}"
        else
          echo "⚠️  Original unencrypted file kept: {{.FILE}}"
          echo "   Remember to delete it manually for security!"
        fi

  generate-local-ca:
    desc: "Generate root CA for local development HTTPS (one-time)"
    cmds:
      - |
        mkdir -p security/tls

        if [ -f security/tls/ca.crt ]; then
          echo "CA already exists at security/tls/ca.crt"
          echo "To regenerate, first remove security/tls/ca.crt and security/tls/ca.key"
          exit 0
        fi

        echo "Generating root CA for local development..."
        openssl genrsa -out security/tls/ca.key 4096

        # Create CA with proper key usage extensions for modern OpenSSL/Python
        openssl req -x509 -new -nodes -key security/tls/ca.key \
          -sha256 -days 3650 -out security/tls/ca.crt \
          -subj "/CN=Kind Local Development CA/O=RIG" \
          -addext "basicConstraints=critical,CA:TRUE" \
          -addext "keyUsage=critical,keyCertSign,cRLSign"

        echo ""
        echo "CA generated successfully:"
        echo "  Certificate: security/tls/ca.crt"
        echo "  Private key: security/tls/ca.key"
        echo ""
        echo "Next steps:"
        echo "  1. Install CA in OS trust store: task install-local-ca"
        echo "  2. (Re)create Kind cluster: task create-local-kind-cluster"
        echo "  3. Import CA to cert-manager: task import-ca-to-cluster"
    silent: false

  install-local-ca:
    desc: "Install CA in local OS trust store (browsers will trust it)"
    cmds:
      - |
        if [ ! -f "security/tls/ca.crt" ]; then
          echo "CA certificate not found. Please run 'task generate-local-ca' first."
          exit 1
        fi

        echo "This will install the CA in your OS trust store."
        echo "CA file: security/tls/ca.crt"
        echo ""
        printf "Continue? [y/N] "
        read -r confirm
        if [ "$confirm" != "y" ] && [ "$confirm" != "Y" ]; then
          echo "Cancelled."
          exit 1
        fi

        if [ "$(uname)" = "Darwin" ]; then
          echo "Installing CA in macOS Keychain..."
          sudo security add-trusted-cert -d -r trustRoot \
            -k /Library/Keychains/System.keychain security/tls/ca.crt
          echo "CA installed in macOS Keychain"
        elif [ -d /usr/local/share/ca-certificates ]; then
          echo "Installing CA in Linux trust store..."
          sudo cp security/tls/ca.crt /usr/local/share/ca-certificates/kind-local-ca.crt
          sudo update-ca-certificates
          echo "CA installed in Linux trust store"
        else
          echo "Unsupported OS. Please manually install security/tls/ca.crt in your trust store."
          exit 1
        fi
    silent: false

  import-ca-to-cluster:
    desc: "Import CA into Kubernetes for cert-manager to use"
    cmds:
      - |
        if [ ! -f "security/tls/ca.crt" ] || [ ! -f "security/tls/ca.key" ]; then
          echo "CA files not found. Please run 'task generate-local-ca' first."
          exit 1
        fi

        echo "Importing CA into cert-manager namespace..."
        kubectl create secret tls kind-ca-secret \
          --cert=security/tls/ca.crt \
          --key=security/tls/ca.key \
          -n cert-manager \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "CA imported to cluster as kind-ca-secret in cert-manager namespace"
    silent: false

  inject-ca-to-running-cluster:
    desc: "Inject CA into all running Kind cluster nodes (alternative to recreating cluster)"
    cmds:
      - |
        if [ ! -f "security/tls/ca.crt" ]; then
          echo "CA certificate not found. Please run 'task generate-local-ca' first."
          exit 1
        fi

        echo "Injecting CA into all Kind cluster nodes..."
        echo ""

        # Get all nodes in the Kind cluster
        NODES=$(docker ps --filter "name={{.KIND_CLUSTER_NAME}}" --format "{{`{{.Names}}`}}")

        if [ -z "$NODES" ]; then
          echo "No running nodes found for cluster '{{.KIND_CLUSTER_NAME}}'"
          exit 1
        fi

        for NODE_NAME in $NODES; do
          echo "Injecting CA into node: $NODE_NAME"

          # Copy CA certificate into the node's trust store
          docker cp security/tls/ca.crt "$NODE_NAME:/etc/ssl/certs/kind-local-ca.crt"

          # Update the CA certificates bundle inside the node
          docker exec "$NODE_NAME" update-ca-certificates

          echo "  Done: $NODE_NAME"
        done

        echo ""
        echo "CA injected into all nodes."
        echo "Note: Existing pods may need to be restarted to pick up the new CA."
        echo "New pods will automatically trust the CA."
    silent: false

  configure-coredns-kind-domains:
    desc: "Configure CoreDNS to resolve *.kind domains to ingress controller (re-runnable)"
    cmds:
      - |
        echo "🔧 Configuring CoreDNS to resolve *.kind domains..."
        echo ""

        # Get current CoreDNS Corefile
        CURRENT_COREFILE=$(kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}')

        # Check if rewrite rule already exists
        if echo "$CURRENT_COREFILE" | grep -q "name regex.*\.kind"; then
          echo "✅ CoreDNS rewrite rule for *.kind already exists"
          echo "   No changes needed"
          exit 0
        fi

        echo "📝 Adding rewrite rule for *.kind domains..."
        echo "   All *.kind domains will resolve to: ingress-nginx-controller.ingress-nginx.svc.cluster.local"
        echo ""

        # Create new Corefile with rewrite rule inserted after 'ready' line
        NEW_COREFILE=$(echo "$CURRENT_COREFILE" | awk '
          /ready/ {
            print
            print "    rewrite stop {"
            print "        name regex (.+)\\.kind ingress-nginx-controller.ingress-nginx.svc.cluster.local"
            print "        answer auto"
            print "    }"
            next
          }
          {print}
        ')

        # Create a temporary file with the patch
        TEMP_FILE=$(mktemp)
        cat > "$TEMP_FILE" <<EOF
        {
          "data": {
            "Corefile": $(echo "$NEW_COREFILE" | jq -Rs .)
          }
        }
        EOF

        # Apply the patch
        echo "🔄 Patching CoreDNS ConfigMap..."
        kubectl patch configmap coredns -n kube-system --type merge --patch-file "$TEMP_FILE"

        # Clean up temp file
        rm "$TEMP_FILE"

        # Restart CoreDNS to apply changes
        echo "🔄 Restarting CoreDNS deployment..."
        kubectl rollout restart deployment coredns -n kube-system

        echo ""
        echo "✅ CoreDNS configured successfully!"
        echo "   All *.kind domains now resolve to ingress-nginx-controller"
        echo ""
        echo "💡 You can verify by running:"
        echo "   kubectl run -it --rm --restart=Never --image=busybox:1.28 dnstest -- nslookup keycloak.kind"
    silent: false

  bootstrap-argo-system:
    desc: "Apply minimal bootstrap (namespace + ArgoCD) to start the GitOps process"
    vars:
      CLUSTER: '{{default "local" .CLUSTER_TYPE}}'
      DRY_RUN: '{{default "false" .DRY_RUN}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    cmds:
      - |

        echo "🚀 Bootstrapping minimal RIG Cluster with source type: {{.CLUSTER}}"

        # Set flags for kubectl apply
        KUBECTL_FLAGS=""
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          KUBECTL_FLAGS="--dry-run=client"
          echo "🔍 Dry run mode enabled"
        fi

        # Build and apply
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone | kubectl apply $KUBECTL_FLAGS -f -

        # Wait for ArgoCD operator to create deployments, then restart to pick up config
        if [[ "{{.DRY_RUN}}" != "true" ]]; then
          echo "Waiting for ArgoCD deployments to be created by the operator..."
          until kubectl get deployment argocd-repo-server -n {{.RIG_NAMESPACE}} &>/dev/null; do
            sleep 5
          done
          until kubectl get deployment argocd-server -n {{.RIG_NAMESPACE}} &>/dev/null; do
            sleep 5
          done
          echo "Restarting ArgoCD deployments to apply configuration changes..."
          kubectl rollout restart deployment/argocd-repo-server -n {{.RIG_NAMESPACE}}
          kubectl rollout restart deployment/argocd-server -n {{.RIG_NAMESPACE}}

          # 300s, niet 120s: op een verse cluster moeten de argocd-image en de cmp-sidecar
          # nog gepulld worden. Gemeten op de dev-server duurde alleen dat al ~2,5 minuut,
          # waardoor sandbox:setup afbrak op een rollout die daarna gewoon slaagde.
          echo "Waiting for ArgoCD repo server (incl. CMP sidecar) to be ready..."
          kubectl rollout status deployment/argocd-repo-server -n {{.RIG_NAMESPACE}} --timeout=300s

          echo "Waiting for ArgoCD server to be ready..."
          kubectl rollout status deployment/argocd-server -n {{.RIG_NAMESPACE}} --timeout=300s

          echo "Waiting for ArgoCD application controller to be ready..."
          kubectl rollout status statefulset/argocd-application-controller -n {{.RIG_NAMESPACE}} --timeout=120s
        fi

        echo "✅ Bootstrap applied successfully!"
    silent: true

  bootstrap-backup-destination:
    desc: "Apply the backup-destination MinIO (SOPS-decrypted) to the selected cluster. Managed outside ArgoCD by design (prune-safe for the backup PVC)."
    vars:
      CLUSTER: '{{default "odcn" .CLUSTER}}'              # overlay name: odcn | local
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      DRY_RUN: '{{default "false" .DRY_RUN}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    cmds:
      - |

        echo "📦 Applying backup-destination overlay '{{.CLUSTER}}' to context: $(kubectl config current-context)"

        # Set flags for kubectl apply
        KUBECTL_FLAGS=""
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          KUBECTL_FLAGS="--dry-run=client"
          echo "🔍 Dry run mode enabled"
        fi

        # Build (SOPS-decrypted) and apply
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec infrastructure/bootstrap/infrastructure/backup-destination/controller/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone | kubectl apply $KUBECTL_FLAGS -f -

        echo "✅ backup-destination ({{.CLUSTER}}) applied successfully!"
    silent: true

  log-watch:
    desc: "One OPI prod-log triage cycle: Loki scan -> ignore-list -> Claude triage -> ntfy. Config in scripts/log_watch/config.py."
    dir: operations-manager/python
    cmds:
      - uv run python scripts/log_watch/watch.py {{.CLI_ARGS}}

  log-watch-loop:
    desc: "Run the OPI log watcher continuously (one cycle every 30 min, self-scheduling). Ctrl-C to stop. Config in scripts/log_watch/config.py."
    dir: operations-manager/python
    cmds:
      - uv run python scripts/log_watch/watch.py --loop

  uninstall-local-kind-cluster:
    desc: "Uninstall local set-up by deleting the Kind cluster."
    cmds:
      - kind delete cluster --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ Kind cluster '{{.KIND_CLUSTER_NAME}}' successfully uninstalled\n"
    silent: true

  create-local-kind-cluster:
    desc: "Create a local Kind cluster with ingress support"
    cmds:
      - |
        echo "========================================="
        echo "Creating Kind cluster: {{.KIND_CLUSTER_NAME}}"
        echo "========================================="
        echo ""

        # Check if cluster already exists
        if kind get clusters | grep -q "^{{.KIND_CLUSTER_NAME}}$"; then
          echo "⚠️  Cluster '{{.KIND_CLUSTER_NAME}}' already exists"
          echo "To recreate, first run: task uninstall-local-kind-cluster"
          exit 1
        fi

        # Create cluster from config
        echo "📦 Creating cluster from kind-config.yaml..."
        kind create cluster --name {{.KIND_CLUSTER_NAME}} --config kind-config.yaml

        echo ""
        echo "✅ Kind cluster created successfully!"
        echo ""
        echo "Cluster details:"
        kubectl cluster-info --context kind-{{.KIND_CLUSTER_NAME}}
    silent: false

  install-cnpg-operator:
    desc: "Install CloudNativePG operator for PostgreSQL"
    cmds:
      - |
        echo "========================================="
        echo "Installing CloudNativePG operator"
        echo "========================================="
        echo ""

        # Check if operator is already installed
        if kubectl get deployment -n cnpg-system cnpg-controller-manager 2>/dev/null; then
          echo "✅ CloudNativePG operator already installed"
          exit 0
        fi

        echo "📦 Installing CloudNativePG operator v1.27.3..."
        kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.3.yaml

        echo ""
        echo "⏳ Waiting for operator to be ready..."
        kubectl wait --for=condition=Available --timeout=300s \
          deployment/cnpg-controller-manager -n cnpg-system

        echo ""
        echo "✅ CloudNativePG operator installed successfully!"
        echo ""
        echo "Verify with: kubectl get pods -n cnpg-system"
    silent: true

  install-ingress-nginx:
    desc: "Install NGINX Ingress Controller for Kind"
    cmds:
      - |
        echo "========================================="
        echo "Installing NGINX Ingress Controller"
        echo "========================================="
        echo ""

        # Check if ingress is already installed
        if kubectl get namespace ingress-nginx 2>/dev/null; then
          echo "✅ NGINX Ingress Controller already installed"
          exit 0
        fi

        echo "📦 Installing NGINX Ingress Controller for Kind..."
        # Using local kustomization that:
        # - References upstream KIND manifest
        # - Enables snippet annotations (for security headers)
        # - Configures nodeSelector for control-plane node
        kustomize build bootstrap/rig-system/kustomize/ingress-nginx/base | kubectl apply -f -

        echo ""
        echo "⏳ Waiting for ingress controller to be ready..."
        # Wait for pods to be created before waiting for readiness
        until kubectl get pods --namespace ingress-nginx --selector=app.kubernetes.io/component=controller -o name 2>/dev/null | grep -q .; do
          echo "  Waiting for controller pod to be created..."
          sleep 5
        done
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

        echo ""
        echo "✅ NGINX Ingress Controller installed successfully!"
        echo "   Configured to run on control-plane node (ingress-ready=true)"
        echo "   Snippet annotations enabled for security headers"
        echo ""
        echo "Verify with: kubectl get pods -n ingress-nginx -o wide"
    silent: true

  setup-local-cluster:
    desc: "Complete setup: create cluster, install operators, and bootstrap infrastructure"
    cmds:
      # Generate keys and certificates first (before cluster creation)
      - task: generate-age-key
      - task: generate-local-ca
      # Create cluster (mounts CA via extraMounts)
      - task: create-local-kind-cluster
      # Install cluster components
      - task: install-ingress-nginx
      - task: install-cnpg-operator
      - task: configure-coredns-kind-domains
      - task: prepare-argocd-operator
      - task: update-cmp-kustomize-sops
      # Generate secrets
      - task: generate-bootstrap-secrets-for-cluster
      - task: generate-infrastructure-secrets-for-cluster
      # Deploy operations manager
      - task: update-operations-manager
      # Import CA to cert-manager (after cluster is ready)
      - task: import-ca-to-cluster
      - |
        echo ""
        echo "========================================="
        echo "Local cluster setup complete!"
        echo "========================================="
        echo ""
        echo "Next steps:"
        echo ""
        echo "1. Install CA in your OS trust store (one-time, for browser HTTPS):"
        echo "   task install-local-ca"
        echo ""
        echo "2. Start git daemon (for infrastructure repo):"
        echo "   git daemon --base-path=. --export-all --reuseaddr --informative-errors --verbose --enable=upload-pack --port=9090 --listen=0.0.0.0 --log-destination=stderr"
        echo ""
        echo "3. Bootstrap ArgoCD:"
        echo "   task bootstrap-argo-system"
        echo ""
        echo "4. Add to /etc/hosts:"
        echo "   127.0.0.1 argo.kind keycloak.kind minio.kind operations-manager.kind forgejo.kind"
        echo ""
        echo "5. Access services:"
        echo "   - ArgoCD: https://argo.kind (admin/admin)"
        echo "   - Forgejo: https://forgejo.kind (rig-admin/admin1234)"
        echo "   - Keycloak: https://keycloak.kind"
        echo "   - Operations Manager: https://operations-manager.kind"
    silent: false

  generate-env-secrets-for-operations-manager:
    desc: "Generate SOPS-encrypted secret from cluster-specific env file for operations-manager"
    vars:
      CLUSTER: '{{default "local" .CLUSTER_TYPE}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      ENV_FILE: 'operations-manager/python/.env.{{.CLUSTER}}.secrets'
      OUTPUT_DIR: 'bootstrap/rig-system/kustomize/operations-manager/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}'
      SECRET_NAME: '{{default "operations-manager-env-secrets" .SECRET_NAME}}'
      NAMESPACE: '{{default .RIG_NAMESPACE .NAMESPACE}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    cmds:
      - |
        echo "Generating SOPS-encrypted secret for cluster: {{.CLUSTER}}"
        echo "Using cluster-specific secrets file: {{.ENV_FILE}}"
        echo "Using key file: {{.KEY_FILE}}"

        # Check if cluster-specific env file exists
        if [ ! -f "{{.ENV_FILE}}" ]; then
          echo "⚠️  Cluster-specific secrets file not found: {{.ENV_FILE}}"
          echo "⚠️  Creating empty secrets file for cluster {{.CLUSTER}}"

          # Create the file with a comment
          echo "# Environment secrets for cluster: {{.CLUSTER}}" > "{{.ENV_FILE}}"
          echo "# Add your cluster-specific secret environment variables here" >> "{{.ENV_FILE}}"
          echo "# Example:" >> "{{.ENV_FILE}}"
          echo "# KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=your-secret-here" >> "{{.ENV_FILE}}"
          echo "# DATABASE_ADMIN_PASSWORD=your-password-here" >> "{{.ENV_FILE}}"
          echo "✅ Created empty secrets file: {{.ENV_FILE}}"
          echo "📝 Please edit this file and add the required secrets for your cluster"
        fi

        # Check if SOPS key file exists
        if [ ! -f "{{.KEY_FILE}}" ]; then
          echo "❌ SOPS key file not found: {{.KEY_FILE}}"
          exit 1
        fi

        # Create output directory
        mkdir -p "{{.OUTPUT_DIR}}"

        # Start creating the secret YAML
        SECRET_FILE="{{.OUTPUT_DIR}}/{{.SECRET_NAME}}.yaml"

        cat > "$SECRET_FILE" << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{.SECRET_NAME}}
          namespace: {{.NAMESPACE}}
        type: Opaque
        data:
        EOF

        # Process env file and add base64 encoded values
        echo "Processing environment variables from {{.ENV_FILE}}..."

        # Use grep to filter and process the file instead of while loop
        grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | while IFS='=' read -r key value; do
          # Remove any surrounding quotes from value
          value=$(echo "$value" | sed 's/^["'\'']//' | sed 's/["'\'']$//')

          # Base64 encode the value
          encoded_value=$(echo -n "$value" | base64)

          # Add to secret file
          echo "  $key: $encoded_value" >> "$SECRET_FILE"
          echo "  Added: $key"
        done

        echo "Finished processing environment variables."
        echo "Generated secret file content:"
        cat "$SECRET_FILE"

        # Encrypt with SOPS using the AGE key
        echo "Encrypting secret with SOPS..."
        AGE_PUBLIC_KEY="$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')"
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$SECRET_FILE"

        echo "✅ SOPS-encrypted secret generated: $SECRET_FILE"
        echo "Secret name: {{.SECRET_NAME}}"
        echo "Namespace: {{.NAMESPACE}}"
    silent: true

  update-operations-manager:
    desc: "Build and deploy the operations-manager to the current cluster"
    vars:
      CLUSTER: '{{default "local" .CLUSTER_TYPE}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    deps: [generate-env-secrets-for-operations-manager]
    cmds:
      # Zie sandbox:build-operations-manager-image: zonder dit bakt de build de
      # version.json in die er toevallig lag, en meldt de pod een andere commit.
      - task: version:generate
      - |
        echo "Building operations-manager Docker image with BuildKit optimizations..."
        docker buildx build \
          --target application \
          --cache-from operations-manager:latest \
          --cache-from operations-manager:cache-base-system \
          --cache-from operations-manager:cache-dependencies \
          --load \
          -t operations-manager \
          -f operations-manager/Dockerfile .
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image operations-manager:latest --name {{.KIND_CLUSTER_NAME}}
      - |
        echo "Updating operations-manager deployment..."
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/operations-manager/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone | kubectl apply $KUBECTL_FLAGS -f -
        kubectl rollout restart deployment operations-manager -n {{.RIG_NAMESPACE}}
      - echo -e "✅ Operations manager updated successfully!"
    silent: true

  skaffold-dev:
    desc: "Start Skaffold with hot-reload mode for fast development iteration"
    cmds:
      - echo "Starting Skaffold in hot-reload mode..."
      - echo "Files will sync automatically and uvicorn will auto-reload"
      - SOPS_AGE_KEY="$(sed -n '3p' security/key.txt)" skaffold dev --kube-context kind-{{.KIND_CLUSTER_NAME}} --port-forward -f operations-manager/skaffold.yaml

  skaffold-debug:
    desc: "Instructions for running Skaffold in debug mode"
    cmds:
      - echo 'To enable debug mode'
      - echo '1. Edit bootstrap/rig-system/kustomize/operations-manager/overlays/local/kustomization.yaml'
      - echo '2. Comment out enable-hot-reload.yaml patch'
      - echo '3. Uncomment enable-debug.yaml patch'
      - echo '4. Run kubectl apply -k bootstrap/rig-system/kustomize/operations-manager/overlays/local'
      - echo '5. Wait for pod restart with kubectl rollout status deployment/operations-manager -n rig-system'
      - echo '6. Start Skaffold with task skaffold-dev'
      - echo '7. In IntelliJ Run → Debug Remote Debug - Operations Manager'
      - echo '8. Debugger will attach to localhost 5678'

  deploy-operations-manager:
    desc: "Deploy the operations-manager to the current cluster"
    vars:
      CLUSTER: '{{default "local" .CLUSTER_TYPE}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    deps: [generate-env-secrets-for-operations-manager]
    cmds:
      - |
        echo "Updating operations-manager deployment..."
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/operations-manager/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone | kubectl apply $KUBECTL_FLAGS -f -
        # On odcn-production the image is a CalVer tag that changes every deploy, so the
        # apply above already rolls the deployment. A `rollout restart` on top of that is
        # a SECOND change to the pod template, so two rollouts start at once and you
        # briefly see three pods. Only restart where the tag does NOT change: local and
        # sandbox load the image into kind under a fixed `:latest`, so apply sees nothing
        # new and the restart is what actually picks up the rebuilt image.
        if [ "{{.CLUSTER}}" = "odcn-production" ]; then
          echo "CalVer image tag changed; the apply triggers the rollout (no restart needed)."
        else
          kubectl rollout restart deployment operations-manager -n {{.RIG_NAMESPACE}}
        fi
      - echo -e "✅ Operations manager updated successfully!"
    silent: true

  docker-build-and-push:
    desc: "Build and publish Docker images to container registry"
    vars:
      # Required parameters (no defaults)
      BUILD_CONTEXT: '{{.BUILD_CONTEXT | default ""}}'
      DOCKERFILE_PATH: '{{.DOCKERFILE_PATH | default "Dockerfile"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default ""}}'
      REGISTRY_IMAGE: '{{.REGISTRY_IMAGE | default ""}}'

      # Optional parameters (with defaults)
      IMAGE_TAG: '{{.IMAGE_TAG | default "latest"}}'
      EXTRA_TAG: '{{.EXTRA_TAG | default ""}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
      BUILD_TARGET: '{{.BUILD_TARGET | default ""}}'
      CACHE_IMAGE: '{{.CACHE_IMAGE | default ""}}'
      SKIP_VALIDATION: '{{.SKIP_VALIDATION | default "false"}}'
      BUILDER_NAME: '{{.BUILDER_NAME | default "buildx-builder"}}'

      # Computed: Full registry path with image name
      FULL_REGISTRY_IMAGE: '{{.REGISTRY_IMAGE}}{{if not (hasSuffix "/" .REGISTRY_IMAGE)}}/{{end}}{{.IMAGE_NAME}}'

    preconditions:
      - sh: '[ -n "{{.BUILD_CONTEXT}}" ]'
        msg: |
          Build and publish Docker images to container registry

          Required parameters:
            BUILD_CONTEXT    - Path to build context (e.g., ".", "./app")
            IMAGE_NAME       - Local image name (e.g., "my-app", "backend")
            REGISTRY_IMAGE   - Registry path (e.g., "ghcr.io/org/repo" or "ghcr.io/org/")

          Optional parameters:
            IMAGE_TAG        - Image tag (default: "latest")
            EXTRA_TAG        - Additional tag for the same build, e.g. "latest" (default: none)
            DOCKERFILE_PATH  - Dockerfile path relative to BUILD_CONTEXT (default: "Dockerfile")
            PLATFORMS        - Target platforms (default: "linux/amd64")
            BUILD_TARGET     - Docker build target stage (default: none)
            CACHE_IMAGE      - Additional cache image (default: none)
            SKIP_VALIDATION  - Skip local validation build (default: "false")
            BUILDER_NAME     - Buildx builder name (default: "buildx-builder")

          Examples:
            # Basic usage
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=my-app REGISTRY_IMAGE=ghcr.io/myorg/my-app

            # With custom tag and Dockerfile
            task docker-build-and-push BUILD_CONTEXT=./backend IMAGE_NAME=api REGISTRY_IMAGE=ghcr.io/myorg/api IMAGE_TAG=v1.2.3 DOCKERFILE_PATH=docker/Dockerfile

            # Multi-stage build with target
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app BUILD_TARGET=production

            # Skip validation (faster, for CI/CD)
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app SKIP_VALIDATION=true

            # Single platform build (faster for testing)
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app PLATFORMS=linux/amd64
      - sh: '[ -n "{{.IMAGE_NAME}}" ]'
        msg: "IMAGE_NAME is required (see help above)"
      - sh: '[ -n "{{.REGISTRY_IMAGE}}" ]'
        msg: "REGISTRY_IMAGE is required (see help above)"
      - sh: '[ -d "{{.BUILD_CONTEXT}}" ]'
        msg: 'BUILD_CONTEXT directory does not exist: {{.BUILD_CONTEXT}}'
      - sh: '[ -f "{{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}}" ]'
        msg: 'Dockerfile not found: {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}}'

    cmds:
      # Step 1: Local validation build
      - |
        if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
          echo "Building {{.IMAGE_NAME}} locally for validation..."
          TARGET_FLAG=""
          if [[ -n "{{.BUILD_TARGET}}" ]]; then
            TARGET_FLAG="--target {{.BUILD_TARGET}}"
          fi
          CACHE_FLAG=""
          if [[ -n "{{.CACHE_IMAGE}}" ]]; then
            CACHE_FLAG="--cache-from {{.CACHE_IMAGE}}"
          fi

          docker buildx build \
            $TARGET_FLAG \
            $CACHE_FLAG \
            --cache-from {{.IMAGE_NAME}}:latest \
            --load \
            -t {{.IMAGE_NAME}}:test \
            -f {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}} \
            {{.BUILD_CONTEXT}}
          echo "✅ Local build successful"
        fi

      # Step 2: Interactive confirmation
      - |
        echo ""
        echo "Publishing {{.IMAGE_NAME}} to container registry..."
        echo "Registry: {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}}"
        echo "Platforms: {{.PLATFORMS}}"
        echo "Build context: {{.BUILD_CONTEXT}}"
        echo "Dockerfile: {{.DOCKERFILE_PATH}}"
        echo ""
        printf "Continue with publishing? [y/N]: "
        read -r REPLY
        if [[ ! $REPLY =~ ^[Yy]$ ]]; then
          echo "Publishing cancelled."
          if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
            docker rmi {{.IMAGE_NAME}}:test 2>/dev/null || true
          fi
          exit 1
        fi

      # Step 3: Create buildx builder if needed
      - |
        docker buildx create --name {{.BUILDER_NAME}} --use --driver docker-container 2>/dev/null || docker buildx use {{.BUILDER_NAME}}

      # Step 4: Multi-platform build and push
      - |
        echo "Building and pushing multi-platform image..."
        TARGET_FLAG=""
        if [[ -n "{{.BUILD_TARGET}}" ]]; then
          TARGET_FLAG="--target {{.BUILD_TARGET}}"
        fi
        CACHE_FLAGS=""
        if [[ -n "{{.CACHE_IMAGE}}" ]]; then
          CACHE_FLAGS="--cache-from type=registry,ref={{.CACHE_IMAGE}} --cache-to type=registry,ref={{.CACHE_IMAGE}},mode=max"
        fi
        EXTRA_TAG_FLAG=""
        if [[ -n "{{.EXTRA_TAG}}" ]]; then
          EXTRA_TAG_FLAG="-t {{.FULL_REGISTRY_IMAGE}}:{{.EXTRA_TAG}}"
        fi

        # Disable provenance and SBOM to avoid unknown/unknown platform entries in GHCR
        # See: https://github.com/orgs/community/discussions/45969
        DOCKER_BUILDKIT=1 docker buildx build \
          --platform {{.PLATFORMS}} \
          --provenance=false \
          --sbom=false \
          $TARGET_FLAG \
          $CACHE_FLAGS \
          -f {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}} \
          -t {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}} \
          $EXTRA_TAG_FLAG \
          --push \
          {{.BUILD_CONTEXT}}

        echo "✅ Image published successfully to {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}}"
        if [[ -n "{{.EXTRA_TAG}}" ]]; then
          echo "✅ Also tagged as {{.FULL_REGISTRY_IMAGE}}:{{.EXTRA_TAG}}"
        fi

      # Step 5: Cleanup
      - |
        if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
          echo "Cleaning up local test image..."
          docker rmi {{.IMAGE_NAME}}:test 2>/dev/null || true
        fi
    silent: true
    # Usage Examples:
    #
    # Example 1: Build and publish operations-manager
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/minbzk/base-images/operations-manager \
    #     BUILD_TARGET=application \
    #     CACHE_IMAGE=ghcr.io/minbzk/base-images/operations-manager:cache
    #
    # Example 2: Build PostgreSQL image from subdirectory
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=images/postgresql-with-dictionaries \
    #     DOCKERFILE_PATH=Dockerfile \
    #     IMAGE_NAME=postgresql-with-dictionaries \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/postgresql-with-dictionaries \
    #     IMAGE_TAG=17
    #
    # Example 3: Build with custom tag and skip validation
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/operations-manager \
    #     IMAGE_TAG=v2.0.0 \
    #     SKIP_VALIDATION=true
    #
    # Example 4: Build for single platform (faster local testing)
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/operations-manager \
    #     PLATFORMS=linux/amd64
    #
    # Parameters:
    #   BUILD_CONTEXT    - Root directory for build context (required)
    #   DOCKERFILE_PATH  - Path to Dockerfile relative to context (default: "Dockerfile")
    #   IMAGE_NAME       - Local test image name (required)
    #   REGISTRY_IMAGE   - Full registry path without tag (required)
    #   IMAGE_TAG        - Image tag (default: "latest")
    #   PLATFORMS        - Target platforms (default: "linux/amd64")
    #   BUILD_TARGET     - Multi-stage build target (optional)
    #   CACHE_IMAGE      - Registry cache location (optional)
    #   SKIP_VALIDATION  - Skip local build validation (default: "false")
    #   BUILDER_NAME     - Buildx builder name (default: "buildx-builder")

  image-version:
    desc: "Print the CalVer image tag for the current checkout ({YYYY}.{MM}.{DD}.{HHMM}-{short sha})"
    cmds:
      - echo "{{.IMAGE_VERSION}}"
    vars:
      IMAGE_VERSION:
        sh: |
          DIRTY=""
          [ -n "$(git status --porcelain)" ] && DIRTY="-dirty"
          printf '%s-%s%s' "$(date +%Y.%m.%d.%H%M)" "$(git rev-parse --short=8 HEAD)" "$DIRTY"
    silent: true

  publish-operations-manager:
    desc: "Build and publish the operations-manager to GitHub Container Registry (CalVer tag + latest)"
    deps: [requirements-check, generate-env-secrets-for-operations-manager]
    vars:
      IMAGE_VERSION:
        sh: |
          DIRTY=""
          [ -n "$(git status --porcelain)" ] && DIRTY="-dirty"
          printf '%s-%s%s' "$(date +%Y.%m.%d.%H%M)" "$(git rev-parse --short=8 HEAD)" "$DIRTY"
    cmds:
      - |
        echo "Image version: {{.IMAGE_VERSION}}"
        case "{{.IMAGE_VERSION}}" in
          *-dirty)
            echo "⚠️  Working tree has uncommitted changes, so the commit hash in this tag"
            echo "    does not describe what is being published. Commit first to get a"
            echo "    tag you can trace back."
            ;;
        esac
      # Zie sandbox:build-operations-manager-image. Hier weegt het het zwaarst: dit is de
      # image die uitgerold wordt, en de CalVer-tag zou dan een andere commit noemen dan
      # de image over zichzelf meldt.
      - task: version:generate
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: .
          DOCKERFILE_PATH: operations-manager/Dockerfile
          IMAGE_NAME: operations-manager
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images/operations-manager
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          EXTRA_TAG: latest
          BUILD_TARGET: application
          CACHE_IMAGE: ghcr.io/minbzk/base-images/operations-manager:cache
          BUILDER_NAME: operations-manager-builder
          PLATFORMS: linux/amd64,linux/arm64
          SKIP_VALIDATION: "true"
      - task: pin-operations-manager-image
        vars:
          IMAGE_TAG: '{{.IMAGE_VERSION}}'

  pin-operations-manager-image:
    desc: "Pin the odcn-production overlay to a published operations-manager tag"
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default ""}}'
      PATCH_FILE: bootstrap/rig-system/kustomize/operations-manager/overlays/odcn-production/patches/deployment.yaml
    preconditions:
      - sh: '[ -n "{{.IMAGE_TAG}}" ]'
        msg: |
          IMAGE_TAG is required, for example:
            task pin-operations-manager-image IMAGE_TAG=2026.07.22.1432-7ccad61d
    cmds:
      - |
        sed -i.bak -E 's|(image: rcr\.rijksapps\.nl/ghcr-rig/minbzk/base-images/operations-manager/operations-manager):.*|\1:{{.IMAGE_TAG}}|' {{.PATCH_FILE}}
        rm -f {{.PATCH_FILE}}.bak
        echo ""
        echo "✅ odcn-production pinned to {{.IMAGE_TAG}}"
        grep -n 'image:' {{.PATCH_FILE}}
        echo ""
        echo "Commit this pin, then deploy:"
        echo "  git add {{.PATCH_FILE}} && git commit -m 'deploy: operations-manager {{.IMAGE_TAG}}'"
        echo "  task deploy-operations-manager CLUSTER_TYPE=odcn-production"
        echo ""
        echo "To roll back, pin an earlier tag from the git history of that file."
    silent: true

  update-cmp-kustomize-sops:
    desc: "Build and deploy the cmp-kustomize-sops image to the local kind cluster"
    vars:
      CLUSTER: '{{default "local" .CLUSTER_TYPE}}'
    cmds:
      - |
        echo "Building cmp-kustomize-sops Docker image..."
        docker buildx build --no-cache --progress=plain --load -t rig-cmp-argo-kustomize-sops:latest -f images/cmp-kustomize-sops/Dockerfile .
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image rig-cmp-argo-kustomize-sops:latest --name {{.KIND_CLUSTER_NAME}}
      - |
        echo "Restarting ArgoCD repo-server to pick up new CMP image..."
        kubectl rollout restart deployment argocd-repo-server -n {{.RIG_NAMESPACE}}
      - echo -e "✅ CMP kustomize-sops image updated successfully!"
    silent: true

  publish-cmp-kustomize-sops:
    desc: "Build and publish the cmp-kustomize-sops image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: .
          DOCKERFILE_PATH: images/cmp-kustomize-sops/Dockerfile
          IMAGE_NAME: rig-cmp-argo-kustomize-sops
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          BUILDER_NAME: operations-manager-builder
          PLATFORMS: linux/amd64,linux/arm64

  publish-hello-world:
    desc: "Build and publish the hello-world image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/hello-world
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: hello-world
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  publish-hello-world-seventies:
    desc: "Build and publish the hello-world-seventies image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/hello-world-seventies
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: hello-world-seventies
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  publish-haproxy-redirect:
    desc: "Build and publish the haproxy-redirect image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/haproxy-redirect
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: haproxy-redirect
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  generate-probe-spec:
    desc: "Regenerate the e2e-allservices probe spec from OPI's service registry"
    dir: operations-manager/python
    cmds:
      - uv run python ../../scripts/generate_probe_spec.py
    silent: true

  publish-e2e-allservices:
    desc: "Build and publish the e2e-allservices test workload to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      # Embed the current probe spec (scan of the service registry) before building.
      - task: generate-probe-spec
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/e2e-allservices
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: e2e-allservices
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  publish-waker:
    desc: "Build and publish the zad-waker (sleep-mode) image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/zad-waker
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: zad-waker
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  build-job-test-image:
    desc: "Build and load the tiny job-test image into kind (for testing the job runner)"
    cmds:
      - |
        echo "Building job-test image..."
        docker build -t job-test:latest -f images/job-test/Dockerfile images/job-test/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image job-test:latest --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ job-test image built and loaded. Run a job with image 'local/job-test:latest' and command '/startup.sh hello'."
    silent: true

  build-postgresql-image:
    desc: "Build and load PostgreSQL image with dictionary files into kind cluster"
    cmds:
      - |
        echo "Building PostgreSQL image with full-text search dictionaries..."
        docker build -t postgresql-with-dictionaries:17 -f images/postgresql-with-dictionaries/Dockerfile images/postgresql-with-dictionaries/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image postgresql-with-dictionaries:17 --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ PostgreSQL image built and loaded successfully!"
    silent: true

  build-backup-image:
    desc: "Build and load the rig-backup image into kind cluster"
    cmds:
      - |
        echo "Building rig-backup image (kopia, mc, pg_dump)..."
        docker build -t ghcr.io/minbzk/base-images/rig-backup:latest -f operations-manager/backup-image/Dockerfile operations-manager/backup-image/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image ghcr.io/minbzk/base-images/rig-backup:latest --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ rig-backup image built and loaded successfully!"
    silent: true

  publish-backup-image:
    desc: "Build and publish the rig-backup image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: operations-manager/backup-image
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: rig-backup
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images/
          PLATFORMS: linux/amd64,linux/arm64
          CACHE_IMAGE: ghcr.io/minbzk/base-images/rig-backup:cache
          BUILDER_NAME: rig-backup-builder

  security-audit:
    desc: "Run pip-audit to check Python dependencies for known vulnerabilities"
    dir: operations-manager/python
    cmds:
      - uv run pip-audit --strict --desc

  security-scan-image:
    desc: "Scan operations-manager Docker image for vulnerabilities with Trivy"
    cmds:
      - docker build -t opi:scan -f operations-manager/Dockerfile .
      - trivy image --severity HIGH,CRITICAL opi:scan

  # Internal shared task for secret generation
  _generate-secrets-shared:
    internal: true
    silent: true
    vars:
      MODE: '{{.MODE}}'  # "infrastructure" or "bootstrap"
      TEMPLATES_DIR: '{{.TEMPLATES_DIR}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      CLUSTER_TYPE: '{{.CLUSTER_TYPE}}'
      CLUSTER_FOLDER: '{{.CLUSTER_FOLDER}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FIXED_PASSWORD: '{{default "" .FIXED_PASSWORD}}'  # If set, use this instead of random passwords (for sandbox/dev)
    preconditions:
      - sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "AGE_KEY_FILE is niet gezet. Zet hem in .env-taskfile-<cluster> of geef KEY_FILE expliciet mee. Er is bewust geen terugval: die versleutelde een nieuw cluster stilzwijgend met de sleutel van een ander cluster."
    cmds:
      - |
        if [ ! -f ".env-taskfile-current" ]; then
          echo "❌ No cluster selected. Please run 'task select-cluster' first."
          exit 1
        fi
        # Bestaan is niet genoeg: als .env-taskfile-current pas tijdens deze run is
        # aangemaakt, zijn de dotenv-waarden al leeg ingelezen. Zonder deze check schrijft
        # de generatie naar OUTPUT_DIR/ zelf in plaats van OUTPUT_DIR/<cluster>, ziet daar
        # de .sops.yaml van een andere cluster, en slaat stilzwijgend alles over.
        if [ -z "{{.CLUSTER_FOLDER}}" ]; then
          echo "❌ CLUSTER_FOLDER is leeg — de cluster-variabelen zijn niet geladen."
          echo "   .env-taskfile-current wordt bij het parsen gelezen, dus hij moet er"
          echo "   staan vóór je task start:"
          echo "     cp .env-taskfile-sandboxed-local .env-taskfile-current"
          exit 1
        fi
        if [ ! -f "{{.KEY_FILE}}" ]; then
          echo "❌ {{.KEY_FILE}} not found. Please generate an AGE key first."
          exit 1
        fi
      - |
        echo "🔐 Generating {{.MODE}} secrets for cluster: {{.CLUSTER_NAME}}"
        echo "📁 Templates directory: {{.TEMPLATES_DIR}}"
        echo "📁 Output directory: {{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"
        echo ""

        # Create output directory
        mkdir -p "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"

        # Bestaande geheimen worden PER BESTAND overgeslagen (zie de check in de lus), niet
        # met een map-brede stop. Zo wordt een bestaand geheim nooit geroteerd, maar komt
        # een NIEUWE template (zoals mail-db-credentials op een al draaiend cluster) er wel
        # gewoon bij. De oude map-brede stop kon dat alleen door ALLES weg te gooien, en
        # dat roteert Keycloak, MinIO en PostgreSQL mee.

        # Initialize overview file (overwrite if it exists from a previous incomplete run)
        OVERVIEW_FILE="secrets-overview-{{.MODE}}-{{.CLUSTER_TYPE}}.yaml"

        echo "# {{.MODE | title}} Secrets Overview - {{.CLUSTER_TYPE}}" > "$OVERVIEW_FILE"
        echo "# Generated on $(date)" >> "$OVERVIEW_FILE"
        echo "# WARNING: This file contains plaintext passwords - handle with care!" >> "$OVERVIEW_FILE"
        echo "# This file is added to .gitignore - copy passwords and delete this file manually" >> "$OVERVIEW_FILE"
        echo "" >> "$OVERVIEW_FILE"

        # Process each template
        for template in {{.TEMPLATES_DIR}}/*.yaml; do
          if [ ! -f "$template" ]; then
            echo "No template files found in {{.TEMPLATES_DIR}}"
            continue
          fi

          filename=$(basename "$template")

          # Only process files that are clearly secrets (contain '-secret' or '.secret' in filename)
          if [[ "$filename" != *"-secret.yaml" ]] && [[ "$filename" != *".secret.yaml" ]]; then
            echo "Skipping non-secret file: $filename"
            continue
          fi

          # Een geheim dat er al staat blijft staan: overslaan is de bescherming tegen
          # ongevraagde rotatie. Opnieuw genereren = het .sops.yaml-bestand weggooien.
          if [ -f "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/${filename}.sops.yaml" ]; then
            echo "Skipping (already exists): ${filename}.sops.yaml"
            continue
          fi

          echo "Processing: $filename"

          # Copy template to temp file
          temp_file=$(mktemp)
          cp "$template" "$temp_file"

          # Add filename to overview
          echo "# === $filename ===" >> "$OVERVIEW_FILE"

          # Find all @secret-gen annotations and process them
          grep -n "# @secret-gen:" "$template" | while IFS=':' read -r line_num rest; do
            # Get the full line
            full_line=$(sed -n "${line_num}p" "$template")

            # Extract field name (everything before first colon)
            field_name=$(echo "$full_line" | cut -d':' -f1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')

            # Extract annotation details (everything after # @secret-gen:)
            annotation=$(echo "$full_line" | sed 's/.*# @secret-gen://')

            # Parse annotation: type:length[,path=...] or skip
            if echo "$annotation" | grep -q "skip"; then
              echo "  Skipping line $line_num (marked with @secret-gen:skip)"
              continue
            fi

            # Parse type and length
            type_length=$(echo "$annotation" | cut -d',' -f1)
            password_type=$(echo "$type_length" | cut -d':' -f1)
            password_length=$(echo "$type_length" | cut -d':' -f2)

            # Parse path if present
            path_annotation=""
            if echo "$annotation" | grep -q "path="; then
              path_annotation=$(echo "$annotation" | sed 's/.*path=//')
            fi

            if [ -z "$field_name" ]; then
              echo "  ❌ Could not find field name on line $line_num"
              continue
            fi

            # Generate password based on type
            case "$password_type" in
              "random")
                if [ -n "{{.FIXED_PASSWORD}}" ]; then
                  password="{{.FIXED_PASSWORD}}"
                else
                  password=$(openssl rand -base64 $password_length | tr -d "=+/" | cut -c1-$password_length)
                fi
                ;;
              "bcrypt")
                if [ -n "{{.FIXED_PASSWORD}}" ]; then
                  plain_password="{{.FIXED_PASSWORD}}"
                else
                  plain_password=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
                fi
                password=$(htpasswd -nbBC 10 "" "$plain_password" | tr -d ':\n' | sed 's/$2b/$2y/')
                ;;
              *)
                echo "❌ Unknown password type: $password_type"
                continue
                ;;
            esac

            echo "  Generated $password_type password for field: $field_name"

            # Use yq to replace the field value (more reliable than sed)
            yq eval ".stringData.\"$field_name\" = \"$password\"" -i "$temp_file"

            # Add to overview file
            if [ "$password_type" = "bcrypt" ]; then
              echo "$field_name: \"$plain_password\"  # Original password (bcrypt hash in secret)" >> "$OVERVIEW_FILE"
            else
              echo "$field_name: \"$password\"" >> "$OVERVIEW_FILE"
            fi
          done

          echo "" >> "$OVERVIEW_FILE"

          # Path substitution not needed - path annotation is only for informational purposes

          # Always replace namespace with the cluster-specific namespace from env settings
          echo "  Setting namespace to: {{.RIG_NAMESPACE}}"
          yq eval '.metadata.namespace = "{{.RIG_NAMESPACE}}"' -i "$temp_file"

          # Copy to final location and encrypt with SOPS using AGE key
          output_file="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/${filename}.sops.yaml"
          cp "$temp_file" "$output_file"

          AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')
          echo "  Encrypting: $output_file"
          sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$output_file"

          # Clean up temp file
          rm "$temp_file"
        done

        # Update or create decrypt-sops.yaml
        echo ""
        echo "Updating decrypt-sops.yaml..."
        DECRYPT_FILE="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/decrypt-sops.yaml"

        # Create decrypt-sops.yaml if it doesn't exist
        if [ ! -f "$DECRYPT_FILE" ]; then
          echo "  Creating new decrypt-sops.yaml"
          cat > "$DECRYPT_FILE" << 'DECRYPT_EOF'
        apiVersion: viaduct.ai/v1
        kind: ksops
        metadata:
          name: secret-generator
          annotations:
            config.kubernetes.io/function: "exec:\n  path: ksops\n"
        files:
        DECRYPT_EOF
        fi

        # Add all .sops.yaml files from output directory if not already present
        for sops_file in "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"/*.sops.yaml; do
          if [ -f "$sops_file" ]; then
            filename=$(basename "$sops_file")
            # Check if this file is already referenced
            if ! grep -qF "$filename" "$DECRYPT_FILE"; then
              echo "  - $filename" >> "$DECRYPT_FILE"
              echo "  ✅ Added: $filename"
            else
              echo "  ℹ️  Already present: $filename"
            fi
          fi
        done

        # Create kustomization.yaml if it doesn't exist
        KUSTOMIZATION_FILE="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/kustomization.yaml"
        if [ ! -f "$KUSTOMIZATION_FILE" ]; then
          echo "  Creating kustomization.yaml"
          cat > "$KUSTOMIZATION_FILE" << 'KUSTOMIZATION_EOF'
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization

        generators:
        - decrypt-sops.yaml
        KUSTOMIZATION_EOF
          echo "  ✅ Created kustomization.yaml"
        fi

        echo ""
        echo "✅ {{.MODE | title}} secrets generated successfully!"
        echo "📄 Overview file: $OVERVIEW_FILE (added to .gitignore)"
        echo "🗂️  Encrypted secrets: {{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/"
        if [ "{{.MODE}}" = "infrastructure" ]; then
          echo "📝 Configuration files: kustomization.yaml, decrypt-sops.yaml"
        fi
        echo ""
        echo "⚠️  IMPORTANT: The overview file contains plaintext passwords."
        echo "   Copy any needed passwords and delete the overview file manually for security."

  generate-infrastructure-secrets-for-cluster:
    desc: "Generate infrastructure secrets for selected cluster from templates (run 'task select-cluster' first)"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "infrastructure"
          TEMPLATES_DIR: "infrastructure/bootstrap/infrastructure/secrets/templates"
          OUTPUT_DIR: "infrastructure/bootstrap/infrastructure/secrets/config/overlays"
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
          CLUSTER_FOLDER: "{{.INFRASTRUCTURE_CLUSTER_FOLDER}}"

  generate-bootstrap-secrets-for-cluster:
    desc: "Generate bootstrap secrets for selected cluster from templates (ArgoCD, etc.) (run 'task select-cluster' first)"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "bootstrap"
          TEMPLATES_DIR: "bootstrap/rig-system/kustomize/secrets/templates"
          OUTPUT_DIR: "bootstrap/rig-system/kustomize/overlays"
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
          CLUSTER_FOLDER: "{{.BOOTSTRAP_CLUSTER_FOLDER}}"

  build-keycloak-custom-mapper:
    desc: "Build the Keycloak custom mapper JAR"
    cmds:
      - |
        echo "🔨 Building Keycloak custom mapper..."
        cd keycloak-migration/custom-mapper
        mvn clean package
        echo "✅ JAR built: keycloak-migration/custom-mapper/target/keycloak-saml-nameid-mapper-1.1.0.jar"
    silent: false

  test-keycloak-custom-mapper:
    desc: "Run unit tests for the Keycloak custom mapper"
    deps: [build-keycloak-custom-mapper]
    cmds:
      - |
        echo "🧪 Running tests..."
        cd keycloak-migration/custom-mapper
        mvn test
    silent: false

  test-keycloak-custom-mapper-docker:
    desc: "Test Keycloak custom mapper in standalone Docker container"
    deps: [build-keycloak-custom-mapper]
    cmds:
      - |
        cd keycloak-migration/custom-mapper
        ./test-local-docker.sh
    silent: false

  publish-keycloak-custom-mapper:
    desc: "Build and publish the Keycloak custom mapper JAR to GitHub Releases"
    deps: [build-keycloak-custom-mapper]
    cmds:
      - |
        echo "📦 Publishing Keycloak custom mapper to GitHub Releases..."
        echo ""
        echo "Prerequisites:"
        echo "- GitHub CLI (gh) installed and authenticated"
        echo "- Repository must be public for wget downloads"
        echo ""

        cd keycloak-migration/custom-mapper

        VERSION="v1.1.0"
        REPO="RijksICTGilde/RIG-Cluster"

        # Check if release already exists
        if gh release view "$VERSION" --repo "$REPO" 2>/dev/null; then
          echo "⚠️  Release $VERSION already exists. Deleting and recreating..."
          gh release delete "$VERSION" --repo "$REPO" --yes
        fi

        echo "Creating release $VERSION..."
        gh release create "$VERSION" \
          --repo "$REPO" \
          --title "Keycloak SAML NameID Mapper $VERSION" \
          --notes "Custom Keycloak mapper for extracting SAML NameID to user attributes using unrestricted XPath" \
          target/keycloak-saml-nameid-mapper-1.1.0.jar

        echo ""
        echo "✅ Keycloak custom mapper published successfully!"
        echo "📥 Download URL: https://github.com/$REPO/releases/download/$VERSION/keycloak-saml-nameid-mapper-1.1.0.jar"
        echo ""
        echo "Verify with: curl -sI https://github.com/$REPO/releases/download/$VERSION/keycloak-saml-nameid-mapper-1.1.0.jar"
    silent: false

  export-keycloak-users:
    desc: "Export all Keycloak users with credentials and federation data"
    vars:
      OUTPUT_FILE: '{{.OUTPUT_FILE | default "users.json"}}'
      MAX_USERS: '{{.MAX_USERS | default "10000"}}'
      AUTH_REALM: '{{.AUTH_REALM | default "master"}}'
    cmds:
      - |
        # Prompt for inputs
        printf "Enter Keycloak host [http://localhost:8080]: "
        read KEYCLOAK_URL
        KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}

        printf "Enter realm to export from: "
        read EXPORT_REALM

        printf "Enter Keycloak admin password: "
        read -s ADMIN_PASSWORD
        echo ""

        printf "Enter output directory [./exports]: "
        read OUTPUT_DIR
        OUTPUT_DIR=${OUTPUT_DIR:-./exports}

        if [ -z "$EXPORT_REALM" ]; then
          echo "❌ Realm is required"
          exit 1
        fi

        if [ -z "$ADMIN_PASSWORD" ]; then
          echo "❌ Admin password is required"
          exit 1
        fi

        echo ""
        echo "🔐 Authenticating with Keycloak..."
        TOKEN=$(curl -s -X POST "$KEYCLOAK_URL/realms/{{.AUTH_REALM}}/protocol/openid-connect/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "username=admin" \
          -d "password=$ADMIN_PASSWORD" \
          -d "grant_type=password" \
          -d "client_id=admin-cli" | jq -r '.access_token')

        if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
          echo "❌ Authentication failed. Please check credentials."
          exit 1
        fi

        echo "✅ Authentication successful"

        mkdir -p "$OUTPUT_DIR"
        OUTPUT_PATH="$OUTPUT_DIR/{{.OUTPUT_FILE}}"

        echo "📥 Exporting users from realm: $EXPORT_REALM"
        echo "📁 Output location: $OUTPUT_PATH"

        # Export users with full data
        HTTP_STATUS=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $TOKEN" \
          "$KEYCLOAK_URL/admin/realms/$EXPORT_REALM/users?max={{.MAX_USERS}}&briefRepresentation=false" \
          -o "$OUTPUT_PATH.tmp")

        HTTP_CODE=$(echo "$HTTP_STATUS" | tail -n1)

        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Export failed with HTTP status: $HTTP_CODE"
          cat "$OUTPUT_PATH.tmp"
          rm -f "$OUTPUT_PATH.tmp"
          exit 1
        fi

        # Format JSON for readability
        jq '.' "$OUTPUT_PATH.tmp" > "$OUTPUT_PATH" 2>/dev/null || mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"
        rm -f "$OUTPUT_PATH.tmp"

        USER_COUNT=$(jq '. | length' "$OUTPUT_PATH")
        echo "✅ Successfully exported $USER_COUNT users to $OUTPUT_PATH"

        # Check for federation links
        FED_USERS=$(jq '[.[] | select(.federationLink != null)] | length' "$OUTPUT_PATH")
        echo "📊 Found $FED_USERS federated users"

        # Export realm config for IDPs reference
        echo "📥 Exporting realm configuration for IDP reference..."
        curl -s -H "Authorization: Bearer $TOKEN" \
          "$KEYCLOAK_URL/admin/realms/$EXPORT_REALM" | \
          jq '{realm: .realm, identityProviders: .identityProviders, identityProviderMappers: .identityProviderMappers}' \
          > "$OUTPUT_DIR/realm-idps.json"

        echo "✅ Realm IDP configuration saved to $OUTPUT_DIR/realm-idps.json"
        echo ""
        echo "📋 Export complete. Files created:"
        echo "   - $OUTPUT_PATH (users with credentials)"
        echo "   - $OUTPUT_DIR/realm-idps.json (IDP configurations)"

  # ========================================
  # Development Environment Tasks
  # ========================================

  dev:
    desc: "Start local development environment (postgres only)"
    cmds:
      - |
        echo "Starting local development environment..."
        docker compose -f docker-compose.dev.yaml up -d postgres
        echo ""
        echo "Waiting for postgres to be ready..."
        sleep 5
        docker compose -f docker-compose.dev.yaml exec postgres pg_isready -U opi -d opi
        echo ""
        echo "Development environment started:"
        echo "  - PostgreSQL: localhost:5432 (opi/devpassword)"
        echo ""
        echo "To start the operations manager:"
        echo "  cd operations-manager/python && uv run python -m opi"
    silent: false

  dev-full:
    desc: "Start full local development environment (postgres + operations-manager)"
    cmds:
      - |
        echo "Starting full development environment..."
        docker compose -f docker-compose.dev.yaml --profile full up -d
        echo ""
        echo "Development environment started:"
        echo "  - PostgreSQL: localhost:5432"
        echo "  - Operations Manager: http://localhost:8000"
        echo ""
        echo "View logs: task dev-logs"
    silent: false

  dev-down:
    desc: "Stop local development environment"
    cmds:
      - |
        echo "Stopping development environment..."
        docker compose -f docker-compose.dev.yaml --profile full down
        echo "Development environment stopped."
    silent: false

  dev-logs:
    desc: "View development environment logs"
    cmds:
      - docker compose -f docker-compose.dev.yaml --profile full logs -f
    silent: false

  dev-reset:
    desc: "Reset development environment (removes all data)"
    cmds:
      - |
        echo "Resetting development environment..."
        docker compose -f docker-compose.dev.yaml --profile full down -v
        echo "All data removed."
        echo ""
        echo "To restart: task dev"
    silent: false

  dev-psql:
    desc: "Connect to development PostgreSQL database"
    cmds:
      - docker compose -f docker-compose.dev.yaml exec postgres psql -U opi -d opi
    silent: false

  # ========================================
  # Testing Tasks
  # ========================================

  test:
    desc: "Run unit tests (excludes integration tests)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/ --ignore=tests/integration/ -v
    silent: false

  test-upgrade-safety:
    desc: "RC-19 Layer 1: replay every project file through migrate + validate (offline, no cluster/key)"
    summary: |
      Runs the offline upgrade-safety replay. Always exercises the committed
      sanitized fixtures; set RIG_PROJECTS_DIR to a zad-projects checkout to
      replay the real production files too.

        RIG_PROJECTS_DIR=/path/to/zad-projects/projects task test-upgrade-safety
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/test_upgrade_safety_replay.py -v
    silent: false

  upgrade-safety-diff:
    desc: "RC-19 Layer 2: summarize what a zad-deployments upgrade removed, per project"
    summary: |
      Diffs a zad-deployments checkout against the baseline recorded before the
      OPI image swap, and summarizes disappeared keys (env vars, secrets, ingress,
      mounts, schemas) per project. The output is a report to judge, not a pass/fail.

        REPO=/path/to/zad-deployments BASELINE=<sha> task upgrade-safety-diff
    dir: operations-manager/python
    requires:
      vars: [REPO, BASELINE]
    cmds:
      - uv run python scripts/compare_deployments_diff.py "{{.REPO}}" "{{.BASELINE}}" "{{.TARGET | default \"HEAD\"}}"
    silent: true

  upgrade-safety-identity:
    desc: "RC-19 Layer 2: assert every service still resolves to the SAME thing after the upgrade"
    summary: |
      Decrypts the generated secrets in a baseline zad-deployments worktree and the
      upgraded tree, and compares the resolved identity of each service per deployment
      (database host/name/user/schema, OIDC url/realm/client-id, bucket name, published
      Ingress host). Unlike upgrade-safety-diff this is a pass/fail: a same-key but
      different-VALUE identity change (e.g. a deployment now pointing at another database)
      is a finding. Needs the AGE key the secrets are encrypted with (the sandbox key).

        git -C /path/to/zad-deployments worktree add /tmp/zad-baseline <baseline-sha>
        BASELINE_DIR=/tmp/zad-baseline TARGET_DIR=/path/to/zad-deployments \
          KEY_FILE=../../security/sandbox-key.txt task upgrade-safety-identity
    dir: operations-manager/python
    requires:
      vars: [BASELINE_DIR, TARGET_DIR, KEY_FILE]
    cmds:
      - uv run python scripts/compare_service_identity.py "{{.BASELINE_DIR}}" "{{.TARGET_DIR}}" --key-file "{{.KEY_FILE}}"
    silent: true

  test-integration:
    desc: "Run integration tests (mock-based, no infrastructure required)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/integration/ -v -m "not slow"
    silent: false

  test-integration-kind:
    desc: "Run Kind cluster integration tests (requires Kind + Docker)"
    dir: operations-manager/python
    cmds:
      - |
        echo "Running Kind cluster integration tests..."
        echo "This will create a temporary Kind cluster for testing."
        echo ""
        uv run pytest tests/integration/ -v -m "slow"
    silent: false

  test-all:
    desc: "Run all tests (unit + integration)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/ -v
    silent: false

  test-e2e:
    desc: "Run Playwright E2E browser tests (local app server, no sandbox needed)"
    dir: operations-manager/python
    cmds:
      # Ook firefox: tests/e2e/test_lotc_aanvragenbeheer.py meet daarin een fout die in
      # Chromium NIET te zien is (een tabelcel die alleen daar tot niets krimpt).
      - uv run playwright install chromium firefox --with-deps
      - uv run pytest tests/e2e/ -m "e2e and not sandbox" -v
    silent: false

  test-e2e-random:
    desc: "Run the local E2E suite in a shuffled order (the isolation check that counts)"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium firefox --with-deps
      # The plan's own acceptance criterion: order-independence is only proven by
      # actually changing the order. A reversed file order is not enough -- it still
      # keeps every file's tests together and in sequence, which is exactly the
      # assumption a leaking test makes. pytest-randomly shuffles files AND the tests
      # inside them.
      # SEED=<n> reproduces a specific shuffle; without it every run picks a new one,
      # which is the point: repeated runs sample different orders.
      # No -q: the addopts are already at verbosity 0 (-v -q), so an extra -q lands on
      # -1 and pytest drops the report header -- the line where pytest-randomly prints
      # `Using --randomly-seed=<n>`. Without it the shuffle cannot be replayed.
      - uv run pytest tests/e2e/ -m "e2e and not sandbox" -p randomly {{if .SEED}}--randomly-seed={{.SEED}}{{end}} --timeout=300
    silent: false

  test-e2e-sandbox:
    desc: "Run E2E browser tests against running sandbox cluster"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium --with-deps
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        E2E_ARTIFACT_DIR=${E2E_ARTIFACT_DIR:-tests/e2e/artifacts}
        E2E_TRACE=${E2E_TRACE:-1}
        uv run pytest tests/e2e/ -m "e2e and sandbox and not reallife" -v --timeout=300
    silent: false

  test-e2e-sandbox-reallife:
    desc: "Run the long real-life E2E suite (5 projects, semi-concurrent UI+API mutations) against a running sandbox"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium --with-deps
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        E2E_ARTIFACT_DIR=${E2E_ARTIFACT_DIR:-tests/e2e/artifacts}
        E2E_TRACE=${E2E_TRACE:-1}
        uv run pytest tests/e2e/test_sandbox_reallife.py -m "e2e and sandbox and reallife" -v --timeout=600
    silent: false

  test-coverage:
    desc: "Run tests with coverage report"
    dir: operations-manager/python
    cmds:
      - uv run coverage run -m pytest tests/ --ignore=tests/integration/
      - uv run coverage report
      - uv run coverage html
      - |
        echo ""
        echo "Coverage report generated: operations-manager/python/htmlcov/index.html"
    silent: false

  # ========================================
  # Kind Cluster Management for Testing
  # ========================================

  test-kind-create:
    desc: "Create Kind cluster for integration testing"
    cmds:
      - |
        echo "Creating Kind cluster for integration testing..."
        if kind get clusters | grep -q "^rig-integration-test$"; then
          echo "Cluster 'rig-integration-test' already exists."
          echo "To recreate, run: task test-kind-delete && task test-kind-create"
          exit 0
        fi
        kind create cluster --name rig-integration-test \
          --config operations-manager/python/tests/fixtures/kind-config.yaml \
          --wait 120s
        echo ""
        echo "Deploying test workloads..."
        kubectl apply -f operations-manager/python/tests/fixtures/test-workloads.yaml
        echo ""
        echo "Waiting for deployments to be ready..."
        kubectl wait --for=condition=available deployment/log-generator -n test-project --timeout=120s
        echo ""
        echo "Kind cluster 'rig-integration-test' is ready for testing."
    silent: false

  test-kind-delete:
    desc: "Delete Kind cluster used for integration testing"
    cmds:
      - |
        PREVIOUS_CONTEXT=$(kubectl config current-context 2>/dev/null || true)
        echo "Deleting Kind cluster 'rig-integration-test'..."
        kind delete cluster --name rig-integration-test
        # Restore previous context if it was switched to the integration test cluster
        if [ "$PREVIOUS_CONTEXT" = "kind-rig-integration-test" ]; then
          # Integration test context is gone, try to switch to sandbox or default
          FALLBACK=$(kubectl config get-contexts -o name 2>/dev/null | grep -m1 "sandbox\|kind-rig" || true)
          if [ -n "$FALLBACK" ]; then
            kubectl config use-context "$FALLBACK"
            echo "Switched kubectl context to: $FALLBACK"
          fi
        else
          # Was already on a different context, nothing to do (kind delete removes the integration context)
          echo "kubectl context remains: $(kubectl config current-context 2>/dev/null || echo 'none')"
        fi
        echo "Cluster deleted."
    silent: false

  test-kind-logs:
    desc: "View logs from test deployment in Kind cluster"
    cmds:
      - kubectl logs -n test-project deployment/log-generator -f
    silent: false

  # ==========================================================================
  # Sandboxed Local Development Environment
  # Self-contained sandbox with in-cluster Forgejo as git source
  # ==========================================================================

  sandbox:setup:
    desc: "Complete setup: create sandboxed-local cluster with in-cluster Forgejo"
    cmds:
      - task: requirements-check
      - |
        cat banner.txt
        cat docs/sandbox-prerequisites.md
        echo ""
        # SANDBOX_NONINTERACTIVE=true skips this confirmation (unattended installs)
        if [ "${SANDBOX_NONINTERACTIVE:-}" = "true" ]; then
          echo "(non-interactive: continuing)"
        else
          read -p "Press Enter to continue or Ctrl+C to cancel... "
        fi
      - |
        echo "========================================="
        echo "Setting up Sandboxed Local Environment"
        echo "========================================="
        echo ""
        echo "Activating sandboxed-local configuration..."
        cp .env-taskfile-sandboxed-local .env-taskfile-current
      # Collect all user input upfront
      - task: sandbox:decrypt-wildcard-cert
      - task: sandbox:ask-sso
      - |
        echo ""
        echo "All questions answered. Starting unattended setup..."
        echo ""
      # Generate keys and secrets
      - task: sandbox:generate-age-key
      - task: sandbox:generate-infrastructure-secrets
      - task: sandbox:generate-bootstrap-secrets
      - task: sandbox:apply-sso
      - task: sandbox:generate-env-secrets
      # Overlays op lokale images zetten als dit een dev-build is. Moet vóór
      # sandbox:sync en bootstrap-argo-system, want die pushen/appliceren de overlays.
      # Zonder deze stap deed .sandbox-mode=dev niets: ask-build-mode schreef het bestand
      # wel, maar niemand las het tijdens setup.
      - task: sandbox:configure-local-images
      # Phase 1: Create cluster and install operators/CRDs
      - task: sandbox:create-cluster
      # De images moeten in de cluster staan vóórdat de deployments ze proberen te
      # pullen (imagePullPolicy: Never in dev-mode). No-op in demo-mode.
      - task: sandbox:build-local-images-if-dev
      - task: install-ingress-nginx
      - task: install-cnpg-operator
      - task: sandbox:install-csi-snapshot
      - task: sandbox:configure-coredns
      - task: sandbox:create-namespace
      - task: sandbox:import-wildcard-cert
      - task: sandbox:create-sops-age-secret
      # Phase 2: Bootstrap Forgejo (minimal direct deploys, just enough for git)
      - task: sandbox:deploy-postgresql-direct
      - task: sandbox:deploy-forgejo-direct
      - task: sandbox:wait-forgejo
      - task: sandbox:init-forgejo
      # Phase 3: Sync infrastructure (including generated secrets) to Forgejo
      - task: sandbox:sync
      # Phase 4: Bootstrap ArgoCD + Operations Manager (images pulled from GHCR)
      - task: prepare-argocd-operator
      - task: bootstrap-argo-system
        vars:
          KEY_FILE: security/sandbox-key.txt
      # - task: sandbox:update-dns  # Not needed when *.sandbox.rijksapp.dev resolves to 127.0.0.1 via public DNS
      # Phase 5: Wait for everything to be deployed and ready
      - task: sandbox:wait-ready
      - |
        kubectl config set-context --current --namespace=rig-system
      - |
        echo ""
        echo "========================================="
        echo "Sandboxed local cluster setup complete!"
        echo "========================================="
        echo ""
        cat docs/sandbox-reference.md
        echo ""
        echo "This reference card is saved at: docs/sandbox-reference.md"
    silent: true

  sandbox:create-cluster:
    desc: "Create Kind cluster for sandboxed-local environment"
    cmds:
      - |
        echo "Creating Kind cluster: rig-sandbox..."
        if kind get clusters 2>/dev/null | grep -q "^rig-sandbox$"; then
          echo "Cluster rig-sandbox already exists"
          exit 0
        fi
        # KIND_HTTP_PORT / KIND_HTTPS_PORT from the env (e.g. .env-taskfile-current
        # or the shell) skip the prompt — needed for unattended installs and for
        # hosts where 80/443 are taken (e.g. the dev server behind Caddy → 8880/8843).
        if [ -z "${KIND_HTTP_PORT:-}" ]; then
          read -p "HTTP port for ingress [80]: " http_port
          export KIND_HTTP_PORT="${http_port:-80}"
        fi
        if [ -z "${KIND_HTTPS_PORT:-}" ]; then
          read -p "HTTPS port for ingress [443]: " https_port
          export KIND_HTTPS_PORT="${https_port:-443}"
        fi
        envsubst < sandboxed-local/kind-config.yaml | kind create cluster --name rig-sandbox --config -
        echo "Cluster rig-sandbox created successfully (HTTP port: ${KIND_HTTP_PORT}, HTTPS port: ${KIND_HTTPS_PORT})"
    silent: true

  sandbox:install-csi-snapshot:
    desc: "Install CSI VolumeSnapshot CRDs for sandboxed-local cluster"
    cmds:
      - |
        echo "Installing CSI VolumeSnapshot CRDs..."
        if kubectl get crd volumesnapshots.snapshot.storage.k8s.io 2>/dev/null; then
          echo "CSI VolumeSnapshot CRDs already installed"
          exit 0
        fi
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
        echo "CSI VolumeSnapshot CRDs installed"
    silent: true

  sandbox:configure-coredns:
    desc: "Configure CoreDNS to resolve *.sandbox.rijksapp.dev domains to ingress controller"
    cmds:
      - |
        echo "Configuring CoreDNS to resolve *.sandbox.rijksapp.dev domains..."

        # Get current CoreDNS Corefile
        CURRENT_COREFILE=$(kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}')

        # Check if rewrite rule already exists
        if echo "$CURRENT_COREFILE" | grep -q "name regex.*\.sandbox\.rijksapp\.dev"; then
          echo "CoreDNS rewrite rule for *.sandbox.rijksapp.dev already exists"
          exit 0
        fi

        echo "Adding rewrite rule for *.sandbox.rijksapp.dev domains..."

        # Create new Corefile with rewrite rule inserted after 'ready' line
        NEW_COREFILE=$(echo "$CURRENT_COREFILE" | awk '
          /ready/ {
            print
            print "    rewrite stop {"
            print "        name regex (.+)\\.sandbox\\.rijksapp\\.dev ingress-nginx-controller.ingress-nginx.svc.cluster.local"
            print "        answer auto"
            print "    }"
            next
          }
          {print}
        ')

        # Create a temporary file with the patch
        TEMP_FILE=$(mktemp)
        cat > "$TEMP_FILE" <<EOF
        {
          "data": {
            "Corefile": $(echo "$NEW_COREFILE" | jq -Rs .)
          }
        }
        EOF

        # Apply the patch
        kubectl patch configmap coredns -n kube-system --type merge --patch-file "$TEMP_FILE"

        # Clean up temp file
        rm "$TEMP_FILE"

        # Restart CoreDNS to apply changes
        kubectl rollout restart deployment coredns -n kube-system

        echo "CoreDNS configured for *.sandbox.rijksapp.dev"
    silent: true

  sandbox:create-namespace:
    desc: "Create rig-system namespace for sandboxed-local cluster"
    cmds:
      - |
        if kubectl get namespace rig-system 2>/dev/null; then
          echo "Namespace rig-system already exists"
          exit 0
        fi
        kubectl create namespace rig-system
        echo "Namespace rig-system created"
    silent: true

  sandbox:decrypt-wildcard-cert:
    desc: "Decrypt AGE-encrypted wildcard TLS certificate using developer key"
    cmds:
      - |
        CERT_DIR="security/tls/sandbox-wildcard"
        KEY_FILE="security/developer-key.txt"

        # Plaintext already present: keep it, but detect a stale encrypted source.
        # (The encrypted .age is the committed source of truth; if a renewed cert was
        # dropped in as plaintext without re-encrypting, the .age silently goes stale.)
        if [ -f "$CERT_DIR/fullchain.pem" ] && [ -f "$CERT_DIR/privkey.pem" ]; then
          if [ -f "$KEY_FILE" ] && [ -f "$CERT_DIR/fullchain.pem.age" ]; then
            PLAIN_END=$(openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -enddate 2>/dev/null)
            AGE_TMP=$(mktemp)
            if age --decrypt -i "$KEY_FILE" -o "$AGE_TMP" "$CERT_DIR/fullchain.pem.age" 2>/dev/null; then
              AGE_END=$(openssl x509 -in "$AGE_TMP" -noout -enddate 2>/dev/null)
              if [ "$PLAIN_END" != "$AGE_END" ]; then
                echo "WARNING: plaintext and encrypted wildcard cert differ (plaintext notAfter: ${PLAIN_END#notAfter=}, encrypted notAfter: ${AGE_END#notAfter=})."
                echo "WARNING: the encrypted source may be stale. Run 'task sandbox:encrypt-wildcard-cert' to refresh the .age files."
              fi
            fi
            rm -f "$AGE_TMP"
          fi
          echo "Wildcard TLS certificates already decrypted"
          exit 0
        fi

        # Check encrypted files exist
        if [ ! -f "$CERT_DIR/fullchain.pem.age" ] || [ ! -f "$CERT_DIR/privkey.pem.age" ]; then
          echo "Encrypted certificate files not found in $CERT_DIR/"
          echo "Expected files: fullchain.pem.age, privkey.pem.age"
          exit 1
        fi

        # Prompt for developer key if not present
        if [ ! -f "$KEY_FILE" ]; then
          echo "The sandbox TLS certificates and other secrets are stored"
          echo "encrypted in the repository. A decryption key is needed to"
          echo "unlock them."
          echo ""
          echo "If you don't have this key, ask the ZAD developers."
          echo ""
          echo "Paste the AGE private key (starts with AGE-SECRET-KEY-...):"
          read -rs AGE_SECRET_KEY
          echo ""
          if [[ ! "$AGE_SECRET_KEY" =~ ^AGE-SECRET-KEY- ]]; then
            echo "Invalid key format. Expected a key starting with AGE-SECRET-KEY-"
            exit 1
          fi
          echo "$AGE_SECRET_KEY" > "$KEY_FILE"
          echo "Developer key saved to $KEY_FILE"
        fi

        echo "Decrypting wildcard TLS certificates..."
        age --decrypt -i "$KEY_FILE" -o "$CERT_DIR/fullchain.pem" "$CERT_DIR/fullchain.pem.age"
        age --decrypt -i "$KEY_FILE" -o "$CERT_DIR/privkey.pem" "$CERT_DIR/privkey.pem.age"
        echo "Wildcard TLS certificates decrypted"
    silent: true

  sandbox:encrypt-wildcard-cert:
    desc: "Re-encrypt the wildcard TLS cert PEMs to AGE after renewal"
    cmds:
      - |
        CERT_DIR="security/tls/sandbox-wildcard"
        KEY_FILE="security/developer-key.txt"

        # Check plaintext files exist
        if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
          echo "Plaintext certificate files not found in $CERT_DIR/"
          echo "Expected files: fullchain.pem, privkey.pem"
          exit 1
        fi

        # Developer key needed to derive the AGE recipient
        if [ ! -f "$KEY_FILE" ]; then
          echo "Developer key not found at $KEY_FILE"
          echo "Run 'task sandbox:decrypt-wildcard-cert' first, or ask the ZAD developers."
          exit 1
        fi

        RECIPIENT=$(age-keygen -y "$KEY_FILE")
        echo "Re-encrypting wildcard TLS certificates to AGE for $RECIPIENT..."
        age -r "$RECIPIENT" -o "$CERT_DIR/fullchain.pem.age" "$CERT_DIR/fullchain.pem"
        age -r "$RECIPIENT" -o "$CERT_DIR/privkey.pem.age" "$CERT_DIR/privkey.pem"
        echo "Wildcard TLS certificates re-encrypted"
    silent: true

  sandbox:ask-build-mode:
    desc: "Ask whether to use pre-built images (demo) or build locally (development)"
    cmds:
      - |
        echo ""
        echo "How will you use the sandbox?"
        echo "  1) Demo/test - uses pre-built images from GitHub (fast)"
        echo "  2) Development - builds images locally (slower, allows code changes)"
        echo ""
        read -p "Choose [1/2] (default: 1): " BUILD_CHOICE
        if [ "$BUILD_CHOICE" = "2" ]; then
          echo "dev" > .sandbox-mode
          echo "Development mode selected - images will be built locally"
        else
          echo "demo" > .sandbox-mode
          echo "Demo mode selected - using pre-built images"
        fi
    silent: true

  # Let op bij het aanpassen: `sed -i ''` is BSD/macOS-syntax. GNU sed (Linux, en dus
  # de dev-server) leest die lege string als bestandsnaam en faalt, waardoor de
  # dev-mode daar stil niets deed en de sandbox alsnog de gepubliceerde images pakte.
  # `sed -i.bak` werkt op allebei; de .bak-bestanden ruimen we onderaan op.
  sandbox:configure-local-images:
    desc: "Patch overlay files to use locally built images with imagePullPolicy: Never"
    cmds:
      - |
        # SANDBOX_MODE uit de omgeving wint, zodat een onbewaakte installatie dev-mode
        # kan kiezen zonder ask-build-mode (dat is interactief).
        MODE="${SANDBOX_MODE:-$(cat .sandbox-mode 2>/dev/null || echo demo)}"
        if [ "$MODE" != "dev" ]; then
          exit 0
        fi

        echo "Configuring overlays for local images..."

        # Operations Manager: use local image + Never
        OM_PATCH="bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local/patches/deployment.yaml"
        sed -i.bak 's|image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:latest|image: operations-manager:latest|' "$OM_PATCH"
        sed -i.bak 's|imagePullPolicy: Always|imagePullPolicy: Never|' "$OM_PATCH"

        # CMP sidecar in ArgoCD deployment: use local image + Never
        ARGO_DEPLOY="bootstrap/rig-system/kustomize/overlays/sandboxed-local/argocd-deployment.yaml"
        sed -i.bak 's|image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:latest|image: rig-cmp-argo-kustomize-sops:latest|' "$ARGO_DEPLOY"
        sed -i.bak 's|imagePullPolicy: Always|imagePullPolicy: Never|' "$ARGO_DEPLOY"

        # CMP sidecar kustomize patch: Always -> Never
        KUST="bootstrap/rig-system/kustomize/overlays/sandboxed-local/kustomization.yaml"
        sed -i.bak 's|value: Always|value: Never|' "$KUST"

        # CMP sidecar in shared sops-plugin component: use local image + Never
        CMP_COMPONENT="bootstrap/rig-system/kustomize/components/sops-plugin/kustomization.yaml"
        sed -i.bak 's|image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:latest|image: rig-cmp-argo-kustomize-sops:latest|' "$CMP_COMPONENT"
        sed -i.bak 's|imagePullPolicy: Always|imagePullPolicy: Never|' "$CMP_COMPONENT"

        # .bak-bestanden van de portable sed-aanroepen opruimen.
        find bootstrap infrastructure -name "*.yaml.bak" -delete 2>/dev/null || true

        echo "Overlays configured for local images"
    silent: true

  sandbox:renew-wildcard-cert:
    desc: "Renew the *.sandbox.rijksapp.dev wildcard Let's Encrypt cert (every ~90 days). See docs/sandbox-wildcard-cert-renewal.md."
    cmds:
      - scripts/renew-sandbox-cert.sh

  sandbox:import-wildcard-cert:
    desc: "Import wildcard TLS certificate for *.sandbox.rijksapp.dev"
    cmds:
      - |
        echo "Importing wildcard TLS certificate..."

        CERT_DIR="security/tls/sandbox-wildcard"
        if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
          echo "Certificate files not found in $CERT_DIR/"
          echo "Run 'task sandbox:decrypt-wildcard-cert' first, or place PEM files manually."
          exit 1
        fi

        kubectl create secret tls sandbox-wildcard-tls \
          --cert="$CERT_DIR/fullchain.pem" \
          --key="$CERT_DIR/privkey.pem" \
          -n rig-system \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "Wildcard TLS certificate imported as sandbox-wildcard-tls"

        # Wire the wildcard as nginx's default certificate so every tenant-namespace
        # ingress (which cannot reference the rig-system secret) serves a trusted cert
        # instead of nginx's self-signed fallback. Idempotent: only patches when the
        # flag is absent, so re-runs and any other mechanism that already set it are safe.
        if ! kubectl -n ingress-nginx get deployment ingress-nginx-controller \
             -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null | grep -q 'default-ssl-certificate'; then
          echo "Setting nginx default certificate to rig-system/sandbox-wildcard-tls..."
          kubectl -n ingress-nginx patch deployment ingress-nginx-controller --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--default-ssl-certificate=rig-system/sandbox-wildcard-tls"}]'
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=120s
        else
          echo "nginx default certificate already configured"
        fi
    silent: true

  sandbox:generate-age-key:
    desc: "Generate AGE key for sandbox SOPS encryption (security/sandbox-key.txt)"
    cmds:
      - |
        if [[ -f "security/sandbox-key.txt" ]]; then
          echo "AGE key already exists: security/sandbox-key.txt"
          echo "Current public key: $(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')"
          echo "To generate a new key, first remove the existing security/sandbox-key.txt file"
          exit 0
        fi

        if ! command -v age-keygen &> /dev/null; then
          echo "age-keygen is not installed. Please install age or add it to your PATH."
          echo "  MacOS: brew install age"
          echo "  Linux: apt-get install age or download from https://github.com/FiloSottile/age"
          exit 1
        fi

        mkdir -p security

        echo "Generating new AGE key for sandbox SOPS encryption..."
        age-keygen -o security/sandbox-key.txt

        PUBLIC_KEY=$(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')

        echo ""
        echo "AGE key generated successfully!"
        echo "Key saved to: security/sandbox-key.txt"
        echo "Public key: $PUBLIC_KEY"
    silent: true

  # CLUSTER_TYPE/CLUSTER_FOLDER staan hier letterlijk en komen bewust NIET uit
  # .env-taskfile-current. Dat bestand wordt via `dotenv:` ingelezen bij het *parsen* van
  # de Taskfile, terwijl sandbox:setup het pas in zijn eigen eerste stap aanmaakt. Op een
  # verse checkout draaide de hele run daardoor met lege waarden: de secrets belandden in
  # de bovenliggende overlays/-map, de "bestaat al"-check zag daar de .sops.yaml van een
  # andere cluster, sloeg het genereren over, en setup struikelde later over een
  # ontbrekend postgres-admin-secret. Deze taken zijn per definitie sandboxed-local, dus
  # hoeven ze dat niet uit de omgeving te halen.
  sandbox:generate-infrastructure-secrets:
    desc: "Generate SOPS-encrypted infrastructure secrets for sandboxed-local cluster"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "infrastructure"
          TEMPLATES_DIR: "infrastructure/bootstrap/infrastructure/secrets/templates"
          OUTPUT_DIR: "infrastructure/bootstrap/infrastructure/secrets/config/overlays"
          CLUSTER_TYPE: "sandboxed-local"
          CLUSTER_FOLDER: "sandboxed-local"
          KEY_FILE: "security/sandbox-key.txt"
          FIXED_PASSWORD: "admin1234"

  sandbox:generate-bootstrap-secrets:
    desc: "Generate SOPS-encrypted bootstrap secrets for sandboxed-local cluster"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "bootstrap"
          TEMPLATES_DIR: "bootstrap/rig-system/kustomize/secrets/templates"
          OUTPUT_DIR: "bootstrap/rig-system/kustomize/overlays"
          CLUSTER_TYPE: "sandboxed-local"
          CLUSTER_FOLDER: "sandboxed-local"
          KEY_FILE: "security/sandbox-key.txt"
          FIXED_PASSWORD: "admin1234"

  sandbox:generate-env-secrets:
    desc: "Generate SOPS-encrypted env secrets for sandbox operations-manager"
    vars:
      ENV_FILE: 'operations-manager/python/.env.sandboxed-local.secrets'
      OUTPUT_DIR: 'bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local'
      SECRET_NAME: 'operations-manager-env-secrets'
      NAMESPACE: '{{default "rig-system" .RIG_NAMESPACE}}'
    cmds:
      - |
        if [ ! -f "security/sandbox-key.txt" ]; then
          echo "Sandbox AGE key not found: security/sandbox-key.txt"
          echo "Run 'task sandbox:generate-age-key' first"
          exit 1
        fi

        SECRET_FILE="{{.OUTPUT_DIR}}/{{.SECRET_NAME}}.yaml"
        if [ -f "$SECRET_FILE" ]; then
          echo "SOPS-encrypted env secrets already exist: $SECRET_FILE"
          echo "To regenerate, delete the file first"
          exit 0
        fi

        echo "Generating SOPS-encrypted env secrets for sandbox..."
        mkdir -p "{{.OUTPUT_DIR}}"

        cat > "$SECRET_FILE" << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: operations-manager-env-secrets
          namespace: rig-system
        type: Opaque
        stringData:
          OIDC_CLIENT_SECRET: ""
          KEYCLOAK_MASTER_OIDC_CLIENT_SECRET: ""
        EOF

        # Overlay values from secrets file if it exists and has content
        if [ -f "{{.ENV_FILE}}" ] && grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | grep -q .; then
          grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | while IFS='=' read -r key value; do
            value=$(echo "$value" | sed 's/^["'\'']//' | sed 's/["'\'']$//')
            # Replace the empty value in the template with the actual value
            sed "s|$key: \"\"|$key: \"$value\"|" "$SECRET_FILE" > "$SECRET_FILE.tmp" && mv "$SECRET_FILE.tmp" "$SECRET_FILE"
            echo "  Set: $key"
          done
        else
          echo "No secrets file found or empty, generating with empty values"
        fi

        AGE_PUBLIC_KEY="$(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')"
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$SECRET_FILE"
        echo "SOPS-encrypted secret generated: $SECRET_FILE"
    silent: true

  sandbox:ask-sso:
    desc: "Ask whether to configure SSO (saves answer for later)"
    cmds:
      - |
        # Reuse existing answer if available
        if [ -f ".sandbox-sso" ]; then
          SSO_VALUE=$(cat .sandbox-sso)
          if [ "$SSO_VALUE" = "no" ] || [ -z "$SSO_VALUE" ]; then
            echo "SSO configuration: skipped (previously declined)"
          else
            echo "SSO configuration: already configured (client secret on file)"
          fi
          echo "To reconfigure, delete .sandbox-sso and re-run"
          exit 0
        fi

        echo ""
        echo "========================================="
        echo "SSO Configuration (Optional)"
        echo "========================================="
        echo ""
        echo "The sandbox can use the production Keycloak (keycloak.rijksapp.nl) for real"
        echo "SSO-Rijk authentication. This requires the client secret for the"
        echo "'development-clusters' client in the production rig-platform realm."
        echo ""
        echo "Without SSO, the sandbox still works using a local Keycloak admin user."
        echo "Applications deployed in the sandbox will use Keycloak but cannot use SSO."
        echo ""
        # SANDBOX_SSO from the env answers this non-interactively (e.g. SANDBOX_SSO=no).
        # SANDBOX_NONINTERACTIVE implies "no": an unattended run that sets only that flag
        # would otherwise still block here, waiting for an answer nobody is there to give.
        if [ -n "${SANDBOX_SSO:-}" ]; then
          CONFIGURE_SSO="$SANDBOX_SSO"
          echo "Do you want to configure SSO? [y/N]: ${CONFIGURE_SSO} (from SANDBOX_SSO)"
        elif [ "${SANDBOX_NONINTERACTIVE:-}" = "true" ]; then
          CONFIGURE_SSO="n"
          echo "Do you want to configure SSO? [y/N]: n (SANDBOX_NONINTERACTIVE)"
        else
          printf "Do you want to configure SSO? [y/N]: "
          read -r CONFIGURE_SSO
        fi

        if [ "$CONFIGURE_SSO" != "y" ] && [ "$CONFIGURE_SSO" != "Y" ]; then
          echo "no" > .sandbox-sso
          echo "Skipping SSO configuration."
          echo "You can configure it later by running: task sandbox:configure-sso"
          exit 0
        fi

        echo ""
        echo "Enter the client secret for the 'development-clusters' client from"
        echo "the production Keycloak (keycloak.rijksapp.nl > rig-platform realm > Clients):"
        echo ""
        printf "Client secret: "
        read -rs CLIENT_SECRET
        echo ""

        if [ -z "$CLIENT_SECRET" ]; then
          echo "no" > .sandbox-sso
          echo "No secret provided. Skipping SSO configuration."
          exit 0
        fi

        echo "$CLIENT_SECRET" > .sandbox-sso
        echo "SSO client secret saved"
    silent: true

  sandbox:apply-sso:
    desc: "Apply SSO configuration from earlier prompt"
    cmds:
      - |
        SSO_VALUE=$(cat .sandbox-sso 2>/dev/null || echo "no")
        if [ "$SSO_VALUE" = "no" ] || [ -z "$SSO_VALUE" ]; then
          exit 0
        fi

        ENV_FILE="operations-manager/python/.env.sandboxed-local.secrets"
        cat > "$ENV_FILE" << SECRETS_EOF
        # Sandbox SSO secrets (generated by sandbox:apply-sso)
        # This file is gitignored - do not commit
        KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=$SSO_VALUE
        SECRETS_EOF

        echo "SSO secret saved to: $ENV_FILE"
    silent: true

  sandbox:configure-sso:
    desc: "Configure SSO for sandbox (standalone - asks and applies immediately)"
    cmds:
      - task: sandbox:ask-sso
      - task: sandbox:apply-sso
      - task: sandbox:generate-env-secrets
    silent: true

  sandbox:wait-ready:
    desc: "Wait for all sandbox services to be deployed and healthy"
    cmds:
      - |
        echo "Waiting for infrastructure to be deployed by ArgoCD..."
        echo ""

        # Force ArgoCD to refresh applications (clears any cached comparison errors)
        for APP in sandbox-infrastructure user-applications; do
          kubectl annotate application -n {{.RIG_NAMESPACE}} "$APP" \
            argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true
        done

        # Wait for sandbox-infrastructure to sync (up to 5 minutes)
        MAX_ATTEMPTS=60
        for i in $(seq 1 $MAX_ATTEMPTS); do
          SYNC_STATUS=$(kubectl get application -n {{.RIG_NAMESPACE}} sandbox-infrastructure -o jsonpath='{.status.sync.status}' 2>/dev/null)
          HEALTH_STATUS=$(kubectl get application -n {{.RIG_NAMESPACE}} sandbox-infrastructure -o jsonpath='{.status.health.status}' 2>/dev/null)

          if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
            echo "Infrastructure application: Synced + Healthy"
            break
          fi

          # If stuck with comparison error, force another refresh
          if [ "$SYNC_STATUS" = "Unknown" ] && [ $((i % 10)) -eq 0 ]; then
            echo "  Forcing ArgoCD refresh (sync status still Unknown)..."
            kubectl annotate application -n {{.RIG_NAMESPACE}} sandbox-infrastructure \
              argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true
          fi

          echo "  [$i/$MAX_ATTEMPTS] sync=$SYNC_STATUS health=$HEALTH_STATUS - waiting 5s..."
          sleep 5
        done

        if [ "$SYNC_STATUS" != "Synced" ]; then
          echo "WARNING: Infrastructure did not reach Synced state within timeout"
          echo "  Current: sync=$SYNC_STATUS health=$HEALTH_STATUS"
          echo "  Continuing anyway - services may still be starting..."
        fi

        echo ""
        echo "Waiting for Keycloak to be ready..."
        kubectl wait --for=condition=available deployment/keycloak -n {{.RIG_NAMESPACE}} --timeout=300s 2>/dev/null || {
          echo "WARNING: Keycloak deployment not available within timeout"
        }

        echo "Waiting for operations manager to be ready..."
        kubectl wait --for=condition=available deployment/operations-manager -n {{.RIG_NAMESPACE}} --timeout=300s 2>/dev/null || {
          echo "WARNING: Operations manager deployment not available within timeout"
        }

        echo ""
        echo "All services are deployed and available"
    silent: true

  sandbox:create-sops-age-secret:
    desc: "Create sops-age-key Kubernetes secret from sandbox AGE key"
    cmds:
      - |
        if [ ! -f "security/sandbox-key.txt" ]; then
          echo "security/sandbox-key.txt not found. Run 'task sandbox:generate-age-key' first."
          exit 1
        fi

        kubectl create secret generic sops-age-key \
          --from-file=key=security/sandbox-key.txt \
          -n rig-system \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "sops-age-key secret created in rig-system"

        # De RON-namespace (mailrelay) krijgt hetzelfde geheim: de CMP-plugin die de
        # ron-infrastructure-app rendert, controleert op de namespace en leest dit secret
        # in de namespace van de app. De namespace zelf kan NIET via GitOps (de ArgoCD op
        # dit clustertype draait in namespaced mode en weigert Namespace-resources), dus
        # hij wordt hier handmatig aangemaakt, met het label dat de argocd-operator de
        # beheer-RBAC voor de namespace laat aanmaken. Zonder deze twee blijft de app
        # hangen op "Namespace 'rig-ron' does not exist" / "SOPS secret not found".
        kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: Namespace
        metadata:
          name: rig-ron
          labels:
            app.kubernetes.io/name: operations-ron
            app.kubernetes.io/component: mail
            app.kubernetes.io/part-of: rig-platform
            argocd.argoproj.io/managed-by: rig-system
        EOF

        kubectl create secret generic sops-age-key \
          --from-file=key=security/sandbox-key.txt \
          -n rig-ron \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "namespace rig-ron en sops-age-key secret created"
    silent: true

  sandbox:deploy-postgresql-direct:
    desc: "Deploy minimal PostgreSQL directly (pre-ArgoCD, just enough for Forgejo)"
    cmds:
      - |
        echo "Deploying minimal PostgreSQL cluster..."

        # Wait for CNPG webhook to be ready
        echo "Waiting for CNPG operator webhook to be ready..."
        kubectl wait --for=condition=Available --timeout=120s \
          deployment/cnpg-controller-manager -n cnpg-system
        sleep 5

        SECRETS_DIR="infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local"

        # Decrypt and apply the SOPS-encrypted secrets (same passwords ArgoCD will use later)
        echo "Applying SOPS-decrypted database credential secrets..."
        for SECRET in postgres-admin-secret forgejo-db-credentials-secret keycloak-db-credentials-secret; do
          SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" sops --decrypt "$SECRETS_DIR/${SECRET}.yaml.sops.yaml" | kubectl apply -f -
        done

        # Apply just the Cluster resource - ArgoCD will manage the full overlay later
        echo "Applying PostgreSQL Cluster resource..."
        kubectl apply -f infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml

        echo "Waiting for PostgreSQL cluster to be ready..."
        until kubectl get cluster rig-db -n rig-system 2>/dev/null; do
          echo "  Waiting for Cluster resource to appear..."
          sleep 5
        done
        kubectl wait --for=condition=Ready cluster/rig-db -n rig-system --timeout=300s

        # Create individual databases (forgejo, keycloak) via CNPG Database CRD
        echo "Creating databases..."
        kubectl apply -f infrastructure/bootstrap/infrastructure/postgresql/database/base/databases.yaml

        echo "PostgreSQL cluster is ready with databases"
    silent: true

  sandbox:deploy-forgejo-direct:
    desc: "Deploy Forgejo directly (pre-ArgoCD bootstrap)"
    cmds:
      - |
        echo "Deploying Forgejo..."
        kustomize build infrastructure/bootstrap/infrastructure/forgejo/controller/overlays/sandboxed-local | kubectl apply -f -
        echo "Forgejo StatefulSet, Service, and Ingress applied"
    silent: true

  sandbox:wait-forgejo:
    desc: "Wait for Forgejo pod to be healthy"
    cmds:
      - |
        echo "Waiting for Forgejo pod to be ready..."
        kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=300s 2>/dev/null || {
          echo "Pod not found yet, waiting..."
          sleep 15
          kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=300s
        }
        echo "Forgejo is ready"
    silent: true

  sandbox:init-forgejo:
    desc: "Initialize Forgejo: create admin user and repositories"
    cmds:
      - |
        echo "Initializing Forgejo..."

        # Create admin user via kubectl exec (username "admin" is reserved in Forgejo)
        echo "Creating rig-admin user..."
        kubectl exec -n rig-system forgejo-0 -- forgejo admin user create \
          --admin --username rig-admin --password admin1234 \
          --email admin@example.com --must-change-password=false 2>&1 || {
          echo "rig-admin user may already exist (this is OK)"
        }

        # Wait a moment for the user to be fully created
        sleep 2

        # Create repositories via Forgejo API
        echo "Creating repositories..."
        for REPO in zad-projects zad-argo-user-applications zad-argo-infrastructure zad-deployments; do
          echo "  Creating: $REPO"
          kubectl exec -n rig-system forgejo-0 -- wget -q -O- \
            --header="Content-Type: application/json" \
            --post-data="{\"name\":\"$REPO\",\"private\":false,\"auto_init\":true,\"default_branch\":\"main\"}" \
            "http://rig-admin:admin1234@localhost:3000/api/v1/user/repos" 2>/dev/null || echo "  $REPO may already exist"
        done

        # Verify git repos exist on disk, manually init if auto_init failed
        # (The rootless image may fail to init bare repos if the repository root didn't exist yet)
        echo "Verifying git repositories on disk..."
        kubectl exec -n rig-system forgejo-0 -- sh -c '
          REPO_ROOT="/var/lib/gitea/git/repositories/rig-admin"
          mkdir -p "$REPO_ROOT"
          # Ensure /tmp/gitea exists (rootless image sets TMPDIR=/tmp/gitea)
          mkdir -p /tmp/gitea
          for REPO in zad-projects zad-argo-user-applications zad-argo-infrastructure zad-deployments; do
            REPO_PATH="$REPO_ROOT/${REPO}.git"
            if [ ! -d "$REPO_PATH/refs" ]; then
              echo "  Initializing bare repo on disk: $REPO"
              git init --bare "$REPO_PATH" 2>/dev/null
              git -C "$REPO_PATH" symbolic-ref HEAD refs/heads/main
              # Create initial commit in a temp work dir
              WORK="/tmp/gitea/init-${REPO}"
              rm -rf "$WORK"
              git clone "$REPO_PATH" "$WORK" 2>/dev/null
              cd "$WORK"
              git checkout -b main 2>/dev/null
              git config user.email "admin@example.com"
              git config user.name "rig-admin"
              echo "# ${REPO}" > README.md
              git add README.md
              git commit -m "Initial commit" 2>/dev/null
              git push origin main 2>/dev/null
              cd /
              rm -rf "$WORK"
            else
              echo "  $REPO: OK (already initialized)"
            fi
          done
        '

        echo ""
        echo "Forgejo initialized with rig-admin/admin1234 and 4 repositories"
    silent: true

  sandbox:sync:
    desc: "Sync infrastructure/ directory to Forgejo zad-argo-infrastructure repo"
    cmds:
      - |
        echo "Syncing infrastructure/ to Forgejo zad-argo-infrastructure..."

        FORGEJO_REPO="https://rig-admin:admin1234@forgejo.sandbox.rijksapp.dev/rig-admin/zad-argo-infrastructure.git"
        TEMP_DIR=$(mktemp -d)

        # Clone the repo (use HTTPS to avoid credential stripping on HTTP->HTTPS redirect)
        git clone "$FORGEJO_REPO" "$TEMP_DIR" 2>/dev/null || {
          echo "Could not clone via ingress, trying in-cluster port-forward..."
          # Forgejo pod may have restarted after init-forgejo (OOM, liveness probe),
          # so wait for it to be Ready before attempting port-forward
          echo "Waiting for Forgejo pod to be ready..."
          kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=120s
          # Fallback: use kubectl port-forward
          kubectl port-forward -n rig-system svc/forgejo 3000:3000 &
          PF_PID=$!
          sleep 3
          FORGEJO_REPO="http://rig-admin:admin1234@localhost:3000/rig-admin/zad-argo-infrastructure.git"
          git clone "$FORGEJO_REPO" "$TEMP_DIR"
          kill $PF_PID 2>/dev/null || true
        }

        # Sync infrastructure directory content (strip infrastructure/ prefix)
        rsync -av --delete --exclude='.git' infrastructure/ "$TEMP_DIR/"

        # Commit and push
        cd "$TEMP_DIR"
        git add -A
        git diff --cached --quiet || {
          git -c user.name="sandbox-sync" -c user.email="sync@sandbox" commit -m "Sync infrastructure from local"
          git push origin main
          echo "Changes pushed to Forgejo"
        }
        cd -

        # Clean up
        rm -rf "$TEMP_DIR"

        # Trigger ArgoCD to refresh the infrastructure application
        echo "Triggering ArgoCD refresh for sandbox-infrastructure..."
        kubectl annotate application -n {{.RIG_NAMESPACE}} sandbox-infrastructure \
          argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true

        echo "Infrastructure sync complete"
    silent: true

  sandbox:import-project:
    desc: "Import production project files into sandbox Forgejo (re-encrypts secrets, transforms cluster config)"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task sandbox:import-project -- <project-name> [project-name...]"
          echo ""
          echo "Examples:"
          echo "  task sandbox:import-project -- amt-dev"
          echo "  task sandbox:import-project -- amt-dev wies regel-k4c"
          echo ""
          echo "Available projects:"
          ls "{{.IMPORT_SOURCE_DIR}}" 2>/dev/null | sed 's/.yaml$//' | column
          exit 1
        fi

        OUTPUT_DIR=$(mktemp -d)

        # Run migration script
        echo "Transforming project files..."
        cd operations-manager/python
        # --probe-image staat er expliciet in en niet als kale vlag. Hij heeft een
        # OPTIONELE waarde (nargs="?"), dus een kale --probe-image gevolgd door
        # projectnamen slikt de eerste naam op als waarde: elk image wordt dan die
        # projectnaam en dat project verdwijnt uit de uitvoer. Zonder de vlag blijven
        # de productie-images EN de productie-resources staan, en dan past het niet
        # op een kind-cluster.
        uv run python -m scripts.migrate_project_to_sandbox \
          --source-dir "{{.IMPORT_SOURCE_DIR}}" \
          --output-dir "$OUTPUT_DIR" \
          --probe-image "{{.PROBE_IMAGE}}" \
          {{if .SANDBOX_PUBLIC_KEY}}--sandbox-public-key "{{.SANDBOX_PUBLIC_KEY}}"{{end}} \
          {{.CLI_ARGS}}

        if [ $? -ne 0 ]; then
          echo "Migration script failed"
          rm -rf "$OUTPUT_DIR"
          exit 1
        fi

        # Check if any files were produced
        if [ -z "$(ls -A "$OUTPUT_DIR" 2>/dev/null)" ]; then
          echo "No output files produced"
          rm -rf "$OUTPUT_DIR"
          exit 1
        fi

        # Clone zad-projects from Forgejo and push transformed files
        echo ""
        echo "Pushing to Forgejo zad-projects..."
        FORGEJO_REPO="https://rig-admin:admin1234@forgejo.sandbox.rijksapp.dev/rig-admin/zad-projects.git"
        CLONE_DIR=$(mktemp -d)

        git clone "$FORGEJO_REPO" "$CLONE_DIR" 2>/dev/null || {
          echo "Failed to clone from Forgejo. Is the sandbox running and forgejo.sandbox.rijksapp.dev reachable?"
          rm -rf "$OUTPUT_DIR" "$CLONE_DIR"
          exit 1
        }

        # Ensure projects/ directory exists in the repo
        mkdir -p "$CLONE_DIR/projects"

        # Copy transformed files
        cp "$OUTPUT_DIR"/*.yaml "$CLONE_DIR/projects/"

        # Commit and push
        cd "$CLONE_DIR"
        git add -A
        git diff --cached --quiet || {
          IMPORTED=$(ls "$OUTPUT_DIR" | sed 's/.yaml$//' | tr '\n' ', ' | sed 's/,$//')
          git -c user.name="sandbox-import" -c user.email="import@sandbox" \
            commit -m "Import production projects: $IMPORTED"
          git push origin main
          echo "Pushed to Forgejo: $IMPORTED"
        }
        cd -

        # Clean up
        rm -rf "$OUTPUT_DIR" "$CLONE_DIR"

        echo ""
        echo "Import complete. Trigger a project refresh in OPI to process the changes."
    silent: true
    vars:
      IMPORT_SOURCE_DIR: '{{.IMPORT_SOURCE_DIR | default "/Users/robbertuittenbroek/IdeaProjects/rig-cluster-test-git-repositories/rig-cluster-projects-github/projects"}}'
      # Elk component krijgt deze image en het probe-resourceprofiel; productiewaarden
      # passen niet op een kind-cluster.
      PROBE_IMAGE: '{{.PROBE_IMAGE | default "ghcr.io/minbzk/base-images/e2e-allservices:latest"}}'
      # Leeg = hersleutel naar security/sandbox-key.txt (de sandbox op deze machine).
      # Gevuld met de PUBLIEKE sleutel van een ander cluster = hersleutel daarheen, en
      # de private helft blijft daar. Ophalen met:
      #   kubectl --context <ctx> -n rig-system get secret sops-age-key \
      #     -o jsonpath='{.data.key}' | base64 -d | grep 'public key'
      SANDBOX_PUBLIC_KEY: '{{.SANDBOX_PUBLIC_KEY | default ""}}'

  sandbox:update-dns:
    desc: "Configure dnsmasq to resolve *.sandbox.rijksapp.dev to 127.0.0.1"
    cmds:
      - |
        DOMAIN="sandbox.rijksapp.dev"
        DNSMASQ_ENTRY="address=/.${DOMAIN}/127.0.0.1"

        # Find dnsmasq config
        DNSMASQ_CONF=""
        if [ -f "/opt/homebrew/etc/dnsmasq.conf" ]; then
          DNSMASQ_CONF="/opt/homebrew/etc/dnsmasq.conf"
        elif [ -f "/usr/local/etc/dnsmasq.conf" ]; then
          DNSMASQ_CONF="/usr/local/etc/dnsmasq.conf"
        fi

        if [ -z "$DNSMASQ_CONF" ]; then
          echo "dnsmasq not found. Install with: brew install dnsmasq"
          echo "Then run: brew services start dnsmasq"
          exit 1
        fi

        # Check if dnsmasq already has the entry
        if grep -qF "$DNSMASQ_ENTRY" "$DNSMASQ_CONF" 2>/dev/null; then
          echo "dnsmasq already configured for *.${DOMAIN}"
        else
          echo "Adding wildcard DNS entry to dnsmasq..."
          echo "$DNSMASQ_ENTRY" >> "$DNSMASQ_CONF"
          sudo brew services restart dnsmasq
          echo "dnsmasq updated and restarted"
        fi

        # Create macOS resolver file
        RESOLVER_FILE="/etc/resolver/${DOMAIN}"
        if [ -f "$RESOLVER_FILE" ]; then
          echo "Resolver file already exists: $RESOLVER_FILE"
        else
          echo "Creating resolver file (requires sudo)..."
          sudo mkdir -p /etc/resolver
          echo "nameserver 127.0.0.1" | sudo tee "$RESOLVER_FILE" > /dev/null
          echo "Resolver file created: $RESOLVER_FILE"
        fi

        echo ""
        echo "*.${DOMAIN} now resolves to 127.0.0.1"
    silent: true

  sandbox:build-local-images-if-dev:
    desc: "Build+load de images die dev-mode lokaal verwacht (no-op in demo-mode)"
    internal: true
    cmds:
      - |
        # SANDBOX_MODE uit de omgeving wint, zodat een onbewaakte installatie dev-mode
        # kan kiezen zonder ask-build-mode (dat is interactief).
        MODE="${SANDBOX_MODE:-$(cat .sandbox-mode 2>/dev/null || echo demo)}"
        if [ "$MODE" != "dev" ]; then
          echo "Demo-mode: images komen uit de registry, niet lokaal gebouwd."
          exit 0
        fi
        # Beide, niet alleen operations-manager: configure-local-images zet ook de
        # CMP-sidecar op een lokale tag met imagePullPolicy Never. Ontbreekt die, dan
        # blijft argocd-repo-server op ErrImageNeverPull staan en komt ArgoCD niet op.
        task sandbox:build-cmp-image
        task sandbox:build-operations-manager-image
    silent: true

  sandbox:build-builder:
    desc: "Zorg voor een buildx-builder met een geheugengrens (gedeelde server)"
    summary: |
      Een build zonder grens kan het hele werkgeheugen pakken en trekt dan de andere
      sessies en het kind-cluster mee om. De standaard-builder (driver `docker`) draait
      in de docker-daemon en kent geen grens; een `docker-container`-builder wel.

      Die builder houdt daarnaast zijn eigen buildcache vast tussen builds door. Dat is
      wat de drie apt-rondes uit operations-manager/Dockerfile na de eerste build
      overslaat, ook wanneer de pakketspiegels slecht bereikbaar zijn.

      SANDBOX_BUILD_MEMORY overschrijft de grens (standaard {{.SANDBOX_BUILD_MEMORY}}).
    vars:
      BUILDER_CONTAINER: 'buildx_buildkit_{{.SANDBOX_BUILDER_NAME}}0'
    cmds:
      - |
        # numfmt wil hoofdletters (4G), docker accepteert beide - vandaar de tr.
        WANT="$(echo "{{.SANDBOX_BUILD_MEMORY}}" | tr '[:lower:]' '[:upper:]' | numfmt --from=iec)"
        STATE="$(docker inspect {{.BUILDER_CONTAINER}} 2>/dev/null | jq -r '"\(.[0].HostConfig.Memory) \(.[0].HostConfig.NetworkMode)"' 2>/dev/null || echo "")"
        # De container in de daemon is niet waar `docker buildx build --builder` kijkt: die
        # leest de buildx-store van de SESSIE (~/.docker/buildx). Op de gedeelde server heeft
        # elke sessie een eigen store bij dezelfde daemon, dus een container die er staat kan
        # in deze sessie onbekend zijn - en dan valt de build om met 'no builder found' nadat
        # deze taak "staat klaar" meldde. Daarom beide voorwaarden.
        if ! docker buildx inspect {{.SANDBOX_BUILDER_NAME}} >/dev/null 2>&1 || [ "$STATE" != "$WANT host" ]; then
          # Bestaat hij met een andere (of geen) grens, dan is opnieuw aanmaken de enige
          # manier: een draaiende buildkit-container krijgt geen nieuwe limiet. Staat hij
          # goed maar kent deze sessie hem niet, dan neemt `create --bootstrap` de bestaande
          # container met dezelfde naam over (exit 0) en blijft de buildcache staan.
          if [ -n "$STATE" ] && [ "$STATE" != "$WANT host" ]; then
            echo "Builder {{.SANDBOX_BUILDER_NAME}} staat op '$STATE', gewenst '$WANT host' - opnieuw aanmaken..."
          elif [ -n "$STATE" ]; then
            echo "Builder {{.SANDBOX_BUILDER_NAME}} draait wel, maar staat niet in de buildx-store van deze sessie - overnemen..."
          fi
          docker buildx rm {{.SANDBOX_BUILDER_NAME}} >/dev/null 2>&1 || true
          # network=host om dezelfde reden als --network=host in sandbox-deploy: zonder
          # host-netwerk komt de builder niet bij de DNS van de server en strandt de
          # eerste regel van de Dockerfile al op "no route to host".
          docker buildx create \
            --name {{.SANDBOX_BUILDER_NAME}} \
            --driver docker-container \
            --driver-opt memory={{.SANDBOX_BUILD_MEMORY}} \
            --driver-opt network=host \
            --bootstrap >/dev/null
          echo "Builder {{.SANDBOX_BUILDER_NAME}} klaargezet met geheugengrens {{.SANDBOX_BUILD_MEMORY}}"
        else
          echo "Builder {{.SANDBOX_BUILDER_NAME}} staat klaar met geheugengrens {{.SANDBOX_BUILD_MEMORY}}"
        fi
    silent: true

  sandbox:build-operations-manager-image:
    desc: "Build operations-manager image and load into Kind (no deploy)"
    cmds:
      # Niet beginnen als er te weinig vrij is: dat was vooraf te zien toen een build de
      # server bijna omver trok. Zie docs/uitrol-op-de-dev-server.md.
      - scripts/build-preflight.sh
      # Eerst de versie schrijven, anders bakt de build in wat er toevallig op schijf ligt:
      # opi/version.json staat in .gitignore en dus niet in `git status`, maar wel in de
      # buildcontext, en opi/core/version.py laat dat bestand voorgaan op de ingebakken
      # build-args. Een image kon zo een commit van dagen eerder over zichzelf melden.
      - task: version:generate
      - task: sandbox:build-builder
      - |
        echo "Building operations-manager Docker image..."
        # --cache-from: dezelfde vorm als publish-operations-manager (docker-build-and-push).
        # Leeg gelaten pakt hij alleen de cache van de builder zelf; met SANDBOX_CACHE_IMAGE
        # kun je er een registry-cache naast zetten.
        CACHE_FLAGS=""
        if [ -n "{{.SANDBOX_CACHE_IMAGE}}" ]; then
          CACHE_FLAGS="--cache-from type=registry,ref={{.SANDBOX_CACHE_IMAGE}}"
        fi
        docker buildx build \
          --builder {{.SANDBOX_BUILDER_NAME}} \
          $CACHE_FLAGS \
          --target application \
          --load \
          -t operations-manager \
          -f operations-manager/Dockerfile .
      - |
        echo "Loading image into Kind cluster..."
        kind load docker-image operations-manager:latest --name {{.KIND_CLUSTER_NAME}}
        echo "Operations manager image loaded"
    silent: true

  sandbox:update-operations-manager:
    desc: "Build and deploy the operations-manager to the sandbox cluster"
    cmds:
      # Bouwen en in Kind laden staat in één taak, zodat de preflight, de geheugengrens
      # en de cache hier niet uit de pas kunnen lopen met de bouwtaak.
      - task: sandbox:build-operations-manager-image
      - |
        echo "Updating operations-manager deployment..."
        SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local --load-restrictor LoadRestrictionsNone | kubectl apply -f -
        kubectl set env deployment/operations-manager -n {{.RIG_NAMESPACE}} \
          ZAD_VERSION="$(git describe --tags --always)" \
          ZAD_BUILD_DATE="$(date +%Y-%m-%d)"
        kubectl rollout restart deployment operations-manager -n {{.RIG_NAMESPACE}}
      - echo "Operations manager updated successfully"
    silent: true

  version:generate:
    desc: "Write opi/version.json from git (feeds the /version endpoint and footer)"
    dir: operations-manager/python
    cmds:
      - uv run python scripts/write_version_file.py

  version:watch:
    desc: "Continuously regenerate opi/version.json so skaffold hot-syncs the running commit/dirty state"
    dir: operations-manager/python
    cmds:
      - while true; do uv run python scripts/write_version_file.py; sleep 5; done

  sandbox:forward:
    desc: "Stuur lokaal 80/443 door naar de sandbox op de server (on|off|status)"
    summary: |
      Alle sandboxdomeinen resolven hier al naar 127.0.0.1, dus deze forward maakt ze in
      een klap bruikbaar tegen de sandbox op de server in plaats van een lokaal cluster.

        task sandbox:forward -- on       aanzetten (vraagt sudo, 80/443 zijn root-poorten)
        task sandbox:forward -- status   staat hij aan, en antwoordt hij
        task sandbox:forward -- off      uitzetten

      Draait je LOKALE kind-sandbox, dan houdt die 80/443 al bezet en kan de forward niet
      binden; het script meldt dat in plaats van half te starten.
    cmds:
      - scripts/sandbox-forward.sh {{.CLI_ARGS | default "status"}}
    silent: true

  sandbox:skaffold-dev:
    desc: "Start Skaffold with hot-reload for sandbox development"
    cmds:
      - echo "Starting Skaffold in hot-reload mode (sandboxed-local)..."
      - task: version:generate
      # Vastgepind, niet afgeleid van de huidige context: skaffold rolt anders uit naar
      # waar kubectl toevallig staat. Dat is een keer op het integratietest-cluster
      # geland en levert een muur van "namespaces rig-system not found" op.
      - SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" skaffold dev --kube-context kind-rig-sandbox --port-forward -f operations-manager/skaffold-sandboxed-local.yaml

  sandbox:skaffold-debug:
    desc: "Start Skaffold in debug mode for sandbox development (debugpy on port 5678)"
    cmds:
      - echo "Starting Skaffold in debug mode (sandboxed-local)..."
      - 'echo "Attach IntelliJ debugger: Run → Debug Remote Debug - Operations Manager (localhost:5678)"'
      - SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" skaffold dev --kube-context kind-rig-sandbox --port-forward -f operations-manager/skaffold-sandboxed-local-debug.yaml

  sandbox:build-cmp-image:
    desc: "Build CMP kustomize-sops image and load into Kind (no ArgoCD restart)"
    cmds:
      - |
        echo "Building cmp-kustomize-sops Docker image..."
        docker buildx build --no-cache --progress=plain --load -t rig-cmp-argo-kustomize-sops:latest -f images/cmp-kustomize-sops/Dockerfile .
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image rig-cmp-argo-kustomize-sops:latest --name {{.KIND_CLUSTER_NAME}}
      - echo "CMP kustomize-sops image built and loaded into Kind"
    silent: true

  sandbox:destroy:
    desc: "Destroy the sandboxed-local Kind cluster and clean up generated files"
    cmds:
      - |
        echo "Destroying sandboxed-local cluster..."
        kind delete cluster --name rig-sandbox

        # Clean up generated secret overview files
        rm -f secrets-overview-bootstrap-sandboxed-local.yaml
        rm -f secrets-overview-infrastructure-sandboxed-local.yaml

        # Clean up generated SOPS-encrypted secrets and decrypt-sops.yaml (recreated by generate task)
        rm -f infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local/*.sops.yaml
        rm -f infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local/decrypt-sops.yaml
        rm -f bootstrap/rig-system/kustomize/overlays/sandboxed-local/*.sops.yaml
        rm -f bootstrap/rig-system/kustomize/overlays/sandboxed-local/decrypt-sops.yaml

        # Clean up SOPS-encrypted env secrets for operations-manager
        rm -f bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local/operations-manager-env-secrets.yaml

        # Clean up sandbox AGE key
        rm -f security/sandbox-key.txt

        # Clean up local secrets file (gitignored)
        rm -f operations-manager/python/.env.sandboxed-local.secrets

        # Clean up sandbox state files
        rm -f .sandbox-sso

        echo "Cluster rig-sandbox deleted and sandbox artifacts cleaned up"
    silent: true

  # ---------------------------------------------------------------------------
  # fundament-poc: het Fundament-platform levert een kaal cluster, dus de laag
  # tussen Kubernetes en ZAD brengen we zelf mee. Zie
  # docs/fundament-cluster-checklist.md voor waarom elk onderdeel hier staat.
  #
  # Alles is idempotent: opnieuw draaien is veilig en de aangewezen manier om
  # bij te werken. Dat is geen luxe maar noodzaak, want bij een node-vervanging
  # moet dit opnieuw.
  # ---------------------------------------------------------------------------

  fundament:check:
    desc: "Verify the fundament-poc prerequisites: functl, authentication, and the right cluster"
    vars:
      CTX: '{{.KUBE_CONTEXT}}'
    cmds:
      - |
        fail() { echo "❌ $1"; exit 1; }

        [ -n "{{.CTX}}" ] || fail "KUBE_CONTEXT is niet gezet. Draai 'task select-cluster' en kies fundament-poc."

        command -v functl >/dev/null 2>&1 || fail "functl staat niet op de PATH. De kubeconfig gebruikt hem als exec-plugin, dus zonder functl werkt geen enkel kubectl-commando tegen dit cluster."

        functl auth status 2>/dev/null | grep -q "Authenticated: *yes" || fail "functl is niet ingelogd. Draai 'functl auth login' met een API-key uit https://console.fundament-poc.nl (gebruikersmenu rechtsboven, API keys)."

        kubectl config get-contexts -o name 2>/dev/null | grep -qx "{{.CTX}}" || fail "kubectl-context '{{.CTX}}' bestaat niet. Merge de kubeconfig van het cluster erin."

        SERVER=$(kubectl config view --minify --context "{{.CTX}}" -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)
        echo "$SERVER" | grep -q "fundament" || fail "Context '{{.CTX}}' wijst naar '$SERVER', en dat lijkt geen Fundament-cluster. Gestopt voordat er iets geïnstalleerd wordt."

        kubectl --context "{{.CTX}}" --request-timeout=30s auth can-i create customresourcedefinitions >/dev/null 2>&1 || fail "Geen rechten om CRD's aan te maken op '{{.CTX}}'."

        echo "✅ functl aanwezig en ingelogd"
        echo "✅ context {{.CTX}} -> $SERVER"
        echo "✅ rechten voor CRD's aanwezig"
    silent: true

  fundament:install-platform:
    desc: "Install the platform layer fundament-poc does not provide: ingress, TLS, storage, database operator"
    deps: [fundament:check]
    vars:
      CTX: '{{.KUBE_CONTEXT}}'
      # Gepind, niet 'latest': een installatie moet over een maand hetzelfde opleveren.
      INGRESS_NGINX_VERSION: '{{default "v1.15.1" .INGRESS_NGINX_VERSION}}'
      CERT_MANAGER_VERSION: '{{default "v1.21.1" .CERT_MANAGER_VERSION}}'
      LOCAL_PATH_VERSION: '{{default "v0.0.37" .LOCAL_PATH_VERSION}}'
      CNPG_VERSION: '{{default "1.27.3" .CNPG_VERSION}}'
    cmds:
      - |
        K="kubectl --context {{.CTX}} --request-timeout=180s"

        # ingress-nginx: de cloud-variant, niet de Kind-variant. MetalLB en de metal-ccm
        # kennen we hier een echte LoadBalancer toe; de Kind-variant patcht hostPorts en
        # gaat uit van poortmappings op de control-plane node die hier niet bestaan.
        echo "📦 ingress-nginx {{.INGRESS_NGINX_VERSION}}"
        $K apply -f "https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-{{.INGRESS_NGINX_VERSION}}/deploy/static/provider/cloud/deploy.yaml" >/dev/null
        $K -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s

        # cert-manager: het platform levert de Gardener cert-extensie (cert.gardener.cloud),
        # maar onze manifests genereren cert-manager.io-resources. Zelf meebrengen scheelt
        # een verbouwing van issuer-letsencrypt.yaml.jinja.
        echo "📦 cert-manager {{.CERT_MANAGER_VERSION}}"
        $K apply -f "https://github.com/cert-manager/cert-manager/releases/download/{{.CERT_MANAGER_VERSION}}/cert-manager.yaml" >/dev/null
        for d in cert-manager cert-manager-webhook cert-manager-cainjector; do
          $K -n cert-manager rollout status "deployment/$d" --timeout=180s
        done

        # local-path-provisioner: de meegeleverde csi-lvm kan niets provisionen omdat zijn
        # device-patroon de systeemschijf meepakt, en die configuratie is gardener-beheerd.
        # Tijdelijk tot de Rook/Ceph-plugin van het platform er is; die brengt ook de
        # VolumeSnapshotClass mee die local-path niet heeft.
        echo "📦 local-path-provisioner {{.LOCAL_PATH_VERSION}}"
        $K apply -f "https://raw.githubusercontent.com/rancher/local-path-provisioner/{{.LOCAL_PATH_VERSION}}/deploy/local-path-storage.yaml" >/dev/null

        # De default /opt/local-path-provisioner staat op de 24GB-rootpartitie.
        # /var/lib zit op de grote partitie (2,7 TB vrij), waar kubelet en containerd ook staan.
        $K -n local-path-storage patch configmap local-path-config --type merge -p \
          '{"data":{"config.json":"{\n  \"nodePathMap\":[\n    {\n      \"node\":\"DEFAULT_PATH_FOR_NON_LISTED_NODES\",\n      \"paths\":[\"/var/lib/local-path-provisioner\"]\n    }\n  ]\n}\n"}}' >/dev/null
        $K -n local-path-storage rollout restart deployment/local-path-provisioner >/dev/null
        $K -n local-path-storage rollout status deployment/local-path-provisioner --timeout=180s

        echo "📦 CloudNativePG {{.CNPG_VERSION}}"
        $K apply --server-side -f "https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-{{.CNPG_VERSION}}.yaml" >/dev/null
        $K -n cnpg-system rollout status deployment/cnpg-controller-manager --timeout=180s

        echo ""
        echo "✅ Platformlaag geïnstalleerd. Draai 'task fundament:verify' om te controleren dat het werkt."
    silent: true

  fundament:verify:
    desc: "Prove the fundament-poc platform layer works: a PVC binds and the ingress has a public address"
    deps: [fundament:check]
    vars:
      CTX: '{{.KUBE_CONTEXT}}'
      NS: zad-verify
    cmds:
      - |
        K="kubectl --context {{.CTX}} --request-timeout=180s"
        trap '$K delete namespace {{.NS}} --wait=false >/dev/null 2>&1 || true' EXIT

        echo "🔎 ingress-adres"
        IP=$($K -n ingress-nginx get svc ingress-nginx-controller -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null)
        [ -n "$IP" ] || { echo "❌ De ingresscontroller heeft geen adres. Zonder MetalLB-toewijzing blijft de service Pending."; exit 1; }
        echo "   $IP"

        echo "🔎 opslag: bindt een PVC en kan een non-root pod erin schrijven?"
        $K create namespace {{.NS}} >/dev/null 2>&1 || true
        cat <<'YAML' | $K apply -f - >/dev/null
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata: {name: verify-data, namespace: zad-verify}
        spec:
          accessModes: [ReadWriteOnce]
          storageClassName: local-path
          resources: {requests: {storage: 1Gi}}
        ---
        apiVersion: v1
        kind: Pod
        metadata: {name: verify-write, namespace: zad-verify}
        spec:
          restartPolicy: Never
          # Dezelfde securityContext die deployment.yaml.jinja hier rendert
          # (assigns_uid_via_scc=false): niemand wijst een UID toe, dus wij pinnen er een.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: probe
              image: busybox:1.36
              command: ["sh","-c","echo ok > /data/test.txt && cat /data/test.txt"]
              volumeMounts: [{name: data, mountPath: /data}]
          volumes:
            - {name: data, persistentVolumeClaim: {claimName: verify-data}}
        YAML

        if ! $K -n {{.NS}} wait --for=jsonpath='{.status.phase}'=Succeeded pod/verify-write --timeout=180s >/dev/null 2>&1; then
          echo "❌ De schrijftest is niet geslaagd. Toestand:"
          $K -n {{.NS}} get pvc,pod
          $K -n {{.NS}} describe pvc verify-data | tail -20
          exit 1
        fi
        echo "   PVC gebonden en beschrijfbaar als uid 1001"

        echo "🔎 cert-manager"
        $K -n cert-manager get deployment cert-manager >/dev/null 2>&1 || { echo "❌ cert-manager ontbreekt"; exit 1; }
        echo "   aanwezig"

        echo "🔎 CloudNativePG"
        $K -n cnpg-system get deployment cnpg-controller-manager >/dev/null 2>&1 || { echo "❌ CloudNativePG ontbreekt"; exit 1; }
        echo "   aanwezig"

        echo ""
        echo "✅ Platformlaag werkt. Ingress: $IP"
        echo "   Zet een A-record router.fundament-poc.rijksapp.dev naar dit adres."
        echo "   Let op: dit adres is ephemeer, het verschuift als de service herbouwd wordt."
    silent: true
