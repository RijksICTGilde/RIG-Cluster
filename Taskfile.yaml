version: '3'

# Met CLUSTER_TYPE in de omgeving (`CLUSTER_TYPE=odcn-staging task ...`) komt de hele
# clusterconfiguratie uit .env-taskfile-<cluster>, en de selectie van task select-cluster
# wordt dan NIET geladen: ook geen naam die het clusterbestand zelf niet zet. Op 3 november
# 2026 vulde de staging-selectie zo SECRETS_DIR aan bij een deploy voor productie, en schreef
# die deploy het prod-env-secret in de werkmap van zad-staging-secrets. Zonder CLUSTER_TYPE
# geldt de selectie. Een argument (`task ... CLUSTER_TYPE=x`) bestaat nog niet als dit gelezen
# wordt; daarvoor is de guard selected_cluster_guard.
dotenv: ['.env', '.env-taskfile-{{.CLUSTER_TYPE}}', '{{if not .CLUSTER_TYPE}}.env-taskfile-current{{end}}']

vars:
  KIND_VERSION: 1.32.0
  # Waar scripts/postgres-standalone-start.sh in de container hangt. De CNPG-image start
  # niet zelf; zie dat script.
  PG_START_IN_CONTAINER: /zad/postgres-standalone-start.sh
  # Cluster configuration - can be overridden by .env-taskfile-current or environment variables
  KIND_CLUSTER_NAME: '{{default "rig-sandbox" .KIND_CLUSTER_NAME}}'
  RIG_NAMESPACE: '{{default "rig-system" .RIG_NAMESPACE}}'
  # Sandbox-builds draaien vaak op een gedeelde server naast andere sessies en het
  # kind-cluster. Een aparte builder met een geheugengrens houdt de build binnen zijn
  # eigen ruimte en houdt tegelijk de buildcache vast. Zie sandbox:build-builder.
  SANDBOX_BUILDER_NAME: '{{default "rig-sandbox-builder" .SANDBOX_BUILDER_NAME}}'
  # 2 GiB. Gemeten, niet geschat: een KOUDE build (alle drie de apt-rondes, uv sync,
  # skopeo en de tarball-export) piekt op 427 MB in de buildkit-container, een warme op
  # 108 MB. 2 GiB is dus bijna vijf keer de gemeten piek - genoeg marge voor een zwaardere
  # dependency-ronde, en klein genoeg om de machine nooit leeg te trekken.
  SANDBOX_BUILD_MEMORY: '{{default "2g" .SANDBOX_BUILD_MEMORY}}'
  # Optionele registry-cache, dezelfde vorm als publish-operations-manager. Leeg = alleen
  # de cache van de builder zelf, wat op een dev-server het geval is.
  SANDBOX_CACHE_IMAGE: '{{default "" .SANDBOX_CACHE_IMAGE}}'
  # De registry naast het kind-cluster, zie docs/sandbox/sandbox-kind-registry.md.
  SANDBOX_OM_REPO: '{{default "localhost:5001/operations-manager" .SANDBOX_OM_REPO}}'
  # Tag per commit, zie docs/sandbox/sandbox-kind-registry.md. Alleen operations-manager/ telt
  # voor de dirty-hash: configure-operations-manager-image schrijft zelf in bootstrap/.
  SANDBOX_OM_TAG:
    sh: scripts/bron-tag.sh operations-manager
  SANDBOX_OM_IMAGE: '{{.SANDBOX_OM_REPO}}:{{.SANDBOX_OM_TAG}}'

#set: ['e', 'x']  # equivalent to set -ex

tasks:
  default:
    desc: "Help / Show available tasks."
    cmds:
      - task --list-all
    silent: true

  select-cluster:
    desc: "Select target cluster and load corresponding environment file (CLUSTER=<naam> kiest zonder vraag)"
    cmds:
      - |
        echo "🎯 Cluster Selection"
        echo "=================="
        echo ""
        echo "Available clusters:"
        echo "1) odcn-production"
        echo "2) sandboxed-local (self-contained sandbox with Forgejo)"
        echo "3) odcn-staging (ODCN, tenant rig-staging)"
        echo ""
        # CLUSTER=<naam> of CLUSTER=<nummer> kiest zonder vraag, ook waar geen terminal is.
        CLUSTER_CHOICE="{{.CLUSTER}}"
        if [ -z "$CLUSTER_CHOICE" ]; then
          printf "Select cluster [1-3]: "
          read -r CLUSTER_CHOICE
        fi

        case $CLUSTER_CHOICE in
          1|odcn-production)
            ENV_FILE=".env-taskfile-odcn-production"
            CLUSTER_NAME="odcn-production"
            ;;
          2|sandboxed-local)
            ENV_FILE=".env-taskfile-sandboxed-local"
            CLUSTER_NAME="sandboxed-local"
            ;;
          3|odcn-staging)
            ENV_FILE=".env-taskfile-odcn-staging"
            CLUSTER_NAME="odcn-staging"
            ;;
          *)
            echo "❌ Invalid selection: '$CLUSTER_CHOICE'. Nothing changed."
            exit 1
            ;;
        esac

        if [ ! -f "$ENV_FILE" ]; then
          echo "❌ Environment file not found: $ENV_FILE"
          exit 1
        fi

        # Copy the selected env file to .env-taskfile-current
        cp "$ENV_FILE" .env-taskfile-current

        echo "✅ Selected: $CLUSTER_NAME cluster"
        echo "📁 Loaded configuration from: $ENV_FILE"
        echo ""
        echo "📝 Active configuration:"
        cat .env-taskfile-current | grep -v "^#" | grep -v "^$"
        echo ""
        echo "💡 Configuration is now active for all Taskfile tasks"
    silent: false

  requirements-check:
    desc: "Check whether the user has all the required tools installed locally."
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: |
          🚨 Docker daemon is not running! Start Docker Desktop or the Docker service before running setup.
      - sh: command -v kind
        msg: |
          🚨 kind is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v kubectl
        msg: |
          🚨 kubectl is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v kustomize
        msg: |
          🚨 kustomize is not installed! Use 'asdf' or 'brew' to install it.
      - sh: command -v sops
        msg: |
          🚨 sops is not installed! Install with 'brew install sops' on MacOS or 'apt-get install sops' on Linux.
      - sh: command -v pwgen
        msg: |
          🚨 pwgen is not installed! Install with 'brew install pwgen' on MacOS or 'apt-get install pwgen' on Linux.
      - sh: command -v rsync
        msg: |
          🚨 rsync is not installed! sandbox:sync needs it. Install with 'brew install rsync' on MacOS or 'apt-get install rsync' on Linux.
      - sh: command -v age-keygen
        msg: |
          🚨 age is not installed! Install with 'brew install age' on MacOS or 'apt-get install age' on Linux.
      - sh: command -v gpg
        msg: |
          gpg is not installed! Install with 'brew install gnupg' on MacOS or 'apt-get install gnupg' on Linux.
      - sh: command -v yq
        msg: |
          🚨 yq is not installed! Install with 'brew install yq' on MacOS or 'apt-get install yq' on Linux.
      # jq en numfmt worden gebruikt door sandbox:build-builder om de geheugengrens van de
      # bestaande builder uit te lezen en te vergelijken. Zonder ze leest de taak een lege
      # staat en maakt hij de builder elke keer opnieuw aan - inclusief het verlies van de
      # buildcache die dit hele bouwpad bij elkaar houdt.
      - sh: command -v jq
        msg: |
          🚨 jq is not installed! Install with 'brew install jq' on MacOS or 'apt-get install jq' on Linux.
      - sh: command -v numfmt
        msg: |
          🚨 numfmt is not installed! It ships with GNU coreutils: 'brew install coreutils' on MacOS (as gnumfmt) or 'apt-get install coreutils' on Linux.
    cmds:
      - echo -e "\n✅  All preconditions have been met.\n"
    silent: true

  prepare-argocd-operator:
    desc: "Download and prepare a customized ArgoCD operator"
    vars:
      VERSION: '{{default "v0.14.0" .VERSION}}'
      OUTPUT_DIR: '{{default "bootstrap/crd/operator" .OUTPUT_DIR}}'
      APPLY: '{{default "true" .APPLY}}'
    preconditions:
      # Op ODCN is de operator clusterbreed en gedeeld door alle tenants: een replace
      # --force voor staging raakt ook de ArgoCD van productie.
      - sh: '[ "{{.APPLY}}" != "true" ] || case "{{.CLUSTER_TYPE}}" in odcn-*) false ;; *) true ;; esac'
        msg: "Niet op ODCN ({{.CLUSTER_TYPE}}): de ArgoCD-operator is daar van het platform. Gebruik APPLY=false om alleen het manifest te maken."
    cmds:
      - |
        echo "Preparing ArgoCD Operator version {{.VERSION}}..."

        # Print current directory for debugging
        echo "Current working directory: $(pwd)"
        echo "Target output directory: {{.OUTPUT_DIR}}"

        # Create temp directory
        TEMP_DIR="/tmp/argocd-operator-prep"
        mkdir -p $TEMP_DIR

        # Check if Prometheus CRD exists
        if ! kubectl get crd prometheuses.monitoring.coreos.com &>/dev/null; then
          echo "⚠️  WARNING: Prometheus CRD not found in the cluster."
          echo "⚠️  This is required by the ArgoCD operator. Applying fake Prometheus CRD as a workaround."
          echo "⚠️  Note: This is only a temporary solution. For production, install Prometheus Operator properly."

          # Apply the fake Prometheus CRD
          kubectl apply -f bootstrap/crd/prometheus/fake-prometheus.yaml

          echo "✅ Fake Prometheus CRD applied successfully."
        else
          echo "✅ Prometheus CRD already exists in the cluster."
        fi

        # Check if cert-manager Issuer CRD exists
        if ! kubectl get crd issuers.cert-manager.io &>/dev/null; then
          echo "⚠️  WARNING: cert-manager Issuer CRD not found in the cluster."
          echo "⚠️  Applying fake cert-manager CRD so Issuer resources can be created."

          kubectl apply -f bootstrap/crd/cert-manager/fake-cert-manager.yaml

          echo "✅ Fake cert-manager CRD applied successfully."
        else
          echo "✅ cert-manager Issuer CRD already exists in the cluster."
        fi

        # Download the operator source
        echo "Downloading ArgoCD Operator source code..."
        curl -sL "https://github.com/argoproj-labs/argocd-operator/archive/refs/tags/{{.VERSION}}.tar.gz" -o $TEMP_DIR/argocd-operator.tar.gz

        # Extract the source
        echo "Extracting source code..."
        tar -xzf $TEMP_DIR/argocd-operator.tar.gz -C $TEMP_DIR

        # Save the original directory path before changing
        ORIGINAL_DIR="$(pwd)"

        # Navigate to extracted directory
        OPERATOR_DIR="$TEMP_DIR/argocd-operator-$(echo {{.VERSION}} | tr -d 'v')"
        echo "Changing to directory: $OPERATOR_DIR"
        cd $OPERATOR_DIR

        # Apply the customizations
        echo "Applying customizations..."

        # 1. Disable webhooks in kustomization.yaml
        sed -i.bak 's/- path: manager_webhook_patch.yaml/#- path: manager_webhook_patch.yaml/' config/default/kustomization.yaml
        sed -i.bak 's/- ..\/webhook/#- ..\/webhook/' config/default/kustomization.yaml

        # TODO: delete step 2, it seems image 0.14 exists and we need to use that instead of latest
        # 2. Use latest image tag in manager kustomization.yaml
        # sed -i.bak 's/newTag: {{.VERSION}}/newTag: latest/' config/manager/kustomization.yaml

        # Create output directory with absolute path
        mkdir -p "$ORIGINAL_DIR/{{.OUTPUT_DIR}}"
        OUTPUT_FILE="$ORIGINAL_DIR/{{.OUTPUT_DIR}}/argocd-operator-install.yaml"

        # Build the customized installation yaml
        echo "Building customized installation YAML..."
        kustomize build config/default > "$OUTPUT_FILE"

        echo "Output written to: $OUTPUT_FILE"

        # Return to original directory
        cd "$ORIGINAL_DIR"

        # Apply to cluster if requested
        if [[ "{{.APPLY}}" == "true" ]]; then
          echo "Applying ArgoCD operator to cluster..."
          kubectl replace --force -f "$OUTPUT_FILE"
          echo "✅ ArgoCD operator applied to cluster"
        else
          echo "To apply this to your cluster, run:"
          echo "kubectl replace --force -f {{.OUTPUT_DIR}}/argocd-operator-install.yaml"
        fi

        # Clean up
        rm -rf $TEMP_DIR

        echo "✅ ArgoCD operator preparation complete"
    silent: true

  _check-key-file:
    internal: true
    # Dezelfde regel die ssh op een privesleutel toepast: een sleutelbestand dat voor groep
    # of anderen leesbaar is, weigeren we hier in plaats van het later te ontdekken.
    requires:
      vars: [KEY_FILE]
    preconditions:
      - sh: |
          # Linux en macOS hebben verschillende vlaggen; `00` als laatste tak houdt een
          # ontbrekend bestand bij de aanroeper, die het zelf al meldt.
          # -L volgt de symlink: sandbox-deploy zet de sleutel met opzet als link neer, en
          # zonder -L leest stat de 777 van de LINK en wijst elke gelinkte sleutel af.
          MODE=$(stat -Lc %a "{{.KEY_FILE}}" 2>/dev/null || stat -Lf %Lp "{{.KEY_FILE}}" 2>/dev/null || echo 00)
          # Geen `$((0$MODE & 077))`: de shell van task leest een leidende nul niet als
          # octaal, dus 0600 werd 600 decimaal en een goed bestand werd afgewezen. De
          # laatste twee cijfers ZIJN de rechten voor groep en anderen.
          case "$MODE" in
            0|*00) ;;
            *)
              echo "mode van {{.KEY_FILE}} is $MODE" >&2
              exit 1
              ;;
          esac
        msg: "{{.KEY_FILE}} is leesbaar of schrijfbaar buiten de eigenaar. Herstel met: chmod 600 {{.KEY_FILE}}"

  generate-age-key:
    desc: "Generate the AGE key of the selected cluster (AGE_KEY_FILE), only if it doesn't exist"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    preconditions:
      # Geen terugval op een vaste sleutel: een cluster zonder AGE_KEY_FILE versleutelde
      # vroeger stil met de prod-sleutel security/key.txt.
      - &age_key_file_guard
        sh: '[ -n "{{.KEY_FILE}}" ]'
        msg: "Geen AGE-sleutel gekozen. Zet AGE_KEY_FILE in .env-taskfile-<cluster> en draai 'task select-cluster' opnieuw, of geef KEY_FILE=... mee."
    cmds:
      - |
        # Check if key already exists
        if [[ -f "{{.KEY_FILE}}" ]]; then
          echo "✅ AGE key already exists: {{.KEY_FILE}}"
          echo "🔑 Current public key: $(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')"
          echo "⚠️  To generate a new key, first remove the existing {{.KEY_FILE}} file"
          exit 0
        fi

        # Check if age-keygen is installed
        if ! command -v age-keygen &> /dev/null; then
          echo "❌ age-keygen is not installed. Please install age or add it to your PATH."
          echo "   MacOS: brew install age"
          echo "   Linux: apt-get install age or download from https://github.com/FiloSottile/age"
          exit 1
        fi

        # Create security directory if it doesn't exist
        mkdir -p "$(dirname "{{.KEY_FILE}}")"

        # Generate a new age key directly to {{.KEY_FILE}}
        echo "🔐 Generating new AGE key for SOPS encryption..."
        age-keygen -o {{.KEY_FILE}}

        # Extract the public key
        PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        echo ""
        echo "✅ AGE key generated successfully!"
        echo "🔑 Key saved to: {{.KEY_FILE}}"
        echo "🔑 Public key: $PUBLIC_KEY"
        echo ""
        echo "⚠️  IMPORTANT: The {{.KEY_FILE}} file is gitignored and must be managed securely!"
        echo "⚠️  For production use, consider storing the key in a secure vault or HSM."
    silent: true

  encrypt-value-age-base64:
    desc: "Encrypt a value with AGE and output in base64+age:base64encoded format"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      VALUE: '{{.VALUE | default ""}}'
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        if [[ -z "{{.VALUE}}" ]]; then
          echo "❌ Usage: task encrypt-value-age-base64 VALUE='your-secret-value'"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        # Encrypt the value with age and encode to base64
        ENCRYPTED=$(echo -n "{{.VALUE}}" | age -r "$AGE_PUBLIC_KEY" -a | base64 | tr -d '\n')

        echo "base64+age:$ENCRYPTED"
    silent: true

  encrypt-value-age:
    desc: "Encrypt a value with AGE and output in armor format"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      VALUE: '{{.VALUE | default ""}}'
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        if [[ -z "{{.VALUE}}" ]]; then
          echo "❌ Usage: task encrypt-value-age VALUE='your-secret-value'"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        # Encrypt the value with age in armor format
        echo -n "{{.VALUE}}" | age -r "$AGE_PUBLIC_KEY" -a
    silent: true

  decrypt-secret:
    desc: "Decrypt a SOPS-encrypted secret file for editing"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FILE: '{{.FILE | default ""}}'
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        if [[ -z "{{.FILE}}" ]]; then
          echo "❌ Usage: task decrypt-secret FILE=path/to/secret.yaml.sops.yaml"
          exit 1
        fi

        if [[ ! -f "{{.FILE}}" ]]; then
          echo "❌ File not found: {{.FILE}}"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Determine output filename (remove .sops from the name)
        OUTPUT_FILE=$(echo "{{.FILE}}" | sed -E 's/(\.yaml)?\.sops\.yaml$/.yaml/')

        if [[ "$OUTPUT_FILE" == "{{.FILE}}" ]]; then
          echo "❌ File doesn't have .sops.yaml extension: {{.FILE}}"
          exit 1
        fi

        echo "🔓 Decrypting: {{.FILE}}"
        echo "📄 Output: $OUTPUT_FILE"

        # Decrypt using SOPS with the AGE key
        SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" sops --decrypt "{{.FILE}}" > "$OUTPUT_FILE"

        echo ""
        echo "✅ Decrypted successfully!"
        echo "📝 Edit the file: $OUTPUT_FILE"
        echo "🔐 When done, encrypt with: task encrypt-secret FILE=$OUTPUT_FILE"

  project-decrypt:
    desc: "Print a project file with every AGE-encrypted value decrypted (stdout only)"
    vars:
      FILE: '{{.FILE | default ""}}'
      KEY: '{{default .AGE_KEY_FILE .KEY}}'
    preconditions:
      - sh: '[ -n "{{.KEY}}" ]'
        msg: "Geen AGE-sleutel gekozen. Zet AGE_KEY_FILE in .env-taskfile-<cluster> en draai 'task select-cluster' opnieuw, of geef KEY=... mee."
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY}}'}
    cmds:
      - |
        if [[ -z "{{.FILE}}" ]]; then
          echo "❌ Usage: task project-decrypt FILE=path/to/project.yaml [KEY=security/sandbox-key.txt]"
          exit 1
        fi
        # Absolute paden, want uv moet vanuit operations-manager/python draaien
        ROOT="$(pwd)"
        FILE_ABS="$(cd "$(dirname "{{.FILE}}")" && pwd)/$(basename "{{.FILE}}")"
        cd operations-manager/python
        uv run python "$ROOT/scripts/project_decrypt.py" "$ROOT/{{.KEY}}" "$FILE_ABS"

  encrypt-secret:
    desc: "Encrypt a secret YAML file with SOPS (creates .sops.yaml version)"
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FILE: '{{.FILE | default ""}}'
      KEEP_ORIGINAL: '{{.KEEP_ORIGINAL | default "false"}}'
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        if [[ -z "{{.FILE}}" ]]; then
          echo "❌ Usage: task encrypt-secret FILE=path/to/secret.yaml"
          echo "   Optional: KEEP_ORIGINAL=true to keep the unencrypted file"
          exit 1
        fi

        if [[ ! -f "{{.FILE}}" ]]; then
          echo "❌ File not found: {{.FILE}}"
          exit 1
        fi

        if [[ ! -f "{{.KEY_FILE}}" ]]; then
          echo "❌ {{.KEY_FILE}} not found. Please run 'task generate-age-key' first."
          exit 1
        fi

        # Check if file is already SOPS encrypted
        if [[ "{{.FILE}}" == *.sops.yaml ]]; then
          echo "❌ File already has .sops.yaml extension. Did you mean to encrypt a plain .yaml file?"
          exit 1
        fi

        # Determine output filename (add .sops before .yaml)
        if [[ "{{.FILE}}" == *.yaml ]]; then
          OUTPUT_FILE=$(echo "{{.FILE}}" | sed 's/\.yaml$/.yaml.sops.yaml/')
        else
          echo "❌ File must have .yaml extension"
          exit 1
        fi

        # Extract the public key from {{.KEY_FILE}}
        AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')

        echo "🔐 Encrypting: {{.FILE}}"
        echo "📄 Output: $OUTPUT_FILE"

        # Encrypt with SOPS using AGE
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" "{{.FILE}}" > "$OUTPUT_FILE"

        echo ""
        echo "✅ Encrypted successfully: $OUTPUT_FILE"

        # Optionally remove the original unencrypted file
        if [[ "{{.KEEP_ORIGINAL}}" != "true" ]]; then
          rm "{{.FILE}}"
          echo "🗑️  Removed unencrypted file: {{.FILE}}"
        else
          echo "⚠️  Original unencrypted file kept: {{.FILE}}"
          echo "   Remember to delete it manually for security!"
        fi

  edit-secret:
    desc: "Eén veld in een secret vervangen (genereren of zelf opgeven), zonder de rest te roteren"
    interactive: true
    cmds:
      - uv run --project operations-manager/python python scripts/edit-secret.py {{.CLI_ARGS}}

  cmp-sops-role-backfill:
    desc: "Eenmalig: zet de Role die de CMP het sleutel-secret laat lezen in elke bestaande namespace die er een heeft"
    summary: |
      OPI zet de Role cmp-sops-key-reader voortaan naast elk sleutel-secret dat hij
      plaatst, maar in namespaces waar dat secret al stond gebeurt dat niet: OPI schrijft
      daar bij een verwerking niets. Deze taak haalt die achterstand in.

      Draai hem op productie VOOR de bootstrap die de repo-server op de eigen
      ServiceAccount zet: daarna leest die alleen nog wat deze Roles toestaan.

      DRY_RUN=true telt alleen, en schrijft niets. Op de sandbox hoort
      ARGO_NAMESPACE=rig-system erbij, anders wijst de RoleBinding naar
      rig-prd-operations.
    vars:
      DRY_RUN: '{{default "false" .DRY_RUN}}'
      ARGO_NAMESPACE: '{{default "rig-prd-operations" .ARGO_NAMESPACE}}'
      SERVICE_ACCOUNT: '{{default "argocd-cmp" .SERVICE_ACCOUNT}}'
      # De platformnamespaces houden de platformsleutel, en die leest de platform-sidecar
      # uit zijn mount. De tenant-sidecar hoort daar niets te mogen.
      SKIP_NAMESPACES: '{{default "rig-prd-operations rig-prd-ron rig-system rig-ron" .SKIP_NAMESPACES}}'
    cmds:
      - |
        # Op naam zoeken gaat met een field-selector: 'get secret <naam> --all-namespaces' weigert kubectl.
        NAMESPACES=$(kubectl get secret --all-namespaces --field-selector metadata.name=sops-age-key -o jsonpath='{range .items[*]}{.metadata.namespace}{"\n"}{end}')
        if [ -z "$NAMESPACES" ]; then
          echo "geen namespace met een sops-age-key gevonden"
          exit 0
        fi

        for OVER in {{.SKIP_NAMESPACES}}; do
          NAMESPACES=$(printf '%s\n' "$NAMESPACES" | grep -v "^${OVER}$" || true)
        done
        if [ -z "$NAMESPACES" ]; then
          echo "geen projectnamespace met een sops-age-key gevonden"
          exit 0
        fi

        AANTAL=$(printf '%s\n' "$NAMESPACES" | wc -l | tr -d ' ')
        echo "$AANTAL projectnamespaces met een sops-age-key"

        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          printf '%s\n' "$NAMESPACES"
          echo "dry-run: niets geschreven"
          exit 0
        fi

        for NS in $NAMESPACES; do
          kubectl apply -f - <<EOF
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: cmp-sops-key-reader
          namespace: $NS
          labels:
            created-by: operations-manager
        rules:
          - apiGroups: [""]
            resources: ["secrets"]
            resourceNames: ["sops-age-key"]
            verbs: ["get"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: cmp-sops-key-reader
          namespace: $NS
          labels:
            created-by: operations-manager
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: cmp-sops-key-reader
        subjects:
          - kind: ServiceAccount
            name: {{.SERVICE_ACCOUNT}}
            namespace: {{.ARGO_NAMESPACE}}
        EOF
        done

        echo "Role en RoleBinding staan in $AANTAL namespaces"
    silent: true

  bootstrap-argo-system:
    desc: "Apply minimal bootstrap (namespace + ArgoCD) to start the GitOps process"
    requires:
      vars:
        - name: CLUSTER_TYPE
          enum: [sandboxed-local, odcn-production, odcn-staging]
    vars:
      CLUSTER: '{{.CLUSTER_TYPE}}'
      DRY_RUN: '{{default "false" .DRY_RUN}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      # Stap 1 van de uitrol van de AppProjects (features/argocd-appprojects.md): de
      # dichte default uit git overslaan, zodat de Applications eerst kunnen omschakelen.
      KEEP_DEFAULT_APPPROJECT: '{{default "false" .KEEP_DEFAULT_APPPROJECT}}'
      # Het vangnet uit #238 bij een uitrol: prune uit op de Applications uit deze overlay.
      # Met de hand uitzetten helpt niet, want deze apply zet prune: true uit git terug.
      # Draai de taak daarna nog een keer zonder deze optie, dan staat prune weer aan.
      PAUSE_PRUNE: '{{default "false" .PAUSE_PRUNE}}'
    preconditions:
      # CLUSTER_TYPE kiest de overlay, maar namespace, sleutel en secrets-map komen uit de
      # geladen clusterconfiguratie. Liepen die uiteen, dan ging het stil mis: op 2 november
      # 2026 schreef een deploy de prod-geheimen in de staging-namespace, en herstartte een
      # bootstrap voor staging de ArgoCD van productie. $CLUSTER_TYPE is wat er geladen is,
      # {{.CLUSTER_TYPE}} wat er gevraagd wordt.
      - &selected_cluster_guard
        sh: '[ "$CLUSTER_TYPE" = "{{.CLUSTER_TYPE}}" ]'
        msg: "Gevraagd is CLUSTER_TYPE={{.CLUSTER_TYPE}}, maar geladen is de configuratie van een ander cluster. Geef het cluster mee in de omgeving, dan komt alles uit .env-taskfile-{{.CLUSTER_TYPE}}: CLUSTER_TYPE={{.CLUSTER_TYPE}} task <taak>"
      - *age_key_file_guard
      # SECRETS_DIR (alleen odcn-staging): een clone van de private secrets-repo. De
      # geheimen staan dan daar en niet in de overlays van deze publieke repo.
      - sh: '[ -z "{{.SECRETS_DIR}}" ] || [ -d "{{.SECRETS_DIR}}/.git" ]'
        msg: "SECRETS_DIR={{.SECRETS_DIR}} is geen git-clone. Clone eerst de secrets-repo, zie features/zad-staging.md."
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |

        echo "🚀 Bootstrapping minimal RIG Cluster with source type: {{.CLUSTER}}"

        # Set flags for kubectl apply
        KUBECTL_FLAGS=""
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          KUBECTL_FLAGS="--dry-run=client"
          echo "🔍 Dry run mode enabled"
        fi

        # Build and apply
        RENDERED="$(SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone)"
        if [[ "{{.KEEP_DEFAULT_APPPROJECT}}" == "true" ]]; then
          RENDERED="$(printf '%s\n' "$RENDERED" | yq 'select(.kind != "AppProject" or .metadata.name != "default")')"
        fi
        if [[ "{{.PAUSE_PRUNE}}" == "true" ]]; then
          RENDERED="$(printf '%s\n' "$RENDERED" | yq '(select(.kind == "Application" and .spec.syncPolicy.automated != null) | .spec.syncPolicy.automated.prune) = false')"
        fi
        printf '%s\n' "$RENDERED" | kubectl apply $KUBECTL_FLAGS -f -

        # De repo-credentials van ArgoCD uit de secrets-repo, na de overlay omdat die de
        # namespace aanmaakt. ArgoCD pakt een repository-secret op zodra het er staat.
        # De overlay bevat ook de OPI, dus diens env-secret hoort er meteen bij.
        if [ -n "{{.SECRETS_DIR}}" ]; then
          SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec "{{.SECRETS_DIR}}/bootstrap" | kubectl apply $KUBECTL_FLAGS -f -
          SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" sops --decrypt "{{.SECRETS_DIR}}/operations-manager/operations-manager-env-secrets.yaml" | kubectl apply $KUBECTL_FLAGS -f -
        fi

        # De sleutel voor de CMP in de platformnamespace. Alleen aanmaken als hij er nog
        # niet is, om dezelfde reden als bij de ron-namespace hieronder. Het managed-by-label
        # gaat er net als daar pas na het aanmaken op (Kyverno); op productie staat het al.
        if [[ "{{.DRY_RUN}}" != "true" ]]; then
          kubectl label namespace {{.RIG_NAMESPACE}} argocd.argoproj.io/managed-by={{.RIG_NAMESPACE}} --overwrite
          task wait-namespace-rights NAMESPACE={{.RIG_NAMESPACE}}
          if kubectl get secret sops-age-key -n {{.RIG_NAMESPACE}} >/dev/null 2>&1; then
            echo "secret sops-age-key staat al in {{.RIG_NAMESPACE}}, ongemoeid gelaten"
          else
            kubectl create secret generic sops-age-key \
              --from-file=key={{.KEY_FILE}} \
              -n {{.RIG_NAMESPACE}} \
              --dry-run=client -o yaml | kubectl apply -f -
            echo "secret sops-age-key aangemaakt in {{.RIG_NAMESPACE}}"
          fi
        fi

        # Extra namespaces die niet DOOR de overlay-kustomization kunnen: haar
        # namespace-transformer hernoemt elk Namespace-object naar de eigen
        # namespace-waarde (gemeten 21 augustus 2026 als ID-conflict met rig-prd-ron).
        # Los toegepast, zodat hij er is voordat de Applications erin gaan deployen.
        # Het managed-by-label gaat er PAS NA de apply op: de Kyverno-policy van ODCN
        # valideert dat label met een lookup van de namespace zelf en weigert daardoor
        # elke create die het label al draagt - zelfde omweg als OPI bij
        # tenant-namespaces (project_manager, "apply the label after creating").
        if [ -f "bootstrap/rig-system/kustomize/overlays/{{.CLUSTER}}/namespace-ron.yaml" ]; then
          kubectl apply $KUBECTL_FLAGS -f "bootstrap/rig-system/kustomize/overlays/{{.CLUSTER}}/namespace-ron.yaml"
          RON_NAMESPACE="$(yq '.metadata.name' "bootstrap/rig-system/kustomize/overlays/{{.CLUSTER}}/namespace-ron.yaml")"
          # Geen sleutelsecret: ron-infrastructure rendert op de platform-plugin sinds RC-351.
          if [[ "{{.DRY_RUN}}" != "true" ]]; then
            kubectl label namespace "$RON_NAMESPACE" argocd.argoproj.io/managed-by={{.RIG_NAMESPACE}} --overwrite
          fi
        fi

        # Wait for ArgoCD operator to create deployments, then restart to pick up config
        if [[ "{{.DRY_RUN}}" != "true" ]]; then
          echo "Waiting for ArgoCD deployments to be created by the operator..."
          until kubectl get deployment argocd-repo-server -n {{.RIG_NAMESPACE}} &>/dev/null; do
            sleep 5
          done
          until kubectl get deployment argocd-server -n {{.RIG_NAMESPACE}} &>/dev/null; do
            sleep 5
          done
          echo "Restarting ArgoCD deployments to apply configuration changes..."
          kubectl rollout restart deployment/argocd-repo-server -n {{.RIG_NAMESPACE}}
          kubectl rollout restart deployment/argocd-server -n {{.RIG_NAMESPACE}}

          # 300s, niet 120s: op een verse cluster moeten de argocd-image en de cmp-sidecar
          # nog gepulld worden. Gemeten op de dev-server duurde alleen dat al ~2,5 minuut,
          # waardoor sandbox:setup afbrak op een rollout die daarna gewoon slaagde.
          echo "Waiting for ArgoCD repo server (incl. CMP sidecar) to be ready..."
          kubectl rollout status deployment/argocd-repo-server -n {{.RIG_NAMESPACE}} --timeout=300s

          echo "Waiting for ArgoCD server to be ready..."
          kubectl rollout status deployment/argocd-server -n {{.RIG_NAMESPACE}} --timeout=300s

          echo "Waiting for ArgoCD application controller to be ready..."
          kubectl rollout status statefulset/argocd-application-controller -n {{.RIG_NAMESPACE}} --timeout=120s
        fi

        echo "✅ Bootstrap applied successfully!"
      # Bootstrap herstelt signatureKeys naar git; deze taak zet de sleutel in het cluster.
      - task: argocd:trust-git-signing-key
        vars:
          DRY_RUN: '{{.DRY_RUN}}'
    silent: true

  bootstrap-backup-destination:
    desc: "Apply the backup-destination MinIO (SOPS-decrypted) to the selected cluster. Managed outside ArgoCD by design (prune-safe for the backup PVC)."
    vars:
      CLUSTER: '{{default .INFRASTRUCTURE_CLUSTER_FOLDER .CLUSTER}}'  # overlay name, e.g. odcn
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      DRY_RUN: '{{default "false" .DRY_RUN}}'
    preconditions:
      - *age_key_file_guard
      # SECRETS_DIR (alleen odcn-staging): een clone van de private secrets-repo. De
      # geheimen staan dan daar en niet in de overlays van deze publieke repo.
      - sh: '[ -z "{{.SECRETS_DIR}}" ] || [ -d "{{.SECRETS_DIR}}/.git" ]'
        msg: "SECRETS_DIR={{.SECRETS_DIR}} is geen git-clone. Clone eerst de secrets-repo, zie features/zad-staging.md."
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |

        echo "📦 Applying backup-destination overlay '{{.CLUSTER}}' to context: $(kubectl config current-context)"

        # Set flags for kubectl apply
        KUBECTL_FLAGS=""
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          KUBECTL_FLAGS="--dry-run=client"
          echo "🔍 Dry run mode enabled"
        fi

        # Build (SOPS-decrypted) and apply
        MANIFEST="$(SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec infrastructure/bootstrap/infrastructure/backup-destination/controller/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone)"
        # Eerst de namespace en dan de rest: in een tenant komen de rechten erin pas een
        # paar seconden na het aanmaken (zie wait-namespace-rights).
        echo "$MANIFEST" | yq 'select(.kind == "Namespace")' | kubectl apply $KUBECTL_FLAGS -f -
        if [[ "{{.DRY_RUN}}" != "true" ]]; then
          task wait-namespace-rights NAMESPACE="$(echo "$MANIFEST" | yq 'select(.kind == "Namespace") | .metadata.name')"
        fi
        echo "$MANIFEST" | kubectl apply $KUBECTL_FLAGS -f -

        # Met SECRETS_DIR staat het root-secret in de secrets-repo (task
        # generate-backup-destination-secret), na de overlay omdat die de namespace aanmaakt.
        if [ -n "{{.SECRETS_DIR}}" ]; then
          SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec "{{.SECRETS_DIR}}/backup-destination" | kubectl apply $KUBECTL_FLAGS -f -
        fi

        echo "✅ backup-destination ({{.CLUSTER}}) applied successfully!"
    silent: true

  dns:set:
    desc: "Zet een DNS-record bij TransIP vanuit de OPI-pod van het geselecteerde cluster (achter de IP-whitelist, zonder sleutels op je laptop)"
    silent: true
    requires:
      vars: [ZONE, NAME, TYPE, CONTENT]
    cmds:
      - |
        # De scripts zitten niet in de image (.dockerignore), dus ze gaan naar /tmp in de
        # pod, zoals in docs/sandbox/sandbox-wildcard-cert-renewal.md. De TransIP-gegevens komen
        # uit de omgeving van die pod.
        POD="$(kubectl -n {{.RIG_NAMESPACE}} get pod -l app=operations-manager -o jsonpath='{.items[0].metadata.name}')"
        kubectl -n {{.RIG_NAMESPACE}} cp operations-manager/python/scripts/transip_set_dns.py "$POD:/tmp/transip_set_dns.py"
        kubectl -n {{.RIG_NAMESPACE}} exec "$POD" -- python /tmp/transip_set_dns.py --zone "{{.ZONE}}" --name "{{.NAME}}" --type "{{.TYPE}}" --content "{{.CONTENT}}" --expire {{default "60" .EXPIRE}} {{.CLI_ARGS}}

  dns:delete:
    desc: "Verwijder een DNS-record bij TransIP vanuit de OPI-pod van het geselecteerde cluster (eerst met -- --dry-run kijken)"
    silent: true
    requires:
      vars: [ZONE, NAME, TYPE]
    cmds:
      - |
        POD="$(kubectl -n {{.RIG_NAMESPACE}} get pod -l app=operations-manager -o jsonpath='{.items[0].metadata.name}')"
        kubectl -n {{.RIG_NAMESPACE}} cp operations-manager/python/scripts/transip_delete_dns.py "$POD:/tmp/transip_delete_dns.py"
        kubectl -n {{.RIG_NAMESPACE}} exec "$POD" -- python /tmp/transip_delete_dns.py --zone "{{.ZONE}}" --name "{{.NAME}}" --type "{{.TYPE}}" {{.CLI_ARGS}}

  secrets-overview:
    desc: "Schrijf de geheimen van het geselecteerde cluster leesbaar naar secrets-overview-<cluster>.yaml (gitignored); ruim het daarna op"
    silent: true
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      OUT: '{{default (printf "secrets-overview-%s.yaml" .CLUSTER_TYPE) .OUT}}'
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        # Uit de versleutelde bestanden zelf, dus ook als het overzicht van de generatie al
        # weg is. Met SECRETS_DIR uit de secrets-repo, anders uit de overlays.
        if [ -n "{{.SECRETS_DIR}}" ]; then
          FILES="$(find "{{.SECRETS_DIR}}" -path '*/.git' -prune -o \( -name '*.sops.yaml' -o -name 'operations-manager-env-secrets.yaml' \) -print | sort)"
        else
          FILES="$(ls infrastructure/bootstrap/infrastructure/secrets/config/overlays/{{.INFRASTRUCTURE_CLUSTER_FOLDER}}/*.sops.yaml bootstrap/rig-system/kustomize/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}/*.sops.yaml 2>/dev/null)"
        fi
        : > "{{.OUT}}" && chmod 600 "{{.OUT}}"
        echo "# Geheimen van {{.CLUSTER_TYPE}}, $(date). Platte tekst: weggooien na gebruik." >> "{{.OUT}}"
        export SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})"
        for f in $FILES; do
          echo "" >> "{{.OUT}}"
          echo "# === $f ===" >> "{{.OUT}}"
          sops --decrypt "$f" | yq '{"name": .metadata.name, "namespace": .metadata.namespace, "values": ((.stringData // {}) * ((.data // {}) | map_values(@base64d)))}' >> "{{.OUT}}"
        done
        echo "✅ {{.OUT}} geschreven ($(echo "$FILES" | wc -l | tr -d ' ') bestanden). Gooi het weg zodra je het niet meer nodig hebt."

  wait-namespace-rights:
    desc: "Wacht tot je in een (nieuwe) namespace secrets mag aanmaken, maximaal 60 s"
    silent: true
    requires:
      vars: [NAMESPACE]
    cmds:
      - |
        # Capsule zet de rolebindings van de tenant-eigenaren een paar seconden NA het
        # aanmaken van een namespace (gemeten 19 oktober 2026: 2 s). Wie meteen iets in
        # die namespace zet, krijgt Forbidden.
        for i in $(seq 1 30); do
          [ "$(kubectl auth can-i create secrets -n {{.NAMESPACE}} 2>/dev/null)" = "yes" ] && exit 0
          sleep 2
        done
        echo "❌ na 60 s nog geen rechten in {{.NAMESPACE}}"
        exit 1

  log-watch:
    desc: "One OPI prod-log triage cycle: Loki scan -> ignore-list -> Claude triage -> ntfy. Config in scripts/log_watch/config.py."
    dir: operations-manager/python
    cmds:
      - uv run python scripts/log_watch/watch.py {{.CLI_ARGS}}

  log-watch-loop:
    desc: "Run the OPI log watcher continuously (one cycle every 30 min, self-scheduling). Ctrl-C to stop. Config in scripts/log_watch/config.py."
    dir: operations-manager/python
    cmds:
      - uv run python scripts/log_watch/watch.py --loop

  install-cnpg-operator:
    desc: "Install CloudNativePG operator for PostgreSQL"
    cmds:
      - |
        echo "========================================="
        echo "Installing CloudNativePG operator"
        echo "========================================="
        echo ""

        # Check if operator is already installed
        if kubectl get deployment -n cnpg-system cnpg-controller-manager 2>/dev/null; then
          echo "✅ CloudNativePG operator already installed"
          exit 0
        fi

        echo "📦 Installing CloudNativePG operator v1.27.3..."
        kubectl apply --server-side -f https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.3.yaml

        echo ""
        echo "⏳ Waiting for operator to be ready..."
        kubectl wait --for=condition=Available --timeout=300s \
          deployment/cnpg-controller-manager -n cnpg-system

        echo ""
        echo "✅ CloudNativePG operator installed successfully!"
        echo ""
        echo "Verify with: kubectl get pods -n cnpg-system"
    silent: true

  install-ingress-nginx:
    desc: "Install NGINX Ingress Controller for Kind"
    cmds:
      - |
        echo "========================================="
        echo "Installing NGINX Ingress Controller"
        echo "========================================="
        echo ""

        # Check if ingress is already installed
        if kubectl get namespace ingress-nginx 2>/dev/null; then
          echo "✅ NGINX Ingress Controller already installed"
          exit 0
        fi

        echo "📦 Installing NGINX Ingress Controller for Kind..."
        # Using local kustomization that:
        # - References upstream KIND manifest
        # - Enables snippet annotations (for security headers)
        # - Configures nodeSelector for control-plane node
        kustomize build bootstrap/rig-system/kustomize/ingress-nginx/base | kubectl apply -f -

        echo ""
        echo "⏳ Waiting for ingress controller to be ready..."
        # Wait for pods to be created before waiting for readiness
        until kubectl get pods --namespace ingress-nginx --selector=app.kubernetes.io/component=controller -o name 2>/dev/null | grep -q .; do
          echo "  Waiting for controller pod to be created..."
          sleep 5
        done
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=300s

        echo ""
        echo "✅ NGINX Ingress Controller installed successfully!"
        echo "   Configured to run on control-plane node (ingress-ready=true)"
        echo "   Snippet annotations enabled for security headers"
        echo ""
        echo "Verify with: kubectl get pods -n ingress-nginx -o wide"
    silent: true

  generate-env-secrets-for-operations-manager:
    desc: "Generate SOPS-encrypted secret from cluster-specific env file for operations-manager"
    requires:
      vars:
        - name: CLUSTER_TYPE
          enum: [sandboxed-local, odcn-production, odcn-staging]
    vars:
      CLUSTER: '{{.CLUSTER_TYPE}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      ENV_FILE: 'operations-manager/python/.env.{{.CLUSTER}}.secrets'
      OUTPUT_DIR: '{{if .SECRETS_DIR}}{{.SECRETS_DIR}}/operations-manager{{else}}bootstrap/rig-system/kustomize/operations-manager/overlays/{{.BOOTSTRAP_CLUSTER_FOLDER}}{{end}}'
      SECRET_NAME: '{{default "operations-manager-env-secrets" .SECRET_NAME}}'
      NAMESPACE: '{{default .RIG_NAMESPACE .NAMESPACE}}'
    preconditions:
      - *selected_cluster_guard
      - &secrets_dir_current_guard
        # Op een verouderde clone maakt de generator een secret dat een ander al maakte
        # opnieuw aan, met een ander wachtwoord; dat zie je pas bij de push.
        # staging:setup controleert de clone een keer vooraf en zet dan SECRETS_DIR_CHECKED:
        # na zijn eerste generatiestap is de clone vanzelf niet meer schoon.
        sh: '[ -z "{{.SECRETS_DIR}}" ] || [ -n "{{.SECRETS_DIR_CHECKED}}" ] || { git -C "{{.SECRETS_DIR}}" fetch -q && [ -z "$(git -C "{{.SECRETS_DIR}}" status --porcelain)" ] && [ "$(git -C "{{.SECRETS_DIR}}" rev-parse HEAD)" = "$(git -C "{{.SECRETS_DIR}}" rev-parse @{u})" ]; }'
        msg: "{{.SECRETS_DIR}} is niet schoon of loopt niet gelijk met zijn remote. Commit of push eerst, of git pull."
      - *age_key_file_guard
      # SECRETS_DIR (alleen odcn-staging): een clone van de private secrets-repo. De
      # geheimen staan dan daar en niet in de overlays van deze publieke repo.
      - sh: '[ -z "{{.SECRETS_DIR}}" ] || [ -d "{{.SECRETS_DIR}}/.git" ]'
        msg: "SECRETS_DIR={{.SECRETS_DIR}} is geen git-clone. Clone eerst de secrets-repo, zie features/zad-staging.md."
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        echo "Generating SOPS-encrypted secret for cluster: {{.CLUSTER}}"
        echo "Using cluster-specific secrets file: {{.ENV_FILE}}"
        echo "Using key file: {{.KEY_FILE}}"

        # Check if cluster-specific env file exists
        if [ ! -f "{{.ENV_FILE}}" ]; then
          echo "⚠️  Cluster-specific secrets file not found: {{.ENV_FILE}}"
          echo "⚠️  Creating empty secrets file for cluster {{.CLUSTER}}"

          # Create the file with a comment
          echo "# Environment secrets for cluster: {{.CLUSTER}}" > "{{.ENV_FILE}}"
          echo "# Add your cluster-specific secret environment variables here" >> "{{.ENV_FILE}}"
          echo "# Example:" >> "{{.ENV_FILE}}"
          echo "# KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=your-secret-here" >> "{{.ENV_FILE}}"
          echo "# DATABASE_ADMIN_PASSWORD=your-password-here" >> "{{.ENV_FILE}}"
          echo "✅ Created empty secrets file: {{.ENV_FILE}}"
          echo "📝 Please edit this file and add the required secrets for your cluster"
        fi

        # Check if SOPS key file exists
        if [ ! -f "{{.KEY_FILE}}" ]; then
          echo "❌ SOPS key file not found: {{.KEY_FILE}}"
          exit 1
        fi

        # Create output directory
        mkdir -p "{{.OUTPUT_DIR}}"

        # Start creating the secret YAML
        SECRET_FILE="{{.OUTPUT_DIR}}/{{.SECRET_NAME}}.yaml"

        cat > "$SECRET_FILE" << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: {{.SECRET_NAME}}
          namespace: {{.NAMESPACE}}
        type: Opaque
        data:
        EOF

        # Process env file and add base64 encoded values
        echo "Processing environment variables from {{.ENV_FILE}}..."

        # Use grep to filter and process the file instead of while loop
        grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | while IFS='=' read -r key value; do
          # Remove any surrounding quotes from value
          value=$(echo "$value" | sed 's/^["'\'']//' | sed 's/["'\'']$//')

          # Base64 encode the value
          encoded_value=$(echo -n "$value" | base64)

          # Add to secret file
          echo "  $key: $encoded_value" >> "$SECRET_FILE"
          echo "  Added: $key"
        done

        echo "Finished processing environment variables."
        # De inhoud niet tonen: dit zijn de onversleutelde waarden (alleen base64).

        # Encrypt with SOPS using the AGE key
        echo "Encrypting secret with SOPS..."
        AGE_PUBLIC_KEY="$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')"
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$SECRET_FILE"

        echo "✅ SOPS-encrypted secret generated: $SECRET_FILE"
        echo "Secret name: {{.SECRET_NAME}}"
        echo "Namespace: {{.NAMESPACE}}"
    silent: true

  deploy-operations-manager:
    desc: "Deploy the operations-manager to the current cluster"
    requires:
      vars:
        - name: CLUSTER_TYPE
          enum: [sandboxed-local, odcn-production, odcn-staging]
    vars:
      CLUSTER: '{{.CLUSTER_TYPE}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
    deps:
      - generate-env-secrets-for-operations-manager
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    preconditions:
      - *selected_cluster_guard
      - *age_key_file_guard
    cmds:
      - |
        set -o pipefail
        echo "Updating operations-manager deployment..."
        TEMPLATE="kubectl get deployment operations-manager -n {{.RIG_NAMESPACE}} -o jsonpath={.spec.template}"
        VOOR=$($TEMPLATE 2>/dev/null | shasum)
        UIT=""
        # Met SECRETS_DIR draagt de overlay het env-secret niet zelf.
        if [ -n "{{.SECRETS_DIR}}" ]; then
          UIT=$(SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" sops --decrypt "{{.SECRETS_DIR}}/operations-manager/operations-manager-env-secrets.yaml" | kubectl apply $KUBECTL_FLAGS -f - 2>&1) || { echo "$UIT"; exit 1; }
        fi
        UIT2=$(SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/operations-manager/overlays/{{.CLUSTER}} --load-restrictor LoadRestrictionsNone | kubectl apply $KUBECTL_FLAGS -f - 2>&1) || { echo "$UIT"; echo "$UIT2"; exit 1; }
        UIT=$(printf '%s\n%s\n' "$UIT" "$UIT2" | sed '/^$/d')
        echo "$UIT"
        NA=$($TEMPLATE 2>/dev/null | shasum)
        # Een gewijzigde pod-template rolt Kubernetes zelf uit; een rollout restart erbovenop
        # is een TWEEDE wijziging, met twee rollouts tegelijk. Maar een secret of de configmap
        # komt alleen bij het starten binnen: verandert alleen die (een rotatie), dan blijft
        # de oude pod met de oude waarde draaien tot iemand hem herstart. Dat gebeurde op
        # 3 november met SECRET_KEY op staging.
        if [ "{{.CLUSTER}}" = "sandboxed-local" ]; then
          # De sandbox-overlay houdt de tag van zijn laatste configure: apply ziet vaak niets.
          kubectl rollout restart deployment operations-manager -n {{.RIG_NAMESPACE}}
        elif [ "$VOOR" != "$NA" ]; then
          echo "De pod-template is gewijzigd; Kubernetes rolt zelf uit (geen restart nodig)."
        elif echo "$UIT" | grep -qE '^(secret/operations-manager-(env-secrets|access)|configmap/operations-manager-config) configured'; then
          echo "Alleen een secret of de configmap is gewijzigd; herstart zodat de pod de nieuwe waarden laadt."
          kubectl rollout restart deployment operations-manager -n {{.RIG_NAMESPACE}}
        else
          echo "Niets gewijzigd voor de pod; geen herstart."
        fi
      - echo -e "✅ Operations manager updated successfully!"
    silent: true

  docker-build-and-push:
    desc: "Build and publish Docker images to container registry"
    vars:
      # Required parameters (no defaults)
      BUILD_CONTEXT: '{{.BUILD_CONTEXT | default ""}}'
      DOCKERFILE_PATH: '{{.DOCKERFILE_PATH | default "Dockerfile"}}'
      IMAGE_NAME: '{{.IMAGE_NAME | default ""}}'
      REGISTRY_IMAGE: '{{.REGISTRY_IMAGE | default ""}}'

      # Optional parameters (with defaults)
      IMAGE_TAG: '{{.IMAGE_TAG | default "latest"}}'
      EXTRA_TAG: '{{.EXTRA_TAG | default ""}}'
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'
      BUILD_TARGET: '{{.BUILD_TARGET | default ""}}'
      CACHE_IMAGE: '{{.CACHE_IMAGE | default ""}}'
      SKIP_VALIDATION: '{{.SKIP_VALIDATION | default "false"}}'
      BUILDER_NAME: '{{.BUILDER_NAME | default "buildx-builder"}}'

      # Computed: Full registry path with image name
      FULL_REGISTRY_IMAGE: '{{.REGISTRY_IMAGE}}{{if not (hasSuffix "/" .REGISTRY_IMAGE)}}/{{end}}{{.IMAGE_NAME}}'

    preconditions:
      - sh: '[ -n "{{.BUILD_CONTEXT}}" ]'
        msg: |
          Build and publish Docker images to container registry

          Required parameters:
            BUILD_CONTEXT    - Path to build context (e.g., ".", "./app")
            IMAGE_NAME       - Local image name (e.g., "my-app", "backend")
            REGISTRY_IMAGE   - Registry path (e.g., "ghcr.io/org/repo" or "ghcr.io/org/")

          Optional parameters:
            IMAGE_TAG        - Image tag (default: "latest")
            EXTRA_TAG        - Additional tag for the same build, e.g. "latest" (default: none)
            DOCKERFILE_PATH  - Dockerfile path relative to BUILD_CONTEXT (default: "Dockerfile")
            PLATFORMS        - Target platforms (default: "linux/amd64")
            BUILD_TARGET     - Docker build target stage (default: none)
            CACHE_IMAGE      - Additional cache image (default: none)
            SKIP_VALIDATION  - Skip local validation build (default: "false")
            BUILDER_NAME     - Buildx builder name (default: "buildx-builder")

          Examples:
            # Basic usage
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=my-app REGISTRY_IMAGE=ghcr.io/myorg/my-app

            # With custom tag and Dockerfile
            task docker-build-and-push BUILD_CONTEXT=./backend IMAGE_NAME=api REGISTRY_IMAGE=ghcr.io/myorg/api IMAGE_TAG=v1.2.3 DOCKERFILE_PATH=docker/Dockerfile

            # Multi-stage build with target
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app BUILD_TARGET=production

            # Skip validation (faster, for CI/CD)
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app SKIP_VALIDATION=true

            # Single platform build (faster for testing)
            task docker-build-and-push BUILD_CONTEXT=. IMAGE_NAME=app REGISTRY_IMAGE=ghcr.io/myorg/app PLATFORMS=linux/amd64
      - sh: '[ -n "{{.IMAGE_NAME}}" ]'
        msg: "IMAGE_NAME is required (see help above)"
      - sh: '[ -n "{{.REGISTRY_IMAGE}}" ]'
        msg: "REGISTRY_IMAGE is required (see help above)"
      - sh: '[ -d "{{.BUILD_CONTEXT}}" ]'
        msg: 'BUILD_CONTEXT directory does not exist: {{.BUILD_CONTEXT}}'
      - sh: '[ -f "{{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}}" ]'
        msg: 'Dockerfile not found: {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}}'

    cmds:
      # Step 1: Local validation build
      - |
        if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
          echo "Building {{.IMAGE_NAME}} locally for validation..."
          TARGET_FLAG=""
          if [[ -n "{{.BUILD_TARGET}}" ]]; then
            TARGET_FLAG="--target {{.BUILD_TARGET}}"
          fi
          CACHE_FLAG=""
          if [[ -n "{{.CACHE_IMAGE}}" ]]; then
            CACHE_FLAG="--cache-from {{.CACHE_IMAGE}}"
          fi

          docker buildx build \
            $TARGET_FLAG \
            $CACHE_FLAG \
            --cache-from {{.IMAGE_NAME}}:latest \
            --load \
            -t {{.IMAGE_NAME}}:test \
            -f {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}} \
            {{.BUILD_CONTEXT}}
          echo "✅ Local build successful"
        fi

      # Step 2: Interactive confirmation
      - |
        echo ""
        echo "Publishing {{.IMAGE_NAME}} to container registry..."
        echo "Registry: {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}}"
        echo "Platforms: {{.PLATFORMS}}"
        echo "Build context: {{.BUILD_CONTEXT}}"
        echo "Dockerfile: {{.DOCKERFILE_PATH}}"
        echo ""
        printf "Continue with publishing? [y/N]: "
        read -r REPLY
        if [[ ! $REPLY =~ ^[Yy]$ ]]; then
          echo "Publishing cancelled."
          if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
            docker rmi {{.IMAGE_NAME}}:test 2>/dev/null || true
          fi
          exit 1
        fi

      # Step 3: Create buildx builder if needed
      - |
        docker buildx create --name {{.BUILDER_NAME}} --use --driver docker-container 2>/dev/null || docker buildx use {{.BUILDER_NAME}}

      # Step 4: Multi-platform build and push
      - |
        echo "Building and pushing multi-platform image..."
        TARGET_FLAG=""
        if [[ -n "{{.BUILD_TARGET}}" ]]; then
          TARGET_FLAG="--target {{.BUILD_TARGET}}"
        fi
        CACHE_FLAGS=""
        if [[ -n "{{.CACHE_IMAGE}}" ]]; then
          CACHE_FLAGS="--cache-from type=registry,ref={{.CACHE_IMAGE}} --cache-to type=registry,ref={{.CACHE_IMAGE}},mode=max"
        fi
        EXTRA_TAG_FLAG=""
        if [[ -n "{{.EXTRA_TAG}}" ]]; then
          EXTRA_TAG_FLAG="-t {{.FULL_REGISTRY_IMAGE}}:{{.EXTRA_TAG}}"
        fi

        # Disable provenance and SBOM to avoid unknown/unknown platform entries in GHCR
        # See: https://github.com/orgs/community/discussions/45969
        DOCKER_BUILDKIT=1 docker buildx build \
          --platform {{.PLATFORMS}} \
          --provenance=false \
          --sbom=false \
          $TARGET_FLAG \
          $CACHE_FLAGS \
          -f {{.BUILD_CONTEXT}}/{{.DOCKERFILE_PATH}} \
          -t {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}} \
          $EXTRA_TAG_FLAG \
          --push \
          {{.BUILD_CONTEXT}}

        echo "✅ Image published successfully to {{.FULL_REGISTRY_IMAGE}}:{{.IMAGE_TAG}}"
        if [[ -n "{{.EXTRA_TAG}}" ]]; then
          echo "✅ Also tagged as {{.FULL_REGISTRY_IMAGE}}:{{.EXTRA_TAG}}"
        fi

      # Step 5: Cleanup
      - |
        if [[ "{{.SKIP_VALIDATION}}" != "true" ]]; then
          echo "Cleaning up local test image..."
          docker rmi {{.IMAGE_NAME}}:test 2>/dev/null || true
        fi
    silent: true
    # Usage Examples:
    #
    # Example 1: Build and publish operations-manager
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/minbzk/base-images/operations-manager \
    #     BUILD_TARGET=application \
    #     CACHE_IMAGE=ghcr.io/minbzk/base-images/operations-manager:cache
    #
    # Example 2: Build PostgreSQL image from subdirectory
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=images/postgresql-with-dictionaries \
    #     DOCKERFILE_PATH=Dockerfile \
    #     IMAGE_NAME=postgresql-with-dictionaries \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/postgresql-with-dictionaries \
    #     IMAGE_TAG=17
    #
    # Example 3: Build with custom tag and skip validation
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/operations-manager \
    #     IMAGE_TAG=v2.0.0 \
    #     SKIP_VALIDATION=true
    #
    # Example 4: Build for single platform (faster local testing)
    #   task docker-build-and-push \
    #     BUILD_CONTEXT=. \
    #     DOCKERFILE_PATH=operations-manager/Dockerfile \
    #     IMAGE_NAME=operations-manager \
    #     REGISTRY_IMAGE=ghcr.io/rijksictgilde/operations-manager \
    #     PLATFORMS=linux/amd64
    #
    # Parameters:
    #   BUILD_CONTEXT    - Root directory for build context (required)
    #   DOCKERFILE_PATH  - Path to Dockerfile relative to context (default: "Dockerfile")
    #   IMAGE_NAME       - Local test image name (required)
    #   REGISTRY_IMAGE   - Full registry path without tag (required)
    #   IMAGE_TAG        - Image tag (default: "latest")
    #   PLATFORMS        - Target platforms (default: "linux/amd64")
    #   BUILD_TARGET     - Multi-stage build target (optional)
    #   CACHE_IMAGE      - Registry cache location (optional)
    #   SKIP_VALIDATION  - Skip local build validation (default: "false")
    #   BUILDER_NAME     - Buildx builder name (default: "buildx-builder")

  image-version:
    desc: "Print the CalVer image tag of the operations-manager source ({YYYY}.{MM}.{DD}.{HHMM}-{short sha})"
    cmds:
      - echo "{{.IMAGE_VERSION}}"
    vars:
      IMAGE_VERSION:
        sh: scripts/calver-tag.sh operations-manager
    silent: true

  publish-operations-manager:
    desc: "Build and publish the operations-manager to GitHub Container Registry (CalVer tag + latest), and pin OVERLAY (default odcn-production)"
    deps: [requirements-check, generate-env-secrets-for-operations-manager]
    vars:
      IMAGE_VERSION:
        sh: scripts/calver-tag.sh operations-manager
    cmds:
      # Allebei de controles voor version:generate en de bouw, zodat er niets ontstaat dat
      # toch niet gepind mag worden.
      - |
        echo "Image version: {{.IMAGE_VERSION}}"

        # Dezelfde weigering als de promote-taak van Keycloak: een -dirty-tag komt van bron
        # die niet in git staat, dus op productie is niet na te gaan wat er draait en is de
        # image ook niet opnieuw te maken.
        case "{{.IMAGE_VERSION}}" in
          *-dirty)
            echo "{{.IMAGE_VERSION}} komt van ongecommitte bron en hoort niet op productie." >&2
            echo "Commit de wijziging en bouw opnieuw." >&2
            exit 1
            ;;
        esac

        # Een commit die alleen hier staat kan niemand anders opzoeken, en na een rebase of
        # een verse clone bestaat hij niet meer. De tag wijst dan naar niets.
        if [ -z "$(git branch -r --contains HEAD)" ]; then
          echo "De commit van deze tag staat op geen enkele remote." >&2
          echo "Push hem eerst, anders wijst de tag naar bron die niemand kan opzoeken." >&2
          exit 1
        fi
      # Zie sandbox:build-operations-manager-image. Hier weegt het het zwaarst: dit is de
      # image die uitgerold wordt, en de CalVer-tag zou dan een andere commit noemen dan
      # de image over zichzelf meldt.
      - task: version:generate
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: .
          DOCKERFILE_PATH: operations-manager/Dockerfile
          IMAGE_NAME: operations-manager
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images/operations-manager
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          EXTRA_TAG: latest
          BUILD_TARGET: application
          CACHE_IMAGE: ghcr.io/minbzk/base-images/operations-manager:cache
          BUILDER_NAME: operations-manager-builder
          PLATFORMS: linux/amd64,linux/arm64
          SKIP_VALIDATION: "true"
      # Pint alleen de overlay die je noemt: een image bouwen voor staging mag de pin van
      # productie niet meeschuiven.
      - task: pin-operations-manager-image
        vars:
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          OVERLAY: '{{.OVERLAY | default "odcn-production"}}'

  _pin-image-digest:
    internal: true
    desc: "Schrijf <image>:<tag>@<digest> in de bestanden die dit image pinnen"
    summary: |
      De digest komt uit de registry en niet uit een lokale bouw: gepind wordt wat daar
      staat. Een tag in de registry is te overschrijven, een digest niet.

      Het voorvoegsel dat een bestand al heeft blijft staan, dus de sandbox houdt ghcr.io
      en productie de rcr-spiegel. Een pad VERHUIZEN doet deze taak niet.
    requires:
      vars: [IMAGE_NAME, REPO, IMAGE_TAG, PIN_FILES]
    cmds:
      - |
        DIGEST="$(docker buildx imagetools inspect {{.REPO}}:{{.IMAGE_TAG}} | awk '/^Digest:/ {print $2; exit}')"
        case "$DIGEST" in
          sha256:*) ;;
          *)
            echo "{{.REPO}}:{{.IMAGE_TAG}} levert geen digest. Staat die tag in de registry?" >&2
            exit 1
            ;;
        esac

        for BESTAND in {{.PIN_FILES}}; do
          sed -i.bak -E "s#^([[:space:]]*(image|value):[[:space:]]*)([A-Za-z0-9./_-]*{{.IMAGE_NAME}})(:[^@[:space:]]+)?(@sha256:[0-9a-f]{64})?[[:space:]]*\$#\1\3:{{.IMAGE_TAG}}@${DIGEST}#" "$BESTAND"
          rm -f "$BESTAND.bak"
          grep -q "@${DIGEST}" "$BESTAND" || {
            echo "$BESTAND pint {{.IMAGE_NAME}} niet op een regel die deze taak kan lezen." >&2
            exit 1
          }
          grep -nE "^[[:space:]]*(image|value):.*{{.IMAGE_NAME}}" "$BESTAND"
        done
    silent: true

  pin-cmp-image:
    desc: "Pin de SOPS-sidecar van ArgoCD op een gepubliceerde tag plus digest"
    summary: |
      publish-cmp-kustomize-sops roept dit aan met de tag die hij net gepusht heeft. Los
      aanroepen kan ook, bijvoorbeeld om terug te rollen naar een eerdere tag.

      Drie bestanden, want de sidecar staat drie keer in git: de component sops-plugin (die
      de sandbox gebruikt), de component cmp-odcn (die op elk ODCN-cluster telt) en de
      ArgoCD-CR zelf. Elk bestand houdt zijn eigen registrypad.

      Dit is geen uitrol: de ArgoCD-CR gaat buiten ArgoCD om en is een handeling van een mens.
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default ""}}'
      PIN_FILES: >-
        bootstrap/rig-system/kustomize/components/sops-plugin/kustomization.yaml
        bootstrap/rig-system/kustomize/components/cmp-odcn/kustomization.yaml
        bootstrap/rig-system/kustomize/overlays/odcn-production/argocd-deployment.yaml
    preconditions:
      - sh: '[ -n "{{.IMAGE_TAG}}" ]'
        msg: |
          IMAGE_TAG is verplicht, bijvoorbeeld:
            task pin-cmp-image IMAGE_TAG=2026.10.18.1432-7ccad61d
    cmds:
      - task: _pin-image-digest
        vars:
          IMAGE_NAME: rig-cmp-argo-kustomize-sops
          REPO: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops
          IMAGE_TAG: '{{.IMAGE_TAG}}'
          PIN_FILES: '{{.PIN_FILES}}'
      - |
        echo ""
        echo "Commit deze pin. De sandbox volgt via task sandbox:sync; de ArgoCD-CR op"
        echo "productie rolt een mens uit met task bootstrap-argo-system."
        echo ""
        echo "Terugrollen: zoek een eerdere tag in de git-historie van deze bestanden."
    silent: true

  pin-operations-manager-image:
    desc: "Pin an ODCN overlay (default odcn-production, or OVERLAY=odcn-staging) to a published operations-manager tag"
    vars:
      IMAGE_TAG: '{{.IMAGE_TAG | default ""}}'
      # Bewust een eigen default en niet het geselecteerde cluster: een pin is een
      # deploybeslissing, en die hoort niet stil mee te schuiven met select-cluster.
      OVERLAY: '{{.OVERLAY | default "odcn-production"}}'
      PATCH_FILE: bootstrap/rig-system/kustomize/operations-manager/overlays/{{.OVERLAY}}/patches/deployment.yaml
    preconditions:
      - sh: '[ -n "{{.IMAGE_TAG}}" ]'
        msg: |
          IMAGE_TAG is required, for example:
            task pin-operations-manager-image IMAGE_TAG=2026.07.22.1432-7ccad61d
      # Ook voor een pin met de hand: publish-operations-manager weigert zo'n tag al, maar
      # terugrollen en pinnen zijn losse aanroepen die deze taak rechtstreeks gebruiken.
      - sh: 'case "{{.IMAGE_TAG}}" in *-dirty) exit 1 ;; esac'
        msg: |
          {{.IMAGE_TAG}} komt van ongecommitte bron en hoort niet op productie.
          Commit de wijziging en bouw opnieuw.
    cmds:
      - task: _pin-image-digest
        vars:
          IMAGE_NAME: operations-manager
          REPO: ghcr.io/minbzk/base-images/operations-manager/operations-manager
          IMAGE_TAG: '{{.IMAGE_TAG}}'
          PIN_FILES: '{{.PATCH_FILE}}'
      - |
        echo ""
        echo "✅ {{.OVERLAY}} pinned to {{.IMAGE_TAG}}"
        grep -n 'image:' {{.PATCH_FILE}}
        echo ""
        echo "Commit this pin, then deploy:"
        echo "  git add {{.PATCH_FILE}} && git commit -m 'deploy: operations-manager {{.IMAGE_TAG}}'"
        echo "  CLUSTER_TYPE={{.OVERLAY}} task deploy-operations-manager"
        echo ""
        echo "To roll back, pin an earlier tag from the git history of that file."
    silent: true

  publish-cmp-kustomize-sops:
    desc: "Bouw de SOPS-sidecar, push hem naar GHCR (CalVer + latest) en pin hem"
    summary: |
      Dezelfde vorm als publish-operations-manager: een CalVer-tag, `latest` ernaast, en
      daarna de pin in git.

      Deze container leest bij het renderen de SOPS-sleutel, dus hier weegt een
      onveranderlijke verwijzing het zwaarst: de pin draagt ook de digest.
    deps: [requirements-check]
    vars:
      IMAGE_VERSION:
        sh: scripts/calver-tag.sh images/cmp-kustomize-sops
    preconditions:
      # Weigeren en niet waarschuwen zoals publish-operations-manager: deze tag wordt
      # meteen in git gepind, en een pin die naar ongecommitte bron wijst is niet te
      # herleiden en niet opnieuw te maken.
      - sh: 'case "{{.IMAGE_VERSION}}" in *-dirty) exit 1 ;; esac'
        msg: |
          {{.IMAGE_VERSION}} komt van ongecommitte bron in images/cmp-kustomize-sops.
          Commit de wijziging eerst, dan beschrijft de tag wat je publiceert.
    cmds:
      - |
        echo "Image version: {{.IMAGE_VERSION}}"
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: .
          DOCKERFILE_PATH: images/cmp-kustomize-sops/Dockerfile
          IMAGE_NAME: rig-cmp-argo-kustomize-sops
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          EXTRA_TAG: latest
          BUILDER_NAME: operations-manager-builder
          PLATFORMS: linux/amd64,linux/arm64
      - task: pin-cmp-image
        vars:
          IMAGE_TAG: '{{.IMAGE_VERSION}}'

  publish-hello-world:
    desc: "Build and publish the hello-world image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/hello-world
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: hello-world
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  publish-mc:
    desc: "Vul de mc-spiegel in GHCR uit de GitHub-release (zie images/mc/README.md)"
    deps: [requirements-check]
    vars:
      # De tag komt uit het Dockerfile, want daar staat ook de checksum van precies die
      # release. Twee plekken zouden uit elkaar lopen zonder dat een build dat merkt.
      MC_VERSION:
        sh: sed -n 's/^ARG MC_VERSION=//p' images/mc/Dockerfile | head -1
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/mc
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: mc
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          IMAGE_TAG: '{{.MC_VERSION}}'
          PLATFORMS: linux/amd64,linux/arm64

  publish-haproxy-redirect:
    desc: "Build and publish the haproxy-redirect image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/haproxy-redirect
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: haproxy-redirect
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  generate-probe-spec:
    desc: "Regenerate the e2e-allservices probe spec from OPI's service registry"
    dir: operations-manager/python
    cmds:
      - uv run python ../../scripts/generate_probe_spec.py
    silent: true

  biv-overzicht:
    desc: "Genereer architecture/biv-overzicht.md uit de BIV-inventaris"
    dir: operations-manager/python
    cmds:
      - uv run python -m opi.tools.biv_render
    silent: true

  biv-check:
    desc: "Toets de BIV-inventaris op gaten en het overzicht op drift"
    dir: operations-manager/python
    cmds:
      - uv run python -m opi.tools.biv_render --check
    silent: true

  asvs-afvinklijst:
    desc: "Genereer docs/security/asvs-zelfbeoordeling.md uit de ASVS-zelfbeoordeling"
    dir: operations-manager/python
    cmds:
      - uv run python -m opi.tools.asvs_render
    silent: true

  asvs-check:
    desc: "Toets of elke ASVS-eis een oordeel heeft en de genoemde toetsen bestaan"
    dir: operations-manager/python
    cmds:
      - uv run python -m opi.tools.asvs_render --check
    silent: true

  schotten:kyverno:
    desc: "Install Kyverno en zet de ZAD-policies in waarschuwmodus op het huidige cluster"
    cmds:
      - |
        # De versie staat alleen in .github/workflows/aanvalsproef.yml, zodat de CI-toets en
        # een handmatige uitrol dezelfde Kyverno draaien.
        KYVERNO_VERSION=$(yq '.env.KYVERNO_VERSION' .github/workflows/aanvalsproef.yml)
        kubectl apply -f "https://github.com/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/install.yaml"
        kubectl -n kyverno rollout status deployment/kyverno-admission-controller --timeout=300s
        kubectl apply -k infrastructure/bootstrap/infrastructure/kyverno/policies/base
        kubectl get clusterpolicy
    silent: true

  schotten:falco:
    desc: "Zet Falco met de ZAD-regels op het huidige cluster (runtime-detectie)"
    cmds:
      - kubectl apply -n rig-system -k infrastructure/bootstrap/infrastructure/falco/controller/base
      - kubectl -n rig-system rollout status daemonset/falco --timeout=300s
    silent: true

  publish-e2e-allservices:
    desc: "Build and publish the e2e-allservices test workload to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      # Embed the current probe spec (scan of the service registry) before building.
      - task: generate-probe-spec
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/e2e-allservices
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: e2e-allservices
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  publish-waker:
    desc: "Build and publish the zad-waker (sleep-mode) image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: images/zad-waker
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: zad-waker
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images
          PLATFORMS: linux/amd64,linux/arm64

  build-job-test-image:
    desc: "Build and load the tiny job-test image into kind (for testing the job runner)"
    cmds:
      - |
        echo "Building job-test image..."
        docker build -t job-test:latest -f images/job-test/Dockerfile images/job-test/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image job-test:latest --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ job-test image built and loaded. Run a job with image 'local/job-test:latest' and command '/startup.sh hello'."
    silent: true

  build-postgresql-image:
    desc: "Build and load PostgreSQL image with dictionary files into kind cluster"
    cmds:
      - |
        echo "Building PostgreSQL image with full-text search dictionaries..."
        docker build -t postgresql-with-dictionaries:17 -f images/postgresql-with-dictionaries/Dockerfile images/postgresql-with-dictionaries/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image postgresql-with-dictionaries:17 --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ PostgreSQL image built and loaded successfully!"
    silent: true

  build-backup-image:
    desc: "Build and load the rig-backup image into kind cluster"
    cmds:
      - |
        echo "Building rig-backup image (kopia, mc, pg_dump)..."
        docker build -t ghcr.io/minbzk/base-images/rig-backup:latest -f operations-manager/backup-image/Dockerfile operations-manager/backup-image/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image ghcr.io/minbzk/base-images/rig-backup:latest --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ rig-backup image built and loaded successfully!"
    silent: true

  publish-backup-image:
    desc: "Bouw de rig-backup-image en push hem naar GHCR (CalVer + latest)"
    summary: |
      Dezelfde vorm als publish-operations-manager, zonder de pin erachter: welke image de
      back-uppods krijgen staat in de setting BACKUP_IMAGE (opi/core/config.py). Zet de
      standaard daar op de tag die je hier publiceert.
    deps: [requirements-check]
    vars:
      IMAGE_VERSION:
        sh: scripts/calver-tag.sh operations-manager/backup-image
    preconditions:
      - sh: 'case "{{.IMAGE_VERSION}}" in *-dirty) exit 1 ;; esac'
        msg: |
          {{.IMAGE_VERSION}} komt van ongecommitte bron in operations-manager/backup-image.
          Commit de wijziging eerst, dan beschrijft de tag wat je publiceert.
    cmds:
      - |
        echo "Image version: {{.IMAGE_VERSION}}"
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: operations-manager/backup-image
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: rig-backup
          REGISTRY_IMAGE: ghcr.io/minbzk/base-images/
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          EXTRA_TAG: latest
          PLATFORMS: linux/amd64,linux/arm64
          CACHE_IMAGE: ghcr.io/minbzk/base-images/rig-backup:cache
          BUILDER_NAME: rig-backup-builder

  security-audit:
    desc: "Run pip-audit to check Python dependencies for known vulnerabilities"
    dir: operations-manager/python
    cmds:
      - uv run pip-audit --strict --desc

  security-proof:
    desc: "Aanvalsproef: zet een wegwerp-sandbox op, beproef hem, en schrijf het rapport"
    dir: operations-manager/python
    cmds:
      - uv run python -m security_tests.proef

  security-proof:up:
    desc: "Breng de wegwerp-sandbox van de aanvalsproef omhoog op poort 8311"
    dir: operations-manager/python
    cmds:
      - |
        if curl -fsS http://127.0.0.1:8311/health >/dev/null 2>&1; then
          echo "proefsandbox draait al op http://127.0.0.1:8311"
          exit 0
        fi
        mkdir -p ../security-proof/.proef
        nohup uv run python -m security_tests.sandbox > ../security-proof/.proef/sandbox.log 2>&1 &
        timeout 300 bash -c 'until curl -fsS http://127.0.0.1:8311/health >/dev/null 2>&1; do sleep 1; done'
        uv run python -m security_tests.doel

  security-proof:down:
    desc: "Breek de wegwerp-sandbox van de aanvalsproef af"
    dir: operations-manager/python
    cmds:
      - uv run python -m security_tests.sandbox stop

  security-proof:sandbox:
    desc: "Maak de geclaimde sandbox het doel van de aanvalsproef (token in de pod, runbestand erbij)"
    dir: operations-manager/python
    vars:
      DOELURL: '{{default "https://zad.sandbox.rijksapp.dev" .DOELURL}}'
      KUBECTL: kubectl --context kind-rig-sandbox -n rig-system --request-timeout=60s
    cmds:
      # Het token gaat in het env-secret van OPI en niet in git: dat secret heeft geen
      # ArgoCD-eigenaar, dus een patch blijft staan tot security-proof:sandbox-af hem leegt.
      - |
        TOKEN=$(uv run python -c 'import secrets; print(secrets.token_urlsafe(24))')
        {{.KUBECTL}} patch secret operations-manager-env-secrets --type merge \
          -p "{\"stringData\":{\"SECURITY_PROOF_TOKEN\":\"$TOKEN\"}}"
        {{.KUBECTL}} rollout restart deployment/operations-manager
        {{.KUBECTL}} rollout status deployment/operations-manager --timeout=300s
        # Na de rollout kan de ingress nog even de oude pod (zonder token) bedienen: wacht
        # tot /health het token vijf keer achter elkaar geeft.
        GOED=0
        for _ in $(seq 1 120); do
          if curl -sk -D - -o /dev/null {{.DOELURL}}/health | tr -d '\r' | grep -qx "x-zad-proef: $TOKEN"; then
            GOED=$((GOED + 1)); [ "$GOED" -ge 5 ] && break
          else
            GOED=0
          fi
          sleep 1
        done
        [ "$GOED" -ge 5 ] || { echo "het proeftoken komt niet stabiel terug op {{.DOELURL}}/health"; exit 1; }
        # Proefprojecten met een sleutel, anders meet de proef niet of een project bij een ander kan.
        E2E_BASE_URL={{.DOELURL}} uv run python -m security_tests.proefprojecten maak 2
        ZAD_PROEF_TOKEN="$TOKEN" ZAD_PROEF_SLEUTELS="$(cat ../security-proof/.proef/proefprojecten.json)" \
          uv run python -m security_tests.sandboxdoel {{.DOELURL}}

  security-proof:sandbox-af:
    desc: "Haal het proeftoken uit de sandbox en gooi het runbestand weg"
    dir: operations-manager/python
    vars:
      KUBECTL: kubectl --context kind-rig-sandbox -n rig-system --request-timeout=60s
    cmds:
      - |
        uv run python -m security_tests.proefprojecten ruim-op || echo "LET OP: niet alle proefprojecten zijn opgeruimd"
        {{.KUBECTL}} patch secret operations-manager-env-secrets --type merge \
          -p '{"stringData":{"SECURITY_PROOF_TOKEN":""}}'
        {{.KUBECTL}} rollout restart deployment/operations-manager
        {{.KUBECTL}} rollout status deployment/operations-manager --timeout=300s
        rm -f ../security-proof/.proef/sandbox.json

  security-proof:fuzzers:
    desc: "Draai alleen de gerichte proeven tegen een al draaiende wegwerp-sandbox"
    dir: operations-manager/python
    cmds:
      - uv run pytest security_tests -q -p no:cacheprovider

  security-scan-image:
    desc: "Scan operations-manager Docker image for vulnerabilities with Trivy"
    cmds:
      - docker build -t opi:scan -f operations-manager/Dockerfile .
      - trivy image --severity HIGH,CRITICAL opi:scan

  # Internal shared task for secret generation
  _generate-secrets-shared:
    internal: true
    silent: true
    vars:
      MODE: '{{.MODE}}'  # "infrastructure" or "bootstrap"
      TEMPLATES_DIR: '{{.TEMPLATES_DIR}}'
      OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      CLUSTER_TYPE: '{{.CLUSTER_TYPE}}'
      CLUSTER_FOLDER: '{{.CLUSTER_FOLDER}}'
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      FIXED_PASSWORD: '{{default "" .FIXED_PASSWORD}}'  # If set, use this instead of random passwords (for sandbox/dev)
    preconditions:
      - *age_key_file_guard
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        if [ ! -f ".env-taskfile-current" ]; then
          echo "❌ No cluster selected. Please run 'task select-cluster' first."
          exit 1
        fi
        # Bestaan is niet genoeg: als .env-taskfile-current pas tijdens deze run is
        # aangemaakt, zijn de dotenv-waarden al leeg ingelezen. Zonder deze check schrijft
        # de generatie naar OUTPUT_DIR/ zelf in plaats van OUTPUT_DIR/<cluster>, ziet daar
        # de .sops.yaml van een andere cluster, en slaat stilzwijgend alles over.
        if [ -z "{{.CLUSTER_FOLDER}}" ]; then
          echo "❌ CLUSTER_FOLDER is leeg — de cluster-variabelen zijn niet geladen."
          echo "   .env-taskfile-current wordt bij het parsen gelezen, dus hij moet er"
          echo "   staan vóór je task start:"
          echo "     cp .env-taskfile-sandboxed-local .env-taskfile-current"
          exit 1
        fi
        if [ ! -f "{{.KEY_FILE}}" ]; then
          echo "❌ {{.KEY_FILE}} not found. Please generate an AGE key first."
          exit 1
        fi
      - |
        echo "🔐 Generating {{.MODE}} secrets for cluster: {{.CLUSTER_NAME}}"
        echo "📁 Templates directory: {{.TEMPLATES_DIR}}"
        echo "📁 Output directory: {{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"
        echo ""

        # Create output directory
        mkdir -p "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"

        # Bestaande geheimen worden PER BESTAND overgeslagen (zie de check in de lus), niet
        # met een map-brede stop. Zo wordt een bestaand geheim nooit geroteerd, maar komt
        # een NIEUWE template (zoals mail-db-credentials op een al draaiend cluster) er wel
        # gewoon bij. De oude map-brede stop kon dat alleen door ALLES weg te gooien, en
        # dat roteert Keycloak, MinIO en PostgreSQL mee.

        # Het overzicht gaat eerst naar een tijdelijk bestand en komt alleen in het echte
        # overzicht als er een nieuw geheim is, en dan erachteraan. Vroeger begon elke run
        # het overzicht leeg, dus een run zonder nieuwe geheimen wiste de wachtwoorden van
        # de eerste.
        OVERVIEW_TARGET="secrets-overview-{{.MODE}}-{{.CLUSTER_TYPE}}.yaml"
        OVERVIEW_FILE="$(mktemp)"

        echo "# {{.MODE | title}} Secrets Overview - {{.CLUSTER_TYPE}}" > "$OVERVIEW_FILE"
        echo "# Generated on $(date)" >> "$OVERVIEW_FILE"
        echo "# WARNING: This file contains plaintext passwords - handle with care!" >> "$OVERVIEW_FILE"
        echo "# This file is added to .gitignore - copy passwords and delete this file manually" >> "$OVERVIEW_FILE"
        echo "" >> "$OVERVIEW_FILE"

        # Process each template
        for template in {{.TEMPLATES_DIR}}/*.yaml; do
          if [ ! -f "$template" ]; then
            echo "No template files found in {{.TEMPLATES_DIR}}"
            continue
          fi

          filename=$(basename "$template")

          # Only process files that are clearly secrets (contain '-secret' or '.secret' in filename)
          if [[ "$filename" != *"-secret.yaml" ]] && [[ "$filename" != *".secret.yaml" ]]; then
            echo "Skipping non-secret file: $filename"
            continue
          fi

          # Een geheim dat er al staat blijft staan: overslaan is de bescherming tegen
          # ongevraagde rotatie. Opnieuw genereren = het .sops.yaml-bestand weggooien.
          if [ -f "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/${filename}.sops.yaml" ]; then
            echo "Skipping (already exists): ${filename}.sops.yaml"
            continue
          fi

          echo "Processing: $filename"

          # Copy template to temp file
          temp_file=$(mktemp)
          cp "$template" "$temp_file"

          # Add filename to overview
          echo "# === $filename ===" >> "$OVERVIEW_FILE"

          # Find all @secret-gen annotations and process them
          grep -n "# @secret-gen:" "$template" | while IFS=':' read -r line_num rest; do
            # Get the full line
            full_line=$(sed -n "${line_num}p" "$template")

            # Extract field name (everything before first colon)
            field_name=$(echo "$full_line" | cut -d':' -f1 | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')

            # Extract annotation details (everything after # @secret-gen:)
            annotation=$(echo "$full_line" | sed 's/.*# @secret-gen://')

            # Parse annotation: type:length[,path=...] or skip
            if echo "$annotation" | grep -q "skip"; then
              echo "  Skipping line $line_num (marked with @secret-gen:skip)"
              continue
            fi

            # Parse type and length
            type_length=$(echo "$annotation" | cut -d',' -f1)
            password_type=$(echo "$type_length" | cut -d':' -f1)
            password_length=$(echo "$type_length" | cut -d':' -f2)

            # Parse path if present
            path_annotation=""
            if echo "$annotation" | grep -q "path="; then
              path_annotation=$(echo "$annotation" | sed 's/.*path=//')
            fi

            if [ -z "$field_name" ]; then
              echo "  ❌ Could not find field name on line $line_num"
              continue
            fi

            # Generate password based on type
            case "$password_type" in
              "random")
                if [ -n "{{.FIXED_PASSWORD}}" ]; then
                  password="{{.FIXED_PASSWORD}}"
                else
                  password=$(openssl rand -base64 $password_length | tr -d "=+/" | cut -c1-$password_length)
                fi
                ;;
              "bcrypt")
                if [ -n "{{.FIXED_PASSWORD}}" ]; then
                  plain_password="{{.FIXED_PASSWORD}}"
                else
                  plain_password=$(openssl rand -base64 16 | tr -d "=+/" | cut -c1-16)
                fi
                password=$(htpasswd -nbBC 10 "" "$plain_password" | tr -d ':\n' | sed 's/$2b/$2y/')
                ;;
              *)
                echo "❌ Unknown password type: $password_type"
                continue
                ;;
            esac

            echo "  Generated $password_type password for field: $field_name"

            # Use yq to replace the field value (more reliable than sed)
            yq eval ".stringData.\"$field_name\" = \"$password\"" -i "$temp_file"

            # Add to overview file
            if [ "$password_type" = "bcrypt" ]; then
              echo "$field_name: \"$plain_password\"  # Original password (bcrypt hash in secret)" >> "$OVERVIEW_FILE"
            else
              echo "$field_name: \"$password\"" >> "$OVERVIEW_FILE"
            fi
          done

          echo "" >> "$OVERVIEW_FILE"

          # Path substitution not needed - path annotation is only for informational purposes

          # Always replace namespace with the cluster-specific namespace from env settings
          echo "  Setting namespace to: {{.RIG_NAMESPACE}}"
          yq eval '.metadata.namespace = "{{.RIG_NAMESPACE}}"' -i "$temp_file"

          # Copy to final location and encrypt with SOPS using AGE key
          output_file="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/${filename}.sops.yaml"
          cp "$temp_file" "$output_file"

          AGE_PUBLIC_KEY=$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')
          echo "  Encrypting: $output_file"
          sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$output_file"

          # Clean up temp file
          rm "$temp_file"
        done

        # Update or create decrypt-sops.yaml
        echo ""
        echo "Updating decrypt-sops.yaml..."
        DECRYPT_FILE="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/decrypt-sops.yaml"

        # Create decrypt-sops.yaml if it doesn't exist
        if [ ! -f "$DECRYPT_FILE" ]; then
          echo "  Creating new decrypt-sops.yaml"
          cat > "$DECRYPT_FILE" << 'DECRYPT_EOF'
        apiVersion: viaduct.ai/v1
        kind: ksops
        metadata:
          name: secret-generator
          annotations:
            config.kubernetes.io/function: "exec:\n  path: ksops\n"
        files:
        DECRYPT_EOF
        fi

        # Add all .sops.yaml files from output directory if not already present
        for sops_file in "{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}"/*.sops.yaml; do
          if [ -f "$sops_file" ]; then
            filename=$(basename "$sops_file")
            # Check if this file is already referenced
            if ! grep -qF "$filename" "$DECRYPT_FILE"; then
              echo "  - $filename" >> "$DECRYPT_FILE"
              echo "  ✅ Added: $filename"
            else
              echo "  ℹ️  Already present: $filename"
            fi
          fi
        done

        # Create kustomization.yaml if it doesn't exist
        KUSTOMIZATION_FILE="{{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/kustomization.yaml"
        if [ ! -f "$KUSTOMIZATION_FILE" ]; then
          echo "  Creating kustomization.yaml"
          cat > "$KUSTOMIZATION_FILE" << 'KUSTOMIZATION_EOF'
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization

        generators:
        - decrypt-sops.yaml
        KUSTOMIZATION_EOF
          echo "  ✅ Created kustomization.yaml"
        fi

        if grep -q '^# === ' "$OVERVIEW_FILE"; then
          cat "$OVERVIEW_FILE" >> "$OVERVIEW_TARGET"
          chmod 600 "$OVERVIEW_TARGET"
        fi
        rm -f "$OVERVIEW_FILE"
        OVERVIEW_FILE="$OVERVIEW_TARGET"

        echo ""
        echo "✅ {{.MODE | title}} secrets generated successfully!"
        echo "📄 Overview file: $OVERVIEW_FILE (added to .gitignore; alleen nieuwe geheimen komen erbij)"
        echo "🗂️  Encrypted secrets: {{.OUTPUT_DIR}}/{{.CLUSTER_FOLDER}}/"
        if [ "{{.MODE}}" = "infrastructure" ]; then
          echo "📝 Configuration files: kustomization.yaml, decrypt-sops.yaml"
        fi
        echo ""
        echo "⚠️  IMPORTANT: The overview file contains plaintext passwords."
        echo "   Copy any needed passwords and delete the overview file manually for security."

  generate-infrastructure-secrets-for-cluster:
    desc: "Generate infrastructure secrets for selected cluster from templates (run 'task select-cluster' first)"
    preconditions:
      - *secrets_dir_current_guard
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "infrastructure"
          TEMPLATES_DIR: "infrastructure/bootstrap/infrastructure/secrets/templates"
          OUTPUT_DIR: '{{if .SECRETS_DIR}}{{.SECRETS_DIR}}{{else}}infrastructure/bootstrap/infrastructure/secrets/config/overlays{{end}}'
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
          CLUSTER_FOLDER: '{{if .SECRETS_DIR}}infrastructure{{else}}{{.INFRASTRUCTURE_CLUSTER_FOLDER}}{{end}}'
      # De mailrelay leest twee van die geheimen in zijn eigen namespace. In de publieke
      # repo rendert de mail-overlay ze een tweede keer; in de secrets-repo doet de map
      # ron/ dat, met een eigen Application. Alleen bedrading, geen geheimen.
      - |
        if [ -n "{{.SECRETS_DIR}}" ] && [ ! -f "{{.SECRETS_DIR}}/ron/kustomization.yaml" ]; then
          mkdir -p "{{.SECRETS_DIR}}/ron"
          RIG_NS="{{.RIG_NAMESPACE}}"
          printf '%s\n' \
            'apiVersion: kustomize.config.k8s.io/v1beta1' \
            'kind: Kustomization' \
            '' \
            "namespace: ${RIG_NS%-operations}-ron" \
            'generators:' \
            '- decrypt-sops.yaml' > "{{.SECRETS_DIR}}/ron/kustomization.yaml"
          printf '%s\n' \
            'apiVersion: viaduct.ai/v1' \
            'kind: ksops' \
            'metadata:' \
            '  name: ron-secret-generator' \
            '  annotations:' \
            '    config.kubernetes.io/function: "exec:\n  path: ksops\n"' \
            'files:' \
            '- ../infrastructure/mail-relay-secret.yaml.sops.yaml' \
            '- ../infrastructure/mail-db-credentials-secret.yaml.sops.yaml' > "{{.SECRETS_DIR}}/ron/decrypt-sops.yaml"
          echo "✅ ron/ aangemaakt in {{.SECRETS_DIR}}"
        fi

  generate-bootstrap-secrets-for-cluster:
    desc: "Generate bootstrap secrets for selected cluster from templates (ArgoCD, etc.) (run 'task select-cluster' first)"
    preconditions:
      - *secrets_dir_current_guard
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "bootstrap"
          TEMPLATES_DIR: '{{default "bootstrap/rig-system/kustomize/secrets/templates" .BOOTSTRAP_TEMPLATES_DIR}}'
          OUTPUT_DIR: '{{if .SECRETS_DIR}}{{.SECRETS_DIR}}{{else}}bootstrap/rig-system/kustomize/overlays{{end}}'
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
          CLUSTER_FOLDER: '{{if .SECRETS_DIR}}bootstrap{{else}}{{.BOOTSTRAP_CLUSTER_FOLDER}}{{end}}'

  generate-backup-destination-secret:
    desc: "Generate the root secret of the backup-destination MinIO into the secrets repo (SECRETS_DIR, odcn-staging)"
    preconditions:
      - *secrets_dir_current_guard
      - sh: '[ -n "{{.SECRETS_DIR}}" ]'
        msg: "Alleen met SECRETS_DIR: zonder secrets-repo staat dit secret in de overlay zelf."
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "backup-destination"
          TEMPLATES_DIR: "infrastructure/bootstrap/infrastructure/backup-destination/controller/secret-templates"
          OUTPUT_DIR: "{{.SECRETS_DIR}}"
          CLUSTER_TYPE: "{{.CLUSTER_TYPE}}"
          CLUSTER_FOLDER: "backup-destination"
          RIG_NAMESPACE: "{{.BACKUP_NAMESPACE}}"

  build-keycloak-custom-mapper:
    desc: "Build the Keycloak custom mapper JAR"
    cmds:
      - |
        echo "🔨 Building Keycloak custom mapper..."
        cd images/keycloak-zad/extensions/custom-mapper
        mvn clean package
        echo "✅ JAR built: $(ls target/keycloak-saml-nameid-mapper-*.jar)"
    silent: false

  test-keycloak-custom-mapper:
    desc: "Run unit tests for the Keycloak custom mapper"
    deps: [build-keycloak-custom-mapper]
    cmds:
      - |
        echo "🧪 Running tests..."
        cd images/keycloak-zad/extensions/custom-mapper
        mvn test
    silent: false

  _wacht-op:
    internal: true
    desc: "Wacht tot CHECK slaagt, en toon de logs van CONTAINER als hij niet komt"
    summary: |
      Elke live groep start een container en moet wachten tot de dienst erin antwoordt.
      Wachten op de TOESTAND zelf, niet op de klok: de teller is een vangnet, geen
      wachtmechanisme. Daarom staat dit hier een keer en niet per groep.
    requires:
      vars: [WAT, CHECK, CONTAINER]
    vars:
      POGINGEN: '{{.POGINGEN | default "150"}}'
    cmds:
      - |
        i=0
        until {{.CHECK}}; do
          i=$((i + 1))
          if [ "$i" -gt {{.POGINGEN}} ]; then
            echo "{{.WAT}} kwam niet op binnen $(({{.POGINGEN}} * 2)) seconden:" >&2
            docker logs --tail 60 {{.CONTAINER}} >&2
            exit 1
          fi
          sleep 2
        done
        echo "{{.WAT}} antwoordt"

  test-postgres:
    desc: "Draai de groep postgres_live tegen de PostgreSQL die het platform pint (IMAGE= voor een andere)"
    summary: |
      Alles wat tegen een echte PostgreSQL meet in een commando: de connector methode voor
      methode, de DatabaseManager over twee deployments met een invariant na elke stap, de
      kloonpijplijn, en de opstartstappen (_setup_database, restrict_platform_databases).

      Tegen de image uit de CNPG-cluster van het platform, dus wat productie draait. De
      standaardrun slaat deze toetsen over. Zie docs/development/toetsen.md.
    cmds:
      - task: _postgres-live-group
        vars:
          IMAGE:
            sh: |
              if [ -n "{{.IMAGE}}" ]; then
                echo "{{.IMAGE}}"
              else
                yq '.spec.imageName' \
                  infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml
              fi

  _postgres-live-group:
    internal: true
    desc: "Draai de groep postgres_live tegen IMAGE"
    # De connector accepteert alleen poort 5432 (_ALLOWED_PG_PORTS), dus de wegwerpserver
    # staat daar en nergens anders; staat er al iets op 5432, dan zegt deze taak dat.
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; deze groep start een PostgreSQL in Docker."
      - sh: command -v pwgen
        msg: "pwgen is niet geinstalleerd; het wachtwoord van de wegwerpcontainer komt daarvandaan."
      - sh: command -v yq
        msg: "yq is niet geinstalleerd; de image en de init-SQL komen met yq uit het cluster-manifest."
      - sh: command -v psql && command -v pg_dump
        msg: "psql en pg_dump ontbreken; de kloonpijplijn roept ze aan als losse processen."
    requires:
      vars: [IMAGE]
    vars:
      CONTAINER: zad-postgres-live-test
      PORT: '5432'
      PASSWORD:
        sh: pwgen -s 24 1
      # De extensies die de CNPG-bootstrap aanmaakt, uit datzelfde manifest: een groep die
      # ze zelf noemt, meet een andere server dan productie draait.
      INIT_SQL:
        sh: |
          yq '.spec.bootstrap.initdb.postInitApplicationSQL | join(" ")' \
            infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml
    cmds:
      - defer: |
          docker rm -f {{.CONTAINER}} >/dev/null 2>&1
          exit 0
      - |
        echo "Toetsen tegen {{.IMAGE}}"
        docker rm -f {{.CONTAINER}} >/dev/null 2>&1
        docker run -d --name {{.CONTAINER}} \
          -p 127.0.0.1:{{.PORT}}:5432 \
          -e POSTGRES_PASSWORD='{{.PASSWORD}}' \
          -e POSTGRES_INIT_SQL='{{.INIT_SQL}}' \
          -v {{.ROOT_DIR}}/scripts/postgres-standalone-start.sh:{{.PG_START_IN_CONTAINER}}:ro \
          {{.IMAGE}} bash {{.PG_START_IN_CONTAINER}} >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-PostgreSQL op poort {{.PORT}}"
          CONTAINER: '{{.CONTAINER}}'
          POGINGEN: '60'
          CHECK: 'docker exec {{.CONTAINER}} pg_isready -q -U postgres -h 127.0.0.1'
      - |
        cd operations-manager/python
        # DATABASE_SSLMODE=disable: de connector eist sinds RC-275 TLS, en een wegwerpserver
        # zonder certificaat weigert elke verbinding met "rejected SSL upgrade".
        POSTGRES_LIVE_DSN="postgresql://postgres:{{.PASSWORD}}@127.0.0.1:{{.PORT}}/postgres" \
        DATABASE_SSLMODE=disable \
          uv run pytest tests/integration/test_postgres_live.py \
            tests/integration/test_postgres_scenarios.py \
            tests/test_clone_all_schemas.py -m postgres_live -q
    silent: false

  test-minio:
    desc: "Draai de groep minio_live tegen de MinIO die het platform pint (IMAGE= voor een andere)"
    summary: |
      Alles wat tegen een echte MinIO meet in een commando: de connector methode voor
      methode, de MinioManager over twee deployments met een invariant na elke stap, en de
      opstartstap check_minio_availability.

      De mc komt uit de image die de OPI-image gebruikt, niet uit de PATH van de
      ontwikkelaar: mc verandert gedrag per release (zie get_bucket_versioning_status).
    cmds:
      - task: _minio-live-group
        vars:
          IMAGE:
            sh: |
              if [ -n "{{.IMAGE}}" ]; then
                echo "{{.IMAGE}}"
              else
                yq '.spec.template.spec.containers[0].image' \
                  infrastructure/bootstrap/infrastructure/minio/controller/base/deployment.yaml
              fi

  _minio-live-group:
    internal: true
    desc: "Draai de groep minio_live tegen IMAGE, met de mc van de OPI-image"
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; deze groep start een MinIO in Docker."
      - sh: command -v yq
        msg: "yq is niet geinstalleerd; de mc-versie komt met yq uit de Dockerfile."
      - sh: command -v pwgen
        msg: "pwgen is niet geinstalleerd; de sleutels van de wegwerpcontainer komen daarvandaan."
    requires:
      vars: [IMAGE]
    vars:
      CONTAINER: zad-minio-live-test
      PORT: '{{.PORT | default "59000"}}'
      ACCESS_KEY: zadlive
      SECRET_KEY:
        sh: pwgen -s 24 1
      MC_IMAGE:
        sh: |
          printf 'ghcr.io/minbzk/base-images/mc:%s\n' \
            "$(sed -n 's/^ARG MC_VERSION=//p' operations-manager/Dockerfile | head -1)"
      MC_DIR: /tmp/zad-minio-live-test
    cmds:
      - defer: |
          docker rm -f {{.CONTAINER}} zad-minio-live-test-mc >/dev/null 2>&1
          rm -rf {{.MC_DIR}}
          exit 0
      - |
        echo "Toetsen tegen {{.IMAGE}} met {{.MC_IMAGE}}"
        docker rm -f {{.CONTAINER}} zad-minio-live-test-mc >/dev/null 2>&1
        rm -rf {{.MC_DIR}}
        mkdir -p {{.MC_DIR}}/bin {{.MC_DIR}}/config
        # De mc die de OPI-image meebrengt, uit diezelfde image gehaald in plaats van
        # gedownload: zo meet deze groep de binary die in productie draait.
        docker create --name zad-minio-live-test-mc {{.MC_IMAGE}} >/dev/null
        docker cp zad-minio-live-test-mc:/usr/bin/mc {{.MC_DIR}}/bin/mc
        docker rm -f zad-minio-live-test-mc >/dev/null
        chmod +x {{.MC_DIR}}/bin/mc
      - |
        # Hetzelfde commando als de deployment, inclusief de vier schijven voor erasure
        # coding. MINIO_CI_CD staat aan omdat MinIO vier schijven op EEN filesystem anders
        # weigert; dat is hoe MinIO zijn eigen CI het ook doet.
        docker run -d --name {{.CONTAINER}} \
          -p 127.0.0.1:{{.PORT}}:9000 \
          -e MINIO_ROOT_USER={{.ACCESS_KEY}} \
          -e MINIO_ROOT_PASSWORD='{{.SECRET_KEY}}' \
          -e MINIO_CI_CD=1 \
          {{.IMAGE}} server /data/disk{1...4} --console-address :9001 >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-MinIO op http://localhost:{{.PORT}}"
          CONTAINER: '{{.CONTAINER}}'
          POGINGEN: '60'
          CHECK: 'curl -sf -o /dev/null "http://localhost:{{.PORT}}/minio/health/live"'
      - |
        cd operations-manager/python
        PATH="{{.MC_DIR}}/bin:$PATH" \
        MC_CONFIG_DIR="{{.MC_DIR}}/config" \
        MINIO_LIVE_HOST="localhost:{{.PORT}}" \
        MINIO_LIVE_ACCESS_KEY="{{.ACCESS_KEY}}" \
        MINIO_LIVE_SECRET_KEY="{{.SECRET_KEY}}" \
          uv run pytest tests/integration/test_minio_live.py -m minio_live -q
    silent: false

  test-forgejo:
    desc: "Draai de groep forgejo_live tegen de Forgejo die het platform pint (IMAGE= voor een andere)"
    summary: |
      Alles wat de git-laag tegen een echte Forgejo meet in een commando: clone met een
      token, een partial clone, commit en push, een push die Forgejo weigert, de beheerde
      kopie, en de opstartstap warm_platform_repos.

      De bestaande toetsen tegen kale repo's en git http-backend blijven: die zijn snel en
      meten onze eigen logica. Deze groep meet wat Forgejo daar anders aan doet.
    cmds:
      - task: _forgejo-live-group
        vars:
          IMAGE:
            sh: |
              if [ -n "{{.IMAGE}}" ]; then
                echo "{{.IMAGE}}"
              else
                yq '.spec.template.spec.containers[0].image' \
                  infrastructure/bootstrap/infrastructure/forgejo/controller/base/statefulset.yaml
              fi

  _forgejo-live-group:
    internal: true
    desc: "Draai de groep forgejo_live tegen IMAGE"
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; deze groep start een Forgejo in Docker."
      - sh: command -v pwgen
        msg: "pwgen is niet geinstalleerd; het wachtwoord van de wegwerpbeheerder komt daarvandaan."
      - sh: command -v git
        msg: "git is niet geinstalleerd; de connector onder toets roept git aan."
    requires:
      vars: [IMAGE]
    vars:
      CONTAINER: zad-forgejo-live-test
      PORT: '{{.PORT | default "53000"}}'
      ADMIN: zadlive
      ADMIN_PASSWORD:
        sh: pwgen -s 24 1
    cmds:
      - defer: |
          docker rm -f {{.CONTAINER}} >/dev/null 2>&1
          exit 0
      - |
        echo "Toetsen tegen {{.IMAGE}}"
        docker rm -f {{.CONTAINER}} >/dev/null 2>&1
        # sqlite3 en INSTALL_LOCK: deze Forgejo leeft een paar minuten en hoeft geen
        # database ernaast. ROOT_URL moet het adres zijn waarop de toetsen hem aanspreken,
        # want Forgejo bouwt zijn clone-URL's daarmee op.
        docker run -d --name {{.CONTAINER}} \
          -p 127.0.0.1:{{.PORT}}:3000 \
          -e FORGEJO__security__INSTALL_LOCK=true \
          -e FORGEJO__database__DB_TYPE=sqlite3 \
          -e FORGEJO__server__ROOT_URL="http://localhost:{{.PORT}}/" \
          -e FORGEJO__service__DISABLE_REGISTRATION=true \
          -e FORGEJO__repository__ENABLE_PUSH_CREATE_USER=true \
          {{.IMAGE}} >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-Forgejo op http://localhost:{{.PORT}}"
          CONTAINER: '{{.CONTAINER}}'
          POGINGEN: '60'
          CHECK: 'curl -sf -o /dev/null "http://localhost:{{.PORT}}/api/healthz"'
      - |
        # De beheerder maakt Forgejo zelf aan; de toetsen maken daarmee een token en de
        # repositories via de API, zoals OPI er ook bij komt.
        docker exec -u git {{.CONTAINER}} forgejo admin user create \
          --admin --username {{.ADMIN}} --password '{{.ADMIN_PASSWORD}}' \
          --email {{.ADMIN}}@example.invalid --must-change-password=false >/dev/null
      - |
        cd operations-manager/python
        FORGEJO_LIVE_URL="http://localhost:{{.PORT}}" \
        FORGEJO_LIVE_USER="{{.ADMIN}}" \
        FORGEJO_LIVE_PASSWORD="{{.ADMIN_PASSWORD}}" \
          uv run pytest tests/integration/test_forgejo_live.py -m forgejo_live -q
    silent: false

  test-kubernetes:
    desc: "Draai de groep kubernetes_live tegen het testcluster van task test-cluster-up"
    summary: |
      Elke methode van KubectlConnector die opi/ aanroept, tegen een echte Kubernetes-API,
      op wegwerp-namespaces met het voorvoegsel zadlive. Het terugleeskanaal is een eigen
      kubectl, los van de connector onder toets.

      Het cluster komt van task test-cluster-up. De run gaat via een eigen KUBECONFIG, dus
      je kubectl-context blijft waar hij staat.
    vars:
      TESTCLUSTER: '{{.TESTCLUSTER | default "rig-testcluster"}}'
    preconditions:
      - sh: '[ "{{.TESTCLUSTER}}" != "rig-sandbox" ] && [ "{{.TESTCLUSTER}}" != "rig-integration-test" ]'
        msg: "TESTCLUSTER={{.TESTCLUSTER}} is de naam van een ander cluster. Kies een eigen naam."
      - sh: kind get clusters 2>/dev/null | grep -qx "{{.TESTCLUSTER}}"
        msg: "Geen cluster {{.TESTCLUSTER}}; draai eerst task test-cluster-up."
    cmds:
      - |
        KUBECONFIG_FILE=$(mktemp)
        trap 'rm -f "$KUBECONFIG_FILE"' EXIT
        kind get kubeconfig --name "{{.TESTCLUSTER}}" > "$KUBECONFIG_FILE"
        cd operations-manager/python
        KUBECONFIG="$KUBECONFIG_FILE" \
        KUBERNETES_LIVE_CONTEXT="kind-{{.TESTCLUSTER}}" \
          uv run pytest tests/integration/test_kubernetes_live.py -m kubernetes_live -q
    silent: false

  test-argocd:
    desc: "Draai de groep argocd_live tegen het testcluster van task test-cluster-up"
    summary: |
      Elke methode van ArgoConnector, en de scenario's van de ArgoManager over een echte
      Application: aanmaken, synchroniseren tot Healthy, refreshen, en weghalen, met na elke
      stap de invariant dat wat ArgoCD meldt klopt met wat de Kubernetes-API laat zien.

      Het token is een API-token van het account opi, uitgegeven via dezelfde REST-API die
      OPI gebruikt; het wachtwoord van admin komt uit argocd-cluster, voor de inlogroute.
      argocd-server krijgt een port-forward: zijn Service is van de operator, dus er is geen
      vaste poort om in de kind-config te zetten.

      De manifesten staan in een repository op de Forgejo van het testcluster. De groep
      leest die met ForgejoApi uit de groep forgejo_live, en daarom zet deze taak ook
      FORGEJO_LIVE_URL en zijn broers: een tweede exemplaar van die klasse ernaast zou
      hetzelfde doen.
    vars:
      TESTCLUSTER: '{{.TESTCLUSTER | default "rig-testcluster"}}'
      ARGOCD_PORT: '{{.ARGOCD_PORT | default "38080"}}'
      FORGEJO_PORT: '{{.FORGEJO_PORT | default "38300"}}'
    preconditions:
      - sh: '[ "{{.TESTCLUSTER}}" != "rig-sandbox" ] && [ "{{.TESTCLUSTER}}" != "rig-integration-test" ]'
        msg: "TESTCLUSTER={{.TESTCLUSTER}} is de naam van een ander cluster. Kies een eigen naam."
      - sh: kind get clusters 2>/dev/null | grep -qx "{{.TESTCLUSTER}}"
        msg: "Geen cluster {{.TESTCLUSTER}}; draai eerst task test-cluster-up."
      - sh: command -v jq
        msg: "jq is niet geinstalleerd; het token van account opi komt uit het API-antwoord."
    cmds:
      - |
        KUBECONFIG_FILE=$(mktemp)
        kind get kubeconfig --name "{{.TESTCLUSTER}}" > "$KUBECONFIG_FILE"
        export KUBECONFIG="$KUBECONFIG_FILE"

        kubectl -n rig-system port-forward svc/argocd-server {{.ARGOCD_PORT}}:80 >/dev/null 2>&1 &
        PF=$!
        trap 'kill $PF 2>/dev/null; rm -f "$KUBECONFIG_FILE"' EXIT

        BASE="http://localhost:{{.ARGOCD_PORT}}"
        i=0
        until curl -sf -o /dev/null "$BASE/healthz"; do
          i=$((i + 1))
          if [ "$i" -gt 60 ]; then
            echo "argocd-server antwoordt niet op $BASE" >&2
            kubectl -n rig-system logs deployment/argocd-server --tail 60 >&2
            exit 1
          fi
          sleep 2
        done

        # jsonpath met een punt in de sleutel moet gequot: ongequot levert kubectl een lege
        # waarde op.
        ADMIN_PASSWORD=$(kubectl -n rig-system get secret argocd-cluster -o jsonpath='{.data.admin\.password}' | base64 -d)
        SESSION=$(curl -sf -X POST -H "Content-Type: application/json" \
          -d "{\"username\":\"admin\",\"password\":\"$ADMIN_PASSWORD\"}" "$BASE/api/v1/session" | jq -r .token)
        TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $SESSION" -H "Content-Type: application/json" \
          -d '{}' "$BASE/api/v1/account/opi/token" | jq -r .token)
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "Geen API-token voor account opi; staat accounts.opi: apiKey in de CR?" >&2
          exit 1
        fi

        cd operations-manager/python
        ARGOCD_LIVE_HOST=localhost \
        ARGOCD_LIVE_PORT="{{.ARGOCD_PORT}}" \
        ARGOCD_LIVE_TOKEN="$TOKEN" \
        ARGOCD_LIVE_ADMIN_PASSWORD="$ADMIN_PASSWORD" \
        KUBERNETES_LIVE_CONTEXT="kind-{{.TESTCLUSTER}}" \
        FORGEJO_LIVE_URL="http://localhost:{{.FORGEJO_PORT}}" \
        FORGEJO_LIVE_USER=rig-admin \
        FORGEJO_LIVE_PASSWORD=admin1234 \
          uv run pytest tests/integration/test_argocd_live.py tests/integration/test_argocd_scenarios.py \
            -m argocd_live -q
    silent: false

  _live-opstelling:
    internal: true
    desc: "De volledige wegwerpopstelling, en een groep ertegen (PYTEST_DOEL en MARKER)"
    summary: |
      De opstelling die startup_live en tasks_live delen: het wegwerpcluster van task
      test-cluster-up (Kubernetes, ArgoCD en Forgejo) plus een PostgreSQL, een Keycloak,
      een MinIO en een Stalwart, alle vier in de versie die het platform uitrolt. De
      Keycloak start via _keycloak-container, dezelfde opstart als de groep keycloak_live.

      Een gedeelde taak en geen tweede kopie: de twee groepen meten tegen EEN opstelling,
      en twee lijsten met adressen zouden betekenen dat ze uit elkaar lopen zodra er een
      instelling bij komt. De aanroeper zegt welke toetsen eroverheen gaan (PYTEST_DOEL en
      MARKER) en of kopia erbij hoort (KOPIA).

      De relay krijgt de configmap van productie, met een enkele regel omgezet: de
      wegwerp-PostgreSQL draagt geen certificaat, dus de store doet geen TLS. Er gaat geen
      post de deur uit; wat gemeten wordt zijn de accounts die een groep aanmaakt.
    requires:
      vars: [PYTEST_DOEL, MARKER]
    vars:
      TESTCLUSTER: '{{.TESTCLUSTER | default "rig-testcluster"}}'
      NAME: zad-startup-live-test
      # De connector accepteert alleen poort 5432 (_ALLOWED_PG_PORTS), dus de
      # wegwerpserver staat daar, net als bij task test-postgres.
      PG_PORT: '5432'
      MAIL_PORT: '{{.MAIL_PORT | default "58090"}}'
      MINIO_PORT: '{{.MINIO_PORT | default "59100"}}'
      KEYCLOAK_PORT: '{{.KEYCLOAK_PORT | default "58181"}}'
      RELAY_SINK_PORT: '{{.RELAY_SINK_PORT | default "58182"}}'
      LOKAAS_SINK_PORT: '{{.LOKAAS_SINK_PORT | default "58183"}}'
      ARGOCD_PORT: '{{.ARGOCD_PORT | default "38081"}}'
      FORGEJO_PORT: '{{.FORGEJO_PORT | default "38300"}}'
      # Elke image uit zijn pin; een opstelling die een versie zelf noemt, drijft af.
      PG_IMAGE:
        sh: yq '.spec.imageName' infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml
      MINIO_IMAGE:
        sh: yq '.spec.template.spec.containers[0].image' infrastructure/bootstrap/infrastructure/minio/controller/base/deployment.yaml
      MAIL_IMAGE:
        sh: yq '.spec.template.spec.containers[0].image' infrastructure/bootstrap/infrastructure/mail/controller/base/deployment.yaml
      KEYCLOAK_IMAGE:
        sh: yq '.spec.template.spec.containers[0].image' infrastructure/bootstrap/infrastructure/keycloak/controller/base/deployment.yaml
      MC_IMAGE:
        sh: |
          printf 'ghcr.io/minbzk/base-images/mc:%s\n' \
            "$(sed -n 's/^ARG MC_VERSION=//p' operations-manager/Dockerfile | head -1)"
      # Uit dezelfde pin als de OPI-image: de backup-taken draaien de kopia die in
      # productie draait, en een opstelling die zelf een versie noemt drijft af.
      KOPIA_VERSION:
        sh: sed -n 's/^ARG KOPIA_VERSION=//p' operations-manager/Dockerfile | head -1
      MAIL_CONFIG: infrastructure/bootstrap/infrastructure/mail/controller/base/config.toml
      INIT_SQL:
        sh: |
          yq '.spec.bootstrap.initdb.postInitApplicationSQL | join(" ")' \
            infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml
      MINIO_ACCESS_KEY: zadstart
      ADMIN_PASSWORD:
        sh: pwgen -s 24 1
      DB_PASSWORD:
        sh: pwgen -s 24 1
      KC_DB_PASSWORD:
        sh: pwgen -s 24 1
      METRICS_TOKEN:
        sh: pwgen -s 32 1
      MAIL_ADMIN_PASSWORD:
        sh: pwgen -s 24 1
      MINIO_SECRET_KEY:
        sh: pwgen -s 24 1
      MC_DIR: /tmp/zad-startup-live-test
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; deze groep start de hele opstelling in Docker."
      - sh: command -v pwgen
        msg: "pwgen is niet geinstalleerd; de wachtwoorden van de wegwerpcontainers komen daarvandaan."
      - sh: command -v yq
        msg: "yq is niet geinstalleerd; de images en de init-SQL komen met yq uit de manifesten."
      - sh: command -v jq
        msg: "jq is niet geinstalleerd; het token van account opi komt uit het API-antwoord."
      # Dezelfde grendel als in test-cluster-up: TESTCLUSTER=rig-sandbox zou deze groep op
      # het cluster van iemand anders laten meten, en hij maakt en verwijdert namespaces.
      - sh: '[ "{{.TESTCLUSTER}}" != "rig-sandbox" ] && [ "{{.TESTCLUSTER}}" != "rig-integration-test" ]'
        msg: "TESTCLUSTER={{.TESTCLUSTER}} is de naam van een ander cluster. Kies een eigen naam."
      - sh: kind get clusters 2>/dev/null | grep -qx "{{.TESTCLUSTER}}"
        msg: "Geen cluster {{.TESTCLUSTER}}; draai eerst task test-cluster-up."
    cmds:
      - defer: |
          docker rm -f {{.NAME}}-db {{.NAME}}-mail {{.NAME}}-minio {{.NAME}}-mc >/dev/null 2>&1
          docker rm -f {{.NAME}}-kc {{.NAME}}-kc-db {{.NAME}}-kc-relay-sink {{.NAME}}-kc-lokaas-sink >/dev/null 2>&1
          docker network rm {{.NAME}} {{.NAME}}-kc >/dev/null 2>&1
          rm -rf {{.MC_DIR}}
          exit 0
      - |
        echo "Opstelling: PostgreSQL {{.PG_IMAGE}}, Keycloak {{.KEYCLOAK_IMAGE}}, MinIO {{.MINIO_IMAGE}}, relay {{.MAIL_IMAGE}}"
        docker rm -f {{.NAME}}-db {{.NAME}}-mail {{.NAME}}-minio >/dev/null 2>&1
        docker network create {{.NAME}} >/dev/null 2>&1
        docker run -d --name {{.NAME}}-db --network {{.NAME}} \
          -p 127.0.0.1:{{.PG_PORT}}:5432 \
          -e POSTGRES_PASSWORD='{{.DB_PASSWORD}}' \
          -e POSTGRES_INIT_SQL='{{.INIT_SQL}}' \
          -v {{.ROOT_DIR}}/scripts/postgres-standalone-start.sh:{{.PG_START_IN_CONTAINER}}:ro \
          {{.PG_IMAGE}} bash {{.PG_START_IN_CONTAINER}} >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-PostgreSQL op poort {{.PG_PORT}}"
          CONTAINER: '{{.NAME}}-db'
          POGINGEN: '60'
          CHECK: 'docker exec {{.NAME}}-db pg_isready -q -U postgres -h 127.0.0.1'
      - |
        # De relay heeft zijn database nodig om te starten, dus die twee staan er voordat
        # hij start. De andere platformdatabases maakt de groep zelf aan.
        # -i, anders krijgt psql geen stdin en dus geen SQL.
        docker exec -i -e PGPASSWORD='{{.DB_PASSWORD}}' {{.NAME}}-db \
          psql --quiet --no-psqlrc -U postgres -h 127.0.0.1 -v pw="{{.DB_PASSWORD}}" <<'SQL'
        CREATE ROLE mailrelay LOGIN PASSWORD :'pw';
        CREATE DATABASE mailrelay OWNER mailrelay;
        SQL
      - |
        # De productie-config omgezet: TLS uit omdat de wegwerpserver geen certificaat draagt.
        RENDER=$(mktemp -d)
        if [ "$(grep -c '^tls\.enable = true$' {{.MAIL_CONFIG}})" != "1" ]; then
          echo "{{.MAIL_CONFIG}} heeft niet precies een 'tls.enable = true'; pas deze taak aan." >&2
          exit 1
        fi
        sed 's/^tls\.enable = true$/tls.enable = false/' {{.MAIL_CONFIG}} > "$RENDER/config.toml"
        docker run -d --name {{.NAME}}-mail --network {{.NAME}} \
          -p 127.0.0.1:{{.MAIL_PORT}}:8080 \
          -e MAIL_RELAY_HOSTNAME=rig-mail-relay \
          -e MAIL_DOMAIN=rijksoverheid.nl \
          -e MAIL_FROM_LOCAL=noreply-rijksapp \
          -e MAIL_UPSTREAM_HOST=127.0.0.1 \
          -e MAIL_UPSTREAM_ALLOW_INVALID_CERTS=true \
          -e MAIL_RELAY_ADMIN_USERNAME=admin \
          -e MAIL_RELAY_ADMIN_PASSWORD='{{.MAIL_ADMIN_PASSWORD}}' \
          -e MAIL_DB_HOST={{.NAME}}-db \
          -e MAIL_DB_NAME=mailrelay \
          -e MAIL_DB_USER=mailrelay \
          -e MAIL_DB_PASSWORD='{{.DB_PASSWORD}}' \
          -v "$RENDER/config.toml":/etc/mail/config.toml:ro \
          --entrypoint /usr/local/bin/stalwart-mail \
          {{.MAIL_IMAGE}} --config /etc/mail/config.toml >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-mailrelay op http://localhost:{{.MAIL_PORT}}"
          CONTAINER: '{{.NAME}}-mail'
          POGINGEN: '90'
          CHECK: 'curl -sf -o /dev/null "http://localhost:{{.MAIL_PORT}}/healthz/ready"'
      - |
        # Hetzelfde commando als de deployment, inclusief de vier schijven voor erasure
        # coding; MINIO_CI_CD omdat MinIO vier schijven op EEN filesystem anders weigert.
        docker run -d --name {{.NAME}}-minio --network {{.NAME}} \
          -p 127.0.0.1:{{.MINIO_PORT}}:9000 \
          -e MINIO_ROOT_USER={{.MINIO_ACCESS_KEY}} \
          -e MINIO_ROOT_PASSWORD='{{.MINIO_SECRET_KEY}}' \
          -e MINIO_CI_CD=1 \
          {{.MINIO_IMAGE}} server /data/disk{1...4} --console-address :9001 >/dev/null
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-MinIO op http://localhost:{{.MINIO_PORT}}"
          CONTAINER: '{{.NAME}}-minio'
          POGINGEN: '60'
          CHECK: 'curl -sf -o /dev/null "http://localhost:{{.MINIO_PORT}}/minio/health/live"'
      - |
        # De mc die de OPI-image meebrengt, uit diezelfde image gehaald: de opstartstap
        # check_minio_availability meet de binary die in productie draait. OPI draait hier
        # in het proces van de toets, op de host, en die Linux-binary draait alleen op een
        # Linux-host (CI). Op een andere host geldt de mc uit de eigen pin van het repo
        # (.tool-versions): MinIO levert geen losse mc-downloads meer.
        rm -rf {{.MC_DIR}}
        mkdir -p {{.MC_DIR}}/bin {{.MC_DIR}}/config
        if [ "$(uname -s)" = "Linux" ]; then
          docker rm -f {{.NAME}}-mc >/dev/null 2>&1
          docker create --name {{.NAME}}-mc {{.MC_IMAGE}} >/dev/null
          docker cp {{.NAME}}-mc:/usr/bin/mc {{.MC_DIR}}/bin/mc
          docker rm -f {{.NAME}}-mc >/dev/null
          chmod +x {{.MC_DIR}}/bin/mc
        else
          command -v mc >/dev/null || { echo "mc ontbreekt: installeer hem uit .tool-versions (asdf install)" >&2; exit 1; }
          mc --version | head -1
        fi
      - |
        # Kopia alleen voor een groep die backup en restore meet; de andere heeft hem niet
        # nodig en hoeft er dus ook niet op te wachten.
        if [ "{{.KOPIA}}" = "ja" ]; then
          ARCH=x64
          [ "$(uname -m)" = "aarch64" ] && ARCH=arm64
          [ "$(uname -m)" = "arm64" ] && ARCH=arm64
          # De build voor de host, want OPI draait hier op de host; zelfde versie als de image.
          OS=linux
          [ "$(uname -s)" = "Darwin" ] && OS=macOS
          NAAM="kopia-{{.KOPIA_VERSION}}-$OS-$ARCH"
          curl -fsSL -o "{{.MC_DIR}}/$NAAM.tar.gz" \
            "https://github.com/kopia/kopia/releases/download/v{{.KOPIA_VERSION}}/$NAAM.tar.gz"
          tar -xzf "{{.MC_DIR}}/$NAAM.tar.gz" -C "{{.MC_DIR}}" "$NAAM/kopia"
          mv "{{.MC_DIR}}/$NAAM/kopia" {{.MC_DIR}}/bin/kopia
          chmod +x {{.MC_DIR}}/bin/kopia
          {{.MC_DIR}}/bin/kopia --version
        fi
      - task: _keycloak-container
        vars:
          NAME: '{{.NAME}}-kc'
          IMAGE: '{{.KEYCLOAK_IMAGE}}'
          PORT: '{{.KEYCLOAK_PORT}}'
          RELAY_SINK_PORT: '{{.RELAY_SINK_PORT}}'
          LOKAAS_SINK_PORT: '{{.LOKAAS_SINK_PORT}}'
          ADMIN_PASSWORD: '{{.ADMIN_PASSWORD}}'
          DB_PASSWORD: '{{.KC_DB_PASSWORD}}'
          METRICS_TOKEN: '{{.METRICS_TOKEN}}'
      - |
        KUBECONFIG_FILE=$(mktemp)
        kind get kubeconfig --name "{{.TESTCLUSTER}}" > "$KUBECONFIG_FILE"
        export KUBECONFIG="$KUBECONFIG_FILE"

        kubectl -n rig-system port-forward svc/argocd-server {{.ARGOCD_PORT}}:80 >/dev/null 2>&1 &
        PF=$!
        trap 'kill $PF 2>/dev/null; rm -f "$KUBECONFIG_FILE"' EXIT

        BASE="http://localhost:{{.ARGOCD_PORT}}"
        i=0
        until curl -sf -o /dev/null "$BASE/healthz"; do
          i=$((i + 1))
          if [ "$i" -gt 60 ]; then
            echo "argocd-server antwoordt niet op $BASE" >&2
            kubectl -n rig-system logs deployment/argocd-server --tail 60 >&2
            exit 1
          fi
          sleep 2
        done

        # jsonpath met een punt in de sleutel moet gequot: ongequot levert kubectl een lege
        # waarde op.
        ARGOCD_ADMIN=$(kubectl -n rig-system get secret argocd-cluster -o jsonpath='{.data.admin\.password}' | base64 -d)
        SESSION=$(curl -sf -X POST -H "Content-Type: application/json" \
          -d "{\"username\":\"admin\",\"password\":\"$ARGOCD_ADMIN\"}" "$BASE/api/v1/session" | jq -r .token)
        TOKEN=$(curl -sf -X POST -H "Authorization: Bearer $SESSION" -H "Content-Type: application/json" \
          -d '{}' "$BASE/api/v1/account/opi/token" | jq -r .token)
        if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
          echo "Geen API-token voor account opi; staat accounts.opi: apiKey in de CR?" >&2
          exit 1
        fi

        cd operations-manager/python
        # De vereist-variabelen van de groepen waarvan deze groep de helpers leest, volgen
        # STARTUP_LIVE_REQUIRED: in CI moet een ontbrekend adres daar ook een FOUT zijn en
        # geen skip, anders is de job groen zonder meting.
        # Een van de twee is genoeg: de aanroeper zet de vereist-variabele van ZIJN groep,
        # en alle groepen waarvan hij de helpers leest volgen die.
        VEREIST="${STARTUP_LIVE_REQUIRED:-}${TASKS_LIVE_REQUIRED:-}"
        # DATABASE_SSLMODE=disable: de connector eist sinds RC-275 TLS, en een
        # wegwerpserver zonder certificaat weigert elke verbinding.
        PATH="{{.MC_DIR}}/bin:$PATH" \
        MC_CONFIG_DIR="{{.MC_DIR}}/config" \
        STARTUP_LIVE_REQUIRED="$VEREIST" \
        TASKS_LIVE_REQUIRED="$VEREIST" \
        KEYCLOAK_LIVE_REQUIRED="$VEREIST" \
        POSTGRES_LIVE_REQUIRED="$VEREIST" \
        MINIO_LIVE_REQUIRED="$VEREIST" \
        FORGEJO_LIVE_REQUIRED="$VEREIST" \
        KUBERNETES_LIVE_REQUIRED="$VEREIST" \
        ARGOCD_LIVE_REQUIRED="$VEREIST" \
        STARTUP_LIVE_MAIL_URL="http://localhost:{{.MAIL_PORT}}" \
        STARTUP_LIVE_MAIL_ADMIN=admin \
        STARTUP_LIVE_MAIL_ADMIN_PASSWORD='{{.MAIL_ADMIN_PASSWORD}}' \
        POSTGRES_LIVE_DSN="postgresql://postgres:{{.DB_PASSWORD}}@127.0.0.1:{{.PG_PORT}}/postgres" \
        DATABASE_SSLMODE=disable \
        KEYCLOAK_IMAGE_TEST_URL="http://localhost:{{.KEYCLOAK_PORT}}" \
        KEYCLOAK_IMAGE_TEST_ADMIN=admin \
        KEYCLOAK_IMAGE_TEST_ADMIN_PASSWORD='{{.ADMIN_PASSWORD}}' \
        MINIO_LIVE_HOST="localhost:{{.MINIO_PORT}}" \
        MINIO_LIVE_ACCESS_KEY="{{.MINIO_ACCESS_KEY}}" \
        MINIO_LIVE_SECRET_KEY="{{.MINIO_SECRET_KEY}}" \
        FORGEJO_LIVE_URL="http://localhost:{{.FORGEJO_PORT}}" \
        FORGEJO_LIVE_USER=rig-admin \
        FORGEJO_LIVE_PASSWORD=admin1234 \
        KUBERNETES_LIVE_CONTEXT="kind-{{.TESTCLUSTER}}" \
        ARGOCD_LIVE_HOST=localhost \
        ARGOCD_LIVE_PORT="{{.ARGOCD_PORT}}" \
        ARGOCD_LIVE_TOKEN="$TOKEN" \
        ARGOCD_LIVE_ADMIN_PASSWORD="$ARGOCD_ADMIN" \
          uv run pytest {{.PYTEST_DOEL}} -m {{.MARKER}} -q
    silent: false

  test-startup:
    desc: "Draai de groep startup_live: het hele opstarten van OPI tegen echte afhankelijkheden"
    summary: |
      Het opstarten van OPI van begin tot eind, in drie rondes (leeg cluster, direct nog
      een keer, en na een herstart) plus het geval dat een afhankelijkheid bij de start
      onbereikbaar is. OPI draait in het proces van de toets met de echte lifespan; na elke
      ronde leest een invariant de hele toestand terug uit de afhankelijkheden zelf.

      De opstelling komt uit _live-opstelling en staat daar beschreven.
    cmds:
      - task: _live-opstelling
        vars:
          PYTEST_DOEL: tests/integration/test_startup_live.py
          MARKER: startup_live

  test-taken:
    desc: "Draai de groep tasks_live: elk TaskType van begin tot eind tegen echte afhankelijkheden"
    summary: |
      Elke taak van ZAD, taak voor taak, op EEN project: aanmaken, een component, twee
      deployments, de diensten, de configuratie, de bijlagen, de klonen, slapen en wekken,
      een backup en een restore, de rotaties, en alles weer weg. De taak wordt aangemaakt
      zoals het portaal of de zad-cli dat doet, de echte TaskWorker voert hem uit, en na
      elke taak leest een invariant de toestand terug uit de afhankelijkheid zelf.

      Dezelfde opstelling als task test-startup (zie _live-opstelling), met kopia uit de
      pin van de OPI-image erbij: de backup- en restore-scenario's draaien de kopia die in
      productie draait.

      Deze groep is de zwaarste van allemaal: hij wacht op echte ArgoCD-syncs.
    cmds:
      - task: _live-opstelling
        vars:
          PYTEST_DOEL: tests/integration/test_tasks_live.py
          MARKER: tasks_live
          KOPIA: ja


  test-live-groepen:
    desc: "Draai alle live groepen: Keycloak, PostgreSQL, MinIO, Forgejo, Kubernetes, ArgoCD, het opstarten en de taken"
    summary: |
      Wat je lokaal draait voor een merge die een connector of een gepinde versie raakt.
      In CI draait elke groep als eigen job, op de paden van die groep. Elke groep ruimt
      zijn eigen containers op.

      kubernetes_live, argocd_live, startup_live en tasks_live meten op het wegwerpcluster
      van task test-cluster-up; zet dat eerst op, en ruim het daarna op met task
      test-cluster-down.
    cmds:
      - task: test-keycloak
      - task: test-postgres
      - task: test-minio
      - task: test-forgejo
      - task: test-kubernetes
      - task: test-argocd
      - task: test-startup
      - task: test-taken

  test-keycloak:
    desc: "Draai de groep keycloak_live tegen de image die productie draait (IMAGE= voor een andere)"
    summary: |
      Alles wat tegen een echte Keycloak meet in een commando. Standaard tegen de image die
      in de basisdeployment gepind staat, dus wat productie draait, zonder bouw. Met
      `IMAGE=zad/keycloak-zad:toets` tegen een andere tag.

      Draai dit bij elke wijziging in de connector, de manager, de yaml-handler, de
      blauwdrukken of de Keycloak-versie: de standaardrun slaat deze toetsen over en meet
      alleen de statische dekkingstoets. Zie features/keycloak-eigen-image.md.
    cmds:
      - task: _keycloak-live-group
        vars:
          IMAGE:
            sh: |
              if [ -n "{{.IMAGE}}" ]; then
                echo "{{.IMAGE}}"
              else
                yq '.spec.template.spec.containers[0].image' \
                  infrastructure/bootstrap/infrastructure/keycloak/controller/base/deployment.yaml
              fi

  test-keycloak-image:
    desc: "Bouw images/keycloak-zad/Dockerfile en draai de groep keycloak_live ertegen"
    summary: |
      Dezelfde groep als `task test-keycloak`, maar tegen een image die hier wordt gebouwd.
      De opstartroute is er maar een: deze taak bouwt en roept dan _keycloak-live-group aan.
    deps: [requirements-check]
    vars:
      IMAGE: zad/keycloak-zad:toets
    cmds:
      - |
        echo "Bouwen van {{.IMAGE}} uit images/keycloak-zad/Dockerfile..."
        docker build -f images/keycloak-zad/Dockerfile -t {{.IMAGE}} .
      - task: _keycloak-live-group
        vars:
          IMAGE: '{{.IMAGE}}'

  _keycloak-live-group:
    internal: true
    desc: "Draai de groep keycloak_live tegen IMAGE, zoals de deployment hem start"
    summary: |
      Start IMAGE tegen een wegwerp-PostgreSQL met de startargumenten van de
      basisdeployment en draait daar de hele groep keycloak_live tegen: de providers, het
      thema, de post, de admin-API en de scenario's over meerdere deployments.

      De startargumenten komen uit de basisdeployment en worden hier niet overgeschreven,
      zodat deze toets niet stil kan afwijken van wat productie start. Een pod die opkomt
      bewijst niets: met --optimized start Keycloak ook op een non-existent provider. Na
      26.2 kunnen endpoints geladen zijn en toch 404 geven, dus de twee endpoints worden
      ook getoetst. Twee SMTP-sinks op hetzelfde netwerk tonen dat de post door onze
      mailprovider gaat en niet naar de smtpServer van de realm. Zie
      features/keycloak-eigen-image.md en features/keycloak-mail.md.
    # Niet requirements-check: die eist het hele sandboxgereedschap (kind, kustomize, sops,
    # age, gpg, rsync, jq, numfmt) en deze groep heeft er drie nodig. Met alleen deze drie
    # draait hij ook in CI.
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; deze groep start een Keycloak en een PostgreSQL in Docker."
      - sh: command -v yq
        msg: "yq is niet geinstalleerd; de startargumenten komen met yq uit de basisdeployment."
      - sh: command -v pwgen
        msg: "pwgen is niet geinstalleerd; de wachtwoorden van de wegwerpcontainers komen daarvandaan."
    requires:
      vars: [IMAGE]
    vars:
      NAME: zad-keycloak-image-test
      PORT: '{{.PORT | default "58081"}}'
      RELAY_SINK_PORT: '{{.RELAY_SINK_PORT | default "58082"}}'
      LOKAAS_SINK_PORT: '{{.LOKAAS_SINK_PORT | default "58083"}}'
      # Per run verzonnen: deze containers bestaan alleen binnen deze taak, en zo staat er
      # geen wachtwoordvorm in de repo.
      ADMIN_PASSWORD:
        sh: pwgen -s 24 1
      DB_PASSWORD:
        sh: pwgen -s 24 1
      METRICS_TOKEN:
        sh: pwgen -s 32 1
    cmds:
      - defer: |
          docker rm -f {{.NAME}} {{.NAME}}-db {{.NAME}}-relay-sink {{.NAME}}-lokaas-sink >/dev/null 2>&1
          docker network rm {{.NAME}} >/dev/null 2>&1
          exit 0
      - |
        echo "Toetsen tegen {{.IMAGE}}"
      - task: _keycloak-container
        vars:
          NAME: '{{.NAME}}'
          IMAGE: '{{.IMAGE}}'
          PORT: '{{.PORT}}'
          RELAY_SINK_PORT: '{{.RELAY_SINK_PORT}}'
          LOKAAS_SINK_PORT: '{{.LOKAAS_SINK_PORT}}'
          ADMIN_PASSWORD: '{{.ADMIN_PASSWORD}}'
          DB_PASSWORD: '{{.DB_PASSWORD}}'
          METRICS_TOKEN: '{{.METRICS_TOKEN}}'
      - |
        cd operations-manager/python
        KEYCLOAK_IMAGE_TEST_URL="http://localhost:{{.PORT}}" \
        KEYCLOAK_IMAGE_TEST_ADMIN=admin \
        KEYCLOAK_IMAGE_TEST_ADMIN_PASSWORD='{{.ADMIN_PASSWORD}}' \
        KEYCLOAK_IMAGE_TEST_METRICS_TOKEN='{{.METRICS_TOKEN}}' \
        KEYCLOAK_IMAGE_TEST_RELAY_SINK_URL="http://localhost:{{.RELAY_SINK_PORT}}" \
        KEYCLOAK_IMAGE_TEST_LOKAAS_SINK_URL="http://localhost:{{.LOKAAS_SINK_PORT}}" \
        KEYCLOAK_IMAGE_TEST_LOKAAS_SINK_SMTP="{{.NAME}}-lokaas-sink:1025" \
          uv run pytest tests/integration/test_keycloak_image_providers.py \
            tests/integration/test_keycloak_image_thema.py \
            tests/integration/test_keycloak_image_mail.py \
            tests/integration/test_keycloak_admin_api.py \
            tests/integration/test_keycloak_scenarios.py -m keycloak_live -q
    silent: false

  _keycloak-container:
    internal: true
    desc: "Start IMAGE als Keycloak met de startargumenten van de basisdeployment"
    summary: |
      De opstart van de Keycloak-opstelling, los van de groep die eraan meet: de
      wegwerp-PostgreSQL, de twee SMTP-sinks en Keycloak zelf met de args uit de
      basisdeployment. De groepen keycloak_live en startup_live gebruiken hem beide, want
      een tweede opstart ernaast zou stil kunnen afwijken van wat productie start.

      De opruiming hoort bij de AANROEPER: een defer in deze taak zou de containers al
      weghalen voordat de toetsen draaien.
    requires:
      vars: [NAME, IMAGE, PORT, RELAY_SINK_PORT, LOKAAS_SINK_PORT, ADMIN_PASSWORD, DB_PASSWORD, METRICS_TOKEN]
    vars:
      # Uit de pin en niet met de hand: een opstelling die een versie zelf noemt, noemt hem
      # vroeg of laat anders dan wat er uitgerold is (zie tests/test_test_images_follow_pins.py).
      SINK_IMAGE:
        sh: yq '.spec.template.spec.containers[0].image' infrastructure/bootstrap/infrastructure/mail/sink/base/deployment.yaml
      DB_IMAGE:
        sh: yq '.spec.imageName' infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml
      DEPLOYMENT: infrastructure/bootstrap/infrastructure/keycloak/controller/base/deployment.yaml
    cmds:
      - |
        docker rm -f {{.NAME}} {{.NAME}}-db {{.NAME}}-relay-sink {{.NAME}}-lokaas-sink >/dev/null 2>&1
        docker network create {{.NAME}} >/dev/null 2>&1
        docker run -d --name {{.NAME}}-db --network {{.NAME}} \
          -e POSTGRES_DB=keycloak \
          -e POSTGRES_USER=keycloak \
          -e POSTGRES_PASSWORD='{{.DB_PASSWORD}}' \
          -v {{.ROOT_DIR}}/scripts/postgres-standalone-start.sh:{{.PG_START_IN_CONTAINER}}:ro \
          {{.DB_IMAGE}} bash {{.PG_START_IN_CONTAINER}} >/dev/null
      # Over TCP en niet over de socket: de opstart draait initdb eerst op een tijdelijke
      # server die alleen op de socket luistert, en in dat gat valt de eerste query.
      - task: _wacht-op
        vars:
          WAT: "De wegwerp-PostgreSQL"
          CONTAINER: '{{.NAME}}-db'
          POGINGEN: '30'
          CHECK: 'docker exec {{.NAME}}-db pg_isready -q -U keycloak -d keycloak -h 127.0.0.1'
      - |
        # Onze provider zet AUTH aan; mailpit weigert AUTH zonder INSECURE.
        for sink in {{.NAME}}-relay-sink:{{.RELAY_SINK_PORT}} {{.NAME}}-lokaas-sink:{{.LOKAAS_SINK_PORT}}; do
          docker run -d --name "${sink%%:*}" --network {{.NAME}} \
            -p "${sink##*:}:8025" \
            -e MP_SMTP_AUTH_ACCEPT_ANY=1 \
            -e MP_SMTP_AUTH_ALLOW_INSECURE=1 \
            {{.SINK_IMAGE}} >/dev/null
        done
        for poort in {{.RELAY_SINK_PORT}} {{.LOKAAS_SINK_PORT}}; do
          i=0
          until curl -sf -o /dev/null "http://localhost:$poort/api/v1/info"; do
            i=$((i + 1))
            if [ "$i" -gt 30 ]; then
              echo "Een SMTP-sink kwam niet op binnen 60 seconden op poort $poort" >&2
              exit 1
            fi
            sleep 2
          done
        done
      - |
        # Woordsplitsing met opzet: de args komen een per regel uit het manifest. Een
        # argument met witruimte zou hier stil in twee stukken vallen, dus dat weigert hij.
        ARGS=""
        while IFS= read -r arg; do
          [ -n "$arg" ] || continue
          case "$arg" in
            *" "*|*"	"*)
              echo "Een startargument in {{.DEPLOYMENT}} bevat witruimte: $arg" >&2
              exit 1
              ;;
          esac
          ARGS="$ARGS $arg"
        done <<ARGSEOF
        $(yq '.spec.template.spec.containers[0].args[]' {{.DEPLOYMENT}})
        ARGSEOF
        # Zonder deze grendel zou een mislukte yq een lege ARGS opleveren, en dan start
        # Keycloak zonder --optimized en zonder de spi-vlaggen: een toets die niets meet.
        case "$ARGS" in
          *" start "*) ;;
          *) echo "Geen startargumenten gelezen uit {{.DEPLOYMENT}}" >&2; exit 1 ;;
        esac
        echo "Starten met de argumenten van de deployment:$ARGS"
        docker run -d --name {{.NAME}} --network {{.NAME}} \
          -p {{.PORT}}:8080 \
          -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
          -e KC_BOOTSTRAP_ADMIN_PASSWORD='{{.ADMIN_PASSWORD}}' \
          -e KC_DB_URL="jdbc:postgresql://{{.NAME}}-db:5432/keycloak" \
          -e KC_DB_USERNAME=keycloak \
          -e KC_DB_PASSWORD='{{.DB_PASSWORD}}' \
          -e KC_HTTP_ENABLED=true \
          -e KC_HOSTNAME_STRICT=false \
          -e RIG_METRICS_TOKEN='{{.METRICS_TOKEN}}' \
          -e ZAD_MAIL_RELAY_HOST={{.NAME}}-relay-sink \
          -e ZAD_MAIL_RELAY_PORT=1025 \
          -e ZAD_MAIL_RELAY_USERNAME=zad-keycloak \
          -e ZAD_MAIL_RELAY_FROM=noreply-rijksapp@rijksoverheid.nl \
          -e ZAD_MAIL_RELAY_PASSWORD='{{.DB_PASSWORD}}' \
          -e ZAD_MAIL_RELAY_STARTTLS=false \
          {{.IMAGE}} $ARGS >/dev/null
      - task: _wacht-op
        vars:
          WAT: "Keycloak op http://localhost:{{.PORT}}"
          CONTAINER: '{{.NAME}}'
          CHECK: 'curl -sf -o /dev/null "http://localhost:{{.PORT}}/realms/master"'

  build-keycloak-relay-email-sender:
    desc: "Bouw de relay-emailSender-jar"
    cmds:
      - |
        echo "🔨 Bouwen van de relay-emailSender..."
        cd images/keycloak-zad/extensions/relay-email-sender
        mvn clean package
        echo "✅ JAR gebouwd: $(ls target/keycloak-relay-email-sender-*.jar)"
    silent: false

  publish-keycloak-image:
    desc: "Bouw de Keycloak-image, push hem naar GHCR (CalVer + latest) en pin de sandbox-overlay"
    summary: |
      Vraagt een inlog: `docker login ghcr.io` met een token dat write:packages heeft.

      Dezelfde vorm als publish-operations-manager, met een verschil dat er met opzet is: het
      pinnen gaat naar de SANDBOX-overlay. De basis en de odcn-overlay blijven staan, dus dit
      is geen uitrol naar ODCN. Rol uit met `task sandbox:sync`, toets het op de sandbox, en
      breng die tag daarna met `task pin-keycloak-image TARGET=base` naar de basis.

      Er is geen controle of er wel iets te bouwen valt. "Geen release zonder aanleiding" is
      hier net als bij de operations-manager een beslissing van de mens.
    # sandbox:build-builder en niet een eigen buildernaam zoals publish-operations-manager
    # die heeft: die builder draagt de geheugengrens van de gedeelde server EN het
    # host-netwerk dat deze bouw nodig heeft. Zonder host-netwerk komt de builder niet bij de
    # DNS van de server en strandt de eerste regel van de Dockerfile al op "no route to host"
    # (gemeten, hier en bij sandbox:build-operations-manager-image).
    deps: [requirements-check, sandbox:build-builder]
    vars:
      IMAGE_VERSION:
        sh: scripts/calver-tag.sh images/keycloak-zad/extensions/relay-email-sender images/keycloak-zad/extensions/custom-mapper images/keycloak-zad
    preconditions:
      # Een inlog met een credential-helper laat een LEGE auths-regel achter, dus de sleutel
      # is het signaal en niet de inhoud. Hier en niet na de bouw: de validatiebouw staat uit,
      # dus een vergeten inlog zou pas na de volledige Maven- en kc.sh-ronde stranden.
      - sh: 'grep -q ''"ghcr\.io"'' "${DOCKER_CONFIG:-$HOME/.docker}/config.json"'
        msg: |
          Geen inlog bij ghcr.io gevonden. Draai eerst:
            docker login ghcr.io   (token met write:packages)
    cmds:
      - |
        echo "Image version: {{.IMAGE_VERSION}}"
        case "{{.IMAGE_VERSION}}" in
          *-dirty)
            echo "LET OP: de werkboom heeft ongecommitte wijzigingen, dus de commit in deze tag"
            echo "        beschrijft niet wat je publiceert. Commit eerst voor een tag die terug"
            echo "        te zoeken is."
            ;;
        esac
      # Voor de push: er gaat geen image naar ghcr die deze toets niet haalt.
      - task: test-keycloak-image
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: .
          DOCKERFILE_PATH: images/keycloak-zad/Dockerfile
          IMAGE_NAME: keycloak-zad
          REGISTRY_IMAGE: ghcr.io/rijksictgilde/zad
          IMAGE_TAG: '{{.IMAGE_VERSION}}'
          EXTRA_TAG: latest
          BUILDER_NAME: '{{.SANDBOX_BUILDER_NAME}}'
          # Dezelfde platforms als de job in docker-images.yml: wat hier ontstaat is wat na
          # een promotie op ODCN draait.
          PLATFORMS: linux/amd64,linux/arm64
          # De validatiebouw zou de hele Maven- en kc.sh-ronde een tweede keer draaien, met
          # --load en dus voor een architectuur. De multi-arch bouw eronder is de bouw.
          SKIP_VALIDATION: "true"
      - task: pin-keycloak-image
        vars:
          IMAGE_TAG: '{{.IMAGE_VERSION}}'

  pin-keycloak-image:
    desc: "Zet een gepushte keycloak-zad-tag in de sandbox-overlay (TARGET=staging of base: verder)"
    summary: |
      publish-keycloak-image roept dit aan met de tag die hij net gepusht heeft. Los aanroepen
      kan ook, bijvoorbeeld om een tag van CI op de sandbox te zetten.

      TARGET=sandbox (de standaard) pint de sandboxed-local overlay. De basis en de
      odcn-overlay blijven staan, dus dit is geen uitrol naar ODCN. Rol uit met
      `task sandbox:sync` en toets het daar.

      TARGET=base is de promotie: dezelfde handeling, maar op de basis, waar ODCN zijn tag uit
      erft. Promoveren is het VERPLAATSEN van precies de tag die op de sandbox heeft gedraaid,
      dus daar hoort geen eigen IMAGE_TAG bij: die komt uit de sandbox-overlay. Geef je er
      toch een mee, dan moet het die tag zijn. Deze taak bouwt en pusht nooit: een herbouw
      levert een ander artefact op, en dan is het bewijs van de sandbox niets waard.

      TARGET=staging is dezelfde promotie, maar alleen naar de odcn-staging overlay: de tag van
      de sandbox draait dan eerst op staging, terwijl productie op de basis blijft. Een
      promotie naar de basis haalt die pin weer weg, zodat staging daarna de basis erft.
    vars:
      TARGET: '{{.TARGET | default "sandbox"}}'
      IMAGE_TAG: '{{.IMAGE_TAG | default ""}}'
      REPO: ghcr.io/rijksictgilde/zad/keycloak-zad
      KEYCLOAK: infrastructure/bootstrap/infrastructure/keycloak/controller
    preconditions:
      - sh: 'case "{{.TARGET}}" in sandbox|staging|base) exit 0 ;; esac; exit 1'
        msg: |
          TARGET is sandbox (de sandboxed-local overlay), staging (de odcn-staging overlay)
          of base (de basis, die ODCN erft).
      # Niet voor staging en base: daar IS de tag die van de sandbox, en die wordt gelezen.
      - sh: '[ -n "{{.IMAGE_TAG}}" ] || [ "{{.TARGET}}" != "sandbox" ]'
        msg: |
          IMAGE_TAG is verplicht, bijvoorbeeld:
            task pin-keycloak-image IMAGE_TAG=2026.09.26.1432-7ccad61d
    cmds:
      - |
        REPO="{{.REPO}}"
        TARGET="{{.TARGET}}"
        TAG="{{.IMAGE_TAG}}"
        OVERLAY="{{.KEYCLOAK}}/overlays/sandboxed-local/kustomization.yaml"
        BASIS="{{.KEYCLOAK}}/base/deployment.yaml"
        STAGING="{{.KEYCLOAK}}/overlays/odcn-staging/kustomization.yaml"
        PAD="${REPO#ghcr.io/}"

        # De newTag onder DEZE naam in een overlay, niet de eerste die voorbijkomt; dezelfde
        # grens die het schrijven verderop heeft.
        tag_in() {
          awk -v repo="$REPO" '
              $0 ~ "- name: " repo "$" { gevonden = 1; next }
              gevonden && /^ *newTag: / { sub(/^ *newTag: /, ""); gsub(/["\x27]/, ""); print; exit }
              gevonden && /^ *- name: / { exit }
          ' "$1"
        }

        if [ "$TARGET" != "sandbox" ]; then
          SANDBOXTAG="$(tag_in "$OVERLAY")"

          # De tag komt uit de sandbox-overlay en nergens anders: de basis mag alleen een tag
          # dragen die aantoonbaar op de sandbox heeft gedraaid. Een tag die hier met de hand
          # in te vullen valt, maakt de weg sandbox-eerst leeg; meegeven mag wel, maar dan
          # alleen als bevestiging van wat er staat.
          if [ -z "$SANDBOXTAG" ]; then
            echo "$OVERLAY pint geen tag voor $REPO." >&2
            echo "Draai eerst: task publish-keycloak-image." >&2
            exit 1
          fi
          if [ -n "$TAG" ] && [ "$TAG" != "$SANDBOXTAG" ]; then
            echo "$TAG heeft niet op de sandbox gedraaid: die draait $SANDBOXTAG." >&2
            echo "Promoveren verplaatst de tag van de sandbox; laat IMAGE_TAG weg." >&2
            exit 1
          fi
          TAG="$SANDBOXTAG"

          # Een -dirty-tag hoort bij bron die niet in git staat. Draait die op productie, dan
          # kan niemand nagaan wat er draait, en is hij ook niet opnieuw te maken.
          case "$TAG" in
            *-dirty)
              echo "$TAG komt van ongecommitte bron en hoort niet op productie." >&2
              echo "Commit de wijziging, bouw opnieuw, en toets dat op de sandbox." >&2
              exit 1
              ;;
          esac

          # De commit is een losse handeling, dus deze taak wordt ook twee keer gedraaid.
          if [ "$TARGET" = "staging" ]; then
            HUIDIG="$(tag_in "$STAGING")"
            if [ "$HUIDIG" = "$TAG" ]; then
              echo "Staging draagt $TAG al."
              exit 0
            fi
          else
            HUIDIG="$(sed -n "s|^ *image: $REPO:||p" "$BASIS")"
            if [ "$HUIDIG" = "$TAG" ] && [ -z "$(tag_in "$STAGING")" ]; then
              echo "De basis draagt $TAG al."
              exit 0
            fi
          fi
        fi

        # DEZELFDE handdruk als de node doet: eerst een anoniem token, dan het manifest van
        # die tag. Een pakket dat op ghcr privaat staat geeft hier 403, en dat is precies waar
        # de kind-node op strandt ("failed to fetch anonymous token ... 403 Forbidden"). Zonder
        # deze controle zou er een tag gepind worden die de omgeving niet kan halen, en dat
        # blijkt pas bij de eerste podstart. Ook voor de basis: ODCN haalt hetzelfde artefact,
        # alleen via de rcr-proxy, die ghcr spiegelt.
        echo "Nagaan of $REPO:$TAG zonder inlog te halen is..."
        TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:$PAD:pull&service=ghcr.io" 2>/dev/null |
            sed -n 's/.*"token":"\([^"]*\)".*/\1/p')" || true
        MANIFEST=""
        if [ -n "$TOKEN" ]; then
          MANIFEST="$(curl -fsS -o /dev/null -w "ok" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$PAD/manifests/$TAG" 2>/dev/null)" || true
        fi
        if [ "$MANIFEST" != "ok" ]; then
          echo "$REPO:$TAG is niet zonder inlog te halen." >&2
          echo "Zet het pakket op ghcr op publiek (Package settings > Change visibility)," >&2
          echo "of geef de omgeving een pull-secret zoals de odcn-overlay dat heeft." >&2
          echo "Er is NIETS gepind: deze tag zou niet te pullen zijn." >&2
          exit 1
        fi

        if [ "$TARGET" = "staging" ]; then
          # De newTag komt direct onder de newName van DEZE naam. Een eerdere pin vervalt, ook
          # als hij NA de newName staat: het blok loopt tot de volgende naam of sleutel.
          awk -v repo="$REPO" -v tag="$TAG" '
              $0 ~ "- name: " repo "$" { gevonden = 1; print; next }
              gevonden && (/^ *- name: / || /^[^ ]/) { gevonden = 0 }
              gevonden && /^ *newTag: / { next }
              gevonden && /^ *newName: / { print; sub(/newName: .*/, "newTag: \"" tag "\""); print; next }
              { print }
          ' "$STAGING" > "$STAGING.nieuw"
          mv "$STAGING.nieuw" "$STAGING"

          [ "$(tag_in "$STAGING")" = "$TAG" ] && grep -q "newTag: \"$TAG\"" "$STAGING" || {
            echo "$STAGING pint $TAG niet: staat de images-regel met newName voor $REPO er nog?" >&2
            exit 1
          }

          echo ""
          echo "Staging draait nu $TAG (was ${HUIDIG:-de tag van de basis}); productie blijft op de basis."
          echo ""
          echo "Commit dit en schuif de branch staging door; ArgoCD rolt hem daar uit:"
          echo "  git add $STAGING && git commit -m 'deploy: keycloak-zad $TAG naar staging'"
          echo ""
          echo "Naar productie: task pin-keycloak-image TARGET=base, dat deze pin ook weer weghaalt."
          exit 0
        fi

        if [ "$TARGET" = "base" ]; then
          # Alleen het stuk achter de dubbele punt: de inspringing van de regel blijft zoals
          # hij is.
          awk -v repo="$REPO" -v tag="$TAG" '
              $0 ~ "^ *image: " repo ":" { sub(/:[^:]*$/, ":" tag) }
              { print }
          ' "$BASIS" > "$BASIS.nieuw"
          mv "$BASIS.nieuw" "$BASIS"

          grep -q "image: $REPO:$TAG$" "$BASIS" || {
            echo "$BASIS draagt $TAG niet: staat de image-regel voor $REPO er nog?" >&2
            exit 1
          }

          # Staging erft vanaf nu weer de basis. Een achtergebleven pin zou staging stil op een
          # oude tag houden na de volgende promotie.
          awk -v repo="$REPO" '
              $0 ~ "- name: " repo "$" { gevonden = 1; print; next }
              gevonden && (/^ *- name: / || /^[^ ]/) { gevonden = 0 }
              gevonden && /^ *newTag: / { next }
              { print }
          ' "$STAGING" > "$STAGING.nieuw"
          mv "$STAGING.nieuw" "$STAGING"

          echo ""
          echo "De basis draagt nu $TAG (was ${HUIDIG:-onbekend})."
          grep -n "image: $REPO:" "$BASIS"
          echo ""
          echo "Commit dit; ODCN erft de tag uit de basis en ArgoCD rolt hem uit:"
          echo "  git add $BASIS $STAGING && git commit -m 'deploy: keycloak-zad $TAG naar productie'"
          echo ""
          echo "Terugrollen: pin een eerdere tag uit de git-historie van dat bestand."
          exit 0
        fi

        # Alleen de newTag die onder DEZE naam staat: een tweede image in dezelfde lijst hoort
        # hier niet door geraakt te worden. awk en geen sed zoals pin-operations-manager-image,
        # want dat pint een image op EEN regel; hier staan naam en tag op twee regels, en een
        # adres als `/x/,+1` bestaat alleen in GNU sed.
        #
        # Aangehaald, want kustomize weigert de HELE overlay op een newTag die als yaml-getal
        # leest (gemeten: "cannot unmarshal number into Go struct field Image.images.newTag of
        # type string"). De CalVer-vorm maakt dat vandaag onmogelijk; de aanhalingstekens
        # houden het waar als de tagvorm ooit verandert.
        awk -v repo="$REPO" -v tag="$TAG" '
            $0 ~ "- name: " repo "$" { gevonden = 1; print; next }
            gevonden && /^ *- name: / { gevonden = 0 }
            gevonden && /^ *newTag: / { sub(/newTag: .*/, "newTag: \"" tag "\""); gevonden = 0 }
            { print }
        ' "$OVERLAY" > "$OVERLAY.nieuw"
        mv "$OVERLAY.nieuw" "$OVERLAY"

        # Leest de aanhalingstekens mee terug: vallen die ooit weg, dan valt het hier om en
        # niet pas bij `task sandbox:sync`.
        grep -q "newTag: \"$TAG\"" "$OVERLAY" || {
          echo "$OVERLAY pint $TAG niet: staat de images-regel voor $REPO er nog?" >&2
          exit 1
        }

        echo ""
        echo "De sandbox draait $REPO:$TAG."
        grep -n 'newTag:' "$OVERLAY"
        echo ""
        echo "Commit deze pin en rol daarna uit:"
        echo "  git add $OVERLAY && git commit -m 'deploy: keycloak-zad $TAG op de sandbox'"
        echo "  task sandbox:sync"
        echo ""
        echo "Terugrollen: pin een eerdere tag uit de git-historie van dat bestand."
        echo "Promoveren naar productie na de proef: task pin-keycloak-image TARGET=base."
    silent: true

  test-keycloak-relay-email-sender:
    desc: "Draai de tests van de relay-emailSender"
    cmds:
      - |
        echo "🧪 Tests van de relay-emailSender..."
        cd images/keycloak-zad/extensions/relay-email-sender
        mvn test
    silent: false

  export-keycloak-users:
    desc: "Export all Keycloak users with credentials and federation data"
    vars:
      OUTPUT_FILE: '{{.OUTPUT_FILE | default "users.json"}}'
      MAX_USERS: '{{.MAX_USERS | default "10000"}}'
      AUTH_REALM: '{{.AUTH_REALM | default "master"}}'
    cmds:
      - |
        # Prompt for inputs
        printf "Enter Keycloak host [http://localhost:8080]: "
        read KEYCLOAK_URL
        KEYCLOAK_URL=${KEYCLOAK_URL:-http://localhost:8080}

        printf "Enter realm to export from: "
        read EXPORT_REALM

        printf "Enter Keycloak admin password: "
        read -s ADMIN_PASSWORD
        echo ""

        printf "Enter output directory [./exports]: "
        read OUTPUT_DIR
        OUTPUT_DIR=${OUTPUT_DIR:-./exports}

        if [ -z "$EXPORT_REALM" ]; then
          echo "❌ Realm is required"
          exit 1
        fi

        if [ -z "$ADMIN_PASSWORD" ]; then
          echo "❌ Admin password is required"
          exit 1
        fi

        echo ""
        echo "🔐 Authenticating with Keycloak..."
        TOKEN=$(curl -s -X POST "$KEYCLOAK_URL/realms/{{.AUTH_REALM}}/protocol/openid-connect/token" \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "username=admin" \
          -d "password=$ADMIN_PASSWORD" \
          -d "grant_type=password" \
          -d "client_id=admin-cli" | jq -r '.access_token')

        if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
          echo "❌ Authentication failed. Please check credentials."
          exit 1
        fi

        echo "✅ Authentication successful"

        mkdir -p "$OUTPUT_DIR"
        OUTPUT_PATH="$OUTPUT_DIR/{{.OUTPUT_FILE}}"

        echo "📥 Exporting users from realm: $EXPORT_REALM"
        echo "📁 Output location: $OUTPUT_PATH"

        # Export users with full data
        HTTP_STATUS=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $TOKEN" \
          "$KEYCLOAK_URL/admin/realms/$EXPORT_REALM/users?max={{.MAX_USERS}}&briefRepresentation=false" \
          -o "$OUTPUT_PATH.tmp")

        HTTP_CODE=$(echo "$HTTP_STATUS" | tail -n1)

        if [ "$HTTP_CODE" != "200" ]; then
          echo "❌ Export failed with HTTP status: $HTTP_CODE"
          cat "$OUTPUT_PATH.tmp"
          rm -f "$OUTPUT_PATH.tmp"
          exit 1
        fi

        # Format JSON for readability
        jq '.' "$OUTPUT_PATH.tmp" > "$OUTPUT_PATH" 2>/dev/null || mv "$OUTPUT_PATH.tmp" "$OUTPUT_PATH"
        rm -f "$OUTPUT_PATH.tmp"

        USER_COUNT=$(jq '. | length' "$OUTPUT_PATH")
        echo "✅ Successfully exported $USER_COUNT users to $OUTPUT_PATH"

        # Check for federation links
        FED_USERS=$(jq '[.[] | select(.federationLink != null)] | length' "$OUTPUT_PATH")
        echo "📊 Found $FED_USERS federated users"

        # Export realm config for IDPs reference
        echo "📥 Exporting realm configuration for IDP reference..."
        curl -s -H "Authorization: Bearer $TOKEN" \
          "$KEYCLOAK_URL/admin/realms/$EXPORT_REALM" | \
          jq '{realm: .realm, identityProviders: .identityProviders, identityProviderMappers: .identityProviderMappers}' \
          > "$OUTPUT_DIR/realm-idps.json"

        echo "✅ Realm IDP configuration saved to $OUTPUT_DIR/realm-idps.json"
        echo ""
        echo "📋 Export complete. Files created:"
        echo "   - $OUTPUT_PATH (users with credentials)"
        echo "   - $OUTPUT_DIR/realm-idps.json (IDP configurations)"

  # ========================================
  # Development Environment Tasks
  # ========================================

  dev:
    desc: "Start local development environment (postgres only)"
    cmds:
      - |
        echo "Starting local development environment..."
        docker compose -f docker-compose.dev.yaml up -d postgres
        echo ""
        echo "Waiting for postgres to be ready..."
        sleep 5
        docker compose -f docker-compose.dev.yaml exec postgres pg_isready -U opi -d opi
        echo ""
        echo "Development environment started:"
        echo "  - PostgreSQL: localhost:5432 (opi/devpassword)"
        echo ""
        echo "To start the operations manager:"
        echo "  cd operations-manager/python && ENVIRONMENT=local uv run python -m opi"
    silent: false

  dev-full:
    desc: "Start full local development environment (postgres + operations-manager)"
    cmds:
      - |
        echo "Starting full development environment..."
        docker compose -f docker-compose.dev.yaml --profile full up -d
        echo ""
        echo "Development environment started:"
        echo "  - PostgreSQL: localhost:5432"
        echo "  - Operations Manager: http://localhost:8000"
        echo ""
        echo "View logs: task dev-logs"
    silent: false

  dev-down:
    desc: "Stop local development environment"
    cmds:
      - |
        echo "Stopping development environment..."
        docker compose -f docker-compose.dev.yaml --profile full down
        echo "Development environment stopped."
    silent: false

  dev-logs:
    desc: "View development environment logs"
    cmds:
      - docker compose -f docker-compose.dev.yaml --profile full logs -f
    silent: false

  dev-reset:
    desc: "Reset development environment (removes all data)"
    cmds:
      - |
        echo "Resetting development environment..."
        docker compose -f docker-compose.dev.yaml --profile full down -v
        echo "All data removed."
        echo ""
        echo "To restart: task dev"
    silent: false

  dev-psql:
    desc: "Connect to development PostgreSQL database"
    cmds:
      - docker compose -f docker-compose.dev.yaml exec postgres psql -U opi -d opi
    silent: false

  zad-map:build:
    desc: "Bouw het kaartelement naar static/js/zad-map.js (met de hand, zoals codemirror-bundle.js)"
    summary: |
      Het resultaat staat in de repo: er is geen bouwstap in CI of in de Docker-build, en
      de CSP van OPI laat geen externe host toe. Na het bouwen hoort het gewijzigde
      static/js/zad-map.js mee in de commit.
    dir: operations-manager/zad-map
    cmds:
      - npm install
      - npm run build

  # ========================================
  # Testing Tasks
  # ========================================

  test:
    desc: "De snelle laag: de unit-suite zonder de brede laag (zie docs/development/toetsen.md)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/ -v
    silent: false

  test-wide:
    desc: "De brede laag: echte database en slow files (zie docs/development/toetsen.md)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/ -m "wide and not requires_infra and not e2e" -v
    silent: false

  test-changed:
    desc: "Toetsen die bij je wijzigingen horen (BASE= andere tak, default origin/main)"
    dir: operations-manager/python
    vars:
      BASE: '{{.BASE | default "origin/main"}}'
    cmds:
      - |
        BESTANDEN=$(uv run python scripts/tests_for_changes.py --base "{{.BASE}}")
        if [ -z "$BESTANDEN" ]; then
          echo "Geen toetsbestand gevonden voor de gewijzigde bestanden."
          exit 0
        fi
        echo "$BESTANDEN" | sed 's/^/  /'
        # Het eigen -m overschrijft dat uit addopts: anders deselecteert de brede laag
        # stil de bestanden die deze selectie juist noemt.
        uv run pytest $BESTANDEN -q --tb=short -m "not requires_infra and not e2e"
    silent: false

  test-inventaris:
    desc: "Inventariseer de unit-suite: per bestand het aantal, de duur, de soort en de module"
    dir: operations-manager/python
    vars:
      XML: '{{.XML | default "/tmp/zad-test-inventaris.xml"}}'
      UIT: '{{.UIT | default "/tmp/zad-test-inventaris.md"}}'
    cmds:
      - |
        if [ -f "{{.XML}}" ]; then
          echo "Hergebruikt {{.XML}}"
        else
          PYTEST_VOORTGANG="${PYTEST_VOORTGANG:-/tmp/zad-test-inventaris-voortgang.txt}" \
            uv run pytest tests/ -m "not requires_infra and not e2e" \
            --junit-xml="{{.XML}}" --timeout=300 -p no:cacheprovider || true
        fi
      - uv run python scripts/suite_inventory.py "{{.XML}}" --output "{{.UIT}}"
    silent: false

  test-db-stop:
    desc: "Stop and remove the shared test Postgres (zad-test-postgres)"
    summary: |
      The ORM tests share one long-lived Postgres container instead of creating a
      throwaway one per run, so it stays up between runs on purpose. This removes it;
      the next test run creates it again. Safe at any moment when no suite is running.
    cmds:
      - docker rm -f zad-test-postgres

  test-db-reset:
    desc: "Recreate the shared test Postgres from scratch"
    summary: |
      Removes the container and lets the test fixture create it again, by running one
      ORM test. The fixture stays the only place that knows the image and the port.
    dir: operations-manager/python
    cmds:
      - docker rm -f zad-test-postgres
      - uv run pytest tests/test_user_admin_service.py -q

  test-authwall:
    desc: "Meet de authorization wall tegen een echte Keycloak + oauth2-proxy"
    summary: |
      Draait tests/integration/test_authorization_wall_proxy.py: twee containers, geen
      cluster. Per storing een controlemeting zonder de vlag naast de meting met de vlag.
      Vraagt werkende Docker; de Keycloak blijft daarna staan voor de volgende run.
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/integration/test_authorization_wall_proxy.py -m requires_infra -v
    silent: false

  test-authwall-stop:
    desc: "Stop en verwijder de vaste test-Keycloak (zad-test-keycloak)"
    summary: |
      De Keycloak blijft tussen runs met opzet staan. Dit haalt hem weg; de volgende run
      maakt hem opnieuw. Veilig zolang er geen suite draait.
    cmds:
      - docker rm -f zad-test-keycloak zad-test-authwall-proxy

  test-authwall-reset:
    desc: "Bouw de test-Keycloak van de authorization wall opnieuw op"
    summary: |
      Verwijdert de containers en laat de fixture ze opnieuw maken, door de tests te
      draaien.
    dir: operations-manager/python
    cmds:
      - docker rm -f zad-test-keycloak zad-test-authwall-proxy
      - task: test-authwall

  test-upgrade-safety:
    desc: "RC-19 Layer 1: replay every project file through migrate + validate (offline, no cluster/key)"
    summary: |
      Runs the offline upgrade-safety replay. Always exercises the committed
      sanitized fixtures; set RIG_PROJECTS_DIR to a zad-projects checkout to
      replay the real production files too.

        RIG_PROJECTS_DIR=/path/to/zad-projects/projects task test-upgrade-safety
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/test_upgrade_safety_replay.py -v
    silent: false

  oom-growth-report:
    desc: "Rapporteer welke componenten de OOM auto-tune boven zijn plafond heeft laten groeien"
    summary: |
      Vergelijkt per project de huidige geheugenlimiet van elk deployment-component met
      de in de catalogus verklaarde limiet, en somt de gevallen op waarvan de verhouding
      buiten de auto-tune-bovengrens valt. De oude, onbegrensde escalatie liet die
      gevallen achter; de grens uit RC-157 begrenst alleen NIEUWE groei.

      Alleen lezen: er wordt niets geschreven, niets gecommit en geen cluster geraakt.

        PROJECTS=/path/to/zad-projects/projects task oom-growth-report
        PROJECTS=... FACTOR=4 task oom-growth-report      # strengere grens verkennen
        PROJECTS=... ALL=1 task oom-growth-report         # ook de gevallen binnen de grens
    dir: operations-manager/python
    requires:
      vars: [PROJECTS]
    cmds:
      - >-
        uv run python scripts/oom_growth_report.py "{{.PROJECTS}}"
        {{if .FACTOR}}--factor {{.FACTOR}}{{end}} {{if .ALL}}--all{{end}}
    silent: true

  bench-rollout:
    desc: "Meet waar de tijd van een rollout-taak heen gaat, op de sandbox"
    summary: |
      Drijft een bestaand sandboxproject via de API door de scenario's uit RC-418 (een
      nieuwe deployment bij 1 en bij 5 bestaande, een image-update, een configure_service
      op een deployment) en meldt per scenario de taakduur, de fases uit
      opi_rollout_phase_seconds en de tijd die ZAD zelf toevoegt.

      Draai hem voor en na een wijziging op hetzelfde project; de tabellen naast elkaar
      zijn het bewijs. De deployments die hij aanmaakt ruimt hij weer op.

      De sleutels komen uit het cluster:

        eval "$(sandbox-gegevens --env)"
        export ZAD_METRICS_TOKEN=$(kubectl -n rig-system get secret operations-manager-secrets \
          -o jsonpath='{.data.PROMETHEUS_METRICS_AUTH_TOKEN}' | base64 -d)
        PROJECT=mijnproject task bench-rollout
        PROJECT=mijnproject LABEL=na-deel-1 JSON=/tmp/bench-na.json task bench-rollout
        PROJECT=mijnproject SCENARIOS=a1,b task bench-rollout
        PROJECT=mijnproject ALT_IMAGE=ghcr.io/org/app:2 task bench-rollout
    dir: operations-manager/python
    requires:
      vars: [PROJECT]
    cmds:
      - >-
        uv run python scripts/bench_rollout.py --project "{{.PROJECT}}"
        {{if .SCENARIOS}}--scenarios {{.SCENARIOS}}{{end}}
        {{if .LABEL}}--label {{.LABEL}}{{end}}
        {{if .JSON}}--json {{.JSON}}{{end}}
        {{if .KEEP}}--keep{{end}}
        {{if .ALT_IMAGE}}--alt-image {{.ALT_IMAGE}}{{end}}
    silent: true

  argocd-orphan-sweep:
    desc: "Spoor resources op die achterbleven toen hun ArgoCD-Application verdween"
    summary: |
      Zoekt in het cluster naar resources die ArgoCD als de zijne merkte terwijl hun
      Application niet meer bestaat, en in een checkout van de deployments-repo naar paden
      waar geen enkele Application naar verwijst. Meldt alleen; met DELETE=1 verwijdert hij
      wat hij vond. Meldt hij SCHOON, dan is er niets achtergebleven.

      Het cluster komt uit `task select-cluster`; zonder die keuze weigert hij.

        task argocd-orphan-sweep                                  # het hele cluster
        NAMESPACE=rig-prd-mpfm-w3h task argocd-orphan-sweep       # een namespace, veel sneller
        REPO=/path/to/zad-deployments task argocd-orphan-sweep    # ook de git-kant
        GITOPS=~/IdeaProjects/rig-cluster-test-git-repositories task argocd-orphan-sweep
                                                                  # alle drie de lagen, vanuit git
        NAMESPACE=... DELETE=1 task argocd-orphan-sweep           # echt verwijderen

      In een Capsule-tenant (odcn-production) is GITOPS of REPO nodig: het account mag niet
      elk type lijsten, en dan beslist wat de deployments-repo rendert of een namespace
      volledig gemeten is.

      DELETE=1 samen met REPO weigert: een map in de deployments-repo wordt dan beoordeeld
      op de Applications die het cluster op dit moment heeft. Gebruik GITOPS, dan beschermt
      ook wat het projectbestand nog vraagt.
    requires:
      vars: [CLUSTER_TYPE]
    dir: operations-manager/python
    # Vergelijkt op de waarde, anders dan de buren hier: een kale if-test is waar voor elke
    # niet-lege waarde, dus DELETE=0 zou ook verwijderen. Bij een destructieve vlag hoort
    # een typefout niets te doen.
    #
    # Cluster en ArgoCD-namespace gaan expliciet mee: het script leest anders de .env van
    # operations-manager/python, en die wijst naar de sandbox (rig-system) ook als
    # select-cluster op productie staat.
    cmds:
      - echo "kube-context $(kubectl config current-context)" >&2
      - >-
        ARGOCD_MANAGER={{.RIG_NAMESPACE}} CLUSTER_MANAGER={{.CLUSTER_TYPE}}
        uv run python scripts/argocd_orphan_sweep.py
        {{if .NAMESPACE}}--namespace {{.NAMESPACE}}{{end}}
        {{if .GITOPS}}--projects-repo "{{.GITOPS}}/rig-cluster-projects-github"
        --argo-repo "{{.GITOPS}}/argo-applications-github"
        --deployments-repo "{{.GITOPS}}/rig-cluster-application-test-github"{{else if .REPO}}--deployments-repo "{{.REPO}}"{{end}}
        {{if eq (default "0" .DELETE) "1"}}--delete{{end}}
    silent: true

  upgrade-safety-diff:
    desc: "RC-19 Layer 2: summarize what a zad-deployments upgrade removed, per project"
    summary: |
      Diffs a zad-deployments checkout against the baseline recorded before the
      OPI image swap, and summarizes disappeared keys (env vars, secrets, ingress,
      mounts, schemas) per project. The output is a report to judge, not a pass/fail.

        REPO=/path/to/zad-deployments BASELINE=<sha> task upgrade-safety-diff
    dir: operations-manager/python
    requires:
      vars: [REPO, BASELINE]
    cmds:
      - uv run python scripts/compare_deployments_diff.py "{{.REPO}}" "{{.BASELINE}}" "{{.TARGET | default \"HEAD\"}}"
    silent: true

  upgrade-safety-identity:
    desc: "RC-19 Layer 2: assert every service still resolves to the SAME thing after the upgrade"
    summary: |
      Decrypts the generated secrets in a baseline zad-deployments worktree and the
      upgraded tree, and compares the resolved identity of each service per deployment
      (database host/name/user/schema, OIDC url/realm/client-id, bucket name, published
      Ingress host). Unlike upgrade-safety-diff this is a pass/fail: a same-key but
      different-VALUE identity change (e.g. a deployment now pointing at another database)
      is a finding. Needs the AGE key the secrets are encrypted with (the sandbox key).

        git -C /path/to/zad-deployments worktree add /tmp/zad-baseline <baseline-sha>
        BASELINE_DIR=/tmp/zad-baseline TARGET_DIR=/path/to/zad-deployments \
          KEY_FILE=../../security/sandbox-key.txt task upgrade-safety-identity
    dir: operations-manager/python
    requires:
      vars: [BASELINE_DIR, TARGET_DIR, KEY_FILE]
    cmds:
      - uv run python scripts/compare_service_identity.py "{{.BASELINE_DIR}}" "{{.TARGET_DIR}}" --key-file "{{.KEY_FILE}}"
    silent: true

  test-integration:
    desc: "Run integration tests (mock-based, no infrastructure required)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/integration/ -v -m "not slow"
    silent: false

  test-integration-slow:
    desc: "Draai de langzame integratietoetsen (-m slow)"
    summary: |
      Heette test-integration-kind en maakte een kind-cluster: de kubectl-toetsen die dat
      nodig hadden zijn opgegaan in de groep kubernetes_live (task test-kubernetes).
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/integration/ -v -m "slow"
    silent: false

  test-all:
    desc: "De snelle en de brede laag achter elkaar (zonder de live groepen en de browsertoetsen)"
    dir: operations-manager/python
    cmds:
      - uv run pytest tests/ -m "not requires_infra and not e2e" -v
    silent: false

  test-e2e:
    desc: "Run Playwright E2E browser tests (local app server, no sandbox needed)"
    dir: operations-manager/python
    cmds:
      # Ook firefox: tests/e2e/test_lotc_aanvragenbeheer.py meet daarin een fout die in
      # Chromium NIET te zien is (een tabelcel die alleen daar tot niets krimpt).
      - uv run playwright install chromium firefox --with-deps
      # Zonder PROJECT_REPO_PASSWORD weigert generate_self_service_project_yaml en leveren
      # de wizardtests geen projectbestand. Alleen de VORM telt, dus geen secret.
      - >-
        PROJECT_REPO_PASSWORD=${PROJECT_REPO_PASSWORD:-plain:repo-secret}
        uv run pytest tests/e2e/ -m "e2e and not sandbox" -v
    silent: false

  test-e2e-random:
    desc: "Run the local E2E suite in a shuffled order (the isolation check that counts)"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium firefox --with-deps
      # The plan's own acceptance criterion: order-independence is only proven by
      # actually changing the order. A reversed file order is not enough -- it still
      # keeps every file's tests together and in sequence, which is exactly the
      # assumption a leaking test makes. pytest-randomly shuffles files AND the tests
      # inside them.
      # SEED=<n> reproduces a specific shuffle; without it every run picks a new one,
      # which is the point: repeated runs sample different orders.
      # No -q: the addopts are already at verbosity 0 (-v -q), so an extra -q lands on
      # -1 and pytest drops the report header -- the line where pytest-randomly prints
      # `Using --randomly-seed=<n>`. Without it the shuffle cannot be replayed.
      # PROJECT_REPO_PASSWORD: zie test-e2e.
      - >-
        PROJECT_REPO_PASSWORD=${PROJECT_REPO_PASSWORD:-plain:repo-secret}
        uv run pytest tests/e2e/ -m "e2e and not sandbox" -p randomly {{if .SEED}}--randomly-seed={{.SEED}}{{end}} --timeout=300
    silent: false

  test-e2e-sandbox:
    desc: "Run E2E browser tests against running sandbox cluster"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium --with-deps
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        E2E_ARTIFACT_DIR=${E2E_ARTIFACT_DIR:-tests/e2e/artifacts}
        E2E_TRACE=${E2E_TRACE:-1}
        uv run pytest tests/e2e/ -m "e2e and sandbox and not reallife and not punt14" -v --timeout=300
    silent: false

  test-e2e-sandbox-punt14:
    desc: "Run the punt14 load suite (26 deployments in one project) against a running sandbox"
    dir: operations-manager/python
    summary: |
      Bedoeld om te draaien TERWIJL de reallife-suite loopt, zodat er werkelijk belasting
      op de store staat. Daarom een eigen taak en niet in `test-e2e-sandbox`: die ene
      module maakt tot 26 deployments in een project en vult daarmee de node van de
      sandbox, waardoor de rest van de suite op `Insufficient cpu` blijft staan.
    cmds:
      - uv run playwright install chromium --with-deps
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        E2E_ARTIFACT_DIR=${E2E_ARTIFACT_DIR:-tests/e2e/artifacts}
        E2E_TRACE=${E2E_TRACE:-1}
        uv run pytest tests/e2e/test_sandbox_punt14.py -m "e2e and sandbox and punt14" -v --timeout=7200
    silent: false

  sandbox:verwijder-weesproject:
    desc: "Verwijder een achtergebleven testproject van de sandbox, inclusief zijn projectbestand"
    dir: operations-manager/python
    summary: |
      Een aanmaak die halverwege omviel liet zijn projectbestand in zad-projects staan.
      Dat bestand is de bron: de app-of-apps maakt de ArgoCD-applicaties er steeds
      opnieuw uit aan, dus wat je op het cluster weghaalt staat er seconden later weer.

      Meerdere namen mogen, gescheiden door spaties.

        task sandbox:verwijder-weesproject NAAM=test-ej1
        task sandbox:verwijder-weesproject NAAM="test-ej1 test-vim"
    vars:
      NAAM: '{{.NAAM}}'
    preconditions:
      - sh: '[ -n "{{.NAAM}}" ]'
        msg: 'Geef de technische projectnaam mee: task sandbox:verwijder-weesproject NAAM=test-ej1'
    cmds:
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        uv run python -m tests.e2e.helpers.weesprojecten {{.NAAM}}
    silent: true

  test-e2e-sandbox-reallife:
    desc: "Run the long real-life E2E suite (5 projects, semi-concurrent UI+API mutations) against a running sandbox"
    dir: operations-manager/python
    cmds:
      - uv run playwright install chromium --with-deps
      - >-
        E2E_BASE_URL=${E2E_BASE_URL:-https://zad.sandbox.rijksapp.dev}
        E2E_SECRET_KEY=${E2E_SECRET_KEY:-sandbox-dev-secret-key-fixed-for-stable-sessions-32min}
        FORGEJO_URL=${FORGEJO_URL:-https://forgejo.sandbox.rijksapp.dev}
        FORGEJO_USER=${FORGEJO_USER:-rig-admin}
        FORGEJO_PASSWORD=${FORGEJO_PASSWORD:-admin1234}
        E2E_ARTIFACT_DIR=${E2E_ARTIFACT_DIR:-tests/e2e/artifacts}
        E2E_TRACE=${E2E_TRACE:-1}
        uv run pytest tests/e2e/test_sandbox_reallife.py -m "e2e and sandbox and reallife" -v --timeout=600
    silent: false

  test-coverage:
    desc: "Run tests with coverage report"
    dir: operations-manager/python
    cmds:
      - uv run coverage run -m pytest tests/ --ignore=tests/integration/
      - uv run coverage report
      - uv run coverage html
      - |
        echo ""
        echo "Coverage report generated: operations-manager/python/htmlcov/index.html"
    silent: false

  # ========================================
  # Kind Cluster Management for Testing
  # ========================================

  netpol:meet:
    desc: "Meet de flowmatrix op een wegwerpcluster"
    summary: |
      Rolt het netwerkbeleid van odcn-production uit op een vers kind-cluster, zet
      per endpoint een pod met de juiste labels neer, en probeert per regel een
      TCP-verbinding. Draai dit bij elke wijziging aan een NetworkPolicy.

      CNI=kindnet (standaard, en het handhaaft NetworkPolicies), CNI=calico als
      tweede meting voor de regels in features/restrictive-network-policies.md.
      Het cluster is een wegwerpcluster; je eigen kubectl-context blijft onaangeroerd.
    vars:
      CNI: '{{default "kindnet" .CNI}}'
      NETPOL_CLUSTER: '{{default "rig-netpol-meting" .NETPOL_CLUSTER}}'
      CALICO_VERSION: '{{default "v3.28.2" .CALICO_VERSION}}'
    preconditions:
      - sh: command -v envsubst
        msg: |
          envsubst ontbreekt. Het zit in gettext: 'brew install gettext' op MacOS of 'apt-get install gettext-base' op Linux. Zonder het wordt de kind-config leeg.
    cmds:
      - |
        set -e
        KUBECONFIG_FILE=$(mktemp -d)/kubeconfig
        export KUBECONFIG="$KUBECONFIG_FILE"
        export NETPOL_KIND_VERSION="{{.KIND_VERSION}}"
        export NETPOL_CLUSTER="{{.NETPOL_CLUSTER}}"

        if [ "{{.CNI}}" = "calico" ]; then
          export NETPOL_DISABLE_DEFAULT_CNI=true
          # Zonder default-CNI wordt de node pas Ready nadat Calico er staat, en dat
          # gebeurt hierna. --wait zou dus altijd zijn timeout halen; de kubectl wait
          # na de Calico-installatie dekt dezelfde conditie.
          CREATE_WAIT=""
        else
          export NETPOL_DISABLE_DEFAULT_CNI=false
          CREATE_WAIT="--wait 180s"
        fi

        # De trap hieronder verwijdert het cluster, ook als `kind create` afbreekt omdat
        # de naam al bestaat. Zonder deze guard wist `NETPOL_CLUSTER=rig-sandbox` dus de
        # sandbox van iemand anders.
        if kind get clusters 2>/dev/null | grep -qx "{{.NETPOL_CLUSTER}}"; then
          echo "WEIGERT: er bestaat al een kind-cluster {{.NETPOL_CLUSTER}}. Is dat een" >&2
          echo "achtergebleven meetcluster, dan ruimt 'task netpol:meet-opruimen' het op;" >&2
          echo "is het een ander cluster, kies dan een naam met NETPOL_CLUSTER=." >&2
          exit 1
        fi

        cleanup() {
          echo "Opruimen van cluster {{.NETPOL_CLUSTER}}..."
          kind delete cluster --name "{{.NETPOL_CLUSTER}}" >/dev/null 2>&1 || true
          rm -rf "$(dirname "$KUBECONFIG_FILE")"
        }
        trap cleanup EXIT

        echo "Cluster {{.NETPOL_CLUSTER}} aanmaken (dual-stack, CNI={{.CNI}})..."
        envsubst < operations-manager/python/tests/netpol/kind-config.yaml \
          | kind create cluster --name "{{.NETPOL_CLUSTER}}" --config - $CREATE_WAIT

        if [ "{{.CNI}}" = "calico" ]; then
          echo "Calico {{.CALICO_VERSION}} installeren..."
          kubectl apply -f "https://raw.githubusercontent.com/projectcalico/calico/{{.CALICO_VERSION}}/manifests/calico.yaml"
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
        fi

        kubectl wait --for=condition=Ready node --all --timeout=180s

        cd operations-manager/python
        uv run python -m tests.netpol.measure

  netpol:meet-opruimen:
    desc: "Verwijder een achtergebleven meetcluster van netpol:meet"
    vars:
      NETPOL_CLUSTER: '{{default "rig-netpol-meting" .NETPOL_CLUSTER}}'
    cmds:
      - kind delete cluster --name "{{.NETPOL_CLUSTER}}"
    silent: true

  test-cluster-up:
    desc: "Zet het wegwerpcluster op waarop de groepen kubernetes_live en argocd_live meten"
    summary: |
      Een kind-cluster met de node-image die de sandbox pint, de ArgoCD-operator, de ArgoCD
      die het platform uitrolt, en een Forgejo om manifesten in te zetten. Niet-interactief,
      zonder de ontwikkelaarssleutel en zonder het wildcard-certificaat.

      Eigen naam en eigen poorten, dus hij draait naast rig-sandbox. kind zet je
      kubectl-context op dit cluster, zoals sandbox:setup dat doet; task test-cluster-down
      zet hem terug en verwijdert het cluster.

      De node-image hoort de Kubernetes-versie van ODCN te volgen; die stond bij het
      schrijven niet vast, dus hij volgt de sandbox. Dat is een regel in
      bootstrap/sandbox/kind-config.yaml, niet hier.
    vars:
      TESTCLUSTER: '{{.TESTCLUSTER | default "rig-testcluster"}}'
      FORGEJO_PORT: '{{.FORGEJO_PORT | default "38300"}}'
      NODE_IMAGE:
        sh: yq '.nodes[0].image' bootstrap/sandbox/kind-config.yaml
      FORGEJO_IMAGE:
        sh: yq '.spec.template.spec.containers[0].image' infrastructure/bootstrap/infrastructure/forgejo/controller/overlays/sandboxed-local/statefulset-patch.yaml
      ARGOCD_IMAGE:
        sh: yq '.spec.image' bootstrap/rig-system/kustomize/overlays/sandboxed-local/argocd-deployment.yaml
      ARGOCD_VERSION:
        sh: yq '.spec.version' bootstrap/rig-system/kustomize/overlays/sandboxed-local/argocd-deployment.yaml
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "Docker draait niet; dit cluster is een kind-cluster."
      - sh: command -v envsubst
        msg: "envsubst ontbreekt (pakket gettext); zonder het wordt de kind-config leeg."
      # rig-sandbox en rig-integration-test zijn van iets anders; een naam die daarmee
      # samenvalt zou het cluster van iemand anders overschrijven en in down verwijderen.
      - sh: '[ "{{.TESTCLUSTER}}" != "rig-sandbox" ] && [ "{{.TESTCLUSTER}}" != "rig-integration-test" ]'
        msg: "TESTCLUSTER={{.TESTCLUSTER}} is de naam van een ander cluster. Kies een eigen naam."
    cmds:
      - |
        if kind get clusters 2>/dev/null | grep -qx "{{.TESTCLUSTER}}"; then
          echo "Cluster {{.TESTCLUSTER}} bestaat al; de stappen hieronder zijn herhaalbaar."
        else
          echo "Cluster {{.TESTCLUSTER}} aanmaken met {{.NODE_IMAGE}}..."
          TESTCLUSTER_NODE_IMAGE="{{.NODE_IMAGE}}" \
          TESTCLUSTER_FORGEJO_PORT="{{.FORGEJO_PORT}}" \
            envsubst < operations-manager/python/tests/cluster/kind-config.yaml \
            | kind create cluster --name "{{.TESTCLUSTER}}" --config - --wait 180s
        fi
      # kind zet de context alleen bij een verse create. Bij een herhaalde run zouden de
      # stappen hieronder op de context van een ander cluster landen, en de ArgoCD-CR
      # hieronder heet net als die van de sandbox `argocd` in `rig-system`.
      - kubectl config use-context "kind-{{.TESTCLUSTER}}"
      - |
        echo "Forgejo neerzetten ({{.FORGEJO_IMAGE}})..."
        TESTCLUSTER_FORGEJO_IMAGE="{{.FORGEJO_IMAGE}}" \
        TESTCLUSTER_FORGEJO_PORT="{{.FORGEJO_PORT}}" \
          envsubst < operations-manager/python/tests/cluster/forgejo.yaml | kubectl apply -f -
      - task: sandbox:wait-forgejo
      - task: sandbox:init-forgejo
      # De operator en zijn nep-CRD's komen van de sandbox-route; CLUSTER_TYPE hier is
      # sandboxed-local omdat de context nu een lokaal kind-cluster is, wat de precondition
      # van die taak toetst.
      - task: prepare-argocd-operator
        vars:
          CLUSTER_TYPE: sandboxed-local
      - |
        kubectl -n argocd-operator-system rollout status deployment/argocd-operator-controller-manager --timeout=300s
      - |
        echo "ArgoCD neerzetten ({{.ARGOCD_IMAGE}}:{{.ARGOCD_VERSION}})..."
        # De CMP-sidecar hoort erbij: het Application-sjabloon van OPI noemt de plugin
        # kustomize-sops, dus zonder hem rendert ArgoCD geen enkele tenant-app. De
        # ConfigMap, de ServiceAccount en het hele spec.repo-blok komen uit de component
        # die de clusters ook gebruiken, zodat de sidecar hier niet van productie afdrijft.
        kubectl apply -f bootstrap/rig-system/kustomize/configmap-sops-plugin.yaml
        kubectl apply -f bootstrap/rig-system/kustomize/components/sops-plugin/serviceaccount-cmp.yaml

        RENDER=$(mktemp -d)
        yq '.patches[] | select(.target.kind == "ArgoCD") | .patch' \
          bootstrap/rig-system/kustomize/components/sops-plugin/kustomization.yaml \
          | yq '.[0].value' > "$RENDER/repo.yaml"
        TESTCLUSTER_ARGOCD_IMAGE="{{.ARGOCD_IMAGE}}" \
        TESTCLUSTER_ARGOCD_VERSION="{{.ARGOCD_VERSION}}" \
          envsubst < operations-manager/python/tests/cluster/argocd.yaml > "$RENDER/argocd.yaml"
        REPO="$RENDER/repo.yaml" yq -i '.spec.repo = load(strenv(REPO))' "$RENDER/argocd.yaml"
        kubectl apply -f "$RENDER/argocd.yaml"
        rm -rf "${RENDER:?}"
        # De operator maakt de Deployments pas na zijn eerste reconcile; wachten op de
        # toestand zelf, niet op de klok.
        until kubectl -n rig-system get deployment argocd-server >/dev/null 2>&1; do sleep 2; done
        kubectl -n rig-system rollout status deployment/argocd-server --timeout=300s
        kubectl -n rig-system rollout status statefulset/argocd-application-controller --timeout=300s
      - |
        # Wat het app-of-apps van de sandbox nodig heeft: zijn AppProject en de credentials
        # voor de interne Forgejo (de repo's zijn prive). Dezelfde bestanden als de sandbox.
        # De Application `user-applications` zelf en de sleutel waarmee hij rendert zet de
        # groep tasks_live neer: die hoort bij een verse argo-repo, en de sleutel is nieuw
        # per run.
        OVERLAY=bootstrap/rig-system/kustomize/overlays/sandboxed-local
        yq 'select(.metadata.name == "forgejo-repo-secret")' "$OVERLAY/argocd-repo-forgejo-secret.yaml" | kubectl apply -f -
        kubectl apply -f "$OVERLAY/argocd-appproject-zad-app-of-apps.yaml"
      # De ingress-controller van de sandbox: zonder hem krijgt geen Ingress een adres, en
      # houdt ArgoCD elke app die op het web publiceert op Progressing.
      - task: install-ingress-nginx
      - |
        # De CSI-hostpath-driver met csi-hostpath-sc en csi-hostpath-snapclass, de base die
        # de sandbox-overlay ook neemt: de clusterconfiguratie van sandboxed-local vraagt die
        # StorageClass voor persistent-storage, en de PVC-backup maakt er VolumeSnapshots
        # mee. Twee keer toepassen: de eerste keer bestaan de snapshot-CRD's nog niet als de
        # VolumeSnapshotClass langskomt.
        RENDER=$(mktemp)
        kustomize build bootstrap/rig-system/kustomize/csi-snapshot/base > "$RENDER"
        kubectl apply -f "$RENDER" >/dev/null 2>&1 || true
        kubectl wait --for=condition=Established crd/volumesnapshotclasses.snapshot.storage.k8s.io --timeout=120s
        kubectl apply -f "$RENDER"
        rm -f "$RENDER"
        kubectl rollout status statefulset/csi-hostpathplugin --timeout=300s
      - |
        echo ""
        echo "Cluster {{.TESTCLUSTER}} staat. Forgejo: http://localhost:{{.FORGEJO_PORT}} (rig-admin/admin1234)"
        echo "Draai nu: task test-kubernetes, task test-argocd"
    silent: true

  test-cluster-down:
    desc: "Verwijder het wegwerpcluster van test-cluster-up en zet je kubectl-context terug"
    vars:
      TESTCLUSTER: '{{.TESTCLUSTER | default "rig-testcluster"}}'
    preconditions:
      # Dezelfde grendel als in test-cluster-up: deze taak verwijdert het cluster, dus een
      # naam die met rig-sandbox of rig-integration-test samenvalt zou dat van iemand
      # anders weggooien.
      - sh: '[ "{{.TESTCLUSTER}}" != "rig-sandbox" ] && [ "{{.TESTCLUSTER}}" != "rig-integration-test" ]'
        msg: "TESTCLUSTER={{.TESTCLUSTER}} is de naam van een ander cluster. Kies een eigen naam."
    cmds:
      - |
        kind delete cluster --name "{{.TESTCLUSTER}}"
        # kind verwijdert de context mee; stond je erop, val dan terug op een ander cluster.
        if ! kubectl config current-context >/dev/null 2>&1; then
          FALLBACK=$(kubectl config get-contexts -o name 2>/dev/null | grep -m1 "sandbox\|kind-rig" || true)
          if [ -n "$FALLBACK" ]; then
            kubectl config use-context "$FALLBACK"
            echo "kubectl-context terug op: $FALLBACK"
          fi
        fi
    silent: true

  # ==========================================================================
  # Sandboxed Local Development Environment
  # Self-contained sandbox with in-cluster Forgejo as git source
  # ==========================================================================

  sandbox:setup:
    desc: "Complete setup: create sandboxed-local cluster with in-cluster Forgejo"
    cmds:
      - task: requirements-check
      - |
        cat banner.txt
        cat docs/sandbox/sandbox-prerequisites.md
        echo ""
        # SANDBOX_NONINTERACTIVE=true skips this confirmation (unattended installs)
        if [ "${SANDBOX_NONINTERACTIVE:-}" = "true" ]; then
          echo "(non-interactive: continuing)"
        else
          read -p "Press Enter to continue or Ctrl+C to cancel... "
        fi
      - |
        echo "========================================="
        echo "Setting up Sandboxed Local Environment"
        echo "========================================="
        echo ""
        echo "Activating sandboxed-local configuration..."
        cp .env-taskfile-sandboxed-local .env-taskfile-current
      # Collect all user input upfront
      - task: sandbox:decrypt-wildcard-cert
      - task: sandbox:ask-sso
      - |
        echo ""
        echo "All questions answered. Starting unattended setup..."
        echo ""
      # Generate keys and secrets
      - task: sandbox:generate-age-key
      - task: sandbox:generate-infrastructure-secrets
      - task: sandbox:generate-bootstrap-secrets
      - task: sandbox:apply-sso
      - task: sandbox:generate-env-secrets
      # Overlays op lokale images zetten als dit een dev-build is. Moet vóór
      # sandbox:sync en bootstrap-argo-system, want die pushen/appliceren de overlays.
      # Zonder deze stap deed .sandbox-mode=dev niets: ask-build-mode schreef het bestand
      # wel, maar niemand las het tijdens setup.
      - task: sandbox:configure-local-images
      # Phase 1: Create cluster and install operators/CRDs
      - task: sandbox:create-cluster
      # Moet vóór alles wat een image nodig heeft. Zie docs/sandbox/sandbox-kind-registry.md.
      - task: sandbox:setup-registry
      # De images moeten klaarstaan vóórdat de deployments ze proberen te halen: de
      # CMP-sidecar geladen in kind (Never), operations-manager in de registry.
      # No-op in demo-mode.
      - task: sandbox:build-local-images-if-dev
      - task: install-ingress-nginx
      - task: install-cnpg-operator
      - task: sandbox:install-csi-snapshot
      - task: sandbox:configure-coredns
      - task: sandbox:create-namespace
      - task: sandbox:import-wildcard-cert
      - task: sandbox:generate-argocd-tls
      - task: sandbox:create-sops-age-secret
      - task: sandbox:create-git-signing-key-secret
      # Phase 2: Bootstrap Forgejo (minimal direct deploys, just enough for git)
      - task: sandbox:deploy-postgresql-direct
      - task: sandbox:deploy-forgejo-direct
      - task: sandbox:wait-forgejo
      - task: sandbox:init-forgejo
      # Phase 3: Sync infrastructure (including generated secrets) to Forgejo
      - task: sandbox:sync
      # Phase 4: Bootstrap ArgoCD + Operations Manager (images pulled from GHCR)
      - task: prepare-argocd-operator
      # Een eigen run en geen `task:`: deze run las bij het starten de configuratie van de
      # vorige selectie, en de cp hierboven verandert dat niet meer.
      - CLUSTER_TYPE=sandboxed-local task bootstrap-argo-system KEY_FILE=security/sandbox-key.txt
      # - task: sandbox:update-dns  # Not needed when *.sandbox.rijksapp.dev resolves to 127.0.0.1 via public DNS
      # Phase 5: Wait for everything to be deployed and ready
      - task: sandbox:wait-ready
      # Het API-token waarmee OPI bij ArgoCD komt. Pas hier: het account opi bestaat zodra
      # de operator de CR heeft gereconcilieerd, en OPI heeft het token nodig voor zijn
      # eerste uitrol.
      - task: sandbox:issue-argocd-opi-token
      - |
        kubectl config set-context --current --namespace=rig-system
      - |
        echo ""
        echo "========================================="
        echo "Sandboxed local cluster setup complete!"
        echo "========================================="
        echo ""
        cat docs/sandbox/sandbox-reference.md
        echo ""
        echo "This reference card is saved at: docs/sandbox/sandbox-reference.md"
    silent: true

  sandbox:issue-argocd-opi-token:
    desc: "Geef OPI een ArgoCD-API-token (account opi) en zet het in opi-argocd-token"
    cmds:
      - |
        uv run --project operations-manager/python python scripts/edit-secret.py \
          --component argocd-opi-token --cluster sandboxed-local --apply --yes
    silent: true

  sandbox:create-cluster:
    desc: "Create Kind cluster for sandboxed-local environment"
    cmds:
      - |
        echo "Creating Kind cluster: rig-sandbox..."
        if kind get clusters 2>/dev/null | grep -q "^rig-sandbox$"; then
          echo "Cluster rig-sandbox already exists"
          exit 0
        fi
        # KIND_HTTP_PORT / KIND_HTTPS_PORT from the env (e.g. .env-taskfile-current
        # or the shell) skip the prompt — needed for unattended installs and for
        # hosts where 80/443 are taken (e.g. the dev server behind Caddy → 8880/8843).
        if [ -z "${KIND_HTTP_PORT:-}" ]; then
          read -p "HTTP port for ingress [80]: " http_port
          export KIND_HTTP_PORT="${http_port:-80}"
        fi
        if [ -z "${KIND_HTTPS_PORT:-}" ]; then
          read -p "HTTPS port for ingress [443]: " https_port
          export KIND_HTTPS_PORT="${https_port:-443}"
        fi
        envsubst < bootstrap/sandbox/kind-config.yaml | kind create cluster --name rig-sandbox --config -
        echo "Cluster rig-sandbox created successfully (HTTP port: ${KIND_HTTP_PORT}, HTTPS port: ${KIND_HTTPS_PORT})"
    silent: true

  sandbox:setup-registry:
    desc: "Zet de image-registry naast het kind-cluster en sluit de nodes erop aan"
    cmds:
      - scripts/setup-kind-registry.sh --cluster rig-sandbox
    silent: true

  sandbox:prune-registry:
    desc: "Verwijder oude tags uit de registry naast het kind-cluster, de gedeelde lagen blijven"
    summary: |
      Zie docs/sandbox/sandbox-kind-registry.md.

        task sandbox:prune-registry RETENTIE_DAGEN=0
    vars:
      RETENTIE_DAGEN: '{{.RETENTIE_DAGEN | default "2"}}'
    cmds:
      - RETENTIE_DAGEN={{.RETENTIE_DAGEN}} scripts/prune-kind-registry.sh
    silent: true

  sandbox:install-csi-snapshot:
    desc: "Install CSI VolumeSnapshot CRDs for sandboxed-local cluster"
    cmds:
      - |
        echo "Installing CSI VolumeSnapshot CRDs..."
        if kubectl get crd volumesnapshots.snapshot.storage.k8s.io 2>/dev/null; then
          echo "CSI VolumeSnapshot CRDs already installed"
          exit 0
        fi
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotclasses.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshotcontents.yaml
        kubectl apply -f https://raw.githubusercontent.com/kubernetes-csi/external-snapshotter/v8.2.0/client/config/crd/snapshot.storage.k8s.io_volumesnapshots.yaml
        echo "CSI VolumeSnapshot CRDs installed"
    silent: true

  sandbox:configure-coredns:
    desc: "Configure CoreDNS to resolve *.sandbox.rijksapp.dev domains to ingress controller"
    cmds:
      - |
        echo "Configuring CoreDNS to resolve *.sandbox.rijksapp.dev domains..."

        # Get current CoreDNS Corefile
        CURRENT_COREFILE=$(kubectl get configmap coredns -n kube-system -o jsonpath='{.data.Corefile}')

        # Check if rewrite rule already exists
        if echo "$CURRENT_COREFILE" | grep -q "name regex.*\.sandbox\.rijksapp\.dev"; then
          echo "CoreDNS rewrite rule for *.sandbox.rijksapp.dev already exists"
          exit 0
        fi

        echo "Adding rewrite rule for *.sandbox.rijksapp.dev domains..."

        # Create new Corefile with rewrite rule inserted after 'ready' line
        NEW_COREFILE=$(echo "$CURRENT_COREFILE" | awk '
          /ready/ {
            print
            print "    rewrite stop {"
            print "        name regex (.+)\\.sandbox\\.rijksapp\\.dev ingress-nginx-controller.ingress-nginx.svc.cluster.local"
            print "        answer auto"
            print "    }"
            next
          }
          {print}
        ')

        # Create a temporary file with the patch
        TEMP_FILE=$(mktemp)
        cat > "$TEMP_FILE" <<EOF
        {
          "data": {
            "Corefile": $(echo "$NEW_COREFILE" | jq -Rs .)
          }
        }
        EOF

        # Apply the patch
        kubectl patch configmap coredns -n kube-system --type merge --patch-file "$TEMP_FILE"

        # Clean up temp file
        rm "$TEMP_FILE"

        # Restart CoreDNS to apply changes
        kubectl rollout restart deployment coredns -n kube-system

        echo "CoreDNS configured for *.sandbox.rijksapp.dev"
    silent: true

  sandbox:create-namespace:
    desc: "Create rig-system namespace for sandboxed-local cluster"
    cmds:
      - |
        if kubectl get namespace rig-system 2>/dev/null; then
          echo "Namespace rig-system already exists"
          exit 0
        fi
        kubectl create namespace rig-system
        echo "Namespace rig-system created"
    silent: true

  sandbox:decrypt-wildcard-cert:
    desc: "Decrypt AGE-encrypted wildcard TLS certificate using developer key"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/developer-key.txt'}
    cmds:
      - |
        CERT_DIR="security/tls/sandbox-wildcard"
        KEY_FILE="security/developer-key.txt"

        # Plaintext already present: keep it, but detect a stale encrypted source.
        # (The encrypted .age is the committed source of truth; if a renewed cert was
        # dropped in as plaintext without re-encrypting, the .age silently goes stale.)
        if [ -f "$CERT_DIR/fullchain.pem" ] && [ -f "$CERT_DIR/privkey.pem" ]; then
          if [ -f "$KEY_FILE" ] && [ -f "$CERT_DIR/fullchain.pem.age" ]; then
            PLAIN_END=$(openssl x509 -in "$CERT_DIR/fullchain.pem" -noout -enddate 2>/dev/null)
            AGE_TMP=$(mktemp)
            if age --decrypt -i "$KEY_FILE" -o "$AGE_TMP" "$CERT_DIR/fullchain.pem.age" 2>/dev/null; then
              AGE_END=$(openssl x509 -in "$AGE_TMP" -noout -enddate 2>/dev/null)
              if [ "$PLAIN_END" != "$AGE_END" ]; then
                echo "WARNING: plaintext and encrypted wildcard cert differ (plaintext notAfter: ${PLAIN_END#notAfter=}, encrypted notAfter: ${AGE_END#notAfter=})."
                echo "WARNING: the encrypted source may be stale. Run 'task sandbox:encrypt-wildcard-cert' to refresh the .age files."
              fi
            fi
            rm -f "$AGE_TMP"
          fi
          echo "Wildcard TLS certificates already decrypted"
          exit 0
        fi

        # Check encrypted files exist
        if [ ! -f "$CERT_DIR/fullchain.pem.age" ] || [ ! -f "$CERT_DIR/privkey.pem.age" ]; then
          echo "Encrypted certificate files not found in $CERT_DIR/"
          echo "Expected files: fullchain.pem.age, privkey.pem.age"
          exit 1
        fi

        # Prompt for developer key if not present
        if [ ! -f "$KEY_FILE" ]; then
          echo "The sandbox TLS certificates and other secrets are stored"
          echo "encrypted in the repository. A decryption key is needed to"
          echo "unlock them."
          echo ""
          echo "If you don't have this key, ask the ZAD developers."
          echo ""
          echo "Paste the AGE private key (starts with AGE-SECRET-KEY-...):"
          read -rs AGE_SECRET_KEY
          echo ""
          if [[ ! "$AGE_SECRET_KEY" =~ ^AGE-SECRET-KEY- ]]; then
            echo "Invalid key format. Expected a key starting with AGE-SECRET-KEY-"
            exit 1
          fi
          # Een redirect maakt het bestand met de umask, dus leesbaar voor groep en
          # anderen; de lezers hier weigeren dat.
          (umask 077 && echo "$AGE_SECRET_KEY" > "$KEY_FILE")
          echo "Developer key saved to $KEY_FILE"
        fi

        echo "Decrypting wildcard TLS certificates..."
        age --decrypt -i "$KEY_FILE" -o "$CERT_DIR/fullchain.pem" "$CERT_DIR/fullchain.pem.age"
        age --decrypt -i "$KEY_FILE" -o "$CERT_DIR/privkey.pem" "$CERT_DIR/privkey.pem.age"
        echo "Wildcard TLS certificates decrypted"
    silent: true

  sandbox:encrypt-wildcard-cert:
    desc: "Re-encrypt the wildcard TLS cert PEMs to AGE after renewal"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/developer-key.txt'}
    cmds:
      - |
        CERT_DIR="security/tls/sandbox-wildcard"
        KEY_FILE="security/developer-key.txt"

        # Check plaintext files exist
        if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
          echo "Plaintext certificate files not found in $CERT_DIR/"
          echo "Expected files: fullchain.pem, privkey.pem"
          exit 1
        fi

        # Developer key needed to derive the AGE recipient
        if [ ! -f "$KEY_FILE" ]; then
          echo "Developer key not found at $KEY_FILE"
          echo "Run 'task sandbox:decrypt-wildcard-cert' first, or ask the ZAD developers."
          exit 1
        fi

        RECIPIENT=$(age-keygen -y "$KEY_FILE")
        echo "Re-encrypting wildcard TLS certificates to AGE for $RECIPIENT..."
        age -r "$RECIPIENT" -o "$CERT_DIR/fullchain.pem.age" "$CERT_DIR/fullchain.pem"
        age -r "$RECIPIENT" -o "$CERT_DIR/privkey.pem.age" "$CERT_DIR/privkey.pem"
        echo "Wildcard TLS certificates re-encrypted"
    silent: true

  sandbox:ask-build-mode:
    desc: "Ask whether to use pre-built images (demo) or build locally (development)"
    cmds:
      - |
        echo ""
        echo "How will you use the sandbox?"
        echo "  1) Demo/test - uses pre-built images from GitHub (fast)"
        echo "  2) Development - builds images locally (slower, allows code changes)"
        echo ""
        read -p "Choose [1/2] (default: 1): " BUILD_CHOICE
        if [ "$BUILD_CHOICE" = "2" ]; then
          echo "dev" > .sandbox-mode
          echo "Development mode selected - images will be built locally"
        else
          echo "demo" > .sandbox-mode
          echo "Demo mode selected - using pre-built images"
        fi
    silent: true

  # Let op bij het aanpassen: `sed -i ''` is BSD/macOS-syntax. GNU sed (Linux, en dus
  # de dev-server) leest die lege string als bestandsnaam en faalt, waardoor de
  # dev-mode daar stil niets deed en de sandbox alsnog de gepubliceerde images pakte.
  # `sed -i.bak` werkt op allebei; de .bak-bestanden ruimen we onderaan op.
  sandbox:configure-local-images:
    desc: "Patch overlay files to use locally built images"
    cmds:
      - |
        # SANDBOX_MODE uit de omgeving wint, zodat een onbewaakte installatie dev-mode
        # kan kiezen zonder ask-build-mode (dat is interactief).
        MODE="${SANDBOX_MODE:-$(cat .sandbox-mode 2>/dev/null || echo demo)}"
        if [ "$MODE" != "dev" ]; then
          exit 0
        fi

        echo "Configuring overlays for local images..."

        task sandbox:configure-operations-manager-image

        # CMP sidecar in ArgoCD deployment: use local image + Never
        ARGO_DEPLOY="bootstrap/rig-system/kustomize/overlays/sandboxed-local/argocd-deployment.yaml"
        sed -i.bak 's|image: ghcr.io/minbzk/base-images/rig-cmp-argo-kustomize-sops:latest|image: rig-cmp-argo-kustomize-sops:latest|' "$ARGO_DEPLOY"
        sed -i.bak 's|imagePullPolicy: Always|imagePullPolicy: Never|' "$ARGO_DEPLOY"

        # CMP sidecar kustomize patch: Always -> Never
        KUST="bootstrap/rig-system/kustomize/overlays/sandboxed-local/kustomization.yaml"
        sed -i.bak 's|value: Always|value: Never|' "$KUST"

        # CMP sidecar in shared sops-plugin component: use local image + Never
        CMP_COMPONENT="bootstrap/rig-system/kustomize/components/sops-plugin/kustomization.yaml"
        sed -i.bak -E 's|^( *)image: .*rig-cmp-argo-kustomize-sops.*$|\1image: rig-cmp-argo-kustomize-sops:latest|' "$CMP_COMPONENT"
        sed -i.bak 's|imagePullPolicy: Always|imagePullPolicy: Never|' "$CMP_COMPONENT"

        # .bak-bestanden van de portable sed-aanroepen opruimen.
        find bootstrap infrastructure -name "*.yaml.bak" -delete 2>/dev/null || true

        echo "Overlays configured for local images"
    silent: true

  # Draait bij elke deploy, zie docs/sandbox/sandbox-kind-registry.md.
  sandbox:configure-operations-manager-image:
    desc: "Zet de operations-manager-overlay op het image van deze commit in de registry"
    cmds:
      - |
        OM_PATCH="bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local/patches/deployment.yaml"
        sed -i.bak -E 's|^( *)image: .*operations-manager.*$|\1image: {{.SANDBOX_OM_IMAGE}}|' "$OM_PATCH"
        rm -f "$OM_PATCH.bak"
        echo "Overlay wijst naar {{.SANDBOX_OM_IMAGE}}"
    silent: true

  sandbox:renew-wildcard-cert:
    desc: "Renew the *.sandbox.rijksapp.dev wildcard Let's Encrypt cert (every ~90 days). See docs/sandbox/sandbox-wildcard-cert-renewal.md."
    cmds:
      - scripts/renew-sandbox-cert.sh

  sandbox:import-wildcard-cert:
    desc: "Import wildcard TLS certificate for *.sandbox.rijksapp.dev"
    cmds:
      - |
        echo "Importing wildcard TLS certificate..."

        CERT_DIR="security/tls/sandbox-wildcard"
        if [ ! -f "$CERT_DIR/fullchain.pem" ] || [ ! -f "$CERT_DIR/privkey.pem" ]; then
          echo "Certificate files not found in $CERT_DIR/"
          echo "Run 'task sandbox:decrypt-wildcard-cert' first, or place PEM files manually."
          exit 1
        fi

        kubectl create secret tls sandbox-wildcard-tls \
          --cert="$CERT_DIR/fullchain.pem" \
          --key="$CERT_DIR/privkey.pem" \
          -n rig-system \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "Wildcard TLS certificate imported as sandbox-wildcard-tls"

        # Wire the wildcard as nginx's default certificate so every tenant-namespace
        # ingress (which cannot reference the rig-system secret) serves a trusted cert
        # instead of nginx's self-signed fallback. Idempotent: only patches when the
        # flag is absent, so re-runs and any other mechanism that already set it are safe.
        if ! kubectl -n ingress-nginx get deployment ingress-nginx-controller \
             -o jsonpath='{.spec.template.spec.containers[0].args}' 2>/dev/null | grep -q 'default-ssl-certificate'; then
          echo "Setting nginx default certificate to rig-system/sandbox-wildcard-tls..."
          kubectl -n ingress-nginx patch deployment ingress-nginx-controller --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--default-ssl-certificate=rig-system/sandbox-wildcard-tls"}]'
          kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=120s
        else
          echo "nginx default certificate already configured"
        fi
    silent: true

  sandbox:generate-argocd-tls:
    desc: "Genereer de CA en het servercertificaat waarmee argocd-server TLS serveert"
    cmds:
      - |
        # Kind heeft geen service-CA; de sandbox tekent zelf. keyUsage op de CA is
        # verplicht: zonder keyCertSign weigert Python de certificaatketen.
        CERT_DIR="security/tls/sandbox-argocd"
        mkdir -p "$CERT_DIR"

        if [ ! -f "$CERT_DIR/ca.crt" ] || [ ! -f "$CERT_DIR/ca.key" ]; then
          echo "Generating ArgoCD CA..."
          openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
            -keyout "$CERT_DIR/ca.key" -out "$CERT_DIR/ca.crt" \
            -subj "/CN=sandbox-argocd-ca" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
        fi

        echo "Generating argocd-server certificate..."
        SAN="DNS:argocd-server,DNS:argocd-server.rig-system,DNS:argocd-server.rig-system.svc,DNS:argocd-server.rig-system.svc.cluster.local,DNS:argo.sandbox.rijksapp.dev"
        openssl req -newkey rsa:2048 -nodes \
          -keyout "$CERT_DIR/tls.key" -out "$CERT_DIR/tls.csr" \
          -subj "/CN=argocd-server" -addext "subjectAltName=$SAN" \
          -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
          -addext "extendedKeyUsage=serverAuth"
        openssl x509 -req -in "$CERT_DIR/tls.csr" -days 825 \
          -CA "$CERT_DIR/ca.crt" -CAkey "$CERT_DIR/ca.key" -CAcreateserial \
          -out "$CERT_DIR/tls.crt" -copy_extensions copyall
        rm -f "$CERT_DIR/tls.csr"

        # argocd-server leest zijn servercertificaat uit dit secret; zonder secret maakt
        # hij er zelf een die niemand kan toetsen.
        kubectl create secret tls argocd-server-tls \
          --cert="$CERT_DIR/tls.crt" --key="$CERT_DIR/tls.key" \
          -n rig-system --dry-run=client -o yaml | kubectl apply -f -

        # De bundel die de operations-manager mount (ARGOCD_CA_BUNDLE).
        kubectl create configmap argocd-ca-bundle \
          --from-file=ca.crt="$CERT_DIR/ca.crt" \
          -n rig-system --dry-run=client -o yaml | kubectl apply -f -

        echo "ArgoCD TLS material applied (argocd-server-tls, argocd-ca-bundle)"
    silent: true

  sandbox:generate-age-key:
    desc: "Generate AGE key for sandbox SOPS encryption (security/sandbox-key.txt)"
    cmds:
      - |
        if [[ -f "security/sandbox-key.txt" ]]; then
          echo "AGE key already exists: security/sandbox-key.txt"
          echo "Current public key: $(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')"
          echo "To generate a new key, first remove the existing security/sandbox-key.txt file"
          exit 0
        fi

        if ! command -v age-keygen &> /dev/null; then
          echo "age-keygen is not installed. Please install age or add it to your PATH."
          echo "  MacOS: brew install age"
          echo "  Linux: apt-get install age or download from https://github.com/FiloSottile/age"
          exit 1
        fi

        mkdir -p security

        echo "Generating new AGE key for sandbox SOPS encryption..."
        age-keygen -o security/sandbox-key.txt

        PUBLIC_KEY=$(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')

        echo ""
        echo "AGE key generated successfully!"
        echo "Key saved to: security/sandbox-key.txt"
        echo "Public key: $PUBLIC_KEY"
    silent: true

  # CLUSTER_TYPE/CLUSTER_FOLDER/RIG_NAMESPACE staan hier letterlijk en komen bewust NIET uit
  # .env-taskfile-current. Dat bestand wordt via `dotenv:` ingelezen bij het *parsen* van
  # de Taskfile, terwijl sandbox:setup het pas in zijn eigen eerste stap aanmaakt. Op een
  # verse checkout draaide de hele run daardoor met lege waarden: de secrets belandden in
  # de bovenliggende overlays/-map, de "bestaat al"-check zag daar de .sops.yaml van een
  # andere cluster, sloeg het genereren over, en setup struikelde later over een
  # ontbrekend postgres-admin-secret. Deze taken zijn per definitie sandboxed-local, dus
  # hoeven ze dat niet uit de omgeving te halen. Staat select-cluster nog op een ander
  # cluster, dan leest de run diens waarden: zo kregen alle sandbox-secrets
  # rig-prd-operations als namespace.
  sandbox:generate-infrastructure-secrets:
    desc: "Generate SOPS-encrypted infrastructure secrets for sandboxed-local cluster"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "infrastructure"
          TEMPLATES_DIR: "infrastructure/bootstrap/infrastructure/secrets/templates"
          OUTPUT_DIR: "infrastructure/bootstrap/infrastructure/secrets/config/overlays"
          CLUSTER_TYPE: "sandboxed-local"
          CLUSTER_FOLDER: "sandboxed-local"
          RIG_NAMESPACE: "rig-system"
          KEY_FILE: "security/sandbox-key.txt"
          FIXED_PASSWORD: "admin1234"

  sandbox:generate-bootstrap-secrets:
    desc: "Generate SOPS-encrypted bootstrap secrets for sandboxed-local cluster"
    cmds:
      - task: _generate-secrets-shared
        vars:
          MODE: "bootstrap"
          TEMPLATES_DIR: "bootstrap/rig-system/kustomize/secrets/templates"
          OUTPUT_DIR: "bootstrap/rig-system/kustomize/overlays"
          CLUSTER_TYPE: "sandboxed-local"
          CLUSTER_FOLDER: "sandboxed-local"
          RIG_NAMESPACE: "rig-system"
          KEY_FILE: "security/sandbox-key.txt"
          FIXED_PASSWORD: "admin1234"

  sandbox:generate-env-secrets:
    desc: "Generate SOPS-encrypted env secrets for sandbox operations-manager"
    vars:
      ENV_FILE: 'operations-manager/python/.env.sandboxed-local.secrets'
      OUTPUT_DIR: 'bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local'
      SECRET_NAME: 'operations-manager-env-secrets'
      NAMESPACE: '{{default "rig-system" .RIG_NAMESPACE}}'
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      - |
        if [ ! -f "security/sandbox-key.txt" ]; then
          echo "Sandbox AGE key not found: security/sandbox-key.txt"
          echo "Run 'task sandbox:generate-age-key' first"
          exit 1
        fi

        SECRET_FILE="{{.OUTPUT_DIR}}/{{.SECRET_NAME}}.yaml"
        if [ -f "$SECRET_FILE" ]; then
          echo "SOPS-encrypted env secrets already exist: $SECRET_FILE"
          echo "To regenerate, delete the file first"
          exit 0
        fi

        echo "Generating SOPS-encrypted env secrets for sandbox..."
        mkdir -p "{{.OUTPUT_DIR}}"

        cat > "$SECRET_FILE" << 'EOF'
        apiVersion: v1
        kind: Secret
        metadata:
          name: operations-manager-env-secrets
          namespace: rig-system
        type: Opaque
        stringData:
          OIDC_CLIENT_SECRET: ""
          KEYCLOAK_MASTER_OIDC_CLIENT_SECRET: ""
          # Dezelfde waarden als de defaults in opi/core/config.py, dus voor OPI
          # verandert hier niets. Ze staan hier omdat de nachtelijke back-up van de
          # platformdatabase (postgresql/database/base/platform-backup-cronjob.yaml) ze
          # met secretKeyRef uit dit geheim leest, net als op productie.
          BACKUP_S3_ENDPOINT: "minio.rig-backup-destination.svc:9000"
          BACKUP_S3_ACCESS_KEY: "backup-admin"
          BACKUP_S3_SECRET_KEY: "backup-secret-key-local"
        EOF

        # Overlay values from secrets file if it exists and has content
        if [ -f "{{.ENV_FILE}}" ] && grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | grep -q .; then
          grep -v '^[[:space:]]*#' "{{.ENV_FILE}}" | grep -v '^[[:space:]]*$' | while IFS='=' read -r key value; do
            value=$(echo "$value" | sed 's/^["'\'']//' | sed 's/["'\'']$//')
            # Replace the empty value in the template with the actual value
            sed "s|$key: \"\"|$key: \"$value\"|" "$SECRET_FILE" > "$SECRET_FILE.tmp" && mv "$SECRET_FILE.tmp" "$SECRET_FILE"
            echo "  Set: $key"
          done
        else
          echo "No secrets file found or empty, generating with empty values"
        fi

        AGE_PUBLIC_KEY="$(sed -n '2p' security/sandbox-key.txt | sed 's/# public key: //')"
        sops --encrypt --output-type yaml --age "$AGE_PUBLIC_KEY" --in-place "$SECRET_FILE"
        echo "SOPS-encrypted secret generated: $SECRET_FILE"
    silent: true

  sandbox:ask-sso:
    desc: "Ask whether to configure SSO (saves answer for later)"
    cmds:
      - |
        # Reuse existing answer if available
        if [ -f ".sandbox-sso" ]; then
          SSO_VALUE=$(cat .sandbox-sso)
          if [ "$SSO_VALUE" = "no" ] || [ -z "$SSO_VALUE" ]; then
            echo "SSO configuration: skipped (previously declined)"
          else
            echo "SSO configuration: already configured (client secret on file)"
          fi
          echo "To reconfigure, delete .sandbox-sso and re-run"
          exit 0
        fi

        echo ""
        echo "========================================="
        echo "SSO Configuration (Optional)"
        echo "========================================="
        echo ""
        echo "The sandbox can use the production Keycloak (keycloak.rijksapp.nl) for real"
        echo "SSO-Rijk authentication. This requires the client secret for the"
        echo "'development-clusters' client in the production rig-platform realm."
        echo ""
        echo "Without SSO, the sandbox still works using a local Keycloak admin user."
        echo "Applications deployed in the sandbox will use Keycloak but cannot use SSO."
        echo ""
        # SANDBOX_SSO from the env answers this non-interactively (e.g. SANDBOX_SSO=no).
        # SANDBOX_NONINTERACTIVE implies "no": an unattended run that sets only that flag
        # would otherwise still block here, waiting for an answer nobody is there to give.
        if [ -n "${SANDBOX_SSO:-}" ]; then
          CONFIGURE_SSO="$SANDBOX_SSO"
          echo "Do you want to configure SSO? [y/N]: ${CONFIGURE_SSO} (from SANDBOX_SSO)"
        elif [ "${SANDBOX_NONINTERACTIVE:-}" = "true" ]; then
          CONFIGURE_SSO="n"
          echo "Do you want to configure SSO? [y/N]: n (SANDBOX_NONINTERACTIVE)"
        else
          printf "Do you want to configure SSO? [y/N]: "
          read -r CONFIGURE_SSO
        fi

        if [ "$CONFIGURE_SSO" != "y" ] && [ "$CONFIGURE_SSO" != "Y" ]; then
          echo "no" > .sandbox-sso
          echo "Skipping SSO configuration."
          echo "You can configure it later by running: task sandbox:configure-sso"
          exit 0
        fi

        echo ""
        echo "Enter the client secret for the 'development-clusters' client from"
        echo "the production Keycloak (keycloak.rijksapp.nl > rig-platform realm > Clients):"
        echo ""
        printf "Client secret: "
        read -rs CLIENT_SECRET
        echo ""

        if [ -z "$CLIENT_SECRET" ]; then
          echo "no" > .sandbox-sso
          echo "No secret provided. Skipping SSO configuration."
          exit 0
        fi

        echo "$CLIENT_SECRET" > .sandbox-sso
        echo "SSO client secret saved"
    silent: true

  sandbox:apply-sso:
    desc: "Apply SSO configuration from earlier prompt"
    cmds:
      - |
        SSO_VALUE=$(cat .sandbox-sso 2>/dev/null || echo "no")
        if [ "$SSO_VALUE" = "no" ] || [ -z "$SSO_VALUE" ]; then
          exit 0
        fi

        ENV_FILE="operations-manager/python/.env.sandboxed-local.secrets"
        cat > "$ENV_FILE" << SECRETS_EOF
        # Sandbox SSO secrets (generated by sandbox:apply-sso)
        # This file is gitignored - do not commit
        KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=$SSO_VALUE
        SECRETS_EOF

        echo "SSO secret saved to: $ENV_FILE"
    silent: true

  sandbox:configure-sso:
    desc: "Configure SSO for sandbox (standalone - asks and applies immediately)"
    cmds:
      - task: sandbox:ask-sso
      - task: sandbox:apply-sso
      - task: sandbox:generate-env-secrets
    silent: true

  sandbox:wait-ready:
    desc: "Wait for all sandbox services to be deployed and healthy"
    cmds:
      - |
        echo "Waiting for infrastructure to be deployed by ArgoCD..."
        echo ""

        # Force ArgoCD to refresh applications (clears any cached comparison errors)
        for APP in sandbox-infrastructure user-applications; do
          kubectl annotate application -n {{.RIG_NAMESPACE}} "$APP" \
            argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true
        done

        # Wait for sandbox-infrastructure to sync (up to 5 minutes)
        MAX_ATTEMPTS=60
        for i in $(seq 1 $MAX_ATTEMPTS); do
          SYNC_STATUS=$(kubectl get application -n {{.RIG_NAMESPACE}} sandbox-infrastructure -o jsonpath='{.status.sync.status}' 2>/dev/null)
          HEALTH_STATUS=$(kubectl get application -n {{.RIG_NAMESPACE}} sandbox-infrastructure -o jsonpath='{.status.health.status}' 2>/dev/null)

          if [ "$SYNC_STATUS" = "Synced" ] && [ "$HEALTH_STATUS" = "Healthy" ]; then
            echo "Infrastructure application: Synced + Healthy"
            break
          fi

          # If stuck with comparison error, force another refresh
          if [ "$SYNC_STATUS" = "Unknown" ] && [ $((i % 10)) -eq 0 ]; then
            echo "  Forcing ArgoCD refresh (sync status still Unknown)..."
            kubectl annotate application -n {{.RIG_NAMESPACE}} sandbox-infrastructure \
              argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true
          fi

          echo "  [$i/$MAX_ATTEMPTS] sync=$SYNC_STATUS health=$HEALTH_STATUS - waiting 5s..."
          sleep 5
        done

        if [ "$SYNC_STATUS" != "Synced" ]; then
          echo "WARNING: Infrastructure did not reach Synced state within timeout"
          echo "  Current: sync=$SYNC_STATUS health=$HEALTH_STATUS"
          echo "  Continuing anyway - services may still be starting..."
        fi

        echo ""
        echo "Waiting for Keycloak to be ready..."
        kubectl wait --for=condition=available deployment/keycloak -n {{.RIG_NAMESPACE}} --timeout=300s 2>/dev/null || {
          echo "WARNING: Keycloak deployment not available within timeout"
        }

        echo "Waiting for operations manager to be ready..."
        kubectl wait --for=condition=available deployment/operations-manager -n {{.RIG_NAMESPACE}} --timeout=300s 2>/dev/null || {
          echo "WARNING: Operations manager deployment not available within timeout"
        }

        echo ""
        echo "All services are deployed and available"
    silent: true

  sandbox:create-sops-age-secret:
    desc: "Create sops-age-key Kubernetes secret from sandbox AGE key"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      - |
        if [ ! -f "security/sandbox-key.txt" ]; then
          echo "security/sandbox-key.txt not found. Run 'task sandbox:generate-age-key' first."
          exit 1
        fi

        kubectl create secret generic sops-age-key \
          --from-file=key=security/sandbox-key.txt \
          -n rig-system \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "sops-age-key secret created in rig-system"

        # RON-namespace kan niet via GitOps (namespaced ArgoCD), handmatig aangemaakt.
        # Geen sops-age-key: ron-infrastructure rendert op de platform-plugin.
        kubectl apply -f - <<'EOF'
        apiVersion: v1
        kind: Namespace
        metadata:
          name: rig-ron
          labels:
            app.kubernetes.io/name: operations-ron
            app.kubernetes.io/component: mail
            app.kubernetes.io/part-of: rig-platform
            argocd.argoproj.io/managed-by: rig-system
        EOF

        echo "namespace rig-ron created"
    silent: true

  sandbox:create-git-signing-key-secret:
    desc: "Generate the sandbox GPG signing key and store it as a secret for OPI"
    cmds:
      - |
        KEY_FILE="security/sandbox-git-signing-key.asc"

        if [ ! -f "$KEY_FILE" ]; then
          echo "Generating sandbox GPG signing key: $KEY_FILE"
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          # In een trap: breekt gpg af, dan blijft de privesleutel niet in de keyring staan.
          trap 'rm -rf "$GNUPGHOME"' EXIT
          # Zonder passphrase: OPI importeert de sleutel zelf en kan er geen invoeren.
          gpg --batch --quiet --passphrase '' \
            --quick-generate-key "Operations Manager <operations-manager@example.com>" ed25519 sign never
          # umask om de redirect: zonder dat staat de privesleutel kort op 644.
          (umask 077; gpg --batch --quiet --armor --export-secret-keys > "$KEY_FILE")
        else
          echo "Sandbox GPG signing key already exists: $KEY_FILE"
        fi

        kubectl create secret generic operations-manager-git-signing-key \
          --from-file=signing-key.asc="$KEY_FILE" \
          -n {{.RIG_NAMESPACE}} \
          --dry-run=client -o yaml | kubectl apply -f -

        echo "operations-manager-git-signing-key secret created in {{.RIG_NAMESPACE}}"
    silent: true

  git-signing-key:public:
    desc: "Print the public key and fingerprint of OPI's git signing key (for ArgoCD signatureKeys)"
    cmds:
      - |
        SECRET=$(kubectl get secret operations-manager-git-signing-key -n {{.RIG_NAMESPACE}} \
          --ignore-not-found -o jsonpath='{.data.signing-key\.asc}')
        if [ -z "$SECRET" ]; then
          echo "No operations-manager-git-signing-key secret in {{.RIG_NAMESPACE}}: this cluster signs nothing."
          exit 1
        fi

        GNUPGHOME=$(mktemp -d)
        export GNUPGHOME
        chmod 700 "$GNUPGHOME"
        # In een trap: breekt gpg af, dan blijft de privesleutel niet in de keyring staan.
        trap 'rm -rf "$GNUPGHOME"' EXIT
        echo "$SECRET" | base64 -d | gpg --batch --quiet --import

        FINGERPRINT=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
        echo "fingerprint: $FINGERPRINT"
        echo ""
        gpg --batch --armor --export "$FINGERPRINT"
    silent: true

  argocd:trust-public-key:
    desc: "Trust an armored GPG public key in ArgoCD and require it on the app-of-apps AppProject"
    requires:
      vars:
        - KEY_FILE
    vars:
      DRY_RUN: '{{default "false" .DRY_RUN}}'
    cmds:
      - |
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          echo "🔍 Dry run: zou {{.KEY_FILE}} vertrouwen in argocd-gpg-keys-cm en in signatureKeys zetten"
          exit 0
        fi

        if ! kubectl get appproject zad-app-of-apps -n {{.RIG_NAMESPACE}} >/dev/null 2>&1; then
          echo "Geen AppProject zad-app-of-apps in {{.RIG_NAMESPACE}}: draai eerst 'task bootstrap-argo-system'."
          exit 1
        fi

        GNUPGHOME=$(mktemp -d)
        export GNUPGHOME
        chmod 700 "$GNUPGHOME"
        # In een trap: breekt gpg af, dan blijft er geen keyring staan.
        trap 'rm -rf "$GNUPGHOME"' EXIT
        # Een mislukte import valt door naar de fingerprint-guard, die de melding geeft.
        gpg --batch --quiet --import "{{.KEY_FILE}}" || true

        FINGERPRINT=$(gpg --batch --list-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
        # Guard: onbruikbare KEY_FILE zou signatureKeys wissen met exitcode 0.
        if [[ ! "$FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]; then
          echo "Geen bruikbare GPG-sleutel in {{.KEY_FILE}}: niets te vertrouwen."
          exit 1
        fi
        # ArgoCD valideert keyID als key ID (8 of 16 hex) en weigert een hele fingerprint.
        KEY_ID="${FINGERPRINT: -16}"
        # Een armored sleutel bevat geen aanhalingsteken of backslash, dus escapen van de
        # regeleindes volstaat voor de JSON-merge-patch hieronder.
        ARMORED=$(gpg --batch --armor --export "$FINGERPRINT" | awk '{printf "%s\\n", $0}')

        # ArgoCD leest vertrouwde sleutels uit deze ConfigMap; de operator laat hem staan.
        kubectl get configmap argocd-gpg-keys-cm -n {{.RIG_NAMESPACE}} >/dev/null 2>&1 ||
          kubectl create configmap argocd-gpg-keys-cm -n {{.RIG_NAMESPACE}}
        kubectl patch configmap argocd-gpg-keys-cm -n {{.RIG_NAMESPACE}} --type merge \
          -p "{\"data\":{\"$KEY_ID\":\"$ARMORED\"}}"

        # Voeg toe zonder anderen weg te gooien (beheerderssleutel en OPI-sleutel samen).
        # Lege CURRENT -> destructieve patch; stoppen in plaats van patchen.
        if ! CURRENT=$(kubectl get appproject zad-app-of-apps -n {{.RIG_NAMESPACE}} \
          -o jsonpath='{.spec.signatureKeys[*].keyID}'); then
          echo "Kan de huidige signatureKeys van zad-app-of-apps niet lezen: niets gepatcht."
          exit 1
        fi
        IDS=""
        for ID in $CURRENT $KEY_ID; do
          case " $IDS " in *" $ID "*) continue;; esac
          IDS="${IDS:+$IDS }$ID"
        done
        ENTRIES=$(echo "$IDS" | tr ' ' '\n' | awk 'NF {printf "%s{\"keyID\":\"%s\"}", (n++ ? "," : ""), $0}')
        kubectl patch appproject zad-app-of-apps -n {{.RIG_NAMESPACE}} --type merge \
          -p "{\"spec\":{\"signatureKeys\":[$ENTRIES]}}"

        echo "ArgoCD vertrouwt $KEY_ID en eist hem op AppProject zad-app-of-apps"
    silent: true

  argocd:trust-git-signing-key:
    desc: "Trust OPI's own git signing key in ArgoCD (reads the secret in the cluster)"
    vars:
      DRY_RUN: '{{default "false" .DRY_RUN}}'
    # Geen signing-key-secret: Task slaat de taak dan over. Via status, niet met exit 0: dat
    # stopt alleen de eerste stap, en de tweede faalt dan op het ontbrekende sleutelbestand.
    status:
      - |
        [ "{{.DRY_RUN}}" = "true" ] && exit 1
        SECRET=$(kubectl get secret operations-manager-git-signing-key -n {{.RIG_NAMESPACE}} \
          --ignore-not-found -o jsonpath='{.data.signing-key\.asc}')
        [ -z "$SECRET" ]
    cmds:
      - |
        if [[ "{{.DRY_RUN}}" == "true" ]]; then
          echo "🔍 Dry run: zou de sleutel uit secret operations-manager-git-signing-key vertrouwen"
          exit 0
        fi

        # Het ontbrekende secret is de status hierboven; komt de taak toch hier (task --force),
        # dan blijft FINGERPRINT leeg en kapt de guard daarop het af.
        SECRET=$(kubectl get secret operations-manager-git-signing-key -n {{.RIG_NAMESPACE}} \
          --ignore-not-found -o jsonpath='{.data.signing-key\.asc}')

        # security/ staat niet in git en bepaalt welke sleutel het cluster vertrouwt.
        mkdir -p security
        PUBLIC_FILE=security/opi-git-signing-public.asc

        GNUPGHOME=$(mktemp -d)
        export GNUPGHOME
        chmod 700 "$GNUPGHOME"
        # In een trap: breekt gpg af, dan blijft de privesleutel niet in de keyring staan.
        trap 'rm -rf "$GNUPGHOME"' EXIT
        # Zie de import in argocd:trust-public-key: de fingerprint-guard doet de melding.
        echo "$SECRET" | base64 -d | gpg --batch --quiet --import || true
        FINGERPRINT=$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')
        if [[ ! "$FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]; then
          echo "Het secret operations-manager-git-signing-key bevat geen bruikbare GPG-sleutel."
          exit 1
        fi
        gpg --batch --armor --export "$FINGERPRINT" > "$PUBLIC_FILE"
      - task: argocd:trust-public-key
        vars:
          KEY_FILE: security/opi-git-signing-public.asc
          DRY_RUN: '{{.DRY_RUN}}'
    silent: true

  sandbox:deploy-postgresql-direct:
    desc: "Deploy minimal PostgreSQL directly (pre-ArgoCD, just enough for Forgejo)"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      - |
        echo "Deploying minimal PostgreSQL cluster..."

        # Wait for CNPG webhook to be ready
        echo "Waiting for CNPG operator webhook to be ready..."
        kubectl wait --for=condition=Available --timeout=120s \
          deployment/cnpg-controller-manager -n cnpg-system
        sleep 5

        SECRETS_DIR="infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local"

        # Decrypt and apply the SOPS-encrypted secrets (same passwords ArgoCD will use later)
        echo "Applying SOPS-decrypted database credential secrets..."
        for SECRET in postgres-admin-secret forgejo-db-credentials-secret keycloak-db-credentials-secret; do
          SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" sops --decrypt "$SECRETS_DIR/${SECRET}.yaml.sops.yaml" | kubectl apply -f -
        done

        # Apply just the Cluster resource - ArgoCD will manage the full overlay later
        echo "Applying PostgreSQL Cluster resource..."
        kubectl apply -f infrastructure/bootstrap/infrastructure/postgresql/database/base/cluster.yaml

        echo "Waiting for PostgreSQL cluster to be ready..."
        until kubectl get cluster rig-db -n rig-system 2>/dev/null; do
          echo "  Waiting for Cluster resource to appear..."
          sleep 5
        done
        kubectl wait --for=condition=Ready cluster/rig-db -n rig-system --timeout=300s

        # Create individual databases (forgejo, keycloak) via CNPG Database CRD
        echo "Creating databases..."
        kubectl apply -f infrastructure/bootstrap/infrastructure/postgresql/database/base/databases.yaml

        echo "PostgreSQL cluster is ready with databases"
    silent: true

  sandbox:deploy-forgejo-direct:
    desc: "Deploy Forgejo directly (pre-ArgoCD bootstrap)"
    cmds:
      - |
        echo "Deploying Forgejo..."
        kustomize build infrastructure/bootstrap/infrastructure/forgejo/controller/overlays/sandboxed-local | kubectl apply -f -
        echo "Forgejo StatefulSet, Service, and Ingress applied"
    silent: true

  sandbox:wait-forgejo:
    desc: "Wait for Forgejo pod to be healthy"
    cmds:
      - |
        echo "Waiting for Forgejo pod to be ready..."
        kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=300s 2>/dev/null || {
          echo "Pod not found yet, waiting..."
          sleep 15
          kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=300s
        }
        echo "Forgejo is ready"
    silent: true

  sandbox:init-forgejo:
    desc: "Initialize Forgejo: create admin user and repositories"
    cmds:
      - |
        echo "Initializing Forgejo..."

        # A Ready pod can still be migrating its database; then user create fails with
        # "no such table: user". migrate is idempotent and returns once the schema is there.
        kubectl exec -n rig-system forgejo-0 -- forgejo migrate

        # Create admin user via kubectl exec (username "admin" is reserved in Forgejo)
        echo "Creating rig-admin user..."
        if ! OUT=$(kubectl exec -n rig-system forgejo-0 -- forgejo admin user create \
          --admin --username rig-admin --password admin1234 \
          --email admin@example.com --must-change-password=false 2>&1); then
          case "$OUT" in
            *"already exists"*) echo "rig-admin user already exists" ;;
            *) echo "$OUT"; exit 1 ;;
          esac
        fi

        # Wait a moment for the user to be fully created
        sleep 2

        # Create repositories via Forgejo API
        echo "Creating repositories..."
        for REPO in zad-projects zad-argo-user-applications zad-argo-infrastructure zad-deployments; do
          echo "  Creating: $REPO"
          kubectl exec -n rig-system forgejo-0 -- wget -q -O- \
            --header="Content-Type: application/json" \
            --post-data="{\"name\":\"$REPO\",\"private\":true,\"auto_init\":true,\"default_branch\":\"main\"}" \
            "http://rig-admin:admin1234@localhost:3000/api/v1/user/repos" 2>/dev/null || echo "  $REPO may already exist"

          # Bestaande repositories omzetten naar privé (busybox-wget kan geen PATCH doen)
          echo "  Marking private: $REPO"
          kubectl exec -n rig-system forgejo-0 -- curl -sf -X PATCH \
            -H "Content-Type: application/json" \
            -d '{"private":true}' \
            "http://rig-admin:admin1234@localhost:3000/api/v1/repos/rig-admin/$REPO" \
            >/dev/null 2>&1 || echo "  Could not mark $REPO private"
        done

        # Verify git repos exist on disk, manually init if auto_init failed
        # (The rootless image may fail to init bare repos if the repository root didn't exist yet)
        echo "Verifying git repositories on disk..."
        kubectl exec -n rig-system forgejo-0 -- sh -c '
          REPO_ROOT="/var/lib/gitea/git/repositories/rig-admin"
          mkdir -p "$REPO_ROOT"
          # Ensure /tmp/gitea exists (rootless image sets TMPDIR=/tmp/gitea)
          mkdir -p /tmp/gitea
          for REPO in zad-projects zad-argo-user-applications zad-argo-infrastructure zad-deployments; do
            REPO_PATH="$REPO_ROOT/${REPO}.git"
            if [ ! -d "$REPO_PATH/refs" ]; then
              echo "  Initializing bare repo on disk: $REPO"
              git init --bare "$REPO_PATH" 2>/dev/null
              git -C "$REPO_PATH" symbolic-ref HEAD refs/heads/main
              # Create initial commit in a temp work dir
              WORK="/tmp/gitea/init-${REPO}"
              rm -rf "$WORK"
              git clone "$REPO_PATH" "$WORK" 2>/dev/null
              cd "$WORK"
              git checkout -b main 2>/dev/null
              git config user.email "admin@example.com"
              git config user.name "rig-admin"
              echo "# ${REPO}" > README.md
              git add README.md
              git commit -m "Initial commit" 2>/dev/null
              git push origin main 2>/dev/null
              cd /
              rm -rf "$WORK"
            else
              echo "  $REPO: OK (already initialized)"
            fi
          done
        '

        # The bootstrap folder that keeps user-applications from rendering empty; why is in
        # bootstrap/argo-user-applications/_bootstrap/user-applications-never-empty.yaml.
        echo "Seeding sandboxed-local/_bootstrap in zad-argo-user-applications..."
        SEED=bootstrap/argo-user-applications/_bootstrap
        FILES=""
        for f in "$SEED"/*.yaml; do
          FILES="$FILES{\"operation\":\"create\",\"path\":\"sandboxed-local/_bootstrap/$(basename "$f")\",\"content\":\"$(base64 < "$f" | tr -d '\n')\"},"
        done
        kubectl exec -n rig-system forgejo-0 -- curl -sf -X POST \
          -H "Content-Type: application/json" \
          -d "{\"message\":\"Bootstrap folder that keeps user-applications from rendering empty\",\"branch\":\"main\",\"files\":[${FILES%,}]}" \
          "http://rig-admin:admin1234@localhost:3000/api/v1/repos/rig-admin/zad-argo-user-applications/contents" \
          >/dev/null 2>&1 || echo "  sandboxed-local/_bootstrap may already exist"

        echo ""
        echo "Forgejo initialized with rig-admin/admin1234 and 4 repositories"
    silent: true

  sandbox:sync:
    desc: "Sync infrastructure/ directory to Forgejo zad-argo-infrastructure repo"
    cmds:
      - |
        echo "Syncing infrastructure/ to Forgejo zad-argo-infrastructure..."

        FORGEJO_REPO="https://rig-admin:admin1234@forgejo.sandbox.rijksapp.dev/rig-admin/zad-argo-infrastructure.git"
        TEMP_DIR=$(mktemp -d)

        # Clone the repo (use HTTPS to avoid credential stripping on HTTP->HTTPS redirect)
        git clone "$FORGEJO_REPO" "$TEMP_DIR" 2>/dev/null || {
          echo "Could not clone via ingress, trying in-cluster port-forward..."
          # Forgejo pod may have restarted after init-forgejo (OOM, liveness probe),
          # so wait for it to be Ready before attempting port-forward
          echo "Waiting for Forgejo pod to be ready..."
          kubectl wait --for=condition=Ready pod/forgejo-0 -n rig-system --timeout=120s
          # Fallback: use kubectl port-forward
          kubectl port-forward -n rig-system svc/forgejo 3000:3000 &
          PF_PID=$!
          sleep 3
          FORGEJO_REPO="http://rig-admin:admin1234@localhost:3000/rig-admin/zad-argo-infrastructure.git"
          git clone "$FORGEJO_REPO" "$TEMP_DIR"
          kill $PF_PID 2>/dev/null || true
        }

        # Sync infrastructure directory content (strip infrastructure/ prefix)
        # De sandbox-secrets staan niet in git (.gitignore:41): deze protect-regel laat ze aan
        # de kant van het cluster staan bij --delete, en vanaf een setup gaan ze wel mee.
        rsync -av --delete --exclude='.git' \
          --filter='P /bootstrap/infrastructure/secrets/config/overlays/sandboxed-local/***' \
          infrastructure/ "$TEMP_DIR/"

        # Commit and push
        cd "$TEMP_DIR"
        git add -A
        git diff --cached --quiet || {
          git -c user.name="sandbox-sync" -c user.email="sync@sandbox" commit -m "Sync infrastructure from local"
          git push origin main
          echo "Changes pushed to Forgejo"
        }
        cd -

        # Clean up
        rm -rf "$TEMP_DIR"

        # Trigger ArgoCD to refresh the infrastructure application
        echo "Triggering ArgoCD refresh for sandbox-infrastructure..."
        kubectl annotate application -n {{.RIG_NAMESPACE}} sandbox-infrastructure \
          argocd.argoproj.io/refresh=normal --overwrite 2>/dev/null || true

        echo "Infrastructure sync complete"
    silent: true

  sandbox:import-project:
    desc: "Import production project files into sandbox Forgejo (re-encrypts secrets, transforms cluster config)"
    cmds:
      - |
        if [ -z "{{.CLI_ARGS}}" ]; then
          echo "Usage: task sandbox:import-project -- <project-name> [project-name...]"
          echo ""
          echo "Examples:"
          echo "  task sandbox:import-project -- amt-dev"
          echo "  task sandbox:import-project -- amt-dev wies regel-k4c"
          echo ""
          echo "Available projects:"
          ls "{{.IMPORT_SOURCE_DIR}}" 2>/dev/null | sed 's/.yaml$//' | column
          exit 1
        fi

        OUTPUT_DIR=$(mktemp -d)

        # Run migration script
        echo "Transforming project files..."
        cd operations-manager/python
        # --probe-image staat er expliciet in en niet als kale vlag. Hij heeft een
        # OPTIONELE waarde (nargs="?"), dus een kale --probe-image gevolgd door
        # projectnamen slikt de eerste naam op als waarde: elk image wordt dan die
        # projectnaam en dat project verdwijnt uit de uitvoer. Zonder de vlag blijven
        # de productie-images EN de productie-resources staan, en dan past het niet
        # op een kind-cluster.
        uv run python -m scripts.migrate_project_to_sandbox \
          --source-dir "{{.IMPORT_SOURCE_DIR}}" \
          --output-dir "$OUTPUT_DIR" \
          --probe-image "{{.PROBE_IMAGE}}" \
          {{if .SANDBOX_PUBLIC_KEY}}--sandbox-public-key "{{.SANDBOX_PUBLIC_KEY}}"{{end}} \
          {{.CLI_ARGS}}

        if [ $? -ne 0 ]; then
          echo "Migration script failed"
          rm -rf "$OUTPUT_DIR"
          exit 1
        fi

        # Check if any files were produced
        if [ -z "$(ls -A "$OUTPUT_DIR" 2>/dev/null)" ]; then
          echo "No output files produced"
          rm -rf "$OUTPUT_DIR"
          exit 1
        fi

        # Clone zad-projects from Forgejo and push transformed files
        echo ""
        echo "Pushing to Forgejo zad-projects..."
        FORGEJO_REPO="https://rig-admin:admin1234@forgejo.sandbox.rijksapp.dev/rig-admin/zad-projects.git"
        CLONE_DIR=$(mktemp -d)

        git clone "$FORGEJO_REPO" "$CLONE_DIR" 2>/dev/null || {
          echo "Failed to clone from Forgejo. Is the sandbox running and forgejo.sandbox.rijksapp.dev reachable?"
          rm -rf "$OUTPUT_DIR" "$CLONE_DIR"
          exit 1
        }

        # Ensure projects/ directory exists in the repo
        mkdir -p "$CLONE_DIR/projects"

        # Copy transformed files
        cp "$OUTPUT_DIR"/*.yaml "$CLONE_DIR/projects/"

        # Commit and push
        cd "$CLONE_DIR"
        git add -A
        git diff --cached --quiet || {
          IMPORTED=$(ls "$OUTPUT_DIR" | sed 's/.yaml$//' | tr '\n' ', ' | sed 's/,$//')
          git -c user.name="sandbox-import" -c user.email="import@sandbox" \
            commit -m "Import production projects: $IMPORTED"
          git push origin main
          echo "Pushed to Forgejo: $IMPORTED"
        }
        cd -

        # Clean up
        rm -rf "$OUTPUT_DIR" "$CLONE_DIR"

        echo ""
        echo "Import complete. Trigger a project refresh in OPI to process the changes."
    silent: true
    vars:
      IMPORT_SOURCE_DIR: '{{.IMPORT_SOURCE_DIR | default "/Users/robbertuittenbroek/IdeaProjects/rig-cluster-test-git-repositories/rig-cluster-projects-github/projects"}}'
      # Elk component krijgt deze image en het probe-resourceprofiel; productiewaarden
      # passen niet op een kind-cluster.
      PROBE_IMAGE: '{{.PROBE_IMAGE | default "ghcr.io/minbzk/base-images/e2e-allservices:latest"}}'
      # Leeg = hersleutel naar security/sandbox-key.txt (de sandbox op deze machine).
      # Gevuld met de PUBLIEKE sleutel van een ander cluster = hersleutel daarheen, en
      # de private helft blijft daar. Ophalen met:
      #   kubectl --context <ctx> -n rig-system get secret sops-age-key \
      #     -o jsonpath='{.data.key}' | base64 -d | grep 'public key'
      SANDBOX_PUBLIC_KEY: '{{.SANDBOX_PUBLIC_KEY | default ""}}'

  sandbox:update-dns:
    desc: "Configure dnsmasq to resolve *.sandbox.rijksapp.dev to 127.0.0.1"
    cmds:
      - |
        DOMAIN="sandbox.rijksapp.dev"
        DNSMASQ_ENTRY="address=/.${DOMAIN}/127.0.0.1"

        # Find dnsmasq config
        DNSMASQ_CONF=""
        if [ -f "/opt/homebrew/etc/dnsmasq.conf" ]; then
          DNSMASQ_CONF="/opt/homebrew/etc/dnsmasq.conf"
        elif [ -f "/usr/local/etc/dnsmasq.conf" ]; then
          DNSMASQ_CONF="/usr/local/etc/dnsmasq.conf"
        fi

        if [ -z "$DNSMASQ_CONF" ]; then
          echo "dnsmasq not found. Install with: brew install dnsmasq"
          echo "Then run: brew services start dnsmasq"
          exit 1
        fi

        # Check if dnsmasq already has the entry
        if grep -qF "$DNSMASQ_ENTRY" "$DNSMASQ_CONF" 2>/dev/null; then
          echo "dnsmasq already configured for *.${DOMAIN}"
        else
          echo "Adding wildcard DNS entry to dnsmasq..."
          echo "$DNSMASQ_ENTRY" >> "$DNSMASQ_CONF"
          sudo brew services restart dnsmasq
          echo "dnsmasq updated and restarted"
        fi

        # Create macOS resolver file
        RESOLVER_FILE="/etc/resolver/${DOMAIN}"
        if [ -f "$RESOLVER_FILE" ]; then
          echo "Resolver file already exists: $RESOLVER_FILE"
        else
          echo "Creating resolver file (requires sudo)..."
          sudo mkdir -p /etc/resolver
          echo "nameserver 127.0.0.1" | sudo tee "$RESOLVER_FILE" > /dev/null
          echo "Resolver file created: $RESOLVER_FILE"
        fi

        echo ""
        echo "*.${DOMAIN} now resolves to 127.0.0.1"
    silent: true

  sandbox:build-local-images-if-dev:
    desc: "Bouw de images die dev-mode lokaal verwacht (no-op in demo-mode)"
    internal: true
    cmds:
      - |
        # SANDBOX_MODE uit de omgeving wint, zodat een onbewaakte installatie dev-mode
        # kan kiezen zonder ask-build-mode (dat is interactief).
        MODE="${SANDBOX_MODE:-$(cat .sandbox-mode 2>/dev/null || echo demo)}"
        if [ "$MODE" != "dev" ]; then
          echo "Demo-mode: images komen uit de registry, niet lokaal gebouwd."
          exit 0
        fi
        # Beide, niet alleen operations-manager: configure-local-images zet de
        # CMP-sidecar op een lokale tag met imagePullPolicy Never. Ontbreekt die, dan
        # blijft argocd-repo-server op ErrImageNeverPull staan en komt ArgoCD niet op.
        task sandbox:build-cmp-image
        task sandbox:build-operations-manager-image
    silent: true

  sandbox:build-builder:
    desc: "Zorg voor een buildx-builder met een geheugengrens (gedeelde server)"
    summary: |
      Een build zonder grens kan het hele werkgeheugen pakken en trekt dan de andere
      sessies en het kind-cluster mee om. De standaard-builder (driver `docker`) draait
      in de docker-daemon en kent geen grens; een `docker-container`-builder wel.

      Die builder houdt daarnaast zijn eigen buildcache vast tussen builds door. Dat is
      wat de drie apt-rondes uit operations-manager/Dockerfile na de eerste build
      overslaat, ook wanneer de pakketspiegels slecht bereikbaar zijn.

      SANDBOX_BUILD_MEMORY overschrijft de grens (standaard {{.SANDBOX_BUILD_MEMORY}}).
    vars:
      BUILDER_CONTAINER: 'buildx_buildkit_{{.SANDBOX_BUILDER_NAME}}0'
    cmds:
      - |
        # numfmt wil hoofdletters (4G), docker accepteert beide - vandaar de tr.
        WANT="$(echo "{{.SANDBOX_BUILD_MEMORY}}" | tr '[:lower:]' '[:upper:]' | numfmt --from=iec)"
        STATE="$(docker inspect {{.BUILDER_CONTAINER}} 2>/dev/null | jq -r '"\(.[0].HostConfig.Memory) \(.[0].HostConfig.NetworkMode)"' 2>/dev/null || echo "")"
        # De container in de daemon is niet waar `docker buildx build --builder` kijkt: die
        # leest de buildx-store van de SESSIE (~/.docker/buildx). Op de gedeelde server heeft
        # elke sessie een eigen store bij dezelfde daemon, dus een container die er staat kan
        # in deze sessie onbekend zijn - en dan valt de build om met 'no builder found' nadat
        # deze taak "staat klaar" meldde. Daarom beide voorwaarden.
        if ! docker buildx inspect {{.SANDBOX_BUILDER_NAME}} >/dev/null 2>&1 || [ "$STATE" != "$WANT host" ]; then
          # Bestaat hij met een andere (of geen) grens, dan is opnieuw aanmaken de enige
          # manier: een draaiende buildkit-container krijgt geen nieuwe limiet. Staat hij
          # goed maar kent deze sessie hem niet, dan neemt `create --bootstrap` de bestaande
          # container met dezelfde naam over (exit 0) en blijft de buildcache staan.
          if [ -n "$STATE" ] && [ "$STATE" != "$WANT host" ]; then
            echo "Builder {{.SANDBOX_BUILDER_NAME}} staat op '$STATE', gewenst '$WANT host' - opnieuw aanmaken..."
          elif [ -n "$STATE" ]; then
            echo "Builder {{.SANDBOX_BUILDER_NAME}} draait wel, maar staat niet in de buildx-store van deze sessie - overnemen..."
          fi
          docker buildx rm {{.SANDBOX_BUILDER_NAME}} >/dev/null 2>&1 || true
          # network=host om dezelfde reden als --network=host in sandbox-deploy: zonder
          # host-netwerk komt de builder niet bij de DNS van de server en strandt de
          # eerste regel van de Dockerfile al op "no route to host".
          docker buildx create \
            --name {{.SANDBOX_BUILDER_NAME}} \
            --driver docker-container \
            --driver-opt memory={{.SANDBOX_BUILD_MEMORY}} \
            --driver-opt network=host \
            --bootstrap >/dev/null
          echo "Builder {{.SANDBOX_BUILDER_NAME}} klaargezet met geheugengrens {{.SANDBOX_BUILD_MEMORY}}"
        else
          echo "Builder {{.SANDBOX_BUILDER_NAME}} staat klaar met geheugengrens {{.SANDBOX_BUILD_MEMORY}}"
        fi
    silent: true

  sandbox:build-operations-manager-image:
    desc: "Build operations-manager image and push it to the registry next to Kind (no deploy)"
    cmds:
      # Niet beginnen als er te weinig vrij is: dat was vooraf te zien toen een build de
      # server bijna omver trok. Zie docs/sandbox/uitrol-op-de-dev-server.md.
      - scripts/build-preflight.sh
      # Eerst de versie schrijven, anders bakt de build in wat er toevallig op schijf ligt:
      # opi/version.json staat in .gitignore en dus niet in `git status`, maar wel in de
      # buildcontext, en opi/core/version.py laat dat bestand voorgaan op de ingebakken
      # build-args. Een image kon zo een commit van dagen eerder over zichzelf melden.
      - task: version:generate
      - task: sandbox:build-builder
      - |
        echo "Building operations-manager Docker image..."
        # --cache-from: dezelfde vorm als publish-operations-manager (docker-build-and-push).
        # Leeg gelaten pakt hij alleen de cache van de builder zelf; met SANDBOX_CACHE_IMAGE
        # kun je er een registry-cache naast zetten. Geen --cache-to naar de sandboxregistry:
        # een garbage collect daar kan lagen weggooien die de cache nog nodig heeft.
        CACHE_FLAGS=""
        if [ -n "{{.SANDBOX_CACHE_IMAGE}}" ]; then
          CACHE_FLAGS="--cache-from type=registry,ref={{.SANDBOX_CACHE_IMAGE}}"
        fi
        docker buildx build \
          --builder {{.SANDBOX_BUILDER_NAME}} \
          $CACHE_FLAGS \
          --target application \
          --push \
          -t {{.SANDBOX_OM_IMAGE}} \
          -f operations-manager/Dockerfile .
        echo "Operations manager image pushed: {{.SANDBOX_OM_IMAGE}}"
    silent: true

  sandbox:update-operations-manager:
    desc: "Build and deploy the operations-manager to the sandbox cluster"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      # Idempotent; faalt vroeg als het cluster de containerd-patch mist.
      - task: sandbox:setup-registry
      # Bouwen en pushen staat in één taak, zodat de preflight, de geheugengrens
      # en de cache hier niet uit de pas kunnen lopen met de bouwtaak.
      - task: sandbox:build-operations-manager-image
      - task: sandbox:configure-operations-manager-image
      - |
        echo "Updating operations-manager deployment..."
        SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" kustomize build --enable-alpha-plugins --enable-exec bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local --load-restrictor LoadRestrictionsNone | kubectl apply -f -
        kubectl set env deployment/operations-manager -n {{.RIG_NAMESPACE}} \
          ZAD_VERSION="$(git describe --tags --always)" \
          ZAD_BUILD_DATE="$(date +%Y-%m-%d)"
        kubectl rollout status deployment/operations-manager -n {{.RIG_NAMESPACE}} --timeout=300s
      - echo "Operations manager updated successfully"
      # Waarom hier en niet in een cron: docs/sandbox/sandbox-kind-registry.md.
      - task: sandbox:prune-registry
    silent: true

  version:generate:
    desc: "Write opi/version.json from git (feeds the /version endpoint and footer)"
    dir: operations-manager/python
    cmds:
      - uv run python scripts/write_version_file.py

  version:watch:
    desc: "Continuously regenerate opi/version.json so skaffold hot-syncs the running commit/dirty state"
    dir: operations-manager/python
    cmds:
      - while true; do uv run python scripts/write_version_file.py; sleep 5; done

  sandbox:forward:
    desc: "Stuur lokaal 80/443 door naar de sandbox op de server (on|off|status)"
    summary: |
      Alle sandboxdomeinen resolven hier al naar 127.0.0.1, dus deze forward maakt ze in
      een klap bruikbaar tegen de sandbox op de server in plaats van een lokaal cluster.

        task sandbox:forward -- on       aanzetten (vraagt sudo, 80/443 zijn root-poorten)
        task sandbox:forward -- status   staat hij aan, en antwoordt hij
        task sandbox:forward -- off      uitzetten

      Draait je LOKALE kind-sandbox, dan houdt die 80/443 al bezet en kan de forward niet
      binden; het script meldt dat in plaats van half te starten.
    cmds:
      - scripts/sandbox-forward.sh {{.CLI_ARGS | default "status"}}
    silent: true

  sandbox:skaffold-dev:
    desc: "Start Skaffold with hot-reload for sandbox development"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      # Skaffold pusht naar localhost:5001; staat die registry er niet, dan is de fout
      # een kale push-timeout. Idempotent, net als in sandbox:update-operations-manager.
      - task: sandbox:setup-registry
      - echo "Starting Skaffold in hot-reload mode (sandboxed-local)..."
      - task: version:generate
      # Vastgepind, niet afgeleid van de huidige context: skaffold rolt anders uit naar
      # waar kubectl toevallig staat. Dat is een keer op het integratietest-cluster
      # geland en levert een muur van "namespaces rig-system not found" op.
      - SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" skaffold dev --kube-context kind-rig-sandbox --port-forward -f operations-manager/skaffold-sandboxed-local.yaml

  sandbox:skaffold-debug:
    desc: "Start Skaffold in debug mode for sandbox development (debugpy on port 5678)"
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: 'security/sandbox-key.txt'}
    cmds:
      - task: sandbox:setup-registry
      - echo "Starting Skaffold in debug mode (sandboxed-local)..."
      - 'echo "Attach IntelliJ debugger: Run → Debug Remote Debug - Operations Manager (localhost:5678)"'
      - SOPS_AGE_KEY="$(sed -n '3p' security/sandbox-key.txt)" skaffold dev --kube-context kind-rig-sandbox --port-forward -f operations-manager/skaffold-sandboxed-local-debug.yaml

  sandbox:build-cmp-image:
    desc: "Build CMP kustomize-sops image and load into Kind (no ArgoCD restart)"
    cmds:
      - |
        echo "Building cmp-kustomize-sops Docker image..."
        docker buildx build --no-cache --progress=plain --load -t rig-cmp-argo-kustomize-sops:latest -f images/cmp-kustomize-sops/Dockerfile .
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image rig-cmp-argo-kustomize-sops:latest --name {{.KIND_CLUSTER_NAME}}
      - echo "CMP kustomize-sops image built and loaded into Kind"
    silent: true

  sandbox:destroy:
    desc: "Destroy the sandboxed-local Kind cluster and clean up generated files"
    cmds:
      - |
        echo "Destroying sandboxed-local cluster..."
        kind delete cluster --name rig-sandbox

        # Clean up generated secret overview files
        rm -f secrets-overview-bootstrap-sandboxed-local.yaml
        rm -f secrets-overview-infrastructure-sandboxed-local.yaml

        # Clean up generated SOPS-encrypted secrets and decrypt-sops.yaml (recreated by generate task)
        rm -f infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local/*.sops.yaml
        rm -f infrastructure/bootstrap/infrastructure/secrets/config/overlays/sandboxed-local/decrypt-sops.yaml
        rm -f bootstrap/rig-system/kustomize/overlays/sandboxed-local/*.sops.yaml
        rm -f bootstrap/rig-system/kustomize/overlays/sandboxed-local/decrypt-sops.yaml

        # Clean up SOPS-encrypted env secrets for operations-manager
        rm -f bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local/operations-manager-env-secrets.yaml

        # Clean up sandbox AGE key
        rm -f security/sandbox-key.txt

        # Clean up local secrets file (gitignored)
        rm -f operations-manager/python/.env.sandboxed-local.secrets

        # Clean up sandbox state files
        rm -f .sandbox-sso

        echo "Cluster rig-sandbox deleted and sandbox artifacts cleaned up"
    silent: true

  # ---------------------------------------------------------------------------
  # staging: ZAD op ODCN in de tenant rig-staging. Zie features/zad-staging.md.
  # ---------------------------------------------------------------------------

  staging:setup:
    desc: "Richt staging (odcn-staging) in: sleutel, secrets-repo, tokens, bootstrap, wachten op ArgoCD. Opnieuw te draaien."
    preconditions:
      - sh: '[ "{{.CLUSTER_TYPE}}" = "odcn-staging" ]'
        msg: "Kies eerst odcn-staging met 'task select-cluster' (nu: '{{.CLUSTER_TYPE}}'). Deze taak draait nooit op productie."
    cmds:
      - task: staging:check-context
      - task: generate-age-key
      - task: staging:clone-secrets
      - task: generate-infrastructure-secrets-for-cluster
        vars: {SECRETS_DIR_CHECKED: "true"}
      - task: generate-bootstrap-secrets-for-cluster
        vars: {SECRETS_DIR_CHECKED: "true"}
      - task: generate-backup-destination-secret
        vars: {SECRETS_DIR_CHECKED: "true"}
      - task: staging:set-tokens
      - task: staging:push-secrets
      - task: staging:check-image
      - task: bootstrap-argo-system
      - task: bootstrap-backup-destination
      - task: staging:wait-ready

  staging:check-context:
    internal: true
    silent: true
    interactive: true
    cmds:
      - |
        # Staging en productie zitten op dezelfde cluster en dus achter dezelfde context;
        # de groepen zeggen of dit account in de tenant rig-staging mag.
        CONTEXT="$(kubectl config current-context)"
        KUBE_GROUPS="$(kubectl auth whoami -o jsonpath='{.status.userInfo.groups}' 2>/dev/null || true)"
        echo "Context: $CONTEXT"
        echo "Doel:    tenant rig-staging, namespace {{.RIG_NAMESPACE}}"
        if ! echo "$KUBE_GROUPS" | grep -q 'rig-staging-admin-group'; then
          echo "❌ Dit account zit niet in rig-staging-admin-group. Verkeerde context?"
          exit 1
        fi
        if [ "${STAGING_CONFIRM:-}" != "staging" ]; then
          printf "Typ 'staging' om door te gaan: "
          read -r ANTWOORD
          [ "$ANTWOORD" = "staging" ] || { echo "Afgebroken."; exit 1; }
        fi

  staging:clone-secrets:
    internal: true
    silent: true
    cmds:
      - |
        if [ ! -d "{{.SECRETS_DIR}}/.git" ]; then
          git clone https://github.com/RijksICTGilde/zad-staging-secrets.git "{{.SECRETS_DIR}}"
        fi
        # Het risico is een clone die achterloopt: dan maakt de generator geheimen opnieuw
        # aan die er op GitHub al zijn. Niet-gecommitte bestanden op een clone die gelijk
        # loopt zijn een afgebroken vorige run, en die hervatten we.
        git -C "{{.SECRETS_DIR}}" fetch -q
        if [ "$(git -C "{{.SECRETS_DIR}}" rev-parse HEAD)" != "$(git -C "{{.SECRETS_DIR}}" rev-parse @{u})" ]; then
          if [ -n "$(git -C "{{.SECRETS_DIR}}" status --porcelain)" ]; then
            echo "❌ {{.SECRETS_DIR}} loopt niet gelijk met GitHub en heeft niet-gecommitte wijzigingen. Ruim die eerst op."
            exit 1
          fi
          git -C "{{.SECRETS_DIR}}" pull -q --ff-only
        elif [ -n "$(git -C "{{.SECRETS_DIR}}" status --porcelain)" ]; then
          echo "ℹ️  niet-gecommitte bestanden in {{.SECRETS_DIR}}: een vorige run wordt hervat"
        fi

  staging:set-tokens:
    internal: true
    silent: true
    interactive: true
    vars:
      KEY_FILE: '{{default .AGE_KEY_FILE .KEY_FILE}}'
      ENV_FILE: 'operations-manager/python/.env.{{.CLUSTER_TYPE}}.secrets'
    deps:
      - task: _check-key-file
        vars: {KEY_FILE: '{{.KEY_FILE}}'}
    cmds:
      - |
        set -euo pipefail
        export SOPS_AGE_KEY="$(sed -n '3p' {{.KEY_FILE}})"
        vraag() {  # naam van de omgevingsvariabele, prompt; vraagt alleen als hij niet gezet is
          # Gezet-maar-leeg telt als antwoord: zo kan "geen SSO" ook zonder prompt.
          local waarde="${!1:-}"
          if ! printenv "$1" >/dev/null; then
            printf "%s: " "$2" >&2
            # stty en geen read -s: de shell van Task kent die optie niet.
            stty -echo 2>/dev/null || true; read -r waarde; stty echo 2>/dev/null || true; echo >&2
          fi
          printf '%s' "$waarde"
        }

        # Het PAT van ArgoCD (lezen op de staging-repos), direct versleuteld op zijn plek.
        for f in "{{.SECRETS_DIR}}"/bootstrap/argocd-repo-*.sops.yaml; do
          if sops --decrypt "$f" | grep -q 'password: PLACEHOLDER'; then
            ARGOCD_TOKEN="${ARGOCD_TOKEN:-$(vraag STAGING_ARGOCD_TOKEN 'PAT van ArgoCD (lezen)')}"
            sops --set "[\"stringData\"][\"password\"] $(python3 -I -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$ARGOCD_TOKEN")" "$f"
            echo "✅ token gezet in $(basename "$f")"
          fi
        done

        # TransIP voor external-dns: hetzelfde account als productie, met een eigen
        # owner-id en domeinfilter (zie de external-dns-overlay van odcn-staging). De
        # sleutel is een PEM over meerdere regels, dus die komt uit een bestand.
        TRANSIP_FILE="{{.SECRETS_DIR}}/infrastructure/transip-secret.yaml.sops.yaml"
        if [ ! -f "$TRANSIP_FILE" ]; then
          TRANSIP_ACCOUNT="$(vraag STAGING_TRANSIP_ACCOUNT 'TransIP-accountnaam (dezelfde als productie)')"
          if printenv STAGING_TRANSIP_KEY_FILE >/dev/null; then
            TRANSIP_KEY_FILE="$STAGING_TRANSIP_KEY_FILE"
          else
            printf "Pad naar de TransIP-sleutel (PEM): " >&2; read -r TRANSIP_KEY_FILE
          fi
          # Een prompt vouwt ~ niet uit, dus dat doen we zelf.
          case "$TRANSIP_KEY_FILE" in "~"/*) TRANSIP_KEY_FILE="$HOME/${TRANSIP_KEY_FILE#??}" ;; esac
          [ -f "$TRANSIP_KEY_FILE" ] || { echo "❌ $TRANSIP_KEY_FILE bestaat niet"; exit 1; }
          AGE_PUBLIC_KEY="$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')"
          kubectl create secret generic transip-credentials -n {{.RIG_NAMESPACE}} \
            --from-literal=TRANSIP_ACCOUNT_NAME="$TRANSIP_ACCOUNT" \
            --from-file=TRANSIP_PRIVATE_KEY="$TRANSIP_KEY_FILE" \
            --dry-run=client -o yaml \
            | sops --encrypt --input-type yaml --output-type yaml --age "$AGE_PUBLIC_KEY" /dev/stdin > "$TRANSIP_FILE"
          grep -qF "transip-secret.yaml.sops.yaml" "{{.SECRETS_DIR}}/infrastructure/decrypt-sops.yaml" \
            || echo "  - transip-secret.yaml.sops.yaml" >> "{{.SECRETS_DIR}}/infrastructure/decrypt-sops.yaml"
          echo "✅ transip-credentials versleuteld in de secrets-repo"
        fi

        # Het env-bestand van de OPI: alleen de eerste keer. Staat het env-secret al in de
        # secrets-repo (andere laptop, bestand opgeruimd), dan is die de bron en vragen we
        # niets: een nieuw bestand kreeg een andere SECRET_KEY dan wat er draait.
        if [ ! -f "{{.ENV_FILE}}" ] && [ ! -f "{{.SECRETS_DIR}}/operations-manager/operations-manager-env-secrets.yaml" ]; then
          OPI_TOKEN="$(vraag STAGING_OPI_TOKEN 'PAT van de OPI (schrijven)')"
          KC_SECRET="$(vraag STAGING_KEYCLOAK_CLIENT_SECRET 'Client secret van zad-staging in de prod-Keycloak (leeg = geen SSO)')"
          BACKUP_PASSWORD="$(sops --decrypt "{{.SECRETS_DIR}}/backup-destination/minio-credentials-secret.yaml.sops.yaml" | yq '.stringData."root-password"')"
          # De PAT versleuteld: de wizard neemt PROJECT_REPO_PASSWORD letterlijk over,
          # dus plain: is een platte PAT in de repo. Niet encrypt-value-age-base64: dat staat in procestabel.
          OPI_TOKEN_AGE="base64+age:$(printf '%s' "$OPI_TOKEN" | age -r "$(sed -n '2p' {{.KEY_FILE}} | sed 's/# public key: //')" -a | base64 | tr -d '\n')"
          # Eerst leeg en alleen voor jou leesbaar, dan pas de tokens erin (geen umask in de
          # shell van Task).
          : > "{{.ENV_FILE}}" && chmod 600 "{{.ENV_FILE}}"
          {
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "DEBUG_MODE=false"
            echo "GIT_PROJECTS_SERVER_PASSWORD=$OPI_TOKEN_AGE"
            echo "GIT_ARGO_APPLICATIONS_PASSWORD=$OPI_TOKEN_AGE"
            echo "PROJECT_REPO_PASSWORD=$OPI_TOKEN_AGE"
            # host:port, zonder schema: kopia weigert een URL ("Endpoint url cannot have fully
            # qualified paths") en de back-upjob zet het schema er zelf voor.
            echo "BACKUP_S3_ENDPOINT=minio.{{.BACKUP_NAMESPACE}}.svc:9000"
            echo "BACKUP_S3_ACCESS_KEY=backup-admin"
            echo "BACKUP_S3_SECRET_KEY=$BACKUP_PASSWORD"
            if [ -n "$KC_SECRET" ]; then echo "KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=$KC_SECRET"; fi
          } >> "{{.ENV_FILE}}"
          echo "✅ {{.ENV_FILE}} aangemaakt (gitignored)"
        fi
      # Alleen als het env-secret nog ontbreekt: opnieuw versleutelen bij elke run zou de
      # secrets-repo elke keer een wijziging geven zonder dat er iets veranderd is. In de
      # shell en niet met if: op de aanroep, want Task 3.41 negeert dat veld stil.
      - |
        if [ ! -f "{{.SECRETS_DIR}}/operations-manager/operations-manager-env-secrets.yaml" ]; then
          task generate-env-secrets-for-operations-manager SECRETS_DIR_CHECKED=true SECRETS_DIR="{{.SECRETS_DIR}}" KEY_FILE="{{.KEY_FILE}}"
        fi

  staging:push-secrets:
    internal: true
    silent: true
    interactive: true
    cmds:
      - |
        cd "{{.SECRETS_DIR}}"
        if [ -z "$(git status --porcelain)" ]; then echo "secrets-repo: niets nieuws"; exit 0; fi
        echo ""
        echo "Secrets-repo: $(pwd)"
        echo "Remote:       $(git remote get-url origin)"
        git status --short
        if [ "${STAGING_CONFIRM:-}" != "staging" ]; then
          printf "Deze bestanden committen en naar $(git remote get-url origin | sed -E 's#.*github.com[:/]##; s#\.git$##') pushen? [j/N] "
          read -r ANTWOORD
          [ "$ANTWOORD" = "j" ] || { echo "Afgebroken: zonder push kan ArgoCD de geheimen niet lezen."; exit 1; }
        fi
        git add -A && git commit -q -m "staging: geheimen bijgewerkt door task staging:setup" && git push -q
        echo "✅ secrets-repo gepusht"
      - echo "⚠️  Ruim de secrets-overview-*.yaml in deze map op; daar staan de wachtwoorden in platte tekst."

  staging:check-image:
    internal: true
    silent: true
    vars:
      PATCH_FILE: bootstrap/rig-system/kustomize/operations-manager/overlays/odcn-staging/patches/deployment.yaml
    cmds:
      - |
        # Op de INHOUD van de commit van het image en niet op de geschiedenis: commits gaan
        # als cherry-pick naar GitHub, dus een merge-base zegt hier niets.
        TAG="$(grep -oE 'operations-manager:[^ ]+' {{.PATCH_FILE}} | head -1 | cut -d: -f2)"
        COMMIT="$(echo "$TAG" | cut -d- -f2)"
        if ! git cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
          echo "❌ commit $COMMIT van image $TAG staat niet in deze checkout; controleer zelf dat het image odcn-staging kent."
          exit 1
        fi
        if ! git show "$COMMIT:operations-manager/python/opi/core/cluster_config.py" | grep -q '"odcn-staging"'; then
          echo "❌ image $TAG kent odcn-staging niet; de OPI valt dan om bij het starten."
          echo "   task publish-operations-manager, dan task pin-operations-manager-image OVERLAY=odcn-staging IMAGE_TAG=<tag>"
          exit 1
        fi
        echo "✅ image $TAG kent odcn-staging"

  staging:wait-ready:
    desc: "Wacht tot de Applications van staging Synced en Healthy zijn, en toon de tenant-eigenaren"
    silent: true
    vars:
      TIMEOUT: '{{default "900" .TIMEOUT}}'
    cmds:
      - |
        EINDE=$(( $(date +%s) + {{.TIMEOUT}} ))
        while :; do
          STAAT="$(kubectl -n {{.RIG_NAMESPACE}} get applications.argoproj.io -o custom-columns='NAAM:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status' --no-headers 2>/dev/null)"
          # user-applications vindt zijn map pas als de OPI het eerste project aanmaakt;
          # tot dan is "app path does not exist" geen fout maar een lege omgeving.
          if kubectl -n {{.RIG_NAMESPACE}} get applications.argoproj.io user-applications -o jsonpath='{.status.conditions[*].message}' 2>/dev/null | grep -q 'app path does not exist'; then
            STAAT="$(echo "$STAAT" | grep -v '^user-applications ')"
            GEEN_PROJECTEN=1
          fi
          if [ -n "$STAAT" ] && ! echo "$STAAT" | grep -vq 'Synced *Healthy'; then break; fi
          if [ "$(date +%s)" -gt "$EINDE" ]; then echo "❌ na {{.TIMEOUT}}s nog niet klaar:"; echo "$STAAT"; exit 1; fi
          sleep 15
        done
        echo "$STAAT"
        if [ -n "${GEEN_PROJECTEN:-}" ]; then echo "user-applications: nog geen projecten (de OPI maakt de map bij het eerste project)"; fi
        echo ""
        echo "Tenant-eigenaren van rig-staging:"
        kubectl get tenants.capsule.clastix.io rig-staging -o jsonpath='{range .status.owners[*]}{.kind}{"  "}{.name}{"\n"}{end}'
