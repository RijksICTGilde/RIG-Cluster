      - |
        echo "Building rig-backup image (kopia, mc, pg_dump)..."
        docker build -t ghcr.io/minbzk/base-images/rig-backup:latest -f operations-manager/backup-image/Dockerfile operations-manager/backup-image/
      - |
        echo "Loading image into kind cluster..."
        kind load docker-image ghcr.io/minbzk/base-images/rig-backup:latest --name {{.KIND_CLUSTER_NAME}}
      - echo -e "✅ rig-backup image built and loaded successfully!"
    silent: true

  publish-backup-image:
    desc: "Build and publish the rig-backup image to GitHub Container Registry"
    deps: [requirements-check]
    cmds:
      - task: docker-build-and-push
        vars:
          BUILD_CONTEXT: operations-manager/backup-image
          DOCKERFILE_PATH: Dockerfile
          IMAGE_NAME: rig-backup
