# Bewust geaccepteerde bevindingen van `secret-scan`. Een blok voor een nieuwe bevinding
# drukt `secret-scan --stel-voor` af; de reden is verplicht en de lookup gaat op vingerafdruk.

[[toegestaan]]
vingerafdruk = "7eb76623969d394a9bbcec7e8649a7d1"
regel = "generic-api-key"
pad = "infrastructure/bootstrap/infrastructure/keycloak/controller/base/deployment.yaml"
reden = "De CalVer-tag van de Keycloak-image die `task pin-keycloak-image TARGET=base` daar neerzet. gitleaks ziet achter het sleutelwoord `image:` 24 tekens cijfers, punten en een streepje en noemt dat een generieke sleutel, maar het is een anoniem leesbare imagetag en geen credential. De lookup hier is vingerafdruk-only (`pad` en `regel` binden niets), dus elke volgende promotie zet een andere tag op deze regel, geeft daarmee een andere vingerafdruk, en vraagt opnieuw een beslissing: de vingerafdruk hier draait dan mee, in plaats van dat er een blok naast komt voor een tag die niet meer in de repo staat."

[[toegestaan]]
vingerafdruk = "8f48386ffbda45f2584e00a8526feeef"
regel = "generic-api-key"
pad = "operations-manager/python/tests/test_seaweedfs_manager.py"
reden = "De verzonnen secret_key in de fixture van `test_een_geldig_bestaand_secret_maakt_niets_opnieuw`, de unit-test die vastlegt dat `SeaweedfsManager` een bestaand k8s-secret hergebruikt in plaats van een nieuwe sleutel te genereren. De naam is de assertie zelf: de test leest de waarde terug en vergelijkt hem, dus hij moet herkenbaar zijn in het testverslag. gitleaks ziet 14 tekens letters en cijfers achter `secret_key=` en noemt dat een generieke sleutel, maar geen enkel systeem heeft hem uitgegeven: hij wordt in de test gebouwd, aan een `NepProjectManager` gegeven en nooit naar buiten geschreven. SeaweedFS zelf bestaat in deze test niet, de connector is een mock. Dezelfde vorm als de verzonnen wachtwoorden in de andere unit-tests onder `tests/`, die op de basiscommit 2ac8c130b al ongetrieerd in de scan staan."

[[toegestaan]]
vingerafdruk = "2ba27ac2a960ae17f4ec9051b7f39631"
regel = "base64-omhulsel"
pad = "operations-manager/python/tests/golden/pipeline-gateway/tls-provided/expected/infra/sandboxed-local/golden-provided/productie/productie-web-provided-tls-tls-secret.to-sops.yaml"
reden = "De `tls.key` van de golden die vastlegt welk `kubernetes.io/tls` Secret de gateway-stand voor TLS-modus `provided` schrijft. Het is geen sleutelmateriaal: de base64 decodeert naar een PEM-blok waarvan het lichaam zelf weer base64 is en uitkomt op de letterlijke tekst `golden-sleutel-voor-de-toets`. De waarde komt uit de fixture van de toets, is nooit door een CA uitgegeven en staat in geen enkel cluster. Oplossen is niet mogelijk: laag 2 vuurt op elke base64 die naar een PEM-privesleutelblok decodeert, ongeacht het lichaam, en een golden van een `kubernetes.io/tls` Secret bevat die vorm per definitie. De vingerafdruk gaat over (regel, pad, waarde) en niet over het regelnummer, dus hij blijft staan zolang deze golden deze waarde heeft, en vraagt opnieuw een beslissing zodra iemand de fixture wijzigt."

[[toegestaan]]
vingerafdruk = "748b8c6ed66a14357cfb345ba5cb0ff9"
regel = "base64-omhulsel"
pad = "operations-manager/python/tests/golden/pipeline/tls-provided/expected/infra/sandboxed-local/golden-provided/productie/productie-web-provided-tls-tls-secret.to-sops.yaml"
reden = "Dezelfde fixture-waarde `golden-sleutel-voor-de-toets` in de ingress-variant van dezelfde golden: de twee scenario's bewijzen samen dat een wissel van stand het Secret en zijn naam niet verandert. Zelfde oordeel en zelfde onhaalbaarheid als bij 2ba27ac2a960ae17f4ec9051b7f39631; de vingerafdruk verschilt alleen doordat het pad meetelt."

[[toegestaan]]
vingerafdruk = "24cdf28856544f7a8189798ca99a3983"
regel = "base64-omhulsel"
pad = "operations-manager/python/tests/golden/pipeline/tls-provided/project.yaml"
reden = "De invoerkant van hetzelfde scenario: het projectbestand waarin een gebruiker een eigen certificaat meegeeft. De base64 decodeert naar een certificaat- plus een privesleutelblok die beide een letterlijke tekst bevatten, `golden-certificaat-voor-de-toets` en `golden-sleutel-voor-de-toets`. Een golden voor TLS-modus `provided` kan niet zonder invoer in deze vorm, dus oplossen is hier net zo onhaalbaar als bij de twee verwachtingsbestanden."
