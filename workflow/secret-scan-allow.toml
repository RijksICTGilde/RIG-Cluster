reden = "De CalVer-tag van de Keycloak-image die `task pin-keycloak-image TARGET=base` daar neerzet. gitleaks ziet achter het sleutelwoord `image:` 24 tekens cijfers, punten en een streepje en noemt dat een generieke sleutel, maar het is een anoniem leesbare imagetag en geen credential. De lookup hier is vingerafdruk-only (`pad` en `regel` binden niets), dus elke volgende promotie zet een andere tag op deze regel, geeft daarmee een andere vingerafdruk, en vraagt opnieuw een blok in deze lijst."

