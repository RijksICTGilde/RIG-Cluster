# De vondsten van secret-scan die bewust blijven staan.
#
# Een uitzondering is een oordeel, en het oordeel zit in de reden: wie hier over een half jaar
# leest moet kunnen nagaan waarom dit geen sleutel is, zonder de vondst opnieuw te triëren. Het
# script schrijft deze lijst nooit zelf; `secret-scan --stel-voor` drukt het blok af en de reden
# is handwerk, zodat een uitzondering altijd een regel in een diff is die iemand goedkeurt.
#
# Niet alles mag hierin. Een token waarvan de checksum klopt en een sleutel die buiten zijn eigen
# scope ontsleutelt zijn door de machine beslist; daar is een uitzondering een vergissing, en het
# script negeert hem dan ook. Wat hier hoort is het omgekeerde: een vorm die op een sleutel lijkt
# en er geen is.

[[toegestaan]]
vingerafdruk = "d7e90e8bd4eb6eea2c1358345ce67abc"
regel = "curl-auth-header"
pad = "archive/HOW.md"
reden = "De ontwikkelwaarde van API_TOKEN uit opi/core/config.py, in een voorbeeld-curl in een gearchiveerd document. Hij opent niets: OPI gebruikt hem alleen als USE_UNSAFE_API_KEY aanstaat, en die staat op elke omgeving uit (config.py, .env). Weghalen hier verandert niets, want het is de gecommitte standaard van de instelling zelf."

