repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^operations-manager/python/
      - id: ruff-format
        files: ^operations-manager/python/

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --directory operations-manager/python pyright
        language: system
        files: ^operations-manager/python/.*\.py$
        pass_filenames: false

      - id: djlint
        name: djlint
        entry: uv run --directory operations-manager/python djlint --lint opi/templates/
        language: system
        files: ^operations-manager/python/.*\.(html|html\.j2)$
        pass_filenames: false
