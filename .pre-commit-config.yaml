# Hooks that rewrite files run at pre-commit only. At pre-push pre-commit
# stashes the working tree, so an auto-fix there conflicts with the stash and
# aborts the push ("Stashed changes conflicted with hook auto-fixes").
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Patch files are byte-exact by nature: a context line that is an empty line
      # must be a single space. Stripping it makes `git am` reject the patch, which
      # is exactly what images/argocd-rig/Taskfile.yaml `src:verify` runs.
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        exclude: ^operations-manager/python/static/promo\.mp4$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^operations-manager/python/
      - id: ruff-format
        files: ^operations-manager/python/

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --directory operations-manager/python pyright
        language: system
        files: ^operations-manager/python/.*\.py$
        pass_filenames: false

      - id: djlint
        name: djlint
        entry: uv run --directory operations-manager/python djlint --lint opi/templates/
        language: system
        files: ^operations-manager/python/.*\.(html|html\.j2)$
        pass_filenames: false

      # Pre-push hooks: run before `git push`, not on every commit.
      # Install once with: pre-commit install --hook-type pre-push
      #
      # pytest excludes tests/integration (slow, ~5 min) — CI runs those. The
      # unit subset is ~45s locally and catches the failures we saw today.
      - id: pytest
        name: pytest (unit tests)
        entry: uv run --directory operations-manager/python pytest tests/ --ignore=tests/integration --ignore=tests/e2e -q --tb=line -o log_cli=false -m "not slow and not e2e and not requires_infra and not sandbox"
        language: system
        files: ^operations-manager/python/.*\.py$
        pass_filenames: false
        stages: [pre-push]

      - id: pip-audit
        name: pip-audit (dependency CVEs)
        entry: uv run --directory operations-manager/python pip-audit --strict --desc --skip-editable -s osv
        language: system
        files: ^operations-manager/python/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-push]
