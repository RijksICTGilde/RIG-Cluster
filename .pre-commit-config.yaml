# Alles draait op pre-commit. Er staat bewust GEEN pre-push-stage meer in dit bestand.
#
# Pre-commit stasht bij pre-push de hele werkboom. Dat gaf twee soorten problemen: een
# hook die bestanden herschrijft botst met die stash en breekt de push af ("Stashed
# changes conflicted with hook auto-fixes"), en in een gedeelde checkout verdwijnt het
# niet-gecommitte werk van iedereen die op dat moment meewerkt onder je vandaan.
#
# De twee hooks die hier stonden (pytest en pip-audit) draaien onveranderd in CI:
# .github/workflows/ci.yml met dezelfde testselectie, .github/workflows/security.yml met
# hetzelfde pip-audit-commando, bij elke push naar main en bij elke pull request. Lokaal
# zijn ze er ook nog: `task security-audit` en `uv run pytest` in operations-manager/python.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Patch files are byte-exact by nature: a context line that is an empty line
      # must be a single space. Stripping it makes `git am` reject the patch, which
      # is exactly what images/argocd-rig/Taskfile.yaml `src:verify` runs.
      - id: trailing-whitespace
        exclude: \.patch$
      - id: end-of-file-fixer
        exclude: \.patch$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        exclude: ^operations-manager/python/static/promo\.mp4$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^operations-manager/python/
      - id: ruff-format
        files: ^operations-manager/python/

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run --directory operations-manager/python pyright
        language: system
        files: ^operations-manager/python/.*\.py$
        pass_filenames: false

      - id: djlint
        name: djlint
        entry: uv run --directory operations-manager/python djlint --lint opi/templates_lotc/
        language: system
        files: ^operations-manager/python/.*\.(html|html\.j2)$
        pass_filenames: false
