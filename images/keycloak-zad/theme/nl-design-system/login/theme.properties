# De themanaam blijft `nl-design-system` terwijl de inhoud van ROOS naar NLDD gaat: elke
# bestaande realm heeft die naam in zijn database staan, en een realm die naar een onbekend
# thema wijst valt terug op het standaardthema van Keycloak. Zie features/keycloak-nldd-thema.md.
parent=base
import=common/keycloak
common=common/nl-design-system
locales=en,nl

# Uit de image, niet van een CDN: de inlogpagina is de plek waar een derde partij het minst
# mag meekijken. De bundel zelf laadt template.ftl met een script-tag, want `scripts` wordt
# vanaf resourcesPath geladen en de bundel staat bij de gedeelde resources.
stylesCommon=nldd/css/global.css
styles=css/login.css

meta=viewport==width=device-width,initial-scale=1

organizationName=${env.ORGANIZATION:Identiteits service}
