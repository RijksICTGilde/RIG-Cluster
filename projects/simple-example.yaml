schema-version: 2
name: example-project
description: "A simple example project for demonstration purposes"

# Available clusters
clusters:
  - local
  - odcn-production

users:
  - email: admin@rijksoverheid.nl
    role: admin

# Platform services this project uses
services:
  - publish-on-web
  - persistent-storage
  - temp-storage

# Repository configuration
repositories:
  - name: main-repo
    url: "ssh://git@host.docker.internal:2222/srv/git/example-project-infra.git"
    branch: "main"
    path: "infra"
  - name: github-repo
    url: "https://github.com/RijksICTGilde/rig-cluster-application-test.git"
    username: "git"
    password: |-
      -----BEGIN AGE ENCRYPTED FILE-----
      YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSB3dk42YTVRMXNIeVJuYmVK
      QmdsT0laV2haU09hdXpDMStJZTNZL2RKUjFVCjM0KzNsVi83WU1Qd0ZkNHBodHdH
      bHVxRnU3eWRybCtUT09PWlllVExwTGMKLS0tIElLSWFVM2hXVFpySDRwTWltcVhk
      dkI4TGRBUkNnWG45VnFYc3RmZCsvUW8KBkdHlmlJeFrec+BjxPtpeHuomqu9pC68
      M0lJ+TTScTS0WYBN4RjTae4C0KjLdhedfMrjYRikatqkyn++BKsGmJut96xF6sHP
      -----END AGE ENCRYPTED FILE-----
    branch: "main"
    path: "."
  - name: main-repo-autocreated
    url: "ssh://git@host.docker.internal:2222/srv/git/example-project-infra-autocreated.git"
    branch: "main"

components:
  - name: frontend
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443, 80]  # for external API calls, CDN, etc.
    uses-components: []
    services:
      - publish-on-web
      - reference: persistent-storage
        config:
          - name: data
            size: 10Gi
            mount-path: /data
      - reference: temp-storage
        config:
          - name: tmp
            size: 2Gi
            mount-path: /tmp

# Deployments - combining environment/namespace and ArgoCD application info
deployments:
  - name: just-a-name
    cluster: local
    namespace: example-project  # This is derived from the project name
    repository: main-repo
    components:
      - reference: frontend
        image: "nginxdemos/hello"
  - name: second-name
    cluster: local
    namespace: example-project
    repository: main-repo-autocreated
    components:
      - reference: frontend
        image: "strm/helloworld-http"
  - name: third-name
    cluster: local
    namespace: example-project
    repository: github-repo
    components:
      - reference: frontend
        image: "tutum/hello-world"
  - name: odcn-name
    cluster: odcn-production
    namespace: example-project
    repository: github-repo
    components:
      - reference: frontend
        image: "tutum/hello-world"
