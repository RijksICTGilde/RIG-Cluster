# De ASVS-eisen op niveau L1 en L2, letterlijk uit de standaard.
#
# Bron: OWASP Application Security Verification Standard 5.0.0, bestand
# 5.0/docs_en/OWASP_Application_Security_Verification_Standard_5.0.0_en.json uit
# https://github.com/OWASP/ASVS, onder CC BY-SA 3.0. Dit bestand wordt niet met de hand
# bewerkt: het is de meetlat. Ons oordeel staat ernaast in asvs-zelfbeoordeling.yaml.
#
# Bijwerken naar een nieuwe ASVS-versie gaat met het commando in
# features/asvs-zelfbeoordeling.md; daarna meldt `task asvs-check` welke eisen nog geen
# oordeel hebben.
asvs-versie: 5.0.0
eisen:
- id: V1.1.1
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.1 Encoding and Sanitization Architecture
  eis: Verify that input is decoded or unescaped into a canonical form only once, it is only decoded when
    encoded data in that form is expected, and that this is done before processing the input further,
    for example it is not performed after input validation or sanitization.
- id: V1.1.2
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.1 Encoding and Sanitization Architecture
  eis: Verify that the application performs output encoding and escaping either as a final step before
    being used by the interpreter for which it is intended or by the interpreter itself.
- id: V1.2.1
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that output encoding for an HTTP response, HTML document, or XML document is relevant for
    the context required, such as encoding the relevant characters for HTML elements, HTML attributes,
    HTML comments, CSS, or HTTP header fields, to avoid changing the message or document structure.
- id: V1.2.2
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: 'Verify that when dynamically building URLs, untrusted data is encoded according to its context
    (e.g., URL encoding or base64url encoding for query or path parameters). Ensure that only safe URL
    protocols are permitted (e.g., disallow javascript: or data:).'
- id: V1.2.3
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that output encoding or escaping is used when dynamically building JavaScript content (including
    JSON), to avoid changing the message or document structure (to avoid JavaScript and JSON injection).
- id: V1.2.4
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that data selection or database queries (e.g., SQL, HQL, NoSQL, Cypher) use parameterized
    queries, ORMs, entity frameworks, or are otherwise protected from SQL Injection and other database
    injection attacks. This is also relevant when writing stored procedures.
- id: V1.2.5
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that the application protects against OS command injection and that operating system calls
    use parameterized OS queries or use contextual command line output encoding.
- id: V1.2.6
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that the application protects against LDAP injection vulnerabilities, or that specific security
    controls to prevent LDAP injection have been implemented.
- id: V1.2.7
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that the application is protected against XPath injection attacks by using query parameterization
    or precompiled queries.
- id: V1.2.8
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that LaTeX processors are configured securely (such as not using the "--shell-escape" flag)
    and an allowlist of commands is used to prevent LaTeX injection attacks.
- id: V1.2.9
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.2 Injection Prevention
  eis: Verify that the application escapes special characters in regular expressions (typically using
    a backslash) to prevent them from being misinterpreted as metacharacters.
- id: V1.3.1
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that all untrusted HTML input from WYSIWYG editors or similar is sanitized using a well-known
    and secure HTML sanitization library or framework feature.
- id: V1.3.2
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application avoids the use of eval() or other dynamic code execution features such
    as Spring Expression Language (SpEL). Where there is no alternative, any user input being included
    must be sanitized before being executed.
- id: V1.3.3
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that data being passed to a potentially dangerous context is sanitized beforehand to enforce
    safety measures, such as only allowing characters which are safe for this context and trimming input
    which is too long.
- id: V1.3.4
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that user-supplied Scalable Vector Graphics (SVG) scriptable content is validated or sanitized
    to contain only tags and attributes (such as draw graphics) that are safe for the application, e.g.,
    do not contain scripts and foreignObject.
- id: V1.3.5
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application sanitizes or disables user-supplied scriptable or expression template
    language content, such as Markdown, CSS or XSL stylesheets, BBCode, or similar.
- id: V1.3.6
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application protects against Server-side Request Forgery (SSRF) attacks, by validating
    untrusted data against an allowlist of protocols, domains, paths and ports and sanitizing potentially
    dangerous characters before using the data to call another service.
- id: V1.3.7
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application protects against template injection attacks by not allowing templates
    to be built based on untrusted input. Where there is no alternative, any untrusted input being included
    dynamically during template creation must be sanitized or strictly validated.
- id: V1.3.8
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application appropriately sanitizes untrusted input before use in Java Naming and
    Directory Interface (JNDI) queries and that JNDI is configured securely to prevent JNDI injection
    attacks.
- id: V1.3.9
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application sanitizes content before it is sent to memcache to prevent injection
    attacks.
- id: V1.3.10
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that format strings which might resolve in an unexpected or malicious way when used are
    sanitized before being processed.
- id: V1.3.11
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.3 Sanitization
  eis: Verify that the application sanitizes user input before passing to mail systems to protect against
    SMTP or IMAP injection.
- id: V1.4.1
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.4 Memory, String, and Unmanaged Code
  eis: Verify that the application uses memory-safe string, safer memory copy and pointer arithmetic to
    detect or prevent stack, buffer, or heap overflows.
- id: V1.4.2
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.4 Memory, String, and Unmanaged Code
  eis: Verify that sign, range, and input validation techniques are used to prevent integer overflows.
- id: V1.4.3
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.4 Memory, String, and Unmanaged Code
  eis: Verify that dynamically allocated memory and resources are released, and that references or pointers
    to freed memory are removed or set to null to prevent dangling pointers and use-after-free vulnerabilities.
- id: V1.5.1
  niveau: 1
  kapittel: V1 Encoding and Sanitization
  sectie: V1.5 Safe Deserialization
  eis: Verify that the application configures XML parsers to use a restrictive configuration and that
    unsafe features such as resolving external entities are disabled to prevent XML eXternal Entity (XXE)
    attacks.
- id: V1.5.2
  niveau: 2
  kapittel: V1 Encoding and Sanitization
  sectie: V1.5 Safe Deserialization
  eis: Verify that deserialization of untrusted data enforces safe input handling, such as using an allowlist
    of object types or restricting client-defined object types, to prevent deserialization attacks. Deserialization
    mechanisms that are explicitly defined as insecure must not be used with untrusted input.
- id: V2.1.1
  niveau: 1
  kapittel: V2 Validation and Business Logic
  sectie: V2.1 Validation and Business Logic Documentation
  eis: Verify that the application's documentation defines input validation rules for how to check the
    validity of data items against an expected structure. This could be common data formats such as credit
    card numbers, email addresses, telephone numbers, or it could be an internal data format.
- id: V2.1.2
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.1 Validation and Business Logic Documentation
  eis: Verify that the application's documentation defines how to validate the logical and contextual
    consistency of combined data items, such as checking that suburb and ZIP code match.
- id: V2.1.3
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.1 Validation and Business Logic Documentation
  eis: Verify that expectations for business logic limits and validations are documented, including both
    per-user and globally across the application.
- id: V2.2.1
  niveau: 1
  kapittel: V2 Validation and Business Logic
  sectie: V2.2 Input Validation
  eis: Verify that input is validated to enforce business or functional expectations for that input. This
    should either use positive validation against an allow list of values, patterns, and ranges, or be
    based on comparing the input to an expected structure and logical limits according to predefined rules.
    For L1, this can focus on input which is used to make specific business or security decisions. For
    L2 and up, this should apply to all input.
- id: V2.2.2
  niveau: 1
  kapittel: V2 Validation and Business Logic
  sectie: V2.2 Input Validation
  eis: Verify that the application is designed to enforce input validation at a trusted service layer.
    While client-side validation improves usability and should be encouraged, it must not be relied upon
    as a security control.
- id: V2.2.3
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.2 Input Validation
  eis: Verify that the application ensures that combinations of related data items are reasonable according
    to the pre-defined rules.
- id: V2.3.1
  niveau: 1
  kapittel: V2 Validation and Business Logic
  sectie: V2.3 Business Logic Security
  eis: Verify that the application will only process business logic flows for the same user in the expected
    sequential step order and without skipping steps.
- id: V2.3.2
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.3 Business Logic Security
  eis: Verify that business logic limits are implemented per the application's documentation to avoid
    business logic flaws being exploited.
- id: V2.3.3
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.3 Business Logic Security
  eis: Verify that transactions are being used at the business logic level such that either a business
    logic operation succeeds in its entirety or it is rolled back to the previous correct state.
- id: V2.3.4
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.3 Business Logic Security
  eis: Verify that business logic level locking mechanisms are used to ensure that limited quantity resources
    (such as theater seats or delivery slots) cannot be double-booked by manipulating the application's
    logic.
- id: V2.4.1
  niveau: 2
  kapittel: V2 Validation and Business Logic
  sectie: V2.4 Anti-automation
  eis: Verify that anti-automation controls are in place to protect against excessive calls to application
    functions that could lead to data exfiltration, garbage-data creation, quota exhaustion, rate-limit
    breaches, denial-of-service, or overuse of costly resources.
- id: V3.2.1
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.2 Unintended Content Interpretation
  eis: 'Verify that security controls are in place to prevent browsers from rendering content or functionality
    in HTTP responses in an incorrect context (e.g., when an API, a user-uploaded file or other resource
    is requested directly). Possible controls could include: not serving the content unless HTTP request
    header fields (such as Sec-Fetch-\*) indicate it is the correct context, using the sandbox directive
    of the Content-Security-Policy header field or using the attachment disposition type in the Content-Disposition
    header field.'
- id: V3.2.2
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.2 Unintended Content Interpretation
  eis: Verify that content intended to be displayed as text, rather than rendered as HTML, is handled
    using safe rendering functions (such as createTextNode or textContent) to prevent unintended execution
    of content such as HTML or JavaScript.
- id: V3.3.1
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.3 Cookie Setup
  eis: Verify that cookies have the 'Secure' attribute set, and if the '\__Host-' prefix is not used for
    the cookie name, the '__Secure-' prefix must be used for the cookie name.
- id: V3.3.2
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.3 Cookie Setup
  eis: Verify that each cookie's 'SameSite' attribute value is set according to the purpose of the cookie,
    to limit exposure to user interface redress attacks and browser-based request forgery attacks, commonly
    known as cross-site request forgery (CSRF).
- id: V3.3.3
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.3 Cookie Setup
  eis: Verify that cookies have the '__Host-' prefix for the cookie name unless they are explicitly designed
    to be shared with other hosts.
- id: V3.3.4
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.3 Cookie Setup
  eis: Verify that if the value of a cookie is not meant to be accessible to client-side scripts (such
    as a session token), the cookie must have the 'HttpOnly' attribute set and the same value (e. g. session
    token) must only be transferred to the client via the 'Set-Cookie' header field.
- id: V3.4.1
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: Verify that a Strict-Transport-Security header field is included on all responses to enforce an
    HTTP Strict Transport Security (HSTS) policy. A maximum age of at least 1 year must be defined, and
    for L2 and up, the policy must apply to all subdomains as well.
- id: V3.4.2
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: 'Verify that the Cross-Origin Resource Sharing (CORS) Access-Control-Allow-Origin header field
    is a fixed value by the application, or if the Origin HTTP request header field value is used, it
    is validated against an allowlist of trusted origins. When ''Access-Control-Allow-Origin: *'' needs
    to be used, verify that the response does not include any sensitive information.'
- id: V3.4.3
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: Verify that HTTP responses include a Content-Security-Policy response header field which defines
    directives to ensure the browser only loads and executes trusted content or resources, in order to
    limit execution of malicious JavaScript. As a minimum, a global policy must be used which includes
    the directives object-src 'none' and base-uri 'none' and defines either an allowlist or uses nonces
    or hashes. For an L3 application, a per-response policy with nonces or hashes must be defined.
- id: V3.4.4
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: 'Verify that all HTTP responses contain an ''X-Content-Type-Options: nosniff'' header field. This
    instructs browsers not to use content sniffing and MIME type guessing for the given response, and
    to require the response''s Content-Type header field value to match the destination resource. For
    example, the response to a request for a style is only accepted if the response''s Content-Type is
    ''text/css''. This also enables the use of the Cross-Origin Read Blocking (CORB) functionality by
    the browser.'
- id: V3.4.5
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: Verify that the application sets a referrer policy to prevent leakage of technically sensitive
    data to third-party services via the 'Referer' HTTP request header field. This can be done using the
    Referrer-Policy HTTP response header field or via HTML element attributes. Sensitive data could include
    path and query data in the URL, and for internal non-public applications also the hostname.
- id: V3.4.6
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.4 Browser Security Mechanism Headers
  eis: Verify that the web application uses the frame-ancestors directive of the Content-Security-Policy
    header field for every HTTP response to ensure that it cannot be embedded by default and that embedding
    of specific resources is allowed only when necessary. Note that the X-Frame-Options header field,
    although supported by browsers, is obsolete and may not be relied upon.
- id: V3.5.1
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.5 Browser Origin Separation
  eis: Verify that, if the application does not rely on the CORS preflight mechanism to prevent disallowed
    cross-origin requests to use sensitive functionality, these requests are validated to ensure they
    originate from the application itself. This may be done by using and validating anti-forgery tokens
    or requiring extra HTTP header fields that are not CORS-safelisted request-header fields. This is
    to defend against browser-based request forgery attacks, commonly known as cross-site request forgery
    (CSRF).
- id: V3.5.2
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.5 Browser Origin Separation
  eis: Verify that, if the application relies on the CORS preflight mechanism to prevent disallowed cross-origin
    use of sensitive functionality, it is not possible to call the functionality with a request which
    does not trigger a CORS-preflight request. This may require checking the values of the 'Origin' and
    'Content-Type' request header fields or using an extra header field that is not a CORS-safelisted
    header-field.
- id: V3.5.3
  niveau: 1
  kapittel: V3 Web Frontend Security
  sectie: V3.5 Browser Origin Separation
  eis: Verify that HTTP requests to sensitive functionality use appropriate HTTP methods such as POST,
    PUT, PATCH, or DELETE, and not methods defined by the HTTP specification as "safe" such as HEAD, OPTIONS,
    or GET. Alternatively, strict validation of the Sec-Fetch-* request header fields can be used to ensure
    that the request did not originate from an inappropriate cross-origin call, a navigation request,
    or a resource load (such as an image source) where this is not expected.
- id: V3.5.4
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.5 Browser Origin Separation
  eis: Verify that separate applications are hosted on different hostnames to leverage the restrictions
    provided by same-origin policy, including how documents or scripts loaded by one origin can interact
    with resources from another origin and hostname-based restrictions on cookies.
- id: V3.5.5
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.5 Browser Origin Separation
  eis: Verify that messages received by the postMessage interface are discarded if the origin of the message
    is not trusted, or if the syntax of the message is invalid.
- id: V3.7.1
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.7 Other Browser Security Considerations
  eis: Verify that the application only uses client-side technologies which are still supported and considered
    secure. Examples of technologies which do not meet this requirement include NSAPI plugins, Flash,
    Shockwave, ActiveX, Silverlight, NACL, or client-side Java applets.
- id: V3.7.2
  niveau: 2
  kapittel: V3 Web Frontend Security
  sectie: V3.7 Other Browser Security Considerations
  eis: Verify that the application will only automatically redirect the user to a different hostname or
    domain (which is not controlled by the application) where the destination appears on an allowlist.
- id: V4.1.1
  niveau: 1
  kapittel: V4 API and Web Service
  sectie: V4.1 Generic Web Service Security
  eis: Verify that every HTTP response with a message body contains a Content-Type header field that matches
    the actual content of the response, including the charset parameter to specify safe character encoding
    (e.g., UTF-8, ISO-8859-1) according to IANA Media Types, such as "text/", "/+xml" and "/xml".
- id: V4.1.2
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.1 Generic Web Service Security
  eis: Verify that only user-facing endpoints (intended for manual web-browser access) automatically redirect
    from HTTP to HTTPS, while other services or endpoints do not implement transparent redirects. This
    is to avoid a situation where a client is erroneously sending unencrypted HTTP requests, but since
    the requests are being automatically redirected to HTTPS, the leakage of sensitive data goes undiscovered.
- id: V4.1.3
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.1 Generic Web Service Security
  eis: Verify that any HTTP header field used by the application and set by an intermediary layer, such
    as a load balancer, a web proxy, or a backend-for-frontend service, cannot be overridden by the end-user.
    Example headers might include X-Real-IP, X-Forwarded-*, or X-User-ID.
- id: V4.2.1
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.2 HTTP Message Structure Validation
  eis: Verify that all application components (including load balancers, firewalls, and application servers)
    determine boundaries of incoming HTTP messages using the appropriate mechanism for the HTTP version
    to prevent HTTP request smuggling. In HTTP/1.x, if a Transfer-Encoding header field is present, the
    Content-Length header must be ignored per RFC 2616. When using HTTP/2 or HTTP/3, if a Content-Length
    header field is present, the receiver must ensure that it is consistent with the length of the DATA
    frames.
- id: V4.3.1
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.3 GraphQL
  eis: Verify that a query allowlist, depth limiting, amount limiting, or query cost analysis is used
    to prevent GraphQL or data layer expression Denial of Service (DoS) as a result of expensive, nested
    queries.
- id: V4.3.2
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.3 GraphQL
  eis: Verify that GraphQL introspection queries are disabled in the production environment unless the
    GraphQL API is meant to be used by other parties.
- id: V4.4.1
  niveau: 1
  kapittel: V4 API and Web Service
  sectie: V4.4 WebSocket
  eis: Verify that WebSocket over TLS (WSS) is used for all WebSocket connections.
- id: V4.4.2
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.4 WebSocket
  eis: Verify that, during the initial HTTP WebSocket handshake, the Origin header field is checked against
    a list of origins allowed for the application.
- id: V4.4.3
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.4 WebSocket
  eis: Verify that, if the application's standard session management cannot be used, dedicated tokens
    are being used for this, which comply with the relevant Session Management security requirements.
- id: V4.4.4
  niveau: 2
  kapittel: V4 API and Web Service
  sectie: V4.4 WebSocket
  eis: Verify that dedicated WebSocket session management tokens are initially obtained or validated through
    the previously authenticated HTTPS session when transitioning an existing HTTPS session to a WebSocket
    channel.
- id: V5.1.1
  niveau: 2
  kapittel: V5 File Handling
  sectie: V5.1 File Handling Documentation
  eis: Verify that the documentation defines the permitted file types, expected file extensions, and maximum
    size (including unpacked size) for each upload feature. Additionally, ensure that the documentation
    specifies how files are made safe for end-users to download and process, such as how the application
    behaves when a malicious file is detected.
- id: V5.2.1
  niveau: 1
  kapittel: V5 File Handling
  sectie: V5.2 File Upload and Content
  eis: Verify that the application will only accept files of a size which it can process without causing
    a loss of performance or a denial of service attack.
- id: V5.2.2
  niveau: 1
  kapittel: V5 File Handling
  sectie: V5.2 File Upload and Content
  eis: Verify that when the application accepts a file, either on its own or within an archive such as
    a zip file, it checks if the file extension matches an expected file extension and validates that
    the contents correspond to the type represented by the extension. This includes, but is not limited
    to, checking the initial 'magic bytes', performing image re-writing, and using specialized libraries
    for file content validation. For L1, this can focus just on files which are used to make specific
    business or security decisions. For L2 and up, this must apply to all files being accepted.
- id: V5.2.3
  niveau: 2
  kapittel: V5 File Handling
  sectie: V5.2 File Upload and Content
  eis: Verify that the application checks compressed files (e.g., zip, gz, docx, odt) against maximum
    allowed uncompressed size and against maximum number of files before uncompressing the file.
- id: V5.3.1
  niveau: 1
  kapittel: V5 File Handling
  sectie: V5.3 File Storage
  eis: Verify that files uploaded or generated by untrusted input and stored in a public folder, are not
    executed as server-side program code when accessed directly with an HTTP request.
- id: V5.3.2
  niveau: 1
  kapittel: V5 File Handling
  sectie: V5.3 File Storage
  eis: Verify that when the application creates file paths for file operations, instead of user-submitted
    filenames, it uses internally generated or trusted data, or if user-submitted filenames or file metadata
    must be used, strict validation and sanitization must be applied. This is to protect against path
    traversal, local or remote file inclusion (LFI, RFI), and server-side request forgery (SSRF) attacks.
- id: V5.4.1
  niveau: 2
  kapittel: V5 File Handling
  sectie: V5.4 File Download
  eis: Verify that the application validates or ignores user-submitted filenames, including in a JSON,
    JSONP, or URL parameter and specifies a filename in the Content-Disposition header field in the response.
- id: V5.4.2
  niveau: 2
  kapittel: V5 File Handling
  sectie: V5.4 File Download
  eis: Verify that file names served (e.g., in HTTP response header fields or email attachments) are encoded
    or sanitized (e.g., following RFC 6266) to preserve document structure and prevent injection attacks.
- id: V5.4.3
  niveau: 2
  kapittel: V5 File Handling
  sectie: V5.4 File Download
  eis: Verify that files obtained from untrusted sources are scanned by antivirus scanners to prevent
    serving of known malicious content.
- id: V6.1.1
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.1 Authentication Documentation
  eis: Verify that application documentation defines how controls such as rate limiting, anti-automation,
    and adaptive response, are used to defend against attacks such as credential stuffing and password
    brute force. The documentation must make clear how these controls are configured and prevent malicious
    account lockout.
- id: V6.1.2
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.1 Authentication Documentation
  eis: Verify that a list of context-specific words is documented in order to prevent their use in passwords.
    The list could include permutations of organization names, product names, system identifiers, project
    codenames, department or role names, and similar.
- id: V6.1.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.1 Authentication Documentation
  eis: Verify that, if the application includes multiple authentication pathways, these are all documented
    together with the security controls and authentication strength which must be consistently enforced
    across them.
- id: V6.2.1
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that user set passwords are at least 8 characters in length although a minimum of 15 characters
    is strongly recommended.
- id: V6.2.2
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that users can change their password.
- id: V6.2.3
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that password change functionality requires the user's current and new password.
- id: V6.2.4
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that passwords submitted during account registration or password change are checked against
    an available set of, at least, the top 3000 passwords which match the application's password policy,
    e.g. minimum length.
- id: V6.2.5
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that passwords of any composition can be used, without rules limiting the type of characters
    permitted. There must be no requirement for a minimum number of upper or lower case characters, numbers,
    or special characters.
- id: V6.2.6
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that password input fields use type=password to mask the entry. Applications may allow the
    user to temporarily view the entire masked password, or the last typed character of the password.
- id: V6.2.7
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that "paste" functionality, browser password helpers, and external password managers are
    permitted.
- id: V6.2.8
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that the application verifies the user's password exactly as received from the user, without
    any modifications such as truncation or case transformation.
- id: V6.2.9
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that passwords of at least 64 characters are permitted.
- id: V6.2.10
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that a user's password stays valid until it is discovered to be compromised or the user
    rotates it. The application must not require periodic credential rotation.
- id: V6.2.11
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that the documented list of context specific words is used to prevent easy to guess passwords
    being created.
- id: V6.2.12
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.2 Password Security
  eis: Verify that passwords submitted during account registration or password changes are checked against
    a set of breached passwords.
- id: V6.3.1
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.3 General Authentication Security
  eis: Verify that controls to prevent attacks such as credential stuffing and password brute force are
    implemented according to the application's security documentation.
- id: V6.3.2
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.3 General Authentication Security
  eis: Verify that default user accounts (e.g., "root", "admin", or "sa") are not present in the application
    or are disabled.
- id: V6.3.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.3 General Authentication Security
  eis: Verify that either a multi-factor authentication mechanism or a combination of single-factor authentication
    mechanisms, must be used in order to access the application. For L3, one of the factors must be a
    hardware-based authentication mechanism which provides compromise and impersonation resistance against
    phishing attacks while verifying the intent to authenticate by requiring a user-initiated action (such
    as a button press on a FIDO hardware key or a mobile phone). Relaxing any of the considerations in
    this requirement requires a fully documented rationale and a comprehensive set of mitigating controls.
- id: V6.3.4
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.3 General Authentication Security
  eis: Verify that, if the application includes multiple authentication pathways, there are no undocumented
    pathways and that security controls and authentication strength are enforced consistently.
- id: V6.4.1
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.4 Authentication Factor Lifecycle and Recovery
  eis: Verify that system generated initial passwords or activation codes are securely randomly generated,
    follow the existing password policy, and expire after a short period of time or after they are initially
    used. These initial secrets must not be permitted to become the long term password.
- id: V6.4.2
  niveau: 1
  kapittel: V6 Authentication
  sectie: V6.4 Authentication Factor Lifecycle and Recovery
  eis: Verify that password hints or knowledge-based authentication (so-called "secret questions") are
    not present.
- id: V6.4.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.4 Authentication Factor Lifecycle and Recovery
  eis: Verify that a secure process for resetting a forgotten password is implemented, that does not bypass
    any enabled multi-factor authentication mechanisms.
- id: V6.4.4
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.4 Authentication Factor Lifecycle and Recovery
  eis: Verify that if a multi-factor authentication factor is lost, evidence of identity proofing is performed
    at the same level as during enrollment.
- id: V6.5.1
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.5 General Multi-factor authentication requirements
  eis: Verify that lookup secrets, out-of-band authentication requests or codes, and time-based one-time
    passwords (TOTPs) are only successfully usable once.
- id: V6.5.2
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.5 General Multi-factor authentication requirements
  eis: Verify that, when being stored in the application's backend, lookup secrets with less than 112
    bits of entropy (19 random alphanumeric characters or 34 random digits) are hashed with an approved
    password storage hashing algorithm that incorporates a 32-bit random salt. A standard hash function
    can be used if the secret has 112 bits of entropy or more.
- id: V6.5.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.5 General Multi-factor authentication requirements
  eis: Verify that lookup secrets, out-of-band authentication code, and time-based one-time password seeds,
    are generated using a Cryptographically Secure Pseudorandom Number Generator (CSPRNG) to avoid predictable
    values.
- id: V6.5.4
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.5 General Multi-factor authentication requirements
  eis: Verify that lookup secrets and out-of-band authentication codes have a minimum of 20 bits of entropy
    (typically 4 random alphanumeric characters or 6 random digits is sufficient).
- id: V6.5.5
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.5 General Multi-factor authentication requirements
  eis: Verify that out-of-band authentication requests, codes, or tokens, as well as time-based one-time
    passwords (TOTPs) have a defined lifetime. Out of band requests must have a maximum lifetime of 10
    minutes and for TOTP a maximum lifetime of 30 seconds.
- id: V6.6.1
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.6 Out-of-Band authentication mechanisms
  eis: Verify that authentication mechanisms using the Public Switched Telephone Network (PSTN) to deliver
    One-time Passwords (OTPs) via phone or SMS are offered only when the phone number has previously been
    validated, alternate stronger methods (such as Time based One-time Passwords) are also offered, and
    the service provides information on their security risks to users. For L3 applications, phone and
    SMS must not be available as options.
- id: V6.6.2
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.6 Out-of-Band authentication mechanisms
  eis: Verify that out-of-band authentication requests, codes, or tokens are bound to the original authentication
    request for which they were generated and are not usable for a previous or subsequent one.
- id: V6.6.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.6 Out-of-Band authentication mechanisms
  eis: Verify that a code based out-of-band authentication mechanism is protected against brute force
    attacks by using rate limiting. Consider also using a code with at least 64 bits of entropy.
- id: V6.8.1
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.8 Authentication with an Identity Provider
  eis: Verify that, if the application supports multiple identity providers (IdPs), the user's identity
    cannot be spoofed via another supported identity provider (eg. by using the same user identifier).
    The standard mitigation would be for the application to register and identify the user using a combination
    of the IdP ID (serving as a namespace) and the user's ID in the IdP.
- id: V6.8.2
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.8 Authentication with an Identity Provider
  eis: Verify that the presence and integrity of digital signatures on authentication assertions (for
    example on JWTs or SAML assertions) are always validated, rejecting any assertions that are unsigned
    or have invalid signatures.
- id: V6.8.3
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.8 Authentication with an Identity Provider
  eis: Verify that SAML assertions are uniquely processed and used only once within the validity period
    to prevent replay attacks.
- id: V6.8.4
  niveau: 2
  kapittel: V6 Authentication
  sectie: V6.8 Authentication with an Identity Provider
  eis: Verify that, if an application uses a separate Identity Provider (IdP) and expects specific authentication
    strength, methods, or recentness for specific functions, the application verifies this using the information
    returned by the IdP. For example, if OIDC is used, this might be achieved by validating ID Token claims
    such as 'acr', 'amr', and 'auth_time' (if present). If the IdP does not provide this information,
    the application must have a documented fallback approach that assumes that the minimum strength authentication
    mechanism was used (for example, single-factor authentication using username and password).
- id: V7.1.1
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.1 Session Management Documentation
  eis: Verify that the user's session inactivity timeout and absolute maximum session lifetime are documented,
    are appropriate in combination with other controls, and that the documentation includes justification
    for any deviations from NIST SP 800-63B re-authentication requirements.
- id: V7.1.2
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.1 Session Management Documentation
  eis: Verify that the documentation defines how many concurrent (parallel) sessions are allowed for one
    account as well as the intended behaviors and actions to be taken when the maximum number of active
    sessions is reached.
- id: V7.1.3
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.1 Session Management Documentation
  eis: Verify that all systems that create and manage user sessions as part of a federated identity management
    ecosystem (such as SSO systems) are documented along with controls to coordinate session lifetimes,
    termination, and any other conditions that require re-authentication.
- id: V7.2.1
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.2 Fundamental Session Management Security
  eis: Verify that the application performs all session token verification using a trusted, backend service.
- id: V7.2.2
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.2 Fundamental Session Management Security
  eis: Verify that the application uses either self-contained or reference tokens that are dynamically
    generated for session management, i.e. not using static API secrets and keys.
- id: V7.2.3
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.2 Fundamental Session Management Security
  eis: Verify that if reference tokens are used to represent user sessions, they are unique and generated
    using a cryptographically secure pseudo-random number generator (CSPRNG) and possess at least 128
    bits of entropy.
- id: V7.2.4
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.2 Fundamental Session Management Security
  eis: Verify that the application generates a new session token on user authentication, including re-authentication,
    and terminates the current session token.
- id: V7.3.1
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.3 Session Timeout
  eis: Verify that there is an inactivity timeout such that re-authentication is enforced according to
    risk analysis and documented security decisions.
- id: V7.3.2
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.3 Session Timeout
  eis: Verify that there is an absolute maximum session lifetime such that re-authentication is enforced
    according to risk analysis and documented security decisions.
- id: V7.4.1
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.4 Session Termination
  eis: Verify that when session termination is triggered (such as logout or expiration), the application
    disallows any further use of the session. For reference tokens or stateful sessions, this means invalidating
    the session data at the application backend. Applications using self-contained tokens will need a
    solution such as maintaining a list of terminated tokens, disallowing tokens produced before a per-user
    date and time or rotating a per-user signing key.
- id: V7.4.2
  niveau: 1
  kapittel: V7 Session Management
  sectie: V7.4 Session Termination
  eis: Verify that the application terminates all active sessions when a user account is disabled or deleted
    (such as an employee leaving the company).
- id: V7.4.3
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.4 Session Termination
  eis: Verify that the application gives the option to terminate all other active sessions after a successful
    change or removal of any authentication factor (including password change via reset or recovery and,
    if present, an MFA settings update).
- id: V7.4.4
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.4 Session Termination
  eis: Verify that all pages that require authentication have easy and visible access to logout functionality.
- id: V7.4.5
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.4 Session Termination
  eis: Verify that application administrators are able to terminate active sessions for an individual
    user or for all users.
- id: V7.5.1
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.5 Defenses Against Session Abuse
  eis: Verify that the application requires full re-authentication before allowing modifications to sensitive
    account attributes which may affect authentication such as email address, phone number, MFA configuration,
    or other information used in account recovery.
- id: V7.5.2
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.5 Defenses Against Session Abuse
  eis: Verify that users are able to view and (having authenticated again with at least one factor) terminate
    any or all currently active sessions.
- id: V7.6.1
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.6 Federated Re-authentication
  eis: Verify that session lifetime and termination between Relying Parties (RPs) and Identity Providers
    (IdPs) behave as documented, requiring re-authentication as necessary such as when the maximum time
    between IdP authentication events is reached.
- id: V7.6.2
  niveau: 2
  kapittel: V7 Session Management
  sectie: V7.6 Federated Re-authentication
  eis: Verify that creation of a session requires either the user's consent or an explicit action, preventing
    the creation of new application sessions without user interaction.
- id: V8.1.1
  niveau: 1
  kapittel: V8 Authorization
  sectie: V8.1 Authorization Documentation
  eis: Verify that authorization documentation defines rules for restricting function-level and data-specific
    access based on consumer permissions and resource attributes.
- id: V8.1.2
  niveau: 2
  kapittel: V8 Authorization
  sectie: V8.1 Authorization Documentation
  eis: Verify that authorization documentation defines rules for field-level access restrictions (both
    read and write) based on consumer permissions and resource attributes. Note that these rules might
    depend on other attribute values of the relevant data object, such as state or status.
- id: V8.2.1
  niveau: 1
  kapittel: V8 Authorization
  sectie: V8.2 General Authorization Design
  eis: Verify that the application ensures that function-level access is restricted to consumers with
    explicit permissions.
- id: V8.2.2
  niveau: 1
  kapittel: V8 Authorization
  sectie: V8.2 General Authorization Design
  eis: Verify that the application ensures that data-specific access is restricted to consumers with explicit
    permissions to specific data items to mitigate insecure direct object reference (IDOR) and broken
    object level authorization (BOLA).
- id: V8.2.3
  niveau: 2
  kapittel: V8 Authorization
  sectie: V8.2 General Authorization Design
  eis: Verify that the application ensures that field-level access is restricted to consumers with explicit
    permissions to specific fields to mitigate broken object property level authorization (BOPLA).
- id: V8.3.1
  niveau: 1
  kapittel: V8 Authorization
  sectie: V8.3 Operation Level Authorization
  eis: Verify that the application enforces authorization rules at a trusted service layer and doesn't
    rely on controls that an untrusted consumer could manipulate, such as client-side JavaScript.
- id: V8.4.1
  niveau: 2
  kapittel: V8 Authorization
  sectie: V8.4 Other Authorization Considerations
  eis: Verify that multi-tenant applications use cross-tenant controls to ensure consumer operations will
    never affect tenants with which they do not have permissions to interact.
- id: V9.1.1
  niveau: 1
  kapittel: V9 Self-contained Tokens
  sectie: V9.1 Token source and integrity
  eis: Verify that self-contained tokens are validated using their digital signature or MAC to protect
    against tampering before accepting the token's contents.
- id: V9.1.2
  niveau: 1
  kapittel: V9 Self-contained Tokens
  sectie: V9.1 Token source and integrity
  eis: Verify that only algorithms on an allowlist can be used to create and verify self-contained tokens,
    for a given context. The allowlist must include the permitted algorithms, ideally only either symmetric
    or asymmetric algorithms, and must not include the 'None' algorithm. If both symmetric and asymmetric
    must be supported, additional controls will be needed to prevent key confusion.
- id: V9.1.3
  niveau: 1
  kapittel: V9 Self-contained Tokens
  sectie: V9.1 Token source and integrity
  eis: Verify that key material that is used to validate self-contained tokens is from trusted pre-configured
    sources for the token issuer, preventing attackers from specifying untrusted sources and keys. For
    JWTs and other JWS structures, headers such as 'jku', 'x5u', and 'jwk' must be validated against an
    allowlist of trusted sources.
- id: V9.2.1
  niveau: 1
  kapittel: V9 Self-contained Tokens
  sectie: V9.2 Token content
  eis: Verify that, if a validity time span is present in the token data, the token and its content are
    accepted only if the verification time is within this validity time span. For example, for JWTs, the
    claims 'nbf' and 'exp' must be verified.
- id: V9.2.2
  niveau: 2
  kapittel: V9 Self-contained Tokens
  sectie: V9.2 Token content
  eis: Verify that the service receiving a token validates the token to be the correct type and is meant
    for the intended purpose before accepting the token's contents. For example, only access tokens can
    be accepted for authorization decisions and only ID Tokens can be used for proving user authentication.
- id: V9.2.3
  niveau: 2
  kapittel: V9 Self-contained Tokens
  sectie: V9.2 Token content
  eis: Verify that the service only accepts tokens which are intended for use with that service (audience).
    For JWTs, this can be achieved by validating the 'aud' claim against an allowlist defined in the service.
- id: V9.2.4
  niveau: 2
  kapittel: V9 Self-contained Tokens
  sectie: V9.2 Token content
  eis: Verify that, if a token issuer uses the same private key for issuing tokens to different audiences,
    the issued tokens contain an audience restriction that uniquely identifies the intended audiences.
    This will prevent a token from being reused with an unintended audience. If the audience identifier
    is dynamically provisioned, the token issuer must validate these audiences in order to make sure that
    they do not result in audience impersonation.
- id: V10.1.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.1 Generic OAuth and OIDC Security
  eis: Verify that tokens are only sent to components that strictly need them. For example, when using
    a backend-for-frontend pattern for browser-based JavaScript applications, access and refresh tokens
    shall only be accessible for the backend.
- id: V10.1.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.1 Generic OAuth and OIDC Security
  eis: Verify that the client only accepts values from the authorization server (such as the authorization
    code or ID Token) if these values result from an authorization flow that was initiated by the same
    user agent session and transaction. This requires that client-generated secrets, such as the proof
    key for code exchange (PKCE) 'code_verifier', 'state' or OIDC 'nonce', are not guessable, are specific
    to the transaction, and are securely bound to both the client and the user agent session in which
    the transaction was started.
- id: V10.2.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.2 OAuth Client
  eis: Verify that, if the code flow is used, the OAuth client has protection against browser-based request
    forgery attacks, commonly known as cross-site request forgery (CSRF), which trigger token requests,
    either by using proof key for code exchange (PKCE) functionality or checking the 'state' parameter
    that was sent in the authorization request.
- id: V10.2.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.2 OAuth Client
  eis: Verify that, if the OAuth client can interact with more than one authorization server, it has a
    defense against mix-up attacks. For example, it could require that the authorization server return
    the 'iss' parameter value and validate it in the authorization response and the token response.
- id: V10.3.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.3 OAuth Resource Server
  eis: Verify that the resource server only accepts access tokens that are intended for use with that
    service (audience). The audience may be included in a structured access token (such as the 'aud' claim
    in JWT), or it can be checked using the token introspection endpoint.
- id: V10.3.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.3 OAuth Resource Server
  eis: Verify that the resource server enforces authorization decisions based on claims from the access
    token that define delegated authorization. If claims such as 'sub', 'scope', and 'authorization_details'
    are present, they must be part of the decision.
- id: V10.3.3
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.3 OAuth Resource Server
  eis: Verify that if an access control decision requires identifying a unique user from an access token
    (JWT or related token introspection response), the resource server identifies the user from claims
    that cannot be reassigned to other users. Typically, it means using a combination of 'iss' and 'sub'
    claims.
- id: V10.3.4
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.3 OAuth Resource Server
  eis: Verify that, if the resource server requires specific authentication strength, methods, or recentness,
    it verifies that the presented access token satisfies these constraints. For example, if present,
    using the OIDC 'acr', 'amr' and 'auth_time' claims respectively.
- id: V10.4.1
  niveau: 1
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that the authorization server validates redirect URIs based on a client-specific allowlist
    of pre-registered URIs using exact string comparison.
- id: V10.4.2
  niveau: 1
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that, if the authorization server returns the authorization code in the authorization response,
    it can be used only once for a token request. For the second valid request with an authorization code
    that has already been used to issue an access token, the authorization server must reject a token
    request and revoke any issued tokens related to the authorization code.
- id: V10.4.3
  niveau: 1
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that the authorization code is short-lived. The maximum lifetime can be up to 10 minutes
    for L1 and L2 applications and up to 1 minute for L3 applications.
- id: V10.4.4
  niveau: 1
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that for a given client, the authorization server only allows the usage of grants that this
    client needs to use. Note that the grants 'token' (Implicit flow) and 'password' (Resource Owner Password
    Credentials flow) must no longer be used.
- id: V10.4.5
  niveau: 1
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that the authorization server mitigates refresh token replay attacks for public clients,
    preferably using sender-constrained refresh tokens, i.e., Demonstrating Proof of Possession (DPoP)
    or Certificate-Bound Access Tokens using mutual TLS (mTLS). For L1 and L2 applications, refresh token
    rotation may be used. If refresh token rotation is used, the authorization server must invalidate
    the refresh token after usage, and revoke all refresh tokens for that authorization if an already
    used and invalidated refresh token is provided.
- id: V10.4.6
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that, if the code grant is used, the authorization server mitigates authorization code interception
    attacks by requiring proof key for code exchange (PKCE). For authorization requests, the authorization
    server must require a valid 'code_challenge' value and must not accept a 'code_challenge_method' value
    of 'plain'. For a token request, it must require validation of the 'code_verifier' parameter.
- id: V10.4.7
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that if the authorization server supports unauthenticated dynamic client registration, it
    mitigates the risk of malicious client applications. It must validate client metadata such as any
    registered URIs, ensure the user's consent, and warn the user before processing an authorization request
    with an untrusted client application.
- id: V10.4.8
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that refresh tokens have an absolute expiration, including if sliding refresh token expiration
    is applied.
- id: V10.4.9
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that refresh tokens and reference access tokens can be revoked by an authorized user using
    the authorization server user interface, to mitigate the risk of malicious clients or stolen tokens.
- id: V10.4.10
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that confidential client is authenticated for client-to-authorized server backchannel requests
    such as token requests, pushed authorization requests (PAR), and token revocation requests.
- id: V10.4.11
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.4 OAuth Authorization Server
  eis: Verify that the authorization server configuration only assigns the required scopes to the OAuth
    client.
- id: V10.5.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.5 OIDC Client
  eis: Verify that the client (as the relying party) mitigates ID Token replay attacks. For example, by
    ensuring that the 'nonce' claim in the ID Token matches the 'nonce' value sent in the authentication
    request to the OpenID Provider (in OAuth2 refereed to as the authorization request sent to the authorization
    server).
- id: V10.5.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.5 OIDC Client
  eis: Verify that the client uniquely identifies the user from ID Token claims, usually the 'sub' claim,
    which cannot be reassigned to other users (for the scope of an identity provider).
- id: V10.5.3
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.5 OIDC Client
  eis: Verify that the client rejects attempts by a malicious authorization server to impersonate another
    authorization server through authorization server metadata. The client must reject authorization server
    metadata if the issuer URL in the authorization server metadata does not exactly match the pre-configured
    issuer URL expected by the client.
- id: V10.5.4
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.5 OIDC Client
  eis: Verify that the client validates that the ID Token is intended to be used for that client (audience)
    by checking that the 'aud' claim from the token is equal to the 'client_id' value for the client.
- id: V10.5.5
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.5 OIDC Client
  eis: Verify that, when using OIDC back-channel logout, the relying party mitigates denial of service
    through forced logout and cross-JWT confusion in the logout flow. The client must verify that the
    logout token is correctly typed with a value of 'logout+jwt', contains the 'event' claim with the
    correct member name, and does not contain a 'nonce' claim. Note that it is also recommended to have
    a short expiration (e.g., 2 minutes).
- id: V10.6.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.6 OpenID Provider
  eis: Verify that the OpenID Provider only allows values 'code', 'ciba', 'id_token', or 'id_token code'
    for response mode. Note that 'code' is preferred over 'id_token code' (the OIDC Hybrid flow), and
    'token' (any Implicit flow) must not be used.
- id: V10.6.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.6 OpenID Provider
  eis: Verify that the OpenID Provider mitigates denial of service through forced logout. By obtaining
    explicit confirmation from the end-user or, if present, validating parameters in the logout request
    (initiated by the relying party), such as the 'id_token_hint'.
- id: V10.7.1
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.7 Consent Management
  eis: Verify that the authorization server ensures that the user consents to each authorization request.
    If the identity of the client cannot be assured, the authorization server must always explicitly prompt
    the user for consent.
- id: V10.7.2
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.7 Consent Management
  eis: Verify that when the authorization server prompts for user consent, it presents sufficient and
    clear information about what is being consented to. When applicable, this should include the nature
    of the requested authorizations (typically based on scope, resource server, Rich Authorization Requests
    (RAR) authorization details), the identity of the authorized application, and the lifetime of these
    authorizations.
- id: V10.7.3
  niveau: 2
  kapittel: V10 OAuth and OIDC
  sectie: V10.7 Consent Management
  eis: Verify that the user can review, modify, and revoke consents which the user has granted through
    the authorization server.
- id: V11.1.1
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.1 Cryptographic Inventory and Documentation
  eis: Verify that there is a documented policy for management of cryptographic keys and a cryptographic
    key lifecycle that follows a key management standard such as NIST SP 800-57. This should include ensuring
    that keys are not overshared (for example, with more than two entities for shared secrets and more
    than one entity for private keys).
- id: V11.1.2
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.1 Cryptographic Inventory and Documentation
  eis: Verify that a cryptographic inventory is performed, maintained, regularly updated, and includes
    all cryptographic keys, algorithms, and certificates used by the application. It must also document
    where keys can and cannot be used in the system, and the types of data that can and cannot be protected
    using the keys.
- id: V11.2.1
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.2 Secure Cryptography Implementation
  eis: Verify that industry-validated implementations (including libraries and hardware-accelerated implementations)
    are used for cryptographic operations.
- id: V11.2.2
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.2 Secure Cryptography Implementation
  eis: Verify that the application is designed with crypto agility such that random number, authenticated
    encryption, MAC, or hashing algorithms, key lengths, rounds, ciphers and modes can be reconfigured,
    upgraded, or swapped at any time, to protect against cryptographic breaks. Similarly, it must also
    be possible to replace keys and passwords and re-encrypt data. This will allow for seamless upgrades
    to post-quantum cryptography (PQC), once high-assurance implementations of approved PQC schemes or
    standards are widely available.
- id: V11.2.3
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.2 Secure Cryptography Implementation
  eis: Verify that all cryptographic primitives utilize a minimum of 128-bits of security based on the
    algorithm, key size, and configuration. For example, a 256-bit ECC key provides roughly 128 bits of
    security where RSA requires a 3072-bit key to achieve 128 bits of security.
- id: V11.3.1
  niveau: 1
  kapittel: V11 Cryptography
  sectie: V11.3 Encryption Algorithms
  eis: Verify that insecure block modes (e.g., ECB) and weak padding schemes (e.g., PKCS#1 v1.5) are not
    used.
- id: V11.3.2
  niveau: 1
  kapittel: V11 Cryptography
  sectie: V11.3 Encryption Algorithms
  eis: Verify that only approved ciphers and modes such as AES with GCM are used.
- id: V11.3.3
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.3 Encryption Algorithms
  eis: Verify that encrypted data is protected against unauthorized modification preferably by using an
    approved authenticated encryption method or by combining an approved encryption method with an approved
    MAC algorithm.
- id: V11.4.1
  niveau: 1
  kapittel: V11 Cryptography
  sectie: V11.4 Hashing and Hash-based Functions
  eis: Verify that only approved hash functions are used for general cryptographic use cases, including
    digital signatures, HMAC, KDF, and random bit generation. Disallowed hash functions, such as MD5,
    must not be used for any cryptographic purpose.
- id: V11.4.2
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.4 Hashing and Hash-based Functions
  eis: Verify that passwords are stored using an approved, computationally intensive, key derivation function
    (also known as a "password hashing function"), with parameter settings configured based on current
    guidance. The settings should balance security and performance to make brute-force attacks sufficiently
    challenging for the required level of security.
- id: V11.4.3
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.4 Hashing and Hash-based Functions
  eis: Verify that hash functions used in digital signatures, as part of data authentication or data integrity
    are collision resistant and have appropriate bit-lengths. If collision resistance is required, the
    output length must be at least 256 bits. If only resistance to second pre-image attacks is required,
    the output length must be at least 128 bits.
- id: V11.4.4
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.4 Hashing and Hash-based Functions
  eis: Verify that the application uses approved key derivation functions with key stretching parameters
    when deriving secret keys from passwords. The parameters in use must balance security and performance
    to prevent brute-force attacks from compromising the resulting cryptographic key.
- id: V11.5.1
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.5 Random Values
  eis: Verify that all random numbers and strings which are intended to be non-guessable must be generated
    using a cryptographically secure pseudo-random number generator (CSPRNG) and have at least 128 bits
    of entropy. Note that UUIDs do not respect this condition.
- id: V11.6.1
  niveau: 2
  kapittel: V11 Cryptography
  sectie: V11.6 Public Key Cryptography
  eis: Verify that only approved cryptographic algorithms and modes of operation are used for key generation
    and seeding, and digital signature generation and verification. Key generation algorithms must not
    generate insecure keys vulnerable to known attacks, for example, RSA keys which are vulnerable to
    Fermat factorization.
- id: V12.1.1
  niveau: 1
  kapittel: V12 Secure Communication
  sectie: V12.1 General TLS Security Guidance
  eis: Verify that only the latest recommended versions of the TLS protocol are enabled, such as TLS 1.2
    and TLS 1.3. The latest version of the TLS protocol must be the preferred option.
- id: V12.1.2
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.1 General TLS Security Guidance
  eis: Verify that only recommended cipher suites are enabled, with the strongest cipher suites set as
    preferred. L3 applications must only support cipher suites which provide forward secrecy.
- id: V12.1.3
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.1 General TLS Security Guidance
  eis: Verify that the application validates that mTLS client certificates are trusted before using the
    certificate identity for authentication or authorization.
- id: V12.2.1
  niveau: 1
  kapittel: V12 Secure Communication
  sectie: V12.2 HTTPS Communication with External Facing Services
  eis: Verify that TLS is used for all connectivity between a client and external facing, HTTP-based services,
    and does not fall back to insecure or unencrypted communications.
- id: V12.2.2
  niveau: 1
  kapittel: V12 Secure Communication
  sectie: V12.2 HTTPS Communication with External Facing Services
  eis: Verify that external facing services use publicly trusted TLS certificates.
- id: V12.3.1
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.3 General Service to Service Communication Security
  eis: Verify that an encrypted protocol such as TLS is used for all inbound and outbound connections
    to and from the application, including monitoring systems, management tools, remote access and SSH,
    middleware, databases, mainframes, partner systems, or external APIs. The server must not fall back
    to insecure or unencrypted protocols.
- id: V12.3.2
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.3 General Service to Service Communication Security
  eis: Verify that TLS clients validate certificates received before communicating with a TLS server.
- id: V12.3.3
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.3 General Service to Service Communication Security
  eis: Verify that TLS or another appropriate transport encryption mechanism used for all connectivity
    between internal, HTTP-based services within the application, and does not fall back to insecure or
    unencrypted communications.
- id: V12.3.4
  niveau: 2
  kapittel: V12 Secure Communication
  sectie: V12.3 General Service to Service Communication Security
  eis: Verify that TLS connections between internal services use trusted certificates. Where internally
    generated or self-signed certificates are used, the consuming service must be configured to only trust
    specific internal CAs and specific self-signed certificates.
- id: V13.1.1
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.1 Configuration Documentation
  eis: Verify that all communication needs for the application are documented. This must include external
    services which the application relies upon and cases where an end user might be able to provide an
    external location to which the application will then connect.
- id: V13.2.1
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.2 Backend Communication Configuration
  eis: Verify that communications between backend application components that don't support the application's
    standard user session mechanism, including APIs, middleware, and data layers, are authenticated. Authentication
    must use individual service accounts, short-term tokens, or certificate-based authentication and not
    unchanging credentials such as passwords, API keys, or shared accounts with privileged access.
- id: V13.2.2
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.2 Backend Communication Configuration
  eis: Verify that communications between backend application components, including local or operating
    system services, APIs, middleware, and data layers, are performed with accounts assigned the least
    necessary privileges.
- id: V13.2.3
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.2 Backend Communication Configuration
  eis: Verify that if a credential has to be used for service authentication, the credential being used
    by the consumer is not a default credential (e.g., root/root or admin/admin).
- id: V13.2.4
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.2 Backend Communication Configuration
  eis: Verify that an allowlist is used to define the external resources or systems with which the application
    is permitted to communicate (e.g., for outbound requests, data loads, or file access). This allowlist
    can be implemented at the application layer, web server, firewall, or a combination of different layers.
- id: V13.2.5
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.2 Backend Communication Configuration
  eis: Verify that the web or application server is configured with an allowlist of resources or systems
    to which the server can send requests or load data or files from.
- id: V13.3.1
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.3 Secret Management
  eis: Verify that a secrets management solution, such as a key vault, is used to securely create, store,
    control access to, and destroy backend secrets. These could include passwords, key material, integrations
    with databases and third-party systems, keys and seeds for time-based tokens, other internal secrets,
    and API keys. Secrets must not be included in application source code or included in build artifacts.
    For an L3 application, this must involve a hardware-backed solution such as an HSM.
- id: V13.3.2
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.3 Secret Management
  eis: Verify that access to secret assets adheres to the principle of least privilege.
- id: V13.4.1
  niveau: 1
  kapittel: V13 Configuration
  sectie: V13.4 Unintended Information Leakage
  eis: Verify that the application is deployed either without any source control metadata, including the
    .git or .svn folders, or in a way that these folders are inaccessible both externally and to the application
    itself.
- id: V13.4.2
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.4 Unintended Information Leakage
  eis: Verify that debug modes are disabled for all components in production environments to prevent exposure
    of debugging features and information leakage.
- id: V13.4.3
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.4 Unintended Information Leakage
  eis: Verify that web servers do not expose directory listings to clients unless explicitly intended.
- id: V13.4.4
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.4 Unintended Information Leakage
  eis: Verify that using the HTTP TRACE method is not supported in production environments, to avoid potential
    information leakage.
- id: V13.4.5
  niveau: 2
  kapittel: V13 Configuration
  sectie: V13.4 Unintended Information Leakage
  eis: Verify that documentation (such as for internal APIs) and monitoring endpoints are not exposed
    unless explicitly intended.
- id: V14.1.1
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.1 Data Protection Documentation
  eis: Verify that all sensitive data created and processed by the application has been identified and
    classified into protection levels. This includes data that is only encoded and therefore easily decoded,
    such as Base64 strings or the plaintext payload inside a JWT. Protection levels need to take into
    account any data protection and privacy regulations and standards which the application is required
    to comply with.
- id: V14.1.2
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.1 Data Protection Documentation
  eis: Verify that all sensitive data protection levels have a documented set of protection requirements.
    This must include (but not be limited to) requirements related to general encryption, integrity verification,
    retention, how the data is to be logged, access controls around sensitive data in logs, database-level
    encryption, privacy and privacy-enhancing technologies to be used, and other confidentiality requirements.
- id: V14.2.1
  niveau: 1
  kapittel: V14 Data Protection
  sectie: V14.2 General Data Protection
  eis: Verify that sensitive data is only sent to the server in the HTTP message body or header fields,
    and that the URL and query string do not contain sensitive information, such as an API key or session
    token.
- id: V14.2.2
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.2 General Data Protection
  eis: Verify that the application prevents sensitive data from being cached in server components, such
    as load balancers and application caches, or ensures that the data is securely purged after use.
- id: V14.2.3
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.2 General Data Protection
  eis: Verify that defined sensitive data is not sent to untrusted parties (e.g., user trackers) to prevent
    unwanted collection of data outside of the application's control.
- id: V14.2.4
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.2 General Data Protection
  eis: Verify that controls around sensitive data related to encryption, integrity verification, retention,
    how the data is to be logged, access controls around sensitive data in logs, privacy and privacy-enhancing
    technologies, are implemented as defined in the documentation for the specific data's protection level.
- id: V14.3.1
  niveau: 1
  kapittel: V14 Data Protection
  sectie: V14.3 Client-side Data Protection
  eis: Verify that authenticated data is cleared from client storage, such as the browser DOM, after the
    client or session is terminated. The 'Clear-Site-Data' HTTP response header field may be able to help
    with this but the client-side should also be able to clear up if the server connection is not available
    when the session is terminated.
- id: V14.3.2
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.3 Client-side Data Protection
  eis: 'Verify that the application sets sufficient anti-caching HTTP response header fields (i.e., Cache-Control:
    no-store) so that sensitive data is not cached in browsers.'
- id: V14.3.3
  niveau: 2
  kapittel: V14 Data Protection
  sectie: V14.3 Client-side Data Protection
  eis: Verify that data stored in browser storage (such as localStorage, sessionStorage, IndexedDB, or
    cookies) does not contain sensitive data, with the exception of session tokens.
- id: V15.1.1
  niveau: 1
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.1 Secure Coding and Architecture Documentation
  eis: Verify that application documentation defines risk based remediation time frames for 3rd party
    component versions with vulnerabilities and for updating libraries in general, to minimize the risk
    from these components.
- id: V15.1.2
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.1 Secure Coding and Architecture Documentation
  eis: Verify that an inventory catalog, such as software bill of materials (SBOM), is maintained of all
    third-party libraries in use, including verifying that components come from pre-defined, trusted,
    and continually maintained repositories.
- id: V15.1.3
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.1 Secure Coding and Architecture Documentation
  eis: Verify that the application documentation identifies functionality which is time-consuming or resource-demanding.
    This must include how to prevent a loss of availability due to overusing this functionality and how
    to avoid a situation where building a response takes longer than the consumer's timeout. Potential
    defenses may include asynchronous processing, using queues, and limiting parallel processes per user
    and per application.
- id: V15.2.1
  niveau: 1
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.2 Security Architecture and Dependencies
  eis: Verify that the application only contains components which have not breached the documented update
    and remediation time frames.
- id: V15.2.2
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.2 Security Architecture and Dependencies
  eis: Verify that the application has implemented defenses against loss of availability due to functionality
    which is time-consuming or resource-demanding, based on the documented security decisions and strategies
    for this.
- id: V15.2.3
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.2 Security Architecture and Dependencies
  eis: Verify that the production environment only includes functionality that is required for the application
    to function, and does not expose extraneous functionality such as test code, sample snippets, and
    development functionality.
- id: V15.3.1
  niveau: 1
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that the application only returns the required subset of fields from a data object. For
    example, it should not return an entire data object, as some individual fields should not be accessible
    to users.
- id: V15.3.2
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that where the application backend makes calls to external URLs, it is configured to not
    follow redirects unless it is intended functionality.
- id: V15.3.3
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that the application has countermeasures to protect against mass assignment attacks by limiting
    allowed fields per controller and action, e.g., it is not possible to insert or update a field value
    when it was not intended to be part of that action.
- id: V15.3.4
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that all proxying and middleware components transfer the user's original IP address correctly
    using trusted data fields that cannot be manipulated by the end user, and the application and web
    server use this correct value for logging and security decisions such as rate limiting, taking into
    account that even the original IP address may not be reliable due to dynamic IPs, VPNs, or corporate
    firewalls.
- id: V15.3.5
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that the application explicitly ensures that variables are of the correct type and performs
    strict equality and comparator operations. This is to avoid type juggling or type confusion vulnerabilities
    caused by the application code making an assumption about a variable type.
- id: V15.3.6
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that JavaScript code is written in a way that prevents prototype pollution, for example,
    by using Set() or Map() instead of object literals.
- id: V15.3.7
  niveau: 2
  kapittel: V15 Secure Coding and Architecture
  sectie: V15.3 Defensive Coding
  eis: Verify that the application has defenses against HTTP parameter pollution attacks, particularly
    if the application framework makes no distinction about the source of request parameters (query string,
    body parameters, cookies, or header fields).
- id: V16.1.1
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.1 Security Logging Documentation
  eis: Verify that an inventory exists documenting the logging performed at each layer of the application's
    technology stack, what events are being logged, log formats, where that logging is stored, how it
    is used, how access to it is controlled, and for how long logs are kept.
- id: V16.2.1
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.2 General Logging
  eis: Verify that each log entry includes necessary metadata (such as when, where, who, what) that would
    allow for a detailed investigation of the timeline when an event happens.
- id: V16.2.2
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.2 General Logging
  eis: Verify that time sources for all logging components are synchronized, and that timestamps in security
    event metadata use UTC or include an explicit time zone offset. UTC is recommended to ensure consistency
    across distributed systems and to prevent confusion during daylight saving time transitions.
- id: V16.2.3
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.2 General Logging
  eis: Verify that the application only stores or broadcasts logs to the files and services that are documented
    in the log inventory.
- id: V16.2.4
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.2 General Logging
  eis: Verify that logs can be read and correlated by the log processor that is in use, preferably by
    using a common logging format.
- id: V16.2.5
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.2 General Logging
  eis: Verify that when logging sensitive data, the application enforces logging based on the data's protection
    level. For example, it may not be allowed to log certain data, such as credentials or payment details.
    Other data, such as session tokens, may only be logged by being hashed or masked, either in full or
    partially.
- id: V16.3.1
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.3 Security Events
  eis: Verify that all authentication operations are logged, including successful and unsuccessful attempts.
    Additional metadata, such as the type of authentication or factors used, should also be collected.
- id: V16.3.2
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.3 Security Events
  eis: Verify that failed authorization attempts are logged. For L3, this must include logging all authorization
    decisions, including logging when sensitive data is accessed (without logging the sensitive data itself).
- id: V16.3.3
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.3 Security Events
  eis: Verify that the application logs the security events that are defined in the documentation and
    also logs attempts to bypass the security controls, such as input validation, business logic, and
    anti-automation.
- id: V16.3.4
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.3 Security Events
  eis: Verify that the application logs unexpected errors and security control failures such as backend
    TLS failures.
- id: V16.4.1
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.4 Log Protection
  eis: Verify that all logging components appropriately encode data to prevent log injection.
- id: V16.4.2
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.4 Log Protection
  eis: Verify that logs are protected from unauthorized access and cannot be modified.
- id: V16.4.3
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.4 Log Protection
  eis: Verify that logs are securely transmitted to a logically separate system for analysis, detection,
    alerting, and escalation. The aim is to ensure that if the application is breached, the logs are not
    compromised.
- id: V16.5.1
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.5 Error Handling
  eis: Verify that a generic message is returned to the consumer when an unexpected or security-sensitive
    error occurs, ensuring no exposure of sensitive internal system data such as stack traces, queries,
    secret keys, and tokens.
- id: V16.5.2
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.5 Error Handling
  eis: Verify that the application continues to operate securely when external resource access fails,
    for example, by using patterns such as circuit breakers or graceful degradation.
- id: V16.5.3
  niveau: 2
  kapittel: V16 Security Logging and Error Handling
  sectie: V16.5 Error Handling
  eis: Verify that the application fails gracefully and securely, including when an exception occurs,
    preventing fail-open conditions such as processing a transaction despite errors resulting from validation
    logic.
- id: V17.1.1
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.1 TURN Server
  eis: Verify that the Traversal Using Relays around NAT (TURN) service only allows access to IP addresses
    that are not reserved for special purposes (e.g., internal networks, broadcast, loopback). Note that
    this applies to both IPv4 and IPv6 addresses.
- id: V17.2.1
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.2 Media
  eis: Verify that the key for the Datagram Transport Layer Security (DTLS) certificate is managed and
    protected based on the documented policy for management of cryptographic keys.
- id: V17.2.2
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.2 Media
  eis: Verify that the media server is configured to use and support approved Datagram Transport Layer
    Security (DTLS) cipher suites and a secure protection profile for the DTLS Extension for establishing
    keys for the Secure Real-time Transport Protocol (DTLS-SRTP).
- id: V17.2.3
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.2 Media
  eis: Verify that Secure Real-time Transport Protocol (SRTP) authentication is checked at the media server
    to prevent Real-time Transport Protocol (RTP) injection attacks from leading to either a Denial of
    Service condition or audio or video media insertion into media streams.
- id: V17.2.4
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.2 Media
  eis: Verify that the media server is able to continue processing incoming media traffic when encountering
    malformed Secure Real-time Transport Protocol (SRTP) packets.
- id: V17.3.1
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.3 Signaling
  eis: Verify that the signaling server is able to continue processing legitimate incoming signaling messages
    during a flood attack. This should be achieved by implementing rate limiting at the signaling level.
- id: V17.3.2
  niveau: 2
  kapittel: V17 WebRTC
  sectie: V17.3 Signaling
  eis: Verify that the signaling server is able to continue processing legitimate signaling messages when
    encountering malformed signaling message that could cause a denial of service condition. This could
    include implementing input validation, safely handling integer overflows, preventing buffer overflows,
    and employing other robust error-handling techniques.
