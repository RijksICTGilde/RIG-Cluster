# Ons oordeel per ASVS-eis: gedekt door een automatische toets, gedekt door een plan, of
# handwerk. De eisen zelf staan in asvs-5.0-eisen.yaml, letterlijk uit de standaard.
#
# docs/asvs-zelfbeoordeling.md volgt hieruit met `task asvs-afvinklijst`, en `task asvs-check`
# faalt zodra een eis geen oordeel heeft of een genoemde toets niet bestaat. Zie
# features/asvs-zelfbeoordeling.md voor hoe je een regel bijwerkt.
#
# status: toets (met een bestaande toets), plan (met een RC-nummer), handwerk (met een
# eigenaar) of nvt (met de reden waarom de eis hier niet geldt).
niveau: L2
oordelen:
- id: V1.1.1
  status: handwerk
  eigenaar: OPI-ontwikkelteam
  toelichting: Decoderen gebeurt in FastAPI en Pydantic; dat het eenmalig is, is nog niet getoetst. te
    doen in de handmatige ronde voor de externe audit
- id: V1.1.2
  status: toets
  toets: operations-manager/python/tests/e2e/test_gedragsoppervlak.py
  toelichting: De HTML-kant rendert met autoescape aan; de meting staat op de gebouwde app en niet op
    een eigen Jinja-environment.
- id: V1.2.1
  status: toets
  toets: operations-manager/python/tests/e2e/test_gedragsoppervlak.py operations-manager/python/tests/test_security_headers.py
- id: V1.2.2
  status: handwerk
  eigenaar: OPI-ontwikkelteam
  toelichting: URL's worden met urlencode opgebouwd, zonder eigen toets daarop. te doen in de handmatige
    ronde voor de externe audit
- id: V1.2.3
  status: toets
  toets: operations-manager/python/tests/e2e/test_gedragsoppervlak.py
  toelichting: tojson plus forceescape is de conventie voor een JS-tekenreeks in een attribuut; de gedragstoets
    meet het op de gerenderde pagina.
- id: V1.2.4
  status: toets
  toets: aanvalsproef/semgrep-zad.yaml .github/workflows/security.yml#sast-codeql
  toelichting: SQLAlchemy 2.0 met gebonden parameters; de SAST-gate is wat een rauwe query zou vangen.
- id: V1.2.5
  status: toets
  toets: operations-manager/python/tests/test_pgdump_command_injection.py aanvalsproef/semgrep-zad.yaml
    .github/workflows/security.yml#sast-codeql
  toelichting: De connectors geven een argumentenlijst mee; de semgrep-regels zad-subprocess-buiten-connector
    en zad-subprocess-via-een-shell en de taint-analyse van CodeQL houden dat vast.
- id: V1.2.6
  status: nvt
  toelichting: 'ZAD doet geen eigen LDAP-queries: de koppeling met SSO-Rijk loopt via Keycloak over OIDC.'
- id: V1.2.7
  status: nvt
  toelichting: Er wordt geen XPath gebruikt.
- id: V1.2.8
