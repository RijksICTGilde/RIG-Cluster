apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Gepind, zie de toelichting in cert-manager/controller/base. Levert de CRD's waar
# postgresql/database zijn Cluster- en Database-resources op bouwt, dus dit moet in een
# eerdere sync-wave staan dan die component.
#
# Ook hier geldt: grote CRD's, dus ServerSideApply=true op de Application.
resources:
  - https://raw.githubusercontent.com/cloudnative-pg/cloudnative-pg/release-1.27/releases/cnpg-1.27.3.yaml
