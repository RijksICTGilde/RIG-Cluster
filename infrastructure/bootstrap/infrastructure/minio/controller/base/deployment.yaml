apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: rig-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
        # Zonder dit zet de kubelet bij elke start de ownership van ELK bestand op de PVC
        # om. Op odcn duurde dat langer dan het rollout-venster, met een
        # VolumePermissionChangeInProgress-event en een herstart die als mislukt gold
        # (09-10-2026). OnRootMismatch kijkt alleen naar de top van het volume en doet de
        # rest alleen als die niet klopt.
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: minio
        # Onze eigen build uit de broncode van deze tag. MinIO heeft docker.io/minio en quay.io/minio
        # allebei achter een abonnement gezet, 401 op elke tag, en het project is gearchiveerd.
        # Zie images/README.md en docs/KNOWN-ISSUES.md. odcn haalt hem via de rcr-proxy, zie de overlay daar.
        image: ghcr.io/minbzk/base-images/minio:RELEASE.2025-07-23T15-54-02Z
        command: ["minio", "server", "/data/disk{1...4}", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          # Working set sat at 0.95-0.97Gi of the old 1Gi limit, mostly page cache,
          # and 16% of the CFS periods were throttled at 500m (02-11-2026).
          limits:
            memory: 2Gi
            cpu: "1"
            ephemeral-storage: "1Gi"
          requests:
            cpu: 50m
            memory: 256Mi
            ephemeral-storage: "1Gi"
        envFrom:
        - secretRef:
            name: minio-admin-credentials
        env:
        - name: MINIO_BROWSER_LOGIN_ANIMATION
          value: "off"
        # Without this, /minio/v2/metrics/cluster demands a bearer token and the
        # Prometheus scrape job gets a 403, so no minio_* series exist at all.
        # The endpoint serves counters and gauges, never object data, and is
        # only reachable inside the namespace.
        - name: MINIO_PROMETHEUS_AUTH_TYPE
          value: "public"
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 30
          # The k8s defaults (timeoutSeconds 1, failureThreshold 3) SIGKILLed this pod
          # every one to three days (exit 137, never OOMKilled) when MinIO could not
          # answer within 1s during a Ceph-RBD I/O spike. Same values as
          # backup-destination, where this fix ended the restarts.
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-storage-versioned
