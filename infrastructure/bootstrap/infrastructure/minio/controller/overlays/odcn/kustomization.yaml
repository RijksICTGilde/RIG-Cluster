apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-prd-operations
resources:
- ../../base

patches:
  - target:
      kind: PersistentVolumeClaim
      name: minio-storage
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd
  - target:
      kind: PersistentVolumeClaim
      name: minio-storage-versioned
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd
  - target:
      kind: Service
      name: minio
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: minio-versioned