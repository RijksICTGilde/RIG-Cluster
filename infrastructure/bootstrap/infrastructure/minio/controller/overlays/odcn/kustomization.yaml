apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-prd-operations
resources:
- ../../base

patches:
  # NOODVERBAND, 24 september 2026. De image is nergens meer te pullen: MinIO heeft zijn
  # Docker Hub-repository achter een abonnement gezet (401 op elke tag, ook ingelogd), de tag
  # is uit de RCR-proxycache verlopen en die kan hem niet terughalen ("upstream authentication
  # failed"). Node w4-51l09-11 heeft de image nog lokaal, want de backup-MinIO draait er al
  # 35 uur op. Pin de pod daarheen en pull niet.
  #
  # WEGHALEN zodra de image weer normaal te pullen is: dit kost de scheduler zijn vrijheid en
  # overleeft het wegvallen van die ene node niet.
  - target:
      kind: Deployment
      name: minio
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          kubernetes.io/hostname: w4-51l09-11
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: PersistentVolumeClaim
      name: minio-storage-versioned
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd
      - op: replace
        path: /spec/resources/requests/storage
        value: 10Gi

# ODCN-nodes mogen quay.io niet rechtstreeks; alles loopt via de RCR-proxycache. Het
# quay-rig-robot-pull-secret hangt al aan de default serviceaccount in deze namespaces.
# Op digest en niet op tag: de proxycache laat een tag verlopen (Quay time machine) en dan
# faalt de pull met "Tag ... was deleted or has expired" zodra een pod op een node landt die
# de image niet lokaal heeft. De digest is die van RELEASE.2025-07-23T15-54-02Z.
# Op de TAG en niet op de digest: de node heeft het image onder de tag-referentie liggen, en
# CRI-O vergelijkt de hele referentie en niet de image-ID. Met een digest erin ziet hij hem
# als afwezig en gaat hij pullen, wat juist niet kan.
images:
  - name: quay.io/minio/minio
    newName: rcr.rijksapps.nl/quay-rig/minio/minio
