apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base

patches:
  - target:
      kind: Deployment
      name: minio
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
        value: 1001
  - target:
      kind: Deployment
      name: minio-versioned
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 1001
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsGroup
        value: 1001
  # Phase 3: Switch minio service to point to versioned deployment
  - target:
      kind: Service
      name: minio
    patch: |-
      - op: replace
        path: /spec/selector/app
        value: minio-versioned