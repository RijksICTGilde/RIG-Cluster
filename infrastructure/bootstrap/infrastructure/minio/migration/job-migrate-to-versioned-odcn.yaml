apiVersion: batch/v1
kind: Job
metadata:
  name: minio-migration-to-versioned
  namespace: rig-system
spec:
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: migrate
        image: ghcr.io/minbzk/base-images/operations-manager/operations-manager:latest
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up MinIO client aliases..."
            mc alias set old http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
            mc alias set new http://minio-versioned:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

            echo "Listing buckets on old MinIO..."
            mc ls old/

            echo "Starting migration..."
            mc ls old/ | awk '{print $NF}' | sed 's:/$::' | while read bucket; do
              echo "Creating bucket: $bucket"
              mc mb --ignore-existing new/$bucket

              echo "Enabling versioning on: $bucket"
              mc version enable new/$bucket

              echo "Mirroring bucket: $bucket"
              mc mirror --preserve old/$bucket new/$bucket
            done

            echo "Migration complete. Verifying..."
            echo "Old MinIO buckets:"
            mc ls old/
            echo "New MinIO buckets:"
            mc ls new/

            echo "Done!"
        env:
        - name: MC_CONFIG_DIR
          value: /tmp/.mc
        - name: HOME
          value: /tmp
        envFrom:
        - secretRef:
            name: minio-admin-credentials
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: "100m"
            memory: 128Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi