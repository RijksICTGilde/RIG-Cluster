apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-access
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio

  ingress:
    # Platform namespace itself (OPI co-located in rig-prd-operations).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
      ports:
        - protocol: TCP
          port: 9000  # S3 API
        - protocol: TCP
          port: 9001  # MinIO Console

    # Tenant namespaces (OPI-generated, stamped with `created-by:
    # operations-manager`). Replaces the previous empty `namespaceSelector: {}`
    # that exposed the S3 API to every namespace on the cluster.
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        - protocol: TCP
          port: 9000

    # OpenShift Router (ingress controller on odcn-production).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001

  egress:
    # DNS resolution.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Prometheus metrics scraping.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
