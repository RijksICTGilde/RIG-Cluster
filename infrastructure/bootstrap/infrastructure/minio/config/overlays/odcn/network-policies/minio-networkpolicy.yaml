# Deny all ingress to minio pods. Backstop voor allow-policies hieronder.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: minio-default-deny
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-access
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  ingress:
    # Platform namespace (OPI, co-located workloads).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
    # Tenant namespaces (created-by label).
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        - protocol: TCP
          port: 9000
    # OpenShift Router.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9091
