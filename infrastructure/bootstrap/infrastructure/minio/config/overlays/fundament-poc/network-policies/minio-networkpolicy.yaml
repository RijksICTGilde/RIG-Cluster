# podSelector + policyTypes maakt minio-pods automatisch deny-by-default;
# alleen verkeer dat hieronder expliciet allowed wordt komt door.
#
# Overgenomen van de odcn-variant, met één verschil: die selecteert tenant-namespaces
# op het Capsule-tenantlabel, en Capsule draait hier niet. Dat label zou nergens op
# matchen en de policy zou dichtvallen (punt 2.2o van een-nieuw-cluster-installeren.md).
# `created-by: operations-manager` zet onze eigen namespace-template en werkt dus wel.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-access
  namespace: rig-system
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes: [Ingress, Egress]
  ingress:
    # Platform namespace (OPI gebruikt S3 API + Console).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-system
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
    # Tenant namespaces gebruiken alleen S3 API.
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        - protocol: TCP
          port: 9000
  egress:
    # DNS. Twee poorten, en dat is geen slordigheid: een NetworkPolicy matcht op de poort van
    # de ONTVANGENDE pod, niet op de poort van de Service. Op dit cluster (Gardener) luistert
    # CoreDNS op 8053 en vertaalt de kube-dns Service 53 -> 8053; met alleen 53 in deze regel
    # komt er geen enkele lookup door terwijl de policy er correct uitziet. MinIO start daar
    # gewoon van door en meldt zich Running, dus dit valt niet op tot iets een naam moet
    # opzoeken. Gemeten op 26-08-2026: met 8053 erbij lost dezelfde pod wel op. 53 blijft
    # staan voor de clusters waar CoreDNS wel op 53 luistert (sandbox, ODCN).
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 8053
        - protocol: TCP
          port: 8053
