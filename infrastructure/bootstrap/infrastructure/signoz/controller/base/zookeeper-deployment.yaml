apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz-zookeeper
  namespace: rig-system
  labels:
    app: signoz-zookeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz-zookeeper
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: signoz-zookeeper
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zookeeper
          image: bitnami/zookeeper:3.7.1
          ports:
            - containerPort: 2181
              name: client
          env:
            - name: ALLOW_ANONYMOUS_LOGIN
              value: "yes"
            - name: ZOO_4LW_COMMANDS_WHITELIST
              value: "srvr,mntr,ruok"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | timeout 2 nc -w 2 localhost 2181 | grep imok
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - echo ruok | timeout 2 nc -w 2 localhost 2181 | grep imok
            initialDelaySeconds: 10
            periodSeconds: 10
