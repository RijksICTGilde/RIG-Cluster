apiVersion: batch/v1
kind: Job
metadata:
  name: signoz-schema-migrator
  namespace: rig-system
  labels:
    app: signoz-schema-migrator
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: signoz-schema-migrator
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-clickhouse
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for ClickHouse to be ready..."
              until wget -q -O- http://signoz-clickhouse:8123/ping 2>/dev/null | grep -q "Ok"; do
                echo "ClickHouse not ready, retrying in 5s..."
                sleep 5
              done
              echo "ClickHouse is ready"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: schema-migrator
          image: signoz/signoz-schema-migrator:latest
          args:
            - "--dsn=tcp://signoz-clickhouse:9000"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
