apiVersion: apps/v1
kind: Deployment
metadata:
  name: signoz
  namespace: rig-system
  labels:
    app: signoz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: signoz
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: signoz
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: signoz
          image: signoz/signoz:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SIGNOZ_CLICKHOUSE_HOST
              value: signoz-clickhouse
            - name: SIGNOZ_CLICKHOUSE_PORT
              value: "9000"
            - name: STORAGE
              value: clickhouse
            - name: GODEBUG
              value: netdns=go
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: signoz-data
              mountPath: /var/lib/signoz
      volumes:
        - name: signoz-data
          persistentVolumeClaim:
            claimName: signoz-storage
