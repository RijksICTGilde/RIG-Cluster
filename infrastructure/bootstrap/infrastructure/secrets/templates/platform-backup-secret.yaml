# De credentials van de nachtelijke back-up van de platformdatabase
# (postgresql/database/base/platform-backup-cronjob.yaml). Twee lezers, één geheim:
#
#   1. CNPG maakt de leesrol `platform_backup` in cluster.yaml met `username` en
#      `password`, en vraagt daarvoor de vorm kubernetes.io/basic-auth.
#   2. De CronJob leest diezelfde twee plus KOPIA_PASSWORD, het wachtwoord van de
#      Kopia-repository in de bucket rig-platform-db.
#
# KOPIA_PASSWORD staat er bewust bij in en niet in een eigen bestand: raak je hem kwijt,
# dan zijn de back-ups onleesbaar, en één bestand per cluster is één plek om te bewaren.
# Hij roteert daarom niet mee in een gewone ronde; zie de rij platform-backup in
# scripts/secret_rotate.py.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: platform-backup-credentials
  namespace: rig-system
  labels:
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/component: database-credential
    app.kubernetes.io/managed-by: kustomize
    cnpg.io/reload: "true"
stringData:
  username: platform_backup
  password: platform_backup # @secret-gen:random:24
  KOPIA_PASSWORD: platform_backup # @secret-gen:random:32
