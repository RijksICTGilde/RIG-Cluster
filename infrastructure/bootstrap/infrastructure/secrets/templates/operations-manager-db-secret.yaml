# De rol waarmee OPI zijn EIGEN database opent (RC-410). Twee lezers, één geheim:
#
#   1. CNPG maakt de managed role `operations_manager` in cluster.yaml met `username` en
#      `password`, en vraagt daarvoor de vorm kubernetes.io/basic-auth.
#   2. De OPI-Deployment leest diezelfde twee als DATABASE_APP_USER en
#      DATABASE_APP_PASSWORD (bootstrap/rig-system/kustomize/operations-manager/base).
#
# Niet optional in de Deployment: zonder dit secret start de pod niet, en dat is de juiste
# uitkomst. Infra gaat daarom vóór de OPI-release. Roteren: zie de rij operations-manager-db
# in scripts/secret_rotate.py.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: operations-manager-db-credentials
  namespace: rig-system
  labels:
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/component: database-credential
    app.kubernetes.io/managed-by: kustomize
    cnpg.io/reload: "true"
stringData:
  username: operations_manager
  password: operations_manager # @secret-gen:random:32
