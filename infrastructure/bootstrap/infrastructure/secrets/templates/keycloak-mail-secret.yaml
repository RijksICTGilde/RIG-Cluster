# Het wachtwoord waarmee KEYCLOAK post aan de mailrelay aanbiedt.
#
# HIER EN NIET IN OPI, en dat is de omkering ten opzichte van het platformaccount van ZAD
# zelf (zad-platform, zie mail-relay-secret.yaml). De regel die de twee uit elkaar houdt:
#
#     een geheim dat een DERDE PARTIJ nodig heeft voordat OPI iets gedaan heeft, komt uit
#     de bootstrap; een geheim dat alleen OPI gebruikt, genereert OPI zelf.
#
# Keycloak kent OPI niet en hoort niet op OPI te wachten. Zijn mailwachtwoord moet dus
# kunnen bestaan zonder dat OPI ooit heeft gedraaid, en dat kan alleen als het hier wordt
# gemaakt. zad-platform wordt door niemand anders gelezen en blijft daarom waar het staat.
#
# De keten die hieruit volgt:
#   1. deze generatie zet er een willekeurig wachtwoord in;
#   2. de Keycloak-deployment leest het als ZAD_MAIL_RELAY_PASSWORD uit dit geheim, en de
#      eigen emailSender-provider gebruikt het om bij de relay in te loggen;
#   3. OPI leest hetzelfde geheim en zorgt dat de relay het account zad-keycloak met dit
#      wachtwoord draagt (MailManager.ensure_keycloak_account).
#
# In geen enkele REALM staat iets hiervan. Dat is het hele punt: er is dan ook geen veld
# dat een projectbeheerder kan omzetten naar een luisteraar die hij zelf beheert. Zie
# features/keycloak-mail.md en docs/rc158-emailsender-spi-meting.md.
#
# LET OP DE SLEUTELNAAM. `smtp-password` (kleine letters, streepje) is de `key` in de
# secretKeyRef van de Keycloak-deployment en de sleutel die OPI leest
# (settings.MAIL_KEYCLOAK_SECRET_KEY). Hernoem je hem hier, hernoem dan op beide plekken
# mee - de secretKeyRef staat op `optional: true`, dus een verkeerde naam laat Keycloak
# gewoon starten en levert pas bij de eerste verzending een authenticatiefout op.
#
# EEN NAMESPACE, anders dan bij mail-relay-secret.yaml. OPI en Keycloak draaien allebei in
# RIG_NAMESPACE, dus er is hier geen tweede rendering nodig: de gedeelde generatie zet dit
# bestand precies daar neer.
#
# BIJ EEN ROTATIE is de volgorde: het geheim verandert in git, ArgoCD zet het in het
# cluster, Keycloak pikt het pas op bij een HERSTART (het is een omgevingsvariabele, geen
# mount), en OPI zet het bij zijn volgende verwerking op de relay. Wat er in de tussentijd
# faalt en in welke volgorde je het doet staat in features/keycloak-mail.md.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-mail-credentials
  namespace: rig-system
type: Opaque
stringData:
  smtp-password: "changeMe123!" # @secret-gen:random:24
