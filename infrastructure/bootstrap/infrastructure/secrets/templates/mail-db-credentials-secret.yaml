# De databasegebruiker van de mailrelay, in de vorm die CNPG verwacht
# (kubernetes.io/basic-auth met `username` en `password`). Dit geheim heeft TWEE lezers:
#
#   1. CNPG: de rol `mailrelay` in `postgresql/database/base/cluster.yaml` wijst hierheen
#      met `passwordSecret`, en de Database-resource in databases.yaml maakt de database
#      met deze rol als eigenaar. Zo komt de database declaratief mee, ook op een cluster
#      dat al draait - er is geen handmatige CREATE DATABASE.
#   2. De relay zelf: het Deployment leest `username` en `password` als MAIL_DB_USER en
#      MAIL_DB_PASSWORD. De relay draait in een eigen namespace (rig-ron / rig-prd-ron),
#      dus de mail-overlay rendert dit versleutelde bestand een tweede keer met zijn eigen
#      namespace erop, precies zoals bij mail-relay-credentials.
#
# Het staat NIET in mail-relay-secret.yaml: CNPG wil een eigen basic-auth-geheim in de
# namespace van het databasecluster, en een bestand is een generatie - twee documenten in
# een bestand krijgen dezelfde gegenereerde waarden op elke sleutel.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: mail-db-credentials
  namespace: rig-system
  labels:
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/component: database-credential
    app.kubernetes.io/managed-by: kustomize
    cnpg.io/reload: "true"
stringData:
  username: mailrelay
  password: mailrelay # @secret-gen:random:24
