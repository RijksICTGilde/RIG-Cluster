apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: rig-system
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: "changeMe123!" # @secret-gen:random:16
  # Client secret for OPI's own confidential master client (client-credentials
  # service account). Generated here so a fresh cluster has it before OPI starts:
  # OPI uses the admin password ONCE to create the client with this secret, then
  # authenticates purely via client-credentials on every later boot. After that,
  # the admin password above is only needed for break-glass and can be removed
  # from OPI's environment; the client secret is what OPI runs on day to day.
  KEYCLOAK_ADMIN_CLIENT_SECRET: "changeMe123!" # @secret-gen:random:32
