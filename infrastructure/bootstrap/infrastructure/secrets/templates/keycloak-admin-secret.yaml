apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-credentials
  namespace: rig-system
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: "changeMe123!" # @secret-gen:random:16
  # Client secret for OPI's own confidential master client (client-credentials
  # service account). Generated here so a fresh cluster has it before OPI starts:
  # OPI uses the admin password ONCE to create the client with this secret, then
  # authenticates purely via client-credentials on every later boot. After that,
  # the admin password above is only needed for break-glass and can be removed
  # from OPI's environment; the client secret is what OPI runs on day to day.
  # 64 tekens: dit is een machinesleutel die nooit door een mens getypt wordt, dus
  # lengte kost hier niets. Hij kan geen tweede factor krijgen (een OTP-zaad zou naast
  # de secret in dezelfde pod staan), dus lengte is wat er overblijft.
  KEYCLOAK_ADMIN_CLIENT_SECRET: "changeMe123!" # @secret-gen:random:64
  # Tweede beheerder, met een OTP-credential vanaf het aanmaken. Het gedeelde
  # KEYCLOAK_ADMIN hierboven wordt door Keycloak zelf gemaakt bij de eerste start en kan
  # dus nooit met een tweede factor geboren worden; deze wel, want bij het aanmaken
  # importeert Keycloak zo'n credential gewoon. Zo heeft een verse cluster meteen een
  # beheerder met OTP en blijft admin het break-glass-account.
  #
  # Het zaad staat hier omdat het nergens anders veilig kan: het is nodig voor het
  # aanmaken. Wie het overneemt in zijn authenticator kan de code maken; wie het kwijt is
  # kan het hier terugvinden zolang we geen betere plek hebben.
  KEYCLOAK_OTP_ADMIN_USERNAME: admin-otp
  KEYCLOAK_OTP_ADMIN_PASSWORD: "changeMe123!" # @secret-gen:random:24
  KEYCLOAK_OTP_ADMIN_TOTP_SECRET: "changeMe123!" # @secret-gen:random:32
