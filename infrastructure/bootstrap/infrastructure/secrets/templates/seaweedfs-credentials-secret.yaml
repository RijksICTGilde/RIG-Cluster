apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-credentials
  namespace: rig-system
type: Opaque
stringData:
  # weed leest deze als viper-sleutels (prefix weed, punt wordt underscore).
  # jwt.filer_signing.key zet de admin-Bearer op de IAM-gRPC van de filer: zonder sleutel
  # neemt die elke aanroep aan, ook van binnen de namespace.
  WEED_JWT_FILER_SIGNING_KEY: "changeMe123!" # @secret-gen:random:32
  WEED_JWT_SIGNING_KEY: "changeMe123!" # @secret-gen:random:32
  # Zonder identiteit staat de S3-poort anoniem open (isAuthEnabled wordt pas waar bij de
  # eerste identiteit), dus dit sleutelpaar is de admin van een verse filer en tegelijk de
  # terugval waarmee OPI en de back-upketen bij elke bucket kunnen.
  AWS_ACCESS_KEY_ID: "seaweedfs-admin"
  AWS_SECRET_ACCESS_KEY: "changeMe123!" # @secret-gen:random:32
