# Het enige Forgejo-wachtwoord op het cluster, en het draagt twee petten.
#
# 1. De init-Job (forgejo/config/base/bootstrap-job.yaml) maakt hiermee het account aan
#    in Forgejo. Het account bestaat dus niet vóór dit secret, maar erdoor.
# 2. ArgoCD leest het als `repo-creds`: een credential die geldt voor ELKE repo-URL die
#    met `url` begint. Daarmee is er geen aparte repository-entry per repo nodig, en
#    dekt hij ook de per-project repository-secrets die OPI zelf wegschrijft.
#
# OPI leest hetzelfde secret via secretKeyRef in zijn Deployment. Het wachtwoord wordt
# dus nergens gekopieerd: één gegenereerde waarde, drie lezers, geen drift.
#
# `url` is bewust de interne service en niet de ingress: al het machineverkeer blijft
# binnen het cluster, waardoor dit blok op elk cluster identiek is.
#
# Het Secret-type blijft kubernetes.io/basic-auth en wordt NIET Opaque. Dat veld is
# onveranderlijk: op een cluster waar dit secret al bestaat weigert de apiserver de
# wijziging met "type: Invalid value: field is immutable", loopt de secrets-Application
# vast op een retry, en landen ook de andere velden hieronder niet meer. ArgoCD leest
# username, password en url gewoon uit de data, ongeacht het type, dus er was geen reden
# om eraan te komen.
apiVersion: v1
kind: Secret
type: kubernetes.io/basic-auth
metadata:
  name: forgejo-admin
  namespace: rig-system
  labels:
    app.kubernetes.io/part-of: forgejo
    app.kubernetes.io/component: admin-credential
    app.kubernetes.io/managed-by: kustomize
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: http://forgejo.rig-system.svc.cluster.local:3000
  username: rig-admin
  password: forgejo # @secret-gen:random:24
