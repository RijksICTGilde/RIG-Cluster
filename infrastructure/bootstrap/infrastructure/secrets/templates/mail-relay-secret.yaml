# Geheimen van de mailrelay. Drie soorten door elkaar, en dat is met opzet een bestand:
# ze horen alle drie bij het OPZETTEN van de relay en bij niets anders.
#
# 1. De upstream-gegevens: het ene account waarmee de relay bij de mailserver van de
#    organisatie aanklopt. Deze komen van het mailteam (stap 1 van de uitrol).
# 2. De beheerdersgegevens van de relay zelf: hiermee maakt OPI de accounts per project
#    aan via de management-API.
# 3. Het wachtwoord van het platformaccount, dat ZAD zelf gebruikt. Het staat HIER en niet
#    in een projectbestand, want ZAD is geen project: er is geen projectbestand om het aan
#    op te hangen. OPI leest het als instelling, precies zoals het zijn andere
#    platformgeheimen leest. Zie plans/mailrelay.md, aanvulling 4.
apiVersion: v1
kind: Secret
metadata:
  name: mail-relay-credentials
  namespace: rig-operations-ron
type: Opaque
stringData:
  # Het maildomein waarvandaan alles vertrekt. Let op het enkelvoud in rijksapp.nl:
  # rijksapps.nl is de zone van ODC-Noord zelf en daar kunnen wij niets aanmaken.
  MAIL_DOMAIN: "mail.rijksapp.nl"

  MAIL_UPSTREAM_HOST: "rmrmail.rijksweb.nl"
  MAIL_UPSTREAM_USERNAME: "changeMe"
  MAIL_UPSTREAM_PASSWORD: "changeMe123!" # @secret-gen:random:24

  MAIL_RELAY_ADMIN_USERNAME: "admin"
  MAIL_RELAY_ADMIN_PASSWORD: "changeMe123!" # @secret-gen:random:24

  # Het account van ZAD zelf. Een eigen limiet en een eigen afzenderadres, omdat het
  # wachtwoordreset-tokens verstuurt: wie die post kan versturen of onderscheppen, kan een
  # account overnemen. Een fout in de projectkant mag hier niet bij kunnen.
  MAIL_PLATFORM_ACCOUNT: "zad-platform"
  MAIL_PLATFORM_PASSWORD: "changeMe123!" # @secret-gen:random:24

  MAIL_DB_HOST: "rig-db-rw.rig-prd-operations.svc.cluster.local"
  MAIL_DB_NAME: "mailrelay"
  MAIL_DB_USER: "mailrelay"
  MAIL_DB_PASSWORD: "changeMe123!" # @secret-gen:random:24
---
# De DKIM-sleutel waarmee de relay elk bericht ondertekent. De handtekening overleeft de
# hop naar de upstream, dus DMARC slaagt op DKIM-alignment ongeacht wat de upstream met de
# envelope doet. De publieke helft hoort als TXT-record op zad._domainkey.<maildomein>.
apiVersion: v1
kind: Secret
metadata:
  name: mail-relay-dkim
  namespace: rig-operations-ron
type: Opaque
stringData:
  dkim.key: |
    -----BEGIN PRIVATE KEY-----
    changeMe
    -----END PRIVATE KEY-----
