# Geheimen van de mailrelay. Een bestand, een generatie, en met opzet EEN document.
#
# Er is precies EEN account dat de infrastructuur klaarzet: het BEHEERDERSACCOUNT van de
# relay. Daarmee maakt OPI via de connector alle andere accounts aan - die van de projecten
# en dat van ZAD zelf. Zo werken Keycloak, PostgreSQL en MinIO ook. Er staat hier dus geen
# wachtwoord van het ZAD-account: dat is een gewoon account op de relay en het bestaat nog
# niet op het moment dat dit bestand wordt gegenereerd. Zie plans/mailrelay.md, aanvulling
# 4b, en features/send-email.md voor waar OPI dat wachtwoord wel bewaart.
#
# Er staat hier ook geen databasewachtwoord: dat leeft in mail-db-credentials-secret.yaml,
# omdat CNPG voor de rol `mailrelay` een eigen basic-auth-geheim wil. En er staat hier
# NIETS dat per cluster verschilt: MAIL_UPSTREAM_HOST en MAIL_DB_HOST zijn geen geheimen
# en staan in het Deployment van de relay (basis = productie, de overlays en de
# sink-component zetten ze om). Zo kan dit bestand voor elk cluster ongewijzigd worden
# gegenereerd.
#
# EEN document, want de generatie zet de gegenereerde waarden met `yq` op ELK document in
# het bestand: een tweede document krijgt er dan andermans wachtwoorden ongevraagd bij.
#
# TWEE NAMESPACES, EEN BRON. De generatie schrijft dit geheim in de namespace van OPI
# (RIG_NAMESPACE) - dat is wat de gedeelde generatie doet, en het is waar OPI zijn
# beheerderswachtwoorden leest, net als bij Keycloak en PostgreSQL. De relay draait in een
# EIGEN namespace (rig-ron / rig-prd-ron) en heeft hetzelfde geheim nodig. De overlay van de
# component rendert daarom precies dit versleutelde bestand een tweede keer, met zijn eigen
# namespace erop. Bewust geen leesrechten voor OPI over de namespacegrens heen: rechten over
# een namespacegrens zijn moeilijker terug te draaien dan een tweede rendering van hetzelfde
# bestand, en bij een rotatie verandert er precies EEN bestand, dus beide namespaces
# schuiven mee. Wat er bij een rotatie WEL moet gebeuren: beide pods opnieuw starten, want
# allebei lezen ze deze waarden uit hun omgeving.
apiVersion: v1
kind: Secret
metadata:
  name: mail-relay-credentials
  namespace: rig-system
type: Opaque
stringData:
  # HET VASTE AFZENDERADRES, in twee stukken omdat de relay ze allebei apart nodig heeft:
  # de From: wordt `<MAIL_FROM_LOCAL>@<MAIL_DOMAIN>` en de envelope
  # `<MAIL_FROM_LOCAL>+<project>@<MAIL_DOMAIN>`.
  #
  # Dit is GEEN domein van ons. We versturen via de mailserver van de Rijksoverheid en
  # dragen daarom hun domein. Dat is ook de enige manier waarop het werkt: zij publiceren
  # `p=reject`, wij ondertekenen niet met DKIM, dus SPF-uitlijning tussen envelope en From:
  # is het enige dat een bericht door DMARC krijgt. Zie docs/ron-koppeling.md.
  #
  # Deze twee waarden moeten GELIJK zijn aan wat `get_mail_from_address` in
  # `opi/core/cluster_config.py` teruggeeft: die vertelt het adres aan de applicatie
  # (SMTP_FROM), deze twee dwingen het af. Lopen ze uiteen, dan ziet een ontwikkelaar een
  # ander adres dan er daadwerkelijk vertrekt.
  MAIL_FROM_LOCAL: "noreply-rijksapp"
  MAIL_DOMAIN: "rijksoverheid.nl"

  # Het beheerdersaccount van de relay zelf. Hiermee, en alleen hiermee, maakt OPI accounts
  # aan. Roteren raakt geen enkel projectaccount: die staan als principals in de database
  # van de relay en veranderen daar niet van.
  MAIL_RELAY_ADMIN_USERNAME: "admin"
  MAIL_RELAY_ADMIN_PASSWORD: "changeMe123!" # @secret-gen:random:24
