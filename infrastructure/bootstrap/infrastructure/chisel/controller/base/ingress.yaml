apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chisel-server
  namespace: rig-system
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: chisel.kind
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: chisel-server
            port:
              number: 8080
