apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
---
# Falco verrijkt een alert met de pod en de namespace waar het syscall uit kwam, en leest
# daarvoor pods, namespaces en replicasets. Meer dan lezen heeft het niet nodig.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, replicationcontrollers, services, events, configmaps]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: falco
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: falco
subjects:
  - kind: ServiceAccount
    name: falco
    namespace: rig-system
