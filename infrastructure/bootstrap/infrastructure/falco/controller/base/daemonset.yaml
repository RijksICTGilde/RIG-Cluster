apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  labels:
    app.kubernetes.io/name: falco
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
    spec:
      serviceAccountName: falco
      # modern_ebpf laadt geen kernelmodule en vraagt geen privileged container: drie
      # capabilities en hostPID zijn genoeg. De oudere drivers vragen wel privileged, en dat
      # is precies het schot dat we hier niet willen doorbreken.
      hostPID: true
      hostNetwork: false
      containers:
        - name: falco
          image: falcosecurity/falco-no-driver:0.42.0
          args:
            - /usr/bin/falco
            - --modern-bpf
            - -pk
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
              add: [BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 60
          volumeMounts:
            - name: falco-config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
            - name: falco-zad-regels
              mountPath: /etc/falco/rules.d
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: etc
              mountPath: /host/etc
              readOnly: true
      volumes:
        - name: falco-config
          configMap:
            name: falco-config
        - name: falco-zad-regels
          configMap:
            name: falco-zad-regels
        - name: proc
          hostPath:
            path: /proc
        - name: etc
          hostPath:
            path: /etc
