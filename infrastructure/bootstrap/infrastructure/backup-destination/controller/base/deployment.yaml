apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: rig-backup-destination
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-storage
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce PVC: terminate the old pod (releasing the
  # volume) before starting the new one. A RollingUpdate surge pod would deadlock
  # on a Multi-Attach error because the old pod still holds the RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: backup-storage
    spec:
      containers:
        - name: minio
          # Onze eigen build uit de broncode van deze tag. MinIO heeft docker.io/minio en quay.io/minio
          # allebei achter een abonnement gezet, 401 op elke tag, en het project is gearchiveerd.
          # Zie images/README.md en docs/KNOWN-ISSUES.md. odcn haalt hem via de rcr-proxy, zie de overlay daar.
          image: ghcr.io/minbzk/base-images/minio:RELEASE.2025-07-23T15-54-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            # Dezelfde ruimte als de liveness hieronder. Met de default van 1s viel de pod bij
            # een Ceph-RBD-piek uit de Service, en kreeg een lopende backup connection refused.
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            # Explicit, tolerant values. The k8s defaults (timeoutSeconds 1,
            # failureThreshold 3) SIGKILL this pod whenever MinIO can't answer
            # the health check within 1s during Ceph-RBD I/O spikes -- the cause
            # of the ~daily exit-137 restarts. Never OOMKilled, but the working
            # set reached 400-500Mi of the old 512Mi limit, hence 1Gi below.
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-backup-storage
