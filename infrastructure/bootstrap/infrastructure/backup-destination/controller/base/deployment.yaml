apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: rig-backup-destination
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: backup-storage
spec:
  replicas: 1
  # Single replica on a ReadWriteOnce PVC: terminate the old pod (releasing the
  # volume) before starting the new one. A RollingUpdate surge pod would deadlock
  # on a Multi-Attach error because the old pod still holds the RWO volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: backup-storage
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-07-23T15-54-02Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 30
            # Explicit, tolerant values. The k8s defaults (timeoutSeconds 1,
            # failureThreshold 3) SIGKILL this pod whenever MinIO can't answer
            # the health check within 1s during Ceph-RBD I/O spikes -- the cause
            # of the ~daily exit-137 restarts. Memory is fine (never OOMKilled,
            # ~371Mi of 512Mi), so this is the actual fix.
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-backup-storage
