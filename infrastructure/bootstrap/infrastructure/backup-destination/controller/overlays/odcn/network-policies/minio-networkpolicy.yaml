apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-access
  namespace: rig-prd-backup
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio

  ingress:
    # Allow S3 API access from all tenant namespaces (backup pods run in project namespaces)
    - from:
        - namespaceSelector:
            matchLabels:
              capsule.clastix.io/tenant: rig-prd
      ports:
        - protocol: TCP
          port: 9000

  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
