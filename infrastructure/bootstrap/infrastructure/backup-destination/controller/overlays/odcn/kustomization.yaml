apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-backup

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  - network-policies/minio-networkpolicy.yaml

patches:
  # Update namespace name
  - target:
      kind: Namespace
      name: rig-backup-destination
    patch: |-
      - op: replace
        path: /metadata/name
        value: rig-prd-backup
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1component
        value: backup-storage
  # Update PVC to 50Gi with ODCN storage class
  - target:
      kind: PersistentVolumeClaim
      name: minio-backup-storage
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 100Gi
      - op: add
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd

# Eigen build, om dezelfde reden als bij de platform-MinIO: MinIO distribueert deze release
# niet meer (Docker Hub 401, dl.min.io 410 Gone) en de tag is uit de quay-proxycache verlopen.
# Gecompileerd uit de broncode van tag RELEASE.2025-07-23T15-54-02Z; zie
# infrastructure/bootstrap/infrastructure/minio/controller/overlays/odcn/kustomization.yaml.
#
# Deze pod draait nog omdat zijn node de oude image lokaal heeft. Hij valt om zodra hij
# verplaatst, dus dit vooruit rechtzetten en niet wachten tot het misgaat.
images:
  - name: quay.io/minio/minio
    newName: rcr.rijksapps.nl/ghcr-rig/minbzk/base-images/minio
    newTag: RELEASE.2025-07-23T15-54-02Z
