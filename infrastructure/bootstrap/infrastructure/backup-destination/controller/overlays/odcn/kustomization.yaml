apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-backup

resources:
  - ../../base
  - secret.sops.yaml

patches:
  # Update namespace name
  - target:
      kind: Namespace
      name: rig-backup-destination
    patch: |-
      - op: replace
        path: /metadata/name
        value: rig-prd-backup
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1component
        value: backup-storage
  # Update PVC to 50Gi with ODCN storage class
  - target:
      kind: PersistentVolumeClaim
      name: minio-backup-storage
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
      - op: add
        path: /spec/storageClassName
        value: ocs-storagecluster-ceph-rbd
