# Het root-secret van de backup-MinIO, voor clusters met een secrets-repo (SECRETS_DIR).
# Op odcn-production staat het met de hand gemaakt in overlays/odcn/secret.sops.yaml.
# De OPI gebruikt dezelfde waarden als BACKUP_S3_ACCESS_KEY en BACKUP_S3_SECRET_KEY, dus
# zet het wachtwoord uit het overzicht ook in .env.odcn-staging.secrets.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: replace-by-script
type: Opaque
stringData:
  root-user: "backup-admin"
  root-password: "changeMe123!" # @secret-gen:random:32
