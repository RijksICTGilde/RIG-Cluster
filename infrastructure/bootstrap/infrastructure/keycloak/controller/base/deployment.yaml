apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: rig-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: keycloak-theme-puller
          # DRIE jars, en de derde komt NIET van het netwerk. Het thema en de SAML-mapper
          # worden bij elke podstart van github.com gehaald; dat risico bestaat al. De
          # relay-emailSender mag er niet bij, want aan die jar hangt de startvlag
          # --spi-email-sender-provider: Keycloak WEIGERT TE STARTEN als de provider er niet
          # is (gemeten, RC-158), en dat is precies wat een stille terugval op de
          # standaardprovider onmogelijk maakt. Zou hij van GitHub komen, dan legt een
          # hapering daar het inloggen van het hele platform plat.
          #
          # Hij komt daarom uit een ConfigMap (zie de volumes onderaan). De generator zet
          # een hash van de inhoud in de naam, dus een nieuwe jar is vanzelf een rollout.
          command:
            - sh
            - -c
            - |
              cd /tmp
              wget https://github.com/MinBZK/keycloak-theme/releases/download/v1.4.2/keycloak-nl-design-system.jar
              wget https://github.com/RijksICTGilde/RIG-Cluster/releases/download/v1.1.0/keycloak-saml-nameid-mapper-1.1.0.jar
              cp keycloak-nl-design-system.jar /opt/keycloak/providers/
              cp keycloak-saml-nameid-mapper-1.1.0.jar /opt/keycloak/providers/
              cp /zad-providers/keycloak-relay-email-sender-1.0.0.jar /opt/keycloak/providers/
          image: busybox:1.37.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - mountPath: /opt/keycloak/providers/
              name: keycloak-provider
            - mountPath: /tmp
              name: tmp-volume
            - mountPath: /zad-providers
              name: zad-providers
              readOnly: true
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0.6
          # DE VLAG DIE DE EIGEN VERZENDER AANWIJST. Zonder hem verstuurt de
          # standaardprovider, en die leest de smtpServer van de realm - de weg waarlangs
          # een projectbeheerder de post naar een eigen luisteraar kan sturen.
          #
          # LET OP DE VORM: de SPI heet intern emailSender en dat wordt in de vlag
          # email-sender. Schrijf je --spi-emailSender-provider (camelCase), dan wordt de
          # vlag STIL genegeerd en verstuurt de standaardprovider alsnog; er is geen
          # waarschuwing en geen enkel signaal. Gemeten in RC-158, en gepind door
          # RelayEmailSenderProviderFactoryTest en test_keycloak_relay_email_sender.py.
          #
          # Tegenover die val staat een cadeau: een provider-id dat niet bestaat laat
          # Keycloak WEIGEREN TE STARTEN. Een pod die opkomt heeft zijn provider dus
          # aantoonbaar gevonden.
          args:
            ["start", "--proxy-headers=forwarded", "--hostname-strict=false", "--spi-theme-welcome-theme=nl-design-system", "--spi-email-sender-provider=zad-relay" ]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "keycloak.kind"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_PORT
              value: "-1"
            - name: KC_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://rig-db-rw:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            - name: ORGANIZATION
              value: "RIG Cluster"
            - name: KC_SPI_ADMIN_REALM_RESTAPI_EXTENSION_ENABLED
              value: "true"
            - name: KC_FEATURES
              value: "admin-api"
            - name: KEYCLOAK_ADMIN_IMPORT_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN_EXPORT_ENABLED
              value: "true"
            # DE MAILRELAY, ZOALS DE POD HEM KENT. Deze vijf zijn de HELE configuratie van
            # de eigen verzender: geen realm draagt nog een bestemming, dus er is nergens
            # een veld dat een projectbeheerder kan omzetten. Zie
            # keycloak-migration/relay-email-sender/ en features/keycloak-mail.md.
            #
            # De basis is het cluster met de relay in rig-ron (local en sandboxed-local);
            # de odcn-overlay zet de host om naar rig-prd-ron.
            - name: ZAD_MAIL_RELAY_HOST
              value: "rig-mail-relay.rig-ron.svc.cluster.local"
            - name: ZAD_MAIL_RELAY_PORT
              value: "587"
            - name: ZAD_MAIL_RELAY_USERNAME
              value: "zad-keycloak"
            - name: ZAD_MAIL_RELAY_FROM
              value: "noreply-inloggen@rijksoverheid.nl"
            # STARTTLS UIT, en dat is een expliciete beslissing. De submission-listener van
            # de relay biedt geen STARTTLS aan (met EHLO nagemeten in RC-158), dus dit is
            # platte AUTH binnen het cluster - precies wat elk project vandaag ook doet met
            # zijn SMTP_HOST/SMTP_PORT, en dus geen nieuwe blootstelling. De provider heeft
            # hem standaard AAN staan, zodat het uitzetten hier zichtbaar is en niet stil.
            # STARTTLS op die listener aanzetten helpt alle tenants tegelijk en is een
            # eigen taak; zie plans/mail-vervolgpunten.md.
            - name: ZAD_MAIL_RELAY_STARTTLS
              value: "false"
            # optional: true, want dit geheim komt uit de generatie van de clustergeheimen
            # en een cluster dat die generatie nog niet heeft gedraaid, moet WEL kunnen
            # inloggen. Zonder deze vlag is een ontbrekend geheim een BOOTBLOKKADE voor de
            # hele identiteitsvoorziening. Ontbreekt hij, dan start Keycloak, logt de
            # provider "geen bruikbare relayconfiguratie" en faalt elke verzending luid.
            - name: ZAD_MAIL_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-mail-credentials
                  key: smtp-password
                  optional: true
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
            requests:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: keycloak-provider
              mountPath: /opt/keycloak/providers/
            - name: tmp-volume
              mountPath: /opt/keycloak/data/tmp
      volumes:
        - name: keycloak-provider
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
        # De jar van de eigen verzender, uit git. De naam hier is de NAAM VAN DE GENERATOR;
        # kustomize hangt er een hash van de inhoud aan en werkt deze verwijzing mee bij.
        - name: zad-providers
          configMap:
            name: keycloak-zad-providers
