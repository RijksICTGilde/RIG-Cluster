apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: rig-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          # Onze eigen image (images/keycloak-zad/): de providers zitten erin, de pod haalt
          # bij het starten niets meer op.
          #
          # DEZE TAG IS DE TAG DIE PRODUCTIE DRAAIT. De sandbox-overlay pint zijn eigen tag,
          # dus een proef daar raakt deze regel niet. Promoveren is het overzetten van
          # precies de tag die op de sandbox heeft gedraaid, niet opnieuw bouwen.
          #
          # HIJ WORDT NIET MET DE HAND GESCHREVEN. `task pin-keycloak-image TARGET=base` zet hem
          # hier neer, gelezen uit de sandbox-overlay, die alleen een gepushte tag draagt.
          #
          # Is er nog nooit gepromoveerd, dan staat hier het woord promoveer-eerst en geen
          # tag: een verzonnen versienummer zou eruitzien als een image die te halen valt.
          image: ghcr.io/rijksictgilde/zad/keycloak-zad:2026.10.13.1948-72684cb4
          # DE VLAG DIE DE EIGEN VERZENDER AANWIJST. Zonder hem verstuurt de
          # standaardprovider, en die leest de smtpServer van de realm - de weg waarlangs
          # een projectbeheerder de post naar een eigen luisteraar kan sturen.
          #
          # LET OP DE VORM: de SPI heet intern emailSender en dat wordt in de vlag
          # email-sender. Schrijf je --spi-emailSender-provider (camelCase), dan wordt de
          # vlag STIL genegeerd en verstuurt de standaardprovider alsnog; er is geen
          # waarschuwing en geen enkel signaal. Gemeten in RC-158, en gepind door
          # RelayEmailSenderProviderFactoryTest en test_keycloak_relay_email_sender.py.
          #
          # DIE VAL WORDT IN DE IMAGEBOUW GEVANGEN, niet hier: `kc.sh build` faalt op een
          # provider-id dat niet oplost, een pod met --optimized komt er juist gewoon op
          # (allebei gemeten in RC-212). De canarie uit RC-158 zit dus in
          # images/keycloak-zad/Dockerfile, en noemt dezelfde id als de regel hieronder.
          #
          # --optimized: START ZONDER EEN EIGEN AUGMENTATIE. Zonder die vlag leest elke
          # spi-optie hieronder als een verschil met de image (spi-opties staan niet in de
          # persisted-lijst, gemeten), dus bouwde de pod het image bij ELKE start om: ruim
          # negen seconden, precies wat de bouw in de Dockerfile moest voorkomen. Met de vlag
          # weigert Keycloak bovendien luid te starten als hier ooit een BOUWoptie bij komt,
          # in plaats van er stil een andere image van te maken.
          #
          # --hostname-strict staat hier niet meer: KC_HOSTNAME_STRICT hieronder zegt hetzelfde.
          args:
            ["start", "--optimized", "--spi-theme-welcome-theme=nl-design-system", "--spi-email-sender-provider=zad-relay" ]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-credentials
                  key: KEYCLOAK_ADMIN_PASSWORD
            # DE ENIGE PLEK DIE proxy-headers ZET. Tot RC-212 stond er ook een
            # --proxy-headers=forwarded bij de args, en die won: een startargument gaat bij
            # Keycloak voor een omgevingsvariabele. De ingress zet X-Forwarded-*, geen
            # Forwarded, dus de pod zag als client-ip de ingress in plaats van de bezoeker.
            # `xforwarded` is de waarde die 48c2dbbb bedoelde.
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME
              value: "keycloak.kind"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_PORT
              value: "-1"
            - name: KC_PROXY_ADDRESS_FORWARDING
              value: "true"
            - name: KC_DB_URL
              value: "jdbc:postgresql://rig-db-rw:5432/keycloak"
            - name: KC_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: username
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-db-credentials
                  key: password
            - name: ORGANIZATION
              value: "RIG Cluster"
            - name: KC_SPI_ADMIN_REALM_RESTAPI_EXTENSION_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN_IMPORT_ENABLED
              value: "true"
            - name: KEYCLOAK_ADMIN_EXPORT_ENABLED
              value: "true"
            # DE MAILRELAY, ZOALS DE POD HEM KENT. Deze vijf zijn de HELE configuratie van
            # de eigen verzender: geen realm draagt nog een bestemming, dus er is nergens
            # een veld dat een projectbeheerder kan omzetten. Zie
            # keycloak-migration/relay-email-sender/ en features/keycloak-mail.md.
            #
            # De basis is het cluster met de relay in rig-ron (sandboxed-local);
            # de odcn-overlay zet de host om naar rig-prd-ron.
            - name: ZAD_MAIL_RELAY_HOST
              value: "rig-mail-relay.rig-ron.svc.cluster.local"
            - name: ZAD_MAIL_RELAY_PORT
              value: "587"
            - name: ZAD_MAIL_RELAY_USERNAME
              value: "zad-keycloak"
            # Het KALE afzenderadres van het platform, zonder eigen lokaal deel. Dit is
            # een van DRIE plekken die deze waarde noemen (de andere twee zijn de afzender
            # die OPI voor zad-keycloak op de relay zet en de smtpServer.from die OPI op
            # elke realm schrijft); lopen ze uiteen, dan vertrekt post onder een ander
            # adres dan een realm claimt. Vastgepind in
            # test_de_drie_plekken_noemen_hetzelfde_afzenderadres.
            - name: ZAD_MAIL_RELAY_FROM
              value: "noreply-rijksapp@rijksoverheid.nl"
            # STARTTLS UIT, en dat is een expliciete beslissing. De submission-listener van
            # de relay biedt geen STARTTLS aan (met EHLO nagemeten in RC-158), dus dit is
            # platte AUTH binnen het cluster - precies wat elk project vandaag ook doet met
            # zijn SMTP_HOST/SMTP_PORT, en dus geen nieuwe blootstelling. De provider heeft
            # hem standaard AAN staan, zodat het uitzetten hier zichtbaar is en niet stil.
            # STARTTLS op die listener aanzetten helpt alle tenants tegelijk en is een
            # eigen taak; zie plans/mail-vervolgpunten.md.
            - name: ZAD_MAIL_RELAY_STARTTLS
              value: "false"
            # optional: true, want dit geheim komt uit de generatie van de clustergeheimen
            # en een cluster dat die generatie nog niet heeft gedraaid, moet WEL kunnen
            # inloggen. Zonder deze vlag is een ontbrekend geheim een BOOTBLOKKADE voor de
            # hele identiteitsvoorziening. Ontbreekt hij, dan start Keycloak, logt de
            # provider "geen bruikbare relayconfiguratie" en faalt elke verzending luid.
            - name: ZAD_MAIL_RELAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-mail-credentials
                  key: smtp-password
                  optional: true
          resources:
            limits:
              memory: "1Gi"
              cpu: "500m"
              ephemeral-storage: "1Gi"
            requests:
              memory: "256Mi"
              cpu: "100m"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /realms/master
              port: 8080
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp-volume
              mountPath: /opt/keycloak/data/tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
