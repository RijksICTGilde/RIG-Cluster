apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/initContainers/0/securityContext/runAsUser
        value: 1000
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 1000
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: test
        path: /spec/template/spec/containers/0/env/6/name
        value: "KC_HOSTNAME"
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: "https://keycloak.kind"
      # Add local CA certificate for Java truststore (needed for inter-realm HTTPS calls)
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: local-ca
          hostPath:
            path: /etc/ssl/certs/kind-local-ca.crt
            type: File
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: local-ca
          mountPath: /opt/keycloak/conf/truststores/kind-local-ca.crt
          readOnly: true
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KC_TRUSTSTORE_PATHS
          value: "/opt/keycloak/conf/truststores/kind-local-ca.crt"
      # Download theme and custom mapper from GitHub releases
      # For local theme development, replace the theme wget with:
      #   wget http://host.docker.internal:8888/keycloak-nl-design-system.jar
      # And run: cd keycloak-theme/output && python3 -m http.server 8888
      - op: replace
        path: /spec/template/spec/initContainers/0/command
        value:
          - sh
          - -c
          - |
            cd /tmp
            wget https://github.com/MinBZK/keycloak-theme/releases/download/v1.4.2/keycloak-nl-design-system.jar
            cp keycloak-nl-design-system.jar /opt/keycloak/providers/
            wget https://github.com/RijksICTGilde/RIG-Cluster/releases/download/v1.1.0/keycloak-saml-nameid-mapper-1.1.0.jar
            cp keycloak-saml-nameid-mapper-1.1.0.jar /opt/keycloak/providers/
  # Add management port (9000) to service for metrics endpoint
  - target:
      kind: Service
      name: keycloak
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: management
          port: 9000
          protocol: TCP
          targetPort: 9000
  # Add /metrics path to ingress routing to management port (DEV ONLY)
  - target:
      kind: Ingress
      name: keycloak
    patch: |-
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /metrics
          pathType: Exact
          backend:
            service:
              name: keycloak
              port:
                number: 9000
      - op: add
        path: /spec/rules/0/http/paths/-
        value:
          path: /health
          pathType: Prefix
          backend:
            service:
              name: keycloak
              port:
                number: 9000
