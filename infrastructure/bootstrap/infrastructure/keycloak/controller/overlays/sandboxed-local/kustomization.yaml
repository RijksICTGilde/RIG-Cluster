apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/initContainers/0/securityContext/runAsUser
        value: 1000
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 1000
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      # NB: deze cpu-waarden worden overschreven door het sandbox-CPU-beleid in
      # infrastructure/bootstrap/clusters/sandboxed-local/kustomization.yaml (request 50m,
      # geen limit). Pas ze daar aan, niet hier — anders knijp je keycloak alsnog.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: test
        path: /spec/template/spec/containers/0/env/6/name
        value: "KC_HOSTNAME"
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: "https://keycloak.sandbox.rijksapp.dev"
  - target:
      kind: Ingress
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: keycloak.sandbox.rijksapp.dev
      - op: replace
        path: /spec/tls/0/hosts/0
        value: keycloak.sandbox.rijksapp.dev
      - op: replace
        path: /spec/tls/0/secretName
        value: sandbox-wildcard-tls
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
  # Add management port (9000) to service for metrics endpoint
  - target:
      kind: Service
      name: keycloak
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: management
          port: 9000
          protocol: TCP
          targetPort: 9000
