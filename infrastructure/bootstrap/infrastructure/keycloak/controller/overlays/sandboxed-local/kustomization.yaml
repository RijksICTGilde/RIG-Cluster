apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base

# DE EIGEN PIN VAN DE SANDBOX. Hij staat hier en niet in de basis, zodat een vers
# gebouwde image hier kan draaien terwijl de basis en de odcn-overlay op de tag van
# productie blijven staan.
#
# `task publish-keycloak-image` schrijft deze regel, en pas nadat hij de image naar
# ghcr gepusht en zonder inlog teruggelezen heeft. Met de hand een tag invullen slaat die
# controle over: de sandbox pullt gewoon uit ghcr, dus een tag die daar niet staat komt niet
# verder dan ImagePullBackOff. Is er nog nooit gebouwd, dan staat hier daarom het woord
# bouw-eerst en geen tag.
images:
  - name: ghcr.io/rijksictgilde/zad/keycloak-zad
    newTag: "2026.10.13.1948-72684cb4"

patches:
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: add
        path: /spec/template/spec/securityContext/runAsUser
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/runAsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/securityContext/fsGroup
        value: 1000
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsUser
        value: 1000
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "2Gi"
      # NB: deze cpu-waarden worden overschreven door het sandbox-CPU-beleid in
      # infrastructure/bootstrap/clusters/sandboxed-local/kustomization.yaml (request 50m,
      # geen limit). Pas ze daar aan, niet hier — anders knijp je keycloak alsnog.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "2"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: test
        path: /spec/template/spec/containers/0/env/4/name
        value: "KC_HOSTNAME"
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: "https://keycloak.sandbox.rijksapp.dev"
  - target:
      kind: Ingress
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: keycloak.sandbox.rijksapp.dev
      - op: replace
        path: /spec/tls/0/hosts/0
        value: keycloak.sandbox.rijksapp.dev
      - op: replace
        path: /spec/tls/0/secretName
        value: sandbox-wildcard-tls
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
  # Add management port (9000) to service for metrics endpoint
  - target:
      kind: Service
      name: keycloak
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: management
          port: 9000
          protocol: TCP
          targetPort: 9000
