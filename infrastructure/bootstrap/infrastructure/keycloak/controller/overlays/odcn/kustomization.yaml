apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base
# Let's Encrypt issuer for keycloak.rijksapp.nl TLS certificate
- issuer-letsencrypt.yaml
# Legacy ingress for old hostname (transition period, can be removed later)
- ingress-legacy.yaml

patches:
  - target:
      kind: Ingress
      name: keycloak
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: keycloak.rijksapp.nl
      # keycloak.rijksapp.nl serveert op pad / zowel de admin-console ALS de
      # publieke OIDC-endpoints (authorize/token/jwks). De oauth2-proxy-sidecar
      # van elke gepubliceerde tenant-app stuurt de browser van eindgebruikers
      # (publiek internet, niet op de ODCN-VPN) naar deze host voor de login.
      # Een VPN-allowlist hier breekt de login van ALLE gepubliceerde apps.
      # De admin-console wordt afgeschermd door Keycloaks eigen authenticatie;
      # houd deze ingress daarom publiek bereikbaar.
      - op: add
        path: /metadata/annotations/haproxy.router.openshift.io~1ip_whitelist
        value: "0.0.0.0/0,::/0" # publiek: OIDC-flow voor eindgebruikers
      - op: add
        path: /metadata/annotations/external-dns.alpha.kubernetes.io~1target
        value: router.rijksapp.nl
      - op: remove
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
      - op: add
        path: /metadata/annotations/cert-manager.io~1issuer
        value: letsencrypt-keycloak
      - op: remove
        path: /spec/ingressClassName
      - op: replace
        path: /spec/tls
        value:
          - hosts:
              - keycloak.rijksapp.nl
            secretName: keycloak-rijksapp-tls
  - target:
      kind: Deployment
      name: keycloak
    patch: |-
      - op: test
        path: /spec/template/spec/containers/0/env/6/name
        value: "KC_HOSTNAME"
      - op: replace
        path: /spec/template/spec/containers/0/env/6/value
        value: "https://keycloak.rijksapp.nl"
