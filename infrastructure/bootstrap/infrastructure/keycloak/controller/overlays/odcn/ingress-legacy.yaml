# Legacy ingress for the old hostname (transition period)
# Keep this ingress active until all references to the old hostname have been migrated.
# Can be removed once all clients and external registrations use keycloak.rijksapp.nl.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-legacy
  namespace: rig-system
  annotations:
    # Oude OIDC-host die nog door clients in transitie wordt geresolved.
    # Net als keycloak.rijksapp.nl bedient deze host de publieke OIDC-flow;
    # een VPN-allowlist breekt de login van apps die nog deze issuer gebruiken.
    haproxy.router.openshift.io/ip_whitelist: "0.0.0.0/0,::/0" # publiek: OIDC-flow
spec:
  rules:
    - host: keycloak.rig.prd1.gn2.quattro.rijksapps.nl
      http:
        paths:
          - backend:
              service:
                name: keycloak
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - {}
