# De sandbox haalt ook de infrastructuur uit Forgejo (zad-argo-infrastructure, gevuld door
# `task sandbox:sync`), dus die repo komt er hier bij. Op een echt cluster kan dat niet:
# Forgejo wordt daar uitgerold DOOR de infrastructuur-Application, dus die kan niet in
# Forgejo staan.
#
# Verder wijkt de sandbox niet af. Hier stond eerder het volledige script nog een keer.
apiVersion: batch/v1
kind: Job
metadata:
  name: forgejo-bootstrap
spec:
  template:
    spec:
      containers:
      - name: bootstrap
        env:
        - name: ZAD_REPOS
          value: "zad-projects zad-argo-user-applications zad-argo-infrastructure zad-deployments"
