apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base
- robots-configmap.yaml

patches:
  - path: statefulset-patch.yaml
    target:
      kind: StatefulSet
      name: forgejo
  # De Ingress uit de basis gaat eruit: de ingang van de sandbox staat in een stand, en
  # alle Ingresses van die stand staan bij elkaar in
  # infrastructure/bootstrap/routing/base/ingress. Zie docs/sandbox/routing-wisselen.md.
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: forgejo
        namespace: rig-system
