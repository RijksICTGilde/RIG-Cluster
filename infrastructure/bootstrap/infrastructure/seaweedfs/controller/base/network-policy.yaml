# In de base en niet in een overlay: de gRPC-poorten nemen zonder JWT elke aanroep aan,
# dus de afscherming hoort bij het component zelf en niet bij een cluster.
# podSelector plus policyTypes is deny-by-default; alleen de regels hieronder laten iets toe.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-seaweedfs-access
  namespace: rig-system
spec:
  podSelector:
    matchLabels:
      app: seaweedfs
  policyTypes: [Ingress, Egress]
  ingress:
    # Tenant-namespaces gebruiken alleen de S3-poort.
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        - protocol: TCP
          port: 8333
    # De operations-namespace: S3 plus metrics (Prometheus draait hier).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-system
      ports:
        - protocol: TCP
          port: 8333
        - protocol: TCP
          port: 9327
    # Het beheer loopt over de gRPC-poorten, en dat mag alleen de OPI-pod.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-system
          podSelector:
            matchLabels:
              app: operations-manager
      ports:
        - protocol: TCP
          port: 18888
        - protocol: TCP
          port: 19333
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # De eigen pod: master, volume, filer en de S3-gateway praten onderling.
    - to:
        - podSelector:
            matchLabels:
              app: seaweedfs
