apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: rig-system
spec:
  # Alleen wat van buiten de pod nodig is: S3 voor tenants en OPI, de twee gRPC-poorten
  # voor `weed shell`, en metrics. De HTTP-poorten van master, volume en filer blijven
  # pod-lokaal.
  ports:
  - port: 8333
    protocol: TCP
    targetPort: 8333
    name: s3
  - port: 18888
    protocol: TCP
    targetPort: 18888
    name: filer-grpc
  - port: 19333
    protocol: TCP
    targetPort: 19333
    name: master-grpc
  - port: 9327
    protocol: TCP
    targetPort: 9327
    name: metrics
  selector:
    app: seaweedfs
  type: ClusterIP
