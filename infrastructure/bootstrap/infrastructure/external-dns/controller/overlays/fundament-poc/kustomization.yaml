apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-system

resources:
  - ../../base
  # Op ODCN beheert Capsule deze RBAC; hier is geen Capsule, dus nemen we ze zelf mee.
  # Lokale kopieën omdat de CMP-plugin zonder load-restrictor-vlag bouwt.
  - clusterrole.yaml
  - clusterrolebinding.yaml

patches:
  - target:
      kind: Deployment
      name: external-dns
    patch: |-
      # De base trekt via de RCR-mirror-pullsecret, en die bestaat alleen op ODCN.
      # registry.k8s.io is hier direct bereikbaar en vraagt geen authenticatie.
      - op: remove
        path: /spec/template/spec/imagePullSecrets
      # Alleen de eigen subzone, niet rijksapp.dev als geheel. ODCN beheert die zone ook,
      # en hoe smaller het filter hoe kleiner het oppervlak waarop twee instanties elkaar
      # kunnen raken.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --domain-filter=fundament-poc.rijksapp.dev
      # Naast ingresses ook services, zodat router.<zone> uit de hostname-annotatie op de
      # LoadBalancer-service van ingress-nginx komt in plaats van uit een handmatig
      # A-record. OPI zet op elke tenant-ingress een external_dns_target naar die naam
      # (cluster_config), en TransIP weigert een CNAME naar een hostnaam die niet bestaat.
      # Dat is geen theoretisch geval: het record ontbrak, external-dns eindigde daarop met
      # level=fatal, en is 534 keer herstart zonder ooit nog iets bij te werken. Een van
      # de tenant-records legde daarmee ALLE DNS van dit cluster plat.
      #
      # `cluster:check` drukte hiervoor een instructie af om zelf een A-record te zetten.
      # Dat blijft een stap die iemand moet onthouden, en bij het volgende cluster gaat
      # het dan opnieuw mis. Via de annotatie volgt het record bovendien vanzelf als het
      # LoadBalancer-adres verschuift, en dat waarschuwde diezelfde taak ook al.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --source=service

      # TransIP handhaaft RFC 1035 strikt: een CNAME kan niet naast een ander record met
      # dezelfde naam bestaan. Daarom staat het eigendoms-TXT op een buurnaam.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --txt-prefix=edns-
      # DIT IS GEEN OPTIE. Zonder eigen owner-id draait deze instantie op de default,
      # net als die op ODCN. Twee instanties met dezelfde owner-id zien elkaars records
      # als de hunne en verwijderen wat niet in hun eigen gewenste toestand staat. Dat is
      # DNS voor rijksapp.dev in productie. Met een eigen id slaat elke instantie de
      # records van de ander over, en hoeft er aan ODCN niets te veranderen.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --txt-owner-id=fundament-poc
