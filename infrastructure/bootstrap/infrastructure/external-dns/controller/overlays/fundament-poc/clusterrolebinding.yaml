# Kopie van base/clusterrolebinding.yaml. Verwijzen naar de base kan niet: de CMP-plugin
# bouwt zonder load-restrictor-vlag. Op ODCN beheert Capsule deze RBAC en staan ze uit.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: rig-system
