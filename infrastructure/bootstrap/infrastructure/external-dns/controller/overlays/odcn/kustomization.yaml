apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-operations

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: external-dns
    patch: |-
      # De RCR-mirror hoort hier en niet in de base: ghcr en registry.k8s.io zijn op
      # ODCN geblokkeerd, maar op andere clusters is rcr.rijksapps.nl juist onbereikbaar.
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: rcr.rijksapps.nl/k8s-rig/external-dns/external-dns:v0.15.0
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --domain-filter=rijks.app
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --domain-filter=rijksapp.nl
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --domain-filter=rijksapp.dev
      # TransIP enforces RFC 1035 strictly: a CNAME cannot coexist with any
      # other record at the same name. Place the ownership TXT at a sibling.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --txt-prefix=edns-
      # Use Capsule Proxy for tenant-scoped ingress watching
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: KUBERNETES_SERVICE_HOST
          value: cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
