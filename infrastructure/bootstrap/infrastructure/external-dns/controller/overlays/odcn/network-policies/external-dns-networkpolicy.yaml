# podSelector + policyTypes maakt deny-by-default. Er staan geen ingress-regels: niemand
# belt external-dns.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-dns-egress
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      app: external-dns
  policyTypes: [Ingress, Egress]
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Naar buiten op 443: de TransIP-API (--provider=transip in ../kustomization.yaml) en
    # de Capsule-Proxy kube-API (KUBERNETES_SERVICE_HOST, zelfde bestand). De pod-CIDR
    # staat niet in except, zie de gelijke regel in de keycloak-policy.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
