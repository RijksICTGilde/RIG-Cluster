# Stalwart-configuratie voor de mailrelay. Dit bestand legt de identiteitsregels uit
# plans/mailrelay.md vast; de accounts zelf komen er niet in te staan, die maakt OPI
# via de management-API aan.
#
# DIT BESTAND WORDT EEN CONFIGMAP via de configMapGenerator in kustomization.yaml.
# De gegenereerde naam draagt een hash van de inhoud, en kustomize schrijft die naam
# ook in het Deployment: een wijziging hier is dus vanzelf een rollout. Dat is geen
# franje maar een les die twee keer is geleerd (webadmin-fix en RC-145, 20/21 augustus):
# de config wordt via subPath gemount, dus een bijgewerkte ConfigMap bereikt een
# draaiende pod NOOIT, en wie de herstart vergeet draait stil op oude regels.
#
# GEMETEN, niet bedacht: deze configuratie is stap 4 van de uitrol ("identiteitsregels
# aanzetten", verifieerbaar met een testbericht) uitgevoerd tegen een echte Stalwart
# v0.11.8 met een nep-upstream. Elke regel hieronder is nagespeeld; de uitslagen staan
# bij de regel. Wat er NIET mee bewezen is: de weg naar rmrmail.rijksweb.nl. Stap 2
# (bereikbaarheid) blijft open, zie de aanvulling in plans/mailrelay.md.
#
# De sleutelnamen zijn versiegebonden. Een sleutel die Stalwart niet kent, wordt STIL
# genegeerd - er komt geen foutmelding en de regel doet niets. Verander je de versie in
# deployment.yaml, draai dan de proef opnieuw.

[server]
hostname = "%{env:MAIL_RELAY_HOSTNAME}%"

# Submission: hier bieden de applicaties hun post aan. Authenticatie is verplicht,
# dus het pad waarop een server "relaying denied" zegt (ongeauthenticeerd aanbieden
# voor een vreemd domein) doet zich hier niet voor.
#
# De container luistert op 2525, NIET op 587. Op de sandbox-dev-server krijgt een
# niet-root proces een EACCES ("Permission denied") op bind() naar 25/465/587 en
# niet op hogere poorten - gemeten 19 augustus 2026 met een naald python-socket:
# als root werkt 587 wel, als uid 1000 niet. Buitenaf blijft het contract 587:
# de Service vertaalt port 587 naar targetPort 2525.
[server.listener.submission]
bind = ["[::]:2525"]
protocol = "smtp"

# De management-API. Alleen bereikbaar binnen het cluster; OPI maakt hierlangs de
# accounts aan. Geen ingress: van buiten is hier niets te halen. Het NetworkPolicy
# naast dit bestand laat alleen de OPI-namespace op deze poort toe.
[server.listener.management]
bind = ["[::]:8080"]
protocol = "http"

# Let op: de waarden hier zijn EXPRESSIES, geen TOML-waarden. Een lijst hoort in een
# string ("[plain, login]") en een letterlijke naam tussen enkele quotes ("'internal'").
# Schrijf je ["PLAIN", "LOGIN"], dan weigert Stalwart de instelling bij het opstarten
# ("Invalid property ... found in 'if' block") en valt hij terug op zijn standaard.
[session.auth]
require = [{if = "listener", eq = "submission", then = true}, {else = false}]
mechanisms = "[plain, login]"
directory = "'internal'"
# UIT, en dat is een bewuste keuze met een reden die niet voor de hand ligt.
#
# Deze controle eist dat het envelope-adres op het geauthenticeerde account staat.
# Dat betekent dat elk account een adres in ons afzenderdomein moet dragen, en een
# adres kan alleen bestaan in een domein dat de relay als LOKAAL domein kent. Sinds
# de afzender `rijksoverheid.nl` is, zou dat betekenen dat wij `rijksoverheid.nl`
# als lokaal domein registreren. Stalwart kiest zijn route per ontvanger en bezorgt
# een lokaal domein lokaal, dus mail AAN een collega op `@rijksoverheid.nl` zou in
# onze eigen berichtenopslag verdwijnen in plaats van naar de upstream gaan. Precies
# de meest voorkomende ontvanger, en het zou stil misgaan.
#
# De controle kost ons niets: de herschrijving hieronder gooit de MAIL FROM van de
# applicatie sowieso onvoorwaardelijk weg, en het sieve-script zet de From: vast. Deze
# regel was het vangnet achter een deur die al dicht zit.
must-match-sender = false

# --- Identiteitsregels (plans/mailrelay.md, punt 1 t/m 7) --------------------
#
# De afzender IS het project, en het platform bepaalt hem helemaal - adres en
# weergavenaam allebei. Wat de applicatie zelf in haar From: zet, wordt weggegooid:
#
#    From:        <from-name uit de projectconfiguratie> <noreply-rijksapp+<project>@rijksoverheid.nl>
#    Return-Path: noreply-rijksapp+<project>@rijksoverheid.nl
#
# Waar die twee waarden vandaan komen is de niet voor de hand liggende helft, en het
# antwoord is per waarde anders. GEMETEN op 20 augustus 2026 tegen v0.11.8 (RC-145),
# want er is in deze versie geen enkele manier om tijdens het aannemen van een bericht
# iets PER ACCOUNT op te zoeken:
#
#   - er is geen expressiefunctie die een principal uitleest, dus het description-veld
#     dat OPI al zet is onbereikbaar (principal_get, directory_query en sql_query
#     bestaan geen van drieen: "Invalid variable or function name"; wel key_get,
#     key_set, key_exists, query, dns_query, config_get, starts_with, strip_prefix);
#   - config_get() leest wel een instelling, maar alleen met een LETTERLIJKE sleutel:
#     config_get('server.hostname') werkt, config_get(concat('...', authenticated_as))
#     levert niets. Het wordt bij het bouwen van de configuratie opgelost, niet per
#     bericht;
#   - een opzoektabel in het geheugen (lookup.<naam>.<sleutel> in de instellingen) wordt
#     maar EEN KEER gebouwd. Een POST /api/reload ververst hem niet: het eerste account
#     kreeg zijn waarde, elk account dat erna werd toegevoegd las leeg tot de relay was
#     HERSTART. Onbruikbaar voor een platform waar elke dag een project bij komt;
#   - de opzoekopslag die wel live is (key_get('db', ...)) heeft geen schrijfweg in de
#     management-API - /api/store bestaat niet, en de binary kent alleen
#     /api/management/{principal,settings,queue,reload,report,spam,dkim,dns,log,stores,
#     troubleshoot}.
#
# Wat overblijft, en wat hieronder staat:
#
# 1. HET ADRES WORDT AFGELEID, niet opgezocht. De accountnaam is project-<project>, dus
#    het voorvoegsel eraf knippen levert precies het plusdeel op. Dat OPI hetzelfde
#    adres uitrekent en als SMTP_FROM meegeeft is geen tweede waarheid maar een
#    mededeling: beide kanten bouwen op hetzelfde label, dat OPI op 47 tekens kapt
#    (mail_project_label in naming.py) juist zodat noreply-rijksapp+<label> binnen de
#    64 tekens van een lokaal deel blijft. Een account zonder dat voorvoegsel is geen
#    project - dat is het platformaccount van ZAD zelf - en krijgt het kale adres.
# 2. DE WEERGAVENAAM WORDT INGELADEN. Die valt nergens uit af te leiden, dus OPI
#    genereert er een klein sieve-script voor (zad-afzenders: een regel per account) en
#    schrijft dat via POST /api/settings, gevolgd door POST /api/reload. Een sieve-script
#    wordt bij ELKE herbouw opnieuw gecompileerd - gemeten in beide richtingen: een
#    gewijzigde naam gold bij het eerstvolgende bericht, zonder herstart. Dat is precies
#    wat de opzoektabel niet kon.
#    LET OP bij die reload: een build-error op WELKE sleutel dan ook laat de hele herbouw
#    staan waar hij stond - een kapot proefscript hield tijdens de meting nieuwe waarden
#    onzichtbaar zonder dat er iets aan die waarden mankeerde.
#
# De envelope volgt regel 1 hieronder, de From: volgt regel 1 en 2 in het script.
#
#    - DMARC. `rijksoverheid.nl` publiceert `p=reject` met ontspannen uitlijning
#      (`aspf=r`). Uitgaande mail haalt DMARC alleen als het envelope-domein uitlijnt
#      met het From:-domein, en dat is precies wat dit doet. Wij ondertekenen niet met
#      DKIM (zie hieronder), dus SPF-uitlijning is de ENIGE weg. Een envelope in een
#      ander domein betekent dat elke ontvanger buiten de Rijksoverheid het bericht
#      weigert.
#    - Attributie. Het plusdeel houdt zichtbaar bij welk project een bounce hoort,
#      zonder het domein te verlaten en dus zonder de uitlijning te breken.
#
#    Envelope en From: zijn nu HETZELFDE adres. Ze verschilden eerder een voorvoegsel
#    (de envelope droeg de accountnaam) en dat verschil diende niets: uitlijning kijkt
#    naar het domein, en de ontvanger zag het project juist niet.
#    LET OP: sinds RC-159 kan de From: hiervan AFWIJKEN. Een account met een sleutel
#    onder `zad.afzender.adres.` krijgt in het script hieronder een eigen From:-adres,
#    terwijl de envelope hier de AFGELEIDE waarde houdt. Uitlijning blijft heel omdat OPI
#    alleen adressen in ons eigen afzenderdomein toelaat, en het plusdeel blijft hier de
#    bounce dragen. Vandaag geldt dat voor precies een account: dat van Keycloak.
[session.mail]
rewrite = [
  {if = "starts_with(authenticated_as, 'project-')", eq = true, then = "'%{env:MAIL_FROM_LOCAL}%+' + strip_prefix(authenticated_as, 'project-') + '@%{env:MAIL_DOMAIN}%'"},
  {else = "'%{env:MAIL_FROM_LOCAL}%@%{env:MAIL_DOMAIN}%'"},
]

# 2, 5, 6 en 7 gebeuren in dit script. Stalwart v0.11 kent GEEN sleutel om kopregels
# te verwijderen of om de From: vast te zetten - [session.data.add-headers] gaat alleen
# over headers die Stalwart zelf TOEVOEGT. Een sieve-script op de DATA-fase is de enige
# plek waar dit echt kan, en daarmee is het ook echt een regel en geen belofte.
[session.data]
script = "'identiteitsregels'"

[sieve.trusted.scripts.identiteitsregels]
contents = '''
require ["editheader", "variables", "include", "vnd.stalwart.expressions"];

set "domein" "%{env:MAIL_DOMAIN}%";

# De weergavenaam komt uit het script dat OPI genereert. :optional, want op een cluster
# waar nog geen enkel project mail verstuurt bestaat dat script niet, en dan hoort er
# post te vertrekken zonder naam in plaats van helemaal niet. `global` is wat de waarde
# over de scriptgrens tilt: een ingesloten script deelt alleen variabelen die aan beide
# kanten global zijn (RFC 6609), en zonder die verklaring blijft de naam hier stil leeg.
global "naam";
set "naam" "";
# En hetzelfde voor het ADRES. Bijna elk account heeft er geen: het adres wordt hieronder
# uit de accountnaam AFGELEID. Een account dat het script wel een adres geeft, stapt uit
# die afleiding - vandaag alleen het Keycloak-account van ZAD, zodat inlogpost te
# onderscheiden is van de post van de portal.
global "afzender";
set "afzender" "";
include :optional :personal "zad-afzenders";

# Het adres uit de accountnaam. LET OP de vorm: een `let` BINNEN een if-blok overleeft
# dat blok niet (gemeten - de variabele leest daarbuiten leeg), dus de twee kandidaten
# worden buiten de vertakking uitgerekend en `set` kiest ertussen.
let "account" "env.authenticated_as";
let "projectadres" "'%{env:MAIL_FROM_LOCAL}%+' + strip_prefix(account, 'project-') + '@%{env:MAIL_DOMAIN}%'";
set "adres" "%{env:MAIL_FROM_LOCAL}%@%{env:MAIL_DOMAIN}%";
if eval "starts_with(account, 'project-')" {
    set "adres" "${projectadres}";
}
# Een ingeladen adres wint van de afleiding, en RAAKT ALLEEN DE From:. De envelope
# hierboven (`[session.mail] rewrite`) houdt de afgeleide waarde, en dat is geen
# vergissing maar de bedoeling: DMARC-uitlijning vergelijkt de DOMEINEN van envelope en
# From:, en die blijven gelijk zolang OPI alleen adressen in ons afzenderdomein toelaat
# (MAIL_SENDER_DOMAIN_ALLOWLIST in opi/connectors/mail.py). Het plusdeel blijft
# ondertussen in de envelope staan en blijft dus de bounce dragen.
if eval "afzender != ''" {
    set "adres" "${afzender}";
}

# 2. De From: wordt OVERSCHREVEN met de afzender van DIT account: het projectadres en
#    de weergavenaam uit de projectconfiguratie. Er wordt niets uit de aangeleverde
#    header overgenomen, naam noch adres, dus er valt hier voor een applicatie niets
#    te kiezen en niets te forceren.
#
#    OVERSCHRIJVEN EN NIET WEIGEREN, en dat is een bewuste keuze. Weigeren zou elke
#    applicatie breken die zelf een From: zet, en dat doet vrijwel elke maillibrary
#    standaard. Een 550 op iets waar de ontwikkelaar niets aan kan doen is geen regel
#    maar een val. Overschrijven is bovendien strikter: er is geen invoer die eraan
#    ontsnapt, want er wordt niets getoetst.
#
#    De Reply-To: blijft wel van de applicatie en wordt hier niet aangeraakt. Dat is de
#    scheiding: de From: is identiteit en ligt vast omdat wij op andermans mailserver
#    zitten, de Reply-To: zegt alleen waar een antwoord heen moet.
#
#    De weergavenaam gaat tussen aanhalingstekens de header in. Zo is elke naam die de
#    validatie doorlaat een geldige quoted-string uit RFC 5322 - ook een met een komma
#    of een dubbele punt erin, die zonder quotes van de From: een lijst met twee
#    mailboxen zou maken. Wat er niet in kan komen, weigert OPI al bij het formulier en
#    bij de API: regeleindes en andere stuurtekens (header-injectie), een @ of
#    punthaken (dan leest de naam bij menig ontvanger als het afzenderadres), een
#    aanhalingsteken of backslash (die zouden juist deze quoting openbreken), een
#    dollarteken (dat begint in sieve een variabele) en meer dan 64 tekens.
#
#    HIER STOND een regel 2a: "precies EEN adres in de From:, anders 550". Die had een
#    taak zolang de weergavenaam uit het AANGELEVERDE bericht werd overgenomen - bij
#    twee mailboxen was niet eenduidig welk deel de naam was, en "From: <invoice@
#    evil.example>, noreply@..." kon zo op naam van een slachtoffer vertrekken. Nu de
#    hele header wordt weggegooid en opnieuw opgebouwd uit onze eigen twee waarden, is
#    er geen invoer meer om eenduidig over te zijn: deleteheader haalt ELKE From: weg,
#    ook een met twee mailboxen en ook een tweede kopregel. Weigeren zou alleen nog
#    berichten kosten zonder iets te beschermen.
deleteheader "From";
if eval "naam == ''" {
    addheader :last "From" "<${adres}>";
} else {
    addheader :last "From" "\"${naam}\" <${adres}>";
}

# 6. Het Message-ID houdt zijn unieke deel maar krijgt ONS domein. Een applicatie zet
#    daar de naam van zijn pod in (<...@app-pod-7f9c.rig-prd-demo.svc.cluster.local>)
#    en dat is precies de interne topologie die niet naar buiten hoort. Alleen
#    weggooien kan niet: [session.data.add-headers] draait VOOR dit script, dus er komt
#    dan geen nieuwe voor terug en het bericht vertrekt zonder Message-ID.
if header :matches "Message-ID" "<*@*>" {
    deleteheader "Message-ID";
    addheader :last "Message-ID" "<${1}@${domein}>";
}

# 5 en 7. Wat er van binnen het cluster in de kopregels staat, gaat er weer uit: de
#    Received-keten (pod-IP's en namespace-namen) en de verklikkers die applicaties
#    meesturen. Dit is een privacymaatregel, geen verhullingstruc - het is
#    standaardgedrag van elke submission-server.
#    RFC 5293 raadt implementaties aan het verwijderen van Received te WEIGEREN, dus
#    dit is precies een regel die stil niets had kunnen doen. Gemeten tegen v0.11.8:
#    een bericht met Received, X-Originating-IP, X-Mailer, X-Originating-Client en
#    X-Authenticated-Sender komt bij de upstream aan zonder al die vijf. Tegenproef
#    met dezelfde relay zonder deze vijf regels: alle vijf komen wel aan. Stalwart
#    weigert deleteheader "Received" dus niet.
deleteheader "Received";
deleteheader "X-Originating-IP";
deleteheader "X-Authenticated-Sender";
deleteheader "X-Mailer";
deleteheader "X-Originating-Client";
'''

# Wat Stalwart zelf toevoegt. Received en de authenticatieresultaten blijven eraf: die
# zouden het pod-IP en het SASL-account naar buiten dragen.
[session.data.add-headers]
received = false
received-spf = false
auth-results = false
message-id = true
date = true

# 3. DKIM-ondertekening met onze eigen sleutel. De handtekening overleeft de hop naar
#    de upstream, dus DMARC slaagt op DKIM-alignment ongeacht wat de upstream met de
#    envelope doet. Gemeten: de afgeleverde post draagt
#    "DKIM-Signature: ... s=zad; d=<maildomein>" met From in de h=-lijst.
# 3. GEEN DKIM-ondertekening, en dat is geen vergeten stap.
#
#    Ondertekenen heeft alleen zin als de publieke sleutel in de DNS-zone van het
#    afzenderdomein staat. Het afzenderdomein is `rijksoverheid.nl` en die zone is niet
#    van ons, dus wij kunnen daar geen selector publiceren. Ondertekenen met een domein
#    dat we wel beheren zou een handtekening opleveren die niet uitlijnt met de From:
#    en dus niets doet voor DMARC, terwijl een handtekening die nergens verifieert bij
#    sommige ontvangers juist tegen ons werkt. Geen handtekening is dan beter dan een
#    kapotte.
#
#    Wat het wel betekent: we leunen VOLLEDIG op SPF-uitlijning, en die staat of valt
#    met de envelope-herschrijving hierboven. Gaat die stuk, dan haalt geen enkel
#    bericht DMARC meer en weigert elke ontvanger buiten de Rijksoverheid alles. Er is
#    geen tweede been om op te staan.
#
#    Terugweg als het ooit moet: het mailteam publiceert een selector voor ons onder
#    `rijksoverheid.nl`, en dan komt hier een [auth.dkim] met [signature.rsa] terug met
#    `domain = "rijksoverheid.nl"`.

# 4. SPF staat hier bewust NIET: wij praten nooit rechtstreeks met het internet. Het
#    SPF-record van `rijksoverheid.nl` (`v=spf1 redirect=spf-a.ssonet.nl`) moet de
#    uitgaande IP's van de UPSTREAM autoriseren, en dat doet het al, want de upstream
#    IS hun eigen mailinfrastructuur. Daar hoeven wij niets voor te regelen.

# --- Alles gaat naar een upstream ------------------------------------------
#
# Ook next-hop is een expressie: zonder de enkele quotes leest Stalwart 'upstream' als
# een variabele en weigert hij de instelling ("Invalid variable or constant").
[queue.outbound]
next-hop = "'upstream'"

# Poort 25 en GEEN authenticatie, en dat is geen slordigheid maar gemeten gedrag.
# Op 17 augustus 2026 tegen rmrmail.rijksweb.nl vanuit een pod met rig-ron-egress:
# poort 25 antwoordt met "220 rmrmail.rijksweb.nl ESMTP", 587 en 465 zijn dicht, en de
# EHLO-lijst is 8BITMIME, SIZE 31457280 en STARTTLS. Er staat GEEN "AUTH" in. De
# upstream vertrouwt op ons uitgaande adres 145.21.227.140, wat ook verklaart waarom
# het mailteam om een IP vroeg en niet om een accountnaam. Een [remote.upstream.auth]
# met lege waarden zou hier alleen maar een AUTH-poging opleveren die hij niet kent.
#
# LET OP het verschil met de submission-listener hierboven: die blijft 587 MET
# verplichte authenticatie. Alleen deze sprong naar de upstream is 25 zonder.
[remote.upstream]
address = "%{env:MAIL_UPSTREAM_HOST}%"
port = 25
protocol = "smtp"

# implicit = false betekent STARTTLS op een platte verbinding, en dat is precies wat
# deze upstream aanbiedt.
#
# GEMETEN op 19 augustus 2026 op de sandbox, en het antwoord is: dit is een GARANTIE,
# geen voorkeur. Stalwart valt NIET terug op platte tekst.
#   - upstream zonder STARTTLS: "STARTTLS was not advertised by host" en een
#     PERMANENTE fout; het bericht wordt gebounced.
#   - upstream met een certificaat dat niet valideert: "invalid peer certificate" en
#     een TIJDELIJKE fout; het bericht blijft in de wachtrij en wordt herhaald.
# In geen van beide gevallen vertrekt er iets onversleuteld.
#
# OOK GEMETEN, en belangrijk voor productie: Stalwart leest de trust store van het
# besturingssysteem NIET. Een eigen CA in /etc/ssl/certs/ca-certificates.crt hangen
# verandert niets (de fout blijft "UnknownIssuer"); hij gaat af op de ingebouwde
# webpki-roots. Presenteert de upstream ooit een certificaat van een interne CA, dan
# is er geen knop om die te vertrouwen - dan blijft alleen de schakelaar hieronder.
#
# Die schakelaar staat er om precies EEN reden: in een ontwikkelcluster is de upstream
# een sink met een zelfondertekend certificaat, en die kan per definitie niet door
# webpki-validatie komen. Hij hoort dus op false te staan en doet dat ook overal waar
# de sink niet meekomt: de waarde komt uit de omgeving en de basis van het Deployment
# zet hem op "false". Omgezet wordt hij door de component mail/sink/as-upstream, die de
# sink en deze schakelaar samen levert - een cluster dat de sink inlaadt (local en
# sandboxed-local) kan de schakelaar dus niet vergeten, en odcn, dat de sink niet
# inlaadt, blijft strikt.
[remote.upstream.tls]
implicit = false
allow-invalid-certs = "%{env:MAIL_UPSTREAM_ALLOW_INVALID_CERTS}%"

# --- Limieten (plans/mailrelay.md, "Limieten en uitgaande controle") --------
#
# Gekeyd op het geauthenticeerde account, dus precies op het project. Het echte werk
# doen deze limieten, niet het spamfilter: ze vangen de retry-loop die tienduizend
# berichten stuurt voordat iemand het merkt.
#
# LET OP, dit is een BOVENgrens per account en niet het getal dat het project zelf
# invult. Stalwart v0.11 kent geen limiet op de principal (de management-API weigert
# een 'limits'-veld), dus het per-projectgetal uit send-email is de afgesproken
# begroting die OPI vastlegt en toont; de relay dwingt het plafond hieronder af, dat
# gelijk is aan MAX_MESSAGES_PER_DAY in de dienst. Gemeten met rate = "3/1d": het
# vierde bericht van hetzelfde account krijgt "452 4.4.5 Rate limit exceeded", een
# ander account merkt daar niets van.
[queue.limiter.inbound.account]
enable = true
key = ["authenticated_as"]
rate = "5000/1d"

# Globaal plafond bovenop de som van de projecten, zodat een fout in de provisioning
# nooit de afspraak met het mailteam kan overschrijden.
[queue.limiter.inbound.platform]
enable = true
key = ["listener"]
rate = "20000/1d"

[session.rcpt]
max-recipients = 25

[session.data.limits]
# Lager dan wat de upstream accepteert, zodat een te groot bericht bij ONS wordt
# geweigerd en zichtbaar is, niet bij hen.
size = 15728640
messages = 10

# --- Opslag -----------------------------------------------------------------
#
# PostgreSQL en geen PVC: dat scheelt de RWO-problematiek (strategy: Recreate), maakt
# meerdere replicas mogelijk en past bij wat we al draaien.
[store.db]
type = "postgresql"
host = "%{env:MAIL_DB_HOST}%"
port = 5432
database = "%{env:MAIL_DB_NAME}%"
user = "%{env:MAIL_DB_USER}%"
password = "%{env:MAIL_DB_PASSWORD}%"
# Zonder deze regel pakt Stalwart de deadpool-default: cpu-cores x 4, en dat blaast
# zo door het connectionLimit van de rol heen (gemeten 20 augustus 2026 als "FATAL:
# too many connections for role mailrelay" bij een podwissel). De rol staat op 20
# (postgresql/database/base/cluster.yaml), dus twee pods tijdens een rollover (2 x 8)
# passen erbinnen.
pool.max-connections = 8

[storage]
data = "db"
blob = "db"
fts = "db"
lookup = "db"
directory = "internal"

[directory.internal]
type = "internal"
store = "db"

[authentication.fallback-admin]
user = "%{env:MAIL_RELAY_ADMIN_USERNAME}%"
secret = "%{env:MAIL_RELAY_ADMIN_PASSWORD}%"

# De spamfilter-regelset. De sleutel `resource` zet de STARTHANG uit, `auto-update` doet
# dat niet, en dat verschil heeft de relay op productie plat gelegd (21 augustus 2026).
#
# GELEZEN IN boot.rs VAN v0.11.8, want uit de documentatie is dit niet af te leiden.
# Staat `version.spam-filter` niet in de configopslag, dan draait `fetch_spam_rules()`
# ONVOORWAARDELIJK bij elke start (boot.rs:233). Zonder de sleutel hieronder pakt die
# DEFAULT_SPAMFILTER_URL op github.com, met een HARDGECODEERDE timeout van 60 seconden
# (manager/mod.rs:39-49). Op ODCN gaat al het uitgaande verkeer van deze namespace door
# de RON-egressgateway - de annotatie egress.projectcalico.org/egressGatewayPolicy neemt
# exact een waarde - dus github is onbereikbaar en die 60 seconden lopen voluit.
#
# Dat gebeurt VOOR telemetry.enable() (boot.rs:384), dus er komt geen enkele logregel.
# Gemeten op productie: containerstart 14:10:26, eerste logregel 14:11:26, listeners
# gebonden in diezelfde seconde. De liveness-probe kilt op ~50 seconden, dus de relay was
# 10 seconden te laat en kwam nooit omhoog. En omdat de download nooit slaagt, wordt
# `version.spam-filter` nooit weggeschreven en doet elke herstart het opnieuw:
# zelfherstel is uitgesloten.
#
# `auto-update` hieronder helpt hier NIET tegen. Die sleutel wordt pas op boot.rs:410
# gelezen, na de telemetrie, en gaat alleen over de periodieke verversing.
#
# LET OP BIJ HET LEZEN VAN DE LOG: spamfilter en webadmin schrijven hun bouwfout allebei
# op sleutel "*", en `config.errors` is een AHashMap. Webadmin komt later en OVERSCHRIJFT
# de spamfilterfout, dus je ziet alleen de download die al is afgevangen. Wie op die
# logregel afgaat, zoekt in de verkeerde hoek. Dat is precies wat er is gebeurd.
#
# DIT IS EEN BLOKKADE, GEEN BESLUIT. Het filter HOORT aan te staan. Het staat nu uit
# omdat de regels er niet zijn, niet omdat we ze niet willen, en het pad terug is het
# bestand VENDOREN in plaats van het op te halen. Dat is haalbaar: spam-filter.toml is
# 76 KB (past ruim in een ConfigMap) en versie 2.0.5 eist server 0.11.0, dus v0.11.8
# voldoet. Wat er dan nog aan uitgezocht moet worden staat in
# plans/mail-vervolgpunten.md, punt 2.
[spam-filter]
auto-update = false
resource = "file:///nonexistent/spamfilter-nog-niet-gevendord.toml"

# De webadmin-bundel. Bij de EERSTE start ontbreekt hij in de blobopslag en haalt
# Stalwart hem VOOR de logger-initialisatie op van GitHub (boot.rs v0.11.8; gemeten
# 20 augustus 2026 als een stille SYN naar 140.82.121.3:443). Ons netwerkbeleid staat
# geen internet-egress toe, dus die connect hangt tot de TCP-timeout en de
# liveness-probe kilt de pod eerder: een herstartlus ZONDER ENIGE LOGREGEL, want de
# logger draait dan nog niet. `auto-update = false` helpt hier niet, dat gaat alleen
# over latere updates. Een file://-pad dat niet bestaat faalt onmiddellijk; Stalwart
# registreert een build-error en start gewoon door. De webadmin-UI missen we niet:
# OPI praat met de management-REST-API en die zit in de binary zelf.
[webadmin]
auto-update = false
resource = "file:///nonexistent/webadmin-bewust-niet-opgehaald.zip"

# De ASN/Geo-download (jsdelivr) staat bij Stalwart standaard aan en is hier nutteloos:
# wij hebben geen inkomende vreemden om te geolokaliseren, en op ODCN wordt de fetch
# door het netwerkbeleid geblokkeerd (de sandbox-Kind dwingt netpols niet af, dus dat
# zie je daar niet). Hij draait na het binden van de listeners en blokkeert de start
# dus niet, maar een terugkerende fetch-fout in de log is ruis die een echte fout
# maskeert. Expliciet uit.
[asn]
type = "disable"

[tracer.stdout]
type = "stdout"
level = "info"
ansi = false
enable = true
