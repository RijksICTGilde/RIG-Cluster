apiVersion: apps/v1
kind: Deployment
metadata:
  name: rig-mail-relay
  namespace: rig-ron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rig-mail-relay
  template:
    metadata:
      labels:
        # Het NetworkPolicy-label waar de dienst send-email naar verwijst
        # (RELAY_POD_LABELS in opi/services/catalog/send_email/__init__.py). Verander je
        # dit label, verander het daar dan mee, anders opent het beleid van elk project
        # niets meer.
        app: rig-mail-relay
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stalwart
          # Er bestaat geen v0.11.5 op Docker Hub (de reeks springt van v0.11.4 naar
          # v0.11.6); dat is een ImagePullBackOff bij de eerste uitrol. Deze versie is de
          # versie waartegen de identiteitsregels in de configmap zijn gemeten.
          image: stalwartlabs/mail-server:v0.11.8
          # De binary rechtstreeks, NIET het entrypoint van het image. Dat entrypoint
          # (/usr/local/bin/entrypoint.sh) negeert zijn argumenten volledig: het draait
          # --init als /opt/stalwart-mail/etc/config.toml ontbreekt en start daarna altijd
          # met DAT bestand. Met alleen args hierboven zou de relay dus met een zelf
          # gegenereerde standaardconfiguratie draaien - geen identiteitsregels, geen
          # upstream, geen limieten - of vastlopen op de read-only rootfs bij de --init.
          # Gemeten tegen v0.11.8: met alleen args schrijft hij "Configuration file
          # written to /opt/stalwart-mail/etc/config.toml"; met dit command laadt hij
          # /etc/mail/config.toml.
          command: ["/usr/local/bin/stalwart-mail"]
          args: ["--config", "/etc/mail/config.toml"]
          ports:
            # 2525 in plaats van 587: zie de toelichting bij de submission-listener in
            # configmap.yaml. De Service blijft 587 aanbieden.
            - containerPort: 2525
              name: submission
            - containerPort: 8080
              name: management
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Bewust zonder namespace erin: de namespace heet op ODCN rig-prd-ron en
            # elders rig-ron, en deze naam gaat als EHLO-naam de deur uit.
            - name: MAIL_RELAY_HOSTNAME
              value: rig-mail-relay
            - name: MAIL_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_DOMAIN
            - name: MAIL_FROM_LOCAL
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_FROM_LOCAL
            # DE UPSTREAM. Geen geheim en dus geen secret: een host, een poort (overal 25),
            # TLS. De basis draagt de productiewaarde: de mailserver van de organisatie,
            # zonder gebruikersnaam en wachtwoord - gemeten op 17 augustus 2026 adverteert
            # die server geen AUTH en vertrouwt hij op ons uitgaande adres 145.21.227.140.
            # Zie docs/ron-koppeling.md. De component mail/sink/as-upstream zet hem om naar
            # de SMTP-sink, dus local en sandboxed-local krijgen de sink vanzelf mee.
            - name: MAIL_UPSTREAM_HOST
              value: rmrmail.rijksweb.nl
            # Strikte certificaatcontrole op de sprong naar de upstream. Staat hier op
            # "false" zodat elk cluster hem strikt heeft zonder iets te hoeven zeggen; de
            # component mail/sink/as-upstream zet hem om, want de sink die diezelfde
            # component meebrengt draagt een zelfondertekend certificaat. Zie de
            # toelichting in configmap.yaml.
            - name: MAIL_UPSTREAM_ALLOW_INVALID_CERTS
              value: "false"
            - name: MAIL_RELAY_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_RELAY_ADMIN_USERNAME
            - name: MAIL_RELAY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-relay-credentials
                  key: MAIL_RELAY_ADMIN_PASSWORD
            # De gedeelde PostgreSQL. De host is geen geheim: de basis draagt de
            # productiewaarde, en de overlays van local en sandboxed-local zetten hem om
            # naar rig-system, want daar draait de database op die clusters.
            - name: MAIL_DB_HOST
              value: rig-db-rw.rig-prd-operations.svc.cluster.local
            - name: MAIL_DB_NAME
              value: mailrelay
            # Gebruiker en wachtwoord komen uit mail-db-credentials: hetzelfde geheim waar
            # CNPG de rol `mailrelay` uit aanmaakt (zie postgresql/database/base), hier
            # een tweede keer gerenderd in de namespace van de relay. Een bron, dus een
            # rotatie kan niet in de ene lezer landen en in de andere niet.
            - name: MAIL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mail-db-credentials
                  key: username
            - name: MAIL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mail-db-credentials
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: "256Mi"
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: "512Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/mail/config.toml
              subPath: config.toml
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # NIET op de submissiepoort, en dat is geen smaakkwestie maar een gemeten
          # storing. Elke TCP-verbinding op de submissielistener telt mee in
          # `queue.limiter.inbound.platform` (20000 per dag, gesleuteld op de listener),
          # ook een verbinding die niets aanbiedt. Met een readiness elke 5 en een
          # liveness elke 10 seconden zijn dat 18 gebeurtenissen per minuut: GEMETEN op
          # 20 augustus 2026 door een minuut lang niets te versturen en de teller te
          # tellen (34 -> 52). Dat is 25.920 per dag tegen een plafond van 20.000, dus de
          # relay at zijn eigen dagbudget op en weigerde daarna ELKE inzending met
          # "452 4.4.5 Rate limit exceeded ... id = platform" - en hij kwam er niet meer
          # uit, want het verbruik van de probes ligt boven het bijvultempo. Zo lag het
          # versturen op de sandbox plat en zou het dat op productie ook doen, ongeveer
          # een dag na elke uitrol.
          #
          # De managementlistener heeft een eigen gezondheidsingang die geen mailsessie
          # opent. GEMETEN tegen v0.11.8: /healthz/live en /healthz/ready antwoorden
          # allebei 200 ZONDER inloggegevens, wat nodig is want een probe stuurt die niet
          # mee. Wat we ermee opgeven: dat de probe bewijst dat poort 2525 gebonden is.
          # Wat we ervoor terugkrijgen: een relay die na een dag nog post aanneemt.

          # De startupProbe is het VANGNET onder de twee hieronder, en hij staat er om een
          # gemeten reden. De storing van 21 augustus 2026 was een crashloop ZONDER ook
          # maar een logregel, omdat Stalwart een blokkerende download doet voordat zijn
          # logger bestaat (zie het blok [spam-filter] in config.toml): de liveness-probe
          # kilde op ~50 seconden terwijl de listeners op 60 seconden bonden, en dat
          # herhaalde zich eindeloos.
          #
          # Zolang deze probe loopt, staan liveness en readiness stil. 30 x 5 seconden
          # geeft de start 150 seconden ruimte. Daarmee wordt een trage start voortaan
          # ZICHTBAAR traag - de pod blijft 0/1 met een oplopende teller - in plaats van
          # een herstartlus die eruitziet als een kapotte applicatie. Op dezelfde
          # managementpoort als de andere twee, dus ook deze opent geen mailsessie en telt
          # niet mee in queue.limiter.inbound.platform.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: rig-mail-relay-config
        - name: tmp
          emptyDir: {}
