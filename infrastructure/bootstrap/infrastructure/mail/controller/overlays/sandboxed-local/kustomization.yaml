apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-ron

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  # De SMTP-sink als testupstream. Staat alleen in local en sandboxed-local: op ODCN is de
  # upstream de mailserver van de Rijksoverheid en heeft een sink niets te zoeken.
  - ../../../sink/base
  - network-policies/mail-relay-networkpolicy.yaml

patches:
  # De Namespace uit de base kan hier niet meedoen: de ArgoCD op dit clustertype draait
  # in namespaced mode en weigert cluster-scoped resources ('cluster level Namespace
  # "rig-ron" can not be managed when in namespaced mode', gemeten 19 augustus 2026).
  # De namespace rig-ron wordt op dit clustertype HANDMATIG aangemaakt door
  # task sandbox:create-sops-age-secret - de CMP van deze app heeft hem bij het renderen
  # toch al nodig, dus GitOps kon hem nooit zelf brengen. (Een losse file-referentie
  # naar base naast de map-referentie kan ook niet: de load restrictor van de CMP laat
  # alleen mappen buiten de overlay-root toe, geen losse bestanden.)
  - target:
      kind: Namespace
      name: rig-ron
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rig-ron

  # De sink draagt een zelfondertekend certificaat en Stalwart valideert tegen de
  # ingebouwde webpki-roots; een eigen CA toevoegen kan niet (gemeten: hij leest de trust
  # store van het besturingssysteem niet). Zonder deze schakelaar mislukt elke bezorging
  # naar de sink op "invalid peer certificate" en komt er in dit cluster nooit post aan.
  # Alleen hier: de basis zet hem op "false" en odcn laat hem daar staan.
  #
  # Op naam en niet op index: kustomize voegt env-lijsten samen op het veld `name`, dus
  # deze patch blijft staan als er in de basis een variabele voor of achter bij komt.
  - target:
      kind: Deployment
      name: rig-mail-relay
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rig-mail-relay
      spec:
        template:
          spec:
            containers:
              - name: stalwart
                env:
                  - name: MAIL_UPSTREAM_ALLOW_INVALID_CERTS
                    value: "true"
