# podSelector + policyTypes maakt de relay-pods deny-by-default; alleen wat hieronder
# expliciet wordt toegestaan komt erdoor.
#
# De INGANG staat hier, de UITGANG bij het project: de dienst send-email draagt per
# component een egress-beleid bij in de projectnamespace, want alleen de dienst weet
# wanneer hij aanstaat en voor welk component. Handmatig beheerde regels aan die kant zijn
# precies hoe de storing van 10 juni ontstond.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-mail-relay-access
  namespace: rig-prd-ron
spec:
  podSelector:
    matchLabels:
      app: rig-mail-relay
  policyTypes: [Ingress, Egress]
  ingress:
    # Tenant-namespaces bieden post aan op submission. De grens tussen projecten ligt
    # hier niet: die ligt bij de SMTP-authenticatie en bij de limiet per account. Een
    # namespace die geen egress-beleid heeft komt hier sowieso niet aan.
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        # 2525, niet 587: dat is de podpoort (de Service vertaalt 587 -> 2525,
        # zie configmap.yaml), en een NetworkPolicy kijkt naar de poort van de pod.
        - protocol: TCP
          port: 2525
    # OPI zelf: post versturen namens het platform (587) en accounts aanmaken op de
    # management-API (8080).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
      ports:
        # 2525, niet 587: dat is de podpoort (de Service vertaalt 587 -> 2525,
        # zie configmap.yaml), en een NetworkPolicy kijkt naar de poort van de pod.
        - protocol: TCP
          port: 2525
        - protocol: TCP
          port: 8080
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # De gedeelde PostgreSQL: de relay bewaart zijn accounts en zijn wachtrij daar en
    # niet op een PVC.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
      ports:
        - protocol: TCP
          port: 5432
    # De upstream mailserver, via de egressgateway. Alleen poort 25 naar DAT adres, want
    # dat is de enige poort die daar open staat (587 en 465 zijn dicht, gemeten 17-08-2026):
    # rmrmail.rijksweb.nl resolvet naar 145.21.161.201 (gemeten vanuit rig-prd-vlam-wt8,
    # zie plans/mailrelay.md, aanvulling 1). Een 0.0.0.0/0 hierop zou van de relay een
    # uitgang naar elke mailserver op internet maken, en dat is precies de open relay die
    # de rest van dit ontwerp probeert te vermijden.
    #
    # Verandert dat adres, dan verandert deze regel mee. Een NetworkPolicy kent geen
    # namen, alleen CIDR's, dus dit is niet af te leiden uit MAIL_UPSTREAM_HOST.
    - to:
        - ipBlock:
            cidr: 145.21.161.201/32
      ports:
        - protocol: TCP
          port: 25
