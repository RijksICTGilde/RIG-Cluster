apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-ron

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  - network-policies/mail-relay-networkpolicy.yaml

patches:
  # De Namespace uit de base kan hier niet meedoen: de ArgoCD op ODCN draait in
  # namespaced mode en weigert cluster-scoped resources, en de CMP weigert sowieso te
  # renderen zolang de doelnamespace niet bestaat. rig-prd-ron komt daarom uit de
  # BOOTSTRAP (namespace-ron.yaml in bootstrap/rig-system/kustomize/overlays/
  # odcn-production, aangebracht door task bootstrap-argo-system met kubectl), met
  # daarop:
  #   - de RON-koppeling: annotatie egress.projectcalico.org/egressGatewayPolicy:
  #     rig-ron. Die annotatie is de reden dat de relay een eigen namespace heeft: ze
  #     neemt exact een waarde, dus RON en internet kunnen niet allebei op dezelfde
  #     namespace staan (plans/mailrelay.md, aanvulling 2, en docs/ron-koppeling.md);
  #   - het label argocd.argoproj.io/managed-by: rig-prd-operations, zodat de
  #     namespaced ArgoCD er RBAC voor krijgt;
  #   - het secret sops-age-key in die namespace, want de CMP leest hem daar.
  # (De naam volgt de ODCN-eis dat een namespace met de clusterprefix begint, dus
  # rig-ron kan daar niet bestaan.)
  - target:
      kind: Namespace
      name: rig-ron
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rig-ron
  # OpenShift kent de UID/GID zelf toe uit het toegestane bereik.
  - target:
      kind: Deployment
      name: rig-mail-relay
    patch: |-
      - op: remove
        path: /spec/template/spec/securityContext/runAsUser
      - op: remove
        path: /spec/template/spec/securityContext/runAsGroup
      - op: remove
        path: /spec/template/spec/securityContext/fsGroup
  # De pull-secrets van de namespace hangen alleen aan het default-serviceaccount, en op
  # een verse namespace pas na 7 tot 10 minuten (plans/private-images-uit-een-eigen-
  # registry.md). Expliciet op de pod betekent dat de eerste uitrol niet op dat venster
  # hoeft te wachten. Precedent: 584d40639 (prometheus).
  - target:
      kind: Deployment
      name: rig-mail-relay
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub-rig-robot-pull-secret

# ODCN kan Docker Hub niet bereiken en haalt alles via de rcr-proxy. Staat dat pad hier niet
# in git, dan herschrijft admission het image wel, maar wijkt wat er draait af van wat ArgoCD
# in git ziet en staat ron-infrastructure permanent OutOfSync.
images:
  - name: stalwartlabs/mail-server
    newName: rcr.rijksapps.nl/dockerhub-rig/stalwartlabs/mail-server
