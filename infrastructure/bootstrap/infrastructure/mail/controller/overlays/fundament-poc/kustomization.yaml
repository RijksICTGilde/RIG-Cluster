apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-ron

generators:
  - decrypt-sops.yaml

resources:
  - ../../base
  - network-policies/mail-relay-networkpolicy.yaml
  - ingress-mailsink.yaml

# De SMTP-sink als testupstream, MET de schakelaar die de relay zijn zelfondertekende
# certificaat laat aannemen. De component levert die twee samen, zodat de ene niet zonder de
# andere ingeladen kan worden; dat is precies de fout die op `local` een sink opleverde waar
# niets aan bezorgd kon worden. Dit cluster kan niet bij het RON-netwerk, dus de echte
# mailserver van de Rijksoverheid valt hier af en de sink is de enige zinnige upstream.
components:
  - ../../../sink/as-upstream

patches:
  # Zelfde als de sandbox: de gedeelde PostgreSQL draait hier in rig-system, niet in
  # rig-prd-operations. Op naam en niet op index, want kustomize voegt env-lijsten samen op
  # het veld `name` en dan blijft deze patch staan als de basis een variabele erbij krijgt.
  - target:
      kind: Deployment
      name: rig-mail-relay
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: rig-mail-relay
      spec:
        template:
          spec:
            containers:
              - name: stalwart
                env:
                  - name: MAIL_DB_HOST
                    value: rig-db-rw.rig-system.svc.cluster.local

  - target:
      kind: Namespace
      name: rig-ron
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: rig-ron

# LET OP het verschil met de sandbox-overlay, en wat er WEL en NIET van overgenomen is.
#
# WEL: de Namespace gaat er hier ook uit. Niet omdat ArgoCD hem niet zou mogen maken (dat
# mag hij: hij draait cluster-scoped en Namespace staat op de clusterResourceWhitelist van
# zad-platform, en cert-manager en cloudnative-pg beheren hun eigen namespace aantoonbaar),
# maar omdat de CMP-plugin weigert te RENDEREN zolang de doelnamespace niet bestaat:
#
#     ERROR: Namespace 'rig-ron' does not exist
#
# De namespace zit in de manifesten die hij moet renderen, dus GitOps kan hem per definitie
# niet zelf brengen. Diezelfde pre-check zoekt er ook het sops-age-key-secret. Allebei
# worden ze vooraf aangemaakt, met:
#
#     kubectl --context <ctx> create namespace rig-ron
#     task create-sops-age-secret NAMESPACE=rig-ron
#
# NIET: de aparte Application ron-infrastructure. Die bestaat op de sandbox omdat daar alle
# infrastructuur in EEN platte Application zit met bestemming rig-system, wat rig-ron
# platsloeg tot een ID-conflict op een dubbel secret. De app-of-apps geeft elke component
# hier al een eigen Application met een eigen bestemming, dus mail is gewoon
# fundament-poc-mail met destination rig-ron.
