# De testupstream van de sandbox: een SMTP-sink die alles aanneemt en niets bezorgt.
#
# WAAROM DIT BESTAAT. De relay levert alles af bij een upstream, en op ODCN is dat de
# mailserver van de Rijksoverheid. Die is vanuit een ontwikkelcluster niet bereikbaar en
# je wilt er ook niet op oefenen. Zonder sink is de sandbox dus stuk op precies het punt
# waar de identiteitsregels zitten: het overschrijven van de From:, het plusdeel in de
# envelope, en het verwijderen van de Received-keten. Dat zijn de regels waarop dit hele
# ontwerp rust, en ze waren tot nu toe alleen met de hand na te spelen.
#
# Mailpit doet precies twee dingen en verder niets: hij toont dat er SMTP binnenkomt, en
# hij geeft elk bericht integraal terug via een HTTP-API. Daarmee wordt een identiteits-
# regel een assertie in een test in plaats van een belofte in een comment.
#
# ALLEEN VOOR local EN sandboxed-local. Deze map wordt niet vanuit de odcn-overlay
# ingeladen, dus dit image hoeft niet langs de registry en het signature-beleid van ODCN.
#
# GEEN AUTHENTICATIE OP DE SINK, en dat is niet slordig maar bruikbaar. De relay biedt aan
# zonder inloggegevens (de upstream op productie kent ook geen AUTH), dus de sink hoeft er
# geen te vragen. Wie erbij mag bepaalt het NetworkPolicy naast de relay, en dat is alleen
# de relay zelf.
#
# WEL STARTTLS, en dat MOET, want anders komt er niets aan. Dit was eerst een sink zonder
# TLS, met de gedachte dat dat meteen de openstaande vraag uit de configmap van de relay
# zou beantwoorden: valt Stalwart terug op platte tekst als STARTTLS ontbreekt? Gemeten op
# 19 augustus 2026: nee. Hij weigert permanent met "STARTTLS was not advertised by host" en
# bouncet het bericht. `[remote.upstream.tls]` is dus een garantie en geen voorkeur - zie
# docs/ron-koppeling.md - en een sink zonder TLS maakt de sandbox stuk op precies het punt
# waarvoor hij bestaat.
#
# Het certificaat wordt bij elke start gemaakt in plaats van bewaard. Een zelfondertekend
# certificaat van een wegwerp-sink heeft geen enkele waarde om te beschermen, en het is
# beter dan een sleutel in de repository: er valt niets te roteren en niets te lekken.
# Stalwart vertrouwt het niet (hij gaat af op zijn ingebouwde webpki-roots en leest de
# trust store van het besturingssysteem niet), en daarom moet wie deze sink inlaadt ook
# MAIL_UPSTREAM_ALLOW_INVALID_CERTS omzetten. Laad deze map daarom niet rechtstreeks in
# maar via ../as-upstream: die component levert de sink en die schakelaar samen. Dat is ook
# precies waarom de sink verder niets hoeft te bewijzen: hij moet STARTTLS AANBIEDEN, niet
# vertrouwd worden.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rig-mail-sink
  namespace: rig-ron
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rig-mail-sink
  template:
    metadata:
      labels:
        app: rig-mail-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Het image van de relay, puur omdat daar openssl in zit en het op dit cluster
        # toch al binnengehaald is. Scheelt een tweede image voor drie regels shell.
        - name: maak-certificaat
          image: stalwartlabs/mail-server:v0.11.8
          command:
            - /usr/bin/openssl
            - req
            - -x509
            - -newkey
            - rsa:2048
            - -nodes
            - -keyout
            - /tls/tls.key
            - -out
            - /tls/tls.crt
            - -days
            - "3650"
            - -subj
            - /CN=rig-mail-sink.rig-ron.svc.cluster.local
            - -addext
            - subjectAltName=DNS:rig-mail-sink.rig-ron.svc.cluster.local,DNS:rig-mail-sink.rig-ron.svc,DNS:rig-mail-sink
          volumeMounts:
            - name: tls
              mountPath: /tls
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: "64Mi"
            limits:
              cpu: 200m
              memory: 128Mi
              ephemeral-storage: "128Mi"
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.30.7
          env:
            # Geen MP_DATABASE, dus alles blijft in het geheugen. Een sink hoort niets te
            # bewaren: een herstart is de manier om schoon te beginnen, en er is geen PVC
            # nodig die met readOnlyRootFilesystem zou botsen. Wel schrijft Mailpit een
            # tijdelijke sqlite-klad in /tmp (gemeten 19 augustus 2026: "open
            # /tmp/mailpit-<n>.db: read-only file system"), dus /tmp is een emptyDir.
            - name: MP_SMTP_BIND_ADDR
              value: "[::]:1025"
            - name: MP_UI_BIND_ADDR
              value: "[::]:8025"
            # Hiermee komt STARTTLS in de EHLO-lijst. Zonder deze twee weigert de relay
            # permanent; zie de toelichting bovenaan dit bestand.
            - name: MP_SMTP_TLS_CERT
              value: /tls/tls.crt
            - name: MP_SMTP_TLS_KEY
              value: /tls/tls.key
          ports:
            - containerPort: 1025
              name: smtp
            - containerPort: 8025
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: "128Mi"
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: "256Mi"
          livenessProbe:
            tcpSocket:
              port: 1025
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 1025
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # Het certificaat leeft alleen zolang de pod leeft; de initContainer maakt het.
        - name: tls
          emptyDir: {}
