apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prometheus
  namespace: rig-system
spec:
  ingressClassName: nginx
  rules:
    - host: prometheus.sandbox.rijksapp.dev
      http:
        paths:
          - backend:
              service:
                name: prometheus
                port:
                  number: 9090
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - prometheus.sandbox.rijksapp.dev
      secretName: sandbox-wildcard-tls
