apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  # Minimal ODCN config: static targets only, no Kubernetes API access needed.
  # When kubernetes_sd_configs is needed later, add KUBERNETES_SERVICE_HOST env var
  # to the Prometheus deployment pointing to Capsule Proxy:
  #   cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
  # (same as external-dns and operations-manager)
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      # Scrape Prometheus itself
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Scrape Operations Manager (OPI) process + custom metrics
      - job_name: 'operations-manager'
        static_configs:
          - targets: ['operations-manager:8000']
        metrics_path: /metrics
