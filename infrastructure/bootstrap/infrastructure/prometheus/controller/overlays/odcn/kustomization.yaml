apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rig-prd-operations

resources:
  - ../../base
  - ingress.yaml
  # Prometheus RBAC (namespace-scoped) for kubernetes_sd_configs
  - role.yaml
  - rolebinding.yaml
  # kube-state-metrics RBAC - disabled until we need full cluster metrics
  # - kube-state-metrics-role.yaml
  # - kube-state-metrics-rolebinding.yaml

patches:
  # Override configmap with Capsule Proxy-based kubernetes_sd_configs
  - target:
      kind: ConfigMap
      name: prometheus-config
    path: configmap-patch.yaml
  # Point Prometheus at Capsule Proxy for tenant-scoped Kubernetes API access
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
        - name: KUBERNETES_SERVICE_HOST
          value: cluster-api.apps.prd1.gn2.quattro.rijksapps.nl
  # Scale down kube-state-metrics (not needed in tenant cluster)
  - target:
      kind: Deployment
      name: kube-state-metrics
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  # Pods draaien op serviceaccount namespace-manager; de pull-secrets hangen alleen aan
  # default. Zonder dit blok faalt de pull na een herstart (rewrite naar de rcr-proxy
  # vraagt authenticatie).
  - target:
      kind: Deployment
      name: prometheus
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: dockerhub-rig-robot-pull-secret

# ODCN kan de upstream-registries niet bereiken en haalt alles via de rcr-proxy. Staat dat
# pad hier niet in git, dan herschrijft admission het image wel, maar wijkt wat er draait af
# van git en ziet ArgoCD dat als eeuwige drift. De tag komt uit de basis.
images:
  - name: registry.k8s.io/kube-state-metrics/kube-state-metrics
    newName: rcr.rijksapps.nl/k8s-rig/kube-state-metrics/kube-state-metrics
  - name: prom/prometheus
    newName: rcr.rijksapps.nl/dockerhub-rig/prom/prometheus
