apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
  - ../../base

# Zelfde als bij redis: geen storageClassName in de base, en de default deugt hier niet.
patches:
  - target:
      kind: PersistentVolumeClaim
      name: prometheus-storage
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
