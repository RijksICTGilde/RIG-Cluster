apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rig-mail-sink
  namespace: rig-ron
spec:
  parentRefs:
    - name: rig-gateway
      namespace: rig-gateway
      sectionName: https
  hostnames:
    - mailsink.sandbox.rijksapp.dev
  rules:
    - backendRefs:
        - name: rig-mail-sink
          port: 8025
      timeouts:
        request: "0s"
