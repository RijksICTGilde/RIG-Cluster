apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# De gateway-stand van de mailsink. Eigen component en niet samen met ../gateway: de
# mail-overlay rendert onder een eigen ArgoCD Application met destination rig-ron, en de
# CMP-plugin forceert daar namespace rig-ron. Een HTTPRoute voor de sink kan dus niet in de
# clusterbuild van rig-system meeliften.
resources:
- httproute-mailsink.yaml

patches:
- patch: |-
    $patch: delete
    apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: rig-mail-sink
      namespace: rig-ron
