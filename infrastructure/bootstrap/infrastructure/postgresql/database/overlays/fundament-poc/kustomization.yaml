apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
  - ../../base

# De base zet storageClass: standard, en die bestaat hier niet. De default van dit
# cluster (csi-lvm) kan niets provisionen, dus laten staan is geen optie: dan blijft
# de PVC eeuwig Pending. Zie docs/fundament-cluster-checklist.md paragraaf 3.0.
patches:
  - target:
      kind: Cluster
      name: rig-db
    patch: |-
      - op: replace
        path: /spec/storage/storageClass
        value: local-path
      - op: replace
        path: /spec/storage/size
        value: 20Gi
