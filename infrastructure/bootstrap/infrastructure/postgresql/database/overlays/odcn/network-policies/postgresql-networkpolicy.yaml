# podSelector + policyTypes: [Ingress, Egress] maakt postgres-pods automatisch
# deny-by-default; alleen verkeer dat hieronder expliciet allowed wordt komt door.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-access
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: rig-db
  policyTypes: [Ingress, Egress]
  ingress:
    # Platform namespace (OPI, Keycloak, co-located workloads).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
      ports:
        - protocol: TCP
          port: 5432
    # Tenant namespaces (OPI-generated, carry created-by label).
    - from:
        - namespaceSelector:
            matchLabels:
              created-by: operations-manager
      ports:
        - protocol: TCP
          port: 5432
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Intra-namespace replication / WAL streaming.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rig-prd-operations
    # Off-cluster backup target (HTTPS S3). Narrow when target is known.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-monitoring
  namespace: rig-prd-operations
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: rig-db
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9187
