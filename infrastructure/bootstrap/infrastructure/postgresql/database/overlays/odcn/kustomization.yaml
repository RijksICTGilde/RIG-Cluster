apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rig-system
resources:
- ../../base
- network-policies/postgresql-networkpolicy.yaml

patches:
  - target:
      kind: Cluster
      name: rig-db
    patch: |-
      - op: replace
        path: /spec/storage/storageClass
        value: ocs-storagecluster-ceph-rbd
      - op: replace
        path: /spec/storage/size
        value: 20Gi
      - op: add
        path: /spec/storage/resizeInUseVolumes
        value: true
      - op: add
        path: /spec/enablePDB
        value: false
      # Production is a shared multi-tenant instance (Keycloak, Forgejo, OPI +
      # all project/PR databases). The 512Mi/500m base default is a dev value;
      # under load (many concurrent project/PR connections + high log volume)
      # the CNPG instance-manager health endpoint starves and the primary gets
      # liveness-killed, taking the whole platform DB down on every restart.
      # Give production real headroom.
      - op: replace
        path: /spec/resources/limits/memory
        value: 4Gi
      - op: replace
        path: /spec/resources/limits/cpu
        value: "2"
      - op: replace
        path: /spec/resources/requests/memory
        value: 1Gi
      - op: replace
        path: /spec/resources/requests/cpu
        value: 250m
      # Ademruimte, geen noodgreep: op 1 september zat productie op 77 verbindingen
      # met een piek van 121 in 24 uur, dus de 250 kneep nog niet. Wel liep een
      # project vast op zijn eigen rollimiet, en dat gesprek gaat de komende tijd
      # vaker over meer verbindingen per project.
      #
      # max_connections staat in base op 250 en dat blijft zo: base draait op Kind
      # met 512Mi, waar 500 verbindingen onzin zijn. Alleen productie gaat omhoog,
      # net als bij de resources hierboven.
      #
      # Het geheugen moet mee, maar bescheidener dan het plafond suggereert.
      # Gemeten kost een verbinding ongeveer 5 tot 6,5Mi. Bij de realistische
      # belasting van vandaag (piek 121) zit je met 1Gi shared_buffers rond de
      # 2Gi; de 4Gi is ruimte voor groei, niet een verwachting. Requests gaan naar
      # 1Gi en niet hoger: requests worden echt op de node gereserveerd, en het
      # werkelijke verbruik is 753Mi.
      #
      # shared_buffers stond op de PostgreSQL-standaard van 128Mi en was nooit op
      # deze container afgestemd. Dat is te weinig gebleken: de trefkans van de
      # cache is 78,6% over alles, en regel_k4c_regelrecht haalt 31,3% op een
      # database van 81 MB. Die past ruim tien keer in het geheugen, maar wordt
      # steeds verdrongen door de tachtig andere databases.
      #
      # 1Gi komt van twee kanten op hetzelfde uit: alle databases samen zijn
      # 1113 MB, dus je cachet er praktisch alles mee, en het is de gebruikelijke
      # 25% van de 4Gi hierboven.
      #
      # LET OP: max_connections en shared_buffers zijn allebei postmaster-
      # parameters, dus dit vraagt een herstart. Met instances: 1 is dat downtime
      # voor Keycloak, Forgejo, de mailrelay en elke projectdatabase tegelijk. Rol
      # dit uit op een gepland moment, niet terloops.
      - op: replace
        path: /spec/postgresql/parameters/max_connections
        value: "500"
      - op: add
        path: /spec/postgresql/parameters/shared_buffers
        value: 1GB
