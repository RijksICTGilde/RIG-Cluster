apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rig-db
  namespace: rig-system
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true

  # Shutdown timeouts: wait 30s for clients to disconnect, then force-kill
  smartShutdownTimeout: 30
  stopDelay: 60

  # Add Prometheus scrape annotations to all CNPG pods
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"

  # Use custom superuser password instead of auto-generated
  superuserSecret:
    name: postgres-admin-credentials

  # Using existing storage class provided by the cluster
  # NOTE: This is a development default. ODCN production overrides this to 20Gi
  # via the ODCN overlay. Do not manually change this to 20Gi here.
  storage:
    size: 1Gi
    storageClass: standard

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "250"
      reserved_connections: "10"

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Bootstrap initial database
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-admin-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        createdb: true
        connectionLimit: 20
        inRoles:
          - pg_use_reserved_connections
        passwordSecret:
          name: keycloak-db-credentials  # This must exist

      - name: forgejo
        ensure: present
        login: true
        createdb: true
        connectionLimit: 10
        inRoles:
          - pg_use_reserved_connections
        passwordSecret:
          name: forgejo-db-credentials  # This must exist

  # Enable backups if the cluster provides S3-compatible storage
  # backup:
  #   barmanObjectStore:
  #     endpointURL: https://s3-endpoint.example.com
  #     s3Credentials:
  #       accessKeyId:
  #         name: s3-backup-credentials
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: s3-backup-credentials
  #         key: ACCESS_SECRET_KEY
  #     destinationPath: s3://rig-backups/rig-db
  #     wal:
  #       compression: gzip
  #       maxParallel: 2

  monitoring:
    enablePodMonitor: false
    # PodMonitor is managed as a separate resource (see podmonitor.yaml)
    # enablePodMonitor is deprecated in CNPG v1.27+
