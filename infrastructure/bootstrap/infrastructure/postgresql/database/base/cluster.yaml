apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: rig-db
  namespace: rig-system
  annotations:
    # NIET automatisch prunen: dit IS het platform. Verwijdering van deze resource laat
    # CNPG de instanties en hun PVC's opruimen - alle databases (Keycloak, Forgejo, OPI
    # en elk project) in een klap. Verdwijnt hij uit de gerenderde manifests door een
    # kapotte kustomization, dan laat ArgoCD hem staan en toont OutOfSync; weghalen
    # blijft mogelijk maar wordt een bewuste handeling van een mens.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true

  # Shutdown timeouts: wait 30s for clients to disconnect, then force-kill
  smartShutdownTimeout: 30
  stopDelay: 60

  # Add Prometheus scrape annotations to all CNPG pods
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"
      prometheus.io/path: "/metrics"

  # Use custom superuser password instead of auto-generated
  superuserSecret:
    name: postgres-admin-credentials

  # Using existing storage class provided by the cluster
  # NOTE: This is a development default. ODCN production overrides this to 20Gi
  # via the ODCN overlay. Do not manually change this to 20Gi here.
  storage:
    size: 1Gi
    storageClass: standard

  # PostgreSQL configuration
  postgresql:
    parameters:
      max_connections: "250"
      reserved_connections: "10"

  # Resource limits
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

  # Bootstrap initial database
  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: postgres-admin-credentials
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  managed:
    roles:
      - name: keycloak
        ensure: present
        login: true
        createdb: true
        connectionLimit: 20
        inRoles:
          - pg_use_reserved_connections
        passwordSecret:
          name: keycloak-db-credentials  # This must exist

      - name: forgejo
        ensure: present
        login: true
        createdb: true
        connectionLimit: 10
        inRoles:
          - pg_use_reserved_connections
        passwordSecret:
          name: forgejo-db-credentials  # This must exist

      # De mailrelay (Stalwart, rig-ron / rig-prd-ron) bewaart zijn accounts en zijn
      # wachtrij hier en niet op een PVC. Rol en database komen declaratief mee (zie ook
      # databases.yaml), zodat ze op een al draaiend cluster verschijnen zonder handmatige
      # CREATE DATABASE.
      # Limiet 20 en niet krapper: de relay pint zijn pool op 8 (zie de configmap van de
      # mailcomponent), en bij een podwissel draaien er even TWEE pods met elk zo'n pool.
      - name: mailrelay
        ensure: present
        login: true
        connectionLimit: 20
        passwordSecret:
          name: mail-db-credentials  # This must exist

  # Enable backups if the cluster provides S3-compatible storage
  # backup:
  #   barmanObjectStore:
  #     endpointURL: https://s3-endpoint.example.com
  #     s3Credentials:
  #       accessKeyId:
  #         name: s3-backup-credentials
  #         key: ACCESS_KEY_ID
  #       secretAccessKey:
  #         name: s3-backup-credentials
  #         key: ACCESS_SECRET_KEY
  #     destinationPath: s3://rig-backups/rig-db
  #     wal:
  #       compression: gzip
  #       maxParallel: 2

  monitoring:
    # Uit: dit platform draait geen prometheus-operator, dus een PodMonitor wordt door
    # niemand gelezen. Prometheus scrapet rig-db via de job 'cloudnative-pg' in
    # infrastructure/bootstrap/infrastructure/prometheus/controller/base/configmap.yaml.
    enablePodMonitor: false
