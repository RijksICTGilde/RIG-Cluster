---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: forgejo
  owner: forgejo

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: keycloak
  owner: keycloak

---
# De opslag van de mailrelay (Stalwart): accounts en wachtrij, geen PVC. De rol staat in
# cluster.yaml onder managed.roles, met zijn wachtwoord in mail-db-credentials.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mailrelay-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: mailrelay
  owner: mailrelay

---
# OPI connects as the postgres admin user (DATABASE_ADMIN_NAME=postgres),
# so the application database is owned by postgres. Pre-created here so the
# operations-manager entrypoint's `alembic upgrade head` doesn't crash on a
# fresh cluster (it would otherwise fail before OPI's own ensure-DB code runs).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: operations-manager-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: operations_manager
  owner: postgres

