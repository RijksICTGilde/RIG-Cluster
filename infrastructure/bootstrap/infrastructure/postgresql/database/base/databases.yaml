---
# De opslag van de mailrelay (Stalwart): accounts en wachtrij, geen PVC. De rol staat in
# cluster.yaml onder managed.roles, met zijn wachtwoord in mail-db-credentials.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mailrelay-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: mailrelay
  owner: mailrelay

---
# OPI opent zijn eigen database met de rol operations_manager (DATABASE_APP_USER), niet
# met de superuser, dus die rol is ook de eigenaar (RC-410). De rol zelf staat als managed
# role in cluster.yaml. Hier voorgemaakt zodat `alembic upgrade head` in de entrypoint van
# operations-manager niet omvalt op een vers cluster, voordat OPI's eigen ensure-DB draait.
# Een bestaande database verhuist mee: de operator past een gewijzigde owner toe met
# ALTER DATABASE, en de objecten erin gaan met opi/core/app_database_owner.py.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: operations-manager-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: operations_manager
  owner: operations_manager

