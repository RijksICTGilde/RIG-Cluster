---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: forgejo-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
    name: rig-db
  name: forgejo
  owner: forgejo

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak-db
  annotations:
    # Niet automatisch prunen; zie de toelichting op het Cluster in cluster.yaml.
    argocd.argoproj.io/sync-options: Prune=false
  namespace: rig-system
spec:
  cluster:
