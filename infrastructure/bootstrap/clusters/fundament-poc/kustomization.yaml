apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# App-of-apps voor fundament-poc.
#
# Deze map bevatte eerder een platte lijst kustomize-paden, die de root-Application in
# een keer renderde. Daarmee was er geen plek om volgorde uit te drukken, en dat is nodig
# zodra operators meedoen: een CRD moet geregistreerd zijn voordat een custom resource
# die hem gebruikt aangeboden wordt.
#
# Nu is elke component een eigen Application met een sync-wave. ArgoCD verwerkt waves op
# volgorde en wacht tot de resources van een wave gezond zijn. Dat geeft het gedrag van
# Flux' dependsOn, alleen uitgedrukt als een getal in plaats van een verwijzing. Als de
# volgorde ooit te complex wordt voor getallen is ApplicationSet RollingSync het
# alternatief; dat kost wel de autosync op de gegenereerde Applications.
#
# Waves:
#   -1  operators: leveren CRD's, de ingressklasse en de StorageClass
#    0  secrets: de rest leest deze
#    1  opslag en databases: vragen PVC's en de CNPG-CRD
#    2  diensten die op een database of op minio wachten
#    3  configuratie die op een draaiende dienst wacht
#    4  de operations-manager zelf, die op alles hierboven wacht
#
# Op ODCN staat deze map er bewust anders uit te zien: daar praat ArgoCD via de
# Capsule-proxy en is hij tenant-scoped, dus hij mag geen CRD's of cluster-brede RBAC
# aanmaken. De operators worden daar buiten GitOps geinstalleerd. Zie
# plans/operators-via-argo-in-plaats-van-taken.md.
resources:
  - applications/-1-cert-manager.yaml
  - applications/-1-cloudnative-pg.yaml
  - applications/-1-ingress-nginx.yaml
  - applications/-1-storage.yaml
  - applications/0-secrets.yaml
  - applications/1-postgresql.yaml
  - applications/1-redis.yaml
  - applications/1-minio.yaml
  - applications/2-keycloak.yaml
  - applications/2-prometheus.yaml
  - applications/2-forgejo.yaml
  - applications/3-external-dns.yaml
  - applications/4-operations-manager.yaml

# external-dns beheert de fundament-poc.rijksapp.dev-subzone bij TransIP met een eigen
# txt-owner-id; zonder dat zou hij de records van de ODCN-instantie opruimen. Zie de
# waarschuwing in de overlay van de component.
#
# Forgejo levert de drie datarepo's (zad-projects, zad-argo-user-applications,
# zad-deployments) lokaal op dit cluster. De operations-manager wijst nog naar GitHub;
# omschakelen is een configmap-wijziging plus repo-credentials in ArgoCD.

# De branch staat hier op een plaats in plaats van in twaalf bestanden. Op fundament-poc
# lezen we van de branch `fundament` en niet van `main`: dat is de upstream waar dit werk
# heen gaat. Verhuist het naar main, dan is dit de enige regel die verandert.
patches:
  - target:
      kind: Application
    patch: |-
      - op: replace
        path: /spec/source/targetRevision
        value: fundament
