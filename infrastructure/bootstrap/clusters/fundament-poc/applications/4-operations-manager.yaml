apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fundament-poc-operations-manager
  namespace: rig-system
  annotations:
    # Wave 4: na keycloak (2) en zijn configuratie (3), en dus ruim na de operators die
    # zijn Issuer, PVC en Ingress mogelijk maken.
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: rig-platform
  source:
    repoURL: https://infrastructure@github.com/RijksICTGilde/RIG-Cluster.git
    path: bootstrap/rig-system/kustomize/operations-manager/overlays/fundament-poc
    targetRevision: main
    plugin:
      name: kustomize-sops-v1.0
      env:
        - name: SOPS_KEY_SECRET
          value: "sops-age-key"
        - name: KUSTOMIZE_FOLDERS
          value: "current"
  destination:
    server: https://kubernetes.default.svc
    namespace: rig-system
  syncPolicy:
    automated:
      allowEmpty: false
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 5
      backoff:
        duration: "30s"
        factor: 2
        maxDuration: "5m"
