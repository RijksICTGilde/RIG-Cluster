apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server
  namespace: rig-system
spec:
  parentRefs:
    - name: rig-gateway
      namespace: rig-gateway
      sectionName: https
  hostnames:
    - argo.sandbox.rijksapp.dev
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
      # Dezelfde HSTS-header die ingress-nginx in de andere stand zelf stuurt; de
      # Gateway API kent er geen instelling voor (features/gateway-api-routing.md).
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      timeouts:
        request: "0s"
