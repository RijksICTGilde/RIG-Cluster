apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rig-mail-sink
  namespace: rig-ron
spec:
  parentRefs:
    - name: rig-gateway
      namespace: rig-gateway
      sectionName: https
  hostnames:
    - mailsink.sandbox.rijksapp.dev
  rules:
    - backendRefs:
        - name: rig-mail-sink
          port: 8025
      # Dezelfde HSTS-header die ingress-nginx in de andere stand zelf stuurt; de
      # Gateway API kent er geen instelling voor (features/gateway-api-routing.md).
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      timeouts:
        request: "0s"
