apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rig-registry
  namespace: rig-system
spec:
  parentRefs:
    - name: rig-gateway
      namespace: rig-gateway
      sectionName: https
  hostnames:
    - registry.sandbox.rijksapp.dev
  rules:
    - backendRefs:
        - name: rig-registry
          port: 5000
      # Dezelfde HSTS-header die ingress-nginx in de andere stand zelf stuurt; de
      # Gateway API kent er geen instelling voor (features/gateway-api-routing.md).
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: max-age=31536000; includeSubDomains
      # Envoy kapt een verzoek zonder waarde na 15 s af; de idle-timeout staat op de
      # BackendTrafficPolicy bij de Gateway.
      timeouts:
        request: "0s"
