# Alles wat op poort 80 binnenkomt naar https, voor elke hostname. Zonder deze route
# antwoordt de listener http met een 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: rig-gateway
spec:
  parentRefs:
    - name: rig-gateway
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
