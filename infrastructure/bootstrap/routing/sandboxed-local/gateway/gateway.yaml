apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: rig-gateway
  namespace: rig-gateway
spec:
  gatewayClassName: rig-gateway
  # De ListenerSets die OPI per projectnamespace neerzet mogen hieraan hangen; andere
  # namespaces niet.
  allowedListeners:
    namespaces:
      from: Selector
      selector:
        matchLabels:
          created-by: operations-manager
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      port: 443
      protocol: HTTPS
      hostname: "*.sandbox.rijksapp.dev"
      tls:
        mode: Terminate
        # Het wildcard-certificaat staat in rig-system (task sandbox:import-wildcard-cert);
        # de ReferenceGrant daar staat deze verwijzing toe.
        certificateRefs:
          - group: ""
            kind: Secret
            name: sandbox-wildcard-tls
            namespace: rig-system
      allowedRoutes:
        namespaces:
          from: All
