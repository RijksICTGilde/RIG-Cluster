apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: operations-manager-sync

build:
  tagPolicy:
    customTemplate:
      template: "latest"
  local:
    useBuildkit: true
  artifacts:
  - image: ghcr.io/minbzk/base-images/operations-manager/operations-manager
    context: .
    docker:
      dockerfile: operations-manager/Dockerfile
      buildArgs:
        BUILDKIT_INLINE_CACHE: "1"
    sync:
      manual:
      - src: 'operations-manager/python/opi/**/*.py'
        dest: /app/opi
        strip: 'operations-manager/python/opi/'
      # Live-synced version metadata (see `task version:generate` / `version:watch`)
      # so /version and the footer reflect the running commit/branch/dirty state.
      - src: 'operations-manager/python/opi/version.json'
        dest: /app/opi
        strip: 'operations-manager/python/opi/'
      - src: 'operations-manager/python/opi/templates_lotc/**/*'
        dest: /app/opi/templates_lotc
        strip: 'operations-manager/python/opi/templates_lotc/'
      - src: 'operations-manager/python/manifests/**/*.jinja'
        dest: /app/manifests
        strip: 'operations-manager/python/manifests/'
      - src: 'operations-manager/python/static/**/*'
        dest: /app/static
        strip: 'operations-manager/python/static/'

deploy:
  # VASTGEPIND op het kind-cluster, en niet alleen op de commandoregel van de taak.
  # Zonder dit volgt skaffold de ACTIEVE kubectl-context, en die staat hier geregeld op
  # productie; dan gaan de sync en de deploy daarheen terwijl je naar de sandbox zit te
  # kijken en je wijzigingen nergens aankomen. De taak geeft --kube-context al mee, maar
  # dat helpt niet als dit bestand vanuit de IDE of met een kale `skaffold dev -f` wordt
  # gestart. Hier hoort het, want het is een eigenschap van deze configuratie.
  kubeContext: kind-rig-sandbox
  statusCheckDeadlineSeconds: 0
  kustomize:
    flags:
      apply:
      - --force-conflicts
      - --server-side=true
    buildArgs:
    - --enable-alpha-plugins
    - --enable-exec
    - --load-restrictor=LoadRestrictionsNone
    paths:
    - bootstrap/rig-system/kustomize/operations-manager/overlays/sandboxed-local-dev

portForward:
- resourceType: service
  resourceName: operations-manager
  namespace: rig-system
  port: 8000
  localPort: 9595
- resourceType: service
  resourceName: operations-manager
  namespace: rig-system
  port: 5678
  localPort: 5678
