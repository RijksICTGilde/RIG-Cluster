apiVersion: skaffold/v2beta29
kind: Config
metadata:
  name: operations-manager-sync

build:
  tagPolicy:
    customTemplate:
      template: "latest"
  local:
    useBuildkit: true
  artifacts:
  - image: operations-manager
    context: .
    docker:
      dockerfile: operations-manager/Dockerfile
      buildArgs:
        BUILDKIT_INLINE_CACHE: "1"
    sync:
      manual:
      - src: 'operations-manager/python/opi/**/*.py'
        dest: /app/opi
        strip: 'operations-manager/python/opi/'
      - src: 'operations-manager/python/opi/templates_lotc/**/*'
        dest: /app/opi/templates_lotc
        strip: 'operations-manager/python/opi/templates_lotc/'
      - src: 'operations-manager/python/manifests/**/*.jinja'
        dest: /app/manifests
        strip: 'operations-manager/python/manifests/'
      - src: 'operations-manager/python/static/**/*'
        dest: /app/static
        strip: 'operations-manager/python/static/'

deploy:
  # VASTGEPIND op het kind-cluster, net als in skaffold-sandboxed-local.yaml. Zonder
  # dit volgt skaffold de ACTIEVE kubectl-context, en die staat hier geregeld op
  # productie. De taak geeft --kube-context al mee, maar dat helpt niet als dit bestand
  # vanuit de IDE of met een kale `skaffold dev -f` wordt gestart.
  #
  # Let op: het cluster `gitops-fluxcd` bestaat niet meer, alleen zijn kubeconfig-context
  # staat er nog. Deze pin laat dit bestand daarom falen op een onbereikbaar cluster in
  # plaats van ergens anders te landen. Dat is de bedoeling zolang deze local-opstelling
  # niet opgeruimd is.
  kubeContext: kind-gitops-fluxcd
  statusCheckDeadlineSeconds: 0
  kustomize:
    # Net als kubeContext hierboven: zonder dit neemt skaffold de namespace van de
    # ACTIEVE kubectl-context, en die staat hier geregeld op een productienamespace.
    defaultNamespace: rig-system
    flags:
      apply:
      - --force-conflicts
      - --server-side=true
    buildArgs:
    - --enable-alpha-plugins
    - --enable-exec
    - --load-restrictor=LoadRestrictionsNone
    paths:
    - bootstrap/rig-system/kustomize/operations-manager/overlays/local

portForward:
- resourceType: service
  resourceName: operations-manager
  namespace: rig-system
  port: 8000
  localPort: 9595
- resourceType: service
  resourceName: operations-manager
  namespace: rig-system
  port: 5678
  localPort: 5678
