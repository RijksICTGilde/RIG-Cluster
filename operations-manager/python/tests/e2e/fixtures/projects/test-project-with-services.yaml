  api-key: test-api-key-services-67890

services:
  - keycloak
  # postgresql-database en niet postgresql: dat laatste is geen ServiceType, en de
  # detailpagina viel er met een 500 op om (ValueError uit de enum).
  - postgresql-database

components:
  - name: backend
    publish-on-web: true
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443, 5432]
    uses-services:
      - keycloak
      - postgresql-database

deployments:
  - name: default
    cluster: local
    namespace: test-project-services
    repository: main-repo
    components:
      - reference: backend
        image: "python:3.14-slim"
