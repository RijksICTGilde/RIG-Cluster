name: test-project-services
description: "Test project with services for E2E UI testing"

clusters:
  - local

users:
  - email: test@example.com
    role: admin
  - email: developer@example.com
    role: developer

config:
  # Het AGE-sleutelpaar hoort bij ELK project: opi/web/router.py leest
  # config['age-private-key'] om de deploymentconfiguratie te ontsleutelen. Zonder die
  # sleutels geeft /projects/<naam>/details een KeyError en dus een 500 - en dat viel
  # nergens op, want geen enkele test opende de detailpagina van deze twee fixtures.
  # tests/e2e/test_lotc_links.py doet dat nu wel, via de links op /projects.
  # Overschreven per run door _munt_projectsleutelpaar in tests/e2e/testserver.py
  age-public-key: "wordt-per-run-gemunt"
  age-private-key: "wordt-per-run-gemunt"
  api-key: test-api-key-services-67890

services:
  # MET realms, en dat is de reden dat ze hier staan: het Keycloak-blok op het tabblad
  # Toegang rendert alleen als de dienst realms heeft (RC-101). Zonder deze gegevens heeft
  # geen enkele fixture zo'n blok, en dan is er niets te meten aan het tabblad dat ze
  # draagt - het andere testproject (test-project-detail) heeft ze met opzet NIET, zodat
  # daar het lege geval gemeten wordt.
  - keycloak:
      config:
        realms:
          - realm: test-project-services-local
            host: https://keycloak.voorbeeld.nl
            username: test_project_services_admin
            password: VOORBEELDWAARDE-geen-echt-geheim
            # De seed met het voorvoegsel ``plain:``, zodat hij zonder AGE-sleutel te
            # lezen is. Hij staat er om te kunnen METEN dat de pagina de CODE rendert en
            # de SEED niet: de test rekent met dezelfde seed de code van dit moment uit en
            # zoekt allebei terug in de HTML. Dit is de RFC 6238-voorbeeldseed.
            totp_secret: plain:12345678901234567890
  # postgresql-database en niet postgresql: dat laatste is geen ServiceType, en de
  # detailpagina viel er met een 500 op om (ValueError uit de enum).
  - postgresql-database

components:
  - name: backend
    publish-on-web: true
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443, 5432]
    uses-services:
      - keycloak
      - postgresql-database

deployments:
  - name: default
    cluster: local
    namespace: test-project-services
    repository: main-repo
    components:
      - reference: backend
        image: "python:3.14-slim"
