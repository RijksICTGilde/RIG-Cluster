  # nergens op, want geen enkele test opende de detailpagina van deze twee fixtures.
  # tests/e2e/test_lotc_links.py doet dat nu wel, via de links op /projects.
  age-public-key: "age1drxwupvn5eg8wd9cdf05nrxp6usrpk7tarc09yzk4c3m7jzzaups8757zy"
  age-private-key: |
    -----BEGIN AGE ENCRYPTED FILE-----
    YWdlLWVuY3J5cHRpb24ub3JnL3YxCi0+IFgyNTUxOSB0ZkhrWGhCVEdIT1B5SFEz
    SVRJSG5zK1RHWFFBTmUvL040RU9LakdqeDE4Cld6c3MwWlJPWDgwYmlETjdEYnFC
    SUN3U3NMdEFYSEhZZG5veHd3U09Dd2MKLS0tIDg3ZDlMNGZNdWo4WEVRcWRpbE4w
