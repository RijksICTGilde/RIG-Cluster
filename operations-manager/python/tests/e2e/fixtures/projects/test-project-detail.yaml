components:
  - name: web-app
    publish-on-web: true
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443]
    # `services` en niet `uses-services`: die laatste is de v1-naam, en de kaart leest de
    # v2-vorm. Met de oude naam bleef het dienstenblok op de componentkaart leeg en was er
    # niets te meten (zie tests/e2e/test_componentkaart_uitklap.py).
    services:
      - keycloak
      - persistent-storage
    resources:
      cpu: "500m"
      memory: "512Mi"
    # Omgevingsvariabelen en aliassen staan hier om DEZELFDE reden als de helm-charts
    # verderop: zonder gegevens rendert de tak niet en is er niets te meten. Sinds de
    # componentkaart die twee ingeklapt toont (ze werden soms honderden regels lang) is er
    # ook gedrag om te meten, en dat doet tests/e2e/test_componentkaart_uitklap.py.
    #
    # Onversleuteld, en dat mag: read_user_env_vars leest een gewoon KEY=value-blok en de
    # aliassendecoder een gewone mapping. Een AGE-blok zou hier alleen de sleutelketen van
    # de testopstelling meten, niet de kaart.
    user-env-vars: |
      LOG_LEVEL=debug
      FEATURE_FLAG=on
    aliases:
      POSTGRES_HOST: $DATABASE_SERVER_HOST

  - name: worker
    type: deployment
    ports:
      outbound: [5432, 443]
    uses-services: []
    resources:
      cpu: "250m"
      memory: "256Mi"

deployments:
  - name: default
    cluster: local
    namespace: test-project-detail
    backup:
      schedule: "FREQ=DAILY;BYHOUR=2;BYMINUTE=0"
    components:
      - reference: web-app
        image: "nginx:latest"
      - reference: worker
        image: "python:3.14-slim"

  # Een tweede deployment, want alles wat het tabblad Deployments per deployment toont,
  # verbergt de tweede en verder bij het laden ({% if not loop.first %}). Met een enkele
  # deployment wordt die tak nooit waar en ziet geen enkele test of het verbergen werkt.
  # Sorteert achter 'default', zodat 'default' de zichtbare blijft.
  - name: tweede
    cluster: local
    # De namespace moet gelijk zijn aan de projectnaam; dat wordt afgedwongen.
    namespace: test-project-detail
    components:
      - reference: web-app
        image: "nginx:latest"

# Helm-charts en helmfile op projectniveau. Ze staan hier omdat de bijbehorende secties
# ANDERS NIET TE METEN ZIJN: zowel de bestaande als de hertekende pagina zetten er
# `{% if project.helm_charts %}` omheen, dus zonder gegevens rendert er aan beide kanten
# niets en zegt een vergelijking niets.
# De veldnamen zijn die van het schema (`helm-chart` en `helmfile-entry` in
# `opi/schemas/project_v2.json`). Ze stonden hier als `repository`/`chart`/`version` en
# `repository`/`branch`, en dat zijn namen die het schema met
# `additionalProperties: false` verbiedt - de pagina las ze, dus toonde ze voor een echt
# projectbestand niets.
helm-charts:
  - name: redis-cache
    source-type: git-clone
    git-url: https://github.com/bitnami/charts.git
    git-ref: "18.1.5"
    chart-path: bitnami/redis
    helm-values:
      architecture: standalone
      auth:
        enabled: true

helmfile:
  - name: monitoring-stack
    url: https://github.com/example/monitoring.git
    ref: main
    path: helmfile.d/monitoring.yaml
    files:
      helmfile.yaml.gotmpl: |
        bases:
          - "helmfile/bases/environment.yaml.gotmpl"
    services:
      - publish-on-web
    helm-values:
      grafana:
        enabled: true
