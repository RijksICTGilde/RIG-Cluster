name: test-project-detail
display-name: "Detail Test Project"
description: "Uitgebreid testproject voor de detailpagina E2E tests"

clusters:
  - local

users:
  - email: test@example.com
    role: admin
  - email: developer@example.com
    role: developer

services:
  - publish-on-web
  # De realm-adminverbinding die OPI zelf schrijft. Hij staat hier omdat de twee geheimen
  # erop uit de wizardsessie worden geredigeerd en bij het opslaan terug moeten komen: zonder
  # realms in dit bestand liep die weg in geen enkele test. `totp_secret` is de optionele van
  # de twee, en dus degene die stil zou verdwijnen.
  - name: keycloak
    config:
      template: sso-only
      realms:
