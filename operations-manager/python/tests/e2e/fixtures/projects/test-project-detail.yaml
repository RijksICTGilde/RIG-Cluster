components:
  - name: web-app
    publish-on-web: true
    type: deployment
    ports:
      inbound: [8080]
      outbound: [443]
    uses-services:
      - keycloak
      - persistent-storage
    resources:
      cpu: "500m"
      memory: "512Mi"

  - name: worker
    type: deployment
    ports:
      outbound: [5432, 443]
    uses-services: []
    resources:
      cpu: "250m"
      memory: "256Mi"

deployments:
  - name: default
    cluster: local
    namespace: test-project-detail
    backup:
      schedule: "FREQ=DAILY;BYHOUR=2;BYMINUTE=0"
    components:
      - reference: web-app
        image: "nginx:latest"
      - reference: worker
        image: "python:3.13-slim"
