apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: "productie-own-listeners"
  namespace: "rig-golden-passthrough"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: "rig-gateway"
    namespace: "rig-gateway"
  listeners:
    - name: "app-voorbeeld-nl"
      hostname: "app.voorbeeld.nl"
      protocol: TLS
      port: 443
      tls:
        mode: Passthrough
