apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: "productie-own-listeners"
  namespace: "rig-golden-provided"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: "rig-gateway"
    namespace: "rig-gateway"
  listeners:
    - name: "app-voorbeeld-nl"
      hostname: "app.voorbeeld.nl"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "productie-web-provided-tls"
