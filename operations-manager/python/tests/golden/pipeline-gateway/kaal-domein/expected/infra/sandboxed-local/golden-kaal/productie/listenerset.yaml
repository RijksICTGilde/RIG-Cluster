apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: "productie-listeners"
  namespace: "rig-golden-kaal"
  annotations:
    cert-manager.io/issuer: "letsencrypt-voorbeeld-nl-productie"
    # Modern key material: ECDSA P-384, fresh key on every renewal (no RSA-2048 default).
    cert-manager.io/private-key-algorithm: ECDSA
    cert-manager.io/private-key-size: "384"
    cert-manager.io/private-key-rotation-policy: Always
    # Hangs the HTTP-01 challenge route on the shared HTTP listener of the Gateway instead
    # of on a listener of this set.
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: "rig-gateway"
    namespace: "rig-gateway"
  listeners:
    - name: "app-voorbeeld-nl"
      hostname: "app.voorbeeld.nl"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "productie-api-tls"
    - name: "voorbeeld-nl"
      hostname: "voorbeeld.nl"
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: "productie-bare-domain-tls"
