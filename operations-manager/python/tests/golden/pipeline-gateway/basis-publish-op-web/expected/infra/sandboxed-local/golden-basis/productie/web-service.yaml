apiVersion: v1
kind: Service
metadata:
  name: "productie-web"
  namespace: "rig-golden-basis"
  labels:
    app: "productie-web"
    project: "golden-basis"
spec:
  selector:
    app: "productie-web"
    component: application
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
