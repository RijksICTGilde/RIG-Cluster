  "APP_DATABASE_SERVER_HOST": "rig-db-rw.rig-db"
  "APP_DATABASE_SERVER": "rig-db-rw.rig-db"
  "DATABASE_SERVER_PORT": "5432"
  "APP_DATABASE_PORT": "5432"
  "APP_DATABASE_SERVER_PORT": "5432"
  "DATABASE_SERVER_USER": "golden_helm_user"
  "APP_DATABASE_USER": "golden_helm_user"
  "DATABASE_PASSWORD": "db-dummy-geheim"
  "APP_DATABASE_PASSWORD": "db-dummy-geheim"
  "DATABASE_SERVER_USER_RO": ""
