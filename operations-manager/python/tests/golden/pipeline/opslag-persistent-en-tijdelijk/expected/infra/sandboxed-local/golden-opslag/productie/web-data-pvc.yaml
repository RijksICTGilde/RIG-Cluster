apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "productie-web-data-pvc"
  namespace: "rig-golden-opslag"
  annotations:
    argocd.argoproj.io/sync-options: Replace=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: csi-hostpath-sc
  resources:
    requests:
      storage: "2Gi"
