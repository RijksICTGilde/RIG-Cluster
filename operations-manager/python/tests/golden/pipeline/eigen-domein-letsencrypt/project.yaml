schema-version: '2.17'
name: golden-domein
display-name: Golden eigen domein
description: Een subdomein op een eigen domein met een Let's Encrypt-issuer

clusters:
  - sandboxed-local

users:
  - email: beheerder@rijksoverheid.nl
    roles: [admin]

services:
  - reference: publish-on-web
    config:
      domains:
        allowed-domains:
          - domain: voorbeeld.nl
            status: approved

repositories:
  - name: main-repo
    url: https://git.example/golden-domein.git
    branch: main
    path: infra

components:
  - name: web
    type: single
    ports:
      inbound: [8080]
      outbound: [443]
    path:
      - match: /
    uses-components: []
    services:
      - publish-on-web

deployments:
  - name: productie
    cluster: sandboxed-local
    namespace: golden-domein
    repository: main-repo
    services:
      - reference: publish-on-web
        config:
          subdomain: app
          base-domain: voorbeeld.nl
          issuer: letsencrypt
    components:
      - reference: web
        image: nginx:1.27
