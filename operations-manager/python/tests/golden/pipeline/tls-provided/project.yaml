schema-version: '2.17'
name: golden-provided
display-name: Golden eigen certificaat
description: De klant levert het certificaat aan, het platform geeft er geen uit

clusters:
  - sandboxed-local

users:
  - email: beheerder@rijksoverheid.nl
    roles: [admin]

services:
  - reference: publish-on-web
    config:
      domains:
        allowed-domains:
          - domain: voorbeeld.nl
            status: approved
  - attachments:
      data:
        - id: eigen-certificaat
          filename: voorbeeld-nl.pem
          # Base64 van een PEM met een certificaat- en een sleutelblok, zoals een bijlage
          # hem bewaart. De inhoud is tekst, geen echt sleutelmateriaal.
          content: ENCRYPT:LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCloyOXNaR1Z1TFdObGNuUnBabWxqWVdGMExYWnZiM0l0WkdVdGRHOWxkSE09Ci0tLS0tRU5EIENFUlRJRklDQVRFLS0tLS0KLS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0tCloyOXNaR1Z1TFhOc1pYVjBaV3d0ZG05dmNpMWtaUzEwYjJWMGN3PT0KLS0tLS1FTkQgUFJJVkFURSBLRVktLS0tLQo=

repositories:
  - name: main-repo
    url: https://git.example/golden-provided.git
    branch: main
    path: infra

components:
  - name: web
    type: single
    ports:
      inbound: [8080]
      outbound: [443]
    path:
      - match: /
    uses-components: []
    services:
      - reference: publish-on-web
        config:
          tls: provided
          attachment: eigen-certificaat

deployments:
  - name: productie
    cluster: sandboxed-local
    namespace: golden-provided
    repository: main-repo
    services:
      - reference: publish-on-web
        config:
          subdomain: app
          base-domain: voorbeeld.nl
    components:
      - reference: web
        image: nginx:1.27
