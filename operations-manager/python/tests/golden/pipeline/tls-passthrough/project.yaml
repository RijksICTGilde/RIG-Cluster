schema-version: '2.17'
name: golden-passthrough
display-name: Golden passthrough
description: Het component biedt zelf TLS aan, de ingress laat het door

clusters:
  - sandboxed-local

users:
  - email: beheerder@rijksoverheid.nl
    roles: [admin]

services:
  - reference: publish-on-web
    config:
      domains:
        allowed-domains:
          - domain: voorbeeld.nl
            status: approved

repositories:
  - name: main-repo
    url: https://git.example/golden-passthrough.git
    branch: main
    path: infra

components:
  - name: web
    type: single
    ports:
      inbound: [8080]
      outbound: [443]
    path:
      - match: /
    uses-components: []
    services:
      - reference: publish-on-web
        config:
          tls: passthrough

deployments:
  - name: productie
    cluster: sandboxed-local
    namespace: golden-passthrough
    repository: main-repo
    services:
      - reference: publish-on-web
        config:
          subdomain: app
          base-domain: voorbeeld.nl
    components:
      - reference: web
        image: nginx:1.27
