apiVersion: v1
kind: Secret
metadata:
  name: "productie-keycloak"
  namespace: "rig-golden-authwall"
  labels:
    app.kubernetes.io/name: "productie-keycloak"
    app.kubernetes.io/component: "keycloak"
    created-by: operations-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Replace ensures ArgoCD does a full kubectl replace instead of 3-way merge,
    # so keys removed/renamed in a later render (e.g. an alias rename) are dropped
    # from the live Secret rather than lingering as stale entries.
    argocd.argoproj.io/sync-options: Replace=true
type: "Opaque"
stringData:
  "OIDC_CLIENT_ID": "productie-web"
  "OIDC_CLIENT_SECRET": "oidc-geheim"
  "OIDC_PUBLIC_CLIENT_ID": "productie-web-public"
  "OIDC_DISCOVERY_URL": "https://keycloak.sandbox.rijksapp.dev/realms/golden-authwall/.well-known/openid-configuration"
  "OIDC_URL": "https://keycloak.sandbox.rijksapp.dev"
  "OIDC_REALM": "golden-authwall"
  "OIDC_HOSTNAME": "keycloak.sandbox.rijksapp.dev"
  "OIDC_ISSUER": "https://keycloak.sandbox.rijksapp.dev/realms/golden-authwall/.well-known/openid-configuration"
