apiVersion: v1
kind: Secret
metadata:
  name: "productie-web-oauth2-cookie"
  namespace: "rig-golden-authwall"
  labels:
    app.kubernetes.io/name: "productie-web-oauth2-cookie"
    app.kubernetes.io/component: "secret"
    created-by: operations-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Replace ensures ArgoCD does a full kubectl replace instead of 3-way merge,
    # so keys removed/renamed in a later render (e.g. an alias rename) are dropped
    # from the live Secret rather than lingering as stale entries.
    argocd.argoproj.io/sync-options: Replace=true
type: "Opaque"
stringData:
  "cookie-secret": "golden-cookie-secret"
