apiVersion: apps/v1
kind: Deployment
metadata:
  name: "productie-web"
  namespace: "rig-golden-authwall"
  labels:
    app: "productie-web"
    deployment: "productie"
    project: "golden-authwall"
    component: application
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 3
  # Cap how long Kubernetes reports a stalled rollout as "Progressing" before
  # flipping it to ProgressDeadlineExceeded (default is 600s). ArgoCD's health
  # gate waits out this window, so a broken rollout (e.g. ImagePullBackOff) would
  # otherwise hang the sync for 10 minutes. 300s leaves room for genuinely slow
  # starts while failing visibly faster.
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: "productie-web"
      component: application
  template:
    metadata:
      labels:
        app: "productie-web"
        deployment: "productie"
        project: "golden-authwall"
        component: application
        network-policy: allow-db-access
    spec:
      # De eigen serviceaccount van het project, zonder pull-secrets; deze pod draagt
      # hieronder alleen wat hij zelf nodig heeft.
      serviceAccountName: "golden-authwall-sa"
      # Pod-level security context (OpenShift compatible)
      securityContext:
        # For Kind clusters, specify numeric UID since no SCC assignment.
        # Per-component overrides via project YAML `components[].security.{run-as-user,run-as-group,fs-group}`;
        # each defaults to 1001 when omitted to preserve historical behaviour.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001  # Required for PVC write access
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "nginx:1.27"
          imagePullPolicy: "Always"
          ports:
            - containerPort: 8080
              name: http
          # Container-level security context (OpenShift compatible)
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            - name: "PUBLIC_HOST"
              value: "https://web-productie-golden-authwall.sandbox.rijksapp.dev"
            - name: "PUBLIC_HOSTNAME"
              value: "web-productie-golden-authwall.sandbox.rijksapp.dev"
          envFrom:
            - secretRef:
                name: "productie-keycloak"
            - secretRef:
                name: "productie-web-platform"
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36  # 5 + (36 × 5) = 185 seconds max startup time
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 3
        - name: authorization-wall
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
          args:
            - --provider=oidc
            - "--oidc-issuer-url=https://keycloak.sandbox.rijksapp.dev/realms/golden-authwall"
            - "--client-id=productie-web"
            - "--upstream=http://localhost:8080"
            - --http-address=0.0.0.0:4180
            - "--redirect-url=https://web-productie-golden-authwall.sandbox.rijksapp.dev/oauth2/callback"
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-samesite=lax
            - --cookie-expire=10h
            - --cookie-refresh=3m
            - --api-route=^/api/
            - --api-route=\.(css|js|mjs|map|json|png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|otf|eot)$
            - --skip-provider-button=false
            - --cookie-csrf-per-request=true
            - --custom-templates-dir=/etc/oauth2-proxy/templates
            # Require a verified email address: reject any token whose email_verified is not true.
            # Explicit (this is oauth2-proxy's default, but the security intent must be visible).
            - --insecure-oidc-allow-unverified-email=false
            - --scope=openid profile email
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: "productie-keycloak"
                  key: OIDC_CLIENT_SECRET
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: "productie-web-oauth2-cookie"
                  key: cookie-secret
          ports:
            - containerPort: 4180
              name: oauth2-proxy
          volumeMounts:
            - name: oauth2-signin-templates
              mountPath: /etc/oauth2-proxy/templates
              readOnly: true
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "50m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /ping
              port: 4180
            initialDelaySeconds: 3
            periodSeconds: 30
      volumes:
        - name: oauth2-signin-templates
          configMap:
            name: "productie-web-oauth2-signin"
