apiVersion: apps/v1
kind: Deployment
metadata:
  name: "productie-web-waker"
  namespace: "rig-golden-slaapstand"
  labels:
    app: "productie-web"
    deployment: "productie"
    project: "golden-slaapstand"
    component: application
    "zad-role": "waker"
spec:
  strategy:
    type: RollingUpdate
  replicas: 1
  revisionHistoryLimit: 3
  # Cap how long Kubernetes reports a stalled rollout as "Progressing" before
  # flipping it to ProgressDeadlineExceeded (default is 600s). ArgoCD's health
  # gate waits out this window, so a broken rollout (e.g. ImagePullBackOff) would
  # otherwise hang the sync for 10 minutes. 300s leaves room for genuinely slow
  # starts while failing visibly faster.
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: "productie-web"
      component: application
      "zad-role": "waker"
  template:
    metadata:
      labels:
        app: "productie-web"
        deployment: "productie"
        project: "golden-slaapstand"
        component: application
        network-policy: allow-db-access
        "zad-role": "waker"
    spec:
      # Pod-level security context (OpenShift compatible)
      securityContext:
        # For Kind clusters, specify numeric UID since no SCC assignment.
        # Per-component overrides via project YAML `components[].security.{run-as-user,run-as-group,fs-group}`;
        # each defaults to 1001 when omitted to preserve historical behaviour.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001  # Required for PVC write access
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "ghcr.io/minbzk/base-images/zad-waker:latest"
          imagePullPolicy: "Always"
          ports:
            - containerPort: 8080
              name: http
          # Container-level security context (OpenShift compatible)
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          envFrom:
            - secretRef:
                name: "productie-web-waker-token"
            - configMapRef:
                name: "productie-web-waker-config"
          resources:
            requests:
              memory: "25Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          startupProbe:
            httpGet:
              port: 8080
              path: "/__zad/healthz"
              scheme: "HTTP"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36  # 5 + (36 × 5) = 185 seconds max startup time
          livenessProbe:
            httpGet:
              port: 8080
              path: "/__zad/healthz"
              scheme: "HTTP"
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: 8080
              path: "/__zad/ready"
              scheme: "HTTP"
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 1
