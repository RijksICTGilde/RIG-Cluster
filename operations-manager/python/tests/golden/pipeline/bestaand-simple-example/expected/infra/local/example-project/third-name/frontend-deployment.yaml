apiVersion: apps/v1
kind: Deployment
metadata:
  name: "third-name-frontend"
  namespace: "rig-example-project"
  labels:
    app: "third-name-frontend"
    deployment: "third-name"
    project: "example-project"
    component: application
spec:
  strategy:
    type: Recreate
  replicas: 1
  revisionHistoryLimit: 3
  # Cap how long Kubernetes reports a stalled rollout as "Progressing" before
  # flipping it to ProgressDeadlineExceeded (default is 600s). ArgoCD's health
  # gate waits out this window, so a broken rollout (e.g. ImagePullBackOff) would
  # otherwise hang the sync for 10 minutes. 300s leaves room for genuinely slow
  # starts while failing visibly faster.
  progressDeadlineSeconds: 300
  selector:
    matchLabels:
      app: "third-name-frontend"
      component: application
  template:
    metadata:
      labels:
        app: "third-name-frontend"
        deployment: "third-name"
        project: "example-project"
        component: application
        network-policy: allow-db-access
    spec:
      # De eigen serviceaccount van het project, zonder pull-secrets; deze pod draagt
      # hieronder alleen wat hij zelf nodig heeft.
      serviceAccountName: "example-project-sa"
      # Pod-level security context (OpenShift compatible)
      securityContext:
        # For Kind clusters, specify numeric UID since no SCC assignment.
        # Per-component overrides via project YAML `components[].security.{run-as-user,run-as-group,fs-group}`;
        # each defaults to 1001 when omitted to preserve historical behaviour.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001  # Required for PVC write access
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "tutum/hello-world"
          imagePullPolicy: "Always"
          ports:
            - containerPort: 8080
              name: http
          # Container-level security context (OpenShift compatible)
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          env:
            - name: "DATA_PATH"
              value: "/data"
            - name: "TEMP_PATH"
              value: "/tmp"
            - name: "PUBLIC_HOST"
              value: "https://frontend-third-name-example-project.kind"
            - name: "PUBLIC_HOSTNAME"
              value: "frontend-third-name-example-project.kind"
            - name: "REQUESTS_CA_BUNDLE"
              value: "/etc/ssl/certs"
            - name: "NODE_EXTRA_CA_CERTS"
              value: "/etc/ssl/certs/custom-ca.crt"
            - name: "SSL_CERT_DIR"
              value: "/etc/ssl/certs"
          envFrom:
            - secretRef:
                name: "third-name-frontend-platform"
          volumeMounts:
            - name: "data"
              mountPath: "/data"
            - name: "tmp"
              mountPath: "/tmp"
            - name: ca-certificate
              mountPath: /etc/ssl/certs/custom-ca.crt
              readOnly: true
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          startupProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 36  # 5 + (36 × 5) = 185 seconds max startup time
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 0
            periodSeconds: 2
            failureThreshold: 3
      volumes:
        - name: "data"
          persistentVolumeClaim:
            claimName: "third-name-frontend-data-pvc"
        - name: "tmp"
          emptyDir:
            sizeLimit: "2Gi"
        - name: ca-certificate
          hostPath:
            path: /etc/ssl/certs/kind-local-ca.crt
            type: File
