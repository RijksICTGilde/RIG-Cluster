apiVersion: v1
kind: Service
metadata:
  name: "third-name-frontend"
  namespace: "rig-example-project"
  labels:
    app: "third-name-frontend"
    project: "example-project"
spec:
  selector:
    app: "third-name-frontend"
    component: application
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
