apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "odcn-name-frontend-data-pvc"
  namespace: "rig-prd-example-project"
  annotations:
    argocd.argoproj.io/sync-options: Replace=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ocs-storagecluster-ceph-rbd
  resources:
    requests:
      storage: "10Gi"
