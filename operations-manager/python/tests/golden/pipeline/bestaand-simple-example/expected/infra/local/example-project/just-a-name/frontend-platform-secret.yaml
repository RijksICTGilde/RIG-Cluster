apiVersion: v1
kind: Secret
metadata:
  name: "just-a-name-frontend-platform"
  namespace: "rig-example-project"
  labels:
    app.kubernetes.io/name: "just-a-name-frontend-platform"
    app.kubernetes.io/component: "platform"
    created-by: operations-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Replace ensures ArgoCD does a full kubectl replace instead of 3-way merge,
    # so keys removed/renamed in a later render (e.g. an alias rename) are dropped
    # from the live Secret rather than lingering as stale entries.
    argocd.argoproj.io/sync-options: Replace=true
type: "Opaque"
stringData:
  "DEPLOYMENT_NAME": "just-a-name"
  "COMPONENT_NAME": "frontend"
