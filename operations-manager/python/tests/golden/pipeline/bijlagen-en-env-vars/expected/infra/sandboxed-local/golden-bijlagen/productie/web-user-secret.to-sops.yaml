apiVersion: v1
kind: Secret
metadata:
  name: "productie-web-user"
  namespace: "rig-golden-bijlagen"
  labels:
    app.kubernetes.io/name: "productie-web-user"
    app.kubernetes.io/component: "user"
    created-by: operations-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    # Replace ensures ArgoCD does a full kubectl replace instead of 3-way merge,
    # so keys removed/renamed in a later render (e.g. an alias rename) are dropped
    # from the live Secret rather than lingering as stale entries.
    argocd.argoproj.io/sync-options: Replace=true
type: "Opaque"
stringData:
  "LOG_LEVEL": "debug"
  "FEATURE_FLAG": "aan"
  "CA_BUNDLE": "ca-bundel-inhoud"
