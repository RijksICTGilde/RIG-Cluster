apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-example-nl-prod
spec:
  acme:
    email: rig-platform@rijksoverheid.nl
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-example-nl-prod-key
    solvers:
    - http01:
        gatewayHTTPRoute:
          parentRefs:
            - group: gateway.networking.k8s.io
              kind: Gateway
              name: "rig-gateway"
              namespace: "rig-gateway"
              sectionName: "http"
