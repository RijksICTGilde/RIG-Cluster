apiVersion: v1
kind: Service
metadata:
  name: "prod-web"
  namespace: "rig-myproject"
  labels:
    app: "prod-web"
    project: "myproject"
spec:
  selector:
    app: "prod-web"
    component: application
  ports:
    - port: 4180
      targetPort: 4180
      protocol: TCP
      name: http
    - port: 9090
      targetPort: 9090
      protocol: TCP
      name: p9090
  type: ClusterIP
