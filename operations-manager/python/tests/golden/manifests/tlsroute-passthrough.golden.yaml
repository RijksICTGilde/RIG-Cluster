apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: "prod-web"
spec:
  # Passthrough: the stream reaches the pod encrypted and the pod terminates TLS with its
  # own certificate, so no filters and no header modification are possible here.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: "ListenerSet"
      name: "prod-own-listeners"
      sectionName: "app-example-nl"
  hostnames:
    - "app.example.nl"
  rules:
    - backendRefs:
        - name: "prod-web"
          port: 8443
