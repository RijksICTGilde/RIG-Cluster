apiVersion: v1
kind: Service
metadata:
  name: "prod-web"
  namespace: "rig-myproject"
  labels:
    app: "prod-web"
    project: "myproject"
spec:
  selector:
    app: "prod-web"
    component: application
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
