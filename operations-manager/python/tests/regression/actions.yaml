# De kaart van alle acties van ZAD, en waartegen ze gemeten zijn.
#
# Elke stap van het opstarten en elke taak staat hier, met per afhankelijkheid of hij tegen
# die echte afhankelijkheid gemeten is. ``tests/test_actions_map.py`` eist dat de kaart
# volledig is: een nieuwe stap in ``lifespan`` of ``run_startup_tasks``, of een nieuw
# ``TaskType``, laat die toets falen tot er een regel bij staat.
#
# Per afhankelijkheid een van drie:
#   measured: met ``test``, de toets die hem tegen de echte afhankelijkheid draait.
#             Voor een taakregel betekent measured: de hele taak, van begin tot eind.
#   planned:  met ``phase``, een van de fasen onderaan dit bestand.
#   exempt:   met ``reason``. Een beslissing, geen punt op een lijst.
#
# Geen afhankelijkheden betekent een lege ``dependencies``: die stap raakt niets buiten OPI.
# Vul naar waarheid: wat vandaag alleen met mocks gemeten wordt, is planned en niet measured.

phases:
  "1-postgres-minio-forgejo": "deze taak: PostgreSQL, MinIO en git/Forgejo, de kaart en de dekkingstoetsen"
  "2-kubernetes-argocd": "kind met de gepinde node-image, ArgoCD in de gepinde versie, de kubectl- en Argo-connectoren"
  "3-opstarten": "run_startup_tasks tegen alle echte afhankelijkheden tegelijk, twee keer achter elkaar"
  "4-taken": "elk TaskType als scenario tegen de echte afhankelijkheden, met een invariant per stap"
  later: "SeaweedFS, mail, metrics en DNS, na fase 2"

