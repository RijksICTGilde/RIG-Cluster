  - subject: kindest/node in tests/netpol/kind-config.yaml
    dependencies:
      kubernetes:
        status: measured
        test: test_the_kind_node_image_of_every_test_cluster_follows_the_sandbox_pin
  - subject: kindest/node in tests/cluster/kind-config.yaml
    dependencies:
      kubernetes:
        status: measured
        test: test_the_test_cluster_reads_its_images_from_a_pin
  - subject: Forgejo en ArgoCD van het wegwerpcluster (task test-cluster-up)
    dependencies:
      kubernetes:
        status: measured
        test: test_the_test_cluster_reads_its_images_from_a_pin
      argocd:
        status: measured
        test: test_the_test_cluster_reads_its_images_from_a_pin
