# Een taakregel gaat over de taak van BEGIN TOT EIND, dus met de handler, git en ArgoCD
# erbij. Waar fase 1 de stap van de manager al meet, staat dat als measured met een note.
tasks:
  - task: CREATE_PROJECT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      keycloak: {status: planned, phase: "4-taken"}
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: UPSERT_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      postgres:
        status: measured
        test: test_two_deployments_each_reach_only_their_own_database
        note: de stap van de DatabaseManager is gemeten; de taak met git en ArgoCD staat in fase 4
      minio:
        status: measured
        test: test_two_deployments_each_reach_only_their_own_bucket
        note: de stap van de MinioManager is gemeten; de taak met git en ArgoCD staat in fase 4
      keycloak: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: UPDATE_IMAGE
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: DELETE_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      postgres:
        status: measured
        test: test_deleting_a_deployment_leaves_no_database_or_role_behind
        note: de stap van de DatabaseManager is gemeten; de taak met git en ArgoCD staat in fase 4
      minio:
        status: measured
        test: test_deleting_a_deployment_leaves_no_bucket_or_user_behind
        note: de stap van de MinioManager is gemeten; de taak met git en ArgoCD staat in fase 4
      keycloak: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: DELETE_PROJECT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      keycloak: {status: planned, phase: "4-taken"}
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: DELETE_COMPONENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: DELETE_ATTACHMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
  - task: CONFIGURE_ATTACHMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
  - task: CLONE_DATABASE
    dependencies:
      postgres:
        status: measured
        test: test_clone_schema_copies_the_rows_to_the_target_owner
        note: de kloonpijplijn is gemeten; de taak met git en de voortgang staat in fase 4
      git: {status: planned, phase: "4-taken"}
  - task: CLONE_BUCKET
    dependencies:
      minio:
        status: measured
        test: test_mirror_bucket_cross_alias_copies_every_object
        note: de spiegelstap is gemeten; de taak met git en de voortgang staat in fase 4
      git: {status: planned, phase: "4-taken"}
  - task: REFRESH_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: ROTATE_CREDENTIALS
    dependencies:
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      keycloak: {status: planned, phase: "4-taken"}
      git: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
  - task: SLEEP_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: WAKE_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: REFRESH_PROJECT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: ROTATE_PROJECT_KEY
    dependencies:
      git: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
  - task: ADD_COMPONENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: ADD_COMPONENT_TO_DEPLOYMENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: UPDATE_COMPONENT
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: ADD_SERVICE
    dependencies:
      git: {status: planned, phase: "4-taken"}
      keycloak: {status: planned, phase: "4-taken"}
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: CONFIGURE_SERVICE
    dependencies:
      git: {status: planned, phase: "4-taken"}
      keycloak: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: CONFIGURE_SERVICE_VALUES
    dependencies:
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: MANAGE_DATABASE_SCHEMAS
    dependencies:
      postgres:
        status: measured
        test: test_an_extra_schema_comes_and_goes_without_touching_the_rest
        note: de stap van de DatabaseManager is gemeten; de handler met git en ArgoCD staat in fase 4
      git: {status: planned, phase: "4-taken"}
      argocd: {status: planned, phase: "2-kubernetes-argocd"}
  - task: BACKUP
    dependencies:
      kopia: {status: planned, phase: later}
      seaweedfs: {status: planned, phase: later}
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
  - task: RESTORE
    dependencies:
      kopia: {status: planned, phase: later}
      seaweedfs: {status: planned, phase: later}
      postgres: {status: planned, phase: "4-taken"}
      minio: {status: planned, phase: "4-taken"}
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}

# De opstelling van de toetsen zelf hoort ook op de kaart: wat een test start, start de
# versie die productie draait. ``tests/test_test_images_follow_pins.py`` bewaakt dat.
test_setup:
  - subject: kindest/node in tests/netpol/kind-config.yaml
    dependencies:
      kubernetes: {status: planned, phase: "2-kubernetes-argocd"}
