# Geanonimiseerd naar het grootste productieproject: 25 deployments (PR-previews)
# met elk drie componenten. Gebruikt om te meten dat het refreshpad de event
# loop niet vasthoudt; zie tests/test_jsonpath_cache.py.
schema-version: 2.9
name: groot-project
display-name: "Groot project"
description: "Projectbestand met 25 deployments voor prestatietoetsen"

clusters:
  - odcn-production

users:
  - email: admin@rijksoverheid.nl
    role: admin

services:
  - publish-on-web
  - keycloak
  - namespace-postgresql-database
  - minio-storage

config:
  age-public-key: "age1drxwupvn5eg8wd9cdf05nrxp6usrpk7tarc09yzk4c3m7jzzaups8757zy"

repositories:
  - name: main-repo
    url: "https://forgejo.example.org/zad/groot-project.git"
    branch: "main"
    path: "."

components:
  - name: backend
    type: single
    ports:
      inbound: [8000]
      outbound: [80, 443]
    services:
      - publish-on-web
      - keycloak
      - namespace-postgresql-database
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
  - name: frontend
    type: single
    ports:
      inbound: [3000]
      outbound: [80, 443]
    services:
      - publish-on-web
      - keycloak
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
  - name: worker
    type: single
    ports:
      inbound: [9000]
      outbound: [80, 443]
    services:
      - minio-storage
      - redis
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi

deployments:
  - name: pr-1
    cluster: odcn-production
    namespace: groot-project-pr-1
    repository: main-repo
    subdomain: pr-1
    components:
      - reference: backend
        image: "ghcr.io/org/backend:pr-1"
      - reference: frontend
        image: "ghcr.io/org/frontend:pr-1"
      - reference: worker
        image: "ghcr.io/org/worker:pr-1"
