# VOORBEELDPROJECT voor de LOTC-bouwlijn. Geen echt project.
#
# Bedoeld om de schermen te kunnen bekijken zonder te deployen: dit bestand loopt door
# dezelfde modellen en helpers als een echt projectbestand, zodat de pagina toont wat de
# applicatie werkelijk zou tonen.
#
# Er staan met opzet GEEN echte geheimen in. Waar een echt projectbestand AGE-versleutelde
# waarden draagt, staat hier leesbare tekst die zichtbaar een plaatsvervanger is - de
# pagina toont die achter dezelfde afscherming, dus de weergave klopt.
#
# Het project is bewust rijk: meerdere componenten, twee deployments, verschillende
# diensten en een bijlage. Zo raakt de pagina al zijn onderdelen.
schema-version: 2
name: voorbeeld-volledig
display-name: Voorbeeldproject (volledig)
description: Een verzonnen project om alle schermonderdelen te kunnen bekijken.

users:
  - email: beheerder@voorbeeld.nl
    role: admin
  - email: ontwikkelaar@voorbeeld.nl
    role: developer

clusters:
  - odcn-production

services:
  - publish-on-web
  - keycloak:
      config:
        template: standaard
        additional_redirect_uris:
          - http://localhost:8080/*
        # De realms staan hier en niet meer onder het project-brede ``config.keycloak``:
        # RC-5 heeft ze verhuisd, en het detailblok van de dienst leest alleen deze plek.
        # Zonder dit blijft de Keycloak-sectie op de proefopstelling leeg, en dan toont de
        # rijkste pagina van de applicatie juist het blok niet dat het meest te tonen heeft.
        realms:
          - host: https://keycloak.voorbeeld.nl
            realm: voorbeeld-volledig-odcn-production
            username: voorbeeld_admin
            password: VOORBEELDWAARDE-geen-echt-wachtwoord
            # De vlag en niet de sleutel, precies zoals de echte pagina hem doorgeeft: de
            # detailroute zet ``has_totp`` en wist ``totp_secret``, want een sleutel op de
            # pagina zou wie hem ziet voor altijd codes laten maken. Met alleen een
            # sleutel hier zou de knop "Toon code" op de proefopstelling ontbreken.
            has_totp: true
  - namespace-postgresql-database:
      config:
        instances: 1
        storage: 1Gi
  - persistent-storage
  - invite:
      config:
        default_language: nl
        active:
          - key: voorbeeldsleutel-geen-echte-uitnodiging
            realm-roles:
              - beheerder
            contact_email: beheerder@voorbeeld.nl
  - attachments:
      data:
        - id: voorbeeldcertificaat
          filename: certificaat.pem
          content: VOORBEELDWAARDE-geen-echt-bestand

registries:
  - name: voorbeeld-registry
    url: ghcr.io
    username: voorbeeld-gebruiker
    password: VOORBEELDWAARDE-geen-echt-geheim

repositories:
  - name: hoofdrepo
    url: https://github.com/voorbeeld/voorbeeld-applicatie.git
    username: git
    password: VOORBEELDWAARDE-geen-echt-geheim
    branch: main
    path: .
    project_name: voorbeeld-volledig

components:
  - name: backend
    type: single
    ports:
      inbound: [8000]
      outbound: [80, 443]
    path:
      - match: /api
    uses-components: []
    resources:
      cpu: '1'
      requests:
        memory: 512Mi
      limits:
        memory: 512Mi
    aliases:
      POSTGRES_SERVER: $DATABASE_SERVER_HOST
      POSTGRES_USER: $DATABASE_SERVER_USER
      KEYCLOAK_URI: $OIDC_URL
    services:
      - publish-on-web
      - keycloak
      - namespace-postgresql-database

  - name: frontend
    type: frontend
    ports:
      inbound: [3000]
      outbound: [80, 443]
    path: /
    uses-components: []
    resources:
      requests:
        memory: 128Mi
      limits:
        memory: 128Mi
    services:
      - publish-on-web
      - keycloak

deployments:
  - name: productie
    cluster: odcn-production
    namespace: voorbeeld-volledig
    repository: hoofdrepo
    subdomain: voorbeeld
    components:
      - reference: backend
        image: ghcr.io/voorbeeld/backend:2026.08.01
        registry: voorbeeld-registry
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 512Mi
      - reference: frontend
        image: ghcr.io/voorbeeld/frontend:2026.08.01
        registry: voorbeeld-registry

  - name: acceptatie
    cluster: odcn-production
    namespace: voorbeeld-volledig-acc
    repository: hoofdrepo
    subdomain: voorbeeld-acc
    components:
      - reference: backend
        image: ghcr.io/voorbeeld/backend:2026.08.02-rc1
        registry: voorbeeld-registry
        imagePullPolicy: Always

config:
  age-public-key: age1voorbeeld0000000000000000000000000000000000000000000000000
  age-private-key: VOORBEELDWAARDE-geen-echte-sleutel
  api-key: VOORBEELDWAARDE-geen-echte-sleutel
  keycloak:
    - host: https://keycloak.voorbeeld.nl
      realm: voorbeeld-volledig-odcn-production
      username: voorbeeld_admin
      password: VOORBEELDWAARDE-geen-echt-wachtwoord
