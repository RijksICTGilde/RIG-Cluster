# Project template - base skeleton for new projects.
#
# Fields managed by editables (display-name, description, clusters,
# services, users, components, deployments) are NOT included here;
# they come from the wizard form data.
#
# ${SETTING_NAME} placeholders are resolved from opi.core.config.settings
# at load time.
#
# schema-version is stamped with LATEST_SCHEMA_VERSION by load_project_template()
# so new projects are created at the current schema (no migration on first
# process). The value below is a documentation placeholder; the loader overrides it.

schema-version: 2.4

repositories:
  - name: main-repo
    url: "${PROJECT_REPO_URL}"
    username: "${PROJECT_REPO_USERNAME}"
    password: "${PROJECT_REPO_PASSWORD}"
    branch: "${PROJECT_REPO_BRANCH}"
    path: "."
