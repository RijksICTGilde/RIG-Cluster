# SSO-Support Keycloak Configuration
# Purpose: Project realm with both SSO and local authentication support
# This configuration creates a project realm that allows both SSO and local username/password authentication

---
# Platform client in RIG Platform realm (for federation)
platformClients:
  - as: platform_client  # Capture outputs for use in identityProviders
    realm: "{{ platform_realm_name }}"
    clientId: "{{ platform_client_id }}"
    name: "{{ project_name }} - {{ cluster }} - Platform Federation"
    enabled: true
    publicClient: false
    protocol: "openid-connect"
    redirectUris:
      - "{{ keycloak_url }}/realms/{{ project_realm_name }}/broker/rig-platform-oidc/endpoint/*"
    webOrigins:
      - "+"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    # OIDC backchannel logout: when the user's rig-platform session ends, Keycloak
    # POSTs a logout_token to this URL so the project realm clears its user session
    # too. Required for end-to-end logout across the federation chain, paired with
    # the always-clear-session-logout shim on the sso-rijk IdP.
    attributes:
      backchannel.logout.url: "{{ keycloak_url }}/realms/{{ project_realm_name }}/protocol/openid-connect/logout/backchannel-logout"
      backchannel.logout.session.required: "true"
      post.logout.redirect.uris: "+"

# Project realm with SSO support and local authentication
realms:
  - name: "{{ project_realm_name }}"
    displayName: "{{ project_display_name }}"
    enabled: true
    # LET OP: hier stond registrationAllowed/loginWithEmailAllowed/resetPasswordAllowed op
    # true, en dat gebeurde NIET - deze blauwdruk werd voor deze velden niet gelezen en
    # create_realm() zette ze hardgecodeerd op false. Er stond dus een BELOFTE; er staat nu
    # een BESCHRIJVING van wat er werkelijk op deze realms staat.
    #
    # Sinds RC-159 leest OPI ze wel, op de aanmaakweg EN bij elke verwerking. Ze hier op
    # true zetten zou dus zelfregistratie AANZETTEN op elke bestaande realm van deze
    # blauwdruk, en of dat hoort te gebeuren is een productbeslissing en geen opruimklus.
    # De tekst in de UI (KeycloakTemplateOptionsProvider) beschrijft de blauwdruk nog wel
    # met deze drie velden en klopt dus niet meer met wat hier staat.
    #
    # verifyEmail is de UITZONDERING en gaat wel om. Een realm die verifieert en niet kan
    # mailen sluit nieuwe gebruikers buiten, dus deze regel is een VERZOEK en geen bevel:
    # OPI zet verifyEmail alleen AAN als het PLATFORM een mailrelay heeft
    # (MAIL_RELAY_API_URL gevuld, zie _apply_realm_fields). Heeft het die niet - clustertype
    # 'local', of productie tijdens de crashlus van de relay op 21-08-2026 - dan blijft
    # verifyEmail hier op true staan en op de REALM uit, met een waarschuwing in de log. De
    # eerstvolgende verwerking nadat de relay er is, zet het alsnog aan.
    #
    # De maat is de RELAY en niet de smtpServer van de realm. Die laatste zei hier ooit iets
    # over, maar sinds RC-159 draagt elke realm een minimale smtpServer met alleen een
    # afzenderadres en gaat de post via de eigen verzender uit de omgeving van de pod.
    #
    # Wie wordt hierdoor geraakt: nieuwe LOKALE gebruikers, en iedereen die zijn adres
    # wijzigt. SSO-gebruikers niet - die komen via trustEmail al geverifieerd binnen.
    registrationAllowed: false
    loginWithEmailAllowed: false
    resetPasswordAllowed: false
    editUsernameAllowed: false
    verifyEmail: true
    bruteForceProtected: true
    loginTheme: "nl-design-system"
    # Audit events: persist user events (incl. UPDATE_PROFILE/UPDATE_EMAIL) and admin
    # events so identity changes are traceable afterwards (see docs/post-mortems/
    # user-impersonation-oidc-email-claim.md). Expiration covers user events only;
    # Keycloak 25 has no expiration for admin events.
    eventsEnabled: true
    eventsExpiration: 7776000  # 90 days
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true
    # Close off identity self-service. A user who can set their own password and unlink the
    # IdP logs in locally afterwards, bypassing SSO Rijk entirely. Disabling the required
    # action kills both the account console button and the hand-crafted kc_action URL;
    # dropping manage-account takes away link/unlink and profile self-edit. Local accounts
    # are intended behaviour on this template and keep working: they pick their password in
    # OPI's invite form, which writes it through the admin API and never touches this action.
    # See features/futures/keycloak-sso-bypass-voorkomen.md.
    disabledRequiredActions:
      - UPDATE_PASSWORD
    removeFromDefaultRoles:
      - account:manage-account

identityProviders:
  - alias: "rig-platform-oidc"
    displayName: "SSO Rijk"
    providerId: "oidc"
    enabled: true
    authenticateByDefault: false  # Show login form with SSO option button
    updateProfileFirstLogin: "off"
    config:
      clientId: "{{ platform_client.client_id }}"
      clientSecret: "{{ platform_client.client_secret }}"
      discoveryUrl: "{{ keycloak_url }}/realms/{{ platform_realm_name }}/.well-known/openid-configuration"
      # Explicitly store the issuer so OIDC backchannel-logout token verification
      # works. Without it, Keycloak's auto-resolution from discoveryUrl fails at
      # verification time and logout_tokens are rejected as invalid_token.
      issuer: "{{ keycloak_url }}/realms/{{ platform_realm_name }}"
      syncMode: "IMPORT"
      # Frontchannel logout so the browser carries the SAML LogoutRequest all the way to BZK
      backchannelSupported: "false"
    mappers:
      - name: "email-to-username"
        identityProviderMapper: "oidc-username-idp-mapper"
        config:
          syncMode: "INHERIT"
          template: "${CLAIM.email}"

      - name: "email-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "email"
          user.attribute: "email"

      - name: "first-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "given_name"
          user.attribute: "firstName"

      - name: "last-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "family_name"
          user.attribute: "lastName"

      - name: "full-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "name"
          user.attribute: "displayName"

      - name: "organization-number-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "organization.number"
          user.attribute: "organization.number"

      - name: "organization-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "organization.name"
          user.attribute: "organization.name"

      - name: "sso-rijk-userid-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "sso-rijk-userid"
          user.attribute: "sso-rijk-userid"

      - name: "sso-rijk-userid-lowercase-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "sso-rijk-userid-lowercase"
          user.attribute: "sso-rijk-userid-lowercase"

# Explicitly set browser flow to the built-in "browser" flow
# This ensures switching from sso-only to sso-support resets the auto-redirect
browserFlow: "browser"

# Client for operations manager invite flow
# Allows the operations manager to authenticate users via this realm for invitations
# This is a public client (no secret) since the OAuth flow happens in the user's browser
# Uses the standard "browser" flow to bypass any access restrictions on other clients
clients:
  - clientId: "{{ invite_client_id }}"
    name: "Operations Manager Invite Flow"
    enabled: true
    publicClient: true
    protocol: "openid-connect"
    redirectUris:
      - "https://{{ operations_manager_domain }}/invite/*"
      - "http://{{ operations_manager_domain }}/invite/*"
    postLogoutRedirectUris:
      - "+"
    webOrigins:
      - "https://{{ operations_manager_domain }}"
      - "http://{{ operations_manager_domain }}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    pkceCodeChallengeMethod: "S256"
    browserFlowOverride: "browser"
    # Explicitly set theme since browserFlowOverride may not inherit realm theme correctly
    attributes:
      login_theme: "nl-design-system"

clientScopes:
  - name: "custom_attributes_passthrough"
    description: "Custom attributes passthrough for project realm (no override mappers)"
    realmType: "PROJECT"
    protocol: "openid-connect"
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: "Organization Name Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.name"
          claim.name: "organization.name"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "Organization Number Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.number"
          claim.name: "organization.number"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid"
          claim.name: "sso-rijk-userid"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Lowercase Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid-lowercase"
          claim.name: "sso-rijk-userid-lowercase"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

    # Assign as realm-level default client scope
    defaultScope: true

# Note: Deployment clients are created separately via deployment-specific flow,
# not during project realm setup
