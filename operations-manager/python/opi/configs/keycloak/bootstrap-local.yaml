# Bootstrap Keycloak Configuration for Local Kind Clusters
# Purpose: Setup a local Keycloak that uses the production RIG Platform Keycloak as upstream IDP
# This allows local development with real SSO-Rijk authentication via the production Keycloak
#
# Prerequisites:
# 1. The production Keycloak must have the 'development-clusters' client configured (see bootstrap.yaml)
# 2. You need the client secret from the production Keycloak
#
# Usage:
# Set these environment variables to point to the production Keycloak:
#   KEYCLOAK_MASTER_OIDC_CLIENT_ID=development-clusters
#   KEYCLOAK_MASTER_OIDC_CLIENT_SECRET=<secret from production>
#   KEYCLOAK_MASTER_OIDC_DISCOVERY_URL=https://keycloak.rijksapp.nl/realms/rig-platform/.well-known/openid-configuration
#
# Then run the operations-manager with KEYCLOAK_BOOTSTRAP_CONFIG=local

---
realms:
  - name: "{{ realm_name }}"
    displayName: "{{ realm_display_name }}"
    enabled: true
    # Deze vier velden BESCHRIJVEN wat er op de realm staat; sinds RC-159 leest OPI ze uit
    # dit blauwdruk en zet ze op de realm, op de aanmaakweg EN bij elke verwerking.
    # Voorheen stonden ze hardgecodeerd in create_realm() en deed wat hier stond niets.
    registrationAllowed: false
    loginWithEmailAllowed: false
    resetPasswordAllowed: false
    verifyEmail: false
    # De TAAL van wat deze realm toont en verstuurt; zonder deze drie komt er Engelse
    # standaardtekst uit Keycloak. Zie sso-support.yaml voor de volledige afweging, ook
    # over het inlogscherm dat hier in meegaat.
    internationalizationEnabled: true
    supportedLocales: ["nl", "en"]
    defaultLocale: "nl"
    bruteForceProtected: true
    loginTheme: "nl-design-system"
    # Het mailthema van deze realm, en de enige reden dat het bestaat: de magic-link-mail
    # van de storingsstand. EmailTemplateProvider zoekt zad-magic-link.ftl in het
    # mailthema, en zonder dit veld blijft dat Keycloaks eigen `keycloak`-thema, waar dat
    # sjabloon niet staat. De mails van Keycloak zelf houden hun teksten: ons mailthema
    # erft van `base`, waar elke sleutel staat, en `keycloak/email` voegt niets toe dan
    # zijn eigen themabeschrijving. Zie features/sso-rijk-uitwijk.md.
    emailTheme: "nl-design-system"
    # Audit events: persist user events (incl. UPDATE_PROFILE/UPDATE_EMAIL) and admin
    # events so identity changes are traceable afterwards (see docs/post-mortems/
    # user-impersonation-oidc-email-claim.md). Expiration covers user events only;
    # Keycloak 25 has no expiration for admin events.
    eventsEnabled: true
    eventsExpiration: 7776000  # 90 days
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true

identityProviders:
  # OIDC connection to production RIG Platform Keycloak
  # This passes through SSO-Rijk authentication from the production environment
  - alias: "sso-rijk"
    displayName: "SSO Rijk (via RIG Platform)"
    providerId: "oidc"
    enabled: true
    authenticateByDefault: true
    config:
      clientId: "{{ sso_client_id }}"
      clientSecret: "{{ sso_client_secret }}"
      discoveryUrl: "{{ sso_discovery_url }}"
      syncMode: "FORCE"
    mappers:
      # Map username from email
      - name: "email-to-username"
        identityProviderMapper: "oidc-username-idp-mapper"
        config:
          syncMode: "INHERIT"
          template: "${CLAIM.email}"

      # Map email attribute
      - name: "email-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "email"
          user.attribute: "email"

      # Map first name
      - name: "first-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "given_name"
          user.attribute: "firstName"

      # Map last name
      - name: "last-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "family_name"
          user.attribute: "lastName"

      # Map display name
      - name: "full-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "name"
          user.attribute: "displayName"

      # Map organization number (passed through from SSO-Rijk)
      - name: "organization-number-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "organization.number"
          user.attribute: "organization.number"

      # Map organization name (passed through from SSO-Rijk)
      - name: "organization-name-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          claim: "organization.name"
          user.attribute: "organization.name"

      # Map SSO-Rijk user ID (the original urn:collab:person:... identifier)
      - name: "sso-rijk-userid-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "sso-rijk-userid"
          user.attribute: "sso-rijk-userid"

      # Map SSO-Rijk user ID lowercase
      - name: "sso-rijk-userid-lowercase-mapper"
        identityProviderMapper: "oidc-user-attribute-idp-mapper"
        config:
          syncMode: "FORCE"
          claim: "sso-rijk-userid-lowercase"
          user.attribute: "sso-rijk-userid-lowercase"

authenticationFlows:
  - alias: "External IDP Redirector"
    description: "Automatically redirect to upstream RIG Platform Keycloak"
    providerId: "basic-flow"
    topLevel: true
    builtIn: false
    executions:
      - authenticator: "auth-cookie"
        requirement: "ALTERNATIVE"
        priority: 10

      - authenticator: "identity-provider-redirector"
        requirement: "ALTERNATIVE"
        priority: 20
        authenticatorConfig:
          alias: "sso-rijk-redirector"
          config:
            defaultProvider: "sso-rijk"

    # Set as browser flow for the realm
    setAsBrowserFlow: true

    # De binding gebeurt EEN keer, op een realm die nog Keycloaks eigen flow draagt. Daarna
    # laat elke verwerking staan wat er staat, zodat een platformbeheerder naar de
    # storingsstand hieronder kan omzetten zonder dat de volgende reconcile hem terugzet.
    # Zie features/sso-rijk-uitwijk.md.
    bindOnlyIfDefault: true

  # De storingsstand van SSO Rijk: permanent aanwezig, nooit automatisch gebonden. Een
  # platformbeheerder zet hem aan op de beheerpagina van ZAD. De executions bouwt de
  # connector (ensure_magic_link_browser_flow): deze lezer kan geen authenticator uit de
  # image plaatsen.
  - alias: "SSO Rijk storing"
    description: "Browser flow voor een storing van SSO Rijk: inloggen met een magic link per mail"
    providerId: "basic-flow"
    topLevel: true
    builtIn: false
    magicLink: true

clientScopes:
  - name: "custom_attributes_passthrough"
    description: "Custom attributes passthrough for local development"
    realmType: "PLATFORM"
    protocol: "openid-connect"
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: "Organization Name Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.name"
          claim.name: "organization.name"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "Organization Number Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.number"
          claim.name: "organization.number"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Override (sub)"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid"
          claim.name: "sub"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Lowercase Override"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid-lowercase"
          claim.name: "preferred_username"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid"
          claim.name: "sso-rijk-userid"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Lowercase Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid-lowercase"
          claim.name: "sso-rijk-userid-lowercase"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

    # Assign as realm-level default client scope
    defaultScope: true

clients:
  # De noodweg: inloggen op ZAD met een lokaal beheerdersaccount in deze realm, zonder SSO
  # Rijk. Eigen browser-flow via restrictAccess: gebruikersnaam, wachtwoord, verplichte OTP
  # van Keycloak, en de clientrol hieronder. Een account zonder die rol komt er niet door.
  # De accounts zelf maakt deze ship niet aan; zie features/sso-rijk-uitwijk.md.
  #
  # Publieke client met PKCE en niet vertrouwelijk: er is dan geen geheim dat OPI moet
  # bewaren, en de drempel is toch het wachtwoord plus de OTP plus de rol.
  - clientId: "zad-beheer"
    name: "ZAD Beheer (noodweg)"
    enabled: true
    publicClient: true
    protocol: "openid-connect"
    redirectUris:
      - "https://{{ operations_manager_domain }}/auth/beheer/callback"
    postLogoutRedirectUris:
      - "+"
    webOrigins:
      - "https://{{ operations_manager_domain }}"
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    pkceCodeChallengeMethod: "S256"
    attributes:
      login_theme: "nl-design-system"
    clientRoles:
      - name: "platform-beheer"
        description: "Mag via de noodweg op ZAD inloggen"
    restrictAccess:
      enabled: true
      role: "platform-beheer"
      requireOtp: true
