# Bootstrap Keycloak Configuration
# Purpose: Initial setup of the RIG Platform Keycloak instance for operations manager authentication
# This configuration creates the platform realm with SSO-Rijk integration and operations manager client

---
realms:
  - name: "{{ realm_name }}"
    displayName: "{{ realm_display_name }}"
    enabled: true
    registrationAllowed: false
    loginWithEmailAllowed: false
    bruteForceProtected: true
    loginTheme: "nl-design-system"
    # SSO session timeouts (seconds). Without these Keycloak defaults apply
    # (30 min idle / 10 h max), which forced users to re-login via SSO-Rijk
    # too often. 8 h idle / 12 h max keeps a working day in one session.
    ssoSessionIdleTimeout: 28800
    ssoSessionMaxLifespan: 43200
    # Audit events: persist user events (incl. UPDATE_PROFILE/UPDATE_EMAIL) and admin
    # events so identity changes are traceable afterwards (see docs/post-mortems/
    # user-impersonation-oidc-email-claim.md). Expiration covers user events only;
    # Keycloak 25 has no expiration for admin events.
    eventsEnabled: true
    eventsExpiration: 7776000  # 90 days
    adminEventsEnabled: true
    adminEventsDetailsEnabled: true

identityProviders:
  - alias: "sso-rijk"
    displayName: "SSO Rijk"
    providerId: "saml"
    enabled: true
    authenticateByDefault: false
    updateProfileFirstLogin: "off"
    config:
      idpEntityId: "https://engine.spbroker-prd.bzk.sson.overheid-i.nl/authentication/idp/metadata"
      singleSignOnServiceUrl: "https://engine.spbroker-prd.bzk.sson.overheid-i.nl/authentication/idp/single-sign-on"
      # Eager-logout shim: Keycloak redirects SAML LogoutRequest to our custom
      # endpoint, which terminates the local Keycloak session and then redirects
      # the user to the downstream BZK logout page. BZK does not call back.
      # See features/keycloak-sso-rijk-eager-logout.md
      singleLogoutServiceUrl: "{{ keycloak_url }}/realms/{{ realm_name }}/always-clear-session-logout/sso-rijk"
      downstreamLogoutUrl: "https://engine.spbroker-prd.bzk.sson.overheid-i.nl/logout"
      nameIDPolicyFormat: "urn:oasis:names:tc:SAML:2.0:nameid-format:persistent"
      principalType: "SUBJECT"
      syncMode: "FORCE"
      # When Keycloak has no session for the user and initiates a fresh SAML
      # AuthnRequest to BZK, include ForceAuthn=true so BZK re-prompts for
      # credentials instead of silently returning an assertion from its own
      # cached session. Makes "logout from the rig-platform side" actually
      # mean "next login requires explicit BZK authentication".
      forceAuthn: "true"
      # SP Entity ID - our Keycloak's identifier for SSO-Rijk registration
      entityId: "{{ saml_sp_entity_id }}"
      # SSO-Rijk signing certificate (from their metadata)
      signingCertificate: ""
      # Verify the XML signature on the SAML Response/Assertion against the pinned
      # SSO-Rijk signing certificate above. Without this, Keycloak accepts any
      # self-crafted SAML Response POSTed to the broker ACS endpoint and lets the
      # attacker impersonate any user. wantAssertionsSigned forces the assertion
      # itself to be signed (not just the response envelope), closing signature-
      # wrapping bypasses. See docs/keycloak.md.
      validateSignature: true
      wantAssertionsSigned: true
      wantAssertionsEncrypted: false
    mappers:
      # Extract NameID (SSO-Rijk user identifier) to sso-rijk-userid attribute
      - name: "sso-rijk-userid"
        identityProviderMapper: "saml-unrestricted-xpath-idp-mapper"
        config:
          syncMode: "FORCE"
          xpath.expression: "//*[local-name()='Subject']/*[local-name()='NameID']/text()"
          user.attribute: "sso-rijk-userid"

      # Extract NameID lowercase for username matching
      - name: "sso-rijk-userid-lowercase"
        identityProviderMapper: "saml-unrestricted-xpath-idp-mapper"
        config:
          syncMode: "INHERIT"
          xpath.expression: "//*[local-name()='Subject']/*[local-name()='NameID']/text()"
          user.attribute: "sso-rijk-userid-lowercase"
          value.transformation: "LOWERCASE"

      # Map email from SAML attribute
      - name: "email"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "email"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:emailAddress"

      # Map first name from SAML attribute
      - name: "firstName"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "firstName"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:givenName"

      # Map last name from SAML attribute
      - name: "lastName"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "lastName"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:surName"

      # Map display name from SAML attribute
      - name: "displayName"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "displayname"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:displayName"

      # Map organization name from SAML attribute
      - name: "organizationName"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "organization.name"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:organizationDisplayName"

      # Map organization number from SAML attribute
      - name: "organizationNumber"
        identityProviderMapper: "saml-user-attribute-idp-mapper"
        config:
          syncMode: "INHERIT"
          user.attribute: "organization.number"
          attribute.name.format: "ATTRIBUTE_FORMAT_BASIC"
          attribute.name: "urn:rijksoverheid:federation:organizationNumber"

authenticationFlows:
  - alias: "External IDP Redirector"
    description: "Automatically redirect to external identity provider"
    providerId: "basic-flow"
    topLevel: true
    builtIn: false
    executions:
      - authenticator: "auth-cookie"
        requirement: "ALTERNATIVE"
        priority: 10

      - authenticator: "identity-provider-redirector"
        requirement: "ALTERNATIVE"
        priority: 20
        authenticatorConfig:
          alias: "sso-rijk-redirector"
          config:
            defaultProvider: "sso-rijk"

    # Set as browser flow for the realm
    setAsBrowserFlow: true

clientScopes:
  - name: "custom_attributes_passthrough"
    description: "Custom attributes passthrough with override mappers for platform realm"
    realmType: "PLATFORM"
    protocol: "openid-connect"
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: "Organization Name Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.name"
          claim.name: "organization.name"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "Organization Number Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "organization.number"
          claim.name: "organization.number"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Override (sub)"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid"
          claim.name: "sub"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Lowercase Override"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid-lowercase"
          claim.name: "preferred_username"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid"
          claim.name: "sso-rijk-userid"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

      - name: "SSO-Rijk UserID Lowercase Passthrough"
        protocol: "openid-connect"
        protocolMapper: "oidc-usermodel-attribute-mapper"
        config:
          user.attribute: "sso-rijk-userid-lowercase"
          claim.name: "sso-rijk-userid-lowercase"
          jsonType.label: "String"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"

    # Assign as realm-level default client scope
    defaultScope: true

clients:
  # Shared client for non-production clusters to use this Keycloak as upstream IDP.
  # These clusters authenticate users via this Keycloak, which in turn uses SSO-Rijk.
  # Zij mogen zelf niet rechtstreeks aan SSO-Rijk hangen, vandaar deze omweg.
  #
  # LET OP: deze lijst is de enige plek waar dit vastligt. Zet je een redirect-URI met de
  # hand in de productie-Keycloak, dan werkt het meteen maar is het weg zodra deze
  # blueprint opnieuw draait, bijvoorbeeld bij een herbouw van productie. En het verdwijnt
  # stil: niemand merkt het tot iemand op dat cluster probeert in te loggen.
  - clientId: "development-clusters"
    name: "Development Clusters (Local, Sandbox & Fundament)"
    enabled: true
    publicClient: false
    protocol: "openid-connect"
    # Allow redirects from local Kind cluster Keycloak instances
    redirectUris:
      - "https://keycloak.kind/*"
      - "http://keycloak.kind/*"
      - "https://localhost:*/*"
      - "http://localhost:*/*"
      - "https://keycloak.sandbox.rijksapp.dev/*"
      # Fundament-poc krijgt bewust het precieze broker-endpoint en geen host-brede
      # wildcard: we kennen het exact, dus een wildcard koopt niets en vergroot alleen het
      # oppervlak waarlangs een autorisatiecode bij de verkeerde pagina kan belanden.
      - "https://keycloak.fundament-poc.rijksapp.dev/realms/rig-platform/broker/sso-rijk/endpoint"
    webOrigins:
      - "https://keycloak.kind"
      - "http://keycloak.kind"
      - "https://localhost"
      - "http://localhost"
      - "https://keycloak.sandbox.rijksapp.dev"
      - "https://keycloak.fundament-poc.rijksapp.dev"
    standardFlowEnabled: true
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false

    # Pass through SSO-Rijk attributes to local clusters
    defaultClientScopes:
      - "custom_attributes_passthrough"

# Lokaal noodaccount naast SSO. De lijst local_admins is leeg tenzij een cluster
# KEYCLOAK_LOCAL_ADMIN_EMAIL zet, en forEach over een lege lijst maakt niets aan. Dit blok
# is dus standaard inert en verandert niets op clusters die het niet configureren.
#
# Het wachtwoord komt niet uit configuratie: keycloak_setup genereert het bij de eerste run
# en bewaart het als Secret in het cluster, en leest het daarna alleen nog uit.
#
# temporary: false is opzet. Een verplichte wijziging bij eerste gebruik zou het wachtwoord
# dat in dat Secret staat meteen ongeldig maken, en dit account bestaat juist voor het
# moment dat niemand meer via SSO binnenkomt.
users:
  forEach: "{{ local_admins }}"
  as: admin
  user:
    username: "{{ admin.username }}"
    enabled: true
    email: "{{ admin.email }}"
    emailVerified: true
    firstName: "ZAD"
    lastName: "Noodaccount"
    credentials:
      - type: "password"
        value: "{{ admin.password }}"
        temporary: false
