[dependency-groups]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.26.0",
    "nest-asyncio>=1.6.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.8.2",
    "playwright>=1.52.0",
    "pytest-playwright>=0.7.0",
    "pytest-httpx>=0.35.0",
    "freezegun>=1.5.2",
    "vcrpy>=7.0.0",
    "pytest-minio-mock>=0.4.17",
    "pytest-timeout>=2.3.1",
    "testcontainers[postgres]>=4.0.0",
]
# Lord of the Components: de POC-bouwlijn naast de release. Bewust GEEN runtime-
# dependency - de release-image bouwt uit [project.dependencies] en verandert hier
# niet van. Installeer met: uv sync --group lotc
#
# Gepind op commit 26ab110 van de v7-branch. Die pin is de reden dat dit veilig is:
# de NLDD-afgeleide componentlaag schuift met een bump mee, en 1263 aanroepen mogen
# niet stil van vorm veranderen.
lotc = [
    "lord-of-the-components @ git+https://git.claude.robbertuittenbroek.nl/robbert/lord-of-the-components.git@26ab110abc64f65d62c0b48b95a28fe49ceec2a8#subdirectory=python",
    "lotc-rvo @ git+https://git.claude.robbertuittenbroek.nl/robbert/lord-of-the-components.git@26ab110abc64f65d62c0b48b95a28fe49ceec2a8#subdirectory=packages/lotc-rvo",
    "lotc-nldd @ git+https://git.claude.robbertuittenbroek.nl/robbert/lord-of-the-components.git@26ab110abc64f65d62c0b48b95a28fe49ceec2a8#subdirectory=packages/lotc-nldd",
    "lotc-layout @ git+https://git.claude.robbertuittenbroek.nl/robbert/lord-of-the-components.git@26ab110abc64f65d62c0b48b95a28fe49ceec2a8#subdirectory=packages/lotc-layout",
    "lotc-forms @ git+https://git.claude.robbertuittenbroek.nl/robbert/lord-of-the-components.git@26ab110abc64f65d62c0b48b95a28fe49ceec2a8#subdirectory=packages/lotc-forms",
]
dev = [
    "ruff>=0.11.11",
    "pre-commit>=4.2.0",
    "polib>=1.2.0",
    "pyright>=1.1.401",
    "liccheck>=0.9.2",
    "setuptools>=80.8.0",
    "djlint>=1.36.1",
    "debugpy>=1.8.0",
    "pytest>=9.0.3",
    "pip-audit>=2.7.0",
]


# Ruff settings: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
target-version = "py314"
src = ["opi","tests"]
exclude = ["opi/migrations"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["I", "SIM", "B", "UP", "F", "E", "S", "C90", "DTZ", "LOG", "PIE", "PT", "ERA", "W", "C", "TRY", "RUF", "ANN", "A", "ICN", "RSE", "FLY", "ISC", "PLE", "FURB", "PERF", "TCH"]
fixable = ["ALL"]
task-tags = ["TODO"]
# Pre-existing issues to be fixed in a separate PR
ignore = [
    # TRY rules - exception handling patterns
    "TRY002",   # Create custom exception
    "TRY003",   # Long exception messages
    "TRY300",   # Consider moving to else block
    "TRY400",   # Use logging.exception
    "TRY401",   # Redundant exception object in logging.exception
    "TRY301",   # Abstract raise to inner function
    # B rules - bugbear
    "B008",     # Function call in defaults (FastAPI Body() idiom)
    "B904",     # Raise from err (73 violations)
    # E rules - pycodestyle errors
    "E501",     # Line too long (handled by ruff format)
    # ANN rules - annotations
    "ANN",      # Missing type annotations
    # RUF rules - ruff-specific
    "RUF059",   # Unpacked variable never used
    # F rules - pyflakes
    "F821",     # Undefined name
    "F841",     # Local variable assigned but never used
    # S rules - security
    "S104",     # Binding to all interfaces (intentional server config)
    "S108",     # Probable insecure temp file (intentional config paths)
    "S701",     # Jinja2 autoescape
    # ERA rules
    "ERA001",   # Commented out code
    # PT rules - pytest
    "PT009",    # Use pytest.raises
]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts, dynamic types, subprocess calls, hardcoded test secrets, and complex helper functions
"tests/**.py" = ["S101", "S105", "S603", "S607", "S608", "ANN201", "ANN401", "TRY300", "S106"]
"functional_tests/**.py" = ["S101", "S105", "S603", "S607", "S608", "ANN201", "ANN401", "TRY300", "S106"]
# OPI code has pre-existing issues to be fixed separately
"opi/**.py" = ["S105", "S106", "S603", "S607", "S608", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnusedVariable = false
reportCallIssue = true
reportPossiblyUnboundVariable = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalIterable = false
reportArgumentType = true
reportUndefinedVariable = false
reportUnboundVariable = false
reportReturnType = false
reportAssignmentType = false
reportIndexIssue = false
reportGeneralTypeIssues = false
reportOperatorIssue = false
reportOptionalOperand = false
exclude = [
    "opi/migrations",
    ".venv",
    "tests",
    "scripts",
]

[tool.coverage.run]
branch = true
command_line = "-m pytest"
relative_files = true # needed for sonarcloud code coverage
omit = [
    "tests/*",
    # Operational/diagnostic scripts are not application code under the 90% bar.
    # Some are imported by tests (e.g. probe-spec drift, upgrade-safety), which
    # would otherwise pull their partial coverage into the application metric.
    "scripts/*",
]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"
title = "opi"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "--strict-markers -v -q -m 'not requires_infra and not e2e'"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::UserWarning"
]
log_cli = true
log_cli_level = "INFO"
faulthandler_timeout = 60
markers = [
   "slow: marks tests as slow",
   "enable_auth: marks tests that require authentication",
   "requires_infra: marks tests that require external infrastructure (database, keycloak, etc.)",
   "e2e: marks end-to-end browser tests (require playwright and chromium)",
   "sandbox: marks tests that require a running sandbox cluster",
   "reallife: long-running real-life sandbox suite (5 projects, semi-concurrent UI+API mutations); excluded from the standard sandbox run",
   "upgrade_safety: RC-20 upgrade-safety replay of real production project files (clones the projects repo; needs network)"
]
pythonpath = "."


[tool.liccheck]
level = "PARANOID"
dependencies = true
authorized_licenses = [
    "Apache Software",
    "Apache-2.0",
    "Apache-2.0 AND MIT",
    "Apache-2.0 OR BSD-3-Clause",
    "Apache-2.0 OR BSD-2-Clause",
    "Apache-2.0 AND BSD-2-Clause",
    "Apache-2.0 AND CNRI-Python",
    "Apache License 2.0",
    "Artistic",
    "BSD",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "3-Clause BSD",
    "CNRI-Python",
    "GNU General Public License v2 or later (GPLv2+)",
    "GNU General Public License v3 or later (GPLv3+)",
    "GNU General Public License (GPL)",
    "GNU Library or Lesser General Public License (LGPL)",
    "LGPLv3+",
    "LGPL-3.0-or-later",
    "ISC License (ISCL)",
    "MIT",
    "MIT AND Python-2.0",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "PSF-2.0",
    "Python Software Foundation",
    "Public Domain",
    "The Unlicense (Unlicense)",
]

[tool.ruff.lint.flake8-type-checking]
# Both FastAPI and Pydantic read these annotations at runtime -- FastAPI to build the
# OpenAPI schema from route signatures, Pydantic to build its models -- so the imports
# they use cannot move into a type-checking block. Moving them would break the very spec
# the shared aliases in opi/api/params.py and opi/api/enums.py exist to improve.
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
]
