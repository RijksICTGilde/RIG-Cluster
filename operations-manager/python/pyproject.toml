[project]
name = "zad"
version = "0.1.0"
description = ""
authors = [{name = "Robbert", email = "robbert.uittenbroek@rijksoverheid.nl"}]
license = {text = "EUPL-1.2"}
requires-python = ">=3.14,<3.15"
keywords = ["A Deployment Manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed"
]
dependencies = [
    "fastapi==0.135.1",
    "alembic>=1.16.1",
    "pydantic==2.12.5",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.9.1",
    "psycopg2-binary>=2.9.10",
    "uvicorn[standard]>=0.34.2",
    "ruamel-yaml>=0.18.6",
    "babel>=2.17.0",
    "httpx>=0.28.1",
    "click>=8.2.1",
    "python-ulid[pydantic]>=3.0.0",
    "fastapi-csrf-protect>=1.0.3",
    "sqlalchemy[asyncio]>=2.0.41",
    "sqlalchemy-utils>=0.41.2",
    "authlib>=1.6.12", # CVE-2026-44681 open redirect
    "aiosqlite>=0.21.0",
    "asyncpg>=0.30.0",
    "async-lru>=2.0.5",
    "jinja2-base64-filters>=0.1.4",
    "python-multipart>=0.0.27", # CVE-2026-42561 DoS via unbounded headers
    "mako>=1.3.12", # CVE-2026-44307 path traversal in TemplateLookup
    "aiohttp>=3.12.13",
    "gitpython>=3.1.50", # CVE-2026-42215/42284/44243/44244 + GHSA-mv93-w799-cj2w
    "deepdiff>=8.0.1",
    "jsonpath-ng>=1.7.0",
    "tenacity>=9.1.2",
    "jinja-roos-components @ git+https://github.com/RijksICTGilde/jinja-roos-components.git@table-and-more-conversion",
    "beautifulsoup4>=4.13.4",
    "lxml>=6.0.1",
    "python-keycloak>=5.3.0",
    "prometheus-api-client>=0.7.0",
    "prometheus-client>=0.24.1",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
