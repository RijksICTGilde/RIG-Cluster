[tool.poetry]
name = "opi"
version = "0.1.0"
description = ""
authors = ["Robbert <robbert.uittenbroek@rijksoverheid.nl>"]
readme = "README.md"
license = "EUPL-1.2"
repository = "https://github.com/RijksICTGilde/opi"
keywords = ["A Deployment Manager"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Topic :: Deployment :: Infrastructure",
    "Typing :: Typed"
]
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.12"
alembic = "^1.16.1"
pydantic = "2.11.5"
jinja2 = "^3.1.6"
pydantic-settings = "^2.9.1"
psycopg2-binary = "^2.9.10"
uvicorn = {extras = ["standard"], version = "^0.34.2"}
ruamel-yaml = "^0.18.6"
babel = "^2.17.0"
httpx = "^0.28.1"
click = "^8.2.1"
python-ulid = {extras = ["pydantic"], version = "^3.0.0"}
fastapi-csrf-protect = "^1.0.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
sqlalchemy-utils = "^0.41.2"
authlib = "^1.6.0"
aiosqlite = "^0.21.0"
asyncpg = "^0.30.0"
async-lru = "^2.0.5"
jinja2-base64-filters = "^0.1.4"
python-multipart = "^0.0.20"
aiohttp = "^3.12.13"
gitpython = "^3.1.44"
deepdiff = "^8.0.1"
jsonpath-ng = "^1.7.0"
tenacity = "^9.1.2"
# keep line below if you want to switch to a 'development' version on disk instead
#jinja-roos-components = {path = "../../../jinja-roos-components", develop = true}
jinja-roos-components = {git = "https://github.com/RijksICTGilde/jinja-roos-components.git", branch = "table-and-more-conversion"}
beautifulsoup4 = "^4.13.4"
lxml = "^6.0.1"
python-keycloak = "^5.3.0"
prometheus-api-client = "^0.7.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"
nest-asyncio = "^1.6.0"
pytest-mock = "^3.14.0"
coverage = "^7.8.2"
playwright = "^1.52.0"
pytest-playwright = "^0.7.0"
pytest-httpx = "^0.35.0"
freezegun = "^1.5.2"
vcrpy = "^7.0.0"
pytest-minio-mock = "^0.4.17"


[tool.poetry.group.dev.dependencies]
ruff = "^0.11.11"
pre-commit = "^4.2.0"
polib = "^1.2.0"
pyright = "^1.1.401"
liccheck = "^0.9.2"
setuptools = "^80.8.0"
djlint = "^1.36.1"
debugpy = "^1.8.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff settings: https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 120
target-version = "py313"
src = ["opi","tests"]
exclude = ["opi/migrations"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["I", "SIM", "B", "UP", "F", "E", "S", "C90", "DTZ", "LOG", "PIE", "PT", "ERA", "W", "C", "TRY", "RUF", "ANN"]
fixable = ["ALL"]
task-tags = ["TODO"]
# Pre-existing issues to be fixed in a separate PR
ignore = [
    # TRY rules - exception handling patterns
    "TRY002",   # Create custom exception
    "TRY003",   # Long exception messages
    "TRY004",   # Prefer TypeError for type checks
    "TRY201",   # Use raise without from
    "TRY300",   # Consider moving to else block
    "TRY400",   # Use logging.exception
    "TRY401",   # Redundant exception object in logging.exception
    "TRY301",   # Abstract raise to inner function
    # B rules - bugbear
    "B007",     # Loop control variable not used
    "B008",     # Function call in defaults
    "B011",     # Assert false
    "B027",     # Empty method in abstract class
    "B904",     # Raise from err
    # E rules - pycodestyle errors
    "E402",     # Module level import not at top
    "E501",     # Line too long
    "E722",     # Bare except
    # W rules - pycodestyle warnings
    "W291",     # Trailing whitespace
    "W293",     # Blank line contains whitespace
    # ANN rules - annotations
    "ANN",      # Missing type annotations
    # C rules - mccabe complexity / comprehensions
    "C401",     # Unnecessary generator
    "C414",     # Unnecessary list call
    "C901",     # Function too complex
    # DTZ rules - datetime
    "DTZ",      # Datetime timezone issues
    # RUF rules - ruff-specific
    "RUF005",   # Consider concatenation
    "RUF006",   # Asyncio dangling task
    "RUF009",   # Function call in dataclass default
    "RUF012",   # Mutable class attribute
    "RUF013",   # PEP 484 implicit Optional
    "RUF015",   # Prefer next() over [0]
    "RUF100",   # Unused noqa directives
    # F rules - pyflakes
    "F401",     # Imported but unused
    "F821",     # Undefined name
    "F841",     # Local variable assigned but never used
    # I rules - isort
    "I001",     # Import block unsorted
    # S rules - security
    "S101",     # Use of assert
    "S104",     # Binding to all interfaces
    "S106",     # Hardcoded password
    "S107",     # Possible hardcoded password
    "S108",     # Probable insecure temp file
    "S110",     # Try-except-pass
    "S112",     # Try-except-continue
    "S311",     # Pseudo-random generator
    "S701",     # Jinja2 autoescape
    # SIM rules - simplify
    "SIM102",   # Nested if statements
    "SIM103",   # Return condition directly
    "SIM105",   # Use contextlib.suppress
    "SIM108",   # Use ternary operator
    "SIM115",   # Use context manager for files
    "SIM117",   # Combine with statements
    "SIM118",   # Use key in dict
    # PIE rules
    "PIE810",   # Single startswith/endswith argument
    # ERA rules
    "ERA001",   # Commented out code
    # PT rules - pytest
    "PT009",    # Use pytest.raises
    "PT011",    # pytest.raises too broad
    "PT015",    # Assert always fails
    "PT027",    # Use pytest.raises instead of assertRaises
    # UP rules - pyupgrade
    "UP022",    # Replace stdout/stderr capture
    "UP038",    # Use X | Y in isinstance
    # LOG rules
    "LOG015",   # Root logger call
]

[tool.ruff.lint.per-file-ignores]
# Tests can use asserts, dynamic types, subprocess calls, hardcoded test secrets, and complex helper functions
"tests/**.py" = ["S101", "S105", "S603", "S607", "S608", "ANN201", "ANN401", "TRY300", "C901", "S106", "PT006"]
# OPI code has pre-existing issues to be fixed separately
"opi/**.py" = ["S105", "S106", "S603", "S607", "S608", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnusedVariable = false
reportCallIssue = false
reportPossiblyUnboundVariable = false
reportAttributeAccessIssue = false
reportOptionalMemberAccess = false
reportOptionalSubscript = false
reportOptionalIterable = false
reportArgumentType = false
reportUndefinedVariable = false
reportUnboundVariable = false
reportReturnType = false
reportAssignmentType = false
reportIndexIssue = false
reportGeneralTypeIssues = false
reportOperatorIssue = false
reportOptionalOperand = false
exclude = [
    "opi/migrations",
    ".venv",
    "tests",
    "scripts",
]

[tool.coverage.run]
branch = true
command_line = "-m pytest"
relative_files = true # needed for sonarcloud code coverage
omit = [
    "tests/*"
]
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
fail_under = 90

[tool.coverage.html]
directory = "htmlcov"
title = "opi"


[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = "--strict-markers -v -q --tracing on"
filterwarnings = [
    "ignore::UserWarning"
]
log_cli = true
log_cli_level = "INFO"
faulthandler_timeout = 60
markers = [
   "slow: marks tests as slow",
   "enable_auth: marks tests that require authentication"
]
pythonpath = "."


[tool.liccheck]
level = "PARANOID"
dependencies = true
authorized_licenses = [
    "Apache Software",
    "Artistic",
    "BSD",
    "BSD",
    "BSD-3-Clause",
    "GNU General Public License v2 or later (GPLv2+)",
    "GNU General Public License v3 or later (GPLv3+)",
    "GNU General Public License (GPL)",
    "GNU Library or Lesser General Public License (LGPL)",
    "MIT",
    "The Unlicense (Unlicense)",
    "ISC License (ISCL)",
    "Mozilla Public License 2.0 (MPL 2.0)",
    "Python Software Foundation",
    "Public Domain"
]
