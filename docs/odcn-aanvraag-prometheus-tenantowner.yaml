# Hoi, Prometheus draait bij ons nu op het serviceaccount namespace-manager, en dat is
# TenantOwner met admin en capsule-namespace-deleter op elke projectnamespace. Prometheus
# heeft zelf geen authenticatie, dus wie bij die pod komt komt bij dat token. Het leest
# alleen: zijn kubernetes_sd_configs lijsten pods via capsule-proxy, en dat werkt met
# "view". Daarom dit verzoek: twee TenantOwners voor een eigen serviceaccount
# "prometheus", een in rig-prd-operations en een in rig-staging-operations.
#
# "view" volstaat omdat capsule-proxy de lijsten scopet op de tenant-eigenaar van de
# aanroepende SA (zie features/capsule-proxy-prometheus-discovery.md); wat Prometheus in
# zijn eigen namespace nodig heeft staat al in een namespaced Role. Verwijderen hoeft het
# niet, dus capsule-namespace-deleter laten we er bewust af.
#
# Zodra deze er zijn halen we de overlay-patch weg die Prometheus op namespace-manager
# houdt, en draagt namespace-manager geen Prometheus meer. De TenantOwners zelf kunnen we
# niet lezen, dus neem gerust jullie eigen vorm over. Alvast bedankt!
apiVersion: capsule.clastix.io/v1beta2
kind: TenantOwner
metadata:
  name: rig-prd-prometheus
  labels:
    customer: rig
    tenant: prd
spec:
  kind: ServiceAccount
  name: system:serviceaccount:rig-prd-operations:prometheus
  clusterRoles:
    - view
---
apiVersion: capsule.clastix.io/v1beta2
kind: TenantOwner
metadata:
  name: rig-staging-prometheus
  labels:
    customer: rig
    tenant: staging
spec:
  kind: ServiceAccount
  name: system:serviceaccount:rig-staging-operations:prometheus
  clusterRoles:
    - view
